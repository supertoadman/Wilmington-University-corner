night hours. Any sanction must come from the FCC under federal law, not from the county, and \u003ci>Pacifica\u003c/i> did not approve criminal prosecution. Contrast Part B: the same words on a shirt are protected, because the medium and context differ.","\u003cstrong>Conclusion.\u003c/strong> The FCC may act against WPCR under \u003ci>Pacifica\u003c/i>'s narrow broadcast rationale."]},{"h":"3. Part D: “Bloom”","p":["\u003cstrong>Rule.\u003c/strong> Obscenity is unprotected. Under \u003ci>Miller v. California\u003c/i> (1973), still good law, material is obscene only if all three prongs are met: (a) the average person, applying contemporary community standards, would find that the work, \u003ci>taken as a whole\u003c/i>, appeals to the prurient interest; (b) it depicts or describes, in a patently offensive way, sexual conduct specifically defined by state law; and (c) the work, taken as a whole, lacks serious literary, artistic, political, or scientific value. “Prurient interest” means a shameful or morbid interest in nudity, sex, or excretion, not a normal interest in sex (\u003ci>Brockett v. Spokane Arcades\u003c/i>, 1985). Prong (c) matters most: it protects works that, as a whole, have value, even if isolated scenes might seem obscene. Obscenity covers only depictions of sexual conduct.","\u003cstrong>Application: Part D as written.\u003c/strong> Part D asks only whether the average resident would find a depiction of sexual conduct “offensive.” It omits the prurient-interest prong, the work-as-a-whole requirement, the requirement that the sexual conduct be specifically defined by state law, and the serious-value prong. Because it reaches protected speech that \u003ci>Miller\u003c/i> doesn't, a conviction under it is unconstitutional.","\u003cstrong>Application: under a proper Miller statute.\u003c/strong> “Bloom” would still not be obscene. Taken as a whole, a 280-page coming-of-age novel with three explicit pages doesn't appeal to a shameful or morbid interest. Even if the scenes were patently offensive, a national literary prize is strong evidence of serious literary value. As \u003ci>Free Speech Coalition\u003c/i> later put it, the artistic merit of a work doesn't depend on a single explicit scene. The character is an adult, so the child pornography rules don't apply.","\u003cstrong>Conclusion.\u003c/strong> No conviction under Part D, and none under a valid \u003ci>Miller\u003c/i> statute either."]},{"h":"4. Parts E and F","p":["\u003cstrong>Part E: zoning.\u003c/strong> Under \u003ci>City of Renton v. Playtime Theatres\u003c/i> (1986), zoning laws that confine adult businesses get intermediate scrutiny even though they are partly content-based, because they target secondary effects such as crime and lower property values, not the message. Renton's ordinance barred adult theaters within 1,000 feet of residences, churches, and parks, and the Court noted that more than 5% of the city remained available. Part E is nearly identical. It relies on studies of secondary effects and leaves about 6% of the land open. The Court has refused to extend the secondary-effects doctrine beyond adult businesses, but this is its core. \u003cstrong>Part E is likely valid.\u003c/strong>","\u003cstrong>Part F: “degradation.”\u003c/strong> In \u003ci>Hudnut\u003c/i>, Indianapolis banned sexually explicit material depicting women as subordinate. The ordinance didn't track \u003ci>Miller\u003c/i>: it had no prurient-interest, offensiveness, community-standards, or work-as-a-whole inquiry, and value was irrelevant. Its drafters saw those omissions as virtues; Catharine MacKinnon asked why it should matter that a work has other value if a woman is subjected. The Seventh Circuit saw viewpoint discrimination. Part F likewise bans explicit material based on the attitude it conveys, “regardless of value.” It isn't an obscenity law, and it is viewpoint-based. \u003cstrong>Part F is invalid.\u003c/strong>"]}],"cases":[{"n":"Bolger v. Youngs Drug Products Corp.","c":"463 U.S. 60 (1983)","r":"The government can't shield adults from non-obscene content or reduce them to what is fit for children; mailbox-to-trash-can is an acceptable burden.","u":"Part A."},{"n":"Cohen v. California","c":"403 U.S. 15 (1971)","r":"Profanity is protected; unwilling viewers can avert their eyes.","u":"Part B; contrast with Part C."},{"n":"FCC v. Pacifica Foundation","c":"438 U.S. 726 (1978)","r":"Indecent broadcasts may be channeled under a narrow nuisance rationale; broadcasting is uniquely pervasive and accessible to children.","u":"Part C."},{"n":"Miller v. California","c":"413 U.S. 15 (1973)","r":"The three-part obscenity test.","u":"Part D and Part F."},{"n":"Brockett v. Spokane Arcades","c":"472 U.S. 491 (1985)","r":"Prurient interest means a shameful or morbid interest, not a normal interest in sex.","u":"“Bloom.”"},{"n":"City of Renton v. Playtime Theatres","c":"475 U.S. 41 (1986)","r":"Adult business zoning aimed at secondary effects gets intermediate scrutiny.","u":"Part E."},{"n":"American Booksellers Ass'n v. Hudnut","c":"771 F.2d 323 (7th Cir. 1985)","r":"A ban on “subordinating” explicit material is viewpoint discrimination, not obscenity regulation.","u":"Part F."}],"concepts":[{"t":"Protecting adults versus protecting kids","d":"Adults: almost never protectable from content (except obscenity). Kids: sometimes, but not at the cost of adult access (Bolger). Secondary effects (Renton) and exploitation of real children (Ferber) are indirect harms with their own rules."},{"t":"The Miller test","d":"All three prongs: prurient interest (work as a whole, community standards), patent offensiveness (specifically defined sexual conduct), and no serious value (work as a whole). Serious value usually decides the case."},{"t":"Pacifica's narrow exception","d":"Indecent but not obscene speech can be channeled on broadcast radio and TV because of their pervasiveness and accessibility to children. Context, time of day, and medium are decisive, and the rule doesn't extend to the mail, clothing, or (later cases) the internet."},{"t":"Secondary effects","d":"Zoning that targets crime and property values around adult businesses gets intermediate scrutiny, as long as reasonable locations remain. The doctrine is confined to adult businesses."}],"rubric":[[1,"Framework: who is protected, and from what harm."],[2,"Part A under Bolger; Part B under Cohen."],[2,"Part C: Pacifica's rationale, its narrowness, and the contrast with Cohen."],[2,"Part D: Miller's prongs; why Part D is defective; Bloom has serious value; Brockett."],[2,"Part E: Renton secondary effects and intermediate scrutiny."],[1,"Part F: Hudnut viewpoint discrimination; not an obscenity law."]]},{"id":"14","topic":"kids","title":"The Screen Safety Act","teaser":"Age verification for adult websites, a broader online “harmful to minors” crime, and a ban on selling violent games and comics to minors.","facts":["The State of Westmark enacted the Screen Safety Act.","Title I requires any commercial website on which more than one-third of the content is sexual material harmful to minors to verify that each visitor is at least 18, using a government ID or commercial transaction data, before granting access. “Harmful to minors” is defined using the \u003ci>Miller\u003c/i> test as adjusted for minors. Sites that comply face no other restriction.","Title II makes it a crime for any person to post, anywhere online, material “harmful to minors” that a minor can access, with an affirmative defense if the poster verified the age of every viewer. The state concedes that most small sites, blogs, and forums can't afford age verification and would have to remove the material. Opponents point out that device-level filters, which parents can enable, block such material at the receiving end.","Title III bans selling or renting to anyone under 18 any video game or comic book “in which the player or reader kills, maims, or sexually assaults a human image in a manner that a reasonable person would find appeals to a deviant or morbid interest of minors.” The legislature cited studies finding correlations between violent media and aggression. The game industry already uses an age-rating system enforced by most retailers."],"call":["What standard of review applies to Title I, and does it survive?","Is Title II constitutional?","Is Title III constitutional?"],"answer":[{"h":"Framework","p":["Ask who the government is protecting and from what. All three titles aim to protect children from content. The government has two traditional powers here: it may ban speech that is obscene to the public at large (\u003ci>Miller\u003c/i>), and it may prevent children from accessing speech that is obscene \u003ci>as to children\u003c/i>. \u003ci>Ginsberg v. New York\u003c/i> (1968) upheld a ban on selling minors sexual material that would be obscene from a child's perspective. But the government may not block adults' access (\u003ci>Bolger\u003c/i>), and minors have their own First Amendment rights (\u003ci>Brown\u003c/i>)."]},{"h":"1. Title I: age verification","p":["\u003cstrong>Rule.\u003c/strong> \u003ci>Free Speech Coalition v. Paxton\u003c/i> (2025, 6-3, Thomas, J.) upheld Texas H.B. 1181, which required commercial websites publishing sexually explicit content to verify visitors' ages. The Court applied intermediate scrutiny because the law regulates speech that is obscene as to minors, which the state may keep from them, and any burden on adults is only incidental (citing \u003ci>Boy Scouts v. Dale\u003c/i>). Rational basis was rejected because adults have a real, if incidentally burdened, right. Under intermediate scrutiny, a law survives if it advances important governmental interests unrelated to the suppression of free speech and doesn't burden substantially more speech than necessary. The standard is “deferential but not toothless.” The interest in shielding children from sexual content is “important, even compelling.” The law adapts traditional in-person age checks (ID or transaction data, as used for gambling, alcohol, tobacco, and car rentals) to the digital age. Under intermediate scrutiny, the availability of less restrictive alternatives such as filters doesn't defeat a legitimate legislative choice.","\u003cstrong>Application.\u003c/strong> Title I is H.B. 1181. It reaches only commercial sites where a third of the content is sexually explicit and harmful to minors, defined by the \u003ci>Miller\u003c/i>-for-minors test. It uses the same verification methods, and it leaves adults free to access everything after verifying their age. Privacy concerns are addressed by the incentives of sites and verifiers, and stigma has never exempted the industry from regulation.","\u003cstrong>Conclusion.\u003c/strong> Intermediate scrutiny applies, and Title I survives."]},{"h":"2. Title II: the general online crime","p":["\u003cstrong>Rule.\u003c/strong> \u003ci>Ashcroft v. ACLU\u003c/i> (2004, “Ashcroft II”) held the Child Online Protection Act likely unconstitutional. COPA criminalized posting material harmful to minors online for commercial purposes, with an age-verification defense. Applying strict scrutiny, the Court held that a content-based law that suppresses a large amount of speech adults have a right to receive is invalid if less restrictive alternatives would be at least as effective, and the government must prove they aren't. Filters restrict at the receiving end rather than the source; adults needn't identify themselves; no speech is criminalized; filters block foreign sites; and minors can't evade them with credit cards. Earlier, \u003ci>Reno v. ACLU\u003c/i> (1997) applied strict scrutiny to the Communications Decency Act because it operated as a ban on adult speech, with an age-verification defense that was illusory given the technology.","\u003cstrong>Application.\u003c/strong> \u003ci>Paxton\u003c/i> distinguished those cases as involving effective bans on adult access, and Title II falls on that side of the line. It applies to \u003ci>anyone\u003c/i> posting \u003ci>anywhere\u003c/i> online, not just commercial sites devoted to sexual content. It is a criminal ban, and the state concedes that most small sites can't afford verification and would remove the material. Adults would lose access to a large amount of protected speech, so the burden on adults isn't incidental. Strict scrutiny therefore applies. Filters are a less restrictive alternative that parents can enable at the receiving end, and the state has offered no evidence that Title II would be more effective.","\u003cstrong>Paxton and Ashcroft II.\u003c/strong> Did \u003ci>Paxton\u003c/i> effectively overrule \u003ci>Ashcroft II\u003c/i>? The filtering alternative that won in 2004 lost in 2025, because the standard of review changed. The Court framed the earlier cases as involving effective bans on adult access, and it noted that the internet has changed dramatically since \u003ci>Reno\u003c/i> and \u003ci>Ashcroft II\u003c/i> (smartphones, streaming). On that reading, the cases coexist: \u003ci>Paxton\u003c/i> governs narrow, commercial age-verification rules, and \u003ci>Ashcroft II\u003c/i> governs broad laws that function as bans. Title II is the latter.","\u003cstrong>Conclusion.\u003c/strong> Title II fails strict scrutiny and is unconstitutional."]},{"h":"3. Title III: violent games and comics","p":["\u003cstrong>Rule.\u003c/strong> In \u003ci>Brown v. Entertainment Merchants Association\u003c/i> (2011, 7-2, Scalia, J.), the Court struck down California's ban on selling or renting violent video games to minors. Video games are speech: they communicate ideas through characters, dialogue, plot, music, and interaction. Following \u003ci>United States v. Stevens\u003c/i>, legislatures can't add new unprotected categories by balancing value against social costs, a “startling and dangerous” proposition. Obscenity covers only depictions of sexual conduct, not violence. \u003ci>Ginsberg\u003c/i> adjusted an existing category for minors; California sought a wholly new one. Minors are entitled to a significant measure of First Amendment protection, and there is no “free-floating power to restrict the ideas to which children may be exposed.” There is no tradition of shielding children from violence: Grimm's fairy tales, the Odyssey, Dante's Inferno, and Lord of the Flies are full of gore. Interactivity is new only in degree. Strict scrutiny failed because the research showed correlation, not causation, and minuscule effects; the law was wildly underinclusive (Bugs Bunny cartoons and E-rated games had similar effects); and the industry's rating system already helped parents, so filling a “modest gap” wasn't compelling.","\u003cstrong>Application.\u003c/strong> Title III borrows \u003ci>Miller\u003c/i>'s language (“deviant or morbid interest of minors”), but applying the obscenity test to violence is what \u003ci>Brown\u003c/i> rejected; obscenity is limited to sexual conduct. The “sexually assaults” clause doesn't change the analysis, because the law targets violent depictions, not depictions of sexual conduct. Extending the ban to comic books makes it worse, given the history of panics over comics. Westmark's correlation studies are the evidence \u003ci>Brown\u003c/i> found inadequate. The law is underinclusive, since it leaves out violent films and television, and the existing rating system is a less restrictive alternative.","\u003cstrong>Conclusion.\u003c/strong> Title III is unconstitutional."]}],"cases":[{"n":"Free Speech Coalition, Inc. v. Paxton","c":"145 S. Ct. 2291 (2025)","r":"Age verification for content obscene as to minors gets intermediate scrutiny because the burden on adults is incidental; Texas's law survives.","u":"Title I; distinguishing Title II."},{"n":"Ashcroft v. ACLU (Ashcroft II)","c":"542 U.S. 656 (2004)","r":"Strict scrutiny; filters are a less restrictive alternative; the government bears the burden.","u":"Title II."},{"n":"Reno v. ACLU","c":"521 U.S. 844 (1997)","r":"The CDA operated as a ban on adult speech; strict scrutiny.","u":"Title II's functional ban."},{"n":"Ginsberg v. New York","c":"390 U.S. 629 (1968)","r":"States may bar selling minors material obscene as to them.","u":"The power behind Title I; distinguished in Brown."},{"n":"Brown v. Entertainment Merchants Association","c":"564 U.S. 786 (2011)","r":"No new category for violence, even for minors; strict scrutiny fails.","u":"Title III."},{"n":"United States v. Stevens","c":"559 U.S. 460 (2010)","r":"No new categories by balancing.","u":"Why violence can't become unprotected for minors."}],"concepts":[{"t":"Obscene as to minors","d":"The Miller test adjusted for a child's perspective (Ginsberg). States may keep such material from minors, but only material about sexual conduct."},{"t":"Incidental burden versus ban","d":"Paxton applies intermediate scrutiny when adults can still get the speech after a modest check. When a law effectively bans adult access (Reno, Ashcroft II), strict scrutiny applies."},{"t":"Less restrictive alternatives","d":"Under strict scrutiny, the government must prove alternatives such as filters would be less effective. Under intermediate scrutiny, their existence doesn't defeat a legitimate legislative choice."},{"t":"Minors' First Amendment rights","d":"Minors have significant First Amendment protection. The state may protect them from sexual material that is obscene as to them, but has no general power to control the ideas they encounter (Brown)."}],"rubric":[[1,"Framework: Ginsberg's power; protecting kids without blocking adults; minors' rights."],[3,"Title I: Paxton rule, why intermediate scrutiny, test stated and applied."],[3,"Title II: Ashcroft II and Reno; functional ban; filters; the government's burden; the Paxton–Ashcroft II question."],[3,"Title III: Brown (speech, no new category, Ginsberg distinguished, evidence, underinclusiveness, ratings)."]]},{"id":"15","topic":"kids","title":"Real Children, Virtual Images","teaser":"A child-protection statute reaches real abuse images, AI-generated images, a sting in which the images were fake, and two teenagers who exchanged photos.","facts":["The State of Northland revised its child-protection laws. Section 1 bans producing or distributing sexually explicit images of real children under 18, whether or not the images are obscene. Section 2 bans any sexually explicit image that “appears to depict a minor,” including computer-generated images and images of adults made to look younger, with no exception for serious value. Section 3 bans offering or requesting material “that the person believes, or intends another to believe,” is a sexually explicit image of a real minor.","Prosecutions followed. (A) Ken distributed images of real children; he argues that some images aren't obscene under \u003ci>Miller\u003c/i>. (B) An independent film studio released “Northbound,” an acclaimed drama about the aftermath of abuse. In one scene, a 22-year-old actress plays a 16-year-old, and the scene is sexually explicit. The studio is charged under Section 2. (C) Lee used an AI tool to create explicit images of fictional children and sold them online. He is charged under Section 2. (D) Wes posted online, “Selling real stuff with actual kids, DM me,” and sold files to an undercover officer. The files turned out to be AI-generated. Wes is charged under Section 3.","(E) Finally, Mia, 16, sent an explicit photo of herself to her 16-year-old boyfriend, Jay. After they broke up, Jay forwarded it to a group chat. Both are charged under Section 1."],"call":["Analyze the charges against Ken, the studio, Lee, and Wes.","Should Mia and Jay be treated as child pornographers? Discuss how Ferber's rationale applies to each."],"answer":[{"h":"Framework","p":["Ask who the government is protecting and what harm it targets. Here the harm is indirect: the sexual abuse of \u003ci>real children\u003c/i> used to produce the material. That harm, not the offensiveness of the content, is what justifies the child pornography category. It is one of the historically unprotected categories, and it is separate from obscenity."]},{"h":"1. Ken: real children","p":["\u003cstrong>Rule.\u003c/strong> \u003ci>New York v. Ferber\u003c/i> (1982, unanimous on the bottom line, White, J.) held that child pornography made with real children is unprotected even if it isn't obscene under \u003ci>Miller\u003c/i>. Distribution is intrinsically related to the sexual abuse of the children used to produce it. The materials are a permanent record whose circulation worsens the harm, and the distribution network must be closed to control production. Because production is clandestine but marketing requires a visible apparatus, drying up the market may be the only practical enforcement method. Preventing the sexual exploitation of children is an objective of “surpassing importance,” and the material's value is “exceedingly modest, if not de minimis.” The casebook notes that the rationale resembles secondary effects: the harm is the abuse of real children in production, not the message.","\u003cstrong>Application.\u003c/strong> Section 1 is a \u003ci>Ferber\u003c/i> statute. Ken's argument that some images aren't obscene is irrelevant, because \u003ci>Ferber\u003c/i> doesn't require obscenity.","\u003cstrong>Conclusion.\u003c/strong> Ken may be convicted."]},{"h":"2. The studio and Lee: Section 2","p":["\u003cstrong>Rule.\u003c/strong> \u003ci>Ashcroft v. Free Speech Coalition\u003c/i> (2002, 6-3, Kennedy, J.) struck down the Child Pornography Prevention Act's ban on images that “appear to” depict minors. \u003ci>Ferber\u003c/i> doesn't extend to sexually explicit images made without real children, whether computer-generated or of adults who look like minors. Its rationale depended on protecting real children exploited in production. The CPPA banned speech regardless of serious value, though teen sexuality and abuse are enduring themes in art: Juliet is 13 in \u003ci>Romeo and Juliet\u003c/i>. “Appear to be under 18” is higher than many states' ages of marriage and consent. One explicit scene would trigger punishment without any inquiry into value, but “the artistic merit of a work does not depend on the presence of a single explicit scene.” And \u003ci>Ferber\u003c/i> itself relied on virtual images as a permissible alternative, which the CPPA then criminalized.","\u003cstrong>Application: the studio.\u003c/strong> “Northbound” uses an adult actress and has evident serious value, as an acclaimed drama about abuse. Section 2 is the CPPA's “appears to depict” ban, without even a value exception. Unless the scene is obscene under \u003ci>Miller\u003c/i>, which an acclaimed film taken as a whole is not, the studio can't be convicted.","\u003cstrong>Application: Lee.\u003c/strong> Lee's AI images involve no real child in production, so \u003ci>Ferber\u003c/i>'s rationale doesn't reach them, and Section 2 is facially invalid under \u003ci>Free Speech Coalition\u003c/i>. Northland's options are to prosecute Lee for obscenity if the images meet all three \u003ci>Miller\u003c/i> prongs (realistic for material made and sold purely for sexual gratification), or to use Section 3 if Lee represented the images as real.","\u003cstrong>Conclusion.\u003c/strong> Section 2 is unconstitutional; neither the studio nor Lee may be convicted under it."]},{"h":"3. Wes: Section 3","p":["\u003cstrong>Rule.\u003c/strong> \u003ci>United States v. Williams\u003c/i> (2008) upheld a federal law punishing offers and requests concerning material the defendant \u003ci>believes\u003c/i>, or intends another to believe, is child pornography. Offers and requests to provide contraband are speech integral to crime and categorically unprotected (\u003ci>Giboney\u003c/i>). The Court held such offers may be punished even if the belief is mistaken and the material doesn't involve real children, stressing that technology makes it nearly impossible to prove which images involve real children.","\u003cstrong>Application.\u003c/strong> Wes offered material he represented as involving “actual kids.” That is an offer to provide contraband, made with intent that the buyer believe the material was real. Under \u003ci>Williams\u003c/i>, it doesn't matter that the files were AI-generated. The crime is the offer, not possession of the files. This doesn't contradict \u003ci>Free Speech Coalition\u003c/i>: Wes is punished for offering to deal in real child pornography, not for creating virtual images.","\u003cstrong>Conclusion.\u003c/strong> Wes may be convicted under Section 3."]},{"h":"4. Mia and Jay","p":["\u003cstrong>Issue.\u003c/strong> Whether consensual teen sexting should be treated as unprotected child pornography. Such images often fit statutory definitions. Some states reduce the penalties for teens, many don't, federal law draws no distinction, and prosecutors have discretion.","\u003cstrong>Mia.\u003c/strong> \u003ci>Ferber\u003c/i>'s main rationale, drying up a market that exploits children, fits poorly. Mia produced an image of herself and shared it consensually with a peer. No adult exploited her, and no commercial market was involved. Punishing her as a child pornographer would treat the person the law is meant to protect as the offender. If her conduct can be regulated at all, it is through narrower, non-criminal measures.","\u003cstrong>Jay.\u003c/strong> Forwarding the image to a group chat is different. \u003ci>Ferber\u003c/i>'s other rationale, that the material is a permanent record and its circulation worsens the injury to the child, fits nonconsensual redistribution well. Mia is harmed every time the image spreads. Jay's age matters to the right response. A 16-year-old peer may call for a juvenile or reduced-penalty approach, while an adult partner, or anyone forwarding for gain, looks like the exploitation \u003ci>Ferber\u003c/i> targets.","\u003cstrong>Conclusion.\u003c/strong> A sensible rule turns on exploitation. Consensual exchange between peers falls outside \u003ci>Ferber\u003c/i>'s rationale, while an adult partner or nonconsensual redistribution falls within it. Section 1 can constitutionally be applied to Jay's forwarding, and prosecuting Mia, while likely permitted by the statute's text, is hard to justify under \u003ci>Ferber\u003c/i>'s reasoning."]}],"cases":[{"n":"New York v. Ferber","c":"458 U.S. 747 (1982)","r":"Child pornography using real children is unprotected regardless of obscenity; drying up distribution; a permanent record.","u":"Ken; the sexting analysis."},{"n":"Ashcroft v. Free Speech Coalition","c":"535 U.S. 234 (2002)","r":"Bans on virtual images and adult look-alikes are invalid; Ferber depends on real children; no value inquiry.","u":"The studio and Lee."},{"n":"United States v. Williams","c":"553 U.S. 285 (2008)","r":"Offers and requests based on belief or intended belief that the material is real child pornography are punishable even if it isn't.","u":"Wes."},{"n":"Miller v. California","c":"413 U.S. 15 (1973)","r":"The three-part obscenity test.","u":"The fallback for virtual images; not required for Ferber."},{"n":"Giboney v. Empire Storage & Ice Co.","c":"336 U.S. 490 (1949)","r":"Speech integral to crime is unprotected.","u":"The category for Wes's offer."}],"concepts":[{"t":"Why child pornography is unprotected","d":"Not because of its message but because of the abuse of real children in production: the market must be dried up, and circulation of the permanent record repeats the injury. That indirect-harm rationale is why Ferber needs real children."},{"t":"Ferber versus Free Speech Coalition","d":"Real children: unprotected regardless of value or obscenity. Virtual images and adult look-alikes: protected unless obscene under Miller."},{"t":"Offers and requests (Williams)","d":"Offering or requesting material represented or believed to be real child pornography is speech integral to crime, punishable even if the material turns out to be virtual."},{"t":"Teen sexting","d":"Apply Ferber's two rationales separately: the market-and-exploitation rationale fits poorly for consensual peer exchange, while the circulation rationale fits nonconsensual forwarding well."}],"rubric":[[2,"Ken: Ferber's rule and rationales; obscenity not required."],[3,"Studio and Lee: Free Speech Coalition (real children, serious value, adult actors, virtual images); Miller as the fallback."],[2,"Wes: Williams belief-based offers; reconciled with Free Speech Coalition."],[3,"Sexting: applies both Ferber rationales; distinguishes Mia from Jay; considers age and exploitation; reasoned conclusion."]]}],"caseIndex":[{"name":"Whitney v. California (Brandeis, J., concurring)","essays":["1","7","9"]},{"name":"West Virginia State Board of Education v. Barnette","essays":["1","2","6"]},{"name":"Kennedy v. Bremerton School District","essays":["1","2","3","5"]},{"name":"Mahmoud v. Taylor","essays":["1","2"]},{"name":"Employment Division v. Smith","essays":["1","2","3","4"]},{"name":"Church of the Lukumi Babalu Aye v. City of Hialeah","essays":["3"]},{"name":"Masterpiece Cakeshop v. Colorado Civil Rights Commission","essays":["3","4"]},{"name":"Fulton v. City of Philadelphia","essays":["3","4"]},{"name":"Tandon v. Newsom","essays":["3"]},{"name":"Carson v. Makin","essays":["4","5"]},{"name":"Wooley v. Maynard","essays":["6"]},{"name":"Collin v. Smith","essays":["6"]},{"name":"American Booksellers Ass'n v. Hudnut","essays":["6","13"]},{"name":"United States v. Stevens","essays":["7","8","12","14"]},{"name":"United States v. Alvarez","essays":["7"]},{"name":"United States v. Hansen","essays":["7","8"]},{"name":"Terminiello v. Chicago","essays":["6","9"]},{"name":"Brandenburg v. Ohio","essays":["6","9","11","12"]},{"name":"R.A.V. v. City of St. Paul","essays":["9"]},{"name":"Near v. Minnesota ex rel. Olson","essays":["10"]},{"name":"New York Times Co. v. United States (Pentagon Papers)","essays":["10"]},{"name":"Counterman v. Colorado","essays":["11","12"]},{"name":"United States v. Williams","essays":["8","11","12","15"]},{"name":"Rice v. Paladin Enterprises","essays":["12"]},{"name":"Garcia v. Character Technologies","essays":["12"]},{"name":"Bolger v. Youngs Drug Products Corp.","essays":["13"]},{"name":"Cohen v. California","essays":["9","13"]},{"name":"FCC v. Pacifica Foundation","essays":["13"]},{"name":"City of Renton v. Playtime Theatres","essays":["13"]},{"name":"New York v. Ferber","essays":["7","15"]},{"name":"Ashcroft v. Free Speech Coalition","essays":["15"]},{"name":"Ashcroft v. ACLU (Ashcroft II)","essays":["14"]},{"name":"Free Speech Coalition, Inc. v. Paxton","essays":["14"]},{"name":"Brown v. Entertainment Merchants Association","essays":["14"]}],"coverage":[{"area":"Ch. 1 · Coercion & compelled belief","items":[{"key":"scope-clauses","label":"The five protections; the press has the same rights as everyone","essays":["10"]},{"key":"incorp","label":"Incorporation through the Fourteenth Amendment (Cantwell)","essays":["1"]},{"key":"state-action","label":"State action: private actors aren't bound","essays":["1"]},{"key":"not-absolute","label":"“Make no law” isn't absolute: fraud; religious practice vs. belief","essays":["3"]},{"key":"whitney","label":"Brandeis in Whitney: counterspeech; liberty as end and means","essays":["1","7","9"]},{"key":"barnette","label":"Barnette: no compelled affirmation; Gobitis overruled","essays":["1","2"]},{"key":"barn-speech","label":"Barnette rests on speech, not religion: secular objectors are protected","essays":["1"]},{"key":"barn-teach","label":"Teaching vs. compelling","essays":["1"]},{"key":"barn-symbol","label":"Symbolic conduct as “a form of utterance”","essays":["1"]},{"key":"barn-grave","label":"“Grave and immediate danger,” not rational basis; rights depend on no elections","essays":["1"]},{"key":"kennedy-fe","label":"Kennedy: disciplining prayer because it is religious triggers strict scrutiny","essays":["1"]},{"key":"kennedy-ec","label":"Kennedy: history and tradition replace Lemon and endorsement; the clauses are complementary","essays":["1","5"]},{"key":"kennedy-coerce","label":"Kennedy: coercion takes more than visible religious exercise","essays":["1"]},{"key":"mahmoud","label":"Mahmoud: a Yoder-type burden triggers strict scrutiny; the fact-intensive factors","essays":["2"]},{"key":"mahmoud-ss","label":"Mahmoud: other opt-outs, self-made burdens; “go elsewhere” rejected","essays":["2"]},{"key":"mahmoud-dis","label":"Mahmoud's dissent, and applying the rule neutrally to both sides","essays":["2"]},{"key":"coerce-syn","label":"The coercion spectrum: Barnette, Kennedy, Mahmoud","essays":["1","2"]},{"key":"anthem","label":"Stretch: standing for the anthem at graduation","essays":["1"]}]},{"area":"Ch. 2 · Free Exercise","items":[{"key":"sincere","label":"A sincere religious practice; beliefs needn't be logical or consistent","essays":["3"]},{"key":"smith","label":"Smith: no exemptions from neutral, generally applicable laws","essays":["2","3","4"]},{"key":"smith-belief","label":"What government may never do: regulate belief, impose disabilities based on religious status","essays":["3"]},{"key":"smith-prec","label":"Smith's precedents: Reynolds, Prince, Braunfeld, Gillette","essays":["3"]},{"key":"hybrid","label":"Hybrid rights: free exercise plus speech, or parents' right to direct education","essays":["2","3"]},{"key":"lukumi","label":"Lukumi: gerrymandered exemptions and underinclusiveness","essays":["3"]},{"key":"masterpiece","label":"Masterpiece Cakeshop: hostility in application; disparate treatment; a narrow holding","essays":["3","4"]},{"key":"fulton","label":"Fulton: discretionary exemption systems, even unused","essays":["3","4"]},{"key":"fulton-ss","label":"Fulton: strict scrutiny as applied to this claimant","essays":["4"]},{"key":"tandon","label":"Tandon: any comparable secular activity treated better; comparability by risk","essays":["3"]},{"key":"motive","label":"An ad {"key":"secrecy","label":"Secrecy agreements (Marchetti; Snepp)","essays":["10"]},{"key":"emerson","label":"Why prior restraints are worse (Emerson)","essays":["10"]}]},{"area":"Ch. 5 · Threats & speech integral to crime","items":[{"key":"mens-rea","label":"Mens rea as speech protection","essays":["8","11","12"]},{"key":"counterman","label":"Counterman: an objective threat plus recklessness","essays":["11"]},{"key":"true-jest","label":"“True” threats exclude jest and hyperbole; context matters","essays":["11"]},{"key":"cm-opinions","label":"Counterman's concurrence (intent) and dissent (objective test)","essays":["11"]},{"key":"integral","label":"Speech integral to crime (Giboney and its progeny)","essays":["11","12","15"]},{"key":"williams","label":"Williams: offers and requests; “promotes” narrowed","essays":["11","15"]},{"key":"williams-belief","label":"Williams: belief-based pandering and virtual images","essays":["15"]},{"key":"paladin","label":"Rice v. Paladin: intent to assist, and use as intended","essays":["12"]},{"key":"bomb","label":"Stretch: a bomb manual without stipulations","essays":["12"]},{"key":"garcia","label":"Garcia: is chatbot output speech? Listener rights","essays":["12"]}]},{"area":"Ch. 6 · Immoral speech: protecting adults","items":[{"key":"im-check","label":"Who is the government protecting, and from what harm?","essays":["13","14","15"]},{"key":"bolger","label":"Bolger: adults can't be reduced to what is fit for children","essays":["13"]},{"key":"cohen-off","label":"Cohen: profanity is protected; viewers can avert their eyes","essays":["13"]},{"key":"pacifica","label":"Pacifica: broadcasting, nuisance, and context","essays":["13"]},{"key":"pacifica-open","label":"What Pacifica didn't decide, and its limits by medium","essays":["13"]},{"key":"miller","label":"Miller's three prongs; obscenity is limited to sexual conduct","essays":["13"]},{"key":"miller-prur","label":"Prurient interest (Brockett) and the work taken as a whole","essays":["13"]},{"key":"hudnut-rev","label":"Hudnut revisited: not an obscenity law","essays":["13"]},{"key":"renton","label":"Renton: secondary effects, narrowly applied","essays":["13"]}]},{"area":"Ch. 6 · Immoral speech: protecting kids","items":[{"key":"ferber","label":"Ferber: real children; no Miller requirement; drying up distribution","essays":["15"]},{"key":"fsc","label":"Free Speech Coalition: virtual images and adult look-alikes","essays":["15"]},{"key":"ashcroft2","label":"Ashcroft II: strict scrutiny; filters; the government's burden","essays":["14"]},{"key":"paxton","label":"Paxton: intermediate scrutiny for age verification; Ginsberg","essays":["14"]},{"key":"paxton-v-a2","label":"Did Paxton overrule Ashcroft II?","essays":["14"]},{"key":"brown","label":"Brown: no new category for violence, even for minors","essays":["14"]},{"key":"minors","label":"Minors' own First Amendment rights","essays":["14"]},{"key":"sexting","label":"Stretch: teen sexting and exploitation","essays":["15"]}]}]}</script>
<script>
(() => {
  'use strict';
  const D = JSON.parse(document.getElementById('essay-data').textContent);
  const app = document.getElementById('app');
  const byId = Object.fromEntries(D.essays.map(e => [e.id, e]));
  let filter = 'all';
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  function browse() {
    document.title = 'First Amendment Essay Questions';
    const counts = {};
    D.essays.forEach(e => counts[e.topic] = (counts[e.topic] || 0) + 1);
    const chips = [['all', 'All topics', D.essays.length], ...D.topics.filter(t => counts[t.key]).map(t => [t.key, t.name, counts[t.key]])]
      .map(([k, n, c]) => `<button class="chip" data-topic="${k}" aria-pressed="${filter === k}">${esc(n)}<span>${c}</span></button>`).join('');
    const groups = D.topics.filter(t => counts[t.key] && (filter === 'all' || filter === t.key)).map(t => `
      <section class="topic"><h2>${esc(t.name)}</h2><div class="cards">${D.essays.filter(e => e.topic === t.key).map(e => `
        <a class="card" href="#essay-${e.id}">
          <span class="num">Essay ${e.id}</span>
          <h3>${esc(e.title)}</h3>
          <p>${esc(e.teaser)}</p>
          <div class="meta"><span><b>${e.call.length}</b> questions</span><span><b>${e.cases.length}</b> cases in the answer key</span><span>Scored out of <b>10</b></span></div>
        </a>`).join('')}</div></section>`).join('');
    const caseRows = D.caseIndex.map(c => `<div class="irow"><span><i>${esc(c.name)}</i></span><span class="refs">${c.essays.map(id => `<a href="#essay-${id}" title="${esc(byId[id].title)}">${id}</a>`).join('')}</span></div>`).join('');
    const covRows = D.coverage.map(g => `<div class="igrp">${esc(g.area)}</div>` + g.items.map(i => `<div class="irow"><span>${esc(i.label)}</span><span class="refs">${i.essays.map(id => `<a href="#essay-${id}" title="${esc(byId[id].title)}">${id}</a>`).join('')}</span></div>`).join('')).join('');
    app.innerHTML = `
      <header>
        <span class="eyebrow">Con Law II · Weeks 1–6</span>
        <h1>First Amendment Essay Questions</h1>
        <p class="lede">Bar-style essay questions covering Chapters 1–6: every case and concept in the outline, from Barnette and the Religion Clauses through incitement, prior restraints, true threats, and immoral speech. Each essay sets out new facts with several questions. Write your answer first, then open the model answer: a full-credit response worked issue by issue, the cases it uses and why, the concepts explained, and a 10-point scoring guide.</p>
      </header>
      <div class="chips" role="group" aria-label="Filter by topic">${chips}</div>
      ${groups}
      <details class="index"><summary>Case index</summary><p>All ${D.caseIndex.length} cases from the Chapters 1–6 outline, with the essays whose answer keys use them.</p>${caseRows}</details>
      <details class="index"><summary>Coverage map</summary><p>Every case, rule, and stretch exercise in the outline (${D.coverage.reduce((n, g) => n + g.items.length, 0)} items), with the essays that test it.</p>${covRows}</details>`;
    app.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => { filter = b.dataset.topic; browse(); }));
  }

  function essay(e) {
    const i = D.essays.indexOf(e), prev = D.essays[i - 1], next = D.essays[i + 1];
    const topic = D.topics.find(t => t.key === e.topic).name;
    document.title = 'Essay ' + e.id + ': ' + e.title + ' · First Amendment Essay Questions';
    const total = e.rubric.reduce((n, r) => n + r[0], 0);
    app.innerHTML = `
      <div class="topbar"><a class="back" href="#">← All essays</a><span class="count">Essay ${e.id} of ${D.essays.length}</span></div>
      <span class="eyebrow">${esc(topic)}</span>
      <h1>${esc(e.title)}</h1>
      <section class="sec"><h2>The facts</h2><div class="facts">${e.facts.map(p => `<p>${p}</p>`).join('')}</div></section>
      <section class="sec"><h2>Questions</h2><ol class="call">${e.call.map(q => `<li>${q}</li>`).join('')}</ol></section>
      <div class="reveal"><button class="btn primary" id="toggle" aria-expanded="false" aria-controls="key">Show the model answer</button><span class="hint">Outline or write your answer first.</span></div>
      <div class="key" id="key" hidden>
        <section class="sec"><h2>Model answer <span class="badge">10 / 10</span></h2><div class="ans">${e.answer.map(s => `<h3>${s.h}</h3>${s.p.map(p => `<p>${p}</p>`).join('')}`).join('')}</div></section>
        <section class="sec"><h2>Cases used</h2><div class="cases">${e.cases.map(c => `
          <div class="case"><span class="cn">${esc(c.n)}</span><span class="cc">${esc(c.c)}</span>
          <dl><dt>Rule</dt><dd>${c.r}</dd><dt>Used for</dt><dd>${c.u}</dd></dl></div>`).join('')}</div></section>
        <section class="sec"><h2>Concepts explained</h2><div class="concepts">${e.concepts.map(c => `<div class="concept"><b>${esc(c.t)}</b><p>${c.d}</p></div>`).join('')}</div></section>
        <section class="sec"><h2>Scoring guide</h2><ul class="rubric">${e.rubric.map(r => `<li><span class="pts">${r[0]} pt${r[0] > 1 ? 's' : ''}</span><span>${r[1]}</span></li>`).join('')}<li><span class="pts">${total}</span><span class="total">Total</span></li></ul></section>
      </div>
      <nav class="pager" aria-label="More essays">${prev ? `<a class="prev" href="#essay-${prev.id}"><span>← Previous</span>${esc(prev.title)}</a>` : ''}${next ? `<a class="next" href="#essay-${next.id}"><span>Next →</span>${esc(next.title)}</a>` : ''}</nav>`;
    const t = document.getElementById('toggle'), key = document.getElementById('key');
    t.addEventListener('click', () => {
      const open = key.hidden;
      key.hidden = !open; t.setAttribute('aria-expanded', String(open));
      t.textContent = open ? 'Hide the model answer' : 'Show the model answer';
      if (open) key.querySelector('h2').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
    });
  }

  let lastBrowseY = 0;
  function route() {
    const m = location.hash.match(/^#essay-(\d+)$/);
    const e = m && byId[m[1]];
    if (e) { essay(e); window.scrollTo(0, 0); }
    else { browse(); window.scrollTo(0, lastBrowseY); }
  }
  window.addEventListener('hashchange', () => route());
  app.addEventListener('click', ev => { if (ev.target.closest('.card')) lastBrowseY = window.scrollY; });
  route();
})();
</script>
