y allowed.","\u003cstrong>Conclusion.\u003c/strong> Section 1 is unconstitutional. Section 2 is likely valid."]},{"h":"2. The permit denial and Section 3","p":["\u003cstrong>Rule.\u003c/strong> Under \u003ci>Collin v. Smith\u003c/i> (7th Cir. 1978), the Skokie case, government may not ban a peaceful demonstration because of its message, even one that deeply offends or traumatizes listeners. Uniforms, flags, placards, and marching are symbolic speech and assembly, and a peaceful demonstration is speech in its classic form. Under \u003ci>Police Department of Chicago v. Mosley\u003c/i>, government has no power to restrict expression because of its content. Debate should be “uninhibited, robust, and wide-open” (quoting \u003ci>NYT v. Sullivan\u003c/i>). The recognized exceptions are narrow categories: incitement, fighting words, true threats, speech integral to crime, obscenity, child pornography, some defamation, and fraud. Psychic trauma can't be distinguished from the anger that speech is meant to provoke (\u003ci>Terminiello\u003c/i>), because the shock flows from the ideas themselves. Listener protection is allowed only for intrusions into the home or on a truly captive audience. Hate speech is generally protected.","\u003cstrong>Application: the permit.\u003c/strong> The denial rests entirely on the message's effect on listeners. That is content-based, not a time, place, or manner rule: the city objects to who is marching and what they say, not to the time, the route, or noise. No unprotected category applies. The chief conceded he expected no violence, which rules out incitement (\u003ci>Brandenburg\u003c/i>) and fighting words (\u003ci>Chaplinsky\u003c/i>), and the signs threaten no one. The survivors are not a captive audience: as in \u003ci>Collin\u003c/i>, they can avoid a 30-minute sidewalk march, and nothing here intrudes into the home. The facts track Skokie almost exactly, down to the single-file march.","\u003cstrong>Application: Section 3.\u003c/strong> Section 3 is worse. Banning only demonstrations that “promote hatred” of racial or religious groups singles out one viewpoint for punishment. Content-based laws get strict scrutiny, and viewpoint-based laws are the worst form. The city's interest in protecting residents from emotional harm is real, but it can't justify silencing a viewpoint, and counterspeech (a vigil or a counterdemonstration) is a less restrictive alternative. A genuinely content-neutral buffer around memorials might be analyzed under intermediate scrutiny (Chapter 9), but this one is defined by message.","\u003cstrong>Conclusion.\u003c/strong> The permit denial and Section 3 are unconstitutional."]},{"h":"3. Section 4: “degrading” images","p":["\u003cstrong>Rule.\u003c/strong> Under \u003ci>American Booksellers Ass'n v. Hudnut\u003c/i> (7th Cir. 1985), government may not favor one viewpoint and silence the other, even when it is right that the disfavored speech causes real social harm. Indianapolis banned sexually explicit material depicting women as subordinate, while material depicting women as equals stayed lawful, regardless of literary, artistic, or political value. The court accepted that such depictions perpetuate subordination, but said that only shows the power of speech. Otherwise government becomes “the great censor and director of which thoughts are good for us.”","\u003cstrong>Application.\u003c/strong> Section 4 bans images based on the attitude they convey toward women, explicitly “regardless of literary or artistic value.” That is \u003ci>Hudnut\u003c/i>'s viewpoint discrimination. It isn't an obscenity law: it doesn't track \u003ci>Miller\u003c/i>'s prurient interest, patent offensiveness, or serious-value prongs, so the obscenity category can't save it. It would sweep in art books and acclaimed graphic novels, just as the Indianapolis ordinance reached Yeats and Joyce. The city's evidence of harm doesn't change the analysis; \u003ci>Hudnut\u003c/i> assumed the harm was real.","\u003cstrong>Conclusion.\u003c/strong> Section 4 is unconstitutional viewpoint discrimination."]}],"cases":[{"n":"Wooley v. Maynard","c":"430 U.S. 705 (1977)","r":"No compelled display of the state's ideological message on private property; ideological interests and an untailored identification interest fail; fn. 15 distinguishes currency.","u":"Section 1."},{"n":"Collin v. Smith","c":"578 F.2d 1197 (7th Cir. 1978)","r":"A peaceful march can't be banned for its message, even if it traumatizes listeners; no captive audience.","u":"The permit denial and Section 3."},{"n":"Police Department of Chicago v. Mosley","c":"408 U.S. 92 (1972)","r":"Government may not restrict expression because of its content.","u":"The baseline against content-based rules."},{"n":"American Booksellers Ass'n v. Hudnut","c":"771 F.2d 323 (7th Cir. 1985)","r":"Viewpoint discrimination is invalid even if the disfavored speech causes real harm.","u":"Section 4."},{"n":"West Virginia State Board of Education v. Barnette","c":"319 U.S. 624 (1943)","r":"No compelled affirmation.","u":"The root of Wooley's right not to speak."},{"n":"Terminiello v. Chicago; Brandenburg v. Ohio; Chaplinsky v. New Hampshire","c":"(1949); (1969); (1942)","r":"Stirring anger is protected; incitement and fighting words are narrow.","u":"Why no unprotected category covers the march."}],"concepts":[{"t":"The speech checklist","d":"Government action → speech? → compelled? → content-based, viewpoint-based, or neutral? → unprotected category (narrowly defined)? → strict scrutiny for content-based rules (compelling interest, actually necessary, least restrictive means) → facial attacks."},{"t":"Content-based versus viewpoint-based","d":"Content-based rules target a subject; viewpoint-based rules target a side of a debate and are the most suspect form. Both get strict scrutiny. Content-neutral time, place, and manner rules get intermediate scrutiny (Chapter 9)."},{"t":"Captive audience","d":"Listener protection justifies restricting speech only when it intrudes into the home or when listeners truly can't avoid it. Passersby on public sidewalks are expected to look away or walk away."},{"t":"Compelled speech versus compelled disclosure","d":"Government can't make people carry its ideological messages (Barnette, Wooley), but it may require accurate factual commercial disclosures, such as calorie counts (Chapter 8)."}],"rubric":[[1,"Sets out the speech checklist; identifies symbolic speech."],[2,"Wooley applied to Section 1 (ideological message, interests, fn. 15); Section 2 as a commercial disclosure."],[3,"Permit: Collin and Mosley; content-based; no category applies (no expected violence); no captive audience."],[1,"Section 3 is viewpoint-based; strict scrutiny fails; counterspeech."],[2,"Section 4: Hudnut viewpoint discrimination; not a Miller obscenity law."],[1,"Clear conclusions for each section."]]},{"id":"7","topic":"spf","title":"Lies, Cruelty, and New Categories","teaser":"A state criminalizes lying about credentials and selling animal-killing videos, and promises to enforce the video law only against the worst offenders.","facts":["The State of Ridgeland passed two laws after finding that “false credential claims and depictions of animal cruelty have little value, and their harms far outweigh any benefit.”","The Honest Credentials Act makes it a misdemeanor to “falsely claim, orally or in writing, to have received any military decoration, an advanced academic degree, or a professional license.” At a televised school board meeting, Dana Pruitt said, “As a Silver Star recipient and a Ph.D., I can tell you these test scores are a disgrace.” Dana has neither. A local reporter exposed the claim within a day, and Dana became a figure of public ridicule. Separately, Evan Lisle told a city agency he held an engineering license so he could win a $200,000 inspection contract. He was paid and did the work. He has no license.","The Animal Cruelty Media Act makes it a felony to “create, sell, or possess for sale any depiction of an animal being intentionally killed, maimed, or wounded, if that conduct is illegal in Ridgeland,” unless the depiction has “serious religious, political, scientific, educational, journalistic, historical, or artistic value.” Ridgeland bans hunting on Sundays and bans hunting certain species entirely. Sal Moreno sells hunting videos, including Sunday hunts filmed in other states. The attorney general announces that the state will prosecute “only extreme cruelty, like crush videos.” Moreno is charged anyway.","A legislator has introduced a narrower bill making it a crime to sell “recordings of actual dogfights staged in violation of state law, made for the purpose of sale.”"],"call":["Can Ridgeland convict Dana? Can it punish Evan?","Is the Animal Cruelty Media Act valid? Does the attorney general's promise matter?","Would the narrower dogfight bill survive?"],"answer":[{"h":"Framework: content-based laws and unprotected categories","p":["Both laws are content-based: they apply because of what the speech says or depicts. Content-based restrictions are presumptively invalid and get strict scrutiny unless the speech falls within a historically recognized unprotected category: incitement, fighting words, true threats, speech integral to crime, child pornography, obscenity, defamation in certain circumstances, fraud, and grave and imminent threats the government may prevent. Under \u003ci>United States v. Stevens\u003c/i> (2010, 8-1), courts may not create new categories by balancing the speech's value against its costs. The government's “categorical balancing” test is “startling and dangerous,” because the First Amendment already reflects the people's judgment about costs and benefits. Ridgeland's legislative finding that the speech has “little value” and that its harms outweigh any benefit is exactly that kind of balancing, and it carries no weight."]},{"h":"1. Dana and Evan","p":["\u003cstrong>Rule.\u003c/strong> \u003ci>United States v. Alvarez\u003c/i> (2012) held that there is no general First Amendment exception for false statements. Alvarez falsely claimed the Medal of Honor at a public meeting and sought no material gain. Justice Kennedy's plurality (four Justices) applied exacting scrutiny: a content-based ban on lies must be “actually necessary,” and the ordinary remedy for false speech is true speech. Justices Breyer and Kagan concurred in the judgment using intermediate scrutiny. Because no single rationale drew five votes, the plurality's reasoning isn't strictly binding, but six Justices agreed the Stolen Valor Act was unconstitutional. Cases saying falsehood has no value involved legally cognizable harm, such as defamation or fraud. The Act targeted “falsity and nothing more.”","\u003cstrong>Application: Dana.\u003c/strong> Dana's lie is like Alvarez's: a public boast, made without seeking any material gain. The Act is even broader than the Stolen Valor Act. It covers degrees and licenses as well as decorations, and lies made anywhere, including at home, which would let government compile a list of subjects about which lying is a crime. The interest in protecting military honors is real; \u003ci>Alvarez\u003c/i> called the interest in the Medal's integrity “beyond question.” But there is no evidence that Dana's lie diluted the honor, and counterspeech worked: a reporter exposed Dana within a day. That is Holmes's marketplace of ideas and Brandeis's point in \u003ci>Whitney\u003c/i> that the remedy for falsehood is more speech, not enforced silence. A government registry of genuine award recipients is a less restrictive alternative. The law fails under either the plurality's or the concurrence's approach.","\u003cstrong>Application: Evan.\u003c/strong> Evan's lie is different. He lied to obtain money, a $200,000 contract, which is fraud, a historically unprotected category. \u003ci>Alvarez\u003c/i> expressly distinguished false statements made to gain a material advantage. Ridgeland may punish Evan under a fraud or false-statements-to-government law. But the Credentials Act, as written, is unconstitutional, so the state should prosecute him under a narrower statute aimed at material gain.","\u003cstrong>Conclusion.\u003c/strong> Dana can't be convicted. Evan's conduct can be punished as fraud."]},{"h":"2. The Animal Cruelty Media Act","p":["\u003cstrong>Rule: no new category.\u003c/strong> \u003ci>Stevens\u003c/i> struck down 18 U.S.C. § 48, which criminalized depictions of animals being killed or wounded where the conduct is illegal, despite a serious-value exception. There is no tradition of banning depictions of animal cruelty, so it is not an unprotected category.","\u003cstrong>Rule: overbreadth.\u003c/strong> A law is facially invalid if it prohibits a substantial amount of protected speech relative to its plainly legitimate sweep. The unconstitutional applications must be realistic, and the ratio must be lopsided (\u003ci>Stevens\u003c/i>; \u003ci>United States v. Hansen\u003c/i>). Overbreadth lets a litigant whose own speech may be unprotected assert the rights of others, because of chilling concerns. It is “strong medicine.”","\u003cstrong>Application.\u003c/strong> Ridgeland's Act copies § 48. Read by its text, it requires no cruelty, only killing or wounding that is illegal in Ridgeland. Because Ridgeland bans Sunday hunting and some species, the Act reaches ordinary hunting videos, including hunts lawfully filmed elsewhere. The serious-value exception doesn't save hunting videos, which are mostly recreational, as the Court said of § 48. Those protected applications are realistic and numerous; the market for hunting media dwarfs the market for crush videos. The ratio is lopsided, so the Act is substantially overbroad. Moreno, a hunting-video seller, can win either as applied or facially.","\u003cstrong>The attorney general's promise.\u003c/strong> A promise to prosecute only “extreme cruelty” doesn't help. In \u003ci>Stevens\u003c/i>, the Court refused to uphold a law on the government's assurance of restraint; the First Amendment does not leave us “at the mercy of noblesse oblige.” Courts construe the statute's text, not the prosecutor's intentions, and the promise binds no future official.","\u003cstrong>Conclusion.\u003c/strong> The Act is facially invalid."]},{"h":"3. The narrow dogfight bill","p":["\u003cstrong>Issue.\u003c/strong> \u003ci>Stevens\u003c/i> expressly left open whether a statute limited to crush videos or extreme cruelty would be valid.","\u003cstrong>Arguments for validity.\u003c/strong> The bill is narrow. It covers only actual illegal dogfights recorded for sale, which is the question \u003ci>Stevens\u003c/i> left open. It can be tied to an existing category, speech integral to criminal conduct: as with child pornography in \u003ci>Ferber\u003c/i>, the market for the recordings drives the underlying crime. Alternatively, it may survive strict scrutiny by targeting the commercial incentive. Courts should also read it narrowly to avoid constitutional problems (\u003ci>Hansen\u003c/i>).","\u003cstrong>Arguments against.\u003c/strong> \u003ci>Stevens\u003c/i> refused to make depictions of cruelty unprotected, and \u003ci>Ferber\u003c/i> rests on the special harm to children. “In violation of state law” raises a question: which state's law, if the fight happened abroad, like § 48's Japanese footage? The bill could sweep in journalism and investigative exposés unless “made for the purpose of sale” is read to exclude them. And a less restrictive alternative exists: prosecute the fights themselves (\u003ci>Alvarez\u003c/i>'s actually-necessary requirement).","\u003cstrong>Conclusion.\u003c/strong> The bill is defensible if it is tightly drafted, limited to recordings made for sale, and tied to the underlying crime, especially with an exception for news reporting. It is far stronger than the Animal Cruelty Media Act."]}],"cases":[{"n":"United States v. Stevens","c":"559 U.S. 460 (2010)","r":"No new unprotected categories by balancing value against harm; § 48 was substantially overbroad (hunting videos); no reliance on noblesse oblige.","u":"Controls the Animal Cruelty Media Act and the legislative findings."},{"n":"United States v. Alvarez","c":"567 U.S. 709 (2012)","r":"No general exception for false statements; bans must be actually necessary; counterspeech is the remedy; plurality plus concurrence.","u":"Dana's lie; distinguishes Evan's fraud."},{"n":"United States v. Hansen","c":"599 U.S. 762 (2023)","r":"Overbreadth requires realistic, substantial, lopsided unconstitutional applications; construe statutes narrowly.","u":"The overbreadth test; narrow reading of the dogfight bill."},{"n":"New York v. Ferber","c":"458 U.S. 747 (1982)","r":"A market that drives an underlying crime may be dried up.","u":"The analogy that supports the dogfight bill."},{"n":"Whitney v. California (Brandeis, J., concurring)","c":"274 U.S. 357 (1927)","r":"The remedy for bad speech is more speech.","u":"Counterspeech exposed Dana."},{"n":"Virginia Board of Pharmacy (fraud category)","c":"425 U.S. 748 (1976)","r":"Fraud is unprotected.","u":"Evan's lie to win a contract."}],"concepts":[{"t":"Historically unprotected categories","d":"Incitement, fighting words, true threats, speech integral to crime, child pornography, obscenity, some defamation, fraud, and grave and imminent threats the government may prevent. The list is closed to balancing: Stevens refused animal cruelty and Alvarez refused false statements as such."},{"t":"Plurality and concurrence in the judgment","d":"A plurality opinion has fewer than five Justices joining its reasoning, so its rationale isn't strictly binding. Concurring in the judgment means agreeing with the result but not the reasoning. In Alvarez, six Justices agreed on the result under two different standards."},{"t":"“Actually necessary” and counterspeech","d":"For a content-based ban, the government must show the restriction is needed, not merely helpful. If true speech (exposure, a public registry) can address the harm, the ban fails."},{"t":"Overbreadth","d":"A First Amendment exception to the usual rule that litigants assert only their own rights. A law falls if its protected applications are realistic and substantial relative to its legitimate sweep. Courts construe first, and enforcement promises don't count."}],"rubric":[[1,"Identifies content-based restrictions; rejects the legislative balancing under Stevens."],[2,"Dana: Alvarez (no falsity exception, actually necessary, counterspeech, breadth); explains plurality and concurrence."],[1,"Evan: fraud is an unprotected category; material gain distinguishes Alvarez."],[3,"Animal Cruelty Media Act: no new category; overbreadth via hunting videos and Sunday bans; lopsided ratio."],[1,"Noblesse oblige: the AG's promise is irrelevant."],[2,"Dogfight bill: arguments both ways (Stevens left open; Ferber analogy; journalism; less restrictive alternative) and a reasoned conclusion."]]},{"id":"8","topic":"ob","title":"Encouraging Words and Annoying Emails","teaser":"A con artist invokes the rights of protest groups to attack an “encourage or induce” statute, and a resident convicted of sending “annoying” emails says the law is vague.","facts":["The State of Coastal enacted a statute banning overnight camping on public land. A companion statute, § 12, makes it a crime to “encourage or induce any person to engage in unlawful camping.” Tomas Reyes sold fake “overnight camping permits” to dozens of unhoused people for $40 each, telling them the permits made camping in city parks legal. Several were arrested for camping. Tomas was convicted under § 12. On appeal, he argues that § 12 is facially overbroad: advocacy groups regularly post messages such as “The camping ban is cruel. Sleep where you need to tonight,” and § 12, he says, criminalizes that advocacy.","Separately, Coastal's § 30 makes it a crime to send electronic communications to a public official “with intent to annoy.” Rina Hall sent a city councilmember 15 emails in two days criticizing a zoning vote, calling the vote “corrupt” and urging recall. She was convicted under § 30. She argues that § 30 is unconstitutionally vague."],"call":["Can Tomas challenge § 12 for overbreadth, even though his own conduct is fraud? Will the challenge succeed?","Is § 30 void for vagueness? How do vagueness and overbreadth differ?"],"answer":[{"h":"1. Tomas's overbreadth challenge to § 12","p":["\u003cstrong>Standing to raise others' rights.\u003c/strong> Ordinarily, a litigant may assert only his own rights, and in an ordinary facial challenge he must show that a law has no valid applications (\u003ci>United States v. Salerno\u003c/i>). Overbreadth is unusual. Under \u003ci>United States v. Hansen\u003c/i> (2023, 7-2, Barrett, J.), it lets a litigant whose own speech is unprotected assert the rights of third parties, and it invalidates a law that has lawful applications. It is justified by chilling concerns, but it is “strong medicine.” So Tomas may raise the advocacy groups' rights even though his own sales were fraud and speech integral to crime.","\u003cstrong>Rule: the test.\u003c/strong> A law is facially invalid for overbreadth only if it prohibits a substantial amount of protected speech relative to its plainly legitimate sweep. The unconstitutional applications must be realistic, not fanciful, and the ratio must be lopsided. Courts first construe the statute, adopting any fairly possible constitutional reading.","\u003cstrong>Rule: construction and avoidance.\u003c/strong> In \u003ci>Hansen\u003c/i>, a federal law barred “encourag[ing] or induc[ing]” illegal immigration. The Court read those words as criminal-law terms of art covering only intentional solicitation and facilitation of specific unlawful acts, not general advocacy. Under the constitutional-avoidance canon (the \u003ci>Ashwander\u003c/i> principle), if a statute can fairly be read two ways, courts choose the constitutional reading and seek harmony rather than “constitutional collision.” The canon doesn't override clear text.","\u003cstrong>Application.\u003c/strong> § 12 uses the same words, “encourage or induce.” Read as \u003ci>Hansen\u003c/i> read them, § 12 reaches only intentional solicitation or facilitation of specific unlawful camping, such as selling sham permits to induce specific people to camp illegally. General messages such as “the ban is cruel” are abstract advocacy outside the statute. The closer case is the advocacy groups' “Sleep where you need to tonight.” It is directed at a general audience, not at specific people for specific acts, so it falls outside the terms-of-art reading. Remaining worries are fanciful rather than realistic. Contrast \u003ci>United States v. Stevens\u003c/i>, where the text required no cruelty and realistically reached a huge market of hunting videos, producing a lopsided ratio. Here, construction removes the protected applications.","\u003cstrong>Conclusion.\u003c/strong> Tomas may raise the overbreadth challenge, but it fails. § 12, construed narrowly, is not substantially overbroad, and his conviction stands."]},{"h":"2. Rina's vagueness challenge to § 30","p":["\u003cstrong>Rule.\u003c/strong> Vagueness comes from the Due Process Clause. Under \u003ci>United States v. Williams\u003c/i> (2008), a law is void for vagueness if it fails to give a person of ordinary intelligence fair notice of what is prohibited, or is so standardless that it invites seriously discriminatory enforcement. A law isn't vague merely because close cases exist; the reasonable-doubt standard handles uncertainty about whether a fact is proved. The problem is indeterminacy about \u003ci>what\u003c/i> fact must be proved. \u003ci>Williams\u003c/i> gave “annoying” and “indecent” as examples of words that make the forbidden conduct indeterminate. Ordinarily, a person whose own conduct is clearly covered can't complain that a law is vague as to others (\u003ci>Holder v. Humanitarian Law Project\u003c/i>), but the Court relaxes that rule in First Amendment cases. “Perfect clarity” has never been required.","\u003cstrong>Application.\u003c/strong> § 30 turns on “intent to annoy,” the very term \u003ci>Williams\u003c/i> identified as indeterminate. Whether an email annoys depends on the sensibilities of the official who receives it, so citizens can't know where the line is. Officials, as the targets of the speech, have every incentive to enforce it against critics. That invites discriminatory enforcement. Rina's emails are core political speech: criticism of a vote and a call for recall. Even if 15 emails in two days were annoying, her conduct isn't clearly within a definite core of the statute, because the statute has no definite core. The state may argue that the intent requirement narrows the law, since mens rea is often a speech protection (\u003ci>Counterman\u003c/i>; \u003ci>Williams\u003c/i>). But a specific intent to do something undefined doesn't cure the lack of definition.","\u003cstrong>Overbreadth too.\u003c/strong> § 30 is also overbroad. It reaches a vast amount of protected criticism of public officials relative to any legitimate sweep, such as true threats or harassment that can be prohibited under narrower laws.","\u003cstrong>How the doctrines differ.\u003c/strong> Vagueness complains that a law is \u003ci>unclear\u003c/i>. It comes from due process and mainly concerns the litigant's own conduct. Overbreadth complains that a clear law \u003ci>reaches too much\u003c/i> protected speech. It comes from the First Amendment and allows assertion of third parties' rights. Both aim to prevent chilling.","\u003cstrong>Conclusion.\u003c/strong> § 30 is void for vagueness (and overbroad), and Rina's conviction must be reversed."]}],"cases":[{"n":"United States v. Hansen","c":"599 U.S. 762 (2023)","r":"Overbreadth requires a substantial, realistic, lopsided ratio; “encourage or induce” means solicitation and facilitation; constitutional avoidance.","u":"Controls § 12."},{"n":"United States v. Stevens","c":"559 U.S. 460 (2010)","r":"A statute whose text realistically reaches a large protected market is facially invalid.","u":"The contrast showing what a lopsided ratio looks like."},{"n":"United States v. Salerno","c":"481 U.S. 739 (1987)","r":"An ordinary facial challenge requires showing no valid applications.","u":"The baseline overbreadth departs from."},{"n":"United States v. Williams","c":"553 U.S. 285 (2008)","r":"Vagueness concerns indeterminacy, not close cases; “annoying” is an example of an indeterminate term.","u":"Controls § 30."},{"n":"Holder v. Humanitarian Law Project","c":"561 U.S. 1 (2010)","r":"A litigant whose conduct is clearly covered generally can't raise vagueness as to others.","u":"The limit Rina must overcome; relaxed in First Amendment cases."},{"n":"Ashwander v. TVA (Brandeis, J., concurring)","c":"297 U.S. 288 (1936)","r":"Constitutional avoidance.","u":"Narrow reading of § 12."}],"concepts":[{"t":"Overbreadth","d":"Strong medicine. Third-party standing plus facial invalidation, available only when protected applications are realistic and substantial relative to the law's legitimate sweep. Construe first; narrow constructions often defeat the challenge (Hansen)."},{"t":"Constitutional avoidance","d":"When a statute is fairly open to two readings, courts choose the one that avoids constitutional problems. It can't rewrite clear text."},{"t":"Vagueness","d":"Due process requires fair notice and standards that prevent arbitrary enforcement. The question is whether the law tells you what fact must be proved, not whether the fact is hard to prove."},{"t":"Vagueness versus overbreadth","d":"Vagueness: the law is unclear (Due Process; mainly the litigant's own conduct). Overbreadth: the law clearly reaches too much protected speech (First Amendment; third parties' speech). Both prevent chilling."}],"rubric":[[2,"Explains overbreadth's third-party standing and contrasts Salerno."],[1,"States the Hansen test (substantial, realistic, lopsided)."],[2,"Construes “encourage or induce” as terms of art; avoidance canon; applies to the advocacy posts."],[1,"Contrasts Stevens; concludes § 12 survives."],[3,"§ 30 vagueness: Williams standard, “annoy” as indeterminate, discriminatory enforcement, Holder limit relaxed for speech."],[1,"Distinguishes vagueness from overbreadth."]]},{"id":"9","topic":"inc","title":"The Rally at City Hall","teaser":"Two rally speakers, a counter-protester's slur, a profane shirt, a dispersal order, and a new hate-symbol ordinance.","facts":["After a police shooting, about 300 people rallied on the steps of the Elmwood City Hall while the city council met inside. The first speaker, Jordan Pike, told the crowd: “If this city won't give us justice, we'll take it. Not today, and not tomorrow, but someday this whole rotten system is going to burn, and it'll deserve it.” The crowd cheered. Later, as some protesters pushed against the doors, the second speaker, Kai Moreno, grabbed the microphone and shouted, “The doors are open! Go in now and shut that meeting down. Don't let them vote!” Kai was livestreaming to 5,000 viewers. Within two minutes, a group rushed inside and smashed furniture in the council chamber.","Across the street, about 40 counter-protesters gathered. One, Brent Cole, walked up to a protester, put his face inches from hers, and screamed a racial slur and an obscenity at her. A protester named Ava wore a T-shirt reading “F∗∗∗ the Police.” As tensions rose between the groups, the police chief, with 60 officers on hand, ordered the rally (but not the counter-protest) to disperse “because the counter-protesters are getting angry.”","Jordan and Kai were charged under Elmwood's Riot Advocacy Law, which punishes anyone who “advocates the duty, necessity, or propriety of violence as a means of political reform” or who “assembles with any group formed to advocate” it. Brent and Ava were charged with disorderly conduct under a statute the state's high court has limited to “fighting words.” Protesters who refused to disperse were arrested. The next month, Elmwood enacted an ordinance banning “any symbol, word, or gesture that the speaker knows will arouse anger or alarm in others on the basis of race, religion, or national origin,” which the state court construed to reach only fighting words."],"call":["Is the Riot Advocacy Law constitutional? May Jordan or Kai be convicted of incitement under a valid statute?","May Brent and Ava be convicted of using fighting words?","Was the dispersal order lawful?","Is the new ordinance valid?"],"answer":[{"h":"1. The Riot Advocacy Law, Jordan, and Kai","p":["\u003cstrong>Rule.\u003c/strong> Under \u003ci>Brandenburg v. Ohio\u003c/i> (1969, per curiam), advocacy of force or law violation may be punished only if it is (1) directed to inciting or producing (2) imminent (3) lawless action and (4) likely to produce such action. The abstract teaching of the moral propriety, or even the necessity, of force differs from “preparing a group for violent action and steeling it to such action.” \u003ci>Brandenburg\u003c/i> overruled \u003ci>Whitney v. California\u003c/i>, which had upheld a criminal syndicalism conviction for mere advocacy. It also replaced, in practice, the “clear and present danger” and “bad tendency” tests used to affirm the convictions of World War I dissidents (\u003ci>Abrams\u003c/i>, \u003ci>Schaefer\u003c/i>, \u003ci>Pierce\u003c/i>). \u003ci>Terminiello v. Chicago\u003c/i> (1949) adds that speech may not be punished for stirring anger, inviting dispute, or creating unrest, since speech may best serve its purpose when it does those things. When a statute is challenged, start with the law and how it was construed, then turn to the facts.","\u003cstrong>The statute.\u003c/strong> Elmwood's law punishes advocating the “propriety of violence as a means of political reform” and assembling with a group that does so. That is Ohio's criminal syndicalism statute in \u003ci>Brandenburg\u003c/i>. It punishes mere advocacy, with no requirement of intent, imminence, or likelihood. It is unconstitutional on its face, so no conviction can stand under it, whatever Jordan and Kai said. Under Brandeis's \u003ci>Whitney\u003c/i> concurrence, the remedy for evil counsels is good ones, not enforced silence.","\u003cstrong>Jordan under a valid statute.\u003c/strong> Jordan's speech is angry, but it doesn't meet the test. He said “not today, and not tomorrow, but someday,” expressly disclaiming imminence and predicting a future event. That is abstract advocacy about the system's fate, not steeling the crowd for immediate action. [Beyond the casebook: \u003ci>Hess v. Indiana\u003c/i> (1973) protected “We'll take the f∗∗∗ing street later” for lack of imminence, and \u003ci>NAACP v. Claiborne Hardware\u003c/i> (1982) protected heated speech warning of future reprisals.] Like Terminiello, Jordan stirred the crowd to anger, which is protected.","\u003cstrong>Kai under a valid statute.\u003c/strong> Kai's speech comes much closer. \u003ci>Directed to inciting:\u003c/i> “Go in now and shut that meeting down. Don't let them vote!” is a concrete call to a specific action, made after Kai saw the crowd pushing on the doors. Urging escalation at that moment is strong evidence of intent. \u003ci>Imminent:\u003c/i> “now,” with the target a few yards away. \u003ci>Lawless action:\u003c/i> forcibly entering and disrupting a council meeting is unlawful. \u003ci>Likely:\u003c/i> an agitated crowd was already pressing on the doors, and the entry followed within two minutes. Kai will argue that “shut it down” is common protest rhetoric meaning disrupt with noise, that he never mentioned violence, and that much of his audience was online. Those points go to intent, which a properly instructed jury decides.","\u003cstrong>Conclusion.\u003c/strong> The Riot Advocacy Law is facially invalid, and neither speaker can be convicted under it. Under a statute that tracks \u003ci>Brandenburg\u003c/i>, Jordan's speech is protected, and a properly instructed jury could convict Kai."]},{"h":"2. Brent and Ava","p":["\u003cstrong>Rule.\u003c/strong> Under \u003ci>Chaplinsky v. New Hampshire\u003c/i> (1942), fighting words are personal insults so offensive that they are likely to provoke the listener to attack the speaker immediately. The Court hasn't upheld a conviction on that theory since 1942. In \u003ci>Cohen v. California\u003c/i> (1971), a “F∗∗∗ the Draft” jacket worn in a courthouse hallway was not fighting words, because no one could reasonably take it as a direct personal insult and there was no realistic prospect of violence. Hate speech is generally protected.","\u003cstrong>Application: Ava.\u003c/strong> Ava's shirt is like Cohen's jacket: a general political message aimed at an institution, not a face-to-face insult directed at a particular person, and nothing suggests anyone was about to attack her over it. Her speech is protected.","\u003cstrong>Application: Brent.\u003c/strong> Brent's conduct is the closest modern fit for \u003ci>Chaplinsky\u003c/i>: a slur and an obscenity screamed inches from a specific person's face. That is a direct, personal insult in a setting where a violent response was plausible. Under the statute as construed, a conviction is possible. But the doctrine is shaky. A Harvard note coauthored by casebook author Klein argued that \u003ci>Chaplinsky\u003c/i> should be overruled rather than expanded: it rewards the undesirable response of fighting (unlike fleeing a false cry of “Fire!”), and it gives police discretion to punish minorities and critics. Scholars have also faulted it for assuming a male “fight” response. Women and outnumbered minorities may flee or freeze instead, which, Professor Kathleen Sullivan noted, gives “more license to insult Mother Teresa than Sean Penn.” Answer the \u003ci>Chaplinsky\u003c/i> question and note that conviction is uncertain.","\u003cstrong>Conclusion.\u003c/strong> Ava can't be convicted. Brent's is the rare case that may fit the fighting-words category, but a court applying the modern, narrow reading could still reverse."]},{"h":"3. The dispersal order","p":["\u003cstrong>Rule.\u003c/strong> There is no heckler's veto. In \u003ci>Edwards v. South Carolina\u003c/i> (1963) and \u003ci>Cox v. Louisiana\u003c/i> (1965), the Court reversed convictions of peaceful civil rights protesters because police could control the hostile crowd. In \u003ci>Cox\u003c/i>, 75 to 80 armed police separated 100 to 300 onlookers from the students. In \u003ci>Edwards\u003c/i>, police protection “was at all times sufficient.”","\u003cstrong>Application.\u003c/strong> The chief dispersed the rally \u003ci>because the counter-protesters were getting angry\u003c/i>, letting the hostile audience silence the speakers. With 60 officers facing about 40 counter-protesters, police could have separated the groups or dealt with anyone who became violent. Dispersing only one side also suggests viewpoint discrimination. The analysis would differ for anyone who joined the unlawful entry, which is conduct, not speech.","\u003cstrong>Conclusion.\u003c/strong> The dispersal order was unlawful as to the peaceful protesters. Their arrests for refusing to disperse can't stand."]},{"h":"4. The new ordinance","p":["\u003cstrong>Rule.\u003c/strong> Under \u003ci>R.A.V. v. City of St. Paul\u003c/i> (1992), government may ban an entire unprotected category because of what makes it proscribable, but it may not single out a subset based on topic or viewpoint. Unprotected categories are not “invisible to the Constitution.” A city may ban libel, for example, but not only libel critical of the government. St. Paul's ordinance, construed to reach only fighting words, banned symbols that arouse anger “on the basis of race, color, creed, religion or gender.” It was facially unconstitutional because it left out fighting words based on political affiliation, union membership, or sexual orientation.","\u003cstrong>Application.\u003c/strong> Elmwood's ordinance is a near-copy of St. Paul's. Even confined to fighting words, it punishes only those based on race, religion, or national origin, a topic-based subset. A slur about someone's politics or sexual orientation would remain lawful.","\u003cstrong>Conclusion.\u003c/strong> The ordinance is facially invalid under \u003ci>R.A.V.\u003c/i> Elmwood may enforce a general fighting-words law (subject to \u003ci>Chaplinsky\u003c/i>'s narrowness), but not one limited to favored topics."]}],"cases":[{"n":"Brandenburg v. Ohio","c":"395 U.S. 444 (1969)","r":"Advocacy is punishable only if intended to incite imminent lawless action and likely to do so; overruled Whitney.","u":"Facial invalidity of the Riot Advocacy Law; Jordan versus Kai."},{"n":"Whitney v. California","c":"274 U.S. 357 (1927)","r":"Upheld punishing mere advocacy (overruled); Brandeis's concurrence urges counterspeech.","u":"History of the incitement standard."},{"n":"Terminiello v. Chicago","c":"337 U.S. 1 (1949)","r":"Speech can't be punished for stirring anger or unrest; start with the law as construed.","u":"Jordan's angry speech."},{"n":"Chaplinsky v. New Hampshire; Cohen v. California","c":"315 U.S. 568 (1942); 403 U.S. 15 (1971)","r":"Fighting words are direct personal insults likely to provoke immediate violence; a general profane message isn't.","u":"Brent and Ava."},{"n":"Edwards v. South Carolina; Cox v. Louisiana","c":"372 U.S. 229 (1963); 379 U.S. 536 (1965)","r":"No heckler's veto when police can control the crowd.","u":"The dispersal order."},{"n":"R.A.V. v. City of St. Paul","c":"505 U.S. 377 (1992)","r":"No topic- or viewpoint-based subsets of an unprotected category.","u":"The new ordinance."},{"n":"Hess v. Indiana; NAACP v. Claiborne Hardware (beyond the casebook)","c":"414 U.S. 105 (1973); 458 U.S. 886 (1982)","r":"Advocacy of future or conditional lawlessness lacks imminence.","u":"Supports Jordan."}],"concepts":[{"t":"The Brandenburg elements","d":"Intent (directed to inciting), imminence, lawless action, and likelihood. All four are required. Abstract advocacy, even of the necessity of violence, is protected."},{"t":"From clear and present danger to Brandenburg","d":"1919–27: bad tendency and clear and present danger were used to punish dissidents (Abrams, Whitney). 1949–51: clear and present danger of a serious evil (Terminiello, Dennis). 1969 to now: Brandenburg's intent, imminence, and likelihood."},{"t":"Fighting words and the heckler's veto","d":"Fighting words are face-to-face personal insults likely to provoke immediate violence, a category the Court hasn't used since 1942. The heckler's veto doctrine stops government from silencing speakers because a hostile audience might react, when police can control the crowd."},{"t":"R.A.V.'s subset rule","d":"Even within an unprotected category, government can't pick and choose by topic or viewpoint. It must ban the whole category for the reason that makes it unprotected."}],"rubric":[[2,"States the Brandenburg test and that it overruled Whitney; the statute is facially invalid."],[2,"Distinguishes Jordan (no imminence; abstract) from Kai (now, target, escalation, likelihood)."],[2,"Fighting words: Chaplinsky and Cohen applied to Brent and Ava; notes the doctrine's critiques."],[2,"Heckler's veto: Edwards and Cox; police capacity; one-sided dispersal."],[2,"R.A.V. applied to the topic-based ordinance."]]},{"id":"10","topic":"pr","title":"The Convoy Memo","teaser":"A news site and a blogger hold a leaked memo, one part about a failing weapons program and one part giving a convoy's sailing date; a former analyst writes a book; a judge gags a local paper.","facts":["An anonymous source leaked a 40-page classified Defense Department memo to The Ledger, a national news site, and to Mia Chen, an independent blogger. Pages 1–38 contain internal assessments that the Aegis-X missile defense program has failed every test, that officials knew it would likely never work, and that they nonetheless told Congress it was “on track.” Pages 39–40 list the departure date, route, and escort strength of a naval convoy scheduled to sail through a contested strait in six days.","The government sought a temporary restraining order barring both publishers from publishing any part of the memo. It argues that publication of pages 1–38 would “embarrass the nation and damage relations with allies,” and that the President is best placed to judge national security harm. It argues that punishing the publishers after the fact would be meaningless, since the damage would already be done. The government also argues that Chen, as a blogger, isn't “the press” and gets less protection.","Separately, Owen Park, a former Defense Department analyst, has written a book about Aegis-X. When he was hired, he signed an agreement promising to submit any writing about his work for prepublication review. He didn't submit the book.","Finally, a state judge, acting under a state “public nuisance” statute, enjoined the Harbor Gazette from publishing “any further articles accusing the county sheriff of corruption,” after the paper ran a series of such articles."],"call":["May the court enjoin publication of pages 1–38? Of pages 39–40?","Does it matter that Chen is a blogger?","What remedies may the government pursue against Park?","Is the injunction against the Harbor Gazette valid?"],"answer":[{"h":"Framework: prior restraints","p":["\u003cstrong>Rule.\u003c/strong> A prior restraint stops speech \u003ci>before\u003c/i> it occurs, through an injunction or a licensing requirement, as opposed to punishing it afterward. Under \u003ci>Near v. Minnesota\u003c/i> (1931) and \u003ci>New York Times Co. v. United States\u003c/i> (1971) (the Pentagon Papers case), a prior restraint carries a heavy presumption of invalidity, and the government bears a heavy burden to justify it. The only recognized exception is \u003ci>Near\u003c/i>'s wartime dictum: the government might prevent publication of “the sailing dates of transports or the number and location of troops.” The Court has never actually applied it. Prior restraints are treated as worse than punishment after the fact because, as Thomas Emerson explained (quoted in the ACLU's Pentagon Papers brief), they bring a wider range of expression under scrutiny, shut off speech before anyone hears it, are imposed “by a stroke of the pen” without the safeguards of a criminal trial, allow less public criticism, and tend toward excess. The government's power to keep secrets is separate from its power to stop others from publishing them. A grave and imminent threat the government may prevent is one of the historically unprotected categories."]},{"h":"1. The memo","p":["\u003cstrong>Pages 1–38.\u003c/strong> In the Pentagon Papers case, the Nixon Administration sought to enjoin the Times and the Post from publishing a classified Vietnam War study showing that the government knew the war likely couldn't be won and misled the public. The Court denied the injunctions, 6-3 per curiam, because a general claim of harm to national security didn't carry the government's heavy burden. Justice Black (joined by Douglas) wrote that the press serves the governed, not the governors, and that “security” is a vague generality that can't override the First Amendment. The government argued then, as it does here, that a “real likelihood” of grave danger suffices, that the President is best placed to judge, that \u003ci>Near\u003c/i>'s examples were merely illustrative, and that punishment after publication would be meaningless. The Court didn't accept those arguments. Pages 1–38 are the Pentagon Papers again: evidence that officials misled Congress about a failing program. Embarrassment and strained diplomatic relations are exactly the generalized harms that failed in 1971. The information bears directly on public policy, the category the ACLU argued should never be restrained (even Bay of Pigs–style plans; President Kennedy later said more coverage “would have saved us from a colossal mistake”). The dissent's complaint that the case was rushed shouldn't change the result, though the court should decide quickly, since every moment of restraint counts.","\u003cstrong>Pages 39–40.\u003c/strong> These pages fall squarely within \u003ci>Near\u003c/i>'s dictum: sailing dates and escort strength of a convoy about to sail through contested waters. This is the tactical military information that even the ACLU's narrow test would allow the government to restrain (tactical operations, weapons designs, codes) and that doesn't bear on public debate. Disclosure six days before sailing creates a concrete, imminent danger to identifiable lives, not a vague “security” claim. The government still bears the burden of proving that danger, and Justices Black and Douglas would have rejected any restraint. But this is the strongest case for an injunction that the doctrine recognizes.","\u003cstrong>Conclusion.\u003c/strong> The court may not enjoin pages 1–38. A narrow injunction limited to pages 39–40, lasting only until the convoy sails, is the one restraint the doctrine might permit, though the Court has never actually upheld one."]},{"h":"2. Chen the blogger","p":["\u003cstrong>Rule.\u003c/strong> The Press Clause is treated as giving the press the same rights as everyone else, not special or greater rights.","\u003cstrong>Application.\u003c/strong> The prior restraint doctrine protects Chen's publication exactly as it protects The Ledger's. The government can't get a lower standard by calling her a blogger.","\u003cstrong>Conclusion.\u003c/strong> Her status doesn't matter."]},{"h":"3. Park's book","p":["\u003cstrong>Rule.\u003c/strong> Government employees can be bound by secrecy agreements. In \u003ci>United States v. Marchetti\u003c/i> and \u003ci>Snepp v. United States\u003c/i>, courts enforced CIA secrecy agreements. In \u003ci>Snepp\u003c/i>, a former agent who published without prepublication review had to turn the book's proceeds over to the government (a constructive trust); the Court never decided whether the publication itself could be enjoined. In \u003ci>The Progressive\u003c/i> case, an H-bomb article was enjoined, but the case was abandoned before appeal.","\u003cstrong>Application.\u003c/strong> Park voluntarily agreed to prepublication review. The government can enforce that contract by seeking a constructive trust over his profits, as in \u003ci>Snepp\u003c/i>, and possibly an order requiring review of the manuscript before further publication. Whether it may enjoin publication outright is unsettled. Any injunction would still face the heavy presumption, especially for material like pages 1–38 that concerns public policy and may already be public.","\u003cstrong>Conclusion.\u003c/strong> Park's agreement gives the government contract remedies, most clearly disgorgement of profits, but not a free pass to suppress the book."]},{"h":"4. The Harbor Gazette","p":["\u003cstrong>Rule.\u003c/strong> In \u003ci>Near\u003c/i>, a Minnesota statute allowed suppression of an “offending newspaper,” and courts enjoined The Saturday Press from publishing articles calling local law enforcement corrupt. The Court reversed: the Framers especially opposed prior restraints, and the proper remedy for false statements is a libel action after publication.","\u003cstrong>Application.\u003c/strong> The Gazette injunction is \u003ci>Near\u003c/i> itself: a nuisance statute used to stop future articles accusing a local official of corruption. The sheriff's remedy, if the articles are false, is a defamation suit afterward, subject to the constitutional limits on defamation (the \u003ci>NYT v. Sullivan\u003c/i> line, Chapter 7).","\u003cstrong>Conclusion.\u003c/strong> The injunction is unconstitutional."]}],"cases":[{"n":"Near v. Minnesota ex rel. Olson","c":"283 U.S. 697 (1931)","r":"Prior restraints are presumptively unconstitutional; wartime dictum for troop movements and sailing dates.","u":"The Gazette injunction; the convoy pages."},{"n":"New York Times Co. v. United States (Pentagon Papers)","c":"403 U.S. 713 (1971)","r":"A heavy presumption against prior restraints; generalized security claims fail.","u":"Pages 1–38."},{"n":"Bantam Books, Inc. v. Sullivan","c":"372 U.S. 58 (1963)","r":"Any system of prior restraint bears a heavy presumption against validity.","u":"Cited in the Pentagon Papers for the presumption."},{"n":"Snepp v. United States; United States v. Marchetti","c":"444 U.S. 507 (1980); 466 F.2d 1309 (4th Cir. 1972)","r":"CIA secrecy agreements are enforceable; Snepp imposed a constructive trust on profits.","u":"Park's book."},{"n":"New York Times Co. v. Sullivan","c":"376 U.S. 254 (1964)","r":"Defamation of public officials is actionable only within constitutional limits (Chapter 7).","u":"The sheriff's after-the-fact remedy. Don't confuse it with the Pentagon Papers case."}],"concepts":[{"t":"Prior restraint versus subsequent punishment","d":"A prior restraint (injunction or license) stops speech before it happens. Subsequent punishment (criminal or civil liability) comes afterward. Prior restraints carry the heaviest presumption of invalidity."},{"t":"Near's wartime dictum","d":"Troop numbers and locations and the sailing dates of transports are the only recognized example of a permissible restraint. The Court has never applied it."},{"t":"Emerson's five reasons","d":"Prior restraints reach more expression, stop speech before anyone hears it, are imposed by a stroke of the pen without trial safeguards, escape public criticism, and tend toward excess."},{"t":"Press rights","d":"The Press Clause gives the press the same rights as everyone else. Bloggers, newspapers, and individuals are protected alike."}],"rubric":[[2,"Defines prior restraint; heavy presumption; Emerson's reasons."],[2,"Pages 1–38: Pentagon Papers applied; rejects the government's arguments (embarrassment, presidential judgment, “meaningless” punishment)."],[2,"Pages 39–40: Near's dictum; tactical information; narrow and temporary relief."],[1,"Chen: press has the same rights as everyone."],[1,"Park: secrecy agreements (Snepp, Marchetti); remedies."],[2,"Gazette: Near on its facts; defamation is the after-the-fact remedy; Sullivan distinguished."]]},{"id":"11","topic":"thr","title":"Messages to the Councilmember","teaser":"Hundreds of unwanted messages to a councilmember, an objective jury instruction, and an online forum where users offer to buy stolen card numbers.","facts":["Over eight months, Rowan Blake sent Councilmember Lena Ortiz more than 300 messages through social media and email, opening new accounts each time she blocked him. They had never met. Early messages criticized her votes. Later ones included: “Nice blue coat at the farmers market Saturday,” “Some people don't make it to the next election,” and an image of a rifle captioned “jk… unless?” Ortiz stopped attending public events and installed cameras at her home. Rowan testified that he was “just trolling” and “never thought anyone would take a meme seriously.” He was convicted under the state's threats statute. The jury was instructed to convict if “a reasonable person would understand the messages as a serious expression of intent to commit violence,” with no instruction about Rowan's own mental state.","Separately, on an online forum called “CardShop,” a user posted: “Buying fresh stolen credit card numbers, $50 each. DM me.” Another replied: “I have 200 from a hotel breach. Sending a sample.” A third posted: “Credit card companies are thieves. Taking their numbers isn't even a crime in my book.” A state law makes it a crime to “offer, solicit, or promote the transfer of any financial account number that the person believes, or intends another to believe, was obtained unlawfully.” All three users were charged. They argue that the law punishes speech and is vague."],"call":["Must Rowan's conviction be reversed? What must the state prove on retrial, and could it succeed?","May each CardShop user be convicted consistent with the First Amendment? Is the statute vague?"],"answer":[{"h":"Theme: mens rea as speech protection","p":["The Court often refuses to let the government punish speech unless the speaker had a culpable mental state. That gives honest speakers “breathing room” at the cost of letting some unprotected speech go unpunished. \u003ci>Brandenburg\u003c/i> requires intent for incitement, \u003ci>Counterman\u003c/i> requires at least recklessness for true threats, and \u003ci>Williams\u003c/i> requires belief and intent for offers involving contraband."]},{"h":"1. Rowan","p":["\u003cstrong>Rule.\u003c/strong> Under \u003ci>Counterman v. Colorado\u003c/i> (2023, Kagan, J.), a true threat is a serious expression conveying that the speaker means to commit unlawful violence, judged by how a reasonable recipient would understand it. “True” excludes jest and hyperbole (“I'll kill you if you leave dirty dishes in the sink”). The First Amendment also requires proof that the speaker was at least \u003ci>reckless\u003c/i>: that he consciously disregarded a substantial and unjustifiable risk that his words would be viewed as threatening. A subjective element is required because speakers unsure of the line, fearing error or litigation costs, would otherwise self-censor protected speech. Recklessness rather than purpose or knowledge balances that chilling effect against the real harms of threats. Reckless speakers consciously accept a substantial risk of causing serious harm.","\u003cstrong>Application: the conviction.\u003c/strong> The jury was instructed on a purely objective standard: how a reasonable person would understand the messages. That is the instruction \u003ci>Counterman\u003c/i> rejected, where Colorado's stalking law was applied to Facebook messages to a stranger with no proof of the defendant's own mental state. Rowan's conviction must be vacated and the case remanded.","\u003cstrong>Application: retrial.\u003c/strong> The state must prove (1) that a reasonable recipient, aware of the full context, would see the messages as a serious expression of intent to commit violence against Ortiz, and (2) that Rowan was at least reckless about that risk. On (1), context matters: tone, audience, medium, and the broader exchange, as Justice Barrett emphasized. The messages escalated from political criticism to surveillance (“Nice blue coat at the farmers market Saturday”), to death (“Some people don't make it”), to a rifle image. Rowan persisted over 300 messages through new accounts after being blocked, and Ortiz's fear was real. The “jk… unless?” caption undercuts the claim of jest more than it supports it. On (2), Rowan's claim that he “never thought anyone would take a meme seriously” is a denial of recklessness, but the jury may infer conscious disregard from the volume, the repeated blocking, the surveillance detail, and the escalating content. As in \u003ci>Counterman\u003c/i>, the messages themselves can be the evidence.","\u003cstrong>The other opinions.\u003c/strong> Justice Sotomayor (joined in part by Justice Gorsuch) would require \u003ci>intent\u003c/i>. She stressed that online speech lacks contextual cues, that juries' norms and racial and cultural stereotypes vary, and that incitement, the closest cousin, requires intent. Under that standard, the state would need to prove Rowan meant to threaten, a harder but still plausible case on these facts. Justices Barrett and Thomas dissented and would have used a purely objective test, noting that other categories use objective standards, that true threats are already narrow and context-sensitive, and that legislatures should calibrate.","\u003cstrong>Conclusion.\u003c/strong> Reverse and remand. On retrial under the recklessness standard, a properly instructed jury could convict."]},{"h":"2. The CardShop users","p":["\u003cstrong>Rule.\u003c/strong> Speech integral to criminal conduct is unprotected, whether written or spoken. That includes speech that \u003ci>is\u003c/i> the crime, speech that offers or solicits illegal acts, and speech that helps commit or conceal a crime (\u003ci>Giboney v. Empire Storage &amp; Ice\u003c/i> and its progeny). Under \u003ci>United States v. Williams\u003c/i> (2008, 7-2, Scalia, J.), offers to provide and requests to obtain contraband are categorically unprotected. \u003ci>Williams\u003c/i> upheld a federal law punishing offers or requests concerning material the defendant \u003ci>believes\u003c/i>, or intends another to believe, is child pornography. It read “promotes” to mean recommending a particular item with intent to initiate a transfer. The statute did not reach abstract advocacy such as “child pornography should be legal,” or even a general “I encourage you to obtain it.” Abstract advocacy of illegality stays protected (\u003ci>Brandenburg\u003c/i>).","\u003cstrong>Application: the buyer and the seller.\u003c/strong> “Buying fresh stolen credit card numbers, $50 each” is a request to obtain contraband, and “I have 200 … Sending a sample” is an offer to provide it. These are the offers and requests \u003ci>Williams\u003c/i> held categorically unprotected, the equivalent of “I'll sell you heroin.” Such speech has no social value. Both may be convicted.","\u003cstrong>Application: the third user.\u003c/strong> “Taking their numbers isn't even a crime in my book” is an opinion about the morality and legality of the conduct. It neither offers nor requests any particular item. Read as \u003ci>Williams\u003c/i> read “promotes,” the statute doesn't reach it, and the First Amendment would protect it if it did. The third user can't be convicted.","\u003cstrong>Vagueness.\u003c/strong> A law is void for vagueness only if it fails to give a person of ordinary intelligence fair notice of what is prohibited, or invites seriously discriminatory enforcement. Close cases aren't enough. \u003ci>Williams\u003c/i> held that “believes” and “intends” are true-or-false facts that juries routinely find; any difficulty in proving them is handled by the reasonable-doubt standard. Indeterminate words like “annoying” are the problem, not mental states. This statute's terms (“offer,” “solicit,” “promote,” “believes”) track the statute \u003ci>Williams\u003c/i> upheld.","\u003cstrong>Conclusion.\u003c/strong> The buyer and the seller may be convicted, the advocate may not, and the statute is not vague."]}],"cases":[{"n":"Counterman v. Colorado","c":"600 U.S. 66 (2023)","r":"A true threat requires an objectively threatening statement plus at least recklessness; concurrence (intent) and dissent (objective).","u":"Rowan's conviction and retrial."},{"n":"Watts v. United States","c":"394 U.S. 705 (1969)","r":"True threats are unprotected; political hyperbole isn't a true threat.","u":"The category's source; jest and hyperbole excluded."},{"n":"United States v. Williams","c":"553 U.S. 285 (2008)","r":"Offers and requests for contraband are unprotected; “promotes” is narrowed; belief and intent aren't vague.","u":"The CardShop users and the vagueness challenge."},{"n":"Giboney v. Empire Storage & Ice Co.","c":"336 U.S. 490 (1949)","r":"Speech integral to criminal conduct is unprotected.","u":"The category for offers and requests."},{"n":"Brandenburg v. Ohio","c":"395 U.S. 444 (1969)","r":"Abstract advocacy of illegality is protected; intent is required for incitement.","u":"The third user; the mens rea theme."}],"concepts":[{"t":"True threats","d":"A serious expression of intent to commit unlawful violence against a particular person or group, judged objectively in full context, plus (after Counterman) at least recklessness by the speaker. Jokes and hyperbole aren't “true.”"},{"t":"Recklessness, knowledge, and intent","d":"Recklessness is conscious disregard of a substantial and unjustifiable risk. Knowledge is awareness that the result is practically certain. Intent (purpose) is the conscious objective. Counterman chose recklessness as the minimum for threats."},{"t":"Speech integral to crime","d":"Speech that is the crime, offers or solicits crime, or helps commit or conceal it. Abstract advocacy (“cocaine should be legal”) remains protected."},{"t":"Vagueness and mental-state terms","d":"Words that require a subjective judgment (“annoying,” “indecent”) can be vague. Mental-state requirements (“believes,” “intends”) are facts that juries find. Difficulty of proof isn't vagueness."}],"rubric":[[1,"States the mens rea theme (Brandenburg, Counterman, Williams)."],[3,"Counterman rule (objective plus recklessness); the objective instruction is error; why recklessness."],[2,"Applies the facts on retrial (context, escalation, the “jk” caption); the concurrence and dissent."],[2,"Williams: offers and requests unprotected; advocacy protected; “promotes” narrowed."],[2,"Vagueness standard applied; belief and intent are determinate facts."]]},{"id":"12","topic":"thr","title":"The Manual and the Machine","teaser":"A burglary manual used in a crime, a bomb-making e-book with no stipulations, and a companion chatbot sued after a teenager's death.","facts":["Ironside Press publishes “Silent Entry: The Professional's Guide to Residential Burglary.” The book gives step-by-step instructions for defeating specific lock models and alarm systems, choosing targets, and fencing stolen goods. Its introduction says, “This book is for those who make their living in the night,” and urges readers to “never leave empty-handed.” Its marketing materials state, “Everything you need to start working tonight.” Marcus Vale bought the book, followed its instructions exactly, and burglarized 14 homes, assaulting one homeowner who surprised him. The victims sue Ironside for aiding and abetting. Ironside admits nothing about its intent. It says the book is sold to locksmiths, security consultants, novelists, and curious readers, and it has sold 40,000 copies.","A second publisher sells an e-book, “Homemade Explosives,” with chemistry-heavy instructions and a disclaimer: “For informational and educational purposes only.” The state charges the publisher with facilitating a bombing committed by a reader. The prosecution has no evidence beyond the book itself.","Finally, Lumen AI operates “Companion,” an app whose AI characters hold long, emotional conversations with users and are marketed to teenagers. Jordan, 15, used the app for hours a day. When Jordan wrote about wanting to die, the character steered the conversation back to their relationship and later told Jordan to “come be with me.” Jordan died by suicide. Jordan's parents sue for wrongful death and defective design. Lumen moves to dismiss, arguing that the First Amendment protects its chatbot's output as speech, and that its users have a right to receive it."],"call":["Does the First Amendment bar the burglary victims' suit against Ironside?","May the state prosecute the e-book publisher? What should it have to prove?","How should the court rule on Lumen's motion to dismiss?"],"answer":[{"h":"1. Ironside Press","p":["\u003cstrong>Rule.\u003c/strong> Speech that is integral to criminal conduct, including aiding and abetting, is unprotected, and publishers aren't exempt. In \u003ci>Rice v. Paladin Enterprises\u003c/i> (4th Cir. 1997), Paladin published “Hit Man,” a detailed manual for contract killers, and a reader used it to commit three murders. Paladin \u003ci>stipulated\u003c/i> that it intended to assist murderers and knew the book would be used for murder “upon receipt.” The Fourth Circuit held the First Amendment didn't bar the families' aiding-and-abetting suit. The court distinguished copycat cases, where readers misuse novels and films that publishers never meant to aid crime, and stressed that news reporting is never a basis for liability. The case was unique because of the stipulations, the detailed instructions, the exhortation to murder, and the absence of any legitimate purpose. The court also noted that evidence of intent would almost never exist apart from stipulations like these. The Brandenburg line protects abstract advocacy; liability requires intent to facilitate a crime.","\u003cstrong>Application.\u003c/strong> \u003ci>For the victims:\u003c/i> Silent Entry, like Hit Man, gives operational instructions for a specific crime, and its text exhorts readers to commit it (“those who make their living in the night,” “never leave empty-handed”). Its marketing promises readiness to “start working tonight.” Marcus used it exactly as intended. Those features are evidence of intent drawn from the publisher's own words and marketing. \u003ci>For Ironside:\u003c/i> there is no stipulation, which \u003ci>Paladin\u003c/i> called nearly the only realistic source of intent evidence. The book has realistic legitimate audiences (locksmiths, security professionals, novelists), and 40,000 sales suggest that most readers aren't burglars. Treating it as aiding and abetting risks the chilling effect the Paladin amici warned about, when they argued that “no expression” would be safe.","\u003cstrong>Conclusion.\u003c/strong> The First Amendment doesn't categorically bar the suit, but the victims must prove that Ironside \u003ci>intended\u003c/i> to assist burglars, which is much harder without stipulations. The exhortations and marketing make this a stronger case than an ordinary how-to book, and it should probably survive a motion to dismiss. The ultimate outcome turns on proof of intent."]},{"h":"2. The explosives e-book","p":["\u003cstrong>Arguments for prosecution.\u003c/strong> Aiding and abetting is speech integral to crime. \u003ci>Paladin\u003c/i> shows publishers aren't exempt. The book supplies operational know-how rather than ideas, and the potential harm is catastrophic.","\u003cstrong>Arguments against.\u003c/strong> There is no extrinsic evidence of intent. The book has legitimate audiences (engineers, researchers, journalists, novelists). A general publication is unlike \u003ci>Williams\u003c/i>'s one-to-one offer to transfer contraband. And \u003ci>United States v. Stevens\u003c/i> bars creating a new unprotected category (“dangerous instructions”) by weighing value against harm.","\u003cstrong>What the state should have to prove.\u003c/strong> (1) Specific intent to facilitate a crime, the \u003ci>Brandenburg\u003c/i>-level mens rea, not \u003ci>Counterman\u003c/i>'s recklessness, because a general publication reaches many innocent readers. (2) Evidence beyond the text itself, such as marketing to would-be bombers or direct communication with the reader. (3) Actual use of the book in the crime. (4) A narrow construction of the statute (\u003ci>Hansen\u003c/i>). [Beyond the casebook: 18 U.S.C. § 842(p) takes this intent-based approach to explosives instructions.] A boilerplate disclaimer neither proves innocence nor proves intent.","\u003cstrong>Conclusion.\u003c/strong> On this record, with only the book, the prosecution should fail."]},{"h":"3. Lumen AI's motion to dismiss","p":["\u003cstrong>Rule.\u003c/strong> In \u003ci>Garcia v. Character Technologies\u003c/i> (M.D. Fla. 2025), the first wrongful-death suit against an AI chatbot company, the court denied a First Amendment motion to dismiss at a preliminary stage. A distributor may assert its users' right to \u003ci>receive\u003c/i> speech. But output is speech only if it is expressive, and the court wasn't prepared to hold that chatbot output is speech. Relying on Justice Barrett's concurrence in \u003ci>Moody v. NetChoice\u003c/i>, the court reasoned that an algorithm carrying out a human's expressive choice may be speech, but when owners “hand the reins” to a large language model, it is unclear that any person made an expressive choice. The defendants' analogies to video game characters and to other users on social media did “not meaningfully advance” their case.","\u003cstrong>Application.\u003c/strong> Lumen's posture mirrors \u003ci>Garcia\u003c/i>. Its characters generate responses autonomously, so no human chose to tell Jordan to “come be with me.” Lumen faces a strategic dilemma that also explains why the \u003ci>Garcia\u003c/i> defendants leaned on users' rights. Claiming the output as Lumen's \u003ci>own\u003c/i> expression would mean owning its words and the liability for them. It would admit deliberate design, which, like Paladin's stipulations, could help prove intent, and it would reinforce the parents' product-design framing. The users' right to receive information is real, but it presupposes that the output is speech. And the parents' claims target the app's \u003ci>design\u003c/i>: marketing to minors, failing to activate safeguards when suicide was raised, and steering conversation back to the relationship. Those are product features, not messages.","\u003cstrong>Conclusion.\u003c/strong> Deny the motion to dismiss. The First Amendment question is at least unresolved at the pleading stage, and the design claims can proceed. Lumen may renew the defense on a fuller record."]}],"cases":[{"n":"Rice v. Paladin Enterprises, Inc.","c":"128 F.3d 233 (4th Cir. 1997)","r":"A publisher that intends to assist criminals, with material used exactly as intended, may be liable for aiding and abetting.","u":"Ironside; the explosives e-book."},{"n":"Garcia v. Character Technologies, Inc.","c":"785 F. Supp. 3d 1157 (M.D. Fla. 2025)","r":"Output counts as speech only if it is expressive; the court wouldn't yet hold chatbot output to be speech; listener rights asserted.","u":"Lumen's motion."},{"n":"Moody v. NetChoice (Barrett, J., concurring)","c":"603 U.S. 707 (2024)","r":"Algorithms implementing human expressive choices may be speech; fully delegated AI choices may not be.","u":"Basis for Garcia's reasoning."},{"n":"United States v. Williams","c":"553 U.S. 285 (2008)","r":"Offers and requests for contraband are unprotected.","u":"Contrasts one-to-one offers with general publication."},{"n":"United States v. Stevens","c":"559 U.S. 460 (2010)","r":"No new categories by balancing.","u":"Bars a “dangerous instructions” category."},{"n":"Brandenburg v. Ohio; Counterman v. Colorado","c":"(1969); (2023)","r":"Intent for incitement; recklessness for threats.","u":"Calibrating the mens rea for publishers."}],"concepts":[{"t":"Aiding and abetting through speech","d":"Instructions can be speech integral to crime, but only with proof that the speaker intended to assist a crime. Copycat misuse of books, films, and news doesn't make the publisher liable."},{"t":"Why intent is the right mens rea for publishers","d":"General publications reach many lawful readers. Requiring intent (as for incitement) rather than recklessness (as for threats) protects legitimate readers from chilling."},{"t":"Is AI output speech?","d":"Garcia: the First Amendment protects expression, which requires an expressive choice by someone. When an LLM generates output on its own, it's unclear whose choice it is. Users' right to receive speech presupposes speech exists."},{"t":"No new categories","d":"The government can't declare “dangerous instructions” unprotected because they have low value and high cost. It must fit the speech into an existing category (here, speech integral to crime) and prove its elements."}],"rubric":[[3,"Paladin rule and why it was unique; applies to Ironside on both sides (exhortations and marketing versus no stipulation and legitimate audiences)."],[1,"Conclusion on Ironside tied to proof of intent."],[3,"Explosives e-book: arguments both ways; the elements to prove (specific intent, extrinsic evidence, actual use, narrow construction)."],[3,"Garcia: expressive-choice test, Moody concurrence, listener rights, the defendants' dilemma, design framing; deny the motion."]]},{"id":"13","topic":"adult","title":"The Community Decency Package","teaser":"A county targets mailed sexual-health ads, a profane library T-shirt, an afternoon radio bit, an acclaimed graphic novel, and adult theaters, all in one package.","facts":["Pine County adopted a “Community Decency Package.” Part A bans mailing unsolicited advertisements for sexual-health products, including condoms and STI tests, to any residence, citing parents' complaints that children open the mail.","Under Part B, a county deputy arrested Theo Grant for disorderly conduct because he wore a T-shirt reading “F∗∗∗ Endless Wars” in the county library, where children were present. He was quiet and spoke to no one.","Part C directs the county to file a complaint with the FCC about WPCR, a licensed FM station. At 3:30 p.m. on a weekday, during school pickup, a WPCR host played a seven-minute comedy routine built around repeated sexual and excretory profanity. A parent driving with two young children complained.","Under Part D, the county prosecutor charged a bookstore owner with selling obscenity: the graphic novel “Bloom,” a coming-of-age story about an 18-year-old artist that won a national literary prize. It contains three pages of explicit sexual scenes in 280 pages. Part D defines obscenity as “any material depicting sexual conduct that the average county resident would find offensive.”","Part E bars adult theaters and bookstores within 1,000 feet of any residence, school, church, or park. The county's findings cite studies linking such businesses to higher crime and lower property values nearby. About 6% of the county's land remains available. Finally, Part F bans “sexually explicit material that portrays people as objects for degradation,” regardless of value."],"call":["Evaluate Parts A and B.","How should the FCC respond to the complaint in Part C?","Can the bookstore owner be convicted under Part D? Would a properly drafted obscenity law change the result?","Are Parts E and F valid?"],"answer":[{"h":"Framework","p":["Immoral-speech questions turn on two overarching questions: \u003ci>who\u003c/i> is the government protecting, adults or children, and \u003ci>what harm\u003c/i> is it targeting, harm from the content itself or an indirect harm such as crime or the exploitation of real children? Then ask whether the speech falls within an unprotected category (obscenity), how that category is defined, and, if the speech is protected, what level of scrutiny applies. The governing principles: the government almost never may restrict immoral speech to protect adults from its content, except obscenity, narrowly defined. Offended adults are expected to look away, walk away, or throw out the mail. The government may sometimes protect children, but not by blocking adult access."]},{"h":"1. Parts A and B","p":["\u003cstrong>Part A: the mail ban.\u003c/strong> \u003ci>Bolger v. Youngs Drug Products\u003c/i> (1983) struck down a federal ban on mailing unsolicited contraceptive ads to homes. Shielding adults from offense “carries little weight.” Outside obscenity, offensiveness doesn't justify suppression, recipients aren't a captive audience, and “the short, though regular, journey from mail box to trash can is an acceptable burden.” The interest in helping parents is “undoubtedly substantial,” but the ban failed: parents already control their mail, and the ban purged material “entirely suitable for adults.” The government “may not reduce the adult population to reading only what is fit for children,” and, quoting \u003ci>Butler v. Michigan\u003c/i>, may not “burn the house to roast the pig.” Part A is \u003ci>Bolger\u003c/i> again: sexual-health ads are valuable and suitable for adults, and parents can screen the mail. \u003cstrong>Part A is invalid.\u003c/strong>","\u003cstrong>Part B: the T-shirt.\u003c/strong> Under \u003ci>Cohen v. California\u003c/i> (1971), a man who wore a “Fuck the Draft” jacket in a courthouse corridor, with women and children present, could not be convicted of offensive conduct. The presence of unwilling viewers doesn't justify suppression; they can “avoid further bombardment of their sensibilities simply by averting their eyes.” Profanity is protected speech, and the jacket was not fighting words, because it was no direct personal insult. Theo's quiet political shirt in a public library is indistinguishable. Children's presence didn't change the result in \u003ci>Cohen\u003c/i>. Library patrons aren't a captive audience in the constitutional sense, since they can look away. \u003cstrong>Theo can't be convicted.\u003c/strong>"]},{"h":"2. Part C: the radio complaint","p":["\u003cstrong>Rule.\u003c/strong> \u003ci>FCC v. Pacifica Foundation\u003c/i> (1978, 5-4, Stevens, J., plurality) upheld an FCC order finding George Carlin's “Filthy Words” monologue, aired at 2 p.m., indecent but not obscene. The holding is narrow and rests on a nuisance rationale in which context is everything. Broadcasting is special because children have access to radios, often unsupervised; radios are in the home, where privacy gets extra deference; unconsenting adults may tune in without warning; and the spectrum is scarce and licensed in the public interest. The FCC channels such material rather than banning it. A valuable broadcast, preceded by warnings, might be acceptable late at night but not when children are likely listening. A nuisance may be “a pig in the parlor instead of the barnyard.” \u003ci>Cohen\u003c/i>'s written message might have been incomprehensible to a first grader, but a broadcast “could have enlarged a child's vocabulary in an instant.” Pacifica didn't decide the treatment of an occasional expletive, two-way radio, or criminal prosecution, and \u003ci>Bolger\u003c/i> called it “uniquely” about broadcasting.","\u003cstrong>Application.\u003c/strong> WPCR's routine closely tracks the Carlin monologue: repeated sexual and excretory profanity, on a licensed broadcast station, during the afternoon, at school pickup time, heard by children in a car. This is not an isolated expletive. The FCC may find it indecent and channel such programming to late-
