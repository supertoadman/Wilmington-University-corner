<style>
/* Layout: one reading column of question cards, each with a case illustration, under a score-and-controls bar. */
:root {
  --bg: #EDF0F4; --surface: #FFFFFF; --ink: #17202B; --muted: #586474; --line: #D3DAE3;
  --accent: #5b4b8a; --accent-soft: #ECE8F5; --on-accent: #FFFFFF;
  --ok: #1D7549; --ok-soft: #E0F1E7; --bad: #AD2A20; --bad-soft: #F8E2DF;
  --f-display: "Libre Caslon Display", "Georgia", serif;
  --f-body: "Source Serif 4", "Georgia", "Times New Roman", serif;
  --f-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", "Consolas", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F141B; --surface: #171F29; --ink: #E4E9F0; --muted: #98A4B3; --line: #2A3542;
  --accent: #b9a8ea; --accent-soft: #2A2440; --on-accent: #0F141B;
  --ok: #62C391; --ok-soft: #16301F; --bad: #F18D83; --bad-soft: #3A1D1A; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0F141B; --surface: #171F29; --ink: #E4E9F0; --muted: #98A4B3; --line: #2A3542;
  --accent: #b9a8ea; --accent-soft: #2A2440; --on-accent: #0F141B;
  --ok: #62C391; --ok-soft: #16301F; --bad: #F18D83; --bad-soft: #3A1D1A; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; }

header.top { padding-block: 32px 16px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(2rem, 6vw, 2.9rem); line-height: 1.05; margin: 6px 0 10px; text-wrap: balance; }
.lede { color: var(--muted); max-width: 60ch; margin: 0; }

.bar { border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; flex-direction: column; gap: 10px; padding-block: 12px; }
.score { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; font-variant-numeric: tabular-nums; }
.score b { font-family: var(--f-mono); font-weight: 500; font-size: 18px; }
.score span { color: var(--muted); font-size: 13px; }
.meter { flex: 1 1 140px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; align-self: center; min-width: 100px; }
.meter i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }

.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.row .lbl { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.chip { font: 500 13px var(--f-ui); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn { font: 600 13px var(--f-ui); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn:hover, .chip:hover { border-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.toast { font-size: 13px; color: var(--ok); min-height: 1em; }

main { padding-block: 20px 60px; display: flex; flex-direction: column; gap: 14px; }
.chhead { font-family: var(--f-display); font-size: 1.5rem; margin: 18px 0 0; padding-bottom: 6px; border-bottom: 1px solid var(--line); text-wrap: balance; }
.chhead small { display: block; font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.q { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; min-width: 0; }
.q .meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .04em; color: var(--muted); margin-bottom: 8px; }
.q .meta .kind { color: var(--accent); }
.q .stem { font-family: var(--f-body); font-size: 17px; line-height: 1.5; white-space: pre-line; margin: 0 0 12px; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; text-align: left; width: 100%; font: 400 15px/1.45 var(--f-ui); color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 9px 12px; cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt .ltr { font-family: var(--f-mono); font-weight: 500; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-size: 12px; }
.opt:disabled { cursor: default; }
.opt.correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.correct .ltr { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .ltr { background: var(--bad); border-color: var(--bad); color: var(--surface); }
/* Cross-out: the toggle beside each option strikes it through while you work the question. */
.orow { display: flex; gap: 6px; }
.orow .opt { flex: 1 1 0; min-width: 0; }
.opt.out > span:last-child { text-decoration: line-through; color: var(--muted); }
.xo { flex: none; width: 38px; display: grid; place-items: center; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 0; cursor: pointer; }
.xo:hover { border-color: var(--accent); color: var(--ink); }
.xo[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.xo svg { width: 16px; height: 16px; }
.explain { margin-top: 12px; padding: 10px 12px; border-left: 3px solid var(--ok); background: var(--bg); border-radius: 0 6px 6px 0; font-size: 14px; }
.explain.miss { border-left-color: var(--bad); }
.explain strong { font-weight: 600; }
.explain .whyhd { margin: 10px 0 4px; font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.explain .whyno { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.empty { color: var(--muted); text-align: center; padding: 40px 0; }
@media (prefers-reduced-motion: reduce) { .meter i { transition: none; } }

/* Illustrations: one scene per case or topic, drawn in the page's own colors. */
:root { --il-ink: var(--ink); --il-acc: var(--accent); --il-soft: var(--accent-soft); --il-gold: #C49A3A; --il-paper: var(--surface); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --il-gold: #D9B45A; } }
:root[data-theme="dark"] { --il-gold: #D9B45A; }
.qbody { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 4px 18px; align-items: start; }
.qbody .stem { grid-column: 1; }
.fig { grid-column: 2; grid-row: 1 / span 2; margin: 0; }
.ill { display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; fill: none; overflow: hidden; }
.ill .o { stroke: var(--il-ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ill .t { stroke: var(--il-ink); stroke-width: 1.4; stroke-linecap: round; opacity: .55; }
.ill .a { fill: var(--il-acc); } .ill .s { fill: var(--il-soft); } .ill .g { fill: var(--il-gold); } .ill .w { fill: var(--il-paper); } .ill .i { fill: var(--il-ink); }
.ill text { font: 700 9px var(--f-ui); fill: var(--il-paper); }
.ill text.dark { fill: #17202B; }
.ill .plate { font: 700 17px var(--f-mono); fill: var(--il-acc); letter-spacing: .04em; }
.ill .motto { font: 700 7px var(--f-ui); fill: var(--il-ink); letter-spacing: .08em; }
.fig figcaption { font-family: var(--f-mono); font-size: 11px; line-height: 1.35; color: var(--muted); margin-top: 6px; text-wrap: balance; }
.fig.veil .ill > g { filter: blur(7px); opacity: .45; }
.fig.veil figcaption { font-family: var(--f-ui); font-style: italic; }
.opts { grid-column: 1; }
.pick { font: 500 13px var(--f-ui); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; max-width: 100%; }
@media (max-width: 600px) {
  .qbody { grid-template-columns: minmax(0, 1fr); }
  .fig { grid-column: 1; grid-row: auto; width: 170px; margin: 0 0 4px; }
  .opts { grid-column: 1; }
}
</style>

{"c":2,"k":"hold","id":"smith","q":"Which statement about Employment Division v. Smith is accurate?","o":["Belief is absolutely protected; conduct is protected only from laws targeting it as religious","Every substantial burden on religious conduct triggers strict scrutiny unless Congress says otherwise","Sacramental peyote use was exempt because the ritual was sincere and central","Its rule applies only to criminal laws, not to civil regulations like licensing"],"e":"Smith denied the exemption from Oregon’s drug law. Strict scrutiny returned only by statute, through RFRA.","v":false},
{"c":2,"k":"hold","id":"lukumi","q":"Which statement about Church of the Lukumi Babalu Aye v. City of Hialeah is accurate?","o":["The ordinances were underinclusive for both animal cruelty and public health","The ordinances were valid, because animal cruelty laws are neutral by their nature","The ordinances got rational basis, because they never named any religion","The ordinances were valid as emergency measures passed after a lease"],"e":"A law can target religion without naming it. Exemptions for comparable secular killings showed the targeting.","v":false},
{"c":2,"k":"hold","id":"masterpiece","q":"Which statement about Masterpiece Cakeshop is accurate?","o":["It was narrow; states can generally protect gay persons’ equal access to goods","It gave bakers a free-speech right to refuse any wedding cake they disapprove of","It held Colorado’s antidiscrimination law facially invalid as applied to shops","It held a vendor’s sincere belief always outweighs a customer’s equal rights"],"e":"The Court set aside the order for hostility and left the larger clash between antidiscrimination law and the First Amendment unresolved.","v":false},
{"c":2,"k":"hold","id":"fulton","q":"Which statement about Fulton v. City of Philadelphia is accurate?","o":["The Court ruled for the agency without overruling Smith","The Court overruled Smith and returned to case-by-case balancing","The Court held the referral policy neutral and generally applicable","The Court ordered the city to certify only the agency’s chosen families"],"e":"The case turned on the contract’s discretionary exemption system, which made the policy not generally applicable.","v":false},
{"c":2,"k":"hold","id":"tandon","q":"Which statement about Tandon v. Newsom is accurate?","o":["It granted an injunction pending appeal; losing free exercise even briefly is irreparable","It upheld the limits, accepting the district court’s finding that homes were the riskier setting","It held that worship at home gets less protection than worship in a church building","It held that pandemic rules get rational basis review as emergency health measures"],"e":"Losing free exercise rights “for even minimal periods of time” is irreparable harm.","v":false},
{"c":2,"k":"hold","id":"carson","q":"Which statement about Carson v. Makin is accurate?","o":["The exclusion failed even though the money would pay for religious instruction","The exclusion survived because the money would pay for religious instruction","Every state must now fund religious schools, whether or not it funds private ones","The tuition program was a public-education benefit Maine could keep secular"],"e":"Carson went past Trinity Lutheran and Espinoza on use: what the money buys doesn’t matter once the state subsidizes private schools.","v":false},
{"c":2,"k":"why","id":"smith","q":"Why did Smith say Barnette didn’t help religious claimants seeking exemptions from neutral laws?","o":["Barnette was really a speech case, decided on free-speech grounds","Barnette had been limited to wartime by later decisions","Barnette involved a federal law rather than a state law","Barnette protected adults, while Smith involved schoolchildren and parents"],"e":"Smith used Barnette and Yoder as hybrid-rights examples: religion paired with speech or parental rights.","v":false},
{"c":2,"k":"why","id":"lukumi","q":"Why were the Lukumi ordinances underinclusive as animal cruelty laws?","o":["Fishing, pest extermination, euthanasia, research, and hunting were allowed","The city banned advertising sacrifices but never banned the sacrifices themselves","Cruelty laws can never reach religious rituals of any kind","The penalties were too small to deter anyone from killing animals"],"e":"The public-health rationale failed the same way: hunters’ carcasses and restaurant garbage posed the same risks but were unregulated.","v":false},
{"c":2,"k":"why","id":"masterpiece","q":"Why was the commission’s hostility enough to set aside its order without resolving the larger conflict?","o":["The claimant was owed neutral treatment, and a hostile hearing denied it","The hostility proved the law itself was not generally applicable on its face","The hostility showed that the couple had suffered no real injury","The commission lacked jurisdiction over bakeries in the first place"],"e":"Even a neutral law must be applied neutrally. The unequal treatment of three other bakers confirmed the problem.","v":false},
{"c":2,"k":"why","id":"fulton","q":"Why did the city’s interest in avoiding liability fail in Fulton?","o":["It was speculative","It wasn’t a legitimate government interest","The city had waived its immunity by contract","Courts never weigh liability in strict scrutiny"],"e":"Strict scrutiny asks about the interest in denying this claimant an exemption, and a speculative risk doesn’t meet that burden.","v":false},
{"c":2,"k":"why","id":"tandon","q":"What did the Tandon dissent say the district court had found about at-home gatherings?","o":["Homes were riskier: longer interactions, smaller spaces, and less masking","Homes were safer than stores, so the state had treated worship too harshly","Homes and salons posed identical risks under every precaution studied","No evidence existed either way, so the state could choose either rule"],"e":"The dissent called the comparison to salons “apples and watermelons” and said at-home secular gatherings were the right comparator.","v":false},
{"c":2,"k":"why","id":"carson","q":"According to Carson, what options did Maine still have?","o":["Expand public schools, add busing or tutoring, or run its own boarding schools","Fund only those religious schools that agree to adopt the state curriculum in full","Exclude schools whose religious teaching it finds discriminatory","Pay religious schools for secular subjects like math, but not for religion"],"e":"What Maine can’t do is exclude religious schools from the tuition benefit it chose to offer. States may keep their own public schools strictly secular.","v":false},
{"c":2,"k":"det","id":"smith","q":"Even under Smith, which of these may government never do?","o":["Take sides in religious controversies","Enforce drug laws against sacramental use","Require all businesses to close on Sundays","Draft conscientious objectors in wartime"],"e":"Smith’s list also bars regulating belief as such, compelling affirmation, punishing doctrines as false, and status-based disabilities.","v":false},
{"c":2,"k":"det","id":"lukumi","q":"In the casebook’s neutrality synthesis, which case is paired with Lukumi as the contrast, a law that is neutral and generally applicable?","o":["Employment Division v. Smith","Tandon v. Newsom","Fulton v. City of Philadelphia","Carson v. Makin"],"e":"Smith’s across-the-board drug ban had no exemptions. Lukumi’s ordinances exempted almost every secular killing.","v":false},
{"c":2,"k":"det","id":"masterpiece","q":"Which earlier case did Masterpiece cite for the principle that government can’t decide what is “offensive”?","o":["West Virginia State Board of Education v. Barnette","Employment Division, Department of Human Resources of Oregon v. Smith","Cohen v. California","Wisconsin v. Yoder"],"e":"Barnette: no official may prescribe what shall be orthodox. The commission had treated some objections as offensive and others as acceptable.","v":false},
{"c":2,"k":"det","id":"fulton","q":"What did Philadelphia’s foster care contract give the Commissioner in Fulton?","o":["Sole discretion to grant exceptions to the policy","Power to certify foster parents without review","Authority to end any contract for any reason","A duty to refer every child to the nearest licensed agency"],"e":"That discretion, not any exemption actually granted, defeated general applicability.","v":false},
{"c":2,"k":"det","id":"tandon","q":"In Tandon, which activities could exceed California’s three-household limit?","o":["Hair salons, retail stores, movie theaters, and indoor restaurants","Only grocery stores, pharmacies, and hospitals","Outdoor protests and political rallies of any size","Schools, day-care centers, youth sports leagues, and summer camps"],"e":"The majority used these comparators; the dissent said at-home secular gatherings, treated identically, were the right ones.","v":false},
{"c":2,"k":"det","id":"carson","q":"In Trinity Lutheran, the first case in the funding trilogy with Carson, what was the church-run preschool denied?","o":["A grant to resurface its playground","A tax-credit scholarship for its students","Tuition payments for rural families","A permit to expand its building"],"e":"Excluding an otherwise eligible recipient solely because it was religious was “odious to our Constitution.”","v":false},
{"c":2,"k":"apply","id":"smith","q":"A state bans alcohol for anyone under 21, with no exemptions of any kind. A 19-year-old wants to drink sacramental wine at services. Under the Free Exercise Clause alone, what result?","o":["No exemption is required: the law is neutral and generally applicable","An exemption is required, because the sacramental use is sincere","An exemption is required unless the state proves a compelling interest","An exemption is required, because the law burdens worship itself"],"e":"Smith controls. Only a statute could change the result: RFRA binds the federal government, and some states have their own versions.","v":false,"w":["Sincerity is the threshold, not the test. Smith denied an exemption despite sincere sacramental peyote use.","That is strict scrutiny, which Smith rejected for neutral, generally applicable laws.","A burden on worship is still incidental if the law doesn’t target religion and has no secular exemptions."]},
{"c":2,"k":"apply","id":"lukumi","q":"After a Buddhist group announces a ritual releasing captive birds, a town bans “releasing animals into the wild” but exempts hunting dogs, falconry, pest-control relocations, and wildlife rehabilitators. What result?","o":["Strict scrutiny under Lukumi: the exemptions suggest a religious gerrymander","Rational basis under Smith, because the ban never mentions religion","No scrutiny, because releasing birds isn’t a recognized religious exercise at all","Intermediate scrutiny, because the ban regulates conduct, not belief"],"e":"The timing and the exemptions leave comparable secular releases untouched, so the law isn’t neutral or generally applicable. It will likely fail strict scrutiny as underinclusive.","v":false,"w":["A law can fail neutrality without naming religion. Exemptions that spare comparable secular conduct show the targeting.","Beliefs need not be logical or comprehensible to others; a sincere ritual is religious exercise.","Free Exercise has no intermediate tier. It is Smith’s rule or strict scrutiny."]},
{"c":2,"k":"apply","id":"masterpiece","q":"A state board denies a Muslim artist’s request to decline certain religious imagery work. At the hearing a member calls her faith “a cover for bigotry,” and no one objects; a secular artist who refused similar work was cleared. Best answer?","o":["The decision likely violates Free Exercise: hostile, unequal application","The decision is valid, because the state’s licensing law is neutral on its face","The decision is valid, because one member’s remarks can’t taint a board","She wins only if she proves the law was enacted to target her religion"],"e":"Masterpiece: hostility in adjudication plus worse treatment than a comparable secular objector violates the Free Exercise Clause.","v":false,"w":["A facially neutral law must also be applied neutrally. Masterpiece set aside an order under a neutral law.","Masterpiece relied on commissioners’ remarks that went unchallenged. Disparagement from the decisionmaker counts.","No targeting at enactment is required. Hostility in application is its own way of failing neutrality."]},
{"c":2,"k":"apply","id":"fulton","q":"A county contracts with private officiants for courthouse weddings. Each must perform every couple’s ceremony, but the clerk may grant “exceptions for good cause” at her discretion. A priest asks for an exception, and his contract is ended. What is the key first step?","o":["The discretionary exceptions make the rule not generally applicable, so strict scrutiny applies","The rule is neutral, so Smith ends the case unless an exception was actually granted before","The priest must first show the clerk granted exceptions to secular officiants","The court must balance the priest’s burden against the couples’ dignity interests"],"e":"Fulton: a formal system of individualized exemptions invites the government to decide which reasons are worthy, even if never used.","v":false,"w":["Fulton held that an unused exemption power still counts. No exception need ever have been granted.","Comparators matter under Tandon. Under Fulton, the discretionary system alone is enough.","Strict scrutiny isn’t open balancing. It asks whether the county has a compelling interest in denying this claimant an exception."]},
{"c":2,"k":"apply","id":"tandon","q":"A city caps religious services at 25 people for fire safety, but lets concert halls, gyms, and lecture halls of the same size hold 100, with the same exits and sprinklers. What result?","o":["Strict scrutiny under Tandon: comparable secular activities are treated better","Rational basis under Smith: fire codes are neutral safety laws","No problem, so long as some secular venues, like nightclubs, are also capped at 25","Strict scrutiny only if the city admits it meant to single out worship"],"e":"Comparability is judged by risk to the interest. Same size, same exits, same sprinklers: the city must show worship is riskier with the same precautions.","v":false,"w":["Smith applies only to laws that are generally applicable. Favoring comparable secular activity defeats general applicability.","Tandon: it doesn’t matter that some secular activities are treated as badly. One comparable activity treated better is enough.","No admission of motive is required. Unequal treatment of comparable activities is enough."]},
{"c":2,"k":"apply","id":"carson","q":"A state gives grants to any private college to install solar panels but excludes colleges “affiliated with a church.” A church-affiliated college sues. What result?","o":["Likely a Free Exercise violation: exclusion solely for religious character","Valid: the state may decline to fund religion to avoid Establishment concerns","Valid, if the state’s own constitution bars any aid to religious bodies","Valid, unless the college proves the state was hostile to its specific faith"],"e":"The trilogy: once the state offers a generally available benefit, it can’t exclude otherwise eligible recipients because they are religious.","v":false,"w":["That “play in the joints” idea is in retreat. Carson held an interest in stricter separation than the federal Constitution requires isn’t compelling.","Espinoza: a state no-aid provision doesn’t justify cutting religious schools out of a program.","No hostility is needed. Exclusion because of religious character is itself a way of failing neutrality."]},
{"c":2,"k":"concept","id":"t-freeex","q":"In the Free Exercise checklist, what comes right after asking whether a sincere religious practice is burdened?","o":["Is the law neutral and generally applicable?","Does the law survive strict scrutiny as applied?","Is a hybrid right involved?","Does RFRA apply to this government?"],"e":"If the law is neutral and generally applicable, Smith denies an exemption unless Wrinkle 1 applies; otherwise strict scrutiny.","v":false},
{"c":2,"k":"concept","id":"t-freeex","q":"Once strict scrutiny applies in a Free Exercise case, how often does the government win?","o":["Almost never","About half the time","Usually","Always, in schools"],"e":"That is why the fight is usually over whether the law is neutral and generally applicable.","v":false},
{"c":2,"k":"concept","id":"t-neutral","q":"Which case illustrates “comparable secular activity favored” in the neutrality synthesis?","o":["Tandon v. Newsom","Fulton v. City of Philadelphia","Church of the Lukumi Babalu Aye, Inc. v. City of Hialeah","Carson v. Makin"],"e":"Fulton is the discretionary exemption system, Lukumi gerrymandered exemptions, and Carson exclusion from a benefit.","v":false},
{"c":2,"k":"concept","id":"t-neutral","q":"Which case illustrates a “discretionary exemption system” in the neutrality synthesis?","o":["Fulton v. City of Philadelphia","Tandon v. Newsom","Masterpiece Cakeshop, Ltd. v. Colorado Civil Rights Commission","Kennedy v. Bremerton School District"],"e":"Fulton’s Commissioner had sole discretion to grant exceptions, even though none had been granted.","v":false},
{"c":2,"k":"concept","id":"t-wrinkles","q":"Why did Mahmoud say little about the doctrinal basis for Wrinkle 1?","o":["Wariness of unenumerated rights after Dobbs","The parties had waived the issue during the appeal","Yoder had already been overruled by Smith","The case was decided without oral argument"],"e":"Smith had grounded Yoder in an unenumerated parental right, a basis the Court was reluctant to lean on.","v":false},
{"c":2,"k":"concept","id":"t-estab","q":"Which case struck a moment of silence for prayer in public schools?","o":["Wallace v. Jaffree","Engel v. Vitale","Abington v. Schempp","McCollum v. Board of Education"],"e":"Engel struck nonmandatory prayer, Schempp Bible reading, and McCollum religious instruction.","v":false},
{"c":2,"k":"concept","id":"t-estab","q":"What did Engel v. Vitale strike down?","o":["Nonmandatory prayer in public schools","Bible reading in public schools","Religious instruction in school buildings","Funding for religious schools"],"e":"Public schools are policed most strictly because they are uniquely coercive and children are impressionable.","v":false},
{"c":2,"k":"concept","id":"t-estab","q":"Which sequence describes how religious-school funding doctrine has changed?","o":["Exclusion permitted, then inclusion permitted, then inclusion required","Inclusion required, then inclusion permitted, then exclusion permitted again","Inclusion permitted, then exclusion required, then inclusion required","Exclusion required, then exclusion permitted, then inclusion permitted"],"e":"The Lemon era allowed exclusion, Zelman (2002) permitted inclusion, and the trilogy (2017–2022) required it.","v":false},
{"c":2,"k":"concept","id":"t-estab","q":"What principle about unemployment benefits did Carson cite?","o":["A state can’t deny benefits to someone fired for refusing to abandon her faith","A state may deny benefits to anyone who quits a job for any religious reason at all","Religious employers are exempt from paying into unemployment funds","Unemployment offices may not be located in religious buildings"],"e":"The same principle that bars excluding religious schools from a benefit long protected claimants seeking unemployment benefits.","v":false},
{"c":2,"k":"concept","id":"t-rfra","q":"Is RFRA part of constitutional law?","o":["No; it is a statute that Congress can amend","Yes; it overruled Smith as a constitutional rule","Yes; it was ratified as an amendment in 1993","No; it is a regulation issued by the Justice Department"],"e":"Because it is a statute, its reach depends on Congress’s power, which Boerne limited as to the states.","v":false},
{"c":2,"k":"concept","id":"t-rfra","q":"What does RLUIPA cover?","o":["Land use and institutionalized persons","Federal employment and military service","Public schools and state universities","Tax exemptions for religious groups"],"e":"RLUIPA binds states and was unanimously upheld in Cutter v. Wilkinson.","v":false},
{"c":2,"k":"concept","id":"t-rfra","q":"How are longstanding religious monuments and legislative prayers generally treated?","o":["Allowed on historical grounds, like the Texas Ten Commandments monument","Struck under the endorsement test as government approval of one religion","Allowed only if the government pays for nothing related to them","Allowed only if they include symbols from every faith"],"e":"Van Orden (2005) upheld a monument that had stood for 40 years. Public schools are stricter because students are impressionable.","v":false},
{"c":2,"k":"apply","id":"t-freeex","q":"A city’s zoning code caps every building at 40 feet, with no exceptions or variances of any kind. A church wants a 60-foot steeple. Under the Free Exercise Clause, what result?","o":["No exemption: the code is neutral and generally applicable","Strict scrutiny under Lukumi, because steeples are religious","Strict scrutiny under Fulton, because zoning involves permits","An exemption under Wrinkle 1, because the church runs a school"],"e":"Under Smith, a truly across-the-board rule needs no exemption. A statute like RLUIPA, which covers land use, could change the answer.","v":false,"w":["Lukumi requires a law that targets religion, shown by exemptions sparing comparable secular conduct. This code has none.","Fulton requires a system of discretionary exemptions. This code has no variances at all.","Wrinkle 1 is about parents’ religious upbringing of their children, not a building’s height."]},
{"c":2,"k":"apply","id":"t-neutral","q":"A state requires school vaccinations and allows medical exemptions but no religious ones. Religious parents sue. What is their strongest Free Exercise argument?","o":["Medical exemptions favor a comparable secular reason, so Tandon applies","The law names no religion, so it must be a Lukumi-style religious gerrymander","Any law affecting children triggers Wrinkle 1 automatically","Vaccines are medical, so the Establishment Clause bars the requirement"],"e":"Comparability is judged by risk: an unvaccinated child with a medical exemption poses the same risk as one with a religious objection. The state must then show the religious exemption is riskier.","v":false,"w":["A gerrymander needs exemptions that leave comparable secular conduct untouched to single out religion; the better framing is Tandon’s comparability rule.","Wrinkle 1 applies to interference with parents’ religious upbringing of children, not to every law that affects children.","The Establishment Clause concerns government favoring or coercing religion, not secular health requirements."]},
{"c":2,"k":"apply","id":"t-wrinkles","q":"A state excludes religious schools from a voucher program, saying its own constitution requires stricter separation of church and state than the federal Constitution. Best response?","o":["Wrinkle 2 doesn’t cover that: stricter separation isn’t a compelling interest","The exclusion is valid, because states may always add to the Establishment Clause","The exclusion is valid if the state also caps vouchers for secular schools","The exclusion is valid, because voucher money is public education money"],"e":"Government may disfavor religion only when needed to avoid a federal Establishment Clause violation. Including religious schools through parents’ choice isn’t one (Zelman).","v":false,"w":["Carson and Espinoza rejected exactly this: separation beyond the federal Constitution is not compelling.","Capping secular vouchers doesn’t cure excluding religious schools from the ones that remain. The state’s only way out is ending the program.","Carson held such programs aren’t a public-education benefit, since private schools are selective and skip the state curriculum."]},
{"c":2,"k":"apply","id":"t-estab","q":"A public elementary school opens each day with a voluntary, teacher-led prayer; students may step into the hall. A parent sues. What result?","o":["It violates the Establishment Clause, as in Engel","It is valid under Kennedy, because no student is forced to pray","It is valid, because history and tradition support legislative prayer too","It is valid, if students of every faith may take turns leading it"],"e":"Engel struck nonmandatory school prayer. Teacher-led prayer to young children is government religious exercise, not private expression.","v":false,"w":["Kennedy protected a coach’s own private prayer, and it kept the strict line on school-sponsored prayer.","Legislative prayer survives on history; public schools are treated differently because students are impressionable.","Rotating faiths is still the school sponsoring prayer, which the school-prayer cases forbid."]},
{"c":2,"k":"apply","id":"t-rfra","q":"A federal prison enforces a uniform no-beard rule for all inmates. A Muslim inmate wants to keep a short beard. Which law gives him his best claim?","o":["RFRA, which binds the federal government and demands strict scrutiny","The Free Exercise Clause, which requires strict scrutiny for uniform rules","RLUIPA, which binds federal prisons and requires an exemption","None: Boerne struck down RFRA in every application"],"e":"Boerne limited RFRA as to states and localities, but it still binds the federal government.","v":false,"w":["Under Smith, a uniform rule with no exemptions needs no exemption under the Constitution itself.","RLUIPA binds the states, so it would cover a state prison, not a federal one.","Boerne left RFRA in force against the federal government."]},
{"c":3,"k":"name","id":"wooley","q":"In which case did the dissent disagree only about whether the challenged message was the government’s own speech?","o":["Wooley v. Maynard","West Virginia State Board of Education v. Barnette","Collin v. Smith","American Booksellers Ass’n v. Hudnut"],"e":"Wooley v. Maynard (1977). Government speech is a later topic in the course.","v":true},
{"c":3,"k":"name","id":"collin","q":"In which case were the demonstrators represented by David Goldberger, a Jewish ACLU lawyer?","o":["Collin v. Smith","Terminiello v. City of Chicago","Brandenburg v. Ohio","R.A.V. v. City of St. Paul"],"e":"Collin v. Smith (1978), the Skokie march case.","v":true},
{"c":3,"k":"name","id":"hudnut","q":"In which case did the plaintiffs’ materials range from hard-core films to Yeats’s “Leda and the Swan” and works of Joyce and Lawrence?","o":["American Booksellers Ass’n v. Hudnut","United States v. Stevens","Ashcroft v. Free Speech Coalition","Brown v. Entertainment Merchants Association"],"e":"Hudnut (1985). It was unclear how Indianapolis would treat Ulysses or the Iliad.","v":true},
{"c":3,"k":"name","id":"stevens","q":"In which case did a statute aimed at “crush videos” turn out to reach hunting videos sold where hunting is restricted?","o":["United States v. Stevens","United States v. Hansen","Brown v. Entertainment Merchants Association","United States v. Alvarez"],"e":"United States v. Stevens (2010). Read by its text, 18 U.S.C. § 48 required no cruelty.","v":true},
{"c":3,"k":"name","id":"alvarez","q":"In which case did the defendant also falsely claim to have played for the Detroit Red Wings and married a starlet from Mexico?","o":["United States v. Alvarez","United States v. Hansen","Counterman v. Colorado","Rice v. Paladin Enterprises, Inc."],"e":"United States v. Alvarez (2012). “Lying was his habit.”","v":true},
{"c":3,"k":"name","id":"hansen","q":"In which case did a defendant whose own conduct was fraud argue that a statute was overbroad because it could reach advocacy?","o":["United States v. Hansen","United States v. Stevens","United States v. Williams","United States v. Alvarez"],"e":"United States v. Hansen (2023). Overbreadth lets a litigant with unprotected conduct assert others’ rights.","v":true},
{"c":3,"k":"hold","id":"wooley","q":"Which statement about Wooley v. Maynard is accurate?","o":["Promoting state pride is ideological and can’t override the right not to carry it","The motto requirement stood, but drivers couldn’t be prosecuted for covering it","Only religious objectors may refuse to display a state’s official motto","It was decided under the Establishment Clause, because the objectors were Jehovah’s Witnesses"],"e":"Religious plaintiffs, but a speech rationale that protects any objector. Vehicle identification was served by plate numbers.","v":false},
{"c":3,"k":"hold","id":"collin","q":"Which statement about Collin v. Smith is accurate?","o":["The ordinances were content-based, not time, place, and manner rules","The ordinances were valid TPM rules because the march was short","The march was unprotected incitement because violence was widely expected","The ordinances failed only because the permit fee was too high"],"e":"The village objected to who was marching, not when or where. It also conceded it expected no violence.","v":false},
{"c":3,"k":"hold","id":"hudnut","q":"Which statement about American Booksellers Ass’n v. Hudnut is accurate?","o":["Material showing women as equals was lawful; material showing subordination was banned","The ordinance banned all sexually explicit material, however it portrayed women or men","The ordinance tracked the Miller test, so it was upheld as an obscenity law","The court rejected the city’s claim that such depictions cause any harm at all"],"e":"Treating one side differently from the other is viewpoint discrimination, which is what doomed the ordinance.","v":false},
{"c":3,"k":"hold","id":"stevens","q":"Which statement about United States v. Stevens is accurate?","o":["It refused to make depictions of animal cruelty a new unprotected category","It held that crush videos are protected speech in every possible form","It upheld the law as applied but struck it as to hunting videos","It upheld the law as applied to dogfights but struck it as to hunting videos"],"e":"Stevens left open a statute limited to crush videos or extreme cruelty.","v":false},
{"c":3,"k":"hold","id":"alvarez","q":"Which statement about United States v. Alvarez is accurate?","o":["The Medal’s integrity was compelling, but the Act wasn’t actually necessary","The Medal’s integrity was too weak an interest to count as compelling","The Act fell because Alvarez sought money and other benefits through his lie","The Act was upheld as applied to statements made at public meetings"],"e":"There was no evidence the lies diluted the Medal, and counterspeech worked.","v":false},
{"c":3,"k":"hold","id":"hansen","q":"Which statement about United States v. Hansen is accurate?","o":["Read as solicitation and facilitation, the law’s protected applications were fanciful","It struck the law because it reached ordinary advocacy on behalf of noncitizens and their families","It held fraud aimed at noncitizens is protected speech under the First Amendment","It held overbreadth challenges unavailable to defendants in criminal cases"],"e":"Without a lopsided ratio of realistic protected applications, the law survived.","v":false},
{"c":3,"k":"why","id":"wooley","q":"Why did it matter in Wooley that driving is a virtual necessity?","o":["Drivers couldn’t avoid carrying the state’s message on their own cars","Driving is a privilege, so the state could attach whatever conditions it chose","Necessity meant the state had to supply plates free of charge","It made the motto the drivers’ own speech rather than the state’s"],"e":"The car became a “mobile billboard” for the state’s ideological message.","v":false},
{"c":3,"k":"why","id":"collin","q":"Which exceptions to the ban on content regulation did Collin recognize, drawing on Mosley?","o":["Obscenity, fighting words, libel, and narrow imminent danger","Hate speech, group libel, and symbols of genocide","Profanity, indecency, and offensive symbols such as swastikas","Any speech that causes a minority psychic trauma"],"e":"Burger’s Mosley concurrence listed these. The village’s ordinances fit none of them.","v":false},
{"c":3,"k":"why","id":"hudnut","q":"Why did Hudnut say the city’s rationale couldn’t be contained?","o":["Any rationale for silencing harmful views couldn’t stay limited to sex","The city admitted it planned to extend the ordinance to violent films","The Supreme Court had already approved a broader group-libel law","Seditious libel is unprotected, so the rationale already reached political speech"],"e":"Speech has been an ally of those seeking change. Seditious libel is protected unless the danger is grave and imminent.","v":false},
{"c":3,"k":"why","id":"stevens","q":"Why didn’t § 48’s exception for serious value save it in Stevens?","o":["Its terms didn’t reliably cover hunting videos and other lawful material","Courts never consider statutory exceptions when they analyze overbreadth","Serious value is a test only for obscenity, never for other speech","Congress had repealed the exception before the prosecution began"],"e":"Lawful applications, like hunting videos, dwarfed the crush and dogfight market, so the ratio was lopsided.","v":false},
{"c":3,"k":"why","id":"alvarez","q":"What did Alvarez fear would follow from upholding the Stolen Valor Act?","o":["Government could list subjects about which lies are crimes","Government could ban all paid political advertising before elections","Government could license speakers at public meetings","Government could prosecute opinions as false facts"],"e":"The Act reached lies anywhere, even whispered at home, and targeted falsity and nothing more.","v":false},
{"c":3,"k":"why","id":"hansen","q":"Which principle did Hansen invoke for choosing a constitutional reading of a statute?","o":["The Ashwander principle of constitutional avoidance","The Salerno rule for ordinary facial challenges","The Mosley principle against content regulation","The Giboney rule for speech integral to criminal conduct"],"e":"If a statute can fairly be read two ways, choose the constitutional reading; courts seek harmony, not collision.","v":false},
{"c":3,"k":"det","id":"wooley","q":"Which interests did New Hampshire offer for its motto requirement in Wooley?","o":["Identifying vehicles and promoting state pride and history","Traffic safety and reducing the theft of license plates from parked cars","Raising revenue and deterring drunk driving","Wartime unity and civic education of students"],"e":"Identification could be done with plate numbers, so it wasn’t narrowly tailored. Pride and history were ideological.","v":false},
{"c":3,"k":"det","id":"collin","q":"What did the march permit in Collin allow?","o":["30 to 50 uniformed marchers, single file, for half an hour, with no speeches","A full-day rally in the village park with amplified speeches, music, and handbills","A march through residential streets ending at a synagogue","A permanent display of party flags outside Village Hall"],"e":"The placards included “Free Speech for White America.” The village still couldn’t stop it for its content.","v":false},
{"c":3,"k":"det","id":"hudnut","q":"Which drafter of the Hudnut ordinance asked, “if a woman is subjected, why should it matter that the work has other value?”","o":["Catharine MacKinnon","Kathleen M. Sullivan","Thomas Emerson","Greg Garre"],"e":"The drafters saw the ordinance’s departures from Miller as virtues; the court saw viewpoint discrimination.","v":false},
{"c":3,"k":"det","id":"stevens","q":"How would the dissent in Stevens have handled § 48?","o":["Read the statute narrowly","Struck it as unconstitutionally vague","Upheld it as an obscenity law","Remanded for more facts"],"e":"The majority declined to rewrite the statute, since the avoidance canon can’t override clear text.","v":false},
{"c":3,"k":"det","id":"alvarez","q":"As the outline explains with Alvarez, what does “concurring in the judgment” mean?","o":["Agreeing with the result but not the reasoning","Agreeing with the reasoning but not the result","Joining every part of the main opinion without reservation","Dissenting from part of the judgment"],"e":"A plurality is fewer than five Justices joining the reasoning, so it usually isn’t binding.","v":false},
{"c":3,"k":"det","id":"hansen","q":"What limit does the avoidance canon have, as Hansen notes?","o":["It can’t override clear statutory text","It applies only to federal criminal statutes","It applies only in civil cases","It needs the government’s consent"],"e":"That is why Stevens read § 48 by its ordinary meaning instead of narrowing it.","v":false},
{"c":3,"k":"apply","id":"wooley","q":"A state requires every storefront business to display a state-issued window poster reading “Proud to Support Our State’s Values.” A shop owner refuses. What result?","o":["Unconstitutional compelled speech under Wooley","Valid, because businesses get less protection than drivers","Valid, as a compelled factual commercial disclosure","Valid, because most residents approve of the message"],"e":"The state may not make a person display its ideological message on private property for the public to see.","v":false,"w":["Wooley’s principle protects any owner of private property. Being a business doesn’t make an ideological message less compelled.","The commercial exception covers factual disclosures like nutrition labels, not ideological slogans.","Majority approval of the message is irrelevant (Wooley; Barnette)."]},
{"c":3,"k":"apply","id":"collin","q":"A town where a mass shooting occurred denies a parade permit to a group that wants to march on a public street with signs praising the shooter’s ideology, citing residents’ trauma. No violence is expected. What result?","o":["The denial is unconstitutional: content-based, with no captive audience or expected violence","The denial is valid: psychic trauma to survivors is a compelling interest that justifies it","The denial is valid: praising a shooter’s ideology is incitement under Brandenburg","The denial is valid: residents are a captive audience on their own town’s streets"],"e":"Collin: government may not ban a peaceful demonstration because of its message, however painful.","v":false,"w":["Collin held psychic trauma indistinguishable from speech that stirs anger, a high purpose of speech.","Praise of past violence isn’t directed to imminent lawless action, and no violence was expected.","Captive-audience protection covers intrusions into the home. Residents can avoid one street for a short time."]},
{"c":3,"k":"apply","id":"hudnut","q":"A state bans video games that “portray immigrants as criminals,” citing studies that such games increase discrimination. What result under Hudnut?","o":["Unconstitutional viewpoint discrimination, even if the harm is real","Valid, if the studies prove the games cause discrimination","Valid, because video games are entertainment rather than political speech","Valid, because it reaches only one disfavored message"],"e":"Hudnut accepted that the speech caused harm and still struck the ordinance: harm through ideas only proves speech’s power.","v":false,"w":["Proven harm didn’t save Hudnut’s ordinance. Government can’t become the censor of which thoughts are good for us.","Brown held games are speech; it is “difficult to distinguish politics from entertainment, and dangerous to try.”","Singling out one message is the definition of viewpoint discrimination, the worst form."]},
{"c":3,"k":"apply","id":"stevens","q":"A state bans selling videos depicting “the killing of any wild animal,” aiming at poaching videos. Hunting shows are popular there, and a hunting-show producer challenges the law. What result?","o":["Likely facially overbroad: lawful hunting videos dwarf the poaching market","Valid, because depictions of animal killing are an unprotected category of speech","Valid, because the state promises to prosecute only poaching videos","Valid, because the law has some legitimate applications to poaching"],"e":"Stevens: a law that reaches a substantial amount of protected speech relative to its legitimate sweep is facially invalid.","v":false,"w":["Stevens refused to create a category for depictions of animal cruelty or killing.","Stevens: the First Amendment doesn’t leave us “at the mercy of noblesse oblige.”","Some valid applications don’t save a law whose protected applications are realistic and far more numerous."]},
{"c":3,"k":"apply","id":"alvarez","q":"A state makes it a crime to falsely claim, anywhere, to hold a college degree. A man falsely claims a law degree at a dinner party and gains nothing. What result?","o":["Likely unconstitutional under Alvarez: falsity alone, with no cognizable harm","Valid: false statements are a historically unprotected category of speech","Valid: the interest in degree integrity is compelling, so the law is necessary","Valid: the lie was made in a private home, where speech gets less protection"],"e":"Lies tied to legally cognizable harm, like fraud to get a job, can be punished. Falsity alone can’t.","v":false,"w":["Alvarez rejected a general exception for false statements.","A compelling interest isn’t enough; the ban must be actually necessary, and counterspeech is a less restrictive alternative.","Alvarez faulted the Act for reaching lies even whispered at home. Private reach makes a law worse, not better."]},
{"c":3,"k":"apply","id":"hansen","q":"A statute bars “aiding or encouraging” tax evasion. A blogger who writes that the income tax is unconstitutional and urges readers to stop paying is charged. Under Hansen’s approach, what should the court do first?","o":["Read the terms as solicitation and facilitation of specific unlawful acts","Strike the statute as overbroad because it could reach the blog post","Uphold the conviction because tax evasion is a serious federal crime","Apply strict scrutiny, because the statute regulates speech based on its content"],"e":"Read as criminal-law terms of art, the statute reaches solicitation and facilitation of specific unlawful acts, not general advocacy.","v":false,"w":["Overbreadth comes after construction. Courts adopt any fairly possible constitutional reading first.","How serious the crime is doesn’t make general advocacy unprotected (Brandenburg).","Narrowed to solicitation and facilitation, the law reaches speech integral to crime, which is unprotected."]},
{"c":3,"k":"concept","id":"t-speech","q":"Why is false, heinous, or harmful speech often protected?","o":["Officials and courts can’t be trusted to separate truth from falsity","Such speech always has some political value that listeners deserve to hear","The Framers protected harmful speech expressly in the text","Only private parties may sue over harmful speech"],"e":"The same distrust explains the preference for bright lines and the refusal to add unprotected categories.","v":false},
{"c":3,"k":"concept","id":"t-speech","q":"Which of these is NOT a step on the speech checklist?","o":["Is the speaker a citizen?","Is there government action?","Is it compelled speech?","Is the law content-based?"],"e":"The checklist also asks whether the speech fits a narrow historical category and whether the law is overbroad or vague.","v":false},
{"c":3,"k":"concept","id":"t-compelled","q":"Which case established compelled-speech doctrine in the course materials?","o":["West Virginia State Board of Education v. Barnette","Wooley v. Maynard","Collin v. Smith","Kennedy v. Bremerton School District"],"e":"Wooley extended Barnette from saluting a flag to passively displaying a motto.","v":false},
{"c":3,"k":"concept","id":"t-content","q":"Which is the worst form of content discrimination?","o":["Viewpoint discrimination","Subject-matter restrictions","Time, place, and manner limits","Secondary-effects zoning"],"e":"Banning only pro-legalization publications, or rejecting “FCANCER” while allowing other plates, are examples.","v":false},
{"c":3,"k":"concept","id":"t-content","q":"Classify a ban on “publications advocating marijuana legalization.”","o":["Viewpoint-based","Content-neutral","Unprotected incitement","A secondary-effects rule"],"e":"It silences one side of a debate, so it is the worst form of content regulation and gets strict scrutiny.","v":false},
{"c":3,"k":"concept","id":"t-content","q":"What did Mosley, as quoted in Collin, say government has no power to do?","o":["Restrict expression because of its message, ideas, subject, or content","Regulate the time, place, or manner of any demonstration on a public street","Require permits for marches on public streets","Protect listeners in their homes from unwanted speech"],"e":"Debate must be “uninhibited, robust, and wide-open” (NYT v. Sullivan).","v":false},
{"c":3,"k":"concept","id":"t-categories","q":"Which case does the outline list as the key case for fraud as unprotected speech?","o":["Virginia Board of Pharmacy (1976)","Watts v. United States","Giboney v. Empire Storage & Ice Co.","Chaplinsky v. New Hampshire"],"e":"Alvarez distinguished lies with legally cognizable harm, like fraud, from falsity alone.","v":false},
{"c":3,"k":"concept","id":"t-categories","q":"Which category’s key case is Watts v. United States?","o":["True threats","Fighting words","Incitement","Obscenity"],"e":"Counterman later added the recklessness requirement for true threats.","v":false},
{"c":3,"k":"concept","id":"t-overbreadth","q":"Why is overbreadth called “strong medicine”?","o":["It invalidates a law that has lawful applications","It requires the defendant to prove actual chilling","It applies only to speech of the highest value","It lets courts rewrite statutes on their own"],"e":"That is why Hansen required realistic protected applications and a lopsided ratio.","v":false},
{"c":3,"k":"apply","id":"t-speech","q":"A public school bans black armbands worn to protest a war, calling them “clothing, not speech.” What is the first answer to the school’s argument?","o":["Symbolic acts like armbands are speech under the First Amendment","The school is right: clothing is conduct the school may regulate freely","The school is right unless the armband includes written words","Armbands are speech only if worn outside school grounds"],"e":"Speech includes symbolic acts: armbands, flags, crosses, parades, and picketing. The analysis then moves to content and justification.","v":false,"w":["The casebook lists armbands as a classic example of symbolic speech.","Barnette treated a wordless gesture, the salute, as a form of utterance.","Where the speech happens may affect the analysis later, but it doesn’t decide whether the act is speech."]},
{"c":3,"k":"apply","id":"t-compelled","q":"A city requires restaurants to post calorie counts on menus. A restaurant claims compelled speech. Likely result?","o":["Valid: compelled factual commercial disclosures are allowed","Invalid under Wooley: the owner can’t be made to carry any message","Invalid under Barnette: the owner must affirm a belief about nutrition","Valid only if customers can easily cover the numbers"],"e":"Compelled commercial disclosures like nutrition labels and drug side effects are the main exception (Ch. 8).","v":false,"w":["Wooley concerned an ideological message. Factual commercial disclosures are treated differently.","A calorie count states a fact; it doesn’t require affirming any belief.","Whether customers can cover the numbers is irrelevant; the disclosure is valid on its own terms."]},
{"c":3,"k":"apply","id":"t-content","q":"A city bans all yard signs except real-estate signs and signs supporting its “Clean Streets” campaign. A resident wants an anti-campaign sign. How should the ban be classified?","o":["Viewpoint-based as to the campaign signs, so strict scrutiny applies","Content-neutral, because it limits where every sign may be placed in the city","A time, place, and manner rule, because signs are on private yards","Valid, because the city’s own campaign is government speech"],"e":"Allowing signs for the campaign but not against it favors one side, the worst form of content regulation.","v":false,"w":["The ban picks signs by what they say, so it isn’t content-neutral.","Collin rejected the TPM label for a rule that turned on who was speaking and why.","The residents’ signs are their own speech, on their own property (Wooley), not the city’s."]},
{"c":3,"k":"apply","id":"t-categories","q":"A state creates a new crime: selling “extremely gory” videos of real human violence. It argues the videos have little value and cause real harm. What result?","o":["Likely invalid: courts don’t create new categories by balancing value and harm","Valid: speech of little value is unprotected under the categorical approach to speech","Valid: Ferber allows bans whenever the content shows real harm","Valid: the videos are obscene because they are deeply offensive"],"e":"Stevens and Brown: the First Amendment already reflects the people’s cost-benefit judgment, and violence isn’t a category.","v":false,"w":["Stevens called “categorical balancing” startling and dangerous; low value describes categories, it doesn’t create them.","Ferber rests on the sexual abuse of real children in production and the market that drives it, not on depicting harm in general.","Obscenity covers only sexual conduct (Brown), and offensiveness alone isn’t enough."]},
{"c":3,"k":"apply","id":"t-overbreadth","q":"A man convicted under a true-threats statute argues it is overbroad because a prosecutor could, in theory, charge someone for a joke. What does he need to show?","o":["Realistic protected applications, substantial relative to its legitimate sweep","At least one hypothetical application to protected speech, however unlikely it may be","That his own statement was protected speech rather than a true threat","That the statute has no valid applications to real threats at all"],"e":"Hansen: the unconstitutional applications must be realistic, not fanciful, and the ratio lopsided.","v":false,"w":["Hansen rejected fanciful hypotheticals; overbreadth isn’t triggered by any conceivable bad application.","Overbreadth lets a litigant with unprotected speech assert others’ rights, so his own speech needn’t be protected.","No valid applications is the ordinary facial standard (Salerno), not the overbreadth test."]},
{"c":4,"k":"name","id":"terminiello","q":"Which case required a clear and present danger of a serious evil “far above public inconvenience, annoyance, or unrest”?","o":["Terminiello v. City of Chicago","Brandenburg v. Ohio","Whitney v. California","New York Times Co. v. United States"],"e":"Terminiello v. City of Chicago (1949), from the middle era of incitement doctrine.","v":true},
{"c":4,"k":"name","id":"brandenburg","q":"In which case was the only audience Klan members and the journalists they invited?","o":["Brandenburg v. Ohio","Terminiello v. City of Chicago","Collin v. Smith","R.A.V. v. City of St. Paul"],"e":"Brandenburg v. Ohio (1969). The speech was filmed at a farm rally.","v":true},
{"c":4,"k":"name","id":"rav","q":"In which case did a state court construe an ordinance to reach only fighting words, yet the Supreme Court struck it anyway?","o":["R.A.V. v. City of St. Paul","Cohen v. California","Collin v. Smith","Terminiello v. City of Chicago"],"e":"R.A.V. (1992). Even limited to fighting words, the ordinance picked out race, color, creed, religion, and gender.","v":true},
{"c":4,"k":"name","id":"near","q":"Which 1931 case is the foundation of the heavy presumption against prior restraints?","o":["Near v. Minnesota ex rel. Olson","New York Times Co. v. United States","Whitney v. California","Terminiello v. City of Chicago"],"e":"Near v. Minnesota ex rel. Olson (1931). Bantam Books later restated the heavy presumption.","v":true},
{"c":4,"k":"name","id":"pentagon","q":"In which case did the Court grant cert on June 25, hear argument June 26, and rule June 30?","o":["New York Times Co. v. United States","Near v. Minnesota ex rel. Olson","Brandenburg v. Ohio","Cohen v. California"],"e":"The Pentagon Papers case (1971). The dissent said the issues were hard and the decision too rushed.","v":true},
{"c":4,"k":"hold","id":"terminiello","q":"Which statement about Terminiello v. City of Chicago is accurate?","o":["It reversed because the instruction let the jury convict for speech that invited dispute","It reversed because the speech was a sermon, protected by the Free Exercise Clause instead","It affirmed because the crowd outside actually turned violent","It adopted Brandenburg’s incitement test twenty years early"],"e":"The facts sounded like incitement, but the breach-of-the-peace instruction swept in protected speech.","v":false},
{"c":4,"k":"hold","id":"brandenburg","q":"Which statement about Brandenburg v. Ohio is accurate?","o":["Ohio’s law punished mere advocacy, with no intent, imminence, or likelihood","Ohio’s law was valid on its face but was misapplied to this particular speaker","The conviction stood because armed men burned a cross at the rally","Klan speech counts as fighting words whenever a cross is burned"],"e":"The statute was unconstitutional on its face, and Whitney’s majority was overruled.","v":false},
{"c":4,"k":"hold","id":"rav","q":"Which statement about R.A.V. v. City of St. Paul is accurate?","o":["The ordinance was facially invalid even assuming it reached only fighting words","The cross burning was protected speech that no law of any kind could ever punish","The ordinance was valid, but the teenagers’ conduct fell outside it","Fighting words are now fully protected speech like any other"],"e":"Other laws, like trespass or arson, could still reach the conduct. The problem was selective regulation within a category.","v":false},
{"c":4,"k":"hold","id":"near","q":"Which statement about Near v. Minnesota is accurate?","o":["Its wartime examples were dicta; the injunction itself was reversed","It upheld the injunction because the articles were defamatory","It held prior restraints forbidden in every possible circumstance, even war","It held the press may be punished only by advance restraint"],"e":"Protection from prior restraint isn’t absolute, but the only suggested exception has never been applied.","v":false},
{"c":4,"k":"hold","id":"pentagon","q":"Which statement about New York Times Co. v. United States is accurate?","o":["Publication was restrained for 15 days before the Court denied the injunctions","The Court allowed a brief injunction while classified papers were reviewed by judges","The Court held that the study had never been properly classified","The Court held the Espionage Act authorized the injunctions"],"e":"A general claim of harm to national security didn’t carry the government’s heavy burden.","v":false},
{"c":4,"k":"why","id":"terminiello","q":"Where does Terminiello fit in the history of incitement doctrine?","o":["The 1949–51 era: clear and present danger of a serious evil","The 1919–27 era: bad tendency, used to punish wartime dissidents","The modern era: intent, imminence, and likelihood","The fighting-words era begun by Chaplinsky"],"e":"Terminiello and Dennis sit between the WWI cases and Brandenburg.","v":false},
{"c":4,"k":"why","id":"brandenburg","q":"What did concurrences in Brandenburg say about the “clear and present danger” test?","o":["It should be expressly rejected; it was used to affirm WWI dissidents’ convictions","It should be kept as the governing test for speech during declared wars and emergencies","It means the same thing as the Brandenburg test in every case","It applies only to the press, not to individual speakers"],"e":"The old test had been used in Abrams, Schaefer, and Pierce to punish dissidents.","v":false},
{"c":4,"k":"why","id":"rav","q":"What does R.A.V. mean when it says unprotected categories aren’t “invisible to the Constitution”?","o":["Regulation within them still can’t pick out topics or viewpoints","They receive strict scrutiny, the same as any other protected speech","They must be defined by Congress rather than by courts","They are protected whenever the speech is political"],"e":"Government may ban libel, but not only libel critical of the government.","v":false},
{"c":4,"k":"why","id":"near","q":"Why did Near reverse the injunction against the newspaper?","o":["The Framers especially opposed prior restraints on publication","The articles were true, so a court could never enjoin their publication","State courts lack power to enjoin any newspaper","The officials had not sued for defamation first"],"e":"Near treated freedom from prior restraint as central to the press guarantee.","v":false},
{"c":4,"k":"why","id":"pentagon","q":"What did the government argue about Near’s wartime examples?","o":["They were only illustrative, and later punishment would come too late","They were binding holdings, limited to declared wars","They applied only to newspapers, not to leakers","They had been overruled by later cases about national security secrets"],"e":"It also argued a “real likelihood” of grave danger should suffice and that the President is best placed to judge it.","v":false},
{"c":4,"k":"det","id":"terminiello","q":"What kind of offense was Terminiello convicted of?","o":["Breach of the peace","Criminal syndicalism","Stalking","Disturbing the peace by offensive conduct"],"e":"Brandenburg involved criminal syndicalism, Counterman stalking, and Cohen offensive conduct.","v":false},
{"c":4,"k":"det","id":"brandenburg","q":"Which earlier case’s majority did Brandenburg overrule?","o":["Whitney v. California","Terminiello v. City of Chicago","Near v. Minnesota ex rel. Olson","Chaplinsky v. New Hampshire"],"e":"Brandeis’s Whitney concurrence survives as a statement of values.","v":false},
{"c":4,"k":"det","id":"rav","q":"What critique of Chaplinsky did scholars raise, which the Harvard note discussed with R.A.V. answered?","o":["It assumed a “fight” response, while others may flee or submit","It protected too little speech, because insults are rarely political","It conflicted with Brandenburg’s requirement of imminent action","It covered only spoken words, not symbols like burning crosses"],"e":"The note’s answer was to abolish the doctrine rather than expand it to “fright or flight.”","v":false},
{"c":4,"k":"det","id":"near","q":"Which later case quoted Near for the heavy presumption against prior restraints and denied injunctions against the press?","o":["New York Times Co. v. United States","Brandenburg v. Ohio","Snepp v. United States","R.A.V. v. City of St. Paul"],"e":"The Pentagon Papers case relied on Near and Bantam Books.","v":false},
{"c":4,"k":"det","id":"pentagon","q":"What happened in The Progressive case, about an article on the hydrogen bomb?","o":["A lower court enjoined it; the case was dropped before appeal","The Supreme Court upheld the injunction against the magazine’s article","The Supreme Court struck the injunction","Congress passed a law ending the case"],"e":"The Court has never upheld a national-security prior restraint against the press.","v":false},
{"c":4,"k":"apply","id":"terminiello","q":"A judge instructs a jury that disorderly conduct includes speech that “causes annoyance or alarm to listeners.” A protester loudly criticizes a mayor’s policies at a rally and is convicted. What result?","o":["Reverse: the instruction reaches protected speech that merely annoys","Affirm: annoyance and alarm are serious harms to public order and safety","Affirm, if the mayor found the protester’s words offensive","Reverse only if no listener actually became alarmed"],"e":"Terminiello: speech can’t be punished for stirring anger or unrest. A conviction resting on an overbroad instruction falls.","v":false,"w":["Annoyance is exactly what Terminiello said is not enough; the danger must be far above inconvenience or unrest.","Offensiveness alone isn’t a basis for punishment, and criticizing a policy isn’t a personal insult.","The flaw is the instruction itself, so the conviction falls whatever the listeners felt."]},
{"c":4,"k":"apply","id":"brandenburg","q":"At a rally, a speaker says, “Someday the people will rise up and burn the capitol.” The crowd cheers and goes home. What result?","o":["Protected: no imminence and no likelihood of imminent lawless action","Unprotected: advocating that a public building be burned is incitement","Unprotected: the crowd’s cheering proves that action was likely","Protected only if the speaker didn’t sincerely mean it"],"e":"“Someday” is the opposite of imminent. Advocacy of force at an indefinite future time is protected.","v":false,"w":["Advocacy of lawless action is protected unless it is directed to imminent action and likely to produce it.","Cheering isn’t lawless action, and nothing suggests the crowd was about to act.","Intent alone isn’t enough. Even sincere advocacy is protected without imminence and likelihood."]},
{"c":4,"k":"apply","id":"rav","q":"A city bans “fighting words directed at a person because of their political party.” A man yells party-based insults inches from a neighbor’s face. What result under R.A.V.?","o":["The ordinance is facially invalid: it singles out a topic-based subset of fighting words","The ordinance is valid: fighting words are unprotected, so any subset may be banned","The ordinance is valid: insults about politics are the most dangerous fighting words","The ordinance is invalid only because insults about politics are core political speech"],"e":"R.A.V.: government may ban a whole category for what makes it proscribable, but not a subset chosen by topic.","v":false,"w":["That is the argument R.A.V. rejected; categories aren’t invisible to the Constitution.","The city chose party affiliation as a topic, not because those words are uniquely likely to provoke a fight.","Face-to-face fighting words stay unprotected under a general law. The flaw is the selective subset, not the political content."]},
{"c":4,"k":"apply","id":"near","q":"A county judge orders a local newspaper not to publish a story alleging the sheriff takes bribes until the sheriff’s defamation suit is resolved. What result?","o":["An invalid prior restraint under Near; the remedy is a later defamation suit","Valid: courts may stop defamatory stories before they are published","Valid: the order is temporary, so it isn’t really a prior restraint","Valid: the sheriff’s safety is a national-security interest"],"e":"Near struck an injunction against articles accusing officials of corruption. Defamation is handled after publication.","v":false,"w":["Near is this case: an injunction against corruption stories about local officials.","A temporary restraint is still a restraint; in the Pentagon Papers case publication was held up 15 days, and the heavy presumption applied.","The national-security exception is limited to wartime information like troop movements and sailing dates."]},
{"c":4,"k":"apply","id":"pentagon","q":"During a war, a newspaper plans to publish the exact landing site and sailing date of next week’s troop convoy. The government seeks an injunction. Best answer?","o":["This is Near’s wartime example, the strongest case for a restraint","Denied: the Pentagon Papers case bars any injunction against the press","Denied: the government must wait and prosecute after publication","Granted only if the paper obtained the information illegally"],"e":"The Court has never actually applied Near’s exception, but troop movements and sailing dates are exactly its examples.","v":false,"w":["The Pentagon Papers case rejected a general security claim. It didn’t eliminate Near’s narrow exception.","Near’s point is that some information may be stopped beforehand, because afterward the harm is done.","How the paper got the information wasn’t the test; the Times and Post published leaked material."]},
{"c":4,"k":"concept","id":"t-incite","q":"Which words of the Brandenburg test supply the intent requirement?","o":["“Directed to” inciting","“Imminent” lawless action","“Likely” to produce it","“Lawless” action"],"e":"Brandenburg requires intent, imminence, lawless action, and likelihood.","v":false},
{"c":4,"k":"concept","id":"t-incite","q":"Which WWI-era cases used clear and present danger to affirm dissidents’ convictions?","o":["Abrams, Schaefer, and Pierce","Terminiello v. City of Chicago and Dennis","Cox and Edwards","Near and Bantam Books"],"e":"Brandenburg’s concurrences cited them in urging the Court to reject the old test outright.","v":false},
{"c":4,"k":"concept","id":"t-fighting","q":"Since Chaplinsky in 1942, how often has the Court upheld a restriction on the fighting-words theory?","o":["Never","About once a decade","In most cases","Only for speech near schools"],"e":"The category still exists but is defined very narrowly.","v":false},
{"c":4,"k":"concept","id":"t-fighting","q":"Which two cases establish that there is no heckler’s veto?","o":["Cox v. Louisiana and Edwards v. South Carolina","Chaplinsky and Cohen","Terminiello and Dennis","Near and Bantam Books"],"e":"Peaceful protesters can’t be convicted because a hostile crowd might turn violent when police can control it.","v":false},
{"c":4,"k":"concept","id":"t-prior","q":"Who bears the burden when the government seeks a prior restraint?","o":["The government, a heavy one","The speaker, by clear evidence","Neither; courts balance freely","The court, on its own motion"],"e":"The restraint carries a heavy presumption of invalidity (Bantam Books; Near).","v":false},
{"c":4,"k":"apply","id":"t-incite","q":"On a livestream to two million followers, a speaker says, “Go to the city council meeting right now and drag them out. It starts in 20 minutes.” Hundreds head there. How should a court analyze it?","o":["Likely unprotected incitement: directed, imminent, lawless, and likely","Protected: speech to an online audience can never be imminent lawless action","Protected: criticism of a city council is core political speech","Unprotected only if the council members were actually harmed"],"e":"A specific target, a 20-minute window, and followers already heading there satisfy all four elements.","v":false,"w":["Nothing in Brandenburg exempts online speech; here the audience acted within minutes.","Criticizing the council is protected; directing people to drag members out right now isn’t criticism.","Brandenburg asks whether lawless action was intended, imminent, and likely, not whether it succeeded."]},
{"c":4,"k":"apply","id":"t-fighting","q":"A street preacher’s sermon angers a crowd. Police, who have enough officers to keep order, arrest the preacher rather than control the crowd. What result?","o":["The arrest is an unconstitutional heckler’s veto","The arrest is valid: the crowd’s anger shows incitement","The arrest is valid: the sermon was fighting words to everyone present","The arrest is valid if the preacher refused an order to stop"],"e":"Cox and Edwards: when police can control a hostile crowd, they must protect the speaker rather than silence him.","v":false,"w":["Incitement requires speech directed to lawless action by the speaker’s audience, not a hostile audience reacting against the speaker.","Fighting words are direct personal insults to an individual, not a sermon that angers a crowd.","An order to stop because of the crowd’s hostility is the heckler’s veto itself."]},
{"c":4,"k":"apply","id":"t-fighting","q":"A man walks up to a stranger and screams a slur inches from his face, inviting a fight. He is charged under a general ordinance banning all fighting words. What result?","o":["Likely unprotected fighting words under a general law","Protected: hate speech is always protected after R.A.V.","Protected: no one may be punished for an insult alone","Unprotected only if the stranger actually threw a punch"],"e":"A face-to-face personal insult likely to provoke an immediate fight fits Chaplinsky, and a general ordinance avoids R.A.V.’s problem.","v":false,"w":["R.A.V. struck a topic-based subset; it didn’t protect conduct that fits the category under a general law.","Chaplinsky’s category is personal insults likely to provoke immediate violence, and this is one.","The test is likelihood of an immediate violent reaction, not whether one actually happened."]},
{"c":4,"k":"apply","id":"t-prior","q":"A city requires a permit to hand out leaflets and lets the police chief deny permits for “objectionable content.” What is the main doctrinal problem?","o":["A licensing scheme is a prior restraint, here based on content","It is a valid time, place, and manner rule for sidewalks","It punishes speech after the fact, so it needs only rational basis","It is a secondary-effects rule aimed at litter"],"e":"Licensing stops speech before it happens, and discretion to deny for content makes it worse.","v":false,"w":["A rule that turns on “objectionable content” isn’t content-neutral, so it can’t be a TPM rule.","Licensing is the classic prior restraint, the opposite of after-the-fact punishment.","Secondary effects is limited to adult businesses, and the rule targets content, not litter."]},
{"c":5,"k":"name","id":"counterman","q":"In which case was the defendant convicted under a law barring repeated communications that would cause a reasonable person serious emotional distress?","o":["Counterman v. Colorado","United States v. Williams","Garcia v. Character Technologies, Inc.","Rice v. Paladin Enterprises, Inc."],"e":"Counterman v. Colorado (2023). Colorado’s stalking law applied a purely objective test.","v":true},
{"c":5,"k":"name","id":"williams","q":"In which case did the Court hold that an offer may be punished even if the speaker’s belief about the material is mistaken?","o":["United States v. Williams","New York v. Ferber","Ashcroft v. Free Speech Coalition","Rice v. Paladin Enterprises, Inc."],"e":"United States v. Williams (2008). Technology makes it nearly impossible to prove which images involve real children.","v":true},
{"c":5,"k":"name","id":"paladin","q":"In which case did the killer also follow another book by the same publisher, How to Make a Disposable Silencer?","o":["Rice v. Paladin Enterprises, Inc.","United States v. Williams","Garcia v. Character Technologies, Inc.","United States v. Stevens"],"e":"Rice v. Paladin Enterprises (1997). The publisher stipulated it assisted Perry in these very murders.","v":true},
{"c":5,"k":"name","id":"garcia","q":"In which case did the defendants compare their product’s characters to non-player characters in video games and to other users on social media?","o":["Garcia v. Character Technologies, Inc.","Brown v. Entertainment Merchants Association","Free Speech Coalition, Inc. v. Paxton","Rice v. Paladin Enterprises, Inc."],"e":"Garcia (2025). The court found the defendants didn’t meaningfully advance those analogies.","v":true},
{"c":5,"k":"hold","id":"counterman","q":"Which statement about Counterman v. Colorado is accurate?","o":["The conviction was vacated because the state used a purely objective test","The conviction was affirmed because the messages were plainly threatening to anyone","True threats now require proof that the speaker meant to threaten","Stalking laws may never reach communications made online"],"e":"The Court required at least recklessness and remanded.","v":false},
