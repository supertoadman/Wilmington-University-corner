{"c":5,"k":"hold","id":"williams","q":"Which statement about United States v. Williams is accurate?","o":["Offers and requests for contraband are categorically unprotected","The pandering law was void for vagueness because belief is so hard to prove","The law was overbroad because it reached virtual images","It extended Ferber to cover computer-generated images"],"e":"Solicitation and conspiracy laws have always criminalized speech intended to induce crime.","v":false},
{"c":5,"k":"hold","id":"paladin","q":"Which statement about Rice v. Paladin Enterprises is accurate?","o":["Liability rested on stipulated intent, not the book’s content alone","Every publisher of a how-to manual for crime is liable to the victims’ families","The book was obscene, so it had no First Amendment protection","News organizations may now be sued over their crime reporting"],"e":"Evidence of intent will almost never exist apart from stipulations like Paladin’s.","v":false},
{"c":5,"k":"hold","id":"garcia","q":"Which statement about Garcia v. Character Technologies is accurate?","o":["The court wasn’t prepared to hold that chatbot output is speech","The court held chatbot output is fully protected speech under the First Amendment","The court held the company liable for wrongful death","The court held users have no right to receive speech"],"e":"It was a preliminary ruling denying dismissal on First Amendment grounds.","v":false},
{"c":5,"k":"why","id":"counterman","q":"What guardrails did the objective-test camp say already keep true threats narrow?","o":["Intent to commit unlawful violence against a particular person, judged in full context","A requirement that the speaker have a weapon and the means to carry out the threat","A rule that only threats against public officials can be punished","A rule that online messages can never count as threats"],"e":"The reasonable listener knows the whole context: tone, audience, medium, and the broader exchange.","v":false},
{"c":5,"k":"why","id":"williams","q":"Why did Williams hold that the law’s belief element wasn’t vague?","o":["Belief is a true-or-false fact; difficulty proving it is for reasonable doubt","The statute defined belief by listing every qualifying image","Juries are presumed to understand every statutory term","Vagueness doctrine doesn’t apply to federal criminal statutes"],"e":"Vagueness concerns indeterminacy about what must be proved, like “annoying,” not how hard it is to prove.","v":false},
{"c":5,"k":"why","id":"paladin","q":"What did the major media amici warn in Paladin, and how did the court answer?","o":["That no expression would be safe; the court said copycats misuse, not use as intended","That books would get more expensive; the court said cost is irrelevant","That editors would quit; the court said news reporting is fully protected","That the First Amendment protects violence; the court said violence itself isn’t speech"],"e":"Paladin’s book was used “precisely as intended,” which set it apart.","v":false},
{"c":5,"k":"why","id":"garcia","q":"What was the product-design theory in Garcia’s complaint?","o":["An anthropomorphized, manipulative design marketed to children","A failure to translate the app into the teenager’s first language","A defective battery that caused the phone to overheat","A privacy breach that exposed the teenager’s messages"],"e":"Claiming the output as the company’s own expression would have reinforced that design framing.","v":false},
{"c":5,"k":"det","id":"counterman","q":"What did the concurrence that wanted an intent standard stress about online speech?","o":["It lacks contextual clues, and stereotypes can shape what juries find dangerous","It is less harmful than in-person speech, so it deserves a purely objective test","It is always public, so recklessness is easy for prosecutors to prove","It is governed by Section 230 rather than the First Amendment"],"e":"That camp also noted incitement, the closest cousin, requires intent.","v":false},
{"c":5,"k":"det","id":"williams","q":"Which two older cases did Williams rely on for treating offers of contraband as unprotected?","o":["Giboney and Pittsburgh Press","Chaplinsky and Watts v. United States","Miller and Ginsberg","Near and Bantam Books"],"e":"Giboney is the source of the speech-integral-to-crime category.","v":false},
{"c":5,"k":"det","id":"paladin","q":"Which features together made Paladin unique?","o":["Stipulations, detailed instructions, exhortation, and no legitimate purpose","A large print run, national advertising, mail-order sales, and sales to minors","A famous author, a film adaptation, and a best-seller list","A foreign publisher, an anonymous author, and cash sales"],"e":"Without those features, how-to material generally stays protected.","v":false},
{"c":5,"k":"det","id":"garcia","q":"What was notable about Garcia as a lawsuit?","o":["It was the first wrongful-death suit against an AI chatbot company","It was the first case to hold that chatbot output is protected speech","It was the first suit brought under Section 230 by a parent","It was the first Supreme Court case about artificial intelligence"],"e":"The casebook spells the teenager’s name “Seltzer”; it was Sewell Setzer III.","v":false},
{"c":5,"k":"apply","id":"counterman","q":"A student posts, “Tomorrow I’m bringing my rifle to chem class. Finally some real reactions.” He later says it was a dark joke. Classmates were terrified. Under Counterman, what must the state prove about his mental state?","o":["He consciously disregarded a substantial risk it would be seen as a threat","Only that a reasonable classmate would read the post as a threat","He actually intended to carry out a shooting the next day","At least one classmate actually suffered serious emotional distress from it"],"e":"Recklessness is enough. A jury could find it from the post’s specificity and context despite the joke defense.","v":false,"w":["A purely objective test is what Counterman rejected.","Intent to carry out the act isn’t required; even intent to threaten isn’t, since recklessness suffices.","The listener’s distress doesn’t substitute for the speaker’s mental state."]},
{"c":5,"k":"apply","id":"williams","q":"A man messages an undercover officer, “I’ll sell you the stolen credit card numbers I have, $50 each.” Charged with offering stolen financial data, he claims his offer is protected speech. What result?","o":["Unprotected: an offer to provide contraband is speech integral to crime","Protected: no sale or transfer ever actually took place","Protected: the offer went to an undercover officer, not a real buyer","Protected, unless the numbers turn out to be real"],"e":"Williams: offers to provide contraband have no social value; the offer itself is the crime.","v":false,"w":["No completed transfer is needed. The offer is the unlawful act.","What matters is the speaker’s belief and intent, so an offer to an undercover officer counts.","Williams upheld punishing offers even when the material isn’t what the speaker believes."]},
{"c":5,"k":"apply","id":"paladin","q":"A thriller describes, in detail, how a character poisons a rival. A reader copies the method in a real murder, and the victim’s family sues the publisher under Paladin. What result?","o":["Likely no liability: a copycat misuse, with no intent to assist crime","Liability: the book was used exactly as its pages described","Liability: detailed methods of killing are unprotected speech","No liability, but only because novels are fiction and not instructions"],"e":"Paladin required intent to assist criminals and use exactly as intended. Readers who copy novels misuse them.","v":false,"w":["Following a description isn’t use “precisely as intended” unless the publisher intended to assist murder.","Detail alone didn’t decide Paladin. The stipulations, exhortation to murder, and lack of any legitimate purpose did.","Fiction isn’t immune in itself. The point is the absence of intent, not the genre."]},
{"c":5,"k":"apply","id":"garcia","q":"An AI company sued over harmful chatbot advice argues only that its users have a First Amendment right to receive the output. Under Garcia, what must still be shown?","o":["That the output is expressive speech in the first place","That every one of its users was an adult","That the advice given was accurate","That no human read the output"],"e":"A distributor may assert users’ right to receive speech, but only if the output is speech.","v":false,"w":["Users’ age matters to some speech claims, but it doesn’t answer whether the output is speech at all.","Truth isn’t the threshold; Alvarez protects even some false speech. The question is whether output is expressive.","Whether anyone read the output doesn’t decide whether a human made an expressive choice."]},
{"c":5,"k":"concept","id":"t-threats","q":"Whose understanding decides whether words convey a threat?","o":["A reasonable recipient who knows the whole context","The speaker’s own subjective explanation","The most sensitive person who saw the words","A jury applying national community standards to the words"],"e":"Counterman then adds a separate subjective element: at least recklessness by the speaker.","v":false},
{"c":5,"k":"concept","id":"t-threats","q":"What does recklessness mean in Counterman?","o":["Consciously disregarding a substantial and unjustifiable risk","Failing to notice a risk that a reasonable person would have seen","Acting with the purpose of causing fear","Knowing to a practical certainty that fear will result"],"e":"The second option is negligence; the last two are purpose and knowledge, which Counterman didn’t require.","v":false},
{"c":5,"k":"concept","id":"t-integral","q":"Which of these is NOT speech integral to criminal conduct?","o":["“Cocaine should be legal.”","“Your money or your life.”","“I’ll sell you heroin.”","“I’ll tell you when the coast is clear.”"],"e":"Abstract advocacy of illegality stays protected. The others are the crime, an offer, and help in committing one.","v":false},
{"c":5,"k":"concept","id":"t-vague","q":"Has perfect clarity ever been required to avoid vagueness?","o":["No","Yes, for every criminal law","Only for speech laws","Only for federal laws"],"e":"A law is void only if it fails to give fair notice or invites seriously discriminatory enforcement.","v":false},
{"c":5,"k":"concept","id":"t-vague","q":"In the vagueness-versus-overbreadth table, whose speech does vagueness mainly protect?","o":["The litigant’s own","Third parties’","Only the press’s","Only government speakers’"],"e":"Overbreadth asserts third parties’ rights (Stevens, Hansen). The casebook cites Holder v. Humanitarian Law Project for vagueness.","v":false},
{"c":5,"k":"apply","id":"t-threats","q":"After months of escalating messages, a man texts his ex, “You’ll get what’s coming to you.” He says he meant karma. Under Counterman, which evidence matters most?","o":["The history of messages, which bears on whether he disregarded the risk","Only the literal words, since “what’s coming to you” is a common expression","Only whether the ex actually felt afraid","Only whether he owned a weapon"],"e":"Context informs both how a reasonable recipient reads the words and whether he consciously disregarded the risk they would be seen as threats.","v":false,"w":["Words are read in context: tone, audience, medium, and the broader exchange.","The recipient’s fear isn’t enough by itself; Counterman requires the speaker’s recklessness.","Means to carry out a threat isn’t an element; the speech itself is the harm."]},
{"c":5,"k":"apply","id":"t-integral","q":"Two people text about splitting the proceeds of a bank robbery they plan for Friday. Charged with conspiracy, they argue their texts are protected speech. What result?","o":["Unprotected: the texts are speech integral to the crime","Protected: no robbery has happened yet","Protected: private texts can’t be incitement","Protected, unless the texts were sent in a public place or forum"],"e":"Conspiracy, solicitation, and aiding and abetting have always criminalized speech used to commit crimes (Giboney).","v":false,"w":["Conspiracy is complete without the robbery; the agreement is the crime.","This isn’t an incitement case; speech that forms a criminal agreement is a separate category.","Whether speech is public doesn’t matter when the speech is part of the crime itself."]},
{"c":5,"k":"apply","id":"t-vague","q":"An ordinance bans “annoying” gatherings on sidewalks. A man whose loud gathering was plainly disruptive raises a vagueness challenge. What result?","o":["He may raise it: “annoying” is indeterminate, and speech cases relax standing","He loses: his own conduct was clearly covered, so he can’t complain about others","He loses: vagueness applies only to statutes, not ordinances","He wins only if he proves the law reaches a substantial amount of speech"],"e":"Williams gives “annoying” as the classic vague term, and in First Amendment cases a clearly covered person may still complain.","v":false,"w":["That is the usual rule, but the Court relaxes it in First Amendment cases.","Vagueness doctrine applies to any law, including local ordinances.","That is the overbreadth test, a different doctrine."]},
{"c":5,"k":"apply","id":"t-vague","q":"A law bans “any photograph or video depicting the use of an illegal drug.” Its meaning is clear. Which doctrine fits a challenge best?","o":["Overbreadth: it is clear, but it reaches too much protected speech","Vagueness: it fails to give people fair notice of what is prohibited","Prior restraint: it stops speech before it is published","Speech integral to crime: it reaches only offers of contraband"],"e":"Like § 48 in Stevens, it would reach news, documentaries, and films, far beyond any legitimate sweep.","v":false,"w":["The problem isn’t unclear terms; the scope is clear and too wide.","It punishes distribution after the fact; it isn’t an injunction or licensing scheme.","Depicting drug use isn’t an offer or solicitation of contraband."]},
{"c":6,"k":"name","id":"bolger","q":"In which case did the Court distinguish Pacifica because broadcasting is “uniquely pervasive” and “uniquely accessible to children”?","o":["Bolger v. Youngs Drug Products Corp.","Cohen v. California","Brown v. Entertainment Merchants Association","Ashcroft v. American Civil Liberties Union"],"e":"Bolger (1983). Mail, unlike broadcasting, can be tossed out.","v":true},
{"c":6,"k":"name","id":"cohen","q":"Which case shows that calling speech “profane” generally doesn’t make it restrictable, outside Pacifica’s narrow exception?","o":["Cohen v. California","FCC v. Pacifica Foundation","Bolger v. Youngs Drug Products Corp.","Brown v. Entertainment Merchants Association"],"e":"Cohen v. California (1971). The FCANCER plate case later applied the same idea.","v":true},
{"c":6,"k":"name","id":"pacifica","q":"In which case had the station warned listeners and aired the material during a program about attitudes toward language?","o":["FCC v. Pacifica Foundation","Cohen v. California","Bolger v. Youngs Drug Products Corp.","Free Speech Coalition, Inc. v. Paxton"],"e":"FCC v. Pacifica Foundation (1978). The broadcast still aired at 2 p.m.","v":true},
{"c":6,"k":"name","id":"renton","q":"Which case is the source of the secondary-effects doctrine for adult businesses?","o":["City of Renton v. Playtime Theatres, Inc.","New York v. Ferber","FCC v. Pacifica Foundation","Free Speech Coalition, Inc. v. Paxton"],"e":"City of Renton (1986). The Court has refused to extend it beyond adult entertainment establishments.","v":true},
{"c":6,"k":"name","id":"ferber","q":"Which case was the Court’s first look at a statute limited to sexual depictions of children?","o":["New York v. Ferber","Ashcroft v. Free Speech Coalition","United States v. Williams","Free Speech Coalition, Inc. v. Paxton"],"e":"New York v. Ferber (1982). The federal government and 47 states had laws aimed at production.","v":true},
{"c":6,"k":"name","id":"fsc","q":"In which case did the Court note that “appear to be under 18” is higher than many states’ ages for marriage and consent?","o":["Ashcroft v. Free Speech Coalition","New York v. Ferber","United States v. Williams","Ashcroft v. American Civil Liberties Union"],"e":"Ashcroft v. Free Speech Coalition (2002), striking the CPPA’s “appear to” provision.","v":true},
{"c":6,"k":"name","id":"ashcroft2","q":"In which case did the government offer no specific evidence that its law would work better than filters?","o":["Ashcroft v. American Civil Liberties Union","Free Speech Coalition, Inc. v. Paxton","Brown v. Entertainment Merchants Association","Bolger v. Youngs Drug Products Corp."],"e":"Ashcroft II (2004). Under strict scrutiny, the government must prove less restrictive alternatives won’t work.","v":true},
{"c":6,"k":"name","id":"paxton","q":"Which case noted that online age checks are used for gambling, alcohol, tobacco, car rentals, and by the pornography industry itself?","o":["Free Speech Coalition, Inc. v. Paxton","Ashcroft v. American Civil Liberties Union","Brown v. Entertainment Merchants Association","Bolger v. Youngs Drug Products Corp."],"e":"Paxton (2025), upholding Texas H.B. 1181.","v":true},
{"c":6,"k":"name","id":"brown","q":"In which case did the state’s main expert admit the effects he studied were “about the same” as those of violence on television?","o":["Brown v. Entertainment Merchants Association","Free Speech Coalition, Inc. v. Paxton","Ashcroft v. American Civil Liberties Union","United States v. Stevens"],"e":"Brown (2011). California conceded it couldn’t show a direct causal link.","v":true},
{"c":6,"k":"hold","id":"bolger","q":"Which statement about Bolger v. Youngs Drug Products is accurate?","o":["Shielding adults from offense counted little, and the parental interest fell short","The ban was upheld because unsolicited mail invades the privacy of the home and family","Contraceptive ads were treated as obscene, so the ban got no scrutiny","The ban fell only because it reached mail sent to businesses"],"e":"Recipients aren’t a captive audience; the trip from mailbox to trash can is an acceptable burden.","v":false},
{"c":6,"k":"hold","id":"cohen","q":"Which statement about Cohen v. California is accurate?","o":["The speech was protected, and the offensive-conduct conviction was reversed","The conviction stood because women and children were present in the corridor","The jacket was obscene under the Miller test","The jacket was fighting words, but the statute was vague"],"e":"Profanity is protected speech. It wasn’t fighting words, and it wasn’t obscene.","v":false},
{"c":6,"k":"hold","id":"pacifica","q":"Which statement about FCC v. Pacifica Foundation is accurate?","o":["The FCC’s declaratory order, without formal sanctions, was upheld","The FCC may criminally prosecute any indecent broadcast at any hour","Indecent speech is unprotected in every medium","The broadcast was obscene under the Miller test"],"e":"Pacifica didn’t decide two-way radio, a lone expletive, or criminal prosecution.","v":false},
{"c":6,"k":"hold","id":"renton","q":"Which statement about City of Renton v. Playtime Theatres is accurate?","o":["Partly content-based zoning got intermediate scrutiny for targeting secondary effects","Adult theaters are unprotected, so rational basis applied to the zoning","The ordinance failed strict scrutiny because it singled out theaters showing sexual films","Cities may ban adult theaters altogether to protect property values"],"e":"The ordinance was upheld because it aimed at crime and property values, not the message.","v":false},
{"c":6,"k":"hold","id":"ferber","q":"Which statement about New York v. Ferber is accurate?","o":["Distribution could be banned without meeting the Miller obscenity test","Distribution could be banned only if the material was also obscene under Miller","The statute fell because it reached works with serious value","The ban covered images that only appear to show minors"],"e":"Ferber’s rationale is the abuse of real children in production.","v":false},
{"c":6,"k":"hold","id":"fsc","q":"Which statement about Ashcroft v. Free Speech Coalition is accurate?","o":["Banning images that only appear to show minors went beyond Ferber","Virtual images are unprotected because they look exactly like real abuse","The CPPA was upheld as applied to computer-generated images","It overruled Ferber for images made before 1996"],"e":"The CPPA also banned speech regardless of serious value, unlike any recognized category.","v":false},
{"c":6,"k":"hold","id":"ashcroft2","q":"Which statement about Ashcroft v. ACLU (Ashcroft II) is accurate?","o":["The government didn’t show the less restrictive alternative was less effective","Protecting minors from sexual material was not a compelling government interest","COPA was upheld because it allowed age verification as a defense","Filters were held unconstitutional as a form of censorship"],"e":"COPA was likely unconstitutional, and the case went back for trial.","v":false},
{"c":6,"k":"hold","id":"paxton","q":"Which statement about Free Speech Coalition v. Paxton is accurate?","o":["Age verification for sexually explicit sites survived intermediate scrutiny","Age verification laws get rational basis, as Texas had argued","The law failed because filters are a less restrictive alternative for parents","Adults have no right to view sexually explicit material online"],"e":"The burden on adults was incidental to keeping minors from speech obscene as to them.","v":false},
{"c":6,"k":"hold","id":"brown","q":"Which statement about Brown v. Entertainment Merchants Association is accurate?","o":["Underinclusiveness alone was enough to defeat the law","The law failed only because it reached adults too","Video games were held to be conduct, not speech","The ratings system made the law unnecessary but still valid"],"e":"Similar effects came from Bugs Bunny cartoons, E-rated games, and even pictures of guns.","v":false},
{"c":6,"k":"why","id":"bolger","q":"Why did it matter in Bolger that the ads were for contraceptives?","o":["The ban purged material entirely suitable for adults","Contraceptive ads are commercial speech with no protection","Congress had banned contraceptives themselves","The ads were obscene under the Miller test"],"e":"Government “may not reduce the adult population to reading only what is fit for children.”","v":false},
{"c":6,"k":"why","id":"cohen","q":"Why didn’t the presence of unwilling viewers justify Cohen’s conviction?","o":["They could avert their eyes, and the corridor wasn’t a captive setting","The viewers were adults who had consented to the message","The message was political, so the viewers’ feelings didn’t count at all","The courthouse was a private building, not a public one"],"e":"Viewers could “avoid further bombardment of their sensibilities simply by averting their eyes.”","v":false},
{"c":6,"k":"why","id":"pacifica","q":"Which statute did the FCC rely on in Pacifica?","o":["18 U.S.C. § 1464, on obscene, indecent, or profane radio language","18 U.S.C. § 48, on depictions of animal cruelty","The Child Online Protection Act","The Stolen Valor Act"],"e":"The FCC used a nuisance model that channels rather than bans.","v":false},
{"c":6,"k":"why","id":"renton","q":"Why isn’t a zoning law aimed at secondary effects treated like a ban on the films’ message?","o":["It targets harms like crime, not reactions to the content","It applies to all theaters in the city, whatever films they show","Adult films carry no message the Constitution protects","Zoning laws never affect speech"],"e":"Harms that flow from the message itself, like offense, aren’t secondary effects.","v":false},
{"c":6,"k":"why","id":"ferber","q":"Why did Ferber say drying up the market may be the only practical enforcement method?","o":["Production is hidden, but marketing needs a visible apparatus","Prosecutors can’t identify the children in the images","Distributors have more money to pay fines than the producers do","Federal law already barred prosecuting producers"],"e":"The other link: the material is a permanent record, and circulation worsens the harm.","v":false},
{"c":6,"k":"why","id":"fsc","q":"Why didn’t Ferber’s rationale support the CPPA’s ban?","o":["No real child is exploited in making virtual images","Virtual images are always obscene under Miller","Ferber applied only to films, not still images","Congress hadn’t made findings about virtual images before passing it"],"e":"Ferber itself had pointed to virtual images as a permissible alternative.","v":false},
{"c":6,"k":"why","id":"ashcroft2","q":"Why do filters reduce chilling compared with COPA?","o":["No speech is criminalized, and adults needn’t identify themselves","Filters are installed by the government, not by private parties or parents","Filters block only obscene speech, never protected speech","Filters are free to every household in the country"],"e":"Filters restrict at the receiving end rather than at the source.","v":false},
{"c":6,"k":"why","id":"paxton","q":"How did Paxton respond to privacy and stigma concerns about age verification?","o":["Sites’ and verifiers’ incentives protect privacy, and stigma exempts no one","It ordered the state to delete all verification records within a single day","It held that privacy concerns trigger strict scrutiny automatically","It declined to address them because no one had raised them"],"e":"Under intermediate scrutiny, less restrictive alternatives like filters don’t defeat a legitimate legislative choice.","v":false},
{"c":6,"k":"why","id":"brown","q":"Why didn’t the interactivity of video games make a difference in Brown?","o":["It differs from books in degree, not kind; all literature is interactive","Interactive media are unprotected, but this law was still too broad to survive","Interactivity matters only for adults, not for minors","The games in the case weren’t actually interactive"],"e":"Choose-your-own-adventure books show interactivity isn’t new.","v":false},
{"c":6,"k":"det","id":"bolger","q":"Which interest did Bolger call “undoubtedly substantial” before finding the ban didn’t serve it well enough?","o":["Helping parents control children’s exposure to the subject","Shielding adult recipients from offensive or unwanted material","Reducing the volume of unsolicited mail","Preventing the sale of contraceptives"],"e":"Parents already control their own mail, so the ban added little.","v":false},
{"c":6,"k":"det","id":"cohen","q":"In the immoral speech synthesis, whom was Cohen protecting against, and what standard applied?","o":["Adults offended by the content; the speech was fully protected","Children at the courthouse; intermediate scrutiny applied","Real children exploited in production; no protection applied at all","Communities near adult businesses; secondary effects applied"],"e":"Outside obscenity, government almost never can restrict immoral speech to protect adults.","v":false},
{"c":6,"k":"det","id":"pacifica","q":"Where does Pacifica return later in the course?","o":["Ch. 9, on time, place, and manner rules","Ch. 7, on defamation","Ch. 8, on commercial speech","Ch. 2, on the Religion Clauses and funding"],"e":"The FCC’s approach channels speech to certain times rather than banning it.","v":false},
{"c":6,"k":"det","id":"renton","q":"In the immoral speech synthesis, whom does Renton’s zoning protect?","o":["Communities","Real children","Adult viewers","Theater owners"],"e":"The harm is indirect: crime and falling property values near adult businesses.","v":false},
{"c":6,"k":"det","id":"ferber","q":"Under what age did New York’s law in Ferber protect children?","o":["16","18","13","21"],"e":"Free Speech Coalition later noted that “appear to be under 18” exceeds many states’ ages of consent.","v":false},
{"c":6,"k":"det","id":"fsc","q":"Which statute was at issue in Ashcroft v. Free Speech Coalition?","o":["The Child Pornography Prevention Act of 1996","The Child Online Protection Act","The Communications Decency Act","18 U.S.C. § 48"],"e":"COPA was Ashcroft II, the CDA was Reno v. ACLU, and § 48 was Stevens.","v":false},
{"c":6,"k":"det","id":"ashcroft2","q":"What does COPA stand for?","o":["Child Online Protection Act","Children’s Obscenity Prevention Act","Communications and Online Privacy Act","Child Obscenity Protection Amendment"],"e":"Not to be confused with the CPPA (Free Speech Coalition) or the CDA (Reno).","v":false},
{"c":6,"k":"det","id":"paxton","q":"Which earlier case did Paxton distinguish because the Communications Decency Act operated as a ban on adult speech?","o":["Reno v. American Civil Liberties Union","Ginsberg v. New York","Butler v. Michigan","Miller v. California"],"e":"Reno (1997) applied strict scrutiny; the CDA’s age-verification defense was illusory given the technology then.","v":false},
{"c":6,"k":"det","id":"brown","q":"Which past media panics did Brown list?","o":["Dime novels, movies, radio, comics, television, and music","Newspapers, pamphlets, political cartoons, and campaign posters","Telephones, telegraphs, and the postal service","Opera, ballet, and classical theater"],"e":"Each new medium drew the same fears; none created a new unprotected category.","v":false},
{"c":6,"k":"apply","id":"bolger","q":"A state bans billboards advertising lingerie anywhere visible from a highway, to protect children. Under Bolger, what is the law’s main problem?","o":["It shields kids by cutting adults off from speech suitable for them","Nothing: billboards are a captive medium, so the ban is valid as applied","Nothing: lingerie ads are obscene, so no review applies","Nothing: a state may ban any ad to protect children"],"e":"Bolger: protecting kids can’t justify a ban that also stops adults from receiving material suitable for adults.","v":false,"w":["Offended viewers can look away. Captive-audience protection is for intrusions into the home or a truly captive setting.","Lingerie ads don’t meet Miller: no prurient appeal, patent offensiveness, or lack of serious value as a whole.","Kids’ protection has limits: it can’t block adult access, and kids have their own rights (Brown)."]},
{"c":6,"k":"apply","id":"cohen","q":"A city fines a driver for a bumper sticker reading “F— Congress,” spelled out in full. What result?","o":["Protected under Cohen: profanity expressing a political view","Unprotected: profanity is a form of obscenity","Unprotected: other drivers on the road are a captive audience","Unprotected: the sticker is fighting words"],"e":"Cohen protects the emotive force of profanity; offended viewers can look away.","v":false,"w":["Obscenity requires sexual content that meets all three Miller prongs. Profanity isn’t obscenity.","Other drivers can avert their eyes, as the courthouse visitors could in Cohen.","Fighting words are a direct personal insult likely to provoke an immediate fight. A sticker aimed at Congress isn’t."]},
{"c":6,"k":"apply","id":"pacifica","q":"A radio station airs a profanity-laced comedy routine at 11:30 p.m., after warnings. The FCC finds it indecent. Under Pacifica’s nuisance rationale, best answer?","o":["A weaker case for the FCC: time of day and warnings matter","The same result as Pacifica: indecency is indecency at any hour","The station wins only if the routine has political value","The FCC wins, because radio is always uniquely pervasive"],"e":"Context is all-important. A broadcast with warnings might be acceptable late at night but not when children are listening.","v":false,"w":["Pacifica’s nuisance rationale makes time of day central; a pig in the parlor, not the barnyard.","Pacifica didn’t turn on political value; it turned on context, especially children’s access.","Pervasiveness is part of the rationale, but the holding was narrow and context-dependent."]},
{"c":6,"k":"apply","id":"renton","q":"A city confines bookstores that sell books criticizing the mayor to an industrial zone, citing traffic. Can it rely on Renton?","o":["No: the doctrine is limited to adult businesses, and this targets a viewpoint","Yes: traffic is a secondary effect, so intermediate scrutiny applies here as well","Yes: zoning laws are always reviewed under intermediate scrutiny","No, but only because traffic studies weren’t done first"],"e":"Renton is narrow, and a rule aimed at criticism of the mayor is viewpoint discrimination subject to strict scrutiny.","v":false,"w":["The Court has refused to extend secondary effects beyond adult establishments, and the stated reason here is pretext for a viewpoint.","Zoning that targets a message isn’t automatically intermediate; content-based rules get strict scrutiny.","Better evidence wouldn’t cure singling out speech critical of the mayor."]},
{"c":6,"k":"apply","id":"ferber","q":"A state bans distributing photos of real children made during their sexual abuse. A gallery owner argues some of the works have serious artistic value. What result?","o":["Unprotected under Ferber; the Miller value prong doesn’t apply","Protected, because works with serious value fail Miller’s prong (c)","Protected, unless the state proves each work is obscene","Protected, because the gallery owner didn’t make the images"],"e":"Ferber: material made with real children is unprotected whether or not it is obscene.","v":false,"w":["Ferber didn’t require Miller’s elements. The harm is the abuse of the children, not the content’s appeal.","Obscenity isn’t required; that was the central point of Ferber.","Closing the distribution network is the point, so distributors are covered."]},
{"c":6,"k":"apply","id":"fsc","q":"A state bans AI-generated sexual images of fictional minors, with no real child involved and no obscenity requirement. What result under Free Speech Coalition?","o":["Likely unconstitutional: no real child, and no Miller showing","Valid: Ferber covers any image that looks like a child, real or not","Valid: Williams lets states ban all such images outright","Valid: AI-generated images get no First Amendment protection"],"e":"Free Speech Coalition limits Ferber to material made with real children. Images that meet Miller could still be banned as obscenity.","v":false,"w":["Free Speech Coalition rejected extending Ferber to images that only appear to show minors.","Williams allows punishing offers believed to involve real children, not banning virtual images as such.","Whether AI output is speech is unsettled (Garcia), and the images here are made and distributed by people."]},
{"c":6,"k":"apply","id":"ashcroft2","q":"Which feature would make an online age-gating law look more like COPA (strict scrutiny) than Texas’s H.B. 1181 (intermediate scrutiny)?","o":["It operates as a ban on adult speech, with an illusory verification defense","It requires age checks only for content that is obscene as to minors, nothing more","It uses government ID or transactional data to verify ages","It adapts the in-person age checks long used for alcohol sales"],"e":"Paxton framed Reno and Ashcroft II as involving effective bans on adult access, which still get strict scrutiny.","v":false,"w":["Limiting coverage to speech obscene for minors is what made Paxton’s burden on adults incidental.","ID and transactional data are the methods Paxton accepted.","Paxton relied on this analogy to traditional in-person age checks to support intermediate scrutiny."]},
{"c":6,"k":"apply","id":"paxton","q":"A state requires every social media site to verify that all users are 18 or older before they can see any content. Can the state rely on Paxton for intermediate scrutiny?","o":["Probably not: Paxton rested on speech obscene for minors; this blocks far more","Yes: any age-verification requirement gets intermediate scrutiny after Paxton was decided","Yes: social media is uniquely accessible to children, like broadcasting","No, because states may never regulate social media sites at all"],"e":"Paxton’s intermediate scrutiny depended on an incidental burden on adults. Minors also have their own rights to protected speech (Brown).","v":false,"w":["Paxton tied its standard to keeping minors from speech obscene as to them, not to age checks as such.","Pacifica’s broadcasting rationale is narrow, and Bolger and Paxton treated it as unique to that medium.","States may regulate online speech; the question is the standard of review, not whether any rule is allowed."]},
{"c":6,"k":"apply","id":"brown","q":"A state bans selling graphic horror comics to minors, citing studies correlating them with aggression. What result under Brown?","o":["Likely unconstitutional: no violence category, and correlation isn’t causation","Valid: minors may be shielded from any material that a legislature finds harmful","Valid: comics are like broadcasting under Pacifica","Valid: Ginsberg lets states adjust any category for minors"],"e":"Brown: no new category for violence, and strict scrutiny requires real evidence of causation.","v":false,"w":["Brown rejected a “free-floating power to restrict the ideas to which children may be exposed.”","Pacifica’s rationale is limited to broadcasting’s pervasiveness in the home.","Ginsberg adjusted an existing category, obscenity, which covers only sexual content."]},
{"c":6,"k":"concept","id":"t-immoral","q":"What unites the categories covered in the immoral speech chapter?","o":["The government seeks to suppress the speech for moral reasons","All of them are unprotected categories of speech under the casebook","All of them involve commercial transactions","All of them are regulated only by the FCC"],"e":"Obscenity, sexually explicit speech, child pornography, profanity, and violent imagery.","v":false},
{"c":6,"k":"concept","id":"t-immoral","q":"What is the first question on the immoral speech checklist?","o":["Did the Court treat the speech as an unprotected category?","Is the speaker a commercial business selling the material for profit?","Was the material shown to children?","Did the legislature hold hearings?"],"e":"If unprotected, rational basis only. If disputed, how was the category defined? If protected, which standard applied?","v":false},
{"c":6,"k":"concept","id":"t-obscenity","q":"What does “prurient interest” mean under the Miller test?","o":["A shameful or morbid interest in nudity, sex, or excretion","Any interest in sex that an average adult might normally have","An interest in material that offends the community","An interest in violent or disturbing imagery"],"e":"A normal interest in sex isn’t prurient (Brockett v. Spokane Arcades).","v":false},
{"c":6,"k":"concept","id":"t-obscenity","q":"Is the Miller test still good law?","o":["Yes, with no serious chance of being overruled","No, Paxton replaced it for material posted online","No, Brown replaced it with strict scrutiny","Only for printed books, not films"],"e":"Some Justices dissented that it is imprecise and chills speech, but it remains the test.","v":false},
{"c":6,"k":"concept","id":"t-secondary","q":"Is a Renton-style zoning law content-based?","o":["Partly, but it gets intermediate scrutiny anyway","No, it is entirely content-neutral like any zoning law","Yes, so it gets strict scrutiny","Yes, so it gets no review at all"],"e":"It singles out adult businesses, but its aim is crime and property values, not the message.","v":false},
{"c":6,"k":"concept","id":"t-childporn","q":"What objective did Ferber call of “surpassing importance”?","o":["Preventing sexual exploitation and abuse of children","Protecting adults from offensive sexual material in public","Reducing crime near adult businesses","Keeping minors from violent media"],"e":"That interest, tied to real children, is why Ferber’s category doesn’t require obscenity.","v":false},
{"c":6,"k":"concept","id":"t-childporn","q":"How does Williams fit with Free Speech Coalition?","o":["Offers believed to involve real children may be punished, even if mistaken","Virtual images may be banned whenever someone offers to sell them","Williams overruled Free Speech Coalition’s protection of virtual images entirely","Both cases held all sexual images of minors are protected"],"e":"Technology makes it nearly impossible to prove which images involve real children, so belief is the element.","v":false},
{"c":6,"k":"concept","id":"t-agegate","q":"What change since Reno and Ashcroft II did Paxton point to?","o":["The internet itself: smartphones and streaming","A constitutional amendment on minors’ rights","Congress repealing the Communications Decency Act","New Supreme Court rules for internet cases"],"e":"Paxton also framed the earlier cases as involving effective bans on adult access.","v":false},
{"c":6,"k":"concept","id":"t-agegate","q":"What did Reno v. ACLU (1997) apply, and why?","o":["Strict scrutiny, because the CDA worked as a ban on adult speech","Intermediate scrutiny, because the burden on adults was incidental","Rational basis, because the speech was harmful to minors","No review, because the internet wasn’t yet regulated"],"e":"Its age-verification defense was illusory given the technology at the time.","v":false},
{"c":6,"k":"apply","id":"t-immoral","q":"A town removes a park sculpture of nude figures because some adults find it offensive. No one claims it is obscene. What result?","o":["Likely unconstitutional: offended adults can look away","Valid: nudity is indecent, and indecency is unprotected","Valid: parks are like broadcasting under Pacifica","Valid: offensiveness is a secondary effect under Renton"],"e":"Outside obscenity, government almost never can restrict immoral speech to protect adults. (Whether the town’s own displays are government speech is a later topic.)","v":false,"w":["Indecent speech is generally protected; Pacifica is a narrow exception for broadcasting.","Pacifica rested on broadcasting’s unique reach into the home and to unsupervised children.","Secondary effects are harms like crime and property values, not offense at the content."]},
{"c":6,"k":"apply","id":"t-obscenity","q":"A prosecutor shows that one scene in an acclaimed two-hour war film is sexually graphic. Is the film obscene?","o":["No: prong (c) asks whether the work as a whole lacks serious value","Yes: one patently offensive scene is enough to satisfy the Miller test","Yes, if the average viewer finds that scene arousing","No, but only because war films are political speech"],"e":"“The artistic merit of a work does not depend on the presence of a single explicit scene.”","v":false,"w":["All three prongs must be met, and prongs (a) and (c) look at the work as a whole.","Prurient appeal is judged for the work as a whole, and serious value would still defeat prong (c).","Any work with serious literary, artistic, political, or scientific value is protected, not only political works."]},
{"c":6,"k":"apply","id":"t-obscenity","q":"A state statute bans “sexual material” without defining which sexual conduct it covers. Which Miller element is it missing?","o":["Prong (b): sexual conduct specifically defined by state law","Prong (a): community standards for judging the work’s prurient appeal","Prong (c): serious value of the work as a whole","None: Miller doesn’t require statutory definitions"],"e":"Prong (b) requires a patently offensive depiction of sexual conduct specifically defined by the applicable state law.","v":false,"w":["Prong (a) is about how the work is judged, not how the statute is written.","Prong (c) concerns the work’s value, not the statute’s definitions.","Prong (b) expressly requires the sexual conduct to be specifically defined."]},
{"c":6,"k":"apply","id":"t-secondary","q":"A city zones adult bookstores away from schools and homes, relying on studies of crime near such stores. Which standard applies?","o":["Intermediate scrutiny, as a secondary-effects rule","Strict scrutiny, because the rule is content-based","Rational basis, because adult books are unprotected","No review, because zoning is a local power"],"e":"Renton: zoning that targets crime and property values gets intermediate scrutiny even though it is partly content-based.","v":false,"w":["Renton is the exception: partly content-based, but reviewed under intermediate scrutiny.","Adult material that isn’t obscene is protected, so rational basis doesn’t apply.","Zoning that affects speech still gets First Amendment review."]}
];
</script>
<script>
(function () {
  const CH = { 1: "First Amendment Overview", 2: "The Religion Clauses", 3: "Speech Clause Overview", 4: "Violence and National Security", 5: "True Threats and Speech Integral to Crime", 6: "Immoral Speech" };
  const KIND = { name: "Name the case", hold: "Holding", why: "Reasoning", det: "Details", concept: "Concepts & elements", apply: "Application" };
  const LETTERS = "ABCDEF";
  const KEY = "fa-case-repetition-vol2.v1";

  const N = QB.length;
  let perms = [];          // perms[i] = display order of original option indices (0 is correct)
  let order = [];          // question display order
  let answers = {};        // i -> original option index chosen
  let out = {};            // i -> Set of original option indices crossed out
  let chFilter = "all", kindFilter = "all", caseFilter = "all", missedOnly = false, qShuffled = false;

  function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function freshPerms() { perms = QB.map(q => shuffle(q.o.map((_, j) => j))); }

  function save() { try { localStorage.setItem(KEY, JSON.stringify({ perms, answers, n: N })); } catch (e) {} }
  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(KEY) || "null");
      if (s && s.n === N && Array.isArray(s.perms) && s.perms.length === N) { perms = s.perms; answers = s.answers || {}; return; }
    } catch (e) {}
    freshPerms();
  }

  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  // Strike-through toggle beside an option. It flips the option in place, so focus stays on the button.
  const STRIKE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4H9a3 3 0 0 0-2.83 4"/><path d="M14 12a4 4 0 0 1 0 8H6"/><path d="M4 12h16"/></svg>';
  function crossBtn(opt, letter, xs, orig) {
    const x = el("button", "xo"); x.type = "button"; x.title = "Cross out";
    x.setAttribute("aria-label", "Cross out choice " + letter);
    x.setAttribute("aria-pressed", String(xs.has(orig)));
    x.innerHTML = STRIKE;
    x.onclick = () => { xs.has(orig) ? xs.delete(orig) : xs.add(orig); opt.classList.toggle("out", xs.has(orig)); x.setAttribute("aria-pressed", String(xs.has(orig))); };
    return x;
  }

  // The case's (or topic's) scene. Blurred while it would give the answer away; named once you answer.
  function figure(q, answered) {
    const f = el("figure", "fig" + (q.v && !answered ? " veil" : ""));
    const cs = CASES[q.id] || TOPICS[q.id];
    f.innerHTML = '<svg class="ill" viewBox="0 0 120 80" role="img" aria-label="' + (q.v && !answered ? "Hidden case illustration" : "Illustration for " + cs.n.replace(/"/g, "")) + '"><g>' + ILL[q.id] + '</g></svg>';
    f.appendChild(el("figcaption", null, answered ? cs.n + (cs.y ? " (" + cs.y + ")" : "") : q.v ? "The picture shows after you answer." : ""));
    return f;
  }

  function chips(host, items, get, set) {
    items.forEach(([val, label]) => {
      const b = el("button", "chip", label); b.type = "button";
      b.setAttribute("aria-pressed", String(get() === val));
      b.onclick = () => { set(val); host.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", "false")); b.setAttribute("aria-pressed", "true"); render(); };
      host.appendChild(b);
    });
  }

  function inPool(i) {
    const q = QB[i];
    return (chFilter === "all" || q.c === chFilter) && (kindFilter === "all" || q.k === kindFilter) && (caseFilter === "all" || q.id === caseFilter);
  }
  function visible(i) { return inPool(i) && !(missedOnly && !(i in answers && answers[i] !== 0)); }

  function renderCard(i, num) {
    const q = QB[i], card = el("article", "q");
    const meta = el("div", "meta");
    meta.append(el("span", null, "Q" + num), el("span", null, "Ch. " + q.c), el("span", "kind", KIND[q.k]));
    const answered = i in answers;
    const body = el("div", "qbody");
    body.append(el("p", "stem", q.q), figure(q, answered));
    const box = el("div", "opts"); box.setAttribute("role", "group");
    const xs = out[i] || (out[i] = new Set());
    perms[i].forEach((orig, pos) => {
      const b = el("button", "opt"); b.type = "button";
      b.append(el("span", "ltr", LETTERS[pos]), el("span", null, q.o[orig]));
      if (xs.has(orig)) b.classList.add("out");
      if (answered) {
        b.disabled = true;
        if (orig === 0) b.classList.add("correct");
        else if (orig === answers[i]) b.classList.add("wrong");
      }
      b.onclick = () => { answers[i] = orig; save(); card.replaceWith(renderCard(i, num)); updateScore(); };
      const row = el("div", "orow"); row.appendChild(b);
      if (!answered) row.appendChild(crossBtn(b, LETTERS[pos], xs, orig));
      box.appendChild(row);
    });
    body.appendChild(box);
    card.append(meta, body);
    if (answered) {
      const ok = answers[i] === 0, ex = el("div", "explain" + (ok ? "" : " miss"));
      const lead = el("strong", null, ok ? "Correct. " : "Not quite. The answer is " + LETTERS[perms[i].indexOf(0)] + ". ");
      ex.append(lead, document.createTextNode(q.e));
      // Application questions also say why each other choice is wrong, lettered as shown.
      if (q.w) {
        const ul = el("ul", "whyno");
        perms[i].forEach((orig, pos) => {
          if (orig === 0) return;
          const li = el("li"); li.append(el("strong", null, LETTERS[pos] + ". "), document.createTextNode(q.w[orig - 1]));
          ul.appendChild(li);
        });
        ex.append(el("p", "whyhd", "Why the others are wrong"), ul);
      }
      card.appendChild(ex);
    }
    return card;
  }

  function render() {
    const list = document.getElementById("list"); list.innerHTML = "";
    let n = 0, lastCh = null;
    order.forEach(i => {
      if (!visible(i)) return;
      n++;
      if (!qShuffled && QB[i].c !== lastCh) {
        lastCh = QB[i].c;
        const h = el("h2", "chhead"); h.append(el("small", null, "Chapter " + lastCh), document.createTextNode(CH[lastCh])); list.appendChild(h);
      }
      list.appendChild(renderCard(i, n));
    });
    if (!n) list.appendChild(el("p", "empty", missedOnly ? "No missed questions in this set. Answer a few first, or turn off Show missed only." : "No questions match these filters."));
    updateScore();
  }

  function updateScore() {
    const pool = QB.map((_, i) => i).filter(inPool);
    const done = pool.filter(i => i in answers), right = done.filter(i => answers[i] === 0);
    document.getElementById("s-done").textContent = done.length;
    document.getElementById("s-total").textContent = pool.length;
    document.getElementById("s-right").textContent = right.length;
    document.getElementById("s-pct").textContent = done.length ? Math.round(100 * right.length / done.length) + "%" : "–";
    document.getElementById("s-meter").style.width = pool.length ? (100 * done.length / pool.length) + "%" : "0";
  }

  let toastT;
  function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => t.textContent = "", 2200); }

  load();
  order = QB.map((_, i) => i);
  document.getElementById("lede").textContent = N + " new questions on the same " + Object.keys(CASES).length + " cases and " + Object.keys(TOPICS).length + " topics as Volume 1, asked from different angles: new details to name each case by, its holding and reasoning, the doctrine around it, and the core concepts and elements. Application questions put each rule to a new fact pattern and explain why every wrong choice is wrong. Every question has an illustration. Click an answer to see the explanation.";

  chips(document.getElementById("f-ch"), [["all", "All"], ...Object.keys(CH).map(c => [Number(c), "Ch. " + c])], () => chFilter, v => chFilter = v);
  chips(document.getElementById("f-kind"), [["all", "All"], ...Object.entries(KIND)], () => kindFilter, v => kindFilter = v);
  const sel = document.getElementById("f-case");
  sel.append(new Option("All cases", "all"));
  const gCases = document.createElement("optgroup"), gTopics = document.createElement("optgroup");
  gCases.label = "Cases"; gTopics.label = "Concepts & elements";
  Object.entries(CASES).forEach(([id, c]) => gCases.append(new Option("Ch. " + c.ch + " · " + c.n, id)));
  Object.entries(TOPICS).forEach(([id, t]) => gTopics.append(new Option("Ch. " + t.ch + " · " + t.n, id)));
  sel.append(gCases, gTopics);
  sel.onchange = () => { caseFilter = sel.value; render(); };

  document.getElementById("b-shuf-ans").onclick = () => { freshPerms(); save(); render(); toast("Answer order shuffled."); };
  document.getElementById("b-shuf-q").onclick = e => {
    qShuffled = !qShuffled;
    order = qShuffled ? shuffle(QB.map((_, i) => i)) : QB.map((_, i) => i);
    e.currentTarget.textContent = qShuffled ? "Restore chapter order" : "Shuffle questions";
    render(); toast(qShuffled ? "Questions shuffled." : "Chapter order restored.");
  };
  document.getElementById("b-missed").onclick = e => { missedOnly = !missedOnly; e.currentTarget.setAttribute("aria-pressed", String(missedOnly)); e.currentTarget.classList.toggle("primary", missedOnly); render(); };
  document.getElementById("b-reset").onclick = () => { answers = {}; out = {}; save(); render(); toast("Answers cleared."); };

  render();
})();
</script>
