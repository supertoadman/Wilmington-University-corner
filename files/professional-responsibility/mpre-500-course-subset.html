{"t": "agt", "q": "An attorney was representing Conglomerate Corporation, a large employer, in labor negotiations with the employee’s union. The union had demanded, among other things, better coverage for birth control and abortions under the employee health insurance plan. The attorney told the union’s lawyers that adding this benefit would cost the company an additional $142.37 per employee per quarter, but the attorney knew that it would in fact cost only $30 per employee. The attorney had learned over the years that using overly-specific numbers instead of round numbers was a more effective strategy for bluffing. Under the Model Rules, was it permissible for the attorney to make this false statement to a third party?", "a": ["No, a lawyer shall not knowingly make a false statement of material fact to a third person.", "Yes, such remarks are merely posturing or puffing, and are not statements upon which parties would justifiably rely, so they are not false statements of material fact.", "Yes, because the rules covering false statements to an opposing party or counsel apply only in the litigation context.", "No, bluffing by using hyper-specific fictitious numbers is too tricky, especially when round numbers are more accurate."], "e": "4.1(a) forbids knowingly making a false statement of material fact to a third person. A specific, invented cost figure ($142.37 per employee when the true cost is $30) is a factual assertion the union would rely on, not puffing about values or bottom lines. Labor negotiations aren't exempt, since 4.1 isn't limited to litigation. The problem isn't the specific-number technique; it's that the fact is false. Book cite: Rule 4.1; ABA Formal Op. 06-439. [W2:41, 67; outline VII-B]", "r": "Stevenson, 500 MPRE Questions (2019) Q465 · Rule 4.1 Truthfulness in Statements to Others"},
{"t": "agt", "q": "A prosecutor was conducting a plea negotiation with a defendant and his lawyer. During the plea negotiation, the prosecutor told the defendant and his counsel that there was an eyewitness to the alleged crime, who could identify the defendant as the perpetrator. This was not the case – the prosecutor was just bluffing, and the defense counsel suspected it was not true and decided to wait on deciding anything until he could depose or interview the witness himself. Was it permissible for the prosecutor to bluff like this during a plea negotiation, if no harm resulted?", "a": ["No, a lawyer shall not knowingly make a false statement of material fact or law to a third person.", "Yes, under accepted conventions in negotiation, certain types of statements ordinarily do not count as statements of material fact.", "Yes, such remarks are merely posturing or puffing, and are not statements upon which parties would justifiably rely, so they are not false statements of material fact.", "No, because an eyewitness might in fact come forward later, the prosecutor’s earlier bluffing about this would undermine the true eyewitness’ credibility."], "e": "4.1(a) forbids knowingly making false statements of material fact to third persons, and that applies to prosecutors in plea negotiations. Claiming an eyewitness can identify the defendant when none exists is a false statement about the evidence, a material fact, not negotiation puffery about value or intentions. It also violates 8.4(c). That defense counsel didn't believe it and no harm resulted doesn't matter. Book cite: Rule 4.1; ABA Formal Op. 06-439. [W2:41, 67; W1:27–28]", "r": "Stevenson, 500 MPRE Questions (2019) Q466 · Rule 4.1 Truthfulness in Statements to Others"},
{"t": "agt", "q": "An attorney had struggled all through law school with the sheer amount of reading and memorization, and then she had struggled to establish a successful law practice because everything took so much time and acumen. She advertised heavily as a personal injury plaintiff’s lawyer, and she attracted new clients through deal-of-the-day promotions that she ran through a service called PleaseTryThis. Her advertising was so prevalent that when police stopped her vehicle for speeding violations, the officers would immediately recognize her as the lawyer from the advertisements, and sometimes this helped her avoid receiving a ticket. One personal injury client presented an unusually complicated problem. After filing pleadings in the case, while the proceedings were still in the discovery phase, the client died in a car accident, unrelated to the previous injuries that were the basis of the lawsuit. During subsequent settlement negotiations with a corporate defendant, Giant Company, the attorney did not disclose that her client had already died, but continued negotiations as if the client was still alive and had authorized her to accept or reject certain offers. Was it permissible for the attorney to delay disclosure of the client’s death during the initial stages of settlement negotiations?", "a": ["No, a lawyer engaged in settlement negotiations of a pending personal injury lawsuit in which the client was the plaintiff cannot conceal the client’s death; she must promptly notify opposing counsel and the court of that material fact.", "Yes, a lawyer engaged in settlement negotiations of a pending personal injury lawsuit in which the client was the plaintiff may temporarily conceal the client’s death from the opposing party and their counsel.", "Yes, because the case could continue as a wrongful death action, the client’s death is not a material fact necessitating immediate disclosure.", "No, because the client’s death is a matter of public record."], "e": "Under ABA Op. 95-397, a lawyer must promptly disclose a client's death to opposing counsel and the court. The death ends the lawyer's authority from that client, and continuing to negotiate as if a living client were authorizing offers is a misrepresentation by conduct (4.1(a); 8.4(c)) and implicates candor to the court (3.3). The death is plainly material. Possible survival or wrongful-death claims don't make it immaterial, and it isn't public record that the opponent knows. Book cite: ABA Formal Op. 95-397; Rule 4.1. [W4:23–30 (authority); W2:41, 67]", "r": "Stevenson, 500 MPRE Questions (2019) Q467 · Rule 4.1 Truthfulness in Statements to Others"},
{"t": "reg", "q": "An attorney knows that his opposing counsel has a reputation for refusing to settle cases and forcing lawsuits to go to trial, to impose the full costs of litigation on the opposing party. Cultivating this reputation serves as a deterrent to other would-be litigants against opposing counsel’s clients. To avoid a rebuff by opposing counsel, the attorney finds a close friend of the opposing party, and he asks the close friend to communicate an informal settlement offer to the opposing party directly, bypassing the other lawyer. The opposing party is delighted to hear the offer and readily agrees to settle the case. Opposing counsel is furious and reports the attorney for misconduct. The attorney claims that he did not communicate with opposing counsels’ client. Instead, the friend did, so the prohibitions on contact with other parties would not apply. Is the attorney correct?", "a": ["No, a lawyer may not make a communication prohibited by the Rules through the acts of another, such as the friend in this case.", "Yes, the friend’s willingness to be an informal intermediary serves as an independent intervening actor that breaks the line of causation to the attorney.", "Yes, the opposing party’s eagerness to settle the case shows that the attorney did what the other party wanted; such an endorsement after the fact negates any potential violation of the Rules.", "No, lawyers may never speak directly to an opposing party under any circumstances; even if the opposing counsel had consented to the communication, the attorney would be subject to discipline."], "e": "4.2 bars communicating about the matter with a person the lawyer knows is represented, without the other lawyer's consent. 8.4(a) makes it misconduct to violate the Rules through the acts of another, which the readings call the 'no-puppetry' rule. Sending a friend to deliver a settlement offer directly to the represented opponent is a 4.2 violation by proxy. The opponent's eagerness doesn't cure it. The rule isn't absolute: with opposing counsel's consent, direct contact is allowed. Book cite: Rule 4.2. [W1:7; S1:34; outline I-D]", "r": "Stevenson, 500 MPRE Questions (2019) Q471 · Rule 4.2 Communication with Person Represented by Counsel"},
{"t": "rel", "q": "An attorney sees a friend at a high school reunion. The friend asks the attorney for advice about a potential civil lawsuit that the friend is considering hiring an attorney to file. The attorney gives the friend general information about the area of law and about the specific kind of lawsuit an attorney might potentially file for the friend. The friend lives too far away from the attorney for the attorney to handle the case, and the friend is planning to hire another lawyer near his residence to handle the lawsuit. The attorney later talks to his own wife about the friend’s lawsuit. Wife discusses the suit with her own friend. The friend discovers that several people know about his potential suit and is upset, as he believed that the attorney should not have spoken about his potential case to others. Is the attorney subject to discipline?", "a": ["No, an attorney owes no duties or protections, including protections against disclosing information about potential lawsuits, to persons who communicate with attorneys without any expectation of forming a client-attorney relationship.", "Yes, attorneys shall not disclose information about potential lawsuits they discuss with others unless authorized by that person, whether the person is or is not a potential or current client.", "Yes, persons with whom an attorney discusses potential litigation, even if only in a general manner, are prospective clients and have the same protection as if they were, in fact, clients themselves.", "No, an attorney may discuss potential client cases with others assuming the potential client did not retain the attorney to handle the matter that potential client discussed with the attorney."], "e": "Duties of confidentiality to a non-client arise from a prospective-client consultation (1.18) or a promise. A friend who asked general questions at a reunion about a suit he planned to have a local lawyer file wasn't consulting this attorney about representing him, and no reasonable person would see that chat as interviewing counsel. So no 1.18 duty arose, and repeating it isn't disciplinable, though discretion is wise. The answers treating everyone who discusses litigation as a prospective client overstate the rule. [W3:6 (Problem 8A-5); W2:41]", "r": "Stevenson, 500 MPRE Questions (2019) Q478 · Rules 4.3 Unrepresented Persons"},
{"t": "rel", "q": "A litigation attorney from Big Firm was representing Conglomerate Corporation as the defendant in a civil matter. The attorney learned that the opposing party had hired an expert witness to support their claims, so she decided to initiate an ex parte contact with the expert witness retained to testify for the opposing party, without first obtaining permission from the opposing counsel. In fact, opposing counsel had asked the expert not to discuss the case with the inquiring lawyer. The attorney introduced herself by name, but she did not mention that she was a lawyer or that she had any relationship with the case. Instead, she said she was “researching an issue” and that the expert was a well-known specialist on the topic, which was true. The expert was willing to answer her questions because he was unaware that she was opposing counsel in the case. The attorney pressed the expert for specific examples of the issue they were discussing, which led the expert to mention his research related to the current litigation. The expert revealed information to the attorney that was useful for her representation of her client. Could the attorney be subject to discipline for discussing the matter with the expert without discussing her relationship to the case?", "a": ["Yes, when a lawyer contacts any witness, lay or expert, actual or potential, the lawyer must not knowingly leave the witness in ignorance of the lawyer’s relationship to the case that gives occasion to the contact.", "Yes, because the Model Rules establish an automatic bar to lawyers initiating contact with the opposing party’s experts without first obtaining permission from the opposing counsel.", "No, because the opposing party or its lawyer may not properly ask the expert not to discuss the case with the inquiring lawyer.", "No, because the Model Rules do not establish an automatic bar to lawyers initiating contact with the opposing parties’ experts."], "e": "When a lawyer contacts any witness, lay or expert, she must not leave the witness ignorant of her role in the case (4.1; 4.3; 8.4(c)). ABA Op. 93-378 also notes that contact with an opponent's retained expert may be limited by discovery rules. Posing as a researcher to draw out the expert's case-related work is deceptive, so the lawyer is subject to discipline. There's no automatic bar on contacting experts, but the contact here was improper because of the deception. Book cite: ABA Formal Op. 93-378; Rule 4.3. [W2:41; outline III-F]", "r": "Stevenson, 500 MPRE Questions (2019) Q479 · Rules 4.3 Unrepresented Persons"},
{"t": "rel", "q": "An inexperienced attorney represented an insurance company in a wrongful-death lawsuit. The plaintiff was the widow of the deceased, acting as the personal representative of the deceased. The widow was a pro se litigant, as she did not have legal representation in the matter. The lawsuit was over the death of her husband. The pro se widow asserted that one of the insurance company's policyholders had negligently caused the husband's death. State law required that settlements of a wrongful death claim by a personal representative must have approval from a tribunal. The widow and the insurance company's claims manager eventually agreed on a settlement amount. The attorney, representing the insurance company, prepared the necessary documents and presented them to the widow for her signature. The widow, knowing that the attorney represented the interests of the insurance company, asked the attorney why the documents were necessary. The attorney responded that to effectuate the settlement, they needed to execute the documents and file them for court approval. This was true. Was the attorney's conduct improper, under the Model Rules?", "a": ["No, so long as the unrepresented person understands that the lawyer represents an adverse party and is not representing the person, the lawyer may prepare documents that require the person's signature and explain the lawyer's own view of the meaning of the document or the underlying legal obligations.", "Yes, when the lawyer knows or should know that the unrepresented person misunderstands the lawyer’s role in the matter, the lawyer shall make reasonable efforts to correct the misunderstanding.", "Yes, a lawyer shall not give legal advice to an unrepresented person, other than the advice to secure counsel, if the lawyer knows or should know that the interests of such a person are or potentially conflict with the interests of the client.", "No, a lawyer may give legal advice to an unrepresented person, even if the interests of such a person in conflict with the interests of the client."], "e": "When dealing with an unrepresented person who knows the lawyer represents the other side, the lawyer may negotiate, prepare documents for the person to sign, and explain the lawyer's own view of what they mean (4.3 cmt [2]). The widow knew the attorney represented the insurer, and his true answer about why court approval was needed wasn't legal advice to her. A lawyer may not give an unrepresented adverse person legal advice other than to get a lawyer. There was no misunderstanding to correct here. Book cite: Restatement § 103; Rule 4.3 cmt. [3]. [S2:49–50; outline III-F]", "r": "Stevenson, 500 MPRE Questions (2019) Q480 · Rules 4.3 Unrepresented Persons"},
{"t": "rel", "q": "A highly experienced attorney represented Big Bank as the financer in a home sale. The buyer, that is, the borrower, did not have legal representation in the transaction. Under the terms of the transaction, the buyer was to pay the legal fees of the attorney. The buyer wrote an email to the attorney stating, “I have several questions about legal issues in the house purchase on which you are representing me.” The buyer also had several phone conversations with the attorney in which the buyer made similar statements. What is the attorney's ethical duty in this situation, regarding the buyer?", "a": ["The attorney must inform the buyer that the attorney represents only Big Bank, and that the buyer should not rely on the attorney to protect the buyer's interests in the transaction.", "The attorney must withdraw from the representation unless both the buyer and Big Bank give informed consent, confirmed in writing, to the attorney's continued representation of Big Bank.", "The attorney must refer the buyer to another lawyer in his firm to answer the buyer's questions about the transaction.", "The attorney has no ethical duties to the buyer because there is no client-lawyer relationship between them."], "e": "When a lawyer knows an unrepresented person misunderstands the lawyer's role, 4.3 requires reasonable efforts to correct the misunderstanding. The buyer, whose interests may conflict with the bank's, should get no legal advice except to obtain counsel. The buyer repeatedly said the attorney represented him, and his paying the lawyer's fee made that confusion likely, so the attorney must clearly say he represents only the bank. There's no client relationship requiring withdrawal or consent, but 'no duties at all' ignores 4.3. Book cite: Restatement § 103; Rule 4.3. [S2:49–50; W2:45]", "r": "Stevenson, 500 MPRE Questions (2019) Q481 · Rules 4.3 Unrepresented Persons"},
{"t": "hum", "q": "An attorney represented a powerful but controversial politician. A prosecutor was seeking an indictment of the attorney’s client, so the attorney located a young woman who volunteered to befriend the prosecutor at a social event and exchange phone numbers. Then, at the attorney’s request, the young woman would call the prosecutor and engage in lurid sexual conversations over the phone, while the attorney was recording the conversations. The prosecutor was unaware that the attorney and the young woman were recording the conversations, but the laws of that state required the knowledge and consent of only one participant to record a conversation. The attorney then sent the prosecutor a copy of the recordings of the phone conversations, which were very embarrassing to the prosecutor. The attorney did not include any communication with the recordings, such as threats or extortionary demands. Nevertheless, the prosecutor did not want the recording to become public, so he stopped pursuing the indictment of the attorney’s client. Was it permissible for the attorney to record these phone conversations, under these circumstances?", "a": ["No, if a lawyer records a conversation with no substantial purpose other than to embarrass or burden a third person, the lawyer has violated Rule 4.4.", "Yes, a lawyer has a duty to engage in zealous advocacy on behalf of the client, and to use every legal means available to achieve the client’s legal objectives.", "Yes, because a lawyer may electronically record a conversation without the knowledge of the other party to the conversation without violating the Model Rules, if the recording is not otherwise illegal.", "No, because a lawyer who electronically records a conversation without the knowledge of the other party or parties to the conversation is violating the Model Rules."], "e": "4.4(a) forbids means that have no substantial purpose other than to embarrass, delay, or burden a third person. ABA Op. 01-422 says secretly recording a conversation isn't itself unethical where it's legal, but this scheme (luring a prosecutor into lurid calls, recording them, and sending him the tapes to get him to drop an indictment) served only to embarrass and pressure him, and it prejudices the administration of justice (8.4(d)). Zeal never justifies it. Book cite: Rule 4.4; ABA Formal Op. 01-422. [W4:50 n.19; W1:59]", "r": "Stevenson, 500 MPRE Questions (2019) Q483 · Rule 4.4 Rights of Third Persons"},
{"t": "hum", "q": "Local police obtained photographs from partygoers, and the photographs showed minors from the local high school consuming beer and engaging in sexual activity at a recent drinking party. The police forwarded the photographs to the local prosecutor, who decided not to pursue criminal charges in the matter for several legal and evidentiary reasons. Instead, in hopes of shocking the minors' parents into dealing with underage drinking, the prosecutor showed them photos of their children drinking and engaging in sexual activity at the party. All the parents saw all the photos, including those of other parents' children drinking, some unclothed and others partially clothed, at the party. Could the prosecutor be subject to discipline for his zealous advocacy against underage drinking?", "a": ["Yes, a lawyer shall not use means that have no substantial purpose other than to embarrass or burden a third person.", "Yes, a prosecutor must refrain from making extrajudicial disclosures that have a substantial likelihood of heightening public condemnation of the accused.", "No, responsibility to a client requires a lawyer to subordinate the interests of others to those of the client.", "No, a prosecutor may make disclosures that are necessary to inform the public of the nature and extent of the prosecutor's action and that serve a legitimate law enforcement purpose."], "e": "4.4(a) bars using means that have no substantial purpose other than to embarrass or burden third persons. Having declined to charge anyone, the prosecutor showed every parent explicit photos of other families' children, an exposure that served no legitimate law-enforcement purpose and gratuitously embarrassed the minors and their families. He was disciplined. Trial-publicity rules aren't the issue, and 'zealous advocacy' doesn't justify humiliating nonparties. Book cite: In re Campbell (Kan. 2009); Rule 4.4(a). [W4:50 n.19; W1:59]", "r": "Stevenson, 500 MPRE Questions (2019) Q484 · Rule 4.4 Rights of Third Persons"},
{"t": "prop", "q": "An attorney had included false statements on his application for admission to the bar, but the lies went undetected, so the attorney obtained his license and began to practice law. The nonlawyer employees he hired to work at his firm were aware that he had lied on his bar application, but they did not report this to the state disciplinary authorities. The firm had no legal malpractice insurance, but the attorney neglected to disclose this to some of the firm’s prospective clients. At one point, the attorney represented a seller in a business transaction involving industrial equipment. To complete the transaction, the purchaser sent the attorney a check for the agreed-upon purchase price, with a letter directing the attorney to forward the money to the seller, whom the attorney represented in the matter. The attorney notified his client immediately that the money had come in. The client was traveling at the time and asked the attorney to hold the funds until he returned from his trip. The attorney had only recently launched the firm and did not yet have a client trust account at any banks in the area, so he deposited the check in his own bank account temporarily. As soon as the check cleared, the attorney wrote a check to the client for the full amount, which the client picked up in person. Did the attorney act properly regarding the funds?", "a": ["No, the attorney had an obligation to hold the funds in a separate account from the attorney’s own property.", "Yes, because the amount was less than the amount that would trigger the ethical rules pertaining to separate client accounts.", "Yes, because the client asked the attorney to hold the funds temporarily, and the attorney faithfully delivered the entire sum to the client with his own check.", "No, because the attorney should have refused the check and instructed the purchaser instead to write a check directly to the client."], "e": "1.15(a) requires holding client and third-party funds separate from the lawyer's own property, in a trust account. Depositing the sale proceeds in his personal account was commingling, a violation even though it was temporary, at the client's request, and every dollar was repaid. The readings stress that commingling is wrongful in itself, without any loss. He should have opened a trust account first. No dollar threshold applies, and receiving the check was fine. Book cite: Rule 1.15(a). [W5:30–32; S5:29–37]", "r": "Stevenson, 500 MPRE Questions (2019) Q485 · Rule 1.15 Safekeeping Property"},
{"t": "prop", "q": "An attorney has a busy transactional practice and frequently must handle client funds, either for making commercial purchases, sales, leases, dispute settlements, or other transfers. The attorney faithfully deposits client money in a separate trust account and does not commingle the funds with his own, except that he deposits enough of his own money in the account to cover the monthly bank service charges. The attorney keeps complete, accurate records of all deposits and withdrawals for a full year, after which he destroys the records to preserve client confidentiality. Is the attorney acting improperly?", "a": ["Yes, because the attorney did not keep records for a long enough period.", "Yes, because the attorney should not have deposited any of his own funds in the account together with client funds.", "No, because the lawyer may deposit the lawyer's own funds in a client trust account for the sole purpose of paying bank service charges on that account.", "No, because the attorney keeps property of clients or third persons that is in a lawyer's possession in connection with a representation separate from the lawyer's own property, in a separate account maintained in the state where the lawyer's office is situated."], "e": "1.15(a) requires keeping complete trust-account records for five years after the representation ends, or whatever period the state sets, and the readings say record failures are a violation even if every dollar is present. Destroying them after one year violates the Rule, and confidentiality doesn't justify it. Depositing his own funds only to cover bank service charges is expressly allowed (1.15(b)), so that part was fine. Book cite: Rule 1.15(a). [W5:32, 37–38; S5:39, 41]", "r": "Stevenson, 500 MPRE Questions (2019) Q486 · Rule 1.15 Safekeeping Property"},
{"t": "prop", "q": "A natural disaster struck a certain attorney’s city and destroyed his office, including many documents of intrinsic value belonging to clients. Which of the following would be one of the attorney’s ethical duties as a result?", "a": ["The attorney must make reasonable efforts to reconstruct documents of intrinsic value for both current and former clients, or to obtain copies of the documents that come from an external source.", "The attorney must self-report the loss to the state disciplinary authority and accept whatever sanction it imposes.", "The attorney must compensate the clients for the documents, including the return of a portion of the legal fees that the attorney received from the client.", "The attorney must promptly notify the opposing party in each clients’ matter about the loss of important documents that might be relevant or material to the other party."], "e": "Under ABA Op. 18-482, after a disaster destroys client property in a lawyer's care, the lawyer must make reasonable efforts to reconstruct documents of intrinsic value for current and former clients, or obtain copies from outside sources. That follows from the duty to safeguard property 'with the care required of a professional fiduciary' (1.15 cmt [1]) and to notify clients about it. Self-reporting to the bar, refunding fees, and notifying opponents aren't required. Book cite: Rule 1.15; ABA Formal Op. 18-482. [W5:28–30] (Op. 18-482 isn't discussed in the readings)", "r": "Stevenson, 500 MPRE Questions (2019) Q487 · Rule 1.15 Safekeeping Property"},
{"t": "prop", "q": "A natural disaster struck a certain attorney’s city and destroyed his office, including many documents of that had no intrinsic value belonging to clients, that serve no useful purpose to the client or former client, or for which there are electronic copies. Which of the following would be one of the attorney’s ethical duties as a result?", "a": ["The attorney need not notify either current or former clients about lost documents that have no intrinsic value.", "The attorney must self-report the loss to the state disciplinary authority and accept whatever sanction it imposes.", "The attorney must compensate the clients for the documents.", "The attorney must make reasonable efforts to reconstruct documents of intrinsic value for both current and former clients, or to obtain copies of the documents that come from an external source."], "e": "ABA Op. 18-482 says a lawyer need not notify current or former clients about destroyed documents that have no intrinsic value, serve no useful purpose, or exist electronically. Losing them causes no harm, so 1.4 and 1.15 don't require notice. The reconstruction duty applies only to documents of intrinsic value. No self-report or compensation is required. Book cite: Rule 1.15; ABA Formal Op. 18-482. [W5:28–30] (Op. 18-482 isn't discussed in the readings)", "r": "Stevenson, 500 MPRE Questions (2019) Q488 · Rule 1.15 Safekeeping Property"},
{"t": "prop", "q": "A natural disaster struck a certain attorney’s city and destroyed his office, including his records of his client trust accounts. What must the attorney do in response, to satisfy his ethical obligations to keep records of such accounts?", "a": ["The attorney must attempt to reconstruct the records from available sources.", "The attorney must self-report the loss to the state disciplinary authority and accept whatever sanction it imposes.", "The attorney must notify current and former clients about the loss of the records, even if the attorney can fully reconstruct the records from available sources.", "The attorney must compensate the clients by returning a portion of the fees that the clients have paid."], "e": "1.15(a) requires complete trust-account records. Under ABA Op. 18-482, a lawyer whose records are destroyed in a disaster must try to reconstruct them from available sources such as bank statements and client files. The disaster isn't a violation to self-report, and if the records can be fully reconstructed there's no need to notify clients or refund fees. Book cite: Rule 1.15; ABA Formal Op. 18-482. [W5:37–38] (Op. 18-482 isn't discussed in the readings)", "r": "Stevenson, 500 MPRE Questions (2019) Q489 · Rule 1.15 Safekeeping Property"},
{"t": "prop", "q": "An attorney worked for Big Firm for three years, and thereafter he took several of Big Firm’s clients with him to start his own firm. Big Firm had an official unwritten policy that its lawyers should not take Big Firm clients with them when the lawyers left the firm, but the attorney in this case simply ignored this policy. Big Firm threatened litigation over the attorney’s actions, but it did not follow through on the threats. The attorney then advertised on local billboards that he was a former Big Firm lawyer who would provide affordable legal services to working-class clients. A certain new client hired an attorney to represent him in a divorce proceeding and gave the attorney several thousand dollars to cover all legal fees and expenses in the case. The attorney deposited the money in his client trust account, and he explained to the client that he would withdraw money periodically as he earned fees or incurred expenses. Was this arrangement proper?", "a": ["Yes, a lawyer may deposit funds from the client into a trust account and withdraw funds only as billable fees or expenses accrue.", "Yes, because $10,000 is a reasonable amount for the legal fees and expenses in a typical divorce case, and the lawyer did not charge a contingent fee.", "No, because the fees are for the lawyer, and therefore the lawyer has commingled his own legal fees in the client trust account, in violation of the Model Rules.", "No, because withdrawing the fees gradually throughout the course of the representation constitutes a contingent fee arrangement, which is impermissible in representation for a divorce proceeding."], "e": "1.15(c) requires a lawyer to deposit advance fees and expenses in the client trust account and withdraw them only as fees are earned or expenses incurred. That's exactly what the attorney did, and the money remains the client's until earned, with any unearned balance refunded at the end (1.16(d)). This isn't commingling, because unearned advances belong in trust. Periodic withdrawals of earned fees aren't a contingent fee. Book cite: Rule 1.15(c). [W5:15, 31, 33; S5:23–24]", "r": "Stevenson, 500 MPRE Questions (2019) Q490 · Rule 1.15 Safekeeping Property"},
{"t": "prop", "q": "Attorney Stevenson, from Tiny Firm, brings in a lawyer from Giant Firm to work on a complex litigation matter, and they agree to share fees. The client receives a single billing covering the fees of both lawyers, even though they work for separate firms. To comply with the Rules of Professional Conduct, the fee division between Attorney Stevenson and the other lawyer is proportionate to the services performed by each lawyer, and the client agreed in writing beforehand to the arrangement, including the share each lawyer would receive. The total fee is reasonable. At the end of the representation, Attorney Stevenson receives the earned fee from the client, including the share that he owes to the other lawyer at Giant Firm. He promptly notifies the other lawyer. Attorney Stevenson deposits the total sum in his firm bank account (its operating account, not a client trust account), and after confirming that the funds are available from the bank, he sends a check to the other lawyer with his share of the fees. Are Attorney Stevenson’s actions proper, as described here?", "a": ["No, because Attorney Stevenson should have deposited the other lawyer’s share of the fees in a trust account, separate from his own funds.", "Yes, because the fees were proportionate to the work done by each lawyer, and the client assented to the arrangement in writing beforehand.", "Yes, because the representation has ended, and the fees belong to the lawyers, not the client, and therefore Attorney Stevenson cannot place them in a separate trust account.", "No, the client should have received separate billing from each lawyer, because they work for separate firms."], "e": "1.15(a) requires holding property in which a third person has an interest separately from the lawyer's own. Once Stevenson received the combined fee, the Giant Firm lawyer's share belonged to that lawyer, so it had to go into trust, not the operating account, until paid out. The readings treat funds arriving pre-mixed with the lawyer's own money the same way: deposit in trust, then promptly move your share. Compliance with 1.5(e) doesn't excuse the deposit, and a single bill is fine. [W5:30–34; W5:17]", "r": "Stevenson, 500 MPRE Questions (2019) Q492 · Rule 1.15 Safekeeping Property"}
];
const LETTERS = ["A","B","C","D"];
const STRIKE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4H9a3 3 0 0 0-2.83 4"/><path d="M14 12a4 4 0 0 1 0 8H6"/><path d="M4 12h16"/></svg>';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem("prdrill500:"+k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem("prdrill500:"+k, JSON.stringify(v)); }catch(e){} }
};
const saved = store.get("settings") || {};
const S = {
  topics: new Set(Array.isArray(saved.topics) && saved.topics.length ? saved.topics : Object.keys(TOPICS)),
  mode: saved.mode === "exam" ? "exam" : "study",
  count: saved.count || "25",
  shuffleQ: saved.shuffleQ !== false,
  items: [],   // {qi, perm:[orig indices in display order], pick:null|origIndex, out:Set of crossed-out orig indices}
  cur: 0,
  submitted: false,
  view: "quiz",
  disputed: false
};
function saveSettings(){ store.set("settings",{topics:[...S.topics],mode:S.mode,count:S.count,shuffleQ:S.shuffleQ}); }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function newPerm(){ return shuffle([0,1,2,3]); }

function buildSet(fromList){
  let pool = fromList || QS.map((_,i)=>i).filter(i=>S.disputed ? isDisputed(i) : S.topics.has(QS[i].t));
  if(!fromList){
    if(S.shuffleQ) pool = shuffle(pool);
    if(S.count !== "all" && !S.disputed) pool = pool.slice(0, parseInt(S.count,10));
  } else if(S.shuffleQ) pool = shuffle(pool);
  S.items = pool.map(qi=>({qi, perm:newPerm(), pick:null, out:new Set()}));
  S.cur = 0; S.submitted = false; S.view = "quiz";
  render();
}
function reletter(){
  S.items.forEach(it=>{ it.perm = newPerm(); it.pick = null; it.out = new Set(); });
  S.cur = 0; S.submitted = false; S.view = "quiz";
  render();
}
const isDisputed = i => QS[i].e.startsWith("\u26a0");
const revealed = it => it.pick !== null && (S.mode === "study" || S.submitted);

// ───────── Rendering
const $ = id => document.getElementById(id);
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function explHtml(e){ const i = e.indexOf("\n\n"); if (e.startsWith("\u26a0") && i > 0) return `<p class="keywarn">${esc(e.slice(0, i))}</p><p class="expl">${esc(e.slice(i + 2))}</p>`; return `<p class="expl">${esc(e)}</p>`; }

function renderChips(){
  const counts = {}; QS.forEach(q=>counts[q.t]=(counts[q.t]||0)+1);
  const allOn = !S.disputed && S.topics.size === Object.keys(TOPICS).length;
  let h = `<button type="button" class="chip" id="chip-all" aria-pressed="${allOn}">All topics<span class="n">${QS.length}</span></button>`;
  for(const k in TOPICS) h += `<button type="button" class="chip" id="chip-${k}" data-t="${k}" aria-pressed="${!S.disputed && S.topics.has(k)}">${TOPICS[k]}<span class="n">${counts[k]||0}</span></button>`;
  h += `<button type="button" class="chip chip-warn" id="chip-disputed" aria-pressed="${S.disputed}">\u26a0 Disputed keys only<span class="n">${QS.filter((_,i)=>isDisputed(i)).length}</span></button>`;
  $("chips").innerHTML = h;
}
function renderScore(){
  const ans = S.items.filter(it=>it.pick!==null).length;
  const shown = S.items.filter(revealed);
  const right = shown.filter(it=>it.pick===0).length;
  $("score").innerHTML = S.mode==="study" || S.submitted
    ? `<b>${right}</b>/${shown.length} correct · ${ans}/${S.items.length} answered`
    : `${ans}/${S.items.length} answered`;
}
function renderGrid(){
  $("grid").innerHTML = S.items.map((it,i)=>{
    let c = "cell";
    if(revealed(it)) c += it.pick===0 ? " ok" : " bad";
    else if(it.pick!==null) c += " ans";
    if(i===S.cur && S.view==="quiz") c += " cur";
    return `<button type="button" class="${c}" data-i="${i}" aria-label="Question ${i+1}">${i+1}</button>`;
  }).join("");
}
function renderQuiz(){
  if(!S.items.length){ $("main").innerHTML = `<section class="sheet"><p class="empty">No questions match. Select at least one topic.</p></section>`; return; }
  const it = S.items[S.cur], q = QS[it.qi], show = revealed(it);
  const opts = it.perm.map((orig,pos)=>{
    let c = "opt";
    if(show){ if(orig===0) c+=" right"; else if(orig===it.pick) c+=" wrong"; }
    else if(orig===it.pick) c+=" sel";
    if(it.out.has(orig)) c+=" out";
    const x = show ? "" : `<button type="button" class="xo" data-x="${orig}" aria-pressed="${it.out.has(orig)}" aria-label="Cross out choice ${LETTERS[pos]}" title="Cross out">${STRIKE}</button>`;
    return `<li><button type="button" class="${c}" data-orig="${orig}" ${show?"disabled":""}><span class="let">${LETTERS[pos]}</span><span class="txt">${esc(q.a[orig])}</span></button>${x}</li>`;
  }).join("");
  let fb = "";
  if(show){
    const ok = it.pick===0, letter = LETTERS[it.perm.indexOf(0)];
    fb = `<div class="fb"><div class="verdict ${ok?"ok":"bad"}">${ok?"Correct":"Incorrect"}. The answer is ${letter}.</div>${explHtml(q.e)}<div class="cite">${esc(q.r)}</div></div>`;
  }
  const last = S.cur === S.items.length-1;
  const examEnd = S.mode==="exam" && !S.submitted;
  const answered = S.items.filter(x=>x.pick!==null).length;
  $("main").innerHTML = `<section class="sheet" aria-live="polite">
    <div class="meta"><span class="qn">Question ${S.cur+1} of ${S.items.length}</span><span>Book Q${(q.r.match(/Q(\d+)/)||[])[1]} · ${TOPICS[q.t]}</span></div>
    <p class="stem">${esc(q.q)}</p>
    <ol class="opts">${opts}</ol>
    ${fb}
    <div class="nav">
      <button type="button" class="btn" id="prevBtn" ${S.cur===0?"disabled":""}>← Previous</button>
      <div class="btns">
        ${examEnd ? `<button type="button" class="btn" id="submitBtn">Grade exam (${answered}/${S.items.length})</button>` : ""}
        ${!examEnd && (S.mode==="study" && S.items.every(x=>x.pick!==null) || S.submitted) ? `<button type="button" class="btn" id="resultsBtn">See results</button>` : ""}
        <button type="button" class="btn primary" id="nextBtn" ${last?"disabled":""}>Next →</button>
      </div>
    </div>
    <div class="hint">Keys: <kbd>A</kbd>–<kbd>D</kbd> or <kbd>1</kbd>–<kbd>4</kbd> to answer, <kbd>←</kbd> <kbd>→</kbd> to move.</div>
  </section>`;
}
function renderResults(){
  const total = S.items.length, right = S.items.filter(it=>it.pick===0).length;
  const by = {};
  S.items.forEach(it=>{ const t=QS[it.qi].t; by[t]=by[t]||{n:0,r:0}; by[t].n++; if(it.pick===0) by[t].r++; });
  const rows = Object.keys(TOPICS).filter(k=>by[k]).map(k=>{
    const p = Math.round(100*by[k].r/by[k].n);
    return `<tr><td>${TOPICS[k]}</td><td class="num">${by[k].r}/${by[k].n}</td><td class="num">${p}%</td><td><div class="bar"><i style="width:${p}%"></i></div></td></tr>`;
  }).join("");
  const missed = S.items.filter(it=>it.pick!==0).length;
  $("main").innerHTML = `<section class="sheet results">
    <h2>Results</h2>
    <div class="row" style="align-items:baseline"><span class="big">${Math.round(100*right/total)}%</span><span class="score"><b>${right}</b> of ${total} correct${missed?` · ${missed} missed or skipped`:""}</span></div>
    <div class="tablewrap"><table><thead><tr><th>Topic</th><th style="text-align:right">Score</th><th style="text-align:right">%</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="btns">
      ${missed?`<button type="button" class="btn primary" id="retryBtn">Retry missed (${missed}) with new letters</button>`:""}
      <button type="button" class="btn" id="reviewBtn">Review answers</button>
      <button type="button" class="btn" id="againBtn">New shuffled set</button>
    </div>
  </section>`;
}
function render(){
  renderChips();
  $("modeStudy").setAttribute("aria-pressed", S.mode==="study");
  $("modeExam").setAttribute("aria-pressed", S.mode==="exam");
  $("count").value = S.count; $("shuffleQ").checked = S.shuffleQ;
  if(S.view==="results") renderResults(); else renderQuiz();
  renderGrid(); renderScore();
}

// ───────── Events
function choose(orig){
  const it = S.items[S.cur]; if(!it || revealed(it)) return;
  it.pick = orig; render();
}
function go(i){ if(i>=0 && i<S.items.length){ S.cur=i; S.view="quiz"; render(); } }
// Toggles in place (no re-render) so focus stays on the cross-out button.
function crossOut(x){
  const it = S.items[S.cur], o = +x.dataset.x;
  it.out.has(o) ? it.out.delete(o) : it.out.add(o);
  x.setAttribute("aria-pressed", it.out.has(o));
  x.previousElementSibling.classList.toggle("out", it.out.has(o));
}

$("chips").addEventListener("click",e=>{
  const b = e.target.closest(".chip"); if(!b) return;
  if(b.id==="chip-disputed"){ S.disputed = !S.disputed; buildSet(); return; }
  if(S.disputed){ S.disputed = false; S.topics = b.id==="chip-all" ? new Set(Object.keys(TOPICS)) : new Set([b.dataset.t]); saveSettings(); buildSet(); return; }
  if(b.id==="chip-all"){ S.topics = S.topics.size===Object.keys(TOPICS).length ? new Set() : new Set(Object.keys(TOPICS)); }
  else { const t=b.dataset.t; S.topics.has(t)?S.topics.delete(t):S.topics.add(t); }
  saveSettings(); buildSet();
});
$("modeSeg").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; S.mode=b.dataset.mode; saveSettings(); buildSet(); });
$("count").addEventListener("change",e=>{ S.count=e.target.value; saveSettings(); buildSet(); });
$("shuffleQ").addEventListener("change",e=>{ S.shuffleQ=e.target.checked; saveSettings(); buildSet(); });
$("startBtn").addEventListener("click",()=>buildSet());
$("reletterBtn").addEventListener("click",reletter);
$("grid").addEventListener("click",e=>{ const b=e.target.closest(".cell"); if(b) go(+b.dataset.i); });
$("main").addEventListener("click",e=>{
  const x = e.target.closest(".xo"); if(x){ crossOut(x); return; }
  const o = e.target.closest(".opt"); if(o){ choose(+o.dataset.orig); return; }
  const id = (e.target.closest("button")||{}).id;
  if(id==="prevBtn") go(S.cur-1);
  else if(id==="nextBtn") go(S.cur+1);
  else if(id==="submitBtn"){ S.submitted=true; S.view="results"; render(); }
  else if(id==="resultsBtn"){ S.submitted=true; S.view="results"; render(); }
  else if(id==="reviewBtn") go(0);
  else if(id==="againBtn") buildSet();
  else if(id==="retryBtn") buildSet(S.items.filter(it=>it.pick!==0).map(it=>it.qi));
});
document.addEventListener("keydown",e=>{
  if(e.target.matches("select,input") || e.metaKey || e.ctrlKey || e.altKey || S.view!=="quiz") return;
  const k = e.key.toUpperCase(), it = S.items[S.cur]; if(!it) return;
  let pos = LETTERS.indexOf(k); if(pos<0 && /^[1-4]$/.test(k)) pos = +k-1;
  if(pos>=0){ choose(it.perm[pos]); e.preventDefault(); }
  else if(e.key==="ArrowRight"){ go(S.cur+1); e.preventDefault(); }
  else if(e.key==="ArrowLeft"){ go(S.cur-1); e.preventDefault(); }
});

buildSet();
</script>
