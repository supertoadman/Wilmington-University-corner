{"t": "hum", "q": "An attorney worked with a partner who developed a chronic debilitating medical condition. Eventually, the condition materially impaired the partner’s ability to practice law, but the partner could not cope with giving up on her career, and she kept practicing. She began to miss court deadlines, to forget to make certain filings to complete transactions, and not to follow through to perform agreed-upon tasks. Under Model Rule 1.16, the partner had a duty to decline or withdraw from representation for clients, at least for the more challenging tasks. On the other hand, up to now no clients had suffered serious prejudice to their legal interests or claims because of these mistakes. Does the attorney who observes these developments have a duty to report her partner for misconduct under Rule 8.3?", "a": ["Yes, the partner's lack of fitness has evidenced itself through a pattern of conduct that makes clear the lawyer is not meeting her obligations under the Model Rules.", "Yes, all violations of the Model Rules are reportable events under Rule 8.3.", "No, mandatory reporting under Rule 8.3 pertains to the attorney’s honesty, trustworthiness, and character in other respects.", "No, Rule 8.3 makes reporting on one’s partners only advisory, not mandatory."], "e": "Under ABA Op. 03-431, when a lawyer's impairment produces a pattern of Rule violations, such as missed deadlines and neglected tasks, while she keeps practicing despite her duty to withdraw (1.16(a)(2)), the impairment raises a substantial question about her fitness. A lawyer who knows of it must report it (8.3(a)), even if clients haven't yet been seriously harmed. Not every violation is reportable, but 8.3 reaches fitness as well as honesty. Book cite: ABA Formal Op. 03-431. [W1:65; W2:32, 62] (8.3 adopted in about half the states)", "r": "Stevenson, 500 MPRE Questions (2019) Q405 · Rule 8.3 Reporting Misconduct"},
{"t": "hum", "q": "An attorney practiced as in-house counsel within Conglomerate Corporation. She learned of serious ethical misconduct there by a fellow employee who was also a licensed lawyer, but who was employed by the Conglomerate in a nonlegal position as a technical writer. Conglomerate does not have any liability or legal responsibility for the employee’s misconduct, so the attorney is not approaching it as a liability concern for her corporate client. Would it be permissible for the attorney to refrain from reporting the employee’s misconduct to the bar?", "a": ["No, if a lawyer knows of professional misconduct of another licensed lawyer, even a non-practicing lawyer, must report it where it raises a substantial question as to that lawyer's honesty, trustworthiness, or fitness as a lawyer.", "Yes, because the fellow employee is not working as a lawyer or practicing law.", "Yes, these facts suggest that the misconduct took place outside the scope of the employee’s duties at Conglomerate, and the attorney’s duty is to her client, the corporation.", "No, all violations of the Model Rules are reportable events under Rule 8.3."], "e": "8.3(a) requires a lawyer who knows another lawyer has committed a violation raising a substantial question about honesty, trustworthiness, or fitness to report it. ABA Op. 04-433 says this includes licensed lawyers who aren't practicing, such as a lawyer working as a technical writer. The duty is personal to the reporting lawyer and doesn't depend on her client's interests, as long as reporting doesn't require revealing confidential information (8.3(c)). Not every violation is reportable, only serious ones. Book cite: ABA Formal Op. 04-433; Rule 8.3. [W1:65; S1:78]", "r": "Stevenson, 500 MPRE Questions (2019) Q406 · Rule 8.3 Reporting Misconduct"},
{"t": "hum", "q": "A law professor has a tenured faculty position at her institution. She learns of serious ethical misconduct by another law professor on her faculty who is a licensed lawyer in that state, but who engages exclusively in law teaching. The professor who learned of the problem believes she has no duty to report her colleague to the bar, as neither of them are practicing law, though both have law licenses. Is she correct?", "a": ["No, if a lawyer knows of professional misconduct of another licensed lawyer, even a non-practicing lawyer, must report it where it raises a substantial question as to that lawyer's honesty, trustworthiness, or fitness as a lawyer.", "Yes, the duty to report misconduct does not apply to academic settings, which have their own disciplinary procedures.", "Yes, the fact that neither the wrongdoer nor the potential reporter are practicing law makes the mandatory reporting rule inapplicable.", "No, all violations of the Model Rules are reportable events under Rule 8.3."], "e": "8.3(a)'s reporting duty applies to any lawyer who knows another lawyer has committed a violation raising a substantial question about honesty, trustworthiness, or fitness. ABA Op. 04-433 confirms that it covers lawyers who aren't practicing, including law professors, as both the reporter and the subject. Academic discipline doesn't displace the duty. Only serious violations trigger it, not every violation. Book cite: ABA Formal Op. 04-433; Rule 8.3. [W1:65; S1:78]", "r": "Stevenson, 500 MPRE Questions (2019) Q407 · Rule 8.3 Reporting Misconduct"},
{"t": "hum", "q": "An attorney discovers that a partner at his own firm has violated the Rules of Professional Conduct by failing to disclose adverse binding precedent to a tribunal, and by depositing client funds into his own bank account instead of a client trust account. Does the attorney have a duty to report the partner from his own firm to the state bar disciplinary authority?", "a": ["Yes, because a lawyer who knows of a violation of the Rules that raises serious questions about the other attorney’s honesty must report it to the state disciplinary authority.", "Yes, but he must make an anonymous complaint to the state bar.", "No, because lawyers do not have to report violations or misconduct by their own superiors, as this would put the reporting attorney in a difficult position at his workplace.", "No, because a lawyer does not have to report violations, but instead is merely permitted to do so."], "e": "Putting client funds in his personal account (misappropriation) and hiding binding adverse precedent from a court raise substantial questions about honesty and trustworthiness. A lawyer who knows of them must report them to the appropriate professional authority (8.3(a)), even about a partner in his own firm. Telling the firm alone isn't enough. The workplace awkwardness is real but no excuse, and the report needn't be anonymous. Reporting is mandatory, not merely permitted. Book cite: Rule 8.3. [W1:65; S1:78; outline II-A]", "r": "Stevenson, 500 MPRE Questions (2019) Q408 · Rule 8.3 Reporting Misconduct"},
{"t": "hum", "q": "An attorney discovers that another lawyer has been stealing clients’ funds, but he cannot prove it, as he learned about it from another party who was involved and who has since disappeared. He has some evidence, but not enough to prove that the other lawyer stole the clients’ funds. When he confronted the other lawyer, the other lawyer admitted it privately but said he would deny it if there was any attempt to expose the matter. Does the attorney who knows about the violation, but was unlikely to be able to prove it, have a duty to report the violation to the state disciplinary authority?", "a": ["Yes, because the duty to report misconduct depends upon the seriousness of the potential offense and not the quantum of evidence of which the lawyer is aware.", "No, because if the lawyer cannot prove the misconduct with a preponderance of evidence, he does not have “knowledge” of the misconduct for purposes of the Rules of Professional Conduct.", "No, because the duty to report depends on the quantum of proof of which the lawyer is aware, not the seriousness of the potential offense.", "Yes, because it does not matter how serious the misconduct is, it merely matters that there is some evidence of misconduct."], "e": "8.3 requires reporting when a lawyer knows of a violation raising a substantial question about honesty or fitness. The comments say 'substantial' refers to the seriousness of the possible offense, not the amount of evidence the lawyer has. Stealing client funds is plainly serious, and the lawyer's own admission gives the attorney knowledge, so he must report even if he can't prove it. Knowledge isn't a preponderance-of-evidence standard, and 'some evidence' of any misconduct isn't the test either. Book cite: Rule 8.3 cmt. [3]. [W1:65; S1:78]", "r": "Stevenson, 500 MPRE Questions (2019) Q409 · Rule 8.3 Reporting Misconduct"},
{"t": "reg", "q": "An attorney represented criminal defendants, and he received court appointments for indigent defendants. Some of the court appointments he received were female clients. The attorney had a crude sense of humor and progressive views about sexuality, and he often made crude sexual jokes to his female clients, complimented them on their bodies, and half- jokingly made sexual advances or requested sexual favors. The clients normally brushed off these comments, even though they later reported that they felt uncomfortable. None of the clients complained to the court or filed charges with the police for harassment. Could the attorney be subject to disciple and face suspension for these comments and jokes?", "a": ["Yes, because these comments can constitute sexual harassment and could be prejudicial to the administration of justice.", "Yes, because indigent defendants who receive a court-appointed lawyer are likely to resent inappropriate humor from their lawyer.", "No, because the Model Rules forbid actual sexual relationships with clients, but not sexual joking or suggestive comments.", "No, because the clients were not upset enough to complain to the court or the police about the comments."], "e": "8.4(g) forbids conduct related to law practice that the lawyer knows or reasonably should know is harassment or discrimination based on sex and other protected traits. Crude sexual jokes, comments on clients' bodies, and requests for sexual favors to vulnerable appointed clients are sexual harassment, and are prejudicial to the administration of justice (8.4(d)). 1.8(j)'s ban on sex with clients isn't the only limit, and harassment needn't produce a complaint to be disciplinable. Book cite: In re Moothart (Iowa 2015). [W1:28; S1:37]", "r": "Stevenson, 500 MPRE Questions (2019) Q410 · Rule 8.4 Misconduct"},
{"t": "reg", "q": "A prosecutor was bringing charges against a defendant charged with serious domestic violence. When he met the defendant’s victim- girlfriend at the courthouse, she volunteered personal information to the prosecutor in addition to recounting the details of the incident – she explained that she had now had no boyfriend, that she was a struggling single mother, and that she had moved back in with her own parents. The prosecutor and the victim exchanged phone numbers, and he subsequently sent the victim several text messages, the first saying he wished the victim was not a “client” of his office, because “she would be a cool person to know.” The next day, he texted her asking, “Are you the kind of girl that likes secret contact with an older married elected DA ... the riskier the better? Or do you want to stop right now before we have issues?” Two days later, he texted again, telling her that she was “pretty” and “beautiful.” Then he added: “I'm the attorney. I have the $350,000 house. I have the 6-figure career. You may be the tall, young, hot nymph, but I am the prize! Start convincing! I would not expect you to be the other woman. I would want you to be so hot and treat me so well that you'd be THE woman. R U that good?” Could the prosecutor be subject to suspension of his license for these texts?", "a": ["Yes, because the texts constitute sexual harassment of the victim.", "No, because the woman was not his client, as prosecutors represent the state, but merely a witness in a case.", "No, because these were merely expressions of romantic interest, not coercion or physical contact.", "Yes, because prosecutors have special duties to avoid the appearance of bad intentions."], "e": "8.4(g) bars harassment related to the practice of law, and that isn't limited to clients. A prosecutor's sexually charged texts pressuring a domestic-violence victim in his own case, from a position of power over her, are sexual harassment and gravely prejudicial to the administration of justice (8.4(d)). He was suspended. That she was a witness, not a client, doesn't matter, and these weren't harmless expressions of romantic interest. Book cite: In re Kratz (Wis. 2014). [W1:28; S1:37]", "r": "Stevenson, 500 MPRE Questions (2019) Q411 · Rule 8.4 Misconduct"},
{"t": "reg", "q": "An attorney represented a small business owner in litigation against a former employee, who was a Canadian immigrant. During the bench trial, the attorney cross-examined the former employee on the witness stand, and after two of her answers turned to the judge and asked, “Are you going to believe an alien or a U.S. Citizen?” Could the attorney be subject to suspension for these comments?", "a": ["Yes, because this is discrimination based on national origin.", "No, because this is a bench trial, and there is less risk of the attorney’s inflammatory rhetoric being prejudicial to the outcome of the trial.", "No, because citizenship is a valid, though not dispositive, consideration when evaluating a witness’s reliability and truthfulness.", "Yes, because the attorney questioned the credibility of a witness during her cross- examination, rather than during closing argument."], "e": "8.4(g) prohibits conduct related to the practice of law that the lawyer knows or reasonably should know is discrimination based on national origin. Arguing that a judge shouldn't believe an 'alien' over a citizen invites a credibility judgment based on national origin, which is prejudicial to the administration of justice (8.4(d)). A bench trial doesn't make bias acceptable. Citizenship isn't a legitimate basis for questioning a witness's credibility, and the timing in the trial is irrelevant. Book cite: In re McGrath (Wash. 2012). [W1:28; S1:37]", "r": "Stevenson, 500 MPRE Questions (2019) Q412 · Rule 8.4 Misconduct"},
{"t": "reg", "q": "An attorney represented a father at a child support modification hearing before a judge. During the hearing, the attorney made repeated disparaging references to the facts that the mother was indigent and was receiving legal services at no charge. Could the attorney be subject to a public reprimand for these comments?", "a": ["Yes, because discrimination against persons based on their source of income or acceptance of free or low-cost legal services would be examples of discrimination based on socioeconomic status.", "Yes, because the attorney should know that these comments are immaterial to the legal issues in the case.", "No, because child support modifications depend largely on the court’s findings about the relative incomes and living expenses of the parties, and if the opposing party has access to a free lawyer, that is a valid consideration in the court’s decision.", "No, because discrimination requires actual harm, such as termination of employment, exclusion from public places, and so on."], "e": "8.4(g) includes socioeconomic status among the protected categories. Repeatedly disparaging an opposing party because she is poor and receiving free legal services is discrimination on that basis and prejudicial to the administration of justice (8.4(d)), which warrants a reprimand. Relative incomes may be relevant to child support, but mocking indigence and legal aid isn't. Discipline doesn't require harm like a firing. Book cite: In re Campiti (Ind. 2009). [W1:28; S1:37]", "r": "Stevenson, 500 MPRE Questions (2019) Q413 · Rule 8.4 Misconduct"},
{"t": "reg", "q": "An attorney settled a legal malpractice claim by agreeing to make monthly payments to the former client for five years, which would add up to the full settlement amount. The attorney put forth his car as security for the obligation. After making a few of the monthly payments, the attorney left the jurisdiction with his car, leaving no forwarding address, so the former client (who was now a holder of the security interest in the car) could not locate the attorney or the car for more than one year. The state criminal code provides that it is a class 5 felony to conceal property in which there is a security interest. The attorney never faced criminal charges or arrest, but the state bar received a complaint about the matter and commenced disbarment proceedings against the attorney. Can the attorney face disbarment over a crime for which there were never any charges filed?", "a": ["Yes, the fact that the respondent has not been criminally charged or convicted of this offense is not important for purposes of lawyer discipline.", "Yes, because the state bar has inherent authority to revoke a lawyer’s license at any time, for any reason.", "No, because the lawyer has a presumption of innocence until proven guilty if the ethical complaint pertains to criminal activity.", "No, because the courts are a more appropriate forum for addressing this kind of conduct, rather than a state bar administrative hearing."], "e": "8.4(b) makes it misconduct to commit a criminal act that reflects adversely on honesty, trustworthiness, or fitness, and the readings stress that discipline needs only the commission of a crime, not a charge or conviction. Concealing collateral from a former client he owed under a malpractice settlement is a dishonest felony warranting severe discipline. The presumption of innocence applies to criminal prosecutions, not discipline. Bars can't revoke licenses 'for any reason,' though. Book cite: People v. Odom (Colo. 1997). [W1:47 n.27; W1:28]", "r": "Stevenson, 500 MPRE Questions (2019) Q414 · Rule 8.4 Misconduct"},
{"t": "reg", "q": "Big Firm engages in aggressive affirmative action in its hiring. It runs ads soliciting applications from minorities and women, and even though they sometimes interview non- minority applicants, they have decided internally to hire only women and minorities for the next five years. Currently, anti-discrimination laws would not require such a practice. Has the firm violated the MRPC?", "a": ["No, lawyers may implement initiatives aimed at recruiting, hiring, retaining, and advancing diverse employees without violating the Model Rules.", "Yes, the firm is practicing discrimination in its hiring by favoring minorities and women over others", "Yes, substantive law of antidiscrimination absolutely forbids interviewing candidates and then not hiring them based on race or gender.", "No, the Model Rules do not apply to hiring practices or other law firm management matters."], "e": "⚠ Answer-key warning: The book's keyed answer is likely wrong. A flat five-year rule hiring only women and minorities goes beyond recruiting outreach and would likely violate Title VII. Cmt [4] protects lawful diversity initiatives, not unlawful quotas, so this answer is doubtful as written.\n\nThe comments to 8.4 say lawyers may promote diversity and inclusion, for example by recruiting, hiring, retaining, and advancing diverse employees, without violating 8.4(g). On the book's view the firm's program is such an initiative. The Model Rules do apply to firm management, since 8.4(g) expressly covers managing a law firm. Book cite: Rule 8.4 cmt. [4]. [W1:28; S1:37]", "r": "Stevenson, 500 MPRE Questions (2019) Q415 · Rule 8.4 Misconduct"},
{"t": "reg", "q": "An attorney owns his own law practice, and he represents clients if he believes in their cause. He regularly defends racists and hate groups against criminal charges and lawsuits, because he shares their philosophy and identifies with their racist views. Is it permissible for the attorney to advocate on behalf of racists and hate groups in litigation, if he supports their cause on a personal level?", "a": ["Yes, the rules prohibiting discrimination and harassment by lawyers not preclude legitimate advice or advocacy the lawyer provides to clients who are openly engaging in such conduct.", "Yes, the lawyer has a First Amendment right to express racist or discriminatory views in public.", "No, a lawyer must not engage in conduct that is harassment or discrimination based on race in conduct related to the practice of law.", "No, the rules prohibiting discrimination and harassment by lawyers apply to the advice or advocacy the lawyer provides to clients who are openly engaging in such conduct, if the lawyer supports the client's views."], "e": "8.4(g) expressly doesn't preclude legitimate advice or advocacy consistent with the Rules, and representing a client doesn't endorse the client's views (1.2(b)). So a lawyer may defend racist clients and hate groups in litigation, whatever his own sympathies, so long as his own conduct isn't harassment or discrimination. The First Amendment isn't the operative reason, and the lawyer's personal agreement doesn't convert advocacy into an 8.4(g) violation. Book cite: Rule 8.4(g). [S1:37; W1:28]", "r": "Stevenson, 500 MPRE Questions (2019) Q416 · Rule 8.4 Misconduct"},
{"t": "reg", "q": "An attorney faced prosecution for failing to file tax returns over a five-year period. The attorney worked for a legal aid clinic and never charged clients any legal fees, as the clinic provided free representation to the indigent. The attorney received a modest salary from the legal aid clinic, the funds for which came from the state’s IOLTA program and from a federal Legal Services Corporation (LSC) grant. Could the attorney face suspension of his license to practice law?", "a": ["Yes, because it is professional misconduct for a lawyer to commit a criminal act that reflects adversely on the lawyer's honesty.", "Yes, because the attorney’s salary comes from a commingling of state IOLTA funds and federal LSC funds.", "No, because the attorney’s illegal conduct did not pertain to his representation of any of his clients.", "No, because none of the attorney’s income derived from legal fees collected from clients."], "e": "8.4(b) makes it misconduct to commit a criminal act reflecting adversely on honesty, trustworthiness, or fitness, and the comments list willful failure to file income tax returns as an example. Five years of unfiled returns warrants suspension, even though it has nothing to do with his clients or fees. Off-duty crimes count. The funding source of his salary is irrelevant. Book cite: Rule 8.4(b) and cmt. [2]. [W1:47 n.27; W1:28]", "r": "Stevenson, 500 MPRE Questions (2019) Q417 · Rule 8.4 Misconduct"},
{"t": "reg", "q": "An attorney was an immigrant from a country that permits polygamy – men can have up to four wives. The attorney had two wives, which his religion permitted, as did the laws of his homeland. Nevertheless, his multiple marriages constituted bigamy in the American jurisdiction where he practiced law, and eventually a court convicted him of bigamy and imposed a fine. Could the attorney be subject to professional discipline for committing this illegal act?", "a": ["No, because offenses concerning personal morality, such as bigamy and comparable offenses, have no specific connection to fitness for the practice of law.", "Yes, because it is professional misconduct for a lawyer to commit a criminal act that reflects adversely on the lawyer's honesty.", "Yes, because having multiple wives significantly increases the opportunities to have conflicts of interest with various clients.", "No, because his bigamy does not reflect negatively on his character or morality if his religion permits it."], "e": "Under 8.4(b) and its comments, a lawyer is professionally answerable only for crimes showing a lack of traits relevant to practice: violence, dishonesty, breach of trust, or serious interference with justice. Offenses of personal morality, such as adultery and comparable offenses, don't reflect on fitness to practice. Bigamy rooted in a lawful foreign marriage practice falls in that category. It isn't a crime of dishonesty, and conflicts of interest have nothing to do with it. His religion isn't the reason; the nature of the offense is. Book cite: Rule 8.4 cmt. [2]. [W1:47 n.27; outline I-D]", "r": "Stevenson, 500 MPRE Questions (2019) Q418 · Rule 8.4 Misconduct"},
{"t": "reg", "q": "After practicing for two years, an attorney enrolled in an LL.M. program at a local law school, taking night classes. During his second semester, the attorney faced academic discipline for plagiarism in a seminar paper; the school permitted him to graduate, but he received a failing grade in the class and had to make up the credits with another course. As the attorney already has a license to practice law in the jurisdiction, could he be subject to discipline if the state disciplinary authorities learned of the plagiarism?", "a": ["Yes, because it is professional misconduct for an attorney to engage in conduct involving dishonesty, fraud, deceit, or misrepresentation.", "Yes, because it is professional misconduct for a lawyer to commit a criminal act that reflects adversely on the lawyer's honesty.", "No, because the attorney already obtained admission to the bar, so his courses now have no bearing on his application for admission to the bar.", "No, because the incident does not pertain to his representation of a client, so the disciplinary rules do not apply."], "e": "8.4(c) prohibits conduct involving dishonesty, fraud, deceit, or misrepresentation, whether or not related to representing a client. The readings note that noncriminal dishonesty such as academic cheating is regularly disciplined under 8.4(c). Plagiarizing an LL.M. paper is that kind of dishonesty, so being already admitted doesn't protect him. Plagiarism isn't a crime, so 8.4(b) isn't the basis. Book cite: Rule 8.4(c). [W1:47 n.27; W1:26]", "r": "Stevenson, 500 MPRE Questions (2019) Q419 · Rule 8.4 Misconduct"},
{"t": "reg", "q": "While cross-examining a Hispanic witness during a trial, a defense attorney grew frustrated at the witnesses’ evasive answers, and finally asked the witness if “his people” or others “in his community” regularly lie under oath on the witness stand. The prosecutor immediately objected, and the judge sustained the objection, so the attorney withdrew the question. The witness then stated that he did not feel offended by the question because he understood that the lawyer was simply ignorant and relying on stereotypes. Three of the jurors were also Hispanic. Could the attorney be subject to discipline for this question?", "a": ["Yes, because it is professional misconduct for a lawyer in the course of representing a client to say things that manifest bias or prejudice based upon race or national origin.", "Yes, because the judge sustained the objection and there were Hispanics serving on the jury.", "No, because the witness claimed that he did not feel offended.", "No, because the lawyer immediately withdrew the question."], "e": "Manifesting bias based on race or national origin while representing a client is prejudicial to the administration of justice (8.4(d)); today 8.4(g) also covers it. Asking a Hispanic witness whether 'his people' routinely lie under oath is exactly that, with Hispanic jurors present. Withdrawing the question, the sustained objection, and the witness's lack of offense don't erase it; discipline rests on the lawyer's conduct. Book cite: Rule 8.4(d) cmt. [3]. [W1:28; S1:37]", "r": "Stevenson, 500 MPRE Questions (2019) Q420 · Rule 8.4 Misconduct"},
{"t": "reg", "q": "Big Firm handles employee litigation, including workplace harassment suits. Nevertheless, the managing partners at Big Firm have decided they will not take on clients with claims based on same-sex harassment, because they believe the law is still developing and juries return unpredictable verdicts in such cases. Has the firm violated the MRPC?", "a": ["No, the rules that prohibit harassment and discrimination by lawyers do not limit the ability of a lawyer to accept, decline or withdraw from a representation.", "Yes, the rules that prohibit harassment and discrimination by lawyers also limit the ability of a lawyer to accept, decline or withdraw from a representation.", "Yes, by refusing to represent such clients, they are perpetuating the problem of workplace harassment and discrimination.", "No, advocating in cases where the results would be unpredictable, or the law is still developing, would constitute a frivolous claim or contention."], "e": "8.4(g) expressly doesn't limit a lawyer's ability to accept, decline, or withdraw from representation under 1.16. The readings say lawyers may decline matters for almost any reason except a few unlawful ones, such as invidious discrimination. Declining same-sex harassment claims because the law is unsettled and verdicts unpredictable is a business judgment about case types, not discrimination against clients. Such claims aren't frivolous, and refusing them doesn't 'perpetuate' anything the Rules forbid. Book cite: Rule 8.4(g). [W2:30; S1:37]", "r": "Stevenson, 500 MPRE Questions (2019) Q421 · Rule 8.4 Misconduct"},
{"t": "reg", "q": "A judge asks the two lawyers in a case to help him conduct some first-hand investigation of the facts. At the judge’s request, the plaintiff’s lawyer and the defendant’s lawyer together drive the judge to the location where the accident occurred that became the subject of the litigation and allowed the judge to take measurements and photographs of the scene from different angles. They also accompanied the judge to interview several witnesses at their homes, off the record. Both lawyers felt awkward about this, but they were afraid to contradict or confront the judge, out of respect for the judicial office. Could the lawyers be subject to discipline for this conduct?", "a": ["Yes, because it is professional misconduct for a lawyer to assist a judge or judicial officer in conduct that is a violation of applicable rules of judicial conduct or other law.", "Yes, because it constitutes ex parte communication with the judge.", "No, because the lawyers did this activity at the judge’s behest, and possible under orders from the judge.", "No, because it furthers the ends of justice and accurate case outcomes for judges to have more complete understanding of the facts of a case."], "e": "8.4(f) makes it misconduct to knowingly assist a judge in conduct that violates the rules of judicial conduct. Judges may not independently investigate the facts, and interviewing witnesses at their homes off the record is improper. Driving the judge to the scene and accompanying him on those interviews assists that violation, and respect for the bench is no defense. Both lawyers were present, so this isn't a classic one-sided ex parte contact, though the off-record interviews are irregular. Book cite: Rule 8.4(f). [W1:28; outline I-D]", "r": "Stevenson, 500 MPRE Questions (2019) Q422 · Rule 8.4 Misconduct"},
{"t": "reg", "q": "An attorney had a license to practice law in two jurisdictions – his home state where he lived and had his primary office, and a neighboring state where he represented several clients each year. The attorney committed serious professional misconduct in his home state and received a public reprimand from the state disciplinary authorities. All the conduct took place in his home state, the client resided in the state, and the representation took place entirely within his home state. The lawyer’s conduct would have violated the rules in either of the jurisdictions where he had a license to practice law, because it involved commingling client funds with his own money, and the states mostly had identical rules concerning this activity. After the attorney received a public reprimand in his home state, where the misconduct occurred, the state bar disciplinary authority in the neighboring state (where he also practiced) then commenced disciplinary proceedings against him as well. In the end, the neighboring state bar suspended his license for six months in that state, a much more severe sanction than the public reprimand he received in his home state, where the misconduct in fact occurred. The attorney claims that the neighboring state bar has no jurisdiction over conduct that occurred entirely outside of the state. He also objects that the second punishment raises double jeopardy concerns. Is the attorney correct?", "a": ["No, because a lawyer may be subject to the disciplinary authority of two jurisdictions for the same conduct and may receive different sanctions in each state.", "Yes, because even in cases where a second state can administer discipline over the same conduct, double jeopardy rules prevent the second tribunal from imposing a more severe sanction than the first tribunal already imposed on the lawyer.", "Yes, because a lawyer cannot be subject to the disciplinary authority of two jurisdictions for the same conduct if it occurred entirely within one state.", "No, because choice of law rules require that each state impose the same sanction."], "e": "8.5(a) subjects a lawyer to discipline in every jurisdiction where he's admitted, regardless of where the conduct occurred. The readings note that most states impose reciprocal discipline, so a lawyer may be disciplined in several jurisdictions for the same conduct, with different sanctions. Discipline protects the public; it isn't criminal punishment, so double jeopardy doesn't apply. Choice of law doesn't require identical sanctions. Book cite: Rule 8.5(a). [W1:29; W1:21]", "r": "Stevenson, 500 MPRE Questions (2019) Q423 · Rule 8.5 Disciplinary Authority; Choice of Law"},
{"t": "reg", "q": "An attorney practices law in two adjacent states, as he has a license to practice in each. He lives near the border and can easily serve clients in each jurisdiction. The two states have different rules about attorney disclosures of confidential client information - one state requires disclosures of client confidences whenever necessary to save a third party from death or serious bodily injury, while the other state forbids disclosures even under these circumstances. The attorney did indeed disclose confidential client information to save someone’s life (the client was planning a murder and the attorney notified the authorities and warned the potential victim), but this occurred in the state that forbids such disclosures under these circumstances. The client files a grievance against the attorney in both states, and both state bars commence disciplinary proceedings over the same incident. The state bar of the other state, which would have required disclosure in this situation under its own rules, nevertheless reprimands the attorney for making the disclosure in violation of the rules in the state where the incident occurred. The attorney objects that the state cannot impose a sanction on him for conduct that the state’s rules would have required. Is the state bar correct?", "a": ["Yes, the state bar should apply the rules of the jurisdiction in which the lawyer’s conduct occurred.", "Yes, because a state disciplinary authority does not have to consider the rules of professional conduct from its own state in making disciplinary determinations, regardless of where the misconduct occurs.", "No, because each state bar should apply its own rules, otherwise we could have the absurd result of a state bar punishing a lawyer for an action that the rules of that state require.", "No, because a lawyer can face discipline for professional misconduct only in the state where the misconduct occurred."], "e": "For conduct outside a tribunal, 8.5(b)(2) applies the rules of the jurisdiction where the conduct occurred, unless its predominant effect is elsewhere. Any state disciplining the lawyer applies that state's rules. The disclosure happened in the state that forbids it, so even the state whose own rules would have required disclosure judges it under the other state's rule. The safe harbor protects only a lawyer who conformed to the rules of the place he reasonably believed the predominant effect would be. Both states have jurisdiction (8.5(a)). Book cite: Rule 8.5(b)(2). [W1:29] (8.5(b) isn't discussed in the readings)", "r": "Stevenson, 500 MPRE Questions (2019) Q424 · Rule 8.5 Disciplinary Authority; Choice of Law"},
{"t": "reg", "q": "An attorney was representing a client in a probate matter. The representation mostly occurred within the attorney’s home state, where the client also lived. One asset of the probated estate, however, was an account receivable from a debtor in a neighboring state; the matter was already the subject of pending contract litigation in that state. The attorney filed a pro hac vice appearance in the neighboring state, and he traveled there to represent his client in the contract matter, which was ancillary to the probate matter in his home state. During the proceedings, the lawyer committed an act that constituted a violation of the ethical rules in his home state, but not in the neighboring state where he was appearing in a proceeding; the states had different rules in this regard. Could the attorney be subject to discipline in his home state for violating its rules before a tribunal in the neighboring state?", "a": ["No, because whenever a lawyer's conduct relates to a proceeding pending before a tribunal, the lawyer shall be subject only to the rules of the jurisdiction in which the tribunal sits.", "Yes, because when an attorney takes an oath to uphold the rules of a jurisdiction to obtain admission to the bar, he or she does so without regard to the lawyer’s future geographic location when a violation of the rules occurs.", "Yes, because otherwise, lawyers could simply drive across state lines and violate all the rules of professional conduct without repercussions from the state bar where the lawyer practices.", "No, because a lawyer cannot be subject to discipline in more than one jurisdiction for the same act or incident."], "e": "For conduct connected with a matter pending before a tribunal, 8.5(b)(1) applies the rules of the jurisdiction where the tribunal sits, unless the tribunal's rules provide otherwise. The conduct in the neighboring state's proceeding is judged by that state's rules, which it didn't violate, so the home state can't discipline him under its different rule. The home state still has jurisdiction to discipline (8.5(a)); it just applies the tribunal state's rules. Book cite: Rule 8.5(b)(1). [W1:29; W1:46 n.21] (8.5(b) isn't discussed in the readings)", "r": "Stevenson, 500 MPRE Questions (2019) Q425 · Rule 8.5 Disciplinary Authority; Choice of Law"},
{"t": "reg", "q": "After graduation from law school, an attorney had taken and passed the bar exam in two neighboring states, and she then had a license to practice law in each state. Her primary office was in her home state where he lived, but she also represented a few clients every year in the neighboring state. Seven years into her career, the attorney committed serious professional misconduct in her home state, and she received a public reprimand from the state disciplinary authorities. The actions that led to her disciplinary reprimand occurred entirely in her home state. The lawyer’s conduct would have violated the rules in either of the jurisdictions where she had a license to practice law, because it involved commingling client funds with her own money, and the states mostly had identical rules concerning this activity. Several months after she received her reprimand in her home state, the disciplinary authority in the neighboring state commenced disciplinary proceedings against her as well. In the end, the neighboring state bar suspended her from the practice of law for one year in that state, a much more severe sanction than the public reprimand she had received in her home state, where the misconduct in fact occurred. The attorney appealed this suspension, claiming that the neighboring state bar had no jurisdiction over conduct that occurred entirely outside of its own borders. She also contends that the second punishment raises double jeopardy concerns. Did the state bar in the neighboring state indeed have the legal authority to suspend her license there, if the alleged misconduct occurred entirely in the attorney’s home state, and she had already received a punishment for it?", "a": ["Yes, attorneys may be subject to the disciplinary authority of two jurisdictions for the same conduct and may receive different sanctions in each state.", "Yes, except that choice of law rules require that each state impose the same sanction, so the neighboring state must either impose a reprimand or petition her home state to suspend her license for a year.", "No, the constitutional prohibition on double jeopardy prevent the second tribunal from imposing a more severe sanction than the first tribunal has already imposed on the lawyer.", "No, the attorney would not be subject to the disciplinary authority of two jurisdictions for the same conduct if it occurred entirely within one state."], "e": "A lawyer admitted in two states is subject to discipline in both, wherever the conduct occurred (8.5(a)). The readings explain that most jurisdictions impose reciprocal discipline, sometimes more severe than the original. So the neighboring state could suspend her for a year after her home state reprimanded her. Discipline isn't criminal punishment, so double jeopardy doesn't apply, and states needn't impose identical sanctions. Book cite: Rule 8.5. [W1:29]", "r": "Stevenson, 500 MPRE Questions (2019) Q426 · Rule 8.5 Disciplinary Authority; Choice of Law"},
{"t": "fee", "q": "A certain attorney made an informal agreement with Physician that they would refer clients to each other when the situation seemed appropriate. They did not pay each other any money for referrals, but the relationship was explicitly reciprocal – the attorney referred patients who needed medical examinations to Physician, and when Physician had patients needing legal representation, he referred them to the attorney. The relationship was not explicitly exclusive – each was free to refer clients to others – but it happened that neither had similar reciprocal relationships with anyone else. They always inform their clients when making such referrals that they have a reciprocal relationship. Is such an arrangement proper?", "a": ["Yes, a lawyer may agree to refer clients to another lawyer or a nonlawyer professional, in return for the undertaking of that person to refer clients or customers to the lawyer, assuming clients are aware, and the relationship is not exclusive.", "Yes, because the agreement is informal, not a written contract.", "No, because a lawyer may not agree to refer clients to another lawyer or a nonlawyer professional, in return for the undertaking of that person to refer clients or customers to the lawyer.", "No, because the relationship described here is de facto exclusive, even if they have not agreed specifically to keep the relationship exclusive."], "e": "7.2(b) generally bars giving anything of value for recommending a lawyer, but 7.2(b)(4) allows a reciprocal referral agreement with another lawyer or a nonlawyer professional. The conditions are that the agreement isn't exclusive and the client is told about it. The attorney and physician refer to each other, each is free to refer elsewhere, and clients are informed, so the arrangement is proper. That neither happens to have other partners doesn't make it exclusive, and informality isn't what makes it proper. [W5:17, 21] (7.2(b)(4) isn't discussed in the readings; MR 7.2 cmt [8])", "r": "Stevenson, 500 MPRE Questions (2019) Q432 · Rule 7.2 Advertising"},
{"t": "fee", "q": "An attorney received a client referral by email from a friend who worked as a nurse in a nearby emergency room. The client called the attorney’s office the same day that the attorney received her friend’s email about this potential client. The representation of this new client yielded a favorable outcome, with a generous damages award for the client and substantial fees for the attorney. In appreciation for the referral, the attorney sent her friend a fancy fruit basket that cost around $150, with a card thanking the friend for the lucrative referral. Was it proper for the attorney to give such a gift to a nonlawyer for referring a client to her?", "a": ["Yes, the Model Rules permit a lawyer to give nominal gifts, such as an item that might be a holiday gift item, in appreciation to a person for referring a prospective client.", "Yes, the Model Rules permit a lawyer to give gifts in consideration for an understanding that referrals would be forthcoming in the future.", "No, under the Model Rules, a lawyer may not compensate, give or promise anything of value to a person for recommending the lawyer’s services.", "No, the Model Rules permit lawyers to give only small tokens of appreciation for client referrals, such as ballpoint pens or keychains, but not items that might be given for holidays, such as a fruit basket."], "e": "Since 2018, 7.2(b)(5) lets a lawyer give a nominal gift as a thank-you for a referral, such as an ordinary holiday-type gift, so long as it wasn't promised in advance or expected as payment for future referrals. A one-time fruit basket sent after the fact in appreciation fits the comment's description, so it's permitted despite 7.2(b)'s general ban on paying for recommendations. Gifts given to secure future referrals aren't allowed. Book cite: Rule 7.2 cmt. [4] (rev. Aug. 2018). [W5:17 (Swifty example); outline VIII-E]", "r": "Stevenson, 500 MPRE Questions (2019) Q433 · Rule 7.2 Advertising"},
{"t": "fee", "q": "An attorney received a client referral by email from a friend who worked as a nurse in a nearby emergency room. The client called the attorney’s office the same day that the attorney received her friend’s email about this potential client. The representation of this new client yielded a favorable outcome, with a generous damages award for the client and substantial fees for the attorney. In appreciation for the referral, the attorney sent her friend a collectible Star Wars statue (plastic figurine) worth about $20, knowing that the friend avidly collected Star Wars statues. Accompanying the figurine was a thank you card expressing appreciation and promising to send Star Wars collectible figurines every time the friend referred a client to the attorney. Did the attorney act improperly in this instance?", "a": ["Yes, the Model Rules prohibit gifts offered or given in consideration of any promise, agreement or understanding that such a gift would be forthcoming or that referrals would be made or encouraged in the future.", "No, the Model Rules permit a lawyer to give nominal gifts, such as a small collectible item, in appreciation to a person for referring a prospective client.", "No, the Model Rules permit a lawyer to give gifts in consideration for an understanding that referrals would be forthcoming in the future.", "Yes, under the Model Rules, a lawyer may never give any gifts in response to the person recommending the lawyer’s services."], "e": "The nominal-gift exception in 7.2(b)(5) excludes gifts given under any promise, agreement, or understanding that gifts will keep coming or that referrals will be made in the future. Promising a Star Wars figurine for every future referral turns a thank-you into a quid pro quo for recommendations, which 7.2(b) forbids, however small the gift. A one-time, unpromised token would have been fine, so the 'never any gifts' answer is too broad. Book cite: Rule 7.2 cmt. [4] (rev. Aug. 2018). [W5:17, 21]", "r": "Stevenson, 500 MPRE Questions (2019) Q434 · Rule 7.2 Advertising"},
{"t": "fee", "q": "An attorney made an informal agreement with Physician that they would refer clients to each other when the situation seemed appropriate. They did not pay each other any money for referrals, but the relationship was explicitly reciprocal – the attorney referred patients who needed medical examinations to Physician, and when Physician had patients needing legal representation, he referred them to the attorney. The relationship was explicitly exclusive – each agreed not to refer clients to others – but it happened that neither had similar reciprocal relationships with anyone else anyway. They always inform their clients when making such referrals that they have a reciprocal relationship. Is such an arrangement proper?", "a": ["No, because a lawyer may not agree to refer clients to another lawyer or a nonlawyer professional, in return for the undertaking of that person to refer clients or customers to the lawyer, if the relationship is exclusive.", "Yes, a lawyer may agree to refer clients to another lawyer or a nonlawyer professional, in return for the undertaking of that person to refer clients or customers to the lawyer, assuming clients are aware of the existence and nature of the arrangement.", "Yes, because the agreement is informal, not a written contract.", "No, because the relationship described here is de facto exclusive, even if they have not agreed specifically to keep the relationship exclusive."], "e": "7.2(b)(4) allows reciprocal referral agreements with lawyers or nonlawyer professionals only if the agreement isn't exclusive and clients are told about it. Here the attorney and physician expressly agreed not to refer to anyone else, so the arrangement is improper even though clients are informed and no money changes hands. Exclusivity is what the Rule forbids, because it compromises independent judgment about the best referral for each client. [W5:17, 21] (7.2(b)(4) isn't discussed in the readings)", "r": "Stevenson, 500 MPRE Questions (2019) Q437 · Rule 7.2 Advertising"},
{"t": "fee", "q": "A certain attorney is a friend of Blogger, who operates a successful local blog about events, news, and gossip about their city. Blogger includes posts about local judges and well-known lawyers. The attorney has a secret agreement with Blogger. The attorney passes along tips to Blogger in the form of courthouse gossip regarding local lawyers and judges, or even about big cases. Blogger, in turn, covers the attorney's successful cases in glowing terms and recommends the attorney to his readers. Blogger's website is so successful that he earns $50,000 or so in advertising revenue from the site. The attorney occasionally purchases a small, inexpensive advertisement on the site, which merely gives the attorney's name, address, phone number, and areas of practice. Could the attorney be subject to discipline?", "a": ["Yes, because the attorney provides something of value to Blogger in exchange for recommending his services.", "Yes, because the attorney provides gossip that undermines the dignity of the profession", "No, because the attorney pays a reasonable sum for his advertisements on the blog", "No, because it is impossible to quantify the value of the information that the attorney provides to Blogger in exchange for favorable reviews of the attorney's legal victories."], "e": "7.2(b) prohibits giving anything of value to a person for recommending the lawyer's services. Feeding the blogger courthouse gossip, valuable content for a monetized site, in a secret deal for glowing coverage and recommendations is a quid pro quo for recommendations, even though no money changes hands. The small, ordinary ad the attorney pays for is fine (7.2(b)(1)), but it doesn't cure the side deal. Hard-to-quantify value is still value. Dignity of the profession isn't the test. [W5:17, 21]", "r": "Stevenson, 500 MPRE Questions (2019) Q438 · Rule 7.2 Advertising"},
{"t": "fid", "q": "An insurance company retained an attorney to represent one of its policyholders (i.e., an insured) against a lawsuit. The insurance company that hired the attorney requires its retained counsel to follow its own litigation management guidelines, designed to monitor the fees and costs of the lawyers the insurer retains. The litigation management guidelines include the requirement of a third-party audit of legal bills. Although the guidelines usually serve the interests of both the insured and the insurer by keeping litigation costs low and expediting the resolution of the case, in this instance the attorney finds that the guidelines require tactical moves that are adverse to the insured’s interests. The insurer claims that the insured impliedly consented to the guidelines by agreeing contractually in the insurance policy to “cooperate” during litigation. The insurance company hired the attorney for the case. Should the attorney comply with the insurer’s litigation management guidelines?", "a": ["No, because a lawyer shall exercise independent professional judgment, and the insurer’s litigation management guidelines in this instance materially impair the lawyer’s professional judgment.", "Yes, because the insured impliedly consented to the arrangement by accepting the insurance company’s choice of legal counsel in defending the claim.", "Yes, because the insurer retained the attorney to handle the case.", "No, because a lawyer hired by an insurance company to represent an insured should always represent the interests of the insured rather than the insurer."], "e": "A lawyer paid by an insurer to defend its insured must exercise independent professional judgment for the client (2.1), and the payor may not direct or regulate that judgment (5.4(c); 1.8(f)(2)). Under ABA Op. 01-421, a lawyer must not follow an insurer's litigation guidelines that materially impair her judgment to the insured's detriment. A policy's 'cooperate' clause isn't informed consent, and the insurer's role in hiring the lawyer doesn't change whom she serves. Book cite: Rule 2.1; ABA Formal Op. 01-421. [W2:45, 50; W5:18]", "r": "Stevenson, 500 MPRE Questions (2019) Q451 · Rule 2.1 Advisor"},
{"t": "fid", "q": "An attorney represented a criminal defendant charged with murder. During their consultations, the client informed the attorney that he had committed another murder, but that someone else – an innocent bystander – was standing trial for that crime. The attorney was aware of this other case, as it had received media coverage, and realized that an innocent person would potentially go to jail for many years, or even face the death penalty, for the crime his own client had committed. Which of the following is true, regarding the attorney’s ethical obligations in this situation?", "a": ["It would be permissible for the attorney to urge his own client to come forward and confess to this other murder to save the innocent person accused of it, even though such advice would be contrary to his own client’s legal interests.", "The attorney must immediately withdraw from representing this client, even if his trial is already underway, without offering the tribunal a reason for the withdrawal.", "It would be improper for the attorney to urge his own client to come forward and confess to this other murder to save the innocent person accused of it, because such advice would be contrary to his own client’s legal interests.", "The attorney may not lecture or give moral advice to the client, but he may offer to refer the client to a mentor, a professional ethicist, or a member of the clergy."], "e": "2.1 lets a lawyer refer to moral, economic, social, and political considerations as well as law when advising a client. Urging a client to come forward and save an innocent person from conviction is permissible moral counsel, even though it runs against the client's legal interests. The decision remains the client's, and the lawyer can't disclose without an exception (the readings' miscarriage-of-justice problem). No withdrawal is required, and a lawyer may give moral advice directly rather than only referring the client elsewhere. Book cite: Rule 2.1. [W3:36; W1:17 n.7]", "r": "Stevenson, 500 MPRE Questions (2019) Q452 · Rule 2.1 Advisor"},
{"t": "fid", "q": "An attorney represented a client who had an explosive temper. The representation concerned multimillion-dollar litigation, and the attorney received notice that the judge in the case had refused to qualify the attorney’s expert witness to testify at trial. Without the expert, the client’s case was unlikely to prevail. Faced with the daunting prospect of delivering this unwelcome news to the client, the attorney emailed the client and explained the setback in highly technical terms, citing the relevant sections of the Federal Rules of Civil Procedure, local court rules, precedential cases, and the Code of Judicial Conduct. He also used archaic legal terms in several places. A nonlawyer would have been unlikely to understand the conclusion – that the disqualification of the expert meant the client would lose the case and should withdraw or settle immediately. Based on the Model Rules, which of the following is true?", "a": ["The attorney violated his ethical duty to the client by providing purely technical legal advice that would be unhelpful to a nonlawyer.", "It was proper for the attorney to make this disclosure to the client, because it impacted the client’s legal interests, and the report was truthful.", "The attorney had an ethical duty to spare the client’s feelings, and therefore acted properly.", "The attorney did not have a duty to inform the client about a preliminary ruling regarding the qualification of experts."], "e": "2.1 requires candid advice, and its comments note that purely technical legal advice can be inadequate when the client needs to understand the practical bottom line. 1.4(b) likewise requires explaining matters enough for the client to make informed decisions. Burying 'you will likely lose; settle now' in rule citations and archaic jargon so an explosive client won't grasp it fails both duties. There's no duty to spare feelings at the expense of clarity, and a ruling disqualifying a key expert is plainly material. Book cite: Rule 2.1 cmt. [2]. [W4:9; S4:22]", "r": "Stevenson, 500 MPRE Questions (2019) Q453 · Rule 2.1 Advisor"},
{"t": "rel", "q": "A certain client applied to for a loan from a Big Bank based on a security interest in farm machinery that the client claims to own. Big Bank required that all borrowers provide an opinion letter at the time of closing from the borrower’s lawyer. The legal opinion letter was to verify, based on a check of courthouse records, that the borrower's title to the machinery carried no encumbrances, such as recorded liens. The client asked his attorney to provide the required opinion, and the attorney produced the letter addressed to Big Bank. Unfortunately, the attorney had in fact made no effort to verify the facts stated by checking courthouse records, instead relying entirely on his client's statements concerning the state of title of the property. If the attorney had conducted the investigation described in the opinion letter, he would have seen that the public records indicated several liens superior to Big Bank’s security interest. Which of the following is correct, given these facts?", "a": ["The attorney failed to conduct the investigation described in the opinion letter and therefore violated his duty of care.", "The attorney-client did not form in this case, so the attorney had no duty of care to the lender.", "The attorney violated client confidentiality without authorization from the client or the lender.", "The attorney failed to communicate with the client as required by the Model Rules."], "e": "A lawyer who provides an opinion to a third party at the client's request, here a lender relying on a title opinion, owes that third party a duty to exercise care in giving it (2.3; Restatement §§ 51(2), 95). The letter said the lawyer had checked courthouse records, but he relied entirely on the client's word, so he failed the investigation the opinion described. The lack of a client relationship with the bank doesn't defeat the duty, and confidentiality isn't the issue. Book cite: Restatement § 95. [W2:46, 53; S2:85–86]", "r": "Stevenson, 500 MPRE Questions (2019) Q454 · Rule 2.3 Evaluation for Use by Third Persons"},
{"t": "rel", "q": "A certain client applied for a bank loan from Big Bank based on a security interest in farm land and farm machinery. Big Bank required an opinion letter at the time of closing from the client’s attorney, vouching for the deed of trust executed by the client that would give Big Bank a mortgage lien on the property, prior to any other recorded liens. The client’s attorney provided the opinion letter. It states that the attorney has neither physically inspected the property nor investigated the state of the record title with respect to the mortgaged property, relying instead on the preliminary title report of a title-insurance company that there are no other liens on the property and that the client has clear title to the property. Unknown to the attorney, a third party had already acquired adverse possession rights in the property. The third party has also incurred unpaid bills that resulted in mechanics' liens on the property. All this occurred after the date of the preliminary title report. Which of the following is correct, based on these facts?", "a": ["The attorney did not violate a duty of care to Big Bank by relying as stated in the opinion letter solely on the preliminary title report and not conducting any other investigation.", "The attorney-client relationship never formed in this case, so there is no conflict of interest here that would require informed consent.", "The attorney had a conflict of interest in the representation described here, because he worked for the client at the behest of the lender.", "Attorney-client privilege still covers the contents of the report to the lender, if the lender kept the report confidential."], "e": "A lawyer giving an opinion for a third party may limit its scope if the limits are clearly stated in the opinion (2.3; Restatement § 95). This letter expressly said the lawyer didn't inspect the property or search title and relied solely on the title company's report. Liens and adverse possession arising after that report fall outside what he represented, so he didn't breach a duty of care to the bank. There's no conflict requiring consent, and an opinion meant for the lender isn't privileged. Book cite: Restatement § 95. [W2:46; W3:39–40 n.6 (2.3(c))]", "r": "Stevenson, 500 MPRE Questions (2019) Q455 · Rule 2.3 Evaluation for Use by Third Persons"},
{"t": "conf", "q": "A recent law school graduate obtained her law license and spent several months searching for a job. Eventually, she went to work for a medium-sized corporation as in-house counsel. The company had only recently grown to the size that it could afford to keep legal counsel on staff, as opposed to hiring outside firms to handle legal matters when they arose. This meant the newly- licensed attorney was the first lawyer to work as in-house counsel at this corporation. After seven months, the attorney discovered that the Chief Financial Officer had falsified the corporation’s quarterly earnings report to help boost the firm’s share price. Both the attorney and the CFO received stock options every quarter as part of their compensation plan. Realizing that these misrepresented earnings appeared in the filings to the Securities and Exchange Commission, and the attorney feared that the corporation would eventually face severe regulatory fines or civil liability for false earning reports. What should the attorney do in this situation?", "a": ["The attorney should start with the Chief Financial Officer, then take the matter to up the chain of command in the organization if necessary, eventually bringing the matter to the board of directors if nobody in management will address the problem.", "The attorney should withdraw immediately because she has a conflict of interest, given that she herself receives stock options as part of her compensation.", "The attorney should immediately report the matter to the appropriate government authorities without warning the Chief Financial Officer or his friends within the corporation, lest they have an opportunity to destroy evidence.", "The attorney should confront the Chief Financial Officer, but if the CFO remains recalcitrant, the attorney must drop the matter."], "e": "Under 1.13(b), when an organization's lawyer knows an officer is violating the law in a way likely to cause substantial injury to the organization, the lawyer must act in the organization's best interest, ordinarily by reporting up the chain, to the board if necessary. She should start with the CFO and escalate if he won't fix it. Going straight to the SEC skips 1.13(b), and reporting out is permitted only under 1.13(c) after the board fails to act. Her stock options don't require withdrawal, and she can't simply drop it. [W2:81 n.3; W3:26; outline VI-F]", "r": "Stevenson, 500 MPRE Questions (2019) Q456 · Rule 1.13 Organization as Client"},
{"t": "conf", "q": "An attorney served as general counsel for a municipal auditing and enforcement bureau, which monitored the internal affairs and expenditures of the municipal government. The attorney discovered that the head of the bureau engaged in selective enforcement and self- dealing, and he suspected that bribery had occurred in a few instances. The attorney’s confrontation of the bureau head proved futile, so the attorney then needed to proceed up the chain of command. Can the attorney, now serving as general counsel for a government bureau, report wrongdoing to anyone higher within that municipality?", "a": ["Yes, because if the action or failure to act involves the head of a bureau, either the department of which the bureau is a part, or the relevant branch of government may be the client for purposes of the Rules of Professional Conduct.", "Yes, but only by testifying under subpoena at a city council hearing or the legislative equivalent for that municipality (town aldermen, board of county commissioners, etc.).", "No, because the head of the bureau is the general counsel’s client.", "No, because governmental lawyers do not have a “client” organization in the same sense as attorneys in the private sector, because civil servants must act in the public interest."], "e": "The comments to 1.13 recognize that for a government lawyer, the client may be a specific agency, or the department or branch of government of which it's a part. When the wrongdoer heads the bureau, the general counsel may report up to the department or relevant branch. The bureau head isn't the client; the governmental organization is. Government lawyers do have organizational clients, and no subpoena is required to report internally. Book cite: Rule 1.13 cmt. [9]. [W2:81 n.3; W3:26]", "r": "Stevenson, 500 MPRE Questions (2019) Q457 · Rule 1.13 Organization as Client"},
{"t": "conf", "q": "An attorney worked for a corporation as in- house counsel. The attorney discovered that the Chief Financial Officer falsified the corporation’s quarterly earnings report to prop up the firm’s share price, as the CFO’s compensation is partly in stock options. The attorney knows that these misrepresented earnings appeared in the filings to the Securities and Exchange Commission, and the misrepresentations will eventually result in severe regulatory fines or civil liability for the corporation. The attorney believes, with good reason, that the violation will result in substantial injury to the organization. The Chief Financial Officer hired the attorney, and he directly supervises the attorney in the organizational chain of command. The attorney confronted the Chief Financial Officer, but this proved unfruitful, and then the Chief Financial Officer discharged the attorney. What should the attorney do in this situation?", "a": ["The attorney should proceed as the lawyer deems necessary to assure that the organization's highest authority knows about the circumstances of the lawyer's discharge.", "The attorney should immediately report the matter to the relevant government regulatory authority.", "The attorney should keep the information confidential, because the person who hired him has not authorized him to disclose the information.", "The attorney should notify the manager directly above the Chief Financial Officer in the corporation and then drop the matter."], "e": "1.13(e) provides that a lawyer who reasonably believes she was discharged because of actions taken under 1.13(b) or (c) must proceed as she reasonably believes necessary to make sure the organization's highest authority learns of the discharge. Being fired by the CFO she was reporting on doesn't end her duty to the organization, which is the client (1.13(a)). Reporting to regulators isn't the first step, staying silent because the CFO didn't authorize disclosure is wrong, and notifying one manager isn't enough. Book cite: Rule 1.13(e). [W2:81 n.3; W3:26]", "r": "Stevenson, 500 MPRE Questions (2019) Q458 · Rule 1.13 Organization as Client"},
{"t": "fid", "q": "The chief financial officer of Investors’ Club, a private investment trust, is under suspicion for converting $100,000 of Investors’ Club's assets for personal use. The other responsible corporate officers of Investors’ Club, acting on the trust’s behalf, retain an attorney to recover the money from the chief financial officer. At the same time, they direct the attorney not to reveal the loss, or file a lawsuit, until she has first exhausted other collection efforts. Although the matter is not yet in litigation, would it be improper for the attorney to proceed with dual representation, of both the organization and the chief financial officer in this matter, if both consent?", "a": ["Yes, the interests of Investors’ Club and the chief financial officer are so adverse that even informed consent of both would not permit their common representation by Lawyer in the matter.", "Yes, because the restrictions placed on the attorney about disclosures create a conflict of interest between the responsible officers and the best interests of the organization.", "No, even though the interests of Investors’ Club and the chief financial officer are technically adverse, informed consent of both would permit their common representation by the same lawyer in the matter.", "No, because if the officers of a corporation have adverse interests to each other, no individual can provide informed consent to a potential conflict on behalf of the organization."], "e": "The organization hired the lawyer to recover money the CFO allegedly stole, so their interests are directly opposed in the very matter. No lawyer could reasonably believe she can represent both competently, so the conflict is nonconsentable (1.7(b)(1)), and 1.13(g)'s allowance for representing constituents doesn't help. The officers' instruction to collect quietly first isn't itself a conflict, and an organization can consent through disinterested officers when a conflict is consentable. Book cite: Restatement § 131. [W2:81 n.3; W4:7–8; S3:14]", "r": "Stevenson, 500 MPRE Questions (2019) Q460 · Rule 1.13 Organization as Client"},
{"t": "agt", "q": "An attorney had struggled all through law school with the volume of reading and memorization, and then she had struggled to establish a successful law practice because everything took so much time and acumen. She complained constantly about her workload and maintained a blog where she espoused strong views about foreign policy, national security, wine, and exercise. Conglomerate Corporation hired the attorney to represent it in a lawsuit in which it was the defendant. During early settlement negotiations, the attorney told the plaintiff that the Board of Directors for her client, Conglomerate, had formally disapproved any settlement for more than fifty thousand dollars, even though Conglomerate’s Board of Directors had in fact authorized a much higher settlement amount. Was it improper for the attorney to make such untruthful statements during settlement negotiations?", "a": ["Yes, a lawyer must take care not to convey communications regarding the client’s position, which otherwise would not count as statements of fact, in language that converts them, even inadvertently, into false factual representations.", "Yes, during negotiations, a lawyer may not make any inaccurate or evasive statement of fact or law, regardless of materiality, if the statement could influence the other party’s decisions in the matter.", "No, a lawyer may downplay a client’s willingness to compromise, or present a client’s bargaining position without disclosing the client’s “bottom line” position, in hopes of reaching a more favorable resolution.", "No, during negotiations, a lawyer may permissibly make a false statement of material fact or law to a third person or the opposing party in the matter."], "e": "4.1(a) bars knowingly making a false statement of material fact to a third person. ABA Op. 06-439 says a party's goals, settlement authority, and willingness to compromise are generally not statements of material fact, but a lawyer can't convert posturing into a false factual claim. Saying the Board formally voted to reject anything over $50,000, when it hadn't, is a false statement about a specific fact, not puffery. Lawyers may downplay a client's flexibility; they may not invent board resolutions. Book cite: Rule 4.1; ABA Formal Op. 06-439. [W2:41, 67; W4:34; outline VII-B]", "r": "Stevenson, 500 MPRE Questions (2019) Q461 · Rule 4.1 Truthfulness in Statements to Others"},
{"t": "agt", "q": "An attorney represented Conglomerate Corporation in negotiating with an office supplies company for a bulk discount on regular monthly purchases. When the supplier refused to go any lower, the attorney said threateningly that he could pick up the phone at any time and get three of their competitors to beat the supplier’s current price. The attorney had no reason to think this – he was just bluffing, hoping to leverage the supplier into a lower price. Under the Model Rules, was it impermissible for the attorney to make this false statement to a third party?", "a": ["No, such remarks are merely posturing or puffing, and are not statements upon which parties would justifiably rely, so they are not false statements of material fact.", "Yes, a lawyer shall not knowingly make a false statement of material fact or law to a third person.", "Yes, misrepresentations can occur by partially true but misleading statements or omissions that are the equivalent of affirmative false statements.", "No, because the rules covering false statements to an opposing party or counsel apply only in the litigation context."], "e": "4.1(a) reaches false statements of material fact, and ABA Op. 06-439 explains that conventional negotiation posturing and puffing, such as overstating your options or downplaying willingness to deal, aren't treated as statements of material fact a reasonable counterparty would rely on. On the book's view, boasting that competitors would beat the price is that kind of bluster. The rule applies outside litigation too, so that distractor is wrong. Book cite: Rule 4.1; ABA Formal Op. 06-439. [W4:34; outline VII-B] (puffing isn't discussed in the readings)", "r": "Stevenson, 500 MPRE Questions (2019) Q462 · Rule 4.1 Truthfulness in Statements to Others"},
{"t": "agt", "q": "A litigation attorney worked for several years for the Office of the Attorney General in his state, but then left to work for Big Firm. At Big Firm, the attorney exclusively handled litigation for Conglomerate Corporation, one of Big Firm’s most important clients. Conglomerate Corporation had no litigation with the state government, so Big Firm made no effort to screen the attorney from any cases, though it would conduct customary conflict checks. In one case, the attorney was defending Conglomerate Corporation in a personal injury lawsuit over an accident with one of its delivery truck drivers. The parties agreed to use caucused mediation. In caucused mediation, the mediator meets privately with the parties and their counsel. These meetings or caucuses are confidential, and the mediator controls the flow of information among the parties and their counsel, as agreed by the parties. The attorney customarily starts negotiations or regular mediations by downplaying Conglomerate’s willingness to compromise. In the alternative, the attorney might overstate, or sometimes strategically understate, the strengths or weaknesses of Conglomerate’s litigation position. Are such statements, which might otherwise be permissible in regular mediation or direct negotiations, improper during a caucused mediation?", "a": ["No, the same standards that apply to lawyers engaged in negotiations also apply to them in the context of caucused mediation, because parties cannot waive, even by mutual consent, the protections against false statements of material fact during negotiations.", "Yes, there is less concern in the Model Rules about the accuracy of information that lawyers communicate in a caucused mediation, because consensual deception is intrinsic to the process.", "Yes, the accuracy of communication deteriorates on successive transmissions between individuals, and those distortions tend escalate on continued retransmission and reframing by mediators, so caucused mediation requires greater accuracy from the parties and their counsel than customary in face-to-face negotiations.", "No, in a caucused mediation, lawyers make statements in confidence to the mediator, who controls the flow of information between the parties in terms of the content of the communications as well as the timing of its transmission, and this agreed-upon environment of imperfect information helps the mediator assist the parties in resolving their disputes."], "e": "ABA Op. 06-439 holds that the same truthfulness standards apply in caucused mediation as in direct negotiation. Statements about a client's willingness to compromise or the strength of its position that would be acceptable posturing elsewhere remain acceptable, and outright false statements of material fact remain forbidden (4.1(a)). Parties can't waive those protections by agreement. Mediation isn't a tribunal, so 3.3 doesn't apply. Caucusing neither loosens nor tightens the standard. Book cite: Rule 4.1; ABA Formal Op. 06-439. [W2:41, 67; outline VII-B]", "r": "Stevenson, 500 MPRE Questions (2019) Q464 · Rule 4.1 Truthfulness in Statements to Others"},
