{"t": "hum", "q": "A certain attorney worked at Big Firm, and she was supervising a new associate lawyer there. During a negotiation for the sale of a company, in which Big Firm represented the seller, the associate informed the buyer’s lawyers that certain assets of the company had no liens or other encumbrances on them, and that she had verified this herself. This was a misrepresentation – the properties had significant encumbrances, which the purchase price should have reflected, but it did not. The supervising attorney, who was part of the conversation when the associate made the misrepresentation, did not correct her, because she did not want to humiliate her in front of the opposing party, or reveal an internal discord among Big Firm’s lawyers. Instead, the supervising attorney lectured the associate about the misrepresentation privately the next day, and he told her not to let it happen again. Then they agreed to drop the matter, and the supervising attorney instructed the associate to watch for a good opportunity to bring up the mistake and clarify the matter for the buyer. The associate never did so. Could the supervising attorney be subject to discipline for failing to correct the resulting misapprehension by the buyer?", "a": ["Yes, the supervising attorney had a duty to take affirmative steps to correct the misapprehension of the other party, sometime before the consummation of the purchase.", "Yes, the supervising attorney had a duty during the conversation in which the misrepresentation occurred to correct the associate in front of the opposing party.", "No, it was the associate’s duty to correct her own misrepresentation, and the supervising attorney instructed her to do so.", "No, it was not an ethical violation for the associate to misstate that she had checked for liens and encumbrances herself, as opposing counsel would normally do their own check for this."], "e": "A supervisor who knows of a subordinate's violation while its consequences can still be avoided or mitigated, and fails to take reasonable remedial action, is responsible for it (5.1(c)(2)). The comments' own example: when a subordinate misrepresents a fact to an opposing party in a negotiation, the supervisor must correct the resulting misapprehension. Leaving it to the associate, who never fixed it, wasn't enough, and the supervisor needed to make sure the buyer was told before closing. Public humiliation wasn't required. Book cite: Rule 5.1(c) cmt. [5]. [S1:62; W1:65] (MR 4.1(a))", "r": "Stevenson, 500 MPRE Questions (2019) Q336 · Rule 5.1 Responsibility of Partners & Supervisors"},
{"t": "hum", "q": "An attorney had supervisory responsibilities for a new lawyer at her firm, but she had her own cases and clients to handle. It was a busy season for the firm, so the attorney did not check on the associate herself, but she would take time to answer questions if the associate approached her. The associate needed more oversight and direction that she received, and she committed several serious ethical violations. The supervising attorney had no way of knowing about these because the associate was always careful to cover up her mistakes or blame others when something went wrong. Could the supervising attorney avoid responsibility for the associate’s ethical violations even if she did not direct, ratify, or have knowledge of the associate’s misdeeds?", "a": ["No, an attorney having direct supervisory authority over another lawyer must make reasonable efforts to ensure that the other lawyer conforms to the ethical rules, even apart from the supervising attorney directing, ratifying, or even knowing about a specific violation.", "Yes, because the Model Rules require actual knowledge of a subordinate’s ethical violations to trigger disciplinary liability for the supervising attorneys.", "Yes, the Model Rules require actual knowledge of the violations to trigger a duty to report the violations of another lawyer in one’s firm.", "No, supervisory attorneys are automatically responsible for ethical violations by their subordinates if the subordinate engages in a repeated pattern of hiding, covering up, or blaming others for her actions."], "e": "A lawyer with direct supervisory authority over another lawyer must make reasonable efforts to ensure that lawyer complies with the Rules (5.1(b)). That duty is independent of 5.1(c)'s rules for ordering, ratifying, or knowing about a specific violation. A supervisor who never checks on a new associate and only answers questions when asked hasn't made reasonable efforts, so she can't escape responsibility by pleading ignorance. Actual knowledge isn't required for a 5.1(b) violation. Book cite: Model Rule 5.1 cmt. [6]. [S1:61; W1:65]", "r": "Stevenson, 500 MPRE Questions (2019) Q337 · Rule 5.1 Responsibility of Partners & Supervisors"},
{"t": "hum", "q": "An attorney was the District Attorney for a local prosecutor’s office, and she had several subordinate lawyers working under her authority and oversight. This office had a series of appeals from defendants they prosecuted, and in several cases, the appellate courts reversed the convictions over Brady violations, that is, withholding exculpatory material evidence from defense counsel. Is the District Attorney immune to discipline for these violations?", "a": ["No, because a series of reversed convictions over Brady violations from the same office indicates a lack of training or supervision regarding the ethical duties of prosecutors.", "Yes, the Model Rules impose an ethical duty of disclosure on prosecutors only for exculpatory evidence that is “clear and convincing,” so a Brady reversal does not necessarily indicate an ethical violation by the prosecutor in the case.", "Yes, the remedy for Brady violations is for the court to impose direct sanctions on the government lawyers in the case, and this judicial remedy preempts disciplinary action by the state bar in an administrative proceeding.", "No, if there were more than three clear instances of prosecutors withholding exculpatory evidence within her office during a five-year period."], "e": "Under ABA Op. 14-467, a chief prosecutor must make reasonable efforts to have policies, training, and supervision ensuring that subordinates meet their disclosure duties (5.1(a)–(b); 3.8(d)). A series of Brady reversals from one office suggests those measures are missing, so the District Attorney isn't immune. Judicial remedies don't displace discipline, and 3.8(d)'s ethical disclosure duty is broader, not narrower, than Brady. There's no numeric threshold. Book cite: ABA Formal Op. 14-467; Rule 5.1. [S1:61–62] (3.8(d) isn't discussed in the readings)", "r": "Stevenson, 500 MPRE Questions (2019) Q338 · Rule 5.1 Responsibility of Partners & Supervisors"},
{"t": "hum", "q": "An attorney worked as an entry-level prosecutor. She did not have a supervisory position or title in her office hierarchy, but merely worked on her assigned cases under the direction and oversight of the higher-ranked lawyers in the office. On one occasion, however, a case arose involving an issue that was important to her, so she asked to be the lead prosecutor on this one case. The District Attorney agreed, and assigned one other lawyer in the office, who was also an entry-level prosecutor, to assist her on the matter. The case had two defendants, and at one point, the attorney leading the prosecution was in one room negotiating a plea arrangement with the first defendant, and the lawyer assisting her was negotiating with the other defendant at the same time in the next room. The state’s main witness against the two defendants was a third co-conspirator who had become an informant in exchange for a favorable plea that involved no jail time. The lawyer assisting in the case lied to the second defendant and denied that the state’s witness had agreed to a deal. The lawyer had told the lead attorney on the case that he planned to do this beforehand, and she informed him that this would be unethical, but she did not try to stop him from doing so, because she was not his boss. After the negotiations, they met to debrief, and he informed her that he had indeed lied to the defendant and defense counsel about the state’s arrangement with their main witness in the case. She reminded him that this violated the ethical rules, but she took no further action, because she was only an entry-level prosecutor, at the same rank as the lawyer assisting on the case. Could the attorney, as lead prosecutor on the case, be subject for the ethical violations in this case?", "a": ["Yes, even if a lawyer is not a partner or other general manager, she directly supervises the work of the other lawyer as lead prosecutor in this proceeding.", "Yes, all the lawyers working together on a case are responsible for the actions of the others regarding their conduct related to that matter.", "No, ordinarily a lawyer will not be subject to discipline for the actions of other lawyers who are at the same level in the office.", "No, because she did not have a supervisory position or title in her office hierarchy."], "e": "Supervisory responsibility under 5.1(b) depends on actual authority over the work, not title. As lead prosecutor, the attorney directly supervised her colleague on this case. She knew in advance that he planned to lie about the witness's deal, a misrepresentation violating 4.1 and 8.4(c), and did nothing to stop or correct it, so she is responsible under 5.1(c)(2). Being at the same rank in the office doesn't excuse her, and lawyers aren't automatically liable for every co-counsel's acts. Book cite: Rule 5.1(b); ABA Formal Op. 14-467. [S1:61–62; W1:65]", "r": "Stevenson, 500 MPRE Questions (2019) Q339 · Rule 5.1 Responsibility of Partners & Supervisors"},
{"t": "hum", "q": "An insurance company routinely hired outside counsel to represent its policyholders in litigation under liability policy. An inexperienced attorney worked for the firm. The firm’s partners charged the policyholders fees for the representation even though the insurer was already paying their legal fees; this and other aspects of their fee arrangements violated state insurance laws, as well as the ethical rules about reasonable fees. The inexperienced acted as the partners directed him to do and charged clients these fees that were illegal and unreasonable, but at one point he raised concerns about the practice with one of the partners. The partner said he would check into it. Would the safe harbor provision of Model Rule 5.2(b) absolve the attorney of a duty to research the fee issue?", "a": ["No, the attorney had a duty to research the issue himself and would have discovered that the fees were clearly illegal and unreasonable.", "Yes, a subordinate lawyer does not violate the ethical rules when acting upon a partner’s reasonable resolution of an arguable question of professional duty.", "Yes, because the attorney raised his concerns with the partner, who agreed to investigate the issue, so the attorney should wait until the partner has time to research it.", "No, the safe harbor provision does not apply when a firm is serving as outside counsel for an insurance company or a bank."], "e": "5.2(b) protects a subordinate only when he acts on a supervisor's reasonable resolution of an arguable question of professional duty. Charging clients fees the insurer was already paying, in violation of insurance law and 1.5, wasn't arguable, and the partner never resolved anything; he just said he'd look into it. A subordinate remains bound by the Rules even when acting at another's direction (5.2(a)), so the attorney had to look into the issue himself and stop. Book cite: Disciplinary Counsel v. Smith (Ohio 2009). [S1:59; W1:50; S1:67–68]", "r": "Stevenson, 500 MPRE Questions (2019) Q340 · Rules 5.2 Responsibilities of a Subordinate Lawyer"},
{"t": "hum", "q": "An attorney had recently graduated from law school and entered the practice of law. After a federal clerkship, he went to work for Big Firm, which paid the highest associates’ salaries in the state. A partner at Big Firm gave the attorney an assignment to represent the teenage daughter of one Big Firm’s most important clients, a billionaire social media entrepreneur. The daughter had been part of a group of student protesters that the police had arrested the previous week for trespassing. When arrested, the daughter had given the police a friend’s driver’s license and identified herself as the friend, who had a similar appearance. The police mistakenly charged the daughter under the friend’s name, and the district attorney proceeded to prosecute her under the mistaken identity. The friend, whose name and driver’s license the daughter had used, was unaware that she was the named defendant in a misdemeanor criminal case, and the billionaire’s daughter, who was now the attorney’s client, continued with the ruse even as she remained in custody along with the other protestors. During a private consultation with her, the attorney asked about the name discrepancy, as he was expecting to represent the daughter of Big Firm’s client, and the girl explained the false identification, and insisted that the attorney not disclose her real identity to the police or the court. Back at the firm’s office, the attorney approached the partner who had assigned the case, but before the attorney could finish explaining the name problem, the partner said, “Do not mess this up, her father is an important client of the firm. Convince the court to drop the charges as quickly as possible. Close this matter quickly.” The attorney spoke to the prosecutor and convinced her to dismiss the case, but the attorney never told her about the misidentification of his client. After the dismissal of the case, the attorney met with the billionaire’s daughter and her mother, together with the friend whose name she had used and the friend’s parents, who were upset that their daughter had been a named defendant in the matter in the first place. Despite the attorney’s efforts to reassure the friend’s parents that the state dropped the charges, the friend’s parents contacted the prosecutor’s office in hopes of removing the arrest from their daughter’s record. When the prosecutor realized what had transpired, he reported the attorney to the state bar disciplinary authorities. Could the attorney, as an inexperienced new associate at Big Firm, be subject to discipline for this matter?", "a": ["Yes, regardless of the directions the attorney received from the partner at Big Firm or from the client, he is subject to discipline for failing to disclose a material fact to a tribunal when disclosure was necessary to avoid assisting a criminal or fraudulent act by a client.", "Yes, because the attorney had a duty to consult with the friend who was the named defendant in the case before negotiating the terms of the dismissal with the prosecutor.", "No, because the attorney acted in accordance with a supervisory lawyer's reasonable resolution of an arguable question of professional duty.", "No, the attorney tried to bring his claimed ethical dilemma to the partner for his advice, and the partner failed to provide adequate guidance to the respondent."], "e": "A lawyer is bound by the Rules even when acting at another's direction (5.2(a)). Knowing his client was being prosecuted under a stolen identity, the associate got the case dismissed without telling the prosecutor or court. That's failing to disclose a material fact needed to avoid assisting the client's fraud (3.3(b); 4.1(b); 8.4(c)). The partner's 'close it quickly' wasn't a reasonable resolution of an arguable question, so 5.2(b) gives no cover. Telling the partner part of the story doesn't excuse him. Book cite: People v. Casey (Colo. 1997). [S1:59, 67–68; W1:50–51]", "r": "Stevenson, 500 MPRE Questions (2019) Q341 · Rules 5.2 Responsibilities of a Subordinate Lawyer"},
{"t": "hum", "q": "An attorney works exclusively as a contract lawyer for other firms that need extra help for big cases, whether in pre-trial document review or in background research and writing of briefs. She has no direct contact with the clients of these firms, and she does not participate in important decisions about any of the matters for which she performs legal tasks. Can the attorney avoid being be subject to discipline if a firm uses her contract work in a way that constitutes misconduct, either regarding clients or before a tribunal, assuming she either knows or could have known about the misconduct?", "a": ["No, a contract lawyer has a duty to comply with the requirements of the Rules of Professional Conduct, notwithstanding that the lawyer acted at the direction of another person.", "Yes, because she is not an employee of the firm and therefore cannot control how the firm uses her legal work product.", "Yes, if her contract with the firm includes a provision in which the firm takes full responsibility for misconduct, malpractice, or ethical violations.", "No, if the clients in the matters agree that they will not hold her responsible for the work product she contributes to their representation."], "e": "A lawyer is bound by the Rules notwithstanding that she acted at someone else's direction (5.2(a)). A contract lawyer who knows, or could have known, that her work is being used for misconduct can't escape responsibility because she isn't an employee or doesn't meet clients. A contract clause shifting responsibility to the hiring firm doesn't change her ethical duties, and clients can't waive the Rules for her. Book cite: Rule 5.2; Phila. Ethics Op. 2010-4; S.C. Ethics Op. 10-08. [S1:59; W1:50]", "r": "Stevenson, 500 MPRE Questions (2019) Q342 · Rules 5.2 Responsibilities of a Subordinate Lawyer"},
{"t": "hum", "q": "An attorney who had only recently graduated from law school, and she received a job offer from a newly-elected County Attorney, after volunteering for his campaign. The new attorney did not directly handle cases but assisted trial lawyers with clerical work and non-legal tasks, such as creating public service announcements for websites, social media, and press interviews. The County Attorney soon began a series of highly-publicized attacks, including lawsuits and investigations, against political rivals on the County Board and County Courts. At one point, the County Attorney decided to file a federal civil racketeering lawsuit against several of the County Board members. There was no factual support for the allegations. When all the other lawyers in the office refused to be involved in the matter, the County Attorney assigned the case to the new attorney, who had no trial experience, and who was completely unfamiliar with the racketeering statute or case law. She took the case enthusiastically because she was eager to prove herself to the County Attorney; she even tried to amend the complaint to add additional racketeering charges, which were merely duplicative of the existing frivolous charges. She also filed several preemptive pre-trial motions seeking to qualify her expert witnesses and suppress evidence the defendants might try to submit. The court denied the motion to amend the complaint and dismissed the original complaint for having no basis in fact or law. The judge took the additional step of filing a grievance with the state bar against the attorney. In her hearing before the disciplinary committee, the attorney claimed that she was too inexperienced to know that the racketeering charges in her case had no basis in fact or law, and that she merely deferred to the guidance and instructions of the County Attorney. Could she be subject to discipline despite these mitigating factors?", "a": ["Yes, regardless of the directions of her superiors or her inexperience, she had a duty not to bring a frivolous proceeding or assert a frivolous issue in litigation.", "Yes, because she had no trial experience and knew she could not have handled a complex racketeering case competently.", "No, because a lawyer need not necessarily have special training or prior experience to handle legal problems of a type with which the lawyer is unfamiliar; even a newly admitted lawyer can be as competent as a practitioner with extensive experience.", "No, a subordinate lawyer does not violate the ethical rules she acts in accordance with a supervisory lawyer's reasonable resolution of an arguable question of professional duty."], "e": "Every lawyer must not bring or press frivolous claims (3.1), and 5.2(a) says acting at a supervisor's direction is no excuse. Filing a factually baseless racketeering suit against political rivals, then trying to add duplicative charges, isn't a reasonable resolution of an arguable question, so 5.2(b) doesn't apply. Inexperience and eagerness to please are mitigating at most. Her lack of trial experience is a competence concern, but the core violation is frivolous litigation. Book cite: In re Alexander (Ariz. 2013); Rule 5.2. [S1:59; W1:34, 50] (3.1 isn't discussed in the readings)", "r": "Stevenson, 500 MPRE Questions (2019) Q343 · Rules 5.2 Responsibilities of a Subordinate Lawyer"},
{"t": "hum", "q": "An attorney works for a mid-size law firm that employs two or three law students every year as summer associates. The manager of the student associates assigns one of them to work on the attorney’s pending antitrust case, in addition to assignments for other lawyers at the firm. While researching a central issue in the case, the summer associate discovered an older Supreme Court decision that was unfavorable to their client. The summer associate decided not to tell anyone about the case, as the opposing party seemed to have overlooked it in their briefs. The attorney was not aware of any of this until they were on a break during their hearing. The hearing was going well for their side, and the associate boasted to the attorney about “burying” that Supreme Court case he had found. The attorney said, “Well, you should have told me about it at the time, but there is no point in bringing it up now, as it appears opposing counsel overlooked it and the hearing is going our way.” The judge’s clerks, however, found the case, and the judge queried the lawyers about how they could have missed it. Opposing counsel admitted he had been negligent in doing legal research on the matter, and the attorney recounted the story about the summer associate hiding the case from him. Is the attorney now subject to discipline for what the summer associate did?", "a": ["Yes, even though he was unaware of the violation at the time, the attorney ratified the summer associate’s conduct after he learned about it.", "Yes, because lawyers are automatically liable for the misconduct of nonlawyer employees at their firm; the lawyer had an affirmative duty to find the case himself and disclose it.", "No, because the attorney did not know about the associate’s conduct at the time it occurred, or while submitting briefs, or even when the hearing began.", "No, because opposing counsel was negligent in failing to research the issue, and if he had, he would have been likely to discover the case on his own."], "e": "A lawyer is responsible for a nonlawyer assistant's conduct that would violate the Rules if he orders it or, knowing of the specific conduct, ratifies it (5.3(c)(1)). Once the summer associate told him about burying controlling adverse authority, the attorney approved staying silent instead of disclosing it, which ratified the conduct. His own duty to disclose directly adverse controlling authority (3.3(a)(2)) also arose then. The opponent's negligence doesn't excuse him, and there's no automatic liability. Book cite: Rule 5.3. [S1:64–65; W1:65]", "r": "Stevenson, 500 MPRE Questions (2019) Q344 · Rule 5.3 Responsibilities Regarding Nonlawyer Assistants"},
{"t": "hum", "q": "An attorney hired Receptionist because of her good looks and because her brother was in the attorney’s college fraternity, but he did not check into her background at all or ask for references. Receptionist had access to all files, records, and accounts in the firm, and three months later, there arose a problem with funds missing from client trust accounts. Circumstantial evidence pointed to Receptionist as the culprit, and at this point the attorney learns that Receptionist has an arrest record for theft and embezzlement on several occasions in the past. The attorney lectures Receptionist about it but allows her to keep her job because nobody can prove her guilty - the firm does not keep the type of records that would enable anyone to prove where the missing funds went. When additional complaints arise over misappropriated client trust funds, would the attorney be subject to discipline?", "a": ["Yes, because he was negligent in the hiring and supervision of nonlawyer employees.", "Yes, because lawyers face strict liability (automatic responsibility) for misappropriations of client trust funds.", "No, because it is implausible that the attorney could have known about the arrest record of someone merely interviewing for a receptionist position, and there is still no way to prove that Receptionist actually stole the money.", "No, because Receptionist is not a lawyer and therefore not subject to the Rules of Professional Conduct."], "e": "5.3 requires lawyers to make reasonable efforts to ensure nonlawyer staff act consistently with the lawyer's obligations: selecting, instructing, and supervising them. Giving an unvetted hire access to trust accounts, then keeping her on after learning of her theft record and finding money missing, with no records to trace it, is negligent hiring and supervision. Trust accounting duties are personal ('delegate; don't abdicate'), and inadequate records violate 1.15. This isn't strict liability, and staff not being lawyers doesn't excuse him. Book cite: Rule 5.3. [S1:64–65; W5:28]", "r": "Stevenson, 500 MPRE Questions (2019) Q345 · Rule 5.3 Responsibilities Regarding Nonlawyer Assistants"},
{"t": "hum", "q": "A certain attorney is a fifth-year associate at a large national law firm. As a senior associate, the attorney can attend business meetings of the firm, but cannot vote on any decisions. The attorney is aware that the firm has no measures in effect that would give reasonable assurance that the paralegals are observing the confidentiality and conflict of interest rules that are part of the professional obligations of lawyers. The attorney mistakenly believes, however, that the rules apply only to the lawyers in the firm, not to the clerical staff of paralegals. When a paralegal in a separate practice group from the attorney violates the rules and the state disciplinary authority investigates the firm’s ethical compliance measures, will the attorney be subject to discipline?", "a": ["No, because the attorney is not a partner nor in a comparable managerial position to implement such measures, nor does it appear that the paralegal was under the attorney’s direct supervision", "Yes, because any attorney with enough seniority to attend firm business meetings with the partners has shared responsibility to ensure that measures are in effect to keep the paralegals in compliance with the rules.", "Yes, because the attorney is aware that the firm has no measures in effect that would give reasonable assurance that the paralegals are observing the confidentiality and conflict of interest rules", "No, because the attorney honestly believed that the Rules of Professional Conduct do not apply to the paralegals, and therefore falls under the good-faith exception to the rule."], "e": "5.3(a)'s duty to have firm-wide measures for nonlawyer compliance falls on partners and lawyers with comparable managerial authority, and 5.3(b) applies to lawyers with direct supervisory authority over the nonlawyer. A fifth-year associate who can attend meetings but can't vote is neither a manager nor this paralegal's supervisor, so he isn't subject to discipline for the missing measures. His mistaken belief isn't a 'good-faith exception,' and mere awareness doesn't create responsibility. Book cite: Rule 5.3. [S1:64–65]", "r": "Stevenson, 500 MPRE Questions (2019) Q346 · Rule 5.3 Responsibilities Regarding Nonlawyer Assistants"},
{"t": "hum", "q": "An attorney employs an experienced legal assistant to manage administrative matters in the firm, including the client trust accounts. The attorney provided the legal assistant with detailed instructions about client trust accounts, including the specific kinds of records to keep, what funds to deposit there, and under what circumstances to withdraw funds. The attorney also sent the legal assistant to attend CLE courses and workshops on IOLTA accounts and managing firm records. Due to the legal assistant’s thorough training, competence, and experience, the attorney reviewed the client account books cursorily once a year during the annual review of the employee. Eventually, an audit by the state disciplinary authority revealed numerous discrepancies in the bookkeeping regarding the IOLTA accounts and some prohibited commingling of client funds with the firm’s funds. The attorney had no actual knowledge of the discrepancies or problems regarding the client trust accounts. Is the attorney subject to discipline?", "a": ["Yes, because the attorney did not make reasonable efforts to ensure that the legal assistant’s conduct was compatible with the professional obligations of a lawyer.", "Yes, because the attorney must manage all client trust accounts personally and cannot delegate such matters to support staff at the firm.", "No, because the attorney made reasonable efforts to ensure that the legal assistant’s conduct was compatible with the professional obligations of a lawyer by providing extensive training and periodic reviews.", "No, because the attorney lacked actual knowledge of the discrepancies, and the legal assistant is not subject to the Rules of Professional Conduct."], "e": "Lawyers may delegate trust-account work, but the duties under 1.15 remain the lawyer's, and 5.3(b) requires reasonable efforts to supervise. Training helps, but a cursory annual look at the books isn't reasonable oversight of client funds. The readings put it as 'delegate; don't abdicate' and 'trust, but verify,' which requires regular reconciliation and review. Commingling and record errors are violations even without knowledge or loss. Delegation isn't forbidden, and lack of knowledge doesn't excuse him. Book cite: Rule 5.3. [W5:28; S1:64]", "r": "Stevenson, 500 MPRE Questions (2019) Q347 · Rule 5.3 Responsibilities Regarding Nonlawyer Assistants"},
{"t": "fee", "q": "An attorney was part of a partnership before he died. He left his nephew as his sole heir. The partnership agreement, as written, provides that the firm should pay the certain amounts to the nephew. Those amounts are $210,000, for the attorney’s share of the firm's assets; a $500,000 death benefit, provided for all shareholders in the partnership; and $17,500 for fees that the attorney earned on recent cases, but had not yet received. Under the Model Rules, which of the following represents the most that the firm may properly pay to the decedent's nephew?", "a": ["$727,500, for the attorney’s share of the firm's assets, his of uncollected fees, and the death benefit", "Only the $210,000 for the attorney’s share of the firm's assets.", "Only $17,500 for the attorney’s uncollected fees.", "Only $500,000 for the death benefit, as death benefits come under a special exception under the Rules of Professional Conduct."], "e": "5.4(a)(1) allows a firm to pay a deceased lawyer's estate or other specified persons over a reasonable time, and the death benefit fits that exception. Paying for the lawyer's share of firm assets and remitting fees he personally earned before death aren't improper fee-sharing at all; they're his property. So the firm may pay the nephew all $727,500. None of the payments gives a nonlawyer a share of fees for future legal work. [W5:18; S5:26]", "r": "Stevenson, 500 MPRE Questions (2019) Q348 · Rule 5.4 Professional Independence"},
{"t": "fee", "q": "Attorney Barrett was the managing partner at a small law firm. Barrett hired Cooper, an ordained minister who had been unemployed, as a legal assistant at the firm. Cooper’s main job at the firm, however, was to bring in new clients. Cooper received a minimum-wage base salary, but also received large bonuses for bringing in clients who generated fees for the firm, and the combined bonuses each year exceeded $100,000. The firm paid for Cooper to complete a certification course to become a hospital chaplain, which gave Cooper chaplain’s access to emergency areas of hospitals to visit accident victims and their families. He would offer to pray with them, but he would also give them a business card from Barrett’s firm. In this way, Cooper brought several high-payoff personal injury clients to the firm. Cooper also recruited clients from the local church where he served as a “biblical counselor.” Is it proper for the firm to pay Cooper bonuses for bringing fee-generating clients to the firm?", "a": ["No, the arrangement constitutes an improper sharing of fees with a nonlawyer.", "Yes, because Cooper is merely recommending the firm to individuals he meets while conducting his ministry activities.", "Yes, because Cooper is doing recruiting clients as an employee of the firm, under the direct supervision of Attorney Barrett.", "No, because it is unethical to use Cooper’s chaplain status to gain access to hospital patients and their families."], "e": "Lawyers may not share legal fees with nonlawyers (5.4(a)), and bonuses tied to the fees generated by clients a nonlawyer brings in are fee-sharing. Paying someone for recommending the lawyer also violates 7.2(b). Using a chaplain's hospital access to solicit accident victims adds an improper in-person solicitation through another (7.3; 8.4(a)). Being an employee doesn't change this, since only a general compensation or retirement plan qualifies under 5.4(a)(3). Book cite: Florida Bar v. Barrett (Fla. 2005). [W5:18–19 (Problem 20F-1(e)); S5:26]", "r": "Stevenson, 500 MPRE Questions (2019) Q349 · Rule 5.4 Professional Independence"},
{"t": "fee", "q": "An attorney could not find a full-time job after law school, so instead he works on a contract basis for other firms. The attorney also signs up with a legal temp-work agency, a company owned by nonlawyers that places lawyers in temporary assignments at law firms that need an extra associate on a short-term basis. Law firms contact the legal temp-work agency when they need lawyers for a special project or assignment, and the agency sends them several resumes from which to choose the temporary associates they want. Through this temp- work agency, the attorney receives a three-month assignment at Big Firm conducting document review as part of litigation discovery. The firm pays the attorney $75 per hour, and it pays the temp-work agency a placement fee of 7% on whatever the attorney earns. Big Firm, in turn, passes the attorney’s $100/hour fees and the 7% placement fee through to its clients as an item on the client’s bill. Is this arrangement proper?", "a": ["It is proper for Big Firm to pay the placement fee to the agency, to pass the fees through to the clients, and to pay the attorney’s hourly rate out of the fees it receives from clients.", "It is proper for Big Firm to hire the attorney on an hourly, short-term contract basis and to pass his fees through to the client, but it is improper for Big Firm to pay the temp-work agency a percentage, as this constitutes sharing legal fees with the nonlawyers who own the temp-work agency.", "It is proper for Big Firm to pay the attorney and the temp-work agency, but it is improper for Big Firm to pass the costs through to their clients.", "It is proper for Big Firm to pay a temp-work agency and to pass these costs through to the clients, but it is improper for the attorney to work on a case on an hourly-fee basis without becoming an associate at Big Firm."], "e": "Under ABA Op. 88-356, a firm may hire a temporary lawyer through a placement agency, pay the agency a fee based on the lawyer's compensation, and pass the cost through to clients. The agency's fee is measured by what the lawyer is paid, not by fees the client pays for legal work, so it isn't fee-sharing with nonlawyers under 5.4(a), and the agency doesn't direct the lawyer's judgment (5.4(c)). The temp needn't become an associate. Any markup must be reasonable and properly disclosed (1.5). Book cite: ABA Formal Op. 88-356. [W5:16, 18]", "r": "Stevenson, 500 MPRE Questions (2019) Q350 · Rule 5.4 Professional Independence"},
{"t": "fee", "q": "After a long, distinguished career as a solo practitioner in a major city, an elderly attorney agrees to join a newer law firm on the condition that the firm would pay $1000 per month after the attorney’s death to his sister, who is 74 years old, until her death. The attorney’s sister is not a lawyer. The firm agrees to this arrangement, in addition to making the attorney a partner with a 15% share in the firm. Is this arrangement proper?", "a": ["Yes, because it is the payment of money over a reasonable period after the lawyer’s death to a specified person.", "Yes, because the Contracts Clause of the Constitution guarantees the freedom of contract, so lawyers and firms can make whatever compensation arrangements they want.", "No, because the sister is not a lawyer and therefore cannot share in the legal fees received by the firm.", "No, because payments that continue until the sister’s death could go on indefinitely, and this goes beyond the Model Rules’ stipulation of “a reasonable period of time.”"], "e": "5.4(a)(1) allows an agreement for a firm to pay money, over a reasonable period after a lawyer's death, to his estate or to one or more specified persons. A monthly payment to the lawyer's sister after his death, bargained for when he joined the firm, fits the exception even though she isn't a lawyer. The book treats payments for her lifetime as a reasonable period. Freedom of contract isn't the reason, since the Rules do limit compensation deals. [W5:18; S5:26]", "r": "Stevenson, 500 MPRE Questions (2019) Q351 · Rule 5.4 Professional Independence"},
{"t": "fee", "q": "An attorney agrees to buy the successful law firm of a fellow lawyer who recently succumbed to terminal cancer. The sale includes the office building, the library and furnishings, and the good will of the firm, and conforms to the provisions of Rule 1.17. The purchasing attorney pays $100,000, the agreed-upon purchase price, to the executor of the deceased lawyer’s estate, but the executor is not a lawyer. The funds for the purchase came from the contingent fees in a recent personal injury case won by the purchasing attorney. Was this transaction improper?", "a": ["No, because an attorney purchasing the firm of a deceased lawyer may pay the executor the agreed-upon purchase price.", "Yes, because the attorney is sharing legal fees with a nonlawyer, the executor.", "Yes, because the funds for the purchase came from a contingent-fee case.", "No, because even a nonlawyer executor of a firm functions temporarily in the role of a lawyer for purposes of the Model Rules."], "e": "5.4(a)(2) lets a lawyer who buys the practice of a deceased, disabled, or disappeared lawyer under 1.17 pay the agreed purchase price to that lawyer's estate or representative. Paying the nonlawyer executor is therefore proper, and where the buyer's money came from (here, a contingent fee he earned) is irrelevant. The executor doesn't become a lawyer. The payment simply falls within an exception to the ban on sharing fees with nonlawyers. [W5:18; S5:26]", "r": "Stevenson, 500 MPRE Questions (2019) Q352 · Rule 5.4 Professional Independence"},
{"t": "fee", "q": "Three law partners have decided to incorporate their firm instead of continuing as a partnership, as their malpractice insurer has offered them a lower rate on their premiums if they incorporate and thereby reduce some of their joint liability. They also want to make a clearer track for associates to become shareholders after reaching certain performance benchmarks. The articles of incorporation provide that when a shareholder dies, a fiduciary representative of the estate may hold stock in the corporation for a reasonable time during administration of the estate before transferring it to the heirs. Which of the following may the partners properly do as they incorporate?", "a": ["They may provide, as stated, that when a shareholder dies, a fiduciary representative of the estate may hold stock in the corporation for a reasonable time during administration of the estate before cashing out the shares and transferring the funds to the heirs.", "They may incorporate their law practice and convey an interest in the corporation to their heirs, such as spouses or children.", "They may stipulate that the corporation will hold all funds in a single operating account, and thereby avoid holding client funds in separate IOLTA accounts.", "They may not have a plan whereby associates acquire shares merely by working at the firm for a certain number of years and bringing in a certain number of clients."], "e": "A lawyer may not practice in a for-profit firm in which a nonlawyer owns an interest, but 5.4(d)(1) has one exception: a fiduciary representative of a deceased lawyer's estate may hold the stock for a reasonable time during administration. The articles' provision fits that exception. Heirs can't become owners, client funds still go in trust accounts (1.15), and an associate-to-shareholder track is fine since associates are lawyers. Book cite: Rule 5.4(d)(1). [W5:18; S5:26]", "r": "Stevenson, 500 MPRE Questions (2019) Q353 · Rule 5.4 Professional Independence"},
{"t": "fee", "q": "A church retains an attorney to challenge a new zoning regulation that would prohibit the church from constructing a new, expanded sanctuary on its property, attached to the existing church. The church cannot afford to pay the attorney, and it is seeking only a declaratory judgment (that the regulation is invalid) rather than money damages. The attorney agrees to take the case and then split any court- awarded legal fees with the church if they prevail. They win a favorable judgment; the court declares the regulation unconstitutional and awards legal fees, which the attorney shares with the church. Is the fee sharing proper?", "a": ["Yes, because a lawyer may share court-awarded legal fees with a nonprofit organization that retains the lawyer in a matter.", "No, because a lawyer or law firm shall not share legal fees with a nonlawyer.", "No, because the award of legal fees to a church violates the separation of church and state, and a lawyer is under oath to uphold the Constitution.", "Yes, assuming the attorney takes only 30% of the legal fees and does not claim a tax deduction for the 70% shared with the church."], "e": "5.4(a)(4) allows a lawyer to share court-awarded legal fees with a nonprofit organization that employed, retained, or recommended the lawyer in the matter. The church, a nonprofit that retained the attorney, may share the fee award. The general ban on sharing fees with nonlawyers has this express exception. The church-state argument is irrelevant, and there's no percentage or tax condition. [W5:18; S5:26]", "r": "Stevenson, 500 MPRE Questions (2019) Q354 · Rule 5.4 Professional Independence"},
{"t": "reg", "q": "An attorney is a licensed lawyer in a New England state, but has an office and represents clients exclusively in a southern state. The attorney confines her practice to immigration law, representing foreign- born clients in immigration hearings. A relevant federal statute permits nonlawyers to appear as representatives for immigrants when they appear before the immigration agency. Many of the attorney’s clients have applied for a spousal visa after marrying an American citizen, and some clients had a Notary Public from their home country or an un- ordained lay minister from their home church conduct their wedding ceremony. In addition, some were previously married and divorced in their home country, where such transactions are informal and have no official documentation. There is often some question about whether the marriage is valid under local state law, which is a prerequisite for obtaining certain types of visas. Which of the following is correct?", "a": ["The attorney could be subject to discipline for the unauthorized practice of law in this southern state.", "The attorney’s conduct is proper, because she is merely providing services authorized by federal law, which preempts state licensing requirements.", "The attorney’s conduct is proper because she has specialized in immigration law, which is entirely federal and involves no questions of state law.", "The attorney’s conduct is improper if she does not file a pro hac vice appearance in each case."], "e": "⚠ Answer-key warning: The book's keyed answer is debatable. 5.5(d)(2) and cmt [18] permit services authorized by federal law, and immigration lawyers admitted in any state commonly practice anywhere. Many would treat incidental state-law questions as within that authorization.\n\nA lawyer not admitted in a state may not establish an office or systematic and continuous presence there for practicing law (5.5(b)). Federal law allows practice before the immigration agency, but on the book's view her advice on whether marriages and foreign divorces are valid under the southern state's law is state-law practice, so she risks UPL. Pro hac vice doesn't cure a permanent office. [W1:21; S1:29, 86–87]", "r": "Stevenson, 500 MPRE Questions (2019) Q355 · Rule 5.5 Unauthorized Practice & Multijurisdictional Practice"},
{"t": "reg", "q": "A husband and wife are both attorneys in Puerto Rico, though they attended law school in Florida. They have practiced in Puerto Rico for ten years and have a license to practice there. Last year, they moved to Florida, where the wife took the state bar exam and gained admission to the Florida bar. They have now opened a law office in Florida with both of their names listed on the firm letterhead, followed by the phrase “Attorneys at Law.” The husband confines his practice exclusively to Puerto Rican clients who are living in Florida or are visiting there; the wife handles all other legal matters. It is proper for them to use such letterhead?", "a": ["No, because the letterhead reveals that the wife is aiding her husband in the unauthorized practice of law.", "Yes, because Puerto Ricans are U.S. Citizens, and they both attended an American law school.", "Yes, because the husband confines his practice to Puerto Rican immigrants and visitors, whom he would be able to represent if they were back in Puerto Rico.", "No, because identifying themselves as law firm partners is misleading, and does not apprise readers to the fact that they are indeed married."], "e": "A lawyer not admitted in a state may not practice there from an office, or hold himself out as admitted there (5.5(b)), even if he handles only clients from his home jurisdiction. The husband, admitted only in Puerto Rico, practicing from a Florida office under a joint 'Attorneys at Law' letterhead is engaged in UPL, and the wife, admitted in Florida, is assisting it (5.5(a)). The course's Borris question is the same pattern. Citizenship and choice of clients don't help. Book note: the letterhead would also mislead (7.1). [S1:86–87; W1:21]", "r": "Stevenson, 500 MPRE Questions (2019) Q356 · Rule 5.5 Unauthorized Practice & Multijurisdictional Practice"},
{"t": "reg", "q": "An attorney obtained a license to practice law in the state where she attended law school. After a few years, the attorney took a job in a neighboring state, moved there, and obtained a license to practice law in her new state. She kept her original license, in her former state, but went on inactive status there to avoid the burdensome annual bar membership fees in a state where she no longer practiced. Eventually, her new firm loses its anchor clients and recommends that the attorney drum up some new business among her former clients. Then the attorney sends letters to all her former clients in her former state, offering to represent them in any new legal matters they have, or in updating wills or contracts that she previously did for them. She travels about once per week to her home state and meets with clients in a library study room at the law school she attended. A few of her former clients refer her to friends or relatives who become new clients, and the attorney’s new employer is thrilled. Which of the following is true?", "a": ["Both the attorney and her supervising lawyer are subject to discipline because she is on inactive status in her home state but is soliciting clients and handling their matters there regularly.", "The attorney is subject to discipline for practicing law in her home state while on inactive status, but her supervising lawyer is not subject to discipline because she had a license to practice in that state when he hired her.", "Neither the attorney nor her supervising lawyer would be subject to discipline, because she merely went on inactive status in the other state, but she still holds her license there.", "Only the supervising lawyer is subject to discipline, because he encouraged his subordinate to solicit out-of-state clients in a state where he is unlicensed, but the attorney can still practice law there."], "e": "A lawyer on inactive status can't practice in that state, so soliciting clients there and meeting them weekly to handle their matters is UPL (5.5(a)–(b)). Her supervising lawyer, who directed her to drum up that business, is responsible for ordering it (5.1(c)(1)) and for knowingly assisting it (8.4(a)). Holding an inactive license isn't a license to practice, and having been licensed when hired doesn't protect the supervisor. [W1:21; S1:29, 62]", "r": "Stevenson, 500 MPRE Questions (2019) Q357 · Rule 5.5 Unauthorized Practice & Multijurisdictional Practice"},
{"t": "reg", "q": "A client retains his attorney, who has represented the client in the past, to represent him in litigation in another state, where the attorney is unlicensed. The matter requires some knowledge of the law of the state where the trial will occur. His attorney files a pro hac vice appearance in the matter, which the local court accepts, and begins preparing for trial there. The attorney and the client never discuss the particulars of filing a pro hac vice appearance; nor did they discuss why it would be necessary. The client never asked if the attorney could practice law in the other jurisdiction, and the attorney never explained the licensing requirement and that he would need permission from the court there to handle the case. Then the attorney prevailed in the matter on behalf of the client, kept his agreed- upon contingent fee, and gave the client the remaining proceeds and unused retainer funds. Which of the following is true?", "a": ["It was improper for the attorney to fail to disclose to the client that he was unlicensed in the other state and would need to file a pro hac vice appearance, especially given that the matter required some knowledge of local laws.", "The attorney is subject to discipline for accepting a contingent fee in a proceeding in another state where the attorney does not have a license to practice law.", "The attorney’s conduct was proper, as the court accepted the pro hac vice appearance, and it made no difference to the client whether the attorney had a license to practice there on an ongoing basis or appeared only on a pro hac vice basis.", "The attorney’s conduct was proper, assuming the attorney can acquire the necessary knowledge of local laws with a reasonable amount of study."], "e": "Pro hac vice admission itself was proper (5.5(c)(2)), but 1.4(b) requires explaining what the client reasonably needs to make informed decisions. A client hiring an out-of-state lawyer for a case that turns on local law should know the lawyer isn't licensed there and needs the court's permission to appear. The winning result and the court's acceptance don't satisfy the duty to inform. A contingent fee is fine, and competence isn't the issue. [W1:46 n.21; W4:9; S1:39]", "r": "Stevenson, 500 MPRE Questions (2019) Q358 · Rule 5.5 Unauthorized Practice & Multijurisdictional Practice"},
{"t": "reg", "q": "An attorney is a joint-owner of a collection agency. Whenever the agency’s initial efforts to collect prove unsuccessful, the staff at the agency sends the delinquent debtor a demand letter on the attorney’s law firm letterhead, threatening to commence litigation if the matter does not reach a resolution within 30 days. The attorney authorized the staff at the agency to send these demand letters, but the attorney is too busy to review all the letters himself. The collection agency staff signs the letters on behalf of the attorney’s firm. Will the attorney be subject to discipline for authorizing these letters?", "a": ["Yes, because the attorney is merely facilitating the collection agency in the unauthorized practice of law.", "Yes, because the letter contains a specific threat of litigation and the facts do not specify whether the attorney will indeed follow through and file any claims in court.", "No, because the collection agency has other owners besides the attorney, so it is not necessarily his responsibility to supervise the employees there.", "No, because the staff at the collection agency are acting on the attorney’s behalf with his explicit authorization"], "e": "A lawyer must not assist others in the unauthorized practice of law (5.5(a)). Letting collection-agency staff send threatening demand letters on his firm letterhead, signed for the firm, without any lawyer reviewing them, lends his license to nonlawyers practicing law. It also misleads debtors into thinking a lawyer reviewed their case (8.4(c)). Authorizing the staff is the problem, not a defense, and co-owners don't dilute his responsibility. [W1:21; S1:64–65]", "r": "Stevenson, 500 MPRE Questions (2019) Q359 · Rule 5.5 Unauthorized Practice & Multijurisdictional Practice"},
{"t": "reg", "q": "An attorney hired a second-year law student as a clerk. The law student is unlicensed. The attorney has the law student perform a variety of tasks. Which of the following tasks, if performed by the law student, would mean that the attorney is subject to discipline?", "a": ["Reaching settlement agreements with insurance companies before the attorney indeed files any lawsuit in the matter.", "Conducting online legal research and writing research memoranda.", "Drafting a customized retainer agreement for the attorney to use with clients pursuing claims against a government agency", "Interviewing accident witnesses and potential character witnesses; and asking them to certify the accuracy of the student's written notes."], "e": "Lawyers may delegate work to nonlawyers, including law students, if they supervise it and keep responsibility (5.5 cmt [2]; 5.3). Research memos, drafting documents for the lawyer's review, and interviewing witnesses are all proper delegated tasks. Negotiating and concluding settlements with insurers is the practice of law: exercising legal judgment for the client. Letting an unlicensed student do it assists UPL (5.5(a)). Book cite: Rule 5.5(b) and cmt. [2]. [W1:21; S1:64–65]", "r": "Stevenson, 500 MPRE Questions (2019) Q360 · Rule 5.5 Unauthorized Practice & Multijurisdictional Practice"},
{"t": "reg", "q": "An experienced attorney has an office in State X, and she is duly licensed to practice law in that state. The attorney’s office is in a city on the border of State Y, and the attorney does not have a license to practice there. Over the years, some of the attorney’s clients have in fact been residents of State Y, and their legal issues sometimes involve research into the laws or judicial precedents of State Y. For the convenience of these clients, and to attract business of other clients there, the attorney rents a small office space, hires nonlawyer clerical staff, and otherwise prepares premises for the general practice of law at a branch-office location in State Y. Apart from the issues raised by opening the new branch office, was it improper for the attorney to represent residents of State Y in her office in State X?", "a": ["Yes, the clients are coming to the attorney in her office in the state where she has a license to practice law.", "Yes, the Supreme Court has held that the privileges and immunities clause should permit lawyers to practice across state lines.", "No, the attorney is unlicensed in State Y, so she should not advise clients on matters that come under the laws of State Y.", "No, because as a policy matter, she is taking clients away from licensed lawyers in State Y."], "e": "A lawyer licensed in State X may represent clients who come to her office in State X, including residents of other states, and may advise on State Y law as part of that practice. Where the lawyer practices is what matters, not where clients live (Restatement § 3). Competence may require researching State Y law, but that's not UPL. The privileges-and-immunities theory isn't the basis, and protecting local lawyers isn't a legitimate concern. Book cite: Restatement § 3. [W1:21; S1:29]", "r": "Stevenson, 500 MPRE Questions (2019) Q361 · Rule 5.5 Unauthorized Practice & Multijurisdictional Practice"},
{"t": "reg", "q": "An experienced attorney has an office in State X, and she is duly licensed to practice law in that state. The attorney’s office is in a city on the border of State Y, and the attorney does not have a license to practice there. Over the years, some of the attorney’s clients have in fact been residents of State Y, and their legal issues sometimes involve research into the laws or judicial precedents of State Y. For the convenience of these clients, and to attract business of other clients there, the attorney rents a small office space, hires nonlawyer clerical staff, and otherwise prepares premises for the general practice of law at a branch-office location in State Y. Is it permissible for the attorney to open the branch office in State Y?", "a": ["It is impermissible because she does not have a license to practice in State Y and she has established an office or other systematic and continuous presence in this jurisdiction for the practice of law.", "It is permissible because she is doing so primarily for the convenience of clients whom she is already representing in the state where she has a law license.", "It is permissible because the Supreme Court has held that the privileges and immunities clause should permit lawyers to practice across state lines.", "It is impermissible because the new office does not have any lawyers on staff there, and she will not be able to provide competent, diligent representation in two places at the same time."], "e": "A lawyer not admitted in a state may not establish an office or other systematic and continuous presence there for the practice of law (5.5(b)(1)). Renting space and staffing a branch office in State Y for general practice does exactly that, whatever the convenience to existing clients. Her license in State X doesn't extend across the border, and no Supreme Court ruling permits it. The lack of resident lawyers isn't the core problem; the lack of a license is. Book cite: Restatement § 3. [W1:21; S1:29–30, 86–87]", "r": "Stevenson, 500 MPRE Questions (2019) Q362 · Rule 5.5 Unauthorized Practice & Multijurisdictional Practice"},
{"t": "reg", "q": "An experienced attorney has an office in State X, and she is duly licensed to practice law in that state. The attorney’s office is in a city on the border of State Y, and the attorney does not have a license to practice there. The attorney represents a regulated utility, which operates a power plant in State X near the border with State Y. The attorney’s representation of the utility mostly pertains to environmental issues, obtaining necessary permits, and complying with federal and state regulations of utilities. Occasionally, the utility also has issues relating to compliance with the environmental and permitting laws of State Y because of those same activities. Is it permissible for the attorney to travel to State Y to deal with governmental officials regarding regulatory issues arising out of the utility's activities?", "a": ["It is permissible because the legal issues arise out of or relate closely to the attorney’s practice in a jurisdiction in which the lawyer is admitted to practice.", "It is impermissible because the attorney is practicing law without a license in State Y.", "It is impermissible because if the attorney represents one client in some matters in State Y, she must be available to represent any other within State Y who have the same legal issues there.", "It is permissible because the Supreme Court has held that the privileges and immunities clause should permit lawyers to practice across state lines."], "e": "5.5(c)(4) allows temporary services in another state that arise out of or are reasonably related to the lawyer's practice where she's admitted. Occasional trips to State Y to deal with regulators about the utility's cross-border environmental issues, from the same activities she handles in State X, fit within that. This is temporary, related practice, not a systematic presence. There's no duty to serve other State Y clients, and privileges and immunities isn't the basis. Book cite: Restatement § 3. [S1:39; W1:21] (5.5(c) isn't discussed in the readings)", "r": "Stevenson, 500 MPRE Questions (2019) Q363 · Rule 5.5 Unauthorized Practice & Multijurisdictional Practice"},
{"t": "reg", "q": "An experienced attorney has an office in State X, and she is duly licensed to practice law in that state. The attorney’s office is in a city on the border of State Y, and the attorney does not have a license to practice there. The attorney represents a regulated utility, which operates a power plant in State X near the border with State Y. The attorney’s original work for the utility in State X related to rate-setting proceedings before a utility commission in that state, and before the Federal Energy Regulatory Commission (FERC). New legislative changes now permit the utility to make retail sales of electricity to consumers in multiple states. Given the attorney’s extensive knowledge of the utility's rate-related financial information, the utility asks the attorney to handle its new rate applications in several other states, but in none of these states does the attorney have a license to practice law. The attorney’s work in those matters would frequently require her presence for legal activities in each of the other states until the new rate work is complete. Is it permissible for the attorney to conduct those activities in the other states on behalf of the utility?", "a": ["It is permissible because the legal issues arise out of or relate to the attorney’s practice in a jurisdiction in which the lawyer has a license to practice.", "It is impermissible because if the attorney represents one client in some matters in State Y, she must be available to represent any other within State Y who have the same legal issues there.", "It is impermissible because the attorney is practicing law without a license in State Y.", "It is permissible because the Supreme Court has held that the privileges and immunities clause should permit lawyers to practice across state lines."], "e": "Under 5.5(c)(4), a lawyer may provide temporary services in another jurisdiction that arise out of or are reasonably related to her practice where she's admitted. On the book's view, the utility's rate cases in other states grow directly out of her rate work for the same client at home and in FERC proceedings, and the work ends when the rate matters are complete. Where a tribunal is involved, she may also need pro hac vice admission (5.5(c)(2)). There's no duty to serve others. Book cite: Restatement § 3. [S1:39; W1:21, 46 n.21] (5.5(c) isn't discussed in the readings)", "r": "Stevenson, 500 MPRE Questions (2019) Q364 · Rule 5.5 Unauthorized Practice & Multijurisdictional Practice"},
{"t": "reg", "q": "An attorney agreed to write a recommendation letter for admission to the bar on behalf of the law student who had worked for him part-time throughout law school. The student had consistently behaved appropriately during her employment, in compliance with the ethical rules for lawyers and law firms. On one occasion, the student intern had confided in the attorney that she had faced academic discipline for plagiarism on a law school seminar paper, and that she was very ashamed of herself about the incident and had accepted a failing grade in the class. She took an overload of courses the following semester to make up for the lost credits from the course she failed. The attorney did not mention this incident at all in his “character and fitness” recommendation to the state bar, because he felt it was out of character and did not represent the way the student normally behaved at the workplace. He also assumed the student would report it herself or that the bar would inquire about the failing grade on her law school transcript. The bar admissions board eventually learned about the incident only from the law school administration, which turned over the student’s disciplinary records. Could the attorney who wrote the favorable recommendation be subject to discipline for filing to mention or address the incident?", "a": ["Yes, because he did not disclose a fact necessary to correct a misapprehension known by the person to have arisen in the matter in connection with an admission to the state bar.", "Yes, because the attorney had a conflict of interest in the situation, as it would be in his best interest for his own employee to gain admission to the bar.", "No, because the attorney had no duty to report the incident, given that the bar could easily discover it from another source (as it did), and because the attorney was reasonable in believing the incident did not reflect the true character of the applicant.", "No, because the student intern had told him about the incident in confidence, and it did not relate to her work at the firm, so the attorney had a duty of confidentiality under"], "e": "8.1 applies to any lawyer 'in connection with a bar admission application,' including one who writes a recommendation for an applicant. Such a lawyer must not knowingly fail to disclose a fact needed to correct a misapprehension he knows has arisen. A glowing character letter that leaves out plagiarism he knew about leaves the board with a false picture of the applicant's honesty. The student wasn't his client, so 1.6 doesn't excuse silence, and assuming the bar will find out elsewhere doesn't satisfy his duty. The readings note that candor, not the underlying incident, is what matters most. Book cite: Rule 1.6. [W1:26, 46 n.15; S1:88–90]", "r": "Stevenson, 500 MPRE Questions (2019) Q388 · Rule 8.1 Bar Admission & Disciplinary Matters"},
{"t": "reg", "q": "An attorney faced a grievance over a client complaint regarding his neglect of the client’s matter. The attorney knew that he had never formally agreed to represent the client, but instead had met with the client once, determined that he had a conflict of interest, and he had refused to represent the potential client by both oral and written communication. The client failed to hire another lawyer, and mistakenly (unreasonably) believed that the attorney she had met with was, in fact, representing her. Because he knew the case was without merit, he did not respond to the state bar when the disciplinary authorities requested a formal response from him. In the end, the client withdrew her complaint and the disciplinary authorities dismissed the grievance as frivolous. The board then commenced disciplinary proceedings against the attorney for failing to respond to its requests in the case it had dismissed. Was the attorney’s refusal to respond permissible in this case?", "a": ["No, because in connection with a disciplinary matter, a lawyer must not knowingly fail to respond to a lawful demand for information from an admissions or disciplinary authority.", "Yes, because he knew the case was without merit as he had never agreed to represent the complainant, and the board’s determination vindicated him in this regard.", "Yes, because it was improper for the board to commence new proceedings that it based on prior proceedings that it had dismissed for being without merit.", "No, every lawyer has the right to refuse to answer, according to the Fifth Amendment."], "e": "8.1(b) says a lawyer must not knowingly fail to respond to a lawful demand for information from a disciplinary authority. Ignoring the bar because the grievance seems frivolous is itself a violation, even if the grievance is later dismissed. The right course was to respond and explain why the complaint lacked merit. The Fifth Amendment can justify declining to answer specific questions only if asserted openly, and it doesn't permit simply ignoring the bar. Book cite: Rule 8.1(b). [W1:28, 46 n.15; outline I-B]", "r": "Stevenson, 500 MPRE Questions (2019) Q389 · Rule 8.1 Bar Admission & Disciplinary Matters"},
{"t": "reg", "q": "An attorney agreed to represent an applicant to the state bar – a recent law school graduate – in her hearing before the state bar admissions board, which had tentatively denied her application for making false statements on her bar application. The board formally requests the applicant and her attorney make full disclosures about the events in question to help resolve the matter. The client (bar applicant) explains the entire situation to her attorney, including some self-incriminatory information – it turned out that the applicant’s misbehavior had been much more serious than the board was aware. The attorney did not disclose this latest information, which would have made it much clearer to the board that the applicant lacked the character and fitness to practice law. Could the attorney be subject to discipline for this action?", "a": ["No, because a lawyer representing an applicant for admission to the bar, or a subject of a disciplinary action, comes under the rules applicable to the client-lawyer relationship, including the duty of confidentiality.", "Yes, because a lawyer in connection with a bar admission application or in connection with a disciplinary matter, shall not fail to disclose a fact necessary to correct a misapprehension known by the person to have arisen in the matter, or knowingly fail to respond to a lawful demand for information from an admissions or disciplinary authority.", "Yes, because the lawyer knows that the applicant indeed lacks the requisite integrity to be a lawyer.", "No, because the state bar cannot ask other attorneys to disclose unfavorable information about third party applicants."], "e": "The comments to 8.1 say a lawyer representing a bar applicant or a lawyer in a disciplinary matter is governed by the client-lawyer rules, including 1.6. What the applicant told her lawyer in confidence is protected, and 8.1 itself says it doesn't require disclosing 1.6 information. So the lawyer may stay silent about it, though he may not make false statements to the board. The 'must correct a misapprehension' answer describes the applicant's own duty, not her lawyer's. Book cite: Rule 8.1 cmt. [3]. [W1:46 n.15; W3:39–40 n.6]", "r": "Stevenson, 500 MPRE Questions (2019) Q390 · Rule 8.1 Bar Admission & Disciplinary Matters"},
{"t": "reg", "q": "An attorney faced a disciplinary action over accusations that she had neglected a client matter and had not communicated enough with the client. The state disciplinary authority requested a written account of her version of what happened, and it asked her ten or twelve probing questions during the hearing. At the conclusion of the hearing, the disciplinary tribunal decided that the client complaint was without merit and cleared the attorney of all charges in that regard. At the same time, it also concluded that the attorney had answered one question during the hearing untruthfully, and that she had made a minor misrepresentation regarding dates in her written statement to the board. The tribunal therefore filed a separate grievance against the attorney for these misrepresentations. Could the attorney be subject to discipline for incidental misrepresentations to the grievance committee if the same committee had decided that the underlying case had no merit and issued a dismissal?", "a": ["Yes, because it is a separate professional offense for a lawyer to knowingly make a misrepresentation or omission in connection with a disciplinary investigation of the lawyer's own conduct.", "Yes, because her the dismissal of the original complaint may have been in reliance upon some of her false statements, making it seem that the original complaint was potentially valid as well.", "No, because the board lacks jurisdiction to commence disciplinary proceedings when there is not a client complaint pending.", "No, because the misstatements were part of a proceeding that has ended in a complete dismissal."], "e": "Knowingly making a false statement of material fact in connection with a disciplinary matter is a separate violation of 8.1(a), whether or not the underlying complaint had merit. The comments say it's a separate professional offense to make a knowing misrepresentation in an investigation of the lawyer's own conduct. Dismissal of the client's grievance doesn't erase lies told during the investigation, and the board needs no pending client complaint to act. Book cite: Rule 8.1 cmt. [1]. [W1:28, 46 n.15; S1:88–90]", "r": "Stevenson, 500 MPRE Questions (2019) Q391 · Rule 8.1 Bar Admission & Disciplinary Matters"},
{"t": "reg", "q": "An attorney faced disciplinary action over a client grievance. The disciplinary tribunal asked the attorney several probing questions about her handling of client funds. The attorney had, in fact, used some client funds to pay off a gambling debt, so she was less worried about a temporary suspension of her law license than about potential criminal charges for embezzlement. The attorney, therefore, invokes her Fifth Amendment privilege against self- incrimination and refuses to answer the questions. The disciplinary tribunal then determines that it lacks substantial evidence that the attorney mishandled client funds, but it commences disciplinary proceedings over the attorney’s refusal to answer some of its questions. Could the attorney be subject to discipline for refusing to answer the questions in this scenario?", "a": ["No, because the rules requiring attorney candor to disciplinary authorities are subject to the provisions of the Fifth Amendment of the United States Constitution and corresponding provisions of state constitutions.", "Yes, because a lawyer must not knowingly fail to respond to a lawful demand for information from an admissions or disciplinary authority.", "Yes, because the board found no evidence that the attorney had mishandled client funds, and the attorney had an affirmative duty to clarify any misunderstanding on the part of the admissions or disciplinary authority of which the person involved becomes aware.", "No, because the committee did not read the attorney her Miranda rights, according to this fact scenario."], "e": "8.1's duties to respond to disciplinary authorities are subject to the Fifth Amendment and comparable state protections (8.1 cmt [2]). A lawyer facing possible embezzlement charges who openly invokes the privilege against self-incrimination can't be disciplined for refusing to answer. The readings note that lawyers in discipline keep that right (Spevack v. Klein). Miranda warnings aren't the issue, and there's no duty to clear up the board's lack of evidence. Book cite: Rule 8.1 cmt. [2]. [W1:28]", "r": "Stevenson, 500 MPRE Questions (2019) Q392 · Rule 8.1 Bar Admission & Disciplinary Matters"},
{"t": "reg", "q": "An attorney faced disciplinary action over a client grievance. The disciplinary tribunal asked the attorney several probing questions about her handling of client funds. The attorney had, in fact, used some client funds to pay off a gambling debt, so she felt less worried about a temporary suspension of her law license than about potential criminal charges for embezzlement. The attorney, therefore, simply refuses to answer the questions, without offering any explanation. The disciplinary tribunal then determines that it lacks substantial evidence that the attorney mishandled client funds, but it commences disciplinary proceedings over the attorney’s refusal to answer some of its questions. The attorney now claims she was merely exercising her Fifth Amendment right to refrain from self-incriminating statements. Could the attorney be subject to discipline for refusing to answer the questions in this scenario?", "a": ["Yes, a person relying on such constitution protections in response to a question must do so openly and not use the right of nondisclosure as a justification afterward for failure to comply with the rules requiring disclosures to the disciplinary authorities.", "Yes, because a lawyer can never refuse to respond to a lawful demand for information from an admissions or disciplinary authority.", "No, because the rules requiring attorney candor to disciplinary authorities are subject to the provisions of the Fifth Amendment of the United States Constitution and corresponding provisions of state constitutions.", "No, because the committee did not read the attorney her Miranda rights, according to this fact scenario."], "e": "8.1 is subject to the Fifth Amendment, but the comments say a lawyer relying on it must do so openly. She can't simply refuse to answer and claim the privilege afterward to justify noncompliance. Silent refusal without asserting any privilege is a knowing failure to respond to a lawful demand (8.1(b)). That doesn't mean a lawyer can never decline to answer: open invocation would have protected her. Miranda isn't the issue. Book cite: Rule 8.1 cmt. [2]. [W1:28, 46 n.15]", "r": "Stevenson, 500 MPRE Questions (2019) Q393 · Rule 8.1 Bar Admission & Disciplinary Matters"},
