{"t": "fid", "q": "An attorney was preparing a will for one of her wealthy elderly clients. The client had no surviving family members – her spouse had passed away years before, as had her siblings, and she had no children. The client asked the attorney for suggestions about potential beneficiaries of the estate, besides her favorite charities, and she offered to leave the attorney some items. The attorney replied, “Well, I’ve represented you on various matters over the years, and I have always looked out for your best interests, so I would not object if you included me in the will. I’ve always admired your collection of antique furniture and books.” The client was delighted by the idea and instructed the attorney to include a provision in the will bequeathing all the antique furniture and books in her large home to the attorney. The attorney prepared the will as instructed and the client executed it. Was the attorney’s conduct proper?", "a": ["No, because the attorney should not have prepared the will if the document made a significant bequest to the attorney.", "Yes, because the client asked her for suggestions about potential heirs and was excited about leaving something in the will to the attorney.", "Yes, because the attorney was not depriving any other potential heirs of the specific items she requested, as the client had no surviving relatives.", "No, because the way the attorney suggested the bequest was manipulative and the elderly client was vulnerable to coercion or exploitation."], "e": "1.8(c) bars a lawyer from soliciting a substantial gift from a client and from preparing an instrument that gives the lawyer a substantial gift, unless the lawyer is related to the client. A bequest of all the antique furniture and books in a large home is substantial, and the client isn't a relative, so the attorney must not draft that will; another lawyer must. The client's enthusiasm and lack of heirs don't matter. The manipulative suggestion is a problem too, but drafting the instrument is the clearest violation. Book cite: Rule 1.8(c). [W4:5; outline IV-C]", "r": "Stevenson, 500 MPRE Questions (2019) Q41 · Rule 1.8 Conflicts - Specific Rules"},
{"t": "fid", "q": "A certain attorney, a partner at a law firm, prepares a will for Sister. In the will, Sister directs the attorney to receive a substantial part of her estate. Then the attorney also recommends Sister appoint the attorney as the executor of the will because of his knowledge in this field. The attorney explains to Sister the role of the executor and the pay the executor of the estate will receive and discussed alternative executor choices with her. In addition, the attorney recommends Sister seek independent legal counsel regarding the issue of the executor. Sister does so, and then she asks the attorney to list him as executor in the will. Is the attorney subject to discipline?", "a": ["No, attorneys may permissibly include gifts to themselves in a will prepared by an attorney for a person related to the attorney, even if the gift is substantial.", "Yes, attorneys cannot include substantial gifts to themselves in legal instruments such as wills prepared by the attorney for the client.", "Yes, attorneys cannot recommend that a client appoint the attorney as the executor unless the client obtains the advice of independent legal counsel and gives informed consent confirmed in writing.", "No, an attorney may recommend the client appoint the attorney as executor assuming the client receives advice from independent legal counsel regarding the appointment of the attorney as executor prior to signing the will."], "e": "1.8(c)'s ban on drafting an instrument that gives the lawyer a substantial gift doesn't apply when the client is related to the lawyer, and a sister is related. So the bequest is permitted. Nominating himself as executor isn't barred by 1.8(c) either. It's a 1.7 personal-interest question, and he disclosed the role, its pay, and the alternatives, and his sister consulted independent counsel. No rule requires consent confirmed in writing through independent counsel for an executor nomination. Book cite: Rule 1.8(c). [W4:5] (MR 1.8 cmts [6]–[8])", "r": "Stevenson, 500 MPRE Questions (2019) Q42 · Rule 1.8 Conflicts - Specific Rules"},
{"t": "fid", "q": "A certain attorney obtained a successful outcome in a client’s matter, and the client was grateful. The client sent the attorney a gift basket that year as a holiday gift, containing high-quality fresh fruit, sample-size jars of gourmet fruit preserves, and a few other delicacies. The gift basket cost the client $50. Is it proper for the attorney to accept this gift, or must the attorney refuse it?", "a": ["Yes, a lawyer may accept a simple gift such as a present given at a holiday or as a token of appreciation.", "Yes, because assuming a lawyer does not solicit the gift, there is no restriction on lawyers accepting unsolicited gifts from clients.", "No, a lawyer shall not accept any substantial gift from a client, unless the lawyer or other recipient of the gift is a relative of the client.", "No, because the lawyer’s entire compensation for obtaining the favorable outcome should have been in the original retainer agreement and its schedule of fees, so any additional compensation or transfers from a client to a lawyer constitute an unwritten modification of the retainer agreement."], "e": "A lawyer may accept a simple gift from a client, such as a holiday present or a token of appreciation. 1.8(c) bars only soliciting substantial gifts and drafting instruments that give them. A $50 fruit basket is a modest token, so accepting it is fine. The answer that any unsolicited gift may be accepted goes too far: the comments note that a substantial gift may be voidable by the client for undue influence. Book cite: Rule 1.8(c) cmt. [6]. [W4:5]", "r": "Stevenson, 500 MPRE Questions (2019) Q43 · Rule 1.8 Conflicts - Specific Rules"},
{"t": "fid", "q": "A client hires an attorney to represent her in business litigation. Another lawyer in the firm, unknown to the attorney, approaches the client with a proposal for an unrelated business transaction, the sale of a parcel of real estate adjacent to the lawyer’s own land. The client agrees to sell the other lawyer in the firm the parcel of real estate for a reasonable price. The lawyer is not involved at all in the representation of the client and works exclusively in the estate- planning department of the firm, rather than in litigation. Must the lawyer nevertheless advise the client in writing of the desirability of seeking the advice of independent legal counsel, and obtain written informed consent from the client before proceeding with the purchase?", "a": ["Yes, because a prohibition on conduct by an individual lawyer under the conflicts of interest rules would automatically apply to all lawyers associated in a firm with the personally prohibited lawyer, even if the first lawyer is not personally involved in the representation of the client.", "Yes, because the fact that the lawyer owns the adjacent real estate to the client’s parcel of land means that he has a special conflict of interest with the client that would not necessarily apply to the other lawyers in the same firm.", "No, because the lawyer who is buying the real estate from the client is not involved in the representation of the client, and the Rules of Profession Conduct would not impute the attorney’s potential conflicts of interest to the other lawyers in the firm.", "No, because the lawyer is willing to pay a fair and reasonable price for the parcel of land, so there is no risk that the transaction will be to the disadvantage of the client."], "e": "Under 1.8(k), a prohibition in 1.8(a) through (i) that applies to one lawyer in a firm applies to every lawyer in it. The firm represents the client, so any firm lawyer's business deal with her, including an estate planner buying her land, must meet 1.8(a): fair terms in writing she can understand, written advice to seek independent counsel, and signed informed consent. Not working on her case doesn't exempt him, and a fair price alone isn't enough. Book cite: Rule 1.8(k). [W4:5] (1.8(k) imputation isn't discussed in the readings)", "r": "Stevenson, 500 MPRE Questions (2019) Q44 · Rule 1.8 Conflicts - Specific Rules"},
{"t": "fid", "q": "An attorney had his own firm specializing in small business transactions. The clients were small business owners who did not have in- house counsel or other legal representation. His representation agreements with clients included all necessary disclosures, fee schedules and rates, and a clause stipulating that all potential legal malpractice claims would go through binding arbitration. The attorney would explain this term fully to each client, but he would decline representation for any potential client who would not agree to binding arbitration. The attorney did this in hopes of limiting his future malpractice liability to clients. Was it permissible for the attorney to do this?", "a": ["Yes, a lawyer may make an agreement with the client to arbitrate legal malpractice claims, provided such agreements are enforceable and the lawyer fully informs the client of the scope and effect of the agreement.", "Yes, because the clients gave informed consent, confirmed in writing.", "No, a lawyer may not make an agreement prospectively limiting the lawyer's liability to a client for malpractice unless the client has independent legal representation in making the agreement.", "No, a lawyer cannot make a binding arbitration agreement with a client if the lawyer’s purpose in doing so is to limit the lawyer’s liability for future malpractice claims by the client."], "e": "1.8(h)(1) bars agreements prospectively limiting malpractice liability unless the client is independently represented, but the comments say it doesn't stop a lawyer and client from agreeing to arbitrate malpractice claims. That's allowed if the agreement is enforceable and the client is fully informed of its scope and effect. Arbitration changes the forum, not the liability, so independent counsel isn't required, and making it a condition of the engagement is permissible. Book cite: Rule 1.8(h) cmt. [14]. [W2:55; S2:90]", "r": "Stevenson, 500 MPRE Questions (2019) Q45 · Rule 1.8 Conflicts - Specific Rules"},
{"t": "fid", "q": "An attorney regularly represented clients in transactional matters. While she was representing a certain client in negotiating and drafting a contract, the client asked the attorney to represent her in a lawsuit as well. The attorney felt nervous because she rarely did litigation work, so she asked the client to sign a waiver of potential malpractice claims that could arise from the litigation work. She orally advised the client to talk to another lawyer about the waiver before signing it, but the client felt that she already had legal representation, as this attorney was handling her transactional matters. The client readily agreed to the waiver. The attorney competently handled the litigation matter, and the case settled before trial with a favorable result for the client. Could the attorney be subject to discipline for obtaining a malpractice waiver from the client?", "a": ["Yes, the attorney is making an agreement prospectively limiting the lawyer's liability to a client for malpractice, and the client does not have independent representation in making the agreement.", "Yes, because she did not advise the client in writing about the desirability of seeking independent legal counsel about the waiver, but merely gave an oral recommendation.", "No, the client already had legal representation from the attorney on another matter, so is was permissible for the attorney to make an agreement limiting future malpractice claims.", "No, the waiver was moot because the attorney did not commit malpractice and the client obtained a favorable result."], "e": "1.8(h)(1) forbids any agreement prospectively limiting a lawyer's malpractice liability unless the client is independently represented in making it. Advising the client to see another lawyer, orally or even in writing, isn't enough, and the attorney can't serve as the client's independent counsel on a waiver that protects herself. A good result later doesn't cure the violation, which is complete when the agreement is made. Book cite: Rule 1.8(h). [W2:55; S2:90, 130–131]", "r": "Stevenson, 500 MPRE Questions (2019) Q46 · Rule 1.8 Conflicts - Specific Rules"},
{"t": "fid", "q": "An attorney worked in the legal department of Conglomerate Corporation for a few years, then left there to start his own firm. His experience at Conglomerate proved useful, as he regularly represented some of Conglomerate’s newer industry rivals in their transactional and pre-litigation work – small startup businesses that did not have in-house counsel. Whenever a new client needed legal representation in a matter that could potentially be adverse to the legal interests of one of his other clients, the attorney would obtain informed consent, confirmed in writing to the potential conflict of interest. In such cases, the attorney would also ask new clients to sign a waiver of liability for all potential legal malpractice by the attorney. Attached to the waiver was a cover sheet explaining what the waiver entailed, the downsides for the client in signing a waiver, and recommending the client seek the advice of independent legal counsel in connection therewith. As with the consent to conflicts of interest, the clients normally gave informed consent, confirmed in writing, to the waiver of malpractice claims against the attorney. Could the attorney be subject to discipline, based on these facts?", "a": ["Yes, because the attorney is making an agreement prospectively limiting the lawyer's liability to a client for malpractice, and the client does not have independent representation in making the agreement.", "Yes, because the attorney is representing industry rivals or competitors of his former client and employer, Conglomerate Corporation, without obtaining Conglomerate’s consent.", "No, the clients gave informed consent, confirmed in writing, to both the conflict of interest and the waiver of malpractice claims.", "No, the attorney advised the clients in writing of the desirability of seeking the advice of independent legal counsel in connection therewith."], "e": "A prospective malpractice waiver is permitted under 1.8(h)(1) only if the client is actually represented by independent counsel in making it. A cover sheet recommending counsel and the client's informed consent, confirmed in writing, are no substitute. The written-advice approach applies to settling existing malpractice claims (1.8(h)(2)), not to advance waivers. Representing Conglomerate's rivals raises no former-client problem on these facts. Book cite: Rule 1.8(h). [W2:55; S2:90, 130–131]", "r": "Stevenson, 500 MPRE Questions (2019) Q47 · Rule 1.8 Conflicts - Specific Rules"},
{"t": "fid", "q": "A plaintiff who had prevailed at trial needed representation for the appeal, because the defendant in the case appealed the verdict. Plaintiff’s counsel did only trial work, not appellate work, and referred the client to an appellate attorney nearby. The trial lawyer even offered to accompany the plaintiff to the initial consultation with the appellate attorney to help facilitate the transition and to safeguard his client’s interests in retaining new counsel. Instead, the plaintiff fired the trial lawyer, terminating the representation, and then went alone to the consultation with the appellate attorney. The appellate attorney asked the plaintiff to sign an agreement waiving potential malpractice claims against the appellate attorney, because the appellate attorney did not want to be responsible for the trial lawyer’s mistakes. The appellate attorney did not inform the plaintiff fully about the risks or downsides of waiving malpractice future malpractice claims, nor did he advise the plaintiff of the desirability of seeking the advice of independent legal counsel in connection therewith. Could the attorney be subject to discipline, based on these facts?", "a": ["Yes, the attorney made an agreement with an otherwise unrepresented client that prospectively limited his liability for malpractice.", "Yes, because the plaintiff already had independent representation by counsel, so it was improper for the attorney to attempt to shift all potential liability onto another lawyer.", "No, the plaintiff already had independent legal counsel in connection to the malpractice waiver.", "No, when a lawyer brings another attorney into the matter to assist with an appeal, the lawyers and the client must agree in writing about how they will allocate responsibility and legal fees for the representation."], "e": "Once the plaintiff fired her trial lawyer, she had no lawyer when the appellate attorney asked her to waive future malpractice claims. That's exactly what 1.8(h)(1) forbids: an agreement prospectively limiting liability when the client isn't independently represented. He also didn't explain the waiver or recommend counsel. No rule requires a written allocation of responsibility when an appellate lawyer is brought in. Book cite: Rule 1.8(h). [W2:55; S2:90, 130–131]", "r": "Stevenson, 500 MPRE Questions (2019) Q48 · Rule 1.8 Conflicts - Specific Rules"},
{"t": "fid", "q": "A plaintiff who had prevailed at trial needed representation for the appeal, because the defendant in the case appealed the verdict. Plaintiff’s counsel did only trial work, not appellate work, and referred the client to an appellate attorney nearby. The trial lawyer even accompanied the plaintiff to the initial consultation with the appellate attorney to help facilitate the transition and to safeguard his client’s interests in retaining new counsel. The appellate attorney asked the plaintiff to sign an agreement waiving potential malpractice claims against the appellate attorney, because the plaintiff had not yet terminated the representation with her trial lawyer, and the appellate attorney did not want to be responsible for the trial lawyer’s mistakes. The appellate attorney did not inform the plaintiff fully about the risks or downsides of waiving malpractice future malpractice claims, nor did he advise the plaintiff of the desirability of seeking the advice of independent legal counsel in connection therewith. Could the attorney be subject to discipline, based on these facts?", "a": ["No, the plaintiff already had independent legal counsel in connection to the malpractice waiver.", "Yes, because the plaintiff already had independent representation by counsel, so it was improper for the attorney to attempt to shift all potential liability onto another lawyer.", "Yes, the attorney made an agreement prospectively limiting his liability to a client for malpractice.", "No, when a lawyer brings another attorney into the matter to assist with an appeal, the lawyers and the client must agree in writing about how they will allocate responsibility and legal fees for the representation."], "e": "1.8(h)(1) permits an advance limit on malpractice liability only if the client is independently represented in making it. Here the plaintiff's trial lawyer was still her counsel and came to the consultation to protect her, so she had independent representation, and the appellate attorney didn't violate the Rule even without making his own disclosures. The Rule targets the lack of independent counsel, not the waiver as such, though state law may still refuse to enforce the waiver. Book cite: Rule 1.8(h). [W2:55; S2:90]", "r": "Stevenson, 500 MPRE Questions (2019) Q49 · Rule 1.8 Conflicts - Specific Rules"},
{"t": "fid", "q": "An experienced attorney had his own solo law practice. The attorney agreed to provide representation to a certain client, which would entail researching and writing several legal opinions for the client pertaining to the client’s anticipated litigation, and the attorney’s usual hourly rate. The proposed research and writing would require a substantial amount of time, so their agreement stipulated that the attorney would bill the client every two months. The client paid the first bill and then stopped paying. After several months, the anticipated litigation began, and the client requested copies of all the remaining legal opinions that the attorney had agreed to write. The attorney had followed state laws to secure a lien on his work product for the client after the client stopped paying. Could the attorney be subject to discipline if he were to retain the documents that the client has not yet paid for?", "a": ["No, a lawyer may acquire and act upon a lien authorized by law to secure the lawyer's fee or expenses.", "Yes, the attorney has now acquired an impermissible proprietary interest in the cause of action or subject matter of the client’s litigation.", "Yes, the Model Rules forbid a lawyer to acquire a lien merely to secure the lawyer's fee or expenses.", "No, if a client refuses to pay the fees that a lawyer has already earned, the lawyer owes no ethical duties to the client, because the client has nullified the client-lawyer relationship."], "e": "1.8(i) bars acquiring a proprietary interest in a client's cause of action, but it expressly allows a lawyer to acquire and act on a lien authorized by law to secure fees or expenses. Because the attorney perfected a lien under state law on his work product, he may keep the unpaid opinions to the extent that law allows (1.16 cmt [9]). A lien isn't a proprietary interest in the litigation, and nonpayment never ends a lawyer's duties to the client. Book cite: Rule 1.8(i) cmt. [16]; Restatement § 43. [S5:9; S2:112]", "r": "Stevenson, 500 MPRE Questions (2019) Q50 · Rule 1.8 Conflicts - Specific Rules"},
{"t": "fid", "q": "Attorney Stevenson did not know anything about the construction industry, but he thought he knew how to draft contracts. Giant Equipment Corporation manufactures cranes, bulldozers, and large backhoes used for building construction. These machines are pricey. Twenty-seven months ago, the manufacturer hired Attorney Stevenson to help with drafting Purchase and Sale Contracts for the manufacturer to use for all these items of heavy equipment. Attorney Stevenson advised the company on what provisions to include and some of the exact wording they should use in the Purchase and Sale Agreements. Then the representation ended, and the company has not contacted an attorney since. Last week, Ashby Building Construction retained Attorney Stevenson to handle a dispute with a manufacturer of one of its construction cranes. It soon becomes apparent learns that the piece of equipment came from Giant Equipment Corporation, and that the procurement officer for Ashby consummated the purchase by signing one of the contacts on which Attorney Stevenson had advised Giant. Now Ashby wants to rescind the contract and return the machine for a full or partial refund, because it used the crane for a week before it broke down. Would Attorney Stevenson be subject to disqualification in a such a latter, if litigation ensued?", "a": ["Yes, Attorney Stevenson cannot seek to rescind on behalf of a new client a contract drafted on behalf of the former client.", "Yes, because the items are so expensive, and Ashby used the machine for only a week before it became unusable.", "No, because Ashby is not seeking any damages besides a refund in exchange for returning the faulty machine, and this merely puts the manufacturer back in the same place as if the sale had never occurred, so there is no potential harm to the manufacturer.", "No, because representation of the manufacturer ended a while ago, so there is no conflict of interest or direct adversity between current clients."], "e": "1.9(a) bars representing a new client against a former client in the same or a substantially related matter. The comments give this exact example: a lawyer who drafted a contract for one client can't later seek to rescind it for a new client. Stevenson advised Giant on the very purchase agreement Ashby now wants to rescind, so he would be disqualified. That Giant is a former client doesn't help, and a refund-only remedy is still materially adverse. Book cite: Rule 1.9 cmt. [1]. [S3:8–9; W4:8]", "r": "Stevenson, 500 MPRE Questions (2019) Q51 · Rule 1.9 Duties to Former Clients"},
{"t": "fid", "q": "Attorney Stevenson was willing to represent anyone, and rarely turned clients away. In fact, Attorney Stevenson would push the permissible limits under the conflicts of interest rules. At one point, Stevenson helped a construction company obtain the necessary permits from federal, state, and municipal agencies for constructing a new shopping center in an affluent suburban area. Obtaining the permits was not difficult – in fact, Attorney Stevenson found this kind of legal work boring. Before the construction was complete, another company acquired the property and the building project, and brought the construction to completion. Seventeen months after the building was open for tenants, one of the tenants missed to pay rent for his unit for three consecutive months, and the property manager started an eviction process. The tenant hired the same attorney to represent her in the eviction proceedings. The shopping center’s owner filed a motion to have the attorney disqualified due to the substantial relationship between his previous work in securing construction permits for the building and the present eviction action against the tenant. Should Attorney Stevenson’s previous work for the construction company disqualify him from representing tenant in the eviction proceedings?", "a": ["No, the matters are not related enough, because they do not involve the same transaction or legal dispute, and any confidential information learned while obtaining the construction permits prior would be unimportant for the nonpayment of rent by a tenant sometime later.", "Yes, because both matters involve the same commercial real estate property, so the matters have a substantial factual relationship, creating a presumption that Attorney Stevenson has confidential information that would be prejudicial to the opposing party in the new matter.", "Yes, because the lawyer now represents a party with directly adverse interests to his own former client.", "No, because another company bought the property before the construction was complete, so there is no conflict of interest for the attorney at this time."], "e": "Matters are substantially related under 1.9 when they involve the same transaction or legal dispute, or when there's a substantial risk that confidential information from the earlier work would materially advance the new client's position. Obtaining construction permits for a building has nothing to do with a tenant's unpaid rent years later, and nothing learned about the permits would matter in the eviction. Involving the same property isn't enough, and the change of ownership isn't the reason. Book cite: Rule 1.9 cmt. [3]. [S3:8–9; W4:8]", "r": "Stevenson, 500 MPRE Questions (2019) Q52 · Rule 1.9 Duties to Former Clients"},
{"t": "fid", "q": "Media Company holds the exclusive right to license and distribute certain pay-per-view sporting events, which commercial establishments must license to broadcast at their facilities. It sued a sports bar, for broadcasting one of its major sporting events without a license. The Three Brothers Law Firm were involved before the Media Company filed suit, and Three Brothers Firm had managed to broker a tentative settlement agreement between the parties. Afterward, however, the parties reneged on the agreement and litigation ensued. Three Brothers Firm now represents the defendant sports bar in the matter, and it is counsel of record. Media Company has filed a motion to disqualify Three Brothers from the case, but the attorneys there claim that Media Company was never their client. There was no representation agreement between Media Company and Three Brothers, and Media Company never paid Three Brothers any legal fees. On the other hand, Media Company was otherwise unrepresented during the pre-trial attempt at negotiating a settlement, and its managers asked attorneys from Three Brothers for advice about whether to agree to the settlement instead of going to trial, and initially followed their legal advice on several points. Should the court now disqualify Three Brothers Firm from the case entirely?", "a": ["Yes, because they obtained confidential information during the negotiations in the same matter, or a matter with significant overlap.", "Yes, but only if the lawyers at Three Brothers Firm advised the sports bar to abandon the tentative settlement agreement.", "No, because the attorneys are blood relatives working in the same firm.", "No, because the firm was serving as a third- party neutral in the previous settlement negotiations, so neither party had a client- lawyer relationship with the firm."], "e": "A lawyer-client relationship needs no contract or fee. It arises when a person seeks legal services and the lawyer gives them in circumstances where the person reasonably relies on the lawyer (Restatement § 14). Media Company's managers asked Three Brothers for advice on the settlement and followed it, so the firm owed them a lawyer's duties and received their confidences in this very dispute. Switching sides in the same matter is a 1.9(a) conflict that warrants disqualification. Nothing shows the firm acted as a neutral. Book cite: Rule 1.9. [W2:35–36; W4:7–8]", "r": "Stevenson, 500 MPRE Questions (2019) Q54 · Rule 1.9 Duties to Former Clients"},
{"t": "fid", "q": "A business person hired a certain attorney to represent her in a tax dispute with the government, in which the government accused her of hiding assets in overseas accounts and failing to report income from certain obscure investments. During this representation, the attorney learned extensive private financial information about client, but the representation ended at the resolution of the tax case. Several years later, after the termination had ended, the husband of the client filed for divorce. The attorney was the only lawyer the husband knew, so he retained the attorney to represent him in the divorce against the client. Her new lawyer moves to have the attorney disqualified from representing the husband, but the attorney claims that the matters did not relate to each other enough to merit disqualification. Is the attorney correct?", "a": ["No, matters are \"substantially related\" if there is a substantial risk that confidential information from the prior representation would materially advance the client's position in the subsequent matter, such as personal financial information.", "Yes, because resolving disputes with a government entity involves numerous procedural protections and administrative burdens of proof that are inapplicable in divorce proceedings in Family Court.", "Yes, because the attorney’s representation of Businesswoman terminated at the resolution of the tax matter, so there is no potential for betraying a current client by representing Businesswoman’s husband.", "No, because Businesswoman’s troubles with the government over unpaid taxes are unlikely to be what led to the divorce from her husband, and the stress that the tax case put on the marriage is likely to be a major issue in the divorce proceeding."], "e": "Matters are substantially related under 1.9 if there's a substantial risk that confidential information from the earlier representation would materially advance the new client's position. The comments' own example: a lawyer who learned extensive private financial information about a businessperson can't later represent that person's spouse in a divorce. The attorney learned about the wife's assets and finances in the tax case, which would help the husband in dividing property. That the tax matter has ended, and involved different procedures, doesn't matter. Book cite: Rule 1.9 cmt. [3]. [S3:8–9; W3:4]", "r": "Stevenson, 500 MPRE Questions (2019) Q55 · Rule 1.9 Duties to Former Clients"},
{"t": "comp", "q": "A jury convicted a defendant of murder, and they sentenced him to death. His lawyer at trial was unimpressive, and there were potential points to raise in an ineffective assistance of counsel appeal. For his appeal, the defendant used a different attorney from the same firm as his trial lawyer - one of the lawyers at the firm handled trials, and the other appeals. Can the appellate attorney from the same small firm as the trial lawyer handle this appeal?", "a": ["No, because under the legal standard for ineffective assistance of counsel, the appeal would potentially require the attorney to disparage the representation of his own colleague as being unreasonably poor.", "Yes, if the client consents to the potential conflict of interest.", "Yes, because there is no conflict of interest if the appellate attorney’s own conduct is not in question.", "No, because a firm that loses a death penalty case at trial is not competent to handle the appeal, which is a matter of life and death for the client."], "e": "An appeal claiming ineffective assistance requires arguing that a colleague's trial work fell below an objective standard of reasonableness. The firm has a reputational and liability stake in that colleague's work, so the appellate lawyer faces a significant risk of pulling punches (1.7(a)(2)), and the conflict is imputed throughout the firm (1.10(a)). The readings note that an ineffectiveness claim can turn trial counsel into an ally of the prosecution. Losing at trial doesn't make the firm incompetent. Book cite: Cannon v. Mullin (10th Cir. 2004). [W2:18; S3:14]", "r": "Stevenson, 500 MPRE Questions (2019) Q58 · Rule 1.10 Imputation of Conflicts"},
{"t": "rel", "q": "A potential client sought representation from an attorney in a legal dispute over the inheritance rights in an estate matter. The attorney was indecisive, because the estate was extremely complicated, so he met with the client several times over the next few months, trying to understand the intricacies of the will, the trusts involved, and the rival heirs. The potential client provided extensive confidential information about the estate to the attorney in meetings, phone calls, and emails. Eventually, however, the attorney declined the representation. During this time, the attorney had been in negotiations with another lawyer about forming a new law firm together. The other lawyer, unfortunately, was representing the rival heir, that is, the opposing party in the same estate matter. When the attorney and the other lawyer formed their new firm, the heir who had been the potential client then sought to have the attorney’s new firm disqualified from the estate matter, arguing for imputation of the attorney’s knowledge of confidential information to the other lawyer, who was the heir’s opposing counsel in the case. The other lawyer, who was now partners with the first attorney, argued that no client-lawyer relationship had existed between the heir and the attorney, because the attorney had declined the representation at the end. The heir who had been the prospective client insisted that the attorney had received confidential information from her, and that he had disclosed it to the other lawyer, who represented the rival heir in the matter. As a factual matter, the judge ruled that the prospective client-heir had introduced substantial evidence that she had provided extensive confidential information to the attorney in the process of seeking representation from him; conversely, the judge was surprised that the attorney had almost no evidence to show that he had not disclosed any confidential information to his new partner. How should the court rule on the motion to disqualify both lawyers?", "a": ["The court should grant the motion, because lawyers have some ongoing duties of confidentiality toward prospective clients, even after declining the representation, and the other lawyer has a conflict of interest by imputation.", "The court should deny the motion, if no client-lawyer relationship formed between the attorney and the heir who is now requesting the disqualification.", "The court should deny the motion, if the attorney who had the confidential information is not participating at all in the estate matter.", "The court should grant the motion, because the formation of a new firm or partnership between lawyers when a legal dispute is already pending creates an irrebuttable presumption that the lawyers disclosed confidential information to each other."], "e": "A lawyer who received significantly harmful information from a prospective client may not represent the adverse party in the same matter (1.18(c)), even though no relationship formed. That bar is imputed to his firm unless both affected parties give written consent or he is timely screened and notice is given (1.18(d)). He joined the rival heir's lawyer during the dispute, with no screen and no proof he kept her information to himself, so disqualification fits. The 'never a client' argument ignores 1.18. Book cite: In re Whitcomb, 575 B.R. 169 (S.D. Tex. 2017). [W3:4–5; S3:10–12; W2:41]", "r": "Stevenson, 500 MPRE Questions (2019) Q59 · Rule 1.10 Imputation of Conflicts"},
{"t": "rel", "q": "A prospective client met with an attorney at Boutique Firm for an initial consultation about a personal injury lawsuit over injuries the prospective client had sustained. The attorney declined the representation because he thought the client’s case was unwinnable and would therefore generate no fees. During the consultation, the attorney asked some probing questions about the incident, and the client admitted facts indicating an unreasonable assumption of foreseeable risks beforehand, as well as the client’s own intoxication at the time, which in the case would constitute contributory negligence. Furthermore, the client had failed to take obvious measures afterward to mitigate the damages. The attorney was certain that all these unfavorable facts would come out during discovery, and the client’s claim would become laughable at trial. Two months later, another client came in for a consultation with another lawyer at Boutique Firm. This prospective client had received service of process in a new personal injury lawsuit, and he was the named defendant. The plaintiff in the lawsuit was the same individual who had met with the first attorney for a consultation a few weeks before. Boutique firm agreed to take the case and represent the defendant in the litigation. Which of the following is true, according to the MRPC?", "a": ["The other lawyer at Boutique Firm can represent the defendant in the matter if the first attorney has not disclosed any confidential information to others in the firm, and the firm carefully screens the attorney completely from the matter and provides written notice to the other party.", "Boutique Firm cannot represent the defendant in the case because an attorney there learned confidential information from the opposing party as a prospective client during an initial consultation two months ago, and it would be subject to disqualification if it handled the litigation.", "Either the attorney or the other lawyer at Boutique Firm can represent the defendant, because the plaintiff was never a client of the firm, but merely came in for an initial consultation, at the end of which the attorney immediately declined representation.", "Either the attorney or the other lawyer at Boutique Firm can represent the defendant because the unfavorable information the client shared during the consultation, though confidential at the time, will inevitably come out during discovery no matter who represents the discovery."], "e": "A prospective client's harmful disclosures disqualify the lawyer who heard them from representing the opponent in the same matter (1.18(c)). The rest of the firm may still take the case if that lawyer is timely screened and gets no part of the fee, and the prospective client gets prompt written notice (1.18(d)(2)). That provision also requires that the lawyer limited intake to what he needed to decide whether to take the case. The 'never a client' argument fails, and possible discovery later doesn't make the information fair game. Book cite: MR 1.18, 1.10, 1.0(k). [W3:4–5; S3:10–12]", "r": "Stevenson, 500 MPRE Questions (2019) Q68 · Rule 1.10 Imputation of Conflicts"},
{"t": "rel", "q": "A prospective client met with an attorney at Boutique Firm for an initial consultation about a personal injury lawsuit over injuries the prospective client had sustained. The attorney declined the representation because he thought the client’s case was unwinnable and would therefore generate no fees. During the consultation, the attorney asked some probing questions about the incident, and the client admitted facts indicating an unreasonable assumption of foreseeable risks beforehand, as well as the client’s own intoxication at the time, which in the case would constitute contributory negligence. Furthermore, the client had failed to take obvious measures afterward to mitigate the damages. The attorney was certain that all these unfavorable facts would come out during discovery, and the client’s claim would become laughable at trial. Two months later, another client came in for a consultation with another lawyer at Boutique Firm. This prospective client had received service of process in a new personal injury lawsuit, and he was the named defendant. The plaintiff in the lawsuit was the same individual who had met with the first attorney for a consultation a few weeks before. Boutique firm agreed to take the case and represent the defendant in the litigation, and it has no measures in place to screen the attorney who consulted with the prospective client from participating in the matter. Which of the following is true, according to the MRPC?", "a": ["Boutique Firm cannot represent the defendant in the case because an attorney there learned confidential information from the opposing party as a prospective client during an initial consultation two months ago, unless Boutique Firm obtains informed consent in writing from both the defendant and the opposing party, who was a prospective client during a one-time consultation.", "The other lawyer at Boutique Firm can represent the defendant in the matter if the first attorney has not disclosed any confidential information to others in the firm, and he does not in fact disclose any confidential information the attorney learned during the consultation.", "Either the attorney or the other lawyer at Boutique Firm can represent the defendant, because the plaintiff was never a client of the firm, but merely came in for an initial consultation, at the end of which the attorney immediately declined representation.", "Either the attorney or the other lawyer at Boutique Firm can represent the defendant because the unfavorable information the client shared during the consultation, though confidential at the time, will inevitably come out during discovery no matter who represents the discovery."], "e": "Without a screen, the consulting lawyer's 1.18(c) disqualification (he received significantly harmful information about the plaintiff's own fault) is imputed to the whole firm. The only remaining cure is 1.18(d)(1): informed consent, confirmed in writing, from both the defendant and the former prospective client. A promise not to share isn't a substitute for a formal screen, and a one-time consultation is exactly what 1.18 protects. Book cite: MR 1.18, 1.10, 1.0(k). [W3:4–5; S3:10–12]", "r": "Stevenson, 500 MPRE Questions (2019) Q69 · Rule 1.10 Imputation of Conflicts"},
{"t": "agt", "q": "An attorney grew up in poverty but worked hard to overcome obstacles and achieve success. Now a successful practitioner, the attorney is idealistic and passionate about helping the less fortunate. Every Saturday morning, he uses a small conference room at the local YMCA to assist pro se litigants in divorce and custody matters – the attorney helps them complete their own court forms (court filings) for a nominal fee, gives some advice about their individual situation, and reviews forms they have completed before the individuals themselves file them. The attorney is concerned about these pro se litigants misunderstanding his role and believing he is their lawyer, so the attorney requires each one to sign a printed disclaimer declaring that no attorney-client relationship exists. It reads, in relevant part, “I understand that this attorney has no legal or ethical obligation to provide legal representation to me in this matter.” Given that the pro se litigant signed a form acknowledging that no legal representation will follow, is the attorney correct in believing that no lawyer-client relationship exists in these circumstances?", "a": ["No, the lawyer is reviewing court documents and providing legal advice about pending legal proceedings, which constitutes the practice of law by the lawyer, even if the representation has a limited scope.", "Yes, the signed express written disclaimer functions as a contractual agreement that no lawyer-client relationship exists.", "No, the pro se litigants described here appear to be unsophisticated users of legal services and potentially do not understand the significance of the written disclaimer.", "Yes, these pro se litigants will file the documents in court themselves, on their own behalf."], "e": "Helping pro se litigants complete court forms, advising them on their own situations, and reviewing their filings is practicing law, so a limited-scope lawyer-client relationship exists (1.2(c)) even though the litigants file the papers themselves. A signed disclaimer can't override what the lawyer actually does. The test asks whether the person reasonably relies on the lawyer for legal services, and the label doesn't control. The limited relationship still carries duties of competence and confidentiality, and usually conflict checks (unless MR 6.5 applies). Book note: a 2015 ABA Formal Opinion; Texas Ethics Op. 635 agrees. [W2:35–36, 54; S2:87–89]", "r": "Stevenson, 500 MPRE Questions (2019) Q85 · Rule 1.2 Scope of Representation & Allocation of Authority"},
{"t": "agt", "q": "A client hired a certain attorney to represent her in a personal injury lawsuit in which the client is the plaintiff. After an initial consultation and two meetings to review the main evidence in case and to discuss the nature of the claims, the attorney drafted the initial pleadings, served the opposing party, and filed the pleadings in the appropriate court. Nevertheless, the attorney did not allow the client to review the pleadings before filing them, and afterward, the client expresses disappointment that she did not have the opportunity to review the pleadings beforehand and make suggested edits, given that it is her case and that the attorney is working for her. Was it proper for the attorney to draft the pleadings based on conversations with the plaintiff and file the documents without first having the plaintiff review them?", "a": ["Yes, because a lawyer may take whatever actions the client has impliedly authorized as part of the representation.", "Yes, unless the client is an English teacher or a professional editor and might therefore have special expertise in proofreading texts for grammatical errors and stylistic problems.", "No, because a lawyer shall abide by a client's decisions concerning the objectives of representation and shall consult with the client as to how to pursue these ends.", "No, because the attorney may have to spend time later revising the pleadings, which could affect the legal fees in the case, and such revisions may have been unnecessary if someone else had proofread the attorney’s draft before filing it."], "e": "Once the client sets the objective (pursue her injury claim), the lawyer has implied authority to take the steps needed to carry it out, and drafting and filing pleadings is a classic means decision (1.2(a)). The lawyer must consult on material means under 1.4, which he did in the meetings about the claims, but he needn't get the client's approval of each document's wording. The 'objectives' answer misclassifies pleadings, which are means, not ends. Sharing important drafts with clients is still good practice. [W4:39–40; S4:60]", "r": "Stevenson, 500 MPRE Questions (2019) Q86 · Rule 1.2 Scope of Representation & Allocation of Authority"},
{"t": "agt", "q": "Client is the leader of a radical religious group that protests at the funerals of soldiers who died tragic combat deaths overseas. The protests are not against the war, however, but against society’s increasing tolerance of homosexuality and gay marriage. The client and his followers stand outside the funerals as grieving family members arrive, and they hold large picket signs emblazoned with hateful sayings against homosexuals, some of which use shocking language. They also hold signs indicating they are happy that American soldiers die frequently, because they believe these deaths validate their point that the country is on the wrong course morally and has become evil by being more tolerant. The group heckles those attending the funerals, but then disperses once the funeral ceremony starts. The group receives regular national media coverage because of the intentionally sensational and shocking nature of their protests. The client now faces a tort lawsuit by the father of a deceased soldier whose funeral the group picketed; the plaintiff claims intentional and negligent infliction of emotional distress. The client is certain that his First Amendment rights trump such subjective-harm tort claims and has a recent Supreme Court case supporting his position. The client asks an attorney to represent him in the matter. The attorney reluctantly agrees to take the case and the trial court gives an unfavorable verdict against the client. After the case, reporters interview the attorney asking how he could represent such a client and the attorney states during the interviews that he did not necessarily endorse the client’s religious, social, moral, or political views, but was merely providing representation. Are the attorney’s actions proper in this case?", "a": ["Yes, because a lawyer's representation of a client does not constitute an endorsement of the client's political, economic, social, or moral views or activities.", "Yes, because the attorney did not win the case on behalf of this client, so justice prevailed in the end, as this client advocates intolerance of others in our society.", "No, because the attorney has a duty under the Rules of Professional Conduct to refuse representation of a client if he cannot endorse the client’s political, social, or moral views, especially those who preach intolerance and hate.", "No, because the attorney lost the case, and then tried to justify himself in the media by denying any endorsement of the client’s political, social, and moral views."], "e": "Representing a client, even a widely despised one, isn't an endorsement of the client's political, economic, social, or moral views (1.2(b)). The attorney could take the case and say so publicly afterward. Nothing requires refusing clients whose views the lawyer can't endorse. Distaste is a permissible reason to decline, but declining is never required for that reason. The trial's outcome has nothing to do with whether his conduct was proper. Book cite: Rule 1.2(b). [W2:30 (lawyers may decline for almost any reason)] (1.2(b) itself isn't discussed in the readings)", "r": "Stevenson, 500 MPRE Questions (2019) Q87 · Rule 1.2 Scope of Representation & Allocation of Authority"},
{"t": "agt", "q": "A certain defendant was indigent and received court-appointed defense counsel in his felony larceny case. The defendant insisted that he was completely innocent and that he would not accept any plea bargains, because he wanted an opportunity to prove his innocence at trial. When the defendant told the attorney his expectations, the attorney explained that there is a special type of plea called an “Alford Plea,” in which a defendant may agree to accept a conviction while still contesting his guilt or maintaining his innocence. The defendant refused, and told the attorney, “Do not even contact me with offers from the prosecutor for a guilty plea. I will not plead guilty. I will prove my innocence in a court of law!” The prosecutor indeed made several plea offers, and each time the attorney presented the offer to the defendant, who rejected it and reminded the attorney that he did not want to hear about any offers to “make a deal.” The defendant’s hard line proved effective as a negotiating strategy, and eventually the prosecutor called the attorney to say they would reduce the charges to a misdemeanor and the sentence to “time served” if the defendant would plead guilty. The attorney thought this was a ridiculously generous offer but simply rejected it without consulting his client. The client proceeded to trial and the jury convicted him, and he received the maximum sentence for the crimes charged. Was it proper for the attorney to reject the final plea bargain offer without informing the client?", "a": ["Yes, because the client has previously indicated that the proposal will be unacceptable and has authorized the lawyer to reject the offer.", "Yes, because clients have a right to dictate the overall objectives of the representation, but the lawyer has a right to decide the means of achieving that objective.", "No, because a lawyer who receives from opposing counsel a proffered plea bargain in a criminal case must promptly inform the client of its substance.", "No, because the ultimate result was a conviction and a severe sentence for the defendant, which he could have avoided by accepting the final plea offer."], "e": "⚠ Answer-key warning: The book's keyed answer is debatable. 1.2 cmt [3] lets advance authority lapse on a material change in circumstances, and a misdemeanor with time served is a dramatic change. Prudence (and Missouri v. Frye) favors conveying it.\n\n1.4(a)(1) requires conveying plea offers promptly, unless the client has already told the lawyer how to handle them. The comments say a lawyer may reject an offer without consulting when the client has said such offers are unacceptable and authorized rejecting them. This client repeatedly refused any guilty plea and told the lawyer not to bring him offers. The 'objectives vs. means' answer is wrong: the plea is the client's call. Book cite: Rule 1.2 cmt. [3] (see also 1.4 cmt [2]). [W4:35–36; S4:22]", "r": "Stevenson, 500 MPRE Questions (2019) Q88 · Rule 1.2 Scope of Representation & Allocation of Authority"},
{"t": "agt", "q": "A certain attorney represents a defendant in a murder case. At trial, the jury convicted the client and sentenced him to death, and the appellate courts upheld the conviction as well as the sentence. The attorney has now offered to file a habeas corpus petition in federal court to appeal the case to the United States Supreme Court, if necessary. The defendant, however, has developed terminal cancer, and does not expect to live another six months. The defendant tells the attorney to drop the appeals because even if they won, the defendant would not live long enough to enjoy his freedom. Even so, the defendant does not terminate the representation, because he wants the attorney to handle his estate planning matters while he is on death row, and he has some administrative complaints in progress against the prison where he is living. The attorney strongly opposes the death penalty and believes his client is innocent, so he files the habeas petition anyway. While the habeas petition is making its way through the federal appellate process, the defendant succumbs to his illness and dies in prison. Is the attorney subject to discipline for filing the habeas petition, despite the client’s reservations?", "a": ["Yes, because a lawyer shall abide by a client's decisions concerning the objectives of representation and shall consult with the client as to how to pursue these ends.", "Yes, because the appeals are clearly a waste of public resources in a case where the defendant will die anyway before the appeals process would be complete.", "No, because filing appeals is merely a matter of strategy and methods, and lawyers do not have to defer to the client about strategy and methods.", "No, because the client died before the attorney’s actions produced any actual results that could affect the client."], "e": "Whether to keep appealing a conviction is an objective of the representation, so the lawyer must abide by the client's decision (1.2(a)). The client told the attorney to drop the appeals, and filing a habeas petition anyway, however sincere his motives, substitutes the lawyer's goals for the client's. Appeals aren't a mere question of means, and the client's later death doesn't cure the violation. The proper course was to counsel the client candidly (2.1) and then follow his decision. [W4:35–36; S4:60]", "r": "Stevenson, 500 MPRE Questions (2019) Q89 · Rule 1.2 Scope of Representation & Allocation of Authority"},
{"t": "agt", "q": "An attorney represents criminal defendants. One day, a client appeared in the attorney’s office and explained that he had been blackmailing his former employer for the last year. The client had hired a prostitute to seduce the former employer in a room with hidden cameras, then showed the embarrassing photographs to his former employer and demanded monthly payments of $500, which the employer paid, not wanting to destroy his marriage. The prostitute subsequently died of a drug overdose. The client’s former employer eventually tired of making the monthly blackmail payments and went to the police about the matter. The client is now worried that he will face charges for blackmail, which would violate his parole and result in a lengthy incarceration. The client retained the only copies of the photographs, as he merely showed them to the former employer a year ago to extort the payments. After the client explained all this to his attorney, he gave the attorney the documents and instructed the attorney to destroy them or hide them so that the police could not find them. Attorney put the photos in a folder marked ATTORNEY WORK PRODUCT - PRIVILEGED AND CONFIDENTIAL, and sent the folder to a secret overseas document storage service in the Caymans. The police obtained an arrest warrant for the client based on the former employer’s affidavit, and at trial, the prosecutor obtained a conviction based on the employer’s testimony and the bank records showing the monthly transfers. Is the attorney subject to discipline?", "a": ["Yes, because a lawyer shall not assist a client in conduct that the lawyer knows is criminal or fraudulent, such as destroying evidence when there is a pending criminal investigation.", "Yes, because the lawyer was clearly incompetent or negligent if he lost the trial even without the prosecutor having the photographs or the prostitute’s testimony to admit as evidence.", "No, because the court convicted the client anyway, so the lawyer’s feeble attempt to help the client made no difference to the outcome.", "No, because once the client told the lawyer about the matter privately and gave him the documents, they came under the protections of attorney-client privilege."], "e": "1.2(d) bars counseling or assisting a client in conduct the lawyer knows is criminal or fraudulent. Hiding a client's extortion photos offshore at his request, while the police are investigating, is evidence concealment and obstruction, which also violates 3.4(a) and 8.4(b)–(c). Labeling the folder 'work product' changes nothing: privilege protects communications, not pre-existing physical evidence, and it never permits concealment. The client's conviction doesn't erase the violation. Book cite: Rule 1.2(d). [W2:34; W1:17; W3:16–19] (MR 3.4(a))", "r": "Stevenson, 500 MPRE Questions (2019) Q90 · Rule 1.2 Scope of Representation & Allocation of Authority"},
{"t": "agt", "q": "A client hired an attorney to research the legality of a musical “mash-up,” a sound recording that includes brief sound clips and samples from many other artists’ commercial recordings. The client’s unique approach puts it in the gray area around “fair use” and “composite works of art” under prevailing copyright law, and no court has yet ruled on the precise issue, though the question has been the subject of seventeen lengthy law review articles in the last two years, reaching a range of different conclusions. No litigation is pending, and the client has not yet undertaken any activity that could constitute a copyright infringement; he is seeking reassurance before proceeding that he would not face liability for copyright infringement. Because the client primarily wants a memorandum of law answering his hypothetical legal question, he asks the attorney to limit his research and writing to two hours of billable time. The attorney agrees, spends an hour reading and an hour writing, and gives the client a short memorandum. Given that the client's objective was merely to secure general information about the law the client needs, was it improper for the attorney to agree to this limitation on the scope of representation up front?", "a": ["Yes, because given the complexity of the subject and the uncertainty about this certain point of law, two hours was not a reasonable amount of time to yield advice upon which the client could rely.", "Yes, because the other artists have a right to receive compensation for their creative work, and the attorney is helping the client potentially infringe on other artists’ copyrights.", "No, because the client had a limited objective of securing general information about the law the client needs, so the lawyer and client may agree that the lawyer's services will be no more than an hour of research and an hour of writing.", "No, because it would be too costly or burdensome to have the attorney read seventeen tedious law review articles and try to formulate a plausible synthesis of the positions they advocate."], "e": "A lawyer may limit scope if the limit is reasonable and the client gives informed consent (1.2(c)), but the limited work must still be competent. The comments say a brief consultation is reasonable for a common, simple question, not when the time allowed won't yield advice the client can rely on. An unsettled copyright question with seventeen conflicting law review articles can't be responsibly answered in two hours, so agreeing to the cap was improper. The client's wish for a cheap answer doesn't override 1.1. Book cite: Rule 1.2 cmt. [7]. [W2:54; W5:9; S2:87]", "r": "Stevenson, 500 MPRE Questions (2019) Q91 · Rule 1.2 Scope of Representation & Allocation of Authority"},
{"t": "agt", "q": "A certain client calls an attorney to ask if it is possible to apply for an extension on filing his annual tax returns, if the deadline for filing returns is still two weeks in the future. This attorney offers to research the matter for a few hours and write a formal legal memorandum for the client about filing extensions. Even so, offhand, the attorney can assure the client over the phone that it is indeed possible to apply for an extension and that the IRS routinely grants them if they receive he application for extension before the regular deadline. The attorney practices tax law and is familiar with the rules. The client thanks the attorney and says that he is satisfied with the “short answer,” and that he does not want the attorney to do any more research or writing about it, but to send a bill for the phone call. Then the attorney agrees and bills the client for the telephone conversation and conducts no further research on the matter. Is it proper for the attorney to limit his representation to a single telephone call like this?", "a": ["Yes, because the client's objective is no more than securing general information about the law the client needs to handle a common and typically uncomplicated legal problem, so the lawyer and the client may agree that the lawyer's services will be no more than a brief telephone consultation.", "Yes, because the lawyer should defer to the client about costs and the objectives of the representation and should not assist a client in committing a crime or fraud, such as tax evasion.", "No, because such a limitation on the representation does not allot enough time to yield advice upon which the client could rely, and the client could face devastating fines for being late with his tax returns.", "No, because such an agreement ignores the legal knowledge, skill, thoroughness, and preparation necessary for the representation."], "e": "A limited scope is reasonable when the client wants only general information about a common, usually simple legal problem, and the comments' example is a brief telephone consultation (1.2(c)). A tax lawyer can competently confirm in one call that a timely extension request is routinely granted, and the client gave informed consent to stopping there. That's enough time for reliable advice on this question, so competence isn't compromised, and no crime is involved. Book cite: Rule 1.2 cmt. [7]. [W2:54; S2:87]", "r": "Stevenson, 500 MPRE Questions (2019) Q92 · Rule 1.2 Scope of Representation & Allocation of Authority"},
{"t": "agt", "q": "Husband hired a certain attorney to represent him in a divorce; the husband and wife had three adult children. Husband was quite upset when he met with the attorney, because his wife had filed for divorce and he felt deeply betrayed. The couple had a prenuptial agreement that clearly delineated the division of assets in case of divorce, and child custody is not an issue as the children are in their twenties. As part of his routine consultation questions, the attorney asked if there had been any marital infidelity on the part of either the husband or wife. Husband admitted to the attorney that he once had an affair many years ago, that the wife never discovered, and that he wanted to keep secret, if possible. He then speculated that he had no idea if his wife had ever had an affair, then became very emotional as he considered the possibility. Within minutes, he had convinced himself that his wife had been having affairs with other men for years, though he never knew it, and that the three children were unlikely to be his offspring. The attorney had already looked at Husband’s photograph of his children, and their resemblance to their father (Husband) was remarkable. the attorney finds repugnant the idea of subjecting the adult children to paternity tests, which would traumatize them unnecessarily, regardless of the result. The attorney also believes that accusing the wife of infidelity would be imprudent, as it will ensure that the family would discover Husband’s previous affair, which otherwise might not happen. Without the accusations of infidelity, all the issues of the divorce would come under the prenuptial agreement and not be in dispute. Then the attorney insists on limiting his representation to the divorce and wants to include in the retainer agreement that there will be no accusations of infidelity or paternity testing of the children, unless the other side initiates in this regard. After Husband calms down, he agrees to the attorney’s conditions of representation. Is it proper for the attorney to insist on such conditions of representation?", "a": ["Yes, the terms of the representation agreement may exclude specific means that might otherwise serve used to accomplish the client's objectives, such as actions that the lawyer regards as repugnant or imprudent.", "Yes, because it would be fraudulent for the husband to accuse the wife of marital infidelity, of which there is no evidence, while hiding the fact that he himself had an affair.", "No, because there is always a chance that the other party in a divorce was guilty of marital infidelity, and the children should get to know with absolute certainty who is their real father.", "No, because the lawyer should always defer to the client about the objectives of the representation, while the client should defer to the lawyer about the means of achieving the goals of the representation."], "e": "The comments to 1.2(c) let lawyer and client agree to exclude specific means the lawyer considers repugnant or imprudent. Refusing to allege infidelity or seek paternity tests of adult children, with no evidence to support either and a real risk of exposing the client's own affair, is that kind of limit, and the client consented once he calmed down. The objectives-and-means division doesn't stop a client from agreeing in advance to forgo particular tactics, and the 'fraud' answer isn't the reason. Book cite: Rule 1.2 cmt. [6]. [W2:54; S2:87]", "r": "Stevenson, 500 MPRE Questions (2019) Q93 · Rule 1.2 Scope of Representation & Allocation of Authority"},
{"t": "agt", "q": "A client explains to his attorney that he is operating an illegal website where users can anonymously upload and download pirated music and videos, in violation of copyright laws and other anti-piracy statutes. The website is very lucrative for its operator, and the client has become a multimillionaire by founding and operating the site. The client is concerned about potential criminal charges or civil lawsuits over the website. His attorney explains to the client how he could use a series of dummy limited liability corporations, mail forwarding addresses, and offshore bank accounts to avoid detection. Each of the steps of the process the attorney describes is technically legal – creating the corporate entities, purchasing mail-forwarding services, and opening bank accounts in Belize. The attorney decides not to charge the client for this advice session but bills the client for other transactional work performed. Is the attorney subject to discipline?", "a": ["Yes, because a lawyer must avoid assisting a client in fraudulent or criminal activity, which includes suggesting how to conceal the wrongdoing.", "Yes, because the attorney did not bill the client for the consultation, in violation of their regular retainer agreement.", "No, because the individual steps that the attorney proposed would be legal in isolation, and merely gave an honest opinion about the actual consequences that appear likely to result from a client's conduct.", "No, because the attorney did not bill the client for the advice, and therefore did not benefit personally from counseling the client."], "e": "1.2(d) bars knowingly assisting a client's crime or fraud. The comments distinguish analyzing the legal consequences of questionable conduct, which is allowed, from recommending how a crime could be committed with impunity, which includes suggesting how to conceal ongoing wrongdoing. Designing dummy LLCs, mail drops, and offshore accounts so a running piracy operation avoids detection is assisting, even if each step is lawful on its own. Not billing for the advice doesn't matter. Book cite: Rule 1.2 cmt. [9]. [W2:34; W1:17] (MR 1.2 cmt [10])", "r": "Stevenson, 500 MPRE Questions (2019) Q94 · Rule 1.2 Scope of Representation & Allocation of Authority"},
{"t": "agt", "q": "An attorney tells a client that certain features of the client’s business proposal would constitute money laundering under current federal statutes. The discussion goes through the statute in detail, and the attorney explains why the course of action would meet the statutory definition of money laundering. In addition, the attorney discusses the various monitoring and reporting mechanisms that federal enforcement agencies have in place to detect money laundering, to convince the client that he would not escape arrest and prosecution if he proceeds. The client absorbs the information and uses it to structure a more elaborate money-laundering scheme. He exploits some ambiguity in the statute and the reporting requirements to make his enterprise much more difficult to detect, and this complicates enforcement and prosecution efforts against him. Overall, the attorney’s advice turned out to be incredibly useful to the client in avoiding detection and expanding his criminal enterprise. Is the attorney a party to the client’s course of action?", "a": ["No, because the fact that a client uses advice in a course of action that is criminal or fraudulent of itself does not make a lawyer a party to the course of action.", "No, because the attorney’s subjective intentions were not wrong in the situation.", "Yes, because there is no distinction between presenting an analysis of legal aspects of questionable conduct and recommending how a crime or fraud might be committed with impunity.", "Yes, because a lawyer may not discuss the legal consequences of any proposed criminal course of conduct with a client and or counsel a client to determine the validity, scope, meaning or application of the law."], "e": "A client's use of a lawyer's advice in a crime doesn't, by itself, make the lawyer a party to it. The comments draw a critical line between analyzing the legal aspects of questionable conduct, which 1.2(d) expressly allows, and recommending how a crime could be committed with impunity. The attorney explained why the plan was money laundering and how enforcement works in order to deter it, so the client's misuse doesn't make that assistance. The test is what the lawyer said and did, not his good intentions. Book cite: Rule 1.2 cmt. [9]. [W2:34; W1:17]", "r": "Stevenson, 500 MPRE Questions (2019) Q95 · Rule 1.2 Scope of Representation & Allocation of Authority"},
{"t": "agt", "q": "Client is an inexperienced drug dealer and consults with his attorney about the legal ramifications of his business. Without explicitly endorsing or encouraging the client in his criminal enterprise, the attorney conducts research at the client’s request about various drug laws and sentencing guidelines. The attorney writes a detailed memorandum of law explaining that certain threshold quantities of drugs, according to the relevant statutes, create a presumption of “intent to distribute” or trigger a significant sentencing enhancement. Similarly, the attorney explains that statutes and sentencing guidelines impose higher-grade charges and severe sentencing enhancements if a drug dealer brings a firearm to a transaction. The client mulls over the information and decides to change his business model from bulk sales of narcotics to selling smaller quantities in more individual transactions, such that each sale constitutes only the lowest-level misdemeanor. The client also instructs all his subordinates to avoid carrying firearms and instead to refill pepper spray devices with hydrochloric acid, which they spray in the face of their opponents in any altercation, causing severe disfigurement. Is it proper for the attorney to provide such legal advice to the client?", "a": ["Yes, because a lawyer may discuss the legal consequences of any proposed course of conduct with a client and may counsel or assist a client to make a good faith effort to determine the validity, scope, meaning or application of the law.", "Yes, because the Rules of Professional Conduct confer upon the client the ultimate authority to determine the purposes or objectives of the legal representation, within the limits imposed by law and the lawyer's professional obligations.", "No, because of the attorney-client privilege and the duty of confidentiality.", "No, because a lawyer must to avoid assisting the client in criminal activity by suggesting how to conceal the wrongdoing."], "e": "⚠ Answer-key warning: The book's keyed answer is debatable. The client runs an ongoing drug business, and advice he uses to restructure it to lower his exposure comes close to what the comments call recommending how a crime can be committed with impunity (MR 1.2 cmts [9]–[10]).\n\n1.2(d) expressly lets a lawyer discuss the legal consequences of any proposed conduct and help a client determine in good faith what the law means and how it applies. A memo explaining drug-quantity thresholds and firearm enhancements is legal analysis, not a recommendation of a scheme, so on the book's view the client's misuse doesn't make the advice improper. Privilege and confidentiality are beside the point. Book cite: Rule 1.2(d). [W2:34; W1:17]", "r": "Stevenson, 500 MPRE Questions (2019) Q96 · Rule 1.2 Scope of Representation & Allocation of Authority"},
{"t": "agt", "q": "A certain attorney represents a client in a drug trafficking case. The client asks the attorney to deliver a package to a friend of the client. The client tells the attorney that the package contains illegal drugs, but he assures the attorney that he will not reveal who made the delivery if police discover that the transfer occurred. the attorney advises that he will not participate in the transfer. The attorney does not advise the court of the client’s request and remains the client’s attorney on the drug trafficking case. Are the attorney’s actions improper?", "a": ["No, because an attorney does not have to decline or withdraw from cases unless the client demands that the attorney engage in illegal conduct.", "No, because the attorney has no obligation to withdraw from a case if he does not engage in illegal activity with or for a client.", "Yes, because an attorney must decline or withdraw from representing a client if the client asks that the attorney engage in illegal conduct.", "Yes, because an attorney must notify the court if his client asks or demands that he engage in illegal activity."], "e": "1.2(d) forbids assisting a client's crime, and the attorney refused to deliver the drugs. That refusal satisfied his duties. The Model Rules don't require withdrawing just because a client asked for illegal help, and nothing requires telling the court about the request, which is confidential (1.6). Withdrawal is mandatory only if continuing would itself violate the Rules or law. Currency note: the 2023 amendment adds 1.16(a)(4), requiring withdrawal if the client seeks to use, or persists in using, the lawyer's services for a crime or fraud despite the 1.2(d)/1.4(a)(5) discussion. This client dropped the request once refused, so the book's answer still holds. [W2:32–34; S2:94]", "r": "Stevenson, 500 MPRE Questions (2019) Q97 · Rule 1.2 Scope of Representation & Allocation of Authority"},
