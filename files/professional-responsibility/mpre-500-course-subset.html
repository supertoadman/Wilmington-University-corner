{"t": "fid", "q": "An attorney represented a defendant who was facing criminal charges for violating a newly- enacted statute. The statute that made certain activities that had previously been minor misdemeanors into felonies. The district attorney handling the case spoke to the defendant’s attorney, explaining that this was an important test case of a new statute, so the D.A.’s office was seeking the maximum penalty. The state did, however, offer a reduced sentence if the defendant would plead guilty, but this would still carry three years of jail time. Outraged, the attorney shouted that this had always been a misdemeanor charge in the past, which carried no jail time at all, and ended the conversation abruptly at that point. Without mentioning the conversation to the defendant, the attorney drafted an impassioned motion to dismiss the charges and filed it with the court. The attorney had a reasonable belief that his motion could be successful, though it was far from certain. The judge agreed with the attorney and granted the motion, dismissing all the charges against the attorney’s client. Were the attorney’s actions permissible under the Model Rules?", "a": ["No, a defense lawyer who receives a proffered plea bargain in a criminal case must promptly inform the client of its substance, unless the client has previously told the lawyer to accept or to reject the offer.", "Yes, the dismissal of the charges in this case meant that the client was far better off than if he had considered the plea bargain offered by the prosecutor.", "Yes, the attorney would still have a chance to tell the client about the proffered plea if the judge had not granted the motion to dismiss.", "No, the attorney should have given more consideration to the serious public policy reasons for the legislature enacting the new statute."], "e": "A defense lawyer must promptly tell the client about any plea offer, unless the client has already said whether to accept or reject that kind of offer (1.4(a)(1)). Whether to plead is the client's decision (1.2(a)). The attorney never mentioned the three-year offer and pursued his own strategy instead. Winning the motion doesn't cure the violation, because the client lost the chance to decide for himself. Book cite: Rule 1.4. [W4:9, 35–36; S4:22] (MR 1.4 cmt [2])", "r": "Stevenson, 500 MPRE Questions (2019) Q98 · Rule 1.4 Communications"},
{"t": "fid", "q": "A litigation attorney represented a certain defendant in a lawsuit. The client was absent during the final pre-trial hearing about which experts the court would permit to testify at trial for each side. As the hearing was wrapping up, plaintiff’s counsel asked the court to have the record sealed in the upcoming trial, and to have reporters banned from the courtroom. The trial involved sensitive information about the mental health of some of the children involved as parties and witnesses in the case. The court agreed but asked if the defendant had any objections. The defendant’s attorney tried to reach his client by phone, but he could not get through. There was no obvious reason to oppose the motion, so the attorney agreed on his client’s behalf. The judge ordered the record sealed for the upcoming trial. The client never returned the attorney’s phone call, and the attorney forgot to mention what had transpired until they were sitting in court on the first day of trial, two weeks later. The client was upset, having planned to use media publicity about the case to draw attention to the other side’s exploitation of children as witnesses in litigation. The attorney told the client that the judge would not reverse the decision now that the trial was underway. Were the attorney’s actions permissible, under the Model Rules?", "a": ["No, because even when an immediate decision is necessary during trial, and the exigency of the situation may require the lawyer to act without prior consultation, the lawyer must tell the client about it as soon as possible.", "Yes, it was proper for the lawyer to defer to the judge on this question, lest he risk angering the judge or unnecessarily inconveniencing the opposing party.", "Yes, the opposing party’s request was reasonable, and even if Attorney had asked Client and Client disapproved, Attorney could not have ethically objected to the request.", "No, because the importance of the action under consideration and the feasibility of consulting with the client meant the lawyer’s duty required consultation prior to acting."], "e": "When a decision is needed immediately at a hearing, the lawyer may act without consulting first, but must tell the client promptly afterward. This lawyer let two weeks pass and told the client only on the first day of trial, which violates 1.4(a)(1) and (3). The answer saying he had to consult before acting is wrong: he tried to reach the client, and the urgency excused acting alone. His violation was the delay in telling the client afterward. Book cite: Rule 1.4 (cmt [3]). [W4:9; S4:22]", "r": "Stevenson, 500 MPRE Questions (2019) Q99 · Rule 1.4 Communications"},
{"t": "fid", "q": "A certain attorney represents a client in a transactional matter, a complex business merger. The parties have agreed in advance, by contract, to engage in good-faith negotiations, but that if an agreement does not emerge within six months, either party can abandon the deal and cease negotiations. Three months into the negotiations, the parties are close to a final agreement. The attorney has been conducting the negotiations without the client present, checking in with the client from time to time. One day, the other party presents a detailed proposal that would resolve all remaining issues. This proposal would give each side most of what it wants, but also requires a few concessions from each party. The attorney calls the client immediately and gives a brief overview of the new proposal, hitting most of the highlights and carefully explaining the bottom-line concerning the final buyout price to complete the merger. The client gives the attorney consent to consummate the agreement. Could the attorney be subject to discipline for how he handled the final agreement?", "a": ["Yes, when there is time to explain a proposal made in a negotiation, the lawyer should review all important provisions with the client before proceeding to an agreement, and the facts suggest that the attorney did not necessarily explain all the concessions that the client would have to make.", "Yes, because it is improper for a lawyer to make an agreement in advance to reach a settlement or other final agreement by a certain date, so that parties will abandon negotiations after that point.", "No, because the attorney had implied authorization from the client to work out all important provisions of the agreement, and the client does not need to know all the details.", "No, because the attorney obtained the client’s consent about the bottom line before proceeding to a final agreement."], "e": "1.4(b) requires explaining a matter enough for the client to make informed decisions. When there's time, the lawyer should review all important provisions of a negotiated proposal with the client before agreeing to it. A phone summary of the highlights and the price, without the concessions the client would have to make, doesn't support informed consent to a merger. The client's approval of the bottom line isn't enough, and agreeing to a negotiation deadline is perfectly proper. Book cite: Rule 1.4 cmt. [5]. [W4:9; S4:22]", "r": "Stevenson, 500 MPRE Questions (2019) Q100 · Rule 1.4 Communications"},
{"t": "fid", "q": "A certain attorney represents a client in a litigation matter. The client was not present during the last pre-trial hearing at which the lawyers argued about whether certain experts on each side could testify at trial. The trial was to start the following week. At the end of the hearing, the opposing counsel asked the court to have the record sealed in the upcoming trial, and to have reporters banned from the courtroom. He explained that the testimony at trial would necessarily reveal some of his client’s trade secrets, and it was important to the client to keep the trial records sealed. The judge was amenable to this suggestion and asked the attorney if he had any objections. The attorney tried to call the client, but the client did not answer his phone right then. Unfortunately, the attorney could not think of a compelling reason for the client to oppose the motion, so he agreed, and the judge set the matter for a sealed-record trial. Three hours later, the client returned the attorney’s call, and the attorney explained what had transpired. The client felt dismayed because he had planned to use this litigation as a test case for subsequent litigation over the same type of issue, but the attorney explained that it would now be difficult to get the judge to reverse course on this point. Was it proper for the attorney to agree to the request without obtaining the client’s prior consent?", "a": ["Yes, because during a trial, when an immediate decision becomes necessary, the exigency of the situation may require the lawyer to act without prior consultation, assuming the lawyer promptly informs the client of actions the lawyer has taken on the client's behalf.", "Yes, because the opposing party’s request was reasonable, and even if the attorney had asked the client and the client disapproved, the attorney could not have ethically objected to the request.", "No, because the importance of the action under consideration and the feasibility of consulting with the client meant the lawyer’s duty required consultation prior to acting.", "No, because a lawyer must promptly consult with and secure the client's consent prior to taking action unless prior discussions with the client have resolved what action the client wants the lawyer to take."], "e": "The comments recognize that during trial an immediate decision may be needed, and the urgency may require the lawyer to act without first consulting, provided he promptly tells the client what he did. The attorney tried to reach the client, had to answer the court on the spot, and reported within three hours, which satisfies 1.4. The answer requiring the client's prior consent overstates the duty in a genuine emergency. The 'couldn't have objected anyway' reasoning isn't why it was proper. Book cite: Rule 1.4 cmt. [3]. [W4:9, 39–40; S4:22]", "r": "Stevenson, 500 MPRE Questions (2019) Q101 · Rule 1.4 Communications"},
{"t": "fid", "q": "An attorney represented a client in a criminal matter. The client had a history of mental illness, and the court ordered a psychological examination to determine if the client would be competent to stand trial. The case did not involve an insanity defense or a defense of diminished capacity. The psychologist who evaluated the client spoke privately to the attorney and explained that the client was indeed competent to stand trial, but that in his opinion, the client also suffered from delusional narcissism, paranoia, and oppositional-defiant syndrome. The psychologist pleaded with the attorney not to tell the client about this diagnosis, because the disclosure could harm the client, triggering an episode of paranoia in which the client would suspect that everyone around him was conspiring to institutionalize him, and he would become uncooperative at trial and mistrustful of his own lawyer. Then the attorney told the client that the psychologist had deemed him competent to stand trial and did not disclose the rest of the psychologist’s assessment. Was it proper for the attorney to conceal the psychologist’s diagnosis from the client?", "a": ["Yes, a lawyer may delay transmission of information when the client would be likely to react imprudently to an immediate communication, including a psychiatric diagnosis of a client when the examining psychiatrist indicates that disclosure would harm the client.", "Yes, because the psychologist’s duty was only to evaluate for competence to stand trial, so his additional diagnosis was outside the scope of his assignment.", "No, because the information must be appropriate for a client who is a comprehending and responsible adult, and if the client is competent to stand trial, he is competent to receive the rest of the psychologist’s diagnosis.", "No, because full communication between the lawyer and the client is necessary for the client effectively to participate in the representation."], "e": "A lawyer may delay passing information to a client who would likely react imprudently to immediate disclosure. The comments' own example is a psychiatric diagnosis that the examining psychiatrist says would harm the client to hear. The attorney told the client what the case required (he's competent) and held back the clinical diagnosis on the expert's advice. A lawyer may never withhold information to serve the lawyer's own or someone else's interests. The 'competent adult' and 'full communication' answers ignore this exception. Book cite: Rule 1.4 cmt. [7]. [W4:9; S3:65 (Problem 8A-8(e))] (1.4 cmt [7] isn't discussed in the readings)", "r": "Stevenson, 500 MPRE Questions (2019) Q102 · Rule 1.4 Communications"},
{"t": "fid", "q": "An attorney prepared a contract for a client in 2016. The matter is nearing competition, so the representation regarding that matter has not ended. In 2018, while using that agreement as a template to prepare an agreement for a different client, the attorney discovers a material error in the agreement. The error does not, however, furnish a colorable claim for malpractice, because the client did not suffer any injury, and the client in the meantime canceled the agreement with the other party due to other factors. Even so, any reasonable client who learned of this mistake would lose confidence in their lawyer’s competence or diligence. On those facts, do the Model Rules require the lawyer to inform the client of the error?", "a": ["Yes, because Rule 1.4 requires that lawyers disclose material errors made during the representation to current clients, whenever the error would predictably cause a client to consider terminating the representation even in the absence of harm or prejudice.", "Yes, because Model Rule 1.16(d) requires that a lawyer, upon termination of a representation, must “take steps to the extent reasonably practicable to protect a client’s interests, such as giving reasonable notice to the client.”", "No, because the Model Rules do not require disclosure of material errors to clients after the representation in that matter has ended.", "No, because it is not clear on these facts that the former client has suffered any actual injury or prejudice, even if the error was material."], "e": "ABA Op. 18-481 reads 1.4 to require prompt disclosure of a material error to a current client. An error is material if it's reasonably likely to harm the client, or if it would reasonably cause a client to consider ending the representation even without harm. Any reasonable client would lose confidence over this mistake, and the matter is still open, so disclosure is required even though there's no viable malpractice claim. 1.16(d) concerns ending a representation and doesn't apply. Book cite: ABA Formal Op. 18-481. [W4:10; S4:26–32]", "r": "Stevenson, 500 MPRE Questions (2019) Q103 · Rule 1.4 Communications"},
{"t": "fid", "q": "An attorney was a partner at Big Firm, which represented Conglomerate Corporation and Giant Company in corporate merger negotiations. Big Firm had state-of-the-art network firewalls, virus protection, password protection, and other data security features in place. Nevertheless, one Friday evening some hackers managed to breach Big Firm’s networks and access client information and partner emails, for purposes of engaging in insider trading. The firm detected the breach within a few hours and notified state and federal law enforcement. The stock exchange had closed for the weekend, and law enforcement managed to apprehend the hackers over the weekend, before they had a chance to review the stolen information and share useful data or engage in illegal stock trades. The clients suffered no losses or adverse effects, but they could have. Big Firm is worried about how news of the breach would affect their reputation, and that it might invite other hackers to target their firm, so they would prefer to keep the incident a secret. The partners at Big Firm claim they have no duty to disclose to its clients that the breach occurred, given that no harm resulted. Are they correct?", "a": ["No, when a data breach occurs involving, or having a substantial likelihood of involving, material client confidential information a lawyer has a duty to notify the client of the breach.", "Yes, the firm’s need to keep the incident secret outweighs any reasons to disclose the breach to the clients.", "Yes, the firm fulfilled its duties to the clients by having reasonable measures in place to safeguard confidential client information, so no further disclosures to the clients are necessary.", "No, a firm’s competence in preserving a client’s confidentiality is a strict liability standard that requires the lawyer to be invulnerable or impenetrable."], "e": "Under ABA Op. 18-483, when a data breach involves (or is substantially likely to involve) material client confidential information, the lawyer must notify the affected clients, a duty that flows from 1.4's requirement to keep clients reasonably informed. Reasonable safeguards may mean the firm didn't violate 1.6(c), and no harm resulted, but neither excuses telling clients. Concern for reputation never justifies withholding material information. The standard isn't strict liability; reasonable security is what's required. Book cite: Rule 1.4; ABA Formal Op. 18-483. [W2:8, 25 n.12; W4:9]", "r": "Stevenson, 500 MPRE Questions (2019) Q104 · Rule 1.4 Communications"},
{"t": "fid", "q": "An attorney prepared a contract for a client in 2015. The matter has concluded, the representation has ended, and the person for whom the contract was prepared is not a client of the attorney or law firm in any other matter. In 2018, while using that agreement as a template to prepare an agreement for a different client, the attorney discovers a material error in the agreement. On those facts, do the Model Rules require the lawyer to inform the former client of the error?", "a": ["No, because the Model Rules do not require disclosure of material errors to former clients after the representation has ended.", "Yes, because Rule 1.4 requires that lawyers disclose material errors made during the representation to the clients.", "Yes, because Model Rule 1.16(d) requires that a lawyer, upon termination of a representation, must “take steps to the extent reasonably practicable to protect a client’s interests, such as giving reasonable notice to the client.”", "No, because it is not clear on these facts that the former client has suffered any actual injury or prejudice, even if the error was material."], "e": "ABA Op. 18-481 limits the duty to disclose one's own material errors to current clients. When the matter has ended and the person isn't a client in any other matter, the Model Rules don't require telling a former client about an error discovered later. 1.16(d)'s exit duties concern protecting the client when the representation ends, not later discoveries. The lack of harm isn't the reason. Disclosure may still be wise, and other law may encourage it. Book cite: ABA Formal Op. 18-481. [W4:10]", "r": "Stevenson, 500 MPRE Questions (2019) Q105 · Rule 1.4 Communications"},
{"t": "fid", "q": "An attorney prepared a contract for a client in 2013. The matter concluded, and the representation regarding that matter has ended, though the attorney continues to represent the same client on some unrelated matters. In 2017, while using that agreement as a template to prepare an agreement for a different client, the attorney discovers a material error in the agreement. On those facts, do the Model Rules require the lawyer to inform the client of the error?", "a": ["Yes, because Rule 1.4 requires that lawyers disclose material errors made during the representation to current clients, and the attorney’s ongoing representation on other matters means a client-lawyer relationship still exists.", "Yes, because Model Rule 1.16(d) requires that a lawyer, upon termination of a representation, must “take steps to the extent reasonably practicable to protect a client’s interests, such as giving reasonable notice to the client.”", "No, because the Model Rules do not require disclosure of material errors to clients after the representation in that matter has ended.", "No, because it is not clear on these facts that the former client has suffered any actual injury or prejudice, even if the error was material."], "e": "ABA Op. 18-481 asks whether the person is a current client. The contract matter ended, but the attorney still represents the client on other matters, so the client is a current client and 1.4's duty to disclose material errors applies. A material error is one reasonably likely to harm the client, or one that would reasonably make the client consider ending the relationship. 1.16(d) isn't the source, and it doesn't matter that the error arose in a closed matter. Book cite: ABA Formal Op. 18-481. [W4:10; S4:26–32]", "r": "Stevenson, 500 MPRE Questions (2019) Q106 · Rule 1.4 Communications"},
{"t": "fid", "q": "An attorney prepared a contract for a client in 2016. The matter is nearing conclusion, so the representation regarding that matter has not ended. In 2018, while using that agreement as a template to prepare an agreement for a different client, the attorney discovers a material error in the agreement. The error does not, however, furnish a colorable claim for malpractice, because the client has not yet suffered any injury, and it is not clear that the attorney’s error falls far enough below the industry standards to meet the legal standards for negligence. On those facts, do the Model Rules require the lawyer to inform the client of the error?", "a": ["Yes, because Rule 1.4 requires that lawyers disclose material errors made during the representation to current clients, even though the error does not furnish the basis for a valid malpractice claim.", "Yes, because Model Rule 1.16(d) requires that a lawyer, upon termination of a representation, must “take steps to the extent reasonably practicable to protect a client’s interests, such as giving reasonable notice to the client.”", "No, because the Model Rules do not require disclosure of material errors to clients after the representation in that matter has ended.", "No, because it is not clear on these facts that the former client has suffered any actual injury or prejudice, even if the error was material."], "e": "Op. 18-481's duty to disclose material errors to current clients doesn't depend on whether the error supports a malpractice claim. An error is material if it's reasonably likely to harm the client or would reasonably make the client consider ending the representation. Finding one in a still-open matter requires prompt disclosure under 1.4, before any harm occurs. Uncertainty about whether the error amounts to negligence is no excuse, and 1.16(d) isn't the source of the duty. Book cite: ABA Formal Op. 18-481. [W4:10; S4:26–32]", "r": "Stevenson, 500 MPRE Questions (2019) Q107 · Rule 1.4 Communications"},
{"t": "fee", "q": "An attorney agreed to represent a plaintiff in a personal injury lawsuit, and the client agreed to pay the attorney a contingent fee based on a percentage of the award in the case. The attorney put all the terms of the fee agreement in written form in a letter to the client. The letter explained the percentage that should accrue to the attorney the event of settlement, trial, or appeal; litigation and other expenses that the attorney would deduct from the recovery; and that such deductions would come out of the total before the calculation of the contingent fee. The letter also explained all potential expenses for which the client could be liable, if the client prevailed in the case or not. The client received the letter, read it carefully, and called the attorney to give verbal assent and confirmation to all the terms. The client’s spouse later discarded the letter, and the attorney proceeded with the representation. Could the attorney be subject to discipline, based on these facts?", "a": ["Yes, because the client did not sign the fee agreement.", "Yes, because the attorney arranged to deduct expenses from the total award before the calculation of the contingent fee, rather than after the determination of the fee.", "No, because the letter constituted a written fee agreement stipulating all the terms of the contingent fee arrangement, and the client gave full consent and authorization over the phone.", "No, under the Model Rules, a written fee agreement signed by the client is preferable but not a requirement."], "e": "1.5(c) requires a contingent fee agreement to be in a writing signed by the client. The writing must state the percentages for settlement, trial, and appeal; the expenses to be deducted and whether before or after the percentage is calculated; and any expenses the client owes regardless of outcome. The letter covered every term, but the client never signed it, and oral assent by phone doesn't satisfy the signature requirement. Deducting expenses first is allowed (and favors the client), and for contingent fees the signed writing is mandatory, not merely preferred. Book cite: Rule 1.5(c). [W5:6–8; outline VIII-A]", "r": "Stevenson, 500 MPRE Questions (2019) Q108 · Rule 1.5 Fees"},
{"t": "fee", "q": "Boutique Firm charges its clients fifteen cents per page for photocopies done in-house on the firm’s copiers. All new clients receive a schedule of fees before the representation begins that clearly specifies such charges, and client bills clearly itemize photocopying charges. The charge applies even if the client never sees the photocopies, as when associates conducting research must copy sections of cases, statutes, and regulations, or circulate draft memoranda to other lawyers working on the case. The charge also applies when the firm must produce documents for the other party in response to a discovery request. Boutique Firm set the amount at fifteen cents per page because that approximates the firm’s own costs in leasing the high-tech photocopiers, purchasing paper and toner cartridges, and paying for frequent maintenance and repairs of the machines by technicians. Could Boutique Firm be subject to discipline for charging clients per page for photocopies done in-house?", "a": ["No, a lawyer may seek reimbursement for the cost of services performed in-house, such as copying, or for other expenses incurred in-house, such as telephone charges, either by charging a reasonable amount to which the client has agreed in advance or by charging an amount that reasonably reflects the cost incurred by the lawyer.", "Yes, because lawyers may charge clients only for the lawyer’s time (legal fees), expert fees, and court costs.", "Yes, because a lawyer may not charge a client for overhead expenses normally associated with properly maintaining, staffing, and equipping an office.", "No, it is permissible to pass charges through to the client if the lawyer is charging the client on an hourly (itemized) basis, but not if the lawyer is charging a contingent fee or a fixed fee for the representation."], "e": "A lawyer may bill for in-house services like photocopying by charging either a reasonable amount the client agreed to in advance or an amount that reasonably reflects the lawyer's actual cost (1.5 cmt [1]). Fifteen cents a page, disclosed in the fee schedule and close to the firm's real cost, meets both tests. Expenses aren't limited to lawyer time, experts, and court costs, and this isn't general overhead. The fee structure (hourly, flat, or contingent) doesn't matter. Book cite: Rule 1.5 cmt. [1]; ABA Formal Op. 93-379. [W5:2; W5:12 (Problem 20C-3)]", "r": "Stevenson, 500 MPRE Questions (2019) Q109 · Rule 1.5 Fees"},
{"t": "fee", "q": "An attorney represented a client in a divorce case and charged the client an hourly fee for the representation. The client won primary custody of the child from the marriage, and the ex-spouse (the child’s other parent) would take the child during school vacations. A year after the case ended, the client wanted to reopen the case to seek additional child support, because in the intervening months, the child had developed a disability that imposed high medical care costs on the client, and at the same time, the ex-spouse had won the Mega-Millions lottery, and was living a luxurious, profligate lifestyle. Would it be permissible for the attorney to represent the client in this matter on a contingent fee basis, given that the divorce was already final?", "a": ["No, the attorney may not enter into an arrangement for, charge, or collect any fee in a domestic relations matter, the payment or amount of which is contingent upon the securing of a divorce or upon the amount of alimony or support, or property settlement in lieu thereof", "Yes, the Model Rules do not preclude a contract for a contingent fee for legal representation in connection with the recovery of post-judgment balances due under support, alimony, or other financial orders.", "Yes, because the circumstances have changed, given that the client now must pay unexpected medical bills for the child, and the ex-spouse has won the lottery.", "No, the Model Rules preclude a contract for a contingent fee for legal representation in connection with the recovery of post- judgment balances due under support, alimony, or other financial orders."], "e": "1.5(d)(1) bars any fee in a domestic relations matter that's contingent on securing a divorce or on the amount of alimony, support, or a property settlement in their place. Seeking a higher child-support award is contingent on the amount of support, so it's barred even though the divorce is final. The comments' exception covers only collecting post-judgment balances already owed under existing support or alimony orders, which this isn't. Changed circumstances don't change the rule. Book cite: Rule 1.5(d). [W5:11–12; S5:11]", "r": "Stevenson, 500 MPRE Questions (2019) Q110 · Rule 1.5 Fees"},
{"t": "fee", "q": "A certain defendant was facing charges for assault with a deadly weapon. A local criminal defense attorney offered to represent this defendant on a contingent fee basis. In other words, the attorney would charge no fee (the client would pay nothing) if the case resulted in a conviction, but he would pay only if the lawyer won an acquittal. Having no funds on hand to hire a lawyer by any other means, the client was eager to do this and consented to the arrangement, in writing. Which of the following best describes the lawyer’s situation?", "a": ["The attorney is subject to discipline for charging a contingent fee in a criminal matter.", "The attorney is not subject to discipline because the client consented and confirmed it in writing.", "The attorney is subject to discipline for failing to include a third option, a partial fee if the case ends with a plea bargain to a lesser charge that requires no jail time.", "The attorney’s arrangement would constitute ineffective assistance of counsel in a criminal case."], "e": "1.5(d)(2) flatly prohibits a contingent fee for representing a criminal defendant. The client's written consent and lack of funds can't cure a fee the Rule bans outright, so the attorney is subject to discipline. Adding a plea-bargain tier wouldn't help. The violation is the fee structure itself; ineffective assistance is a separate Sixth Amendment question. Book cite: Rule 1.5(d)(2). [W5:11–12]", "r": "Stevenson, 500 MPRE Questions (2019) Q111 · Rule 1.5 Fees"},
{"t": "fee", "q": "Big Firm raises its hourly billing rate for all clients annually, on the first day of the year, by two percent. The initial engagement documents at the outset of representation explain this practice clearly, but Big Firm does not inform clients in writing each time the annual rate increase occurs. Is it proper for Big Firm to handle its billing and rate increases in this manner?", "a": ["Yes, periodic, incremental increases in a lawyer's regular hourly billing rates are permissible if a client understands and accepts such practice at the commencement of the client-lawyer relationship, and the periodic increases are reasonable under the circumstances.", "Yes, unless the clients object, their acquiescence to the rate increases constitutes acceptance of the new contractual term.", "No, Big Firm had an ethical duty to remind the clients of the rate increase whenever it occurred.", "No, it is unethical to change fees after the representation has begun, unless the attorney complies with the disclosure and documentation requirements for business transactions with clients."], "e": "⚠ Answer-key warning: The book's keyed answer is debatable. 1.5(b) also requires that any change in the basis or rate 'shall be communicated,' and the readings say the client must be notified (advance notice is better practice). Showing the new rate on the bill is the usual minimum.\n\nUnder ABA Op. 11-458, periodic, incremental increases in a lawyer's regular hourly rates are permissible if the client understood and accepted the practice at the start and the increases are reasonable. Big Firm disclosed its 2% annual increase in the engagement documents, so the increases themselves are proper. Client silence alone wouldn't create a new contract term, and 1.8(a) doesn't govern ordinary fee changes. Book cite: Rule 1.5(b); ABA Formal Op. 11-458. [W5:5]", "r": "Stevenson, 500 MPRE Questions (2019) Q112 · Rule 1.5 Fees"},
{"t": "fee", "q": "A new federal Treasury Regulation provides that attorneys who prevail in tax cases on behalf of their clients against the Revenue Service may receive attorneys’ fees at the fixed rate of $100 per hour, not to exceed $100,000. A certain attorney lives in a state that allows “reasonable” fees, and he makes a written fee agreement with the client for an additional $100 fee per hour, on top of whatever fees the Treasury Regulations allow in their case. If the client provides written informed consent, could the attorney be subject to discipline for this fee agreement?", "a": ["Yes, because state rules about legal fees are subject to limitations by applicable law, such as government regulations regarding fees in certain tax matters.", "Yes, because tax matters require a contingent fee agreement, not an hourly rate, lest attorneys have a temptation to drag out the case to drive up their collectable fees.", "No, so long as the fee agreement incorporates the federal regulation by reference, it is permissible for clients and lawyers to make a private agreement for additional compensation to the lawyer.", "No, so long as the total fees paid do not exceed $100,000."], "e": "A fee must comply with applicable law as well as 1.5(a), and the comments note that statutes and regulations may cap fees in certain matters. Those limits bind whether or not the client consents. If the Treasury Regulation fixes the fee at $100 an hour, a private agreement for another $100 an hour exceeds the legal limit, so the attorney is subject to discipline even with written consent. Incorporating the regulation by reference or staying under the dollar cap doesn't fix it, and no rule requires contingent fees in tax cases. Book cite: Rule 1.5 cmt. [3]. [W5:12; outline VIII-B]", "r": "Stevenson, 500 MPRE Questions (2019) Q113 · Rule 1.5 Fees"},
{"t": "fee", "q": "An attorney worked as a purchaser for Conglomerate Corporation for many years before law school. After graduating and becoming a licensed practitioner, the attorney opened his own firm and represented many of Conglomerate Corporation’s outside vendors in their contractual disputes with Conglomerate. In fact, the attorney advertised every month in local trade journals that he was a former purchaser for Conglomerate Corporation and could provide “affordable and experienced legal representation” to vendors who had legal disputes with corporations like Conglomerate. Regarding fees, the attorney would tell prospective clients that he sometimes billed hourly and sometimes charged a flat fee, depending on the complexity and time demands of each matter, and that this was difficult to predict beforehand. If this uncertainty was acceptable to the client, the attorney would agree to represent the individual. After the representation was complete, the attorney would decide how to bill the client. Is it proper for the attorney to handle fees in this manner?", "a": ["No, the attorney must inform the client of the basis or rate of the fee and expenses before or within a reasonable time after commencing the representation.", "Yes, so long as the fees and expenses are consistently reasonable, and each client consents.", "Yes, so long as the attorney does not base the decision on whether to charge an hourly rate or a flat fee on which will be higher.", "No, hourly fee agreements must be in writing, signed by the client at the outset of the representation."], "e": "1.5(b) requires telling the client the scope and the basis or rate of the fee and expenses before or within a reasonable time after the representation begins, preferably in writing. Saying only that he might bill hourly or flat, and deciding which after the work is done, leaves the basis of the fee unknown until it's too late. That violates 1.5(b) even if the final amount is reasonable. Hourly agreements don't have to be signed writings; only contingent fees require that. Book cite: Rule 1.5(b). [W5:3–5; outline VIII-A]", "r": "Stevenson, 500 MPRE Questions (2019) Q114 · Rule 1.5 Fees"},
{"t": "fee", "q": "An attorney had her own firm, and she employed a paralegal who had previously worked for another firm. The attorney agreed to represent two new clients: a plaintiff in a personal injury lawsuit, and a seller in commercial real estate transaction. The personal injury plaintiff had a case that was unlikely to succeed due to evidentiary problems, though it was legally valid and factually plausible. The attorney wanted to charge a fixed, non-contingent fee up front for this case, and the client reluctantly agreed. The seller of the commercial real estate, on the other hand, was in a hurry to complete the deal and wanted to liquidate the asset for more than its fair market value, which was possible but also unlikely to succeed. The attorney offered to handle the transaction on a contingency fee basis. If she could negotiate with prospective buyers and convince one to buy the property immediately for a price above the appraised value, she would receive thirty percent of the sale price as a fee, but if it sold at or below the market value, or took more than two months to sell, the attorney would receive only reimbursement for the transaction's costs and expenses. The paralegal told the attorney that these fee agreements were impermissible, because personal injury plaintiff's normally paid contingent fees, and real estate transactions had to be on a fixed or hourly fee basis. The attorney disagreed, but she did not check the ethical rules herself to confirm this. Which of the following is correct?", "a": ["It is proper to charge a plaintiff in a personal injury case a flat fee regardless of the case outcome, and it is permissible to charge the seller a contingent fee in a real estate transaction.", "The attorney may charge a contingent fee in the personal injury case but not in the real estate transaction.", "It is improper to charge a plaintiff in a personal injury case a flat fee regardless of the case outcome, but it is permissible to charge the seller a contingent fee in a real estate transaction.", "It is improper to charge a plaintiff in a personal injury case a flat fee regardless of the case outcome, and it is impermissible to charge the seller a contingent fee in a real estate transaction."], "e": "No rule requires contingent fees in personal injury cases or forbids them in transactions. A flat fee for a plaintiff's case is fine if it's reasonable and communicated (1.5(a)–(b)). A contingent fee may turn on any lawful contingency, including selling property above appraisal within a set time, if it's reasonable and in a writing signed by the client (1.5(c)). The only categorical bans are on domestic-relations and criminal-defense contingent fees (1.5(d)). The paralegal's rules don't exist. Book cite: Rule 1.5(c). [W5:3, 5–6, 11]", "r": "Stevenson, 500 MPRE Questions (2019) Q115 · Rule 1.5 Fees"},
{"t": "fee", "q": "An attorney worked as an associate for several years at Big Firm, and while she worked there, she started a sexual relationship with one of the clients of the firm, whom the firm had already been representing before she began working there. Nevertheless, the attorney did not make partner at the firm due to this incident, even though it had not resulted in a disciplinary action, so she eventually left and started her own practice. She then made radio commercials to attract new clients to her firm, in which she boasted that she had been an associate at Big Firm, but that she did not make partner there merely because she had sex with a client a few times. This advertisement brought many new male clients to her firm. One day, the attorney was flying cross-country to attend a deposition on behalf of one client. This counted as travel time she would ordinarily bill to that client, as permitted by the ethical rules. During the flight, she decided not to watch the movie or read a book, but to work instead on drafting a motion for another client. Would it be permissible for her to charge both clients, each of whom agreed to hourly billing, for the time during which she was traveling on behalf of one and drafting a document on behalf of the other?", "a": ["No, if the attorney flies for six hours for one client, while working for five hours on behalf of another, she has not earned eleven billable hours.", "Yes, each client is receiving the legal services they paid for during that time.", "Yes, the Model Rules encourage this type of efficiency, because it allows lawyers to provide legal representation to more people who need it.", "No, because the work for which she is charging each client does not relate to the type of legal services she advertised."], "e": "Under ABA Op. 93-379, a lawyer billing hourly may charge only for time actually spent on each client's matter. If she flies six hours for one client while drafting for five hours for another, she hasn't earned eleven billable hours. Charging both clients for the overlapping time is an unreasonable fee (1.5(a)) and a misrepresentation (8.4(c)). The benefit of working efficiently belongs to the clients, not the lawyer. The advertising facts are a distraction. Book cite: Rule 1.5; ABA Formal Op. 93-379. [W5:4, 13; S1:114–115]", "r": "Stevenson, 500 MPRE Questions (2019) Q116 · Rule 1.5 Fees"},
{"t": "fee", "q": "Big Firm hired associates from the top of their class at the most prestigious law schools. Big Firm’s partners often boasted to their clients, truthfully, that all their associates did federal judicial clerkships before joining Big Firm as lawyers. Conglomerate Corporation retained Big Firm regularly as outside legal counsel, partly in reliance on these representations from Big Firm’s partners about the credentials and experience of their associates. On one occasion, an associate at Big Firm did several hours of legal research on a certain topic for one client, Conglomerate Corporation. The research later turned out to be relevant to another client’s legal matter. Would it be permissible for Big Firm to bill the second client, who agreed to pay fees based on the time spent on the case, the same amount for the recycled work product that it charged Conglomerate, the first client, if Conglomerate consented?", "a": ["No, attorneys who reuse old work product have not re-earned the hours previously billed and compensated when they first generated that work product.", "Yes, each client is receiving the legal services they paid for during that time.", "Yes, the Model Rules encourage this type of efficiency, because it allows lawyers to provide legal representation to more people who need it.", "No, it is a conflict of interest for a lawyer to use information gleaned from the representation of one client to benefit another client."], "e": "Under ABA Op. 93-379, a lawyer who reuses old research hasn't re-earned the hours already billed to and paid for by the first client. Billing a second hourly client for that time charges for work not done now, which is unreasonable under 1.5(a), with or without the first client's consent. Reusing general research and know-how for another client is perfectly proper; the problem is billing for it twice. Book cite: Rule 1.5; ABA Formal Op. 93-379. [W3:12; W5:13]", "r": "Stevenson, 500 MPRE Questions (2019) Q117 · Rule 1.5 Fees"},
{"t": "fee", "q": "A certain employee at Big Bank faced criminal charges for alleged embezzlement of bank funds, so she retained an attorney to defend her against the charges for a flat fee of twenty thousand dollars, which the client could pay in monthly installments. The next day, a different Big Bank employee confessed to having taken the money, so the prosecutor dropped the charges against the first suspect, that is, the employee who had hired the attorney. The attorney had done nothing on the case except the original consultation with the bank employee as a prospective client, checking for conflicts of interest, and drafting an appearance for the court. The prosecutor was not aware that the original defendant had retained counsel; the withdrawal of the charges was due solely to another individual confessing to the crime. The attorney did not have to decline any other potential clients when he agreed to undertake the representation. After confirming with the client that the matter was over and further representation was unnecessary, the attorney sent the client a bill for the $15,000 flat fee. Was it proper for the attorney to do this?", "a": ["No, it would be unreasonable for the attorney to charge twenty thousand dollars for doing so little.", "Yes, the fee was reasonable given how quickly the attorney was able to obtain the full amount the client was hoping to recover.", "Yes, but the attorney must share the fee with whatever lawyer is representing the bank employee now facing charges for the same crime, because it was a flat fee for solving a specific legal problem.", "No, the Model Rules prohibit flat fees in criminal cases, as well as monthly repayment plans from criminal defendants."], "e": "Every fee, including a flat fee, must be reasonable (1.5(a)), and charging an unreasonable fee violates the Rule even if it's never collected. The engagement ended the day after it began, with nothing done beyond intake, a conflict check, and an appearance. The lawyer turned down no other work, and the result came from someone else's confession. Billing the full flat fee is unreasonable, and any unearned portion must be refunded (1.5 cmt [4]; 1.16(d)). Flat fees and installment plans are allowed in criminal cases. (The stem gives both $15,000 and $20,000; either is unreasonable here.) Book cite: Restatement § 34. [W5:3–4, 9–10; S5:8]", "r": "Stevenson, 500 MPRE Questions (2019) Q118 · Rule 1.5 Fees"},
{"t": "fee", "q": "A client hired an attorney to represent him in suing his employer for wrongful termination. The attorney proposed a fee arrangement that made the fees contingent on the outcome, and he included in the fee agreement that the attorney would advance the costs of litigation. The attorney lost the case at trial, and the client then refused to pay back the costs that the attorney had advanced beforehand. Can the attorney force the client to repay the litigation costs that the attorney advanced to him?", "a": ["No, because under the fee agreement, the client had to repay the attorney only if they won the case.", "Yes, because even where the fee agreement stipulates that it is a contingent fee, this does not apply to litigation costs that a lawyer advances to a client.", "Yes, because losing the case nullified the contingent fee agreement and created a quantum meruit situation.", "No, because the parties never made a legally binding fee agreement."], "e": "When a fee agreement makes repayment of advanced litigation costs contingent on the outcome, as 1.8(e)(1) allows, the client owes nothing for costs after a loss. The attorney agreed to advance costs under a contingent-fee arrangement, so he bore the risk of losing. Costs are owed regardless of outcome only if a writing signed by the client says so (1.5(c)). A loss doesn't convert the deal into quantum meruit. [W5:7; outline VIII-A]", "r": "Stevenson, 500 MPRE Questions (2019) Q120 · Rule 1.5 Fees"},
{"t": "fee", "q": "An attorney provides itemized billing to her clients: hours worked by partners and associates, expert fees, international phone call charges, court costs, stenographers used in depositions, and so forth. She also includes some itemized prorated charges for overhead costs. Her mobile phone, which she uses exclusively for work, has a plan with a fixed monthly charge and unlimited minutes and data, so she divides her monthly phone bill into hourly increments for each day of the month, and for each hour of time she works on a client’s matter, she bills the client for an hourly increment of her phone bill, even if she did not use the phone during that hour. She reasons that she was paying to have a phone available during that time in case clients needed to reach her, so the clients can share the costs. She takes a similar approach with other fixed overhead costs, like the salaries of her support staff – each client bill has a ten-dollar charge for “general staffing costs.” A nominal charge on each bill is for the administrative costs of billing clients. Could the attorney be subject to discipline for charging clients a share of her overhead costs and operating expenses?", "a": ["Yes, because a lawyer may not charge a client for overhead expenses normally associated with properly maintaining, staffing, and equipping an office.", "Yes, because lawyers may charge clients only for the lawyer’s time (legal fees), expert fees, and court costs.", "No, a lawyer may seek reimbursement for the cost of services performed in-house, such as copying, or for other expenses incurred in- house, such as telephone charges, either by charging a reasonable amount to which the client has agreed in advance or by charging an amount that reasonably reflects the cost incurred by the lawyer.", "No, it is permissible to pass charges through to the client if the client receives a written, itemized bill that specifies the nature of each charge."], "e": "A lawyer may bill a client only for expenses specific to that client's matter, not for general overhead such as the office phone plan, support-staff salaries, and billing costs, which the hourly rate is meant to cover (ABA Op. 93-379). Prorating a flat phone bill across clients and adding 'general staffing costs' to every bill charges overhead as an expense, which is unreasonable under 1.5(a). Itemizing the charges doesn't make them proper. The answer limiting expenses to experts and court costs is too narrow, since actual in-house costs like copying can be billed. Book cite: Rule 1.5; ABA Formal Op. 93-379. [W5:2, 11]", "r": "Stevenson, 500 MPRE Questions (2019) Q121 · Rule 1.5 Fees"},
{"t": "fee", "q": "Boutique Firm charges its clients five dollars per page for photocopies done in-house on the firm’s copiers. All new clients receive a schedule of fees before the representation begins that clearly specifies such charges, and client bills clearly itemize photocopying charges. The charge applies even if the client never sees the photocopies, as when associates conducting research must copy sections of cases, statutes, and regulations, or circulate draft memoranda to other lawyers working on the case. The charge also applies when the firm must produce documents for the other party in response to a discovery request. Boutique Firm set the amount at five-dollar per page, even though photocopies cost the firm only fifteen cents or so per page, because the surcharge generates a side revenue stream for the firm that enables it to charge lower legal fees, and to discourage clients from wasting paper. Boutique Firm is environmentally conscious. Is it permissible for Boutique Firm to assess clients a surcharge per page for photocopies done in-house?", "a": ["No, a lawyer may charge the client no more than the actual cost of making a copy on the photocopy machine plus a reasonable allocation of overhead expenses directly associated with the provision of the service, such as the salary of a full-time photocopy machine operator.", "Yes, a lawyer may seek reimbursement for the cost of services performed in-house, such as copying, or for other expenses incurred in-house, such as telephone charges, either by charging a reasonable amount to which the client has agreed in advance or by charging an amount that reasonably reflects the cost incurred by the lawyer.", "Yes, it is permissible to pass charges through to the client if the lawyer is charging the client on an hourly or itemized basis, but not if the lawyer is charging a contingent fee or a fixed fee for the representation.", "No, because lawyers may charge clients only for the lawyer’s time (legal fees), expert fees, and court costs"], "e": "For in-house services like copying, a lawyer may charge the actual cost plus a reasonable allocation of directly related overhead (ABA Op. 93-379), or a reasonable amount agreed in advance (1.5 cmt [1]). Five dollars a page against a fifteen-cent cost is a profit center, not reimbursement, and disclosing it in advance doesn't make an unreasonable expense reasonable (1.5(a)). Good motives like lowering fees or saving paper don't help. In-house costs can be billed, so the 'only fees, experts, and court costs' answer is wrong. Book cite: Rule 1.5 cmt. [1]; ABA Formal Op. 93-379. [W5:2, 11–12]", "r": "Stevenson, 500 MPRE Questions (2019) Q122 · Rule 1.5 Fees"},
{"t": "fee", "q": "An attorney consulted with a potential client, a plaintiff in a personal injury lawsuit, and the client agreed to pay the attorney a contingent fee based on a percentage of the award in the case, which appeared to be a complicated matter that would necessitate the testimony of experts at trial, and depositions of the experts and other witnesses beforehand. As the consultation concluded, the client and the attorney signed an engagement contract for the provision of legal representation, which stipulated that the attorney would charge a contingent fee based on a percentage (one-third) of the award in the case. The document that the client signed clearly explained the percentage that should accrue to the attorney the event of settlement, trial, or appeal; litigation and other expenses that the attorney would deduct from the recovery; and that such deductions would come out of the total before the calculation of the contingent fee. The letter also discussed all potential expenses for which the client could be liable, if the client prevailed in the case or not. To impress the client, the attorney called the defendant’s counsel in the matter, at the end of the consultation, while the client was still sitting in his office. Over the phone, the attorney explained the plaintiff’s injuries, the medical expenses the plaintiff had incurred, and the one-million-dollar recovery they would seek in the lawsuit they planned to file. The defendant’s lawyer checked with the defendant, who was standing next to him at the time, and then immediately agreed to pay the full amount that the client was seeking to recover – a million dollars – without litigation. Would it be permissible for the attorney to charge the client one-third of the million dollars as a fee, given these facts?", "a": ["No, it is not reasonable for the attorney to charge over three hundred thousand dollars in fees for making one phone call at the end of the first consultation with the client.", "Yes, a fee may be contingent on the outcome of the matter, and the attorney complied with all the requirements in the Model Rules for written disclosures about the terms of the fee.", "Yes, the fee was reasonable given how quickly the attorney was able to obtain the full amount the client was hoping to recover, and the attorney complied with all the requirements in the Model Rules for written disclosures about the terms of the fee.", "No, an attorney cannot charge a contingent fee without first initiating litigation by filing pleadings in court."], "e": "⚠ Answer-key warning: The book's keyed answer is debatable. The readings say contingent fees are usually judged as of the agreement, counting the risk assumed then (Problem 20C-5(c)), so a quick, large settlement isn't automatically unreasonable. This answer rests on the near-total absence of risk or work.\n\n1.5(a) bars charging an unreasonable fee, and ABA Op. 94-389 warns that a contingent fee can be unreasonable when the lawyer takes on little or no real risk or work. Collecting a third of $1 million for one phone call, made minutes after signing, before any work or risk, is the book's example of an unreasonable fee despite a flawless 1.5(c) writing. Contingent fees don't require filing suit first. Book cite: Rule 1.5(a); ABA Formal Op. 94-389. [W5:9–10]", "r": "Stevenson, 500 MPRE Questions (2019) Q123 · Rule 1.5 Fees"},
{"t": "fee", "q": "An attorney had her own firm, and she employed a paralegal who had previously worked for another firm. The attorney agreed to represent two new clients: a plaintiff in a personal injury lawsuit, and a seller in commercial real estate transaction. The personal injury plaintiff had a case that was unlikely to succeed due to evidentiary problems, though it was legally valid and factually plausible. The attorney wanted to charge a fixed, non-contingent fee up front for this case, and the client reluctantly agreed over the phone, though the fee agreement was not in writing. The seller of the commercial real estate, on the other hand, was in a hurry to complete the deal and wanted to liquidate the asset for more than its fair market value, which was possible but not likely to happen. The attorney offered to handle the transaction on a contingency fee basis - if she could negotiate with prospective buyers and convince one to buy the property immediately for a price above the appraised value, she would receive thirty percent of the sale price as a fee, but if it sold at or below the market value, or took more than two months to sell, the attorney would receive only reimbursement for the transaction's costs and expenses. The client agreed to this arrangement over the phone, after the attorney had carefully explained it, though the fee agreement was not in writing. The attorney was successful in both matters, and both clients were satisfied with the results of the attorney’s representation. The paralegal told the attorney that these fee agreements were impermissible, because personal injury plaintiff's normally paid contingent fees, and real estate transactions had to be on a fixed or hourly fee basis. The attorney disagreed, but she did not check the ethical rules herself to confirm this. Which of the following is correct?", "a": ["It was impermissible for the attorney to represent the seller in a commercial real estate transaction on a contingent fee basis without a written fee agreement, signed by the client, stating the method of determining the fee.", "It was impermissible for the attorney to represent the plaintiff in a personal injury case without a written fee agreement, signed by the client, stating shall state the method of determining the fee.", "It was permissible, though not preferable, for the attorney to represent the seller in a commercial real estate transaction on a contingent fee basis without a written fee agreement, signed by the client, stating the method of determining the fee.", "In any representation related to civil litigation, the fee agreement must be in writing, signed by the client, and must state the method of determining the fee, but in representation for a transaction, without litigation, written fee agreements are preferable but not obligatory."], "e": "Any contingent fee, in litigation or a transaction, must be in a writing signed by the client that states the method of determining the fee (1.5(c)). The real estate success fee was agreed only by phone, so it violated 1.5(c), however carefully it was explained and however pleased the client. The personal injury flat fee falls under 1.5(b), which requires only that the basis be communicated, preferably in writing, so the oral agreement there was no violation. The litigation-versus-transaction distinction is made up. Book cite: Rule 1.5(c). [W5:3, 6, 8]", "r": "Stevenson, 500 MPRE Questions (2019) Q124 · Rule 1.5 Fees"},
{"t": "fee", "q": "Big Firm bills most of its clients on an hourly-billing basis, measured in fifteen-minute increments. Most of the firm’s clients are large corporations. Big Firm’s associates have burdensome billable hour requirements, so they spend as many hours as possible on every case, working every angle possible, taking an exhaustive approach to research memoranda, depositions of potential witnesses, and daily written updates to the corporate clients about their matters. The managing partners at Big Firm assign a dozen or more associates to every matter, no matter how small, even if that means some associates are merely double-checking or proofreading the work of other associates. The corporate clients and their insurers pay for these services, and whenever the clients prevail in litigation, they seek attorney’s fees from the losing party. Could Big Firm (or its managing partners) be subject to discipline for charging unreasonable fees?", "a": ["Yes, lawyers should not exploit fee arrangements based primarily on hourly charges by using wasteful procedures.", "Yes, even though the corporate clients are willing purchasers of expensive legal services, when opposing parties lose and must pay attorney’s fees to Big Firm’s clients, they may end up paying law fees they would never have agreed to pay themselves.", "No, corporate clients and liability insurers place a premium on excellent, comprehensive legal work and would prefer their lawyers give too much attention to their matters, rather than not enough.", "No, the alternative is that inexperienced associates would make mistakes and might commit malpractice."], "e": "1.5(a) bars unreasonable fees, and the comments warn lawyers not to exploit hourly billing by using wasteful procedures. Putting a dozen associates on every matter to proofread one another, and chasing every angle to meet billable-hour targets, is exactly that. Clients' and insurers' willingness to pay doesn't make padded time reasonable, and fear of mistakes doesn't justify duplicate work. Fee-shifting to opponents isn't the main reason. Book cite: Rule 1.5 cmt. [5]. [S5:10; W5:11]", "r": "Stevenson, 500 MPRE Questions (2019) Q125 · Rule 1.5 Fees"},
{"t": "fee", "q": "An elderly retiree was reading the newspaper one morning, and he noticed an advertisement by a local attorney offering to write simple wills for $500. The attorney’s name was unfamiliar, but the retiree called the phone number in the ad and asked the attorney to write a simple will for him, and the attorney agreed. Neither party, however, mentioned the advertisement or discussed the attorney’s fees. The lawyer drafted the will, met with the client for signing, and then sent a bill for $1500. Under these circumstances, is the client entitled to pay only $500?", "a": ["Yes, given that the attorney advertised for that amount and the client had seen the ad, the parties have an implicit contract under which the attorney must write the will in exchange for $500.", "Yes, because the client is elderly, and charging $1500 would be unconscionable.", "No, because the client never mentioned the advertisement, and the attorney’s $1500 fee is reasonable.", "No, because fee agreements must be in writing, signed by the client."], "e": "A fee agreement is a contract, read as a reasonable client would understand it, with ambiguities resolved against the lawyer, who had the duty to communicate the fee (1.5(b)). The retiree called in response to an ad offering simple wills for $500, and the attorney took the job without stating a different fee, so the client reasonably understood the advertised price applied. Holding the lawyer to $500 also avoids rewarding a misleading ad (7.1). Age and unconscionability aren't the reason, and non-contingent fees needn't be in a signed writing. Book cite: Restatement § 18. [W5:2, 5]", "r": "Stevenson, 500 MPRE Questions (2019) Q126 · Rule 1.5 Fees"},
{"t": "fee", "q": "A client hired an attorney to represent her in business litigation, as the plaintiff, for a set hourly rate for the fees. By agreement, the fees were not due until the conclusion of the matter and the end of the representation. During the pleading phase of the lawsuit, however, the other party unexpectedly impleaded a third party, which made the case far more complicated and time-consuming for the attorney. The attorney explained the problem to the client, and the two agreed to shift to a contingent-fee arrangement. The attorney carefully explained the tradeoffs involved in the different fee arrangements, and offered to continue, on an hourly basis, but both the client and attorney thought that contingent fees were now more appropriate. The attorney fully complied with the written notice requirements of Rule 1.8(a) for changing fees mid-representation. The following day, in another unexpected development, the opposing party offered to settle for a generous sum, more than the parties thought the case was worth, and the client immediately accepted. Must the client now pay the contingent fee to the attorney, even though the client would have paid significantly less under the original hourly fee agreement?", "a": ["Yes, the fee change was reasonable under these circumstances, and the attorney followed the notice requirements of the Model Rules.", "Yes, because the parties made a valid modification to a contract, which is legally enforceable.", "No, lawyers may not change fee structures mid-representation if the original fee was reasonable at the time the representation began.", "No, the client has a right to pay either the original fee or the modified fee, whichever is lower."], "e": "A mid-representation fee change is enforceable if it's fair and reasonable when made and the client is fully informed, and following 1.8(a)'s procedures satisfies that. The case suddenly grew more complex, the attorney explained the trade-offs and offered to stay hourly, and he met 1.8(a)'s writing requirements, which also supply the client-signed writing 1.5(c) requires for a contingent fee. Reasonableness is judged when the change is made, not by the surprise settlement the next day. Being a contract modification isn't enough on its own. Book cite: Restatement § 18. [W5:8–10; S5:16]", "r": "Stevenson, 500 MPRE Questions (2019) Q127 · Rule 1.5 Fees"},
{"t": "fee", "q": "A certain attorney was a solo practitioner with many years of experience. For the last few years, the attorney represented a local cupcake shop, jointly owned by Susan and Diane. Susan was in a traffic accident while doing a personal errand, but she was driving the delivery van of the cupcake shop. Susan was co-owner of the shop and was therefore free to use the shop’s vehicle for occasional person errands. The police who arrived on the scene determined that Susan was not at fault in the accident. The attorney did not do personal injury litigation, so Susan asked him to refer her to a personal injury lawyer who could represent her at trial. At the same time, Susan insisted that the attorney who handled the business transactional work for the cupcake shop should receive a referral fee, and the attorney is willing to accept joint responsibility for the matter but will not assist in the litigation. The attorney has a reasonable belief that the cupcake shop will not become a party to the matter. Could the attorney be subject to discipline for making the referral and accept a referral fee without first obtaining written, informed consent of the cupcake shop, Diane, and Susan for a potential conflict of interest?", "a": ["No, representation of one client is not directly adverse to another client, and there is not a significant risk that the referral of Susan will be materially limited by attorney’s responsibility to the cupcake shop.", "Yes, because the cupcake shop owns the vehicle that was in the accident, and Diane is co-owner of the shop and its assets, including the vehicle.", "Yes, because the attorney has done other legal work for the cupcake shop and has confidential information that could be prejudicial to the new client.", "No, because the attorney is merely referring the case to another lawyer and not handling the representation, even though he assumes joint responsibility for his passive involvement."], "e": "Under ABA Op. 16-474, a referring lawyer who takes a fee share by assuming joint responsibility under 1.5(e) is treated as if he represented the client, so the conflict rules apply. Susan wasn't at fault and the shop isn't expected to become a party, so representing her isn't directly adverse to the shop and creates no significant risk of material limitation (1.7(a)). No conflict waiver is needed. He still needs Susan's agreement to the fee division, confirmed in writing, and a reasonable total fee. Being only a referrer doesn't exempt him from the conflict analysis. Book cite: ABA Formal Op. 16-474. [W5:17–18; S5:7]", "r": "Stevenson, 500 MPRE Questions (2019) Q128 · Rule 1.5 Fees"},
{"t": "fee", "q": "A certain attorney was a solo practitioner with many years of experience. For the last few years, the attorney represented a local cupcake shop, jointly owned by Susan and Diane. Susan was in a traffic accident while doing a personal errand, but she was driving the delivery van of the cupcake shop. Susan was co-owner of the shop and was therefore free to use the shop’s vehicle for occasional person errands. There is a dispute among the parties involved in the accident about who was at fault. The attorney did not do personal injury litigation, so Susan asked him to refer her to a personal injury lawyer who could represent her at trial. At the same time, Susan insisted that the attorney who handled the business transactional work for the cupcake shop should receive a referral fee, and the attorney is willing to accept joint responsibility for the matter but will not assist in the litigation. The attorney expects the other driver in the accident to file a claim against Susan, and eventually against the cupcake shop as well, as the owner of the vehicle. In that case, the attorney’s duty of loyalty to Susan and the cupcake shop could be in tension, and the attorney could have a material limitation in the representation. Can the attorney make the referral and accept a referral fee, under these circumstances?", "a": ["Yes, if the attorney obtains the informed consent, confirmed in writing, of both the cupcake shop and Susan as potential co- defendants, and otherwise meets the requirements of Model Rule 1.7(b).", "Yes, if Diane gives her personal consent, confirmed in writing, and the other driver also consents.", "No, the clients are likely to become adverse parties in the same litigation.", "No, because there is no way for a solo practitioner to screen himself from the matter and avoid receiving a share of the fees earned for the referral."], "e": "A lawyer who takes a referral fee by assuming joint responsibility is treated, for conflict purposes, as if he represented the referred client (ABA Op. 16-474). Fault is disputed, and the shop, a current client that owns the van, may become a co-defendant whose interests diverge from Susan's. That's a material-limitation conflict under 1.7(a)(2), but it's consentable: with Susan's and the shop's informed consent, confirmed in writing, and compliance with 1.5(e), he may proceed. Diane's personal consent and the other driver's consent are beside the point. Book cite: ABA Formal Op. 16-474. [W5:17–18; S5:7; S3:14]", "r": "Stevenson, 500 MPRE Questions (2019) Q129 · Rule 1.5 Fees"},
{"t": "fee", "q": "A certain attorney was a solo practitioner with many years of experience. For the last few years, the attorney represented a local cupcake shop, jointly owned by Susan and Diane. Susan was in a traffic accident while doing a personal errand, but she was driving the delivery van of the cupcake shop. Susan was co-owner of the shop and was therefore free to use the shop’s vehicle for occasional person errands. There is a dispute among the parties involved in the accident about who was at fault. The attorney did not do personal injury litigation, so Susan asked him to refer her to a personal injury lawyer who could represent her at trial. At the same time, Susan insisted that the attorney who handled the business transactional work for the cupcake shop should receive a referral fee, and the attorney is willing to accept joint responsibility for the matter but will not assist in the litigation. The other driver has already filed a claim against Susan and the cupcake shop, and the attorney can see that Susan’s interests in the suit are adverse to the cupcake shop’s interests. Even though the attorney does not plan to represent the cupcake shop in the lawsuit, the cupcake shop will continue to be the attorney’s client for business and transactional matters. Can the attorney make the referral and accept a referral fee, under these circumstances?", "a": ["Yes, if the attorney obtains the informed consent, confirmed in writing, of both the cupcake shop and Susan as potential co- defendants, and otherwise meets the requirements of Model Rule 1.7(b).", "Yes, if Diane gives her personal consent, confirmed in writing, and the other driver also consents.", "No, the clients are likely to become adverse parties in the same litigation.", "No, because there is no way for a solo practitioner to screen himself from the matter and avoid receiving a share of the fees earned for the referral."], "e": "Once the other driver has sued both Susan and the shop and their interests diverge, assuming joint responsibility for Susan's case while still representing the shop on other matters creates a concurrent conflict (ABA Op. 16-474; 1.7(a)). On the book's view it's still consentable, because he won't represent either party in the lawsuit itself. So he may take the referral fee with both clients' informed consent, confirmed in writing, if he reasonably believes he can meet 1.7(b). The other driver's consent is irrelevant, and screening isn't the issue. Book cite: ABA Formal Op. 16-474. [W5:17–18; S5:7; S3:14]", "r": "Stevenson, 500 MPRE Questions (2019) Q130 · Rule 1.5 Fees"},
{"t": "rel", "q": "An attorney injured his back and leg badly in a car accident. In the aftermath, the attorney became chemically dependent on prescription pain medications. This addiction progressed until it began to affect the attorney’s relationships and work habits. The partners in his firm eventually insisted that the attorney seek professional help, so he enrolled in an outpatient rehab program and a twelve-step support group for painkiller addicts. The supervising psychiatrist in the outpatient program expressed concern about the attorney’s complete dependence on the painkillers and his diminished ability to function physically or mentally. He advised the attorney to take a leave of absence from work, because he did not believe the attorney could competently fulfill his obligations to his clients. This same concern had prompted the attorney’s partners to insist that he seek professional help. Just before enrolling in the outpatient program, a new client had approached the attorney about representing her in a tax dispute with the Internal Revenue Service. The attorney had handled such cases before, but it was not his specialty. The client is so desperate that he tells the attorney privately that he is considering shredding documents to hide some of his tax fraud from the IRS, which the attorney says he should not do, but worries that the client might do it anyway. May the attorney undertake the representation?", "a": ["No, because a physical or mental condition currently materially impairs the lawyer's ability to represent the client.", "Yes, assuming the attorney can acquire the necessary knowledge or expertise through additional research to handle the complexity of the matter on the client’s behalf.", "Yes, because the attorney is getting help for his addiction problem and should recover soon.", "No, because the client has proposed engaging in fraud or criminal activity."], "e": "1.16(a)(2) requires a lawyer to decline or withdraw when his physical or mental condition materially impairs his ability to represent the client. His psychiatrist and partners agree that his dependence currently prevents competent work, so he must not take the case, whatever his past tax experience or his prognosis; a hoped-for recovery doesn't help today's client. The client's talk of shredding isn't the reason, since the client isn't seeking to use the lawyer's services for it and the lawyer told him not to. Book cite: Rule 1.16(a)(2). [W2:32, 62; outline II-A, II-D]", "r": "Stevenson, 500 MPRE Questions (2019) Q131 · Rule 1.16 Declining or Terminating Representation"},
{"t": "rel", "q": "An attorney represented a municipality for several years, in accordance with a contract for legal services. The contract term ended, and the municipality published a new request for proposals, and in the end chose a different lawyer to provide legal services for the next several years. The municipality requested that the attorney (the one whose contract expired) provide the municipality's new counsel with all files - open and closed. The municipality has already paid the attorney in full for all his legal work. Which of the following would the attorney NOT have to provide to the municipality?", "a": ["A general assessment of the municipality or the municipality's matter", "The materials provided to the lawyer by the municipality", "Third party assessments, evaluations, or records paid for by the municipality.", "Legal documents filed with a tribunal, or documents completed and ready for submission to the tribunal."], "e": "Under ABA Op. 15-471, a former client is entitled to what it needs to protect its interests: the materials it supplied, filed or ready-to-file legal documents, executed instruments, third-party assessments it paid for, and the like. The lawyer's own general assessment of the client or its matter isn't something the client must receive. The readings stress that the file belongs to the client and that anything reasonably necessary to protect the client must be handed over, paid for or not. Book cite: ABA Formal Op. 15-471. [W2:70–72; S2:118–126]", "r": "Stevenson, 500 MPRE Questions (2019) Q132 · Rule 1.16 Declining or Terminating Representation"},
