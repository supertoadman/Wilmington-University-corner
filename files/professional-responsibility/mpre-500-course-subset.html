<style>
/* Layout: a single exam-booklet column. Settings strip on top, one question "sheet" at a time, answer-sheet grid below. */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#152033; --muted:#5A6477; --line:#D6DCE5;
  --accent:#1F4FA3; --accent-soft:#E3EAF7; --ok:#1C7A4A; --ok-soft:#E1F2E8; --bad:#B0261D; --bad-soft:#F9E3E1;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141C; --surface:#171F2C; --ink:#E4E9F1; --muted:#98A3B5; --line:#2A3446;
  --accent:#86A9EE; --accent-soft:#1E2B45; --ok:#62C48F; --ok-soft:#15301F; --bad:#F0877E; --bad-soft:#3A1C1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141C; --surface:#171F2C; --ink:#E4E9F1; --muted:#98A3B5; --line:#2A3446;
  --accent:#86A9EE; --accent-soft:#1E2B45; --ok:#62C48F; --ok-soft:#15301F; --bad:#F0877E; --bad-soft:#3A1C1A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px}
h1{font-family:var(--serif);font-weight:700;font-size:1.75rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:.875rem;margin:2px 0 0}
.score{font-family:var(--mono);font-size:.875rem;color:var(--muted);font-variant-numeric:tabular-nums}
.score b{color:var(--ink);font-weight:500}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:.82rem;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:4px 11px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:500}
.chip-warn[aria-pressed="true"]{background:rgba(217,138,0,.16);border-color:#D98A00;color:inherit}
.chip .n{font-family:var(--mono);font-size:.75rem;opacity:.75;margin-left:4px}
.row{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px}
select{font:inherit;font-size:.875rem;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:.85rem;border:0;background:transparent;color:var(--ink);padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.check{display:flex;gap:6px;align-items:center;font-size:.875rem;cursor:pointer}
.btn{font:inherit;font-size:.875rem;font-weight:500;border-radius:6px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:8px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px 20px;display:flex;flex-direction:column;gap:16px}
.meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;font-size:.8rem;color:var(--muted)}
.meta .qn{font-family:var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
.stem{font-family:var(--serif);font-size:1.12rem;line-height:1.6;margin:0;max-width:68ch}
.opts{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;width:100%;text-align:left;font:inherit;font-family:var(--serif);font-size:1rem;line-height:1.5;
  border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);padding:10px 12px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .let{font-family:var(--mono);font-size:.85rem;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.opt .txt{min-width:0}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .let{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .let{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .let{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
/* Cross-out: the toggle beside each option strikes it through while you work the question. */
.opts li{display:flex;gap:6px}
.opts li .opt{flex:1 1 0;min-width:0}
.opt.out .txt{text-decoration:line-through;color:var(--muted)}
.xo{flex:none;width:40px;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--muted);padding:0;cursor:pointer}
.xo:hover{border-color:var(--accent);color:var(--ink)}
.xo[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.xo svg{width:16px;height:16px}
.fb{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.verdict{font-weight:600;font-size:.95rem}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.expl{margin:0;max-width:70ch}
.keywarn{margin:0;max-width:70ch;padding:8px 12px;border-left:4px solid #D98A00;background:rgba(217,138,0,.14);border-radius:4px;font-weight:500}
.cite{font-family:var(--mono);font-size:.8rem;color:var(--accent)}
.nav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.hint{font-size:.78rem;color:var(--muted)}
.hint kbd{font-family:var(--mono);font-size:.72rem;border:1px solid var(--line);border-radius:4px;padding:0 4px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.cell{font-family:var(--mono);font-size:.78rem;font-variant-numeric:tabular-nums;height:32px;border-radius:5px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.cell.ans{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-soft)}
.cell.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-soft)}
.cell.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-soft)}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}

.results h2{font-family:var(--serif);font-size:1.4rem;margin:0}
.big{font-family:var(--serif);font-size:2.6rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.875rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.empty{color:var(--muted);font-style:italic}
@media (max-width:520px){.sheet{padding:18px 14px}.stem{font-size:1.05rem}h1{font-size:1.45rem}}
@media (prefers-reduced-motion:no-preference){.opt{transition:border-color .12s,background .12s}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>MPRE 500: Course Subset</h1>
      <p class="sub">298 of the 500 questions in Stevenson, <i>500 MPRE Practice Questions</i> (2019), limited to what Weeks 1–5 cover · Book answer key · Answer order is randomized on every shuffle</p>
    </div>
    <div class="score" id="score"></div>
  </header>

  <section class="panel" aria-label="Quiz settings">
    <div>
      <p class="label">Topics</p>
      <div class="chips" id="chips"></div>
    </div>
    <div class="row">
      <div class="field">
        <span class="label">Mode</span>
        <div class="seg" id="modeSeg">
          <button type="button" data-mode="study" id="modeStudy">Study (instant feedback)</button>
          <button type="button" data-mode="exam" id="modeExam">Exam (grade at end)</button>
        </div>
      </div>
      <div class="field">
        <label class="label" for="count">Questions</label>
        <select id="count">
          <option value="10">10</option><option value="25">25</option><option value="60">60 (MPRE length)</option><option value="all">All selected</option>
        </select>
      </div>
      <label class="check"><input type="checkbox" id="shuffleQ" checked> Shuffle question order</label>
    </div>
    <div class="btns">
      <button class="btn primary" id="startBtn" type="button">New shuffled set</button>
      <button class="btn" id="reletterBtn" type="button">Reshuffle answer letters</button>
    </div>
  </section>

  <main id="main"></main>

<script>
const TOPICS = {
  reg:  "Ch. 1–3 · Regulation & Discipline",
  hum:  "Ch. 4 · Human Factors & Supervision",
  fid:  "Ch. 5 · Fiduciary Duties & Candor",
  agt:  "Ch. 6 · Agency & Authority",
  comp: "Ch. 7 · Competence, Diligence & Care",
  conf: "Ch. 8 · Confidentiality",
  rel:  "Ch. 9 · Forming, Scope & Ending",
  fee:  "Ch. 20 · Fees & Fee-Sharing",
  prop: "Ch. 21 · Client Property"
};
// Each question: t=topic, q=stem, a=[CORRECT, distractor, distractor, distractor], e=explanation, r=rule cite.
// The correct answer is always a[0] in the data; the display order is randomized.
const QS = [
{"t": "fid", "q": "Mr. Burns, the chief executive officer of Conglomerate Corporation, now faces criminal charges of discussing prices with the president of a competing firm. If found guilty, both Mr. Burns and Conglomerate Corporation will be subject to civil and criminal penalties under state and federal antitrust laws. An attorney has been representing Conglomerate Corporation. She has conducted a thorough investigation of the matter, and she has personally concluded that no such pricing discussions occurred. Both Conglomerate Corporation and Mr. Burns plan to defend on that ground. Mr. Burns has asked the attorney to represent him, as well as Conglomerate Corporation, in the proceedings. The legal and factual defenses of Conglomerate Corporation and Mr. Burns seem completely consistent at the outset of the matter. Would the attorney need to obtain informed consent to a conflict of interest from both Mr. Burns and a separate corporate officer at Conglomerate Corporation before proceeding with this dual representation?", "a": ["Yes, the likelihood of conflicting positions in such matters as plea bargaining requires the attorney to obtain the informed consent of both clients before proceeding with the representation.", "Yes, because it will always be in the best interest of a corporation to blame the individual who acted in the situation, to avoid liability under a theory of respondeat superior.", "No, because their legal and factual assertions appear identical in this case, so the risk of contradiction or adverse positions in the litigation is de minimis.", "No, because no one else at Conglomerate Corporation would be able to provide effective consent to the potential conflict of interest on behalf of the organization, if the chief executive officer has required the dual representation to occur."], "e": "Representing both a corporation and its CEO in a criminal antitrust case is a material-limitation conflict under 1.7(a)(2), even though their defenses line up today. Plea bargaining, cooperation deals, and blame-shifting can split them at any point, and the comments warn that a lawyer should ordinarily decline to represent more than one criminal co-defendant. So both clients must give informed consent, confirmed in writing, and the company's consent must come from an officer other than Burns (MR 1.13(g)). Consistent defenses at the outset don't eliminate the risk. Book cite: Restatement § 131. [W2:81 n.3; W4:7–8; S3:14] (MR 1.7 cmt [23])", "r": "Stevenson, 500 MPRE Questions (2019) Q2 · Rule 1.7 Conflict of Interest"},
{"t": "fid", "q": "Mr. Burns, the chief executive officer of Conglomerate Corporation, now faces criminal charges of discussing prices with the president of a competing firm. If found guilty, both Mr. Burns and Conglomerate Corporation will be subject to civil and criminal penalties under state and federal antitrust laws. An attorney has been representing Conglomerate Corporation. She has conducted a thorough investigation of the matter, and she has personally concluded that such pricing discussions did in fact occur. Both Mr. Burns and Conglomerate Corporation have stopped their denials, and they now concede that the pricing discussions took place. One of Mr. Burns’ defenses will be that the former general counsel of Conglomerate Corporation had advised Mr. Burns that a discussion of general pricing practices with a competitor would not be illegal. In contrast, Conglomerate Corporation denies that this was the legal advice given, and instead asserts that Mr. Burns acted without authority. Given these facts, would it be proper for the attorney to proceed with the dual representation, if both Mr. Burns and a separate corporate officer at Conglomerate provide written consent to any potential conflict of interest between them?", "a": ["No, the conflicting positions between Conglomerate and Mr. Burns are so great that the same lawyer cannot provide adequate legal representation to both, so consent to the conflict is ineffective.", "Yes, because their legal and factual assertions appear identical in this case, so the risk of contradiction or adverse positions in the litigation is de minimis.", "Yes, although the likelihood of conflicting positions in such matters as plea bargaining requires the attorney to obtain the informed consent of both clients before proceeding with the representation, dual representation is permissible if each party consents.", "No, because it will always be in the best interest of a corporation to blame the individual who acted in the situation, to avoid liability under a theory of respondeat superior."], "e": "Once the CEO's defense is that the company's own general counsel approved the conduct, and the company says he acted without authority, the two clients are taking incompatible positions in the same case. No lawyer could reasonably believe she can represent both competently and diligently, so the conflict is nonconsentable under 1.7(b)(1). Written consent from both doesn't cure it, because consent works only for conflicts a lawyer can reasonably manage. Book cite: N.C. Formal Ethics Op. 2018-6. [W4:7–8; S3:14] (1.7(b) consentability isn't discussed in the readings; MR 1.7 cmts [14]–[15], [23])", "r": "Stevenson, 500 MPRE Questions (2019) Q5 · Rule 1.7 Conflict of Interest"},
{"t": "fid", "q": "Big Firm represents hundreds of corporate clients out of a dozen offices in different states. The firm has no formal procedures in place to check for conflicts at the outset of representation for new clients, but the managing partner of the firm has an incredible memory and has never failed to spot a potential conflict of interest in the past. An attorney agrees to represent a new corporate client that owns many subsidiaries, and checks with the managing partner, who assured Attorney there are no potential conflicts. After the new corporate client had disclosed a substantial amount of confidential information, it emerged that some of its subsidiaries were directly adverse to other clients of Big Firm. The attorney was completely unaware of the potential conflicts at the time he agreed to the representation, despite asking the corporate client a few questions about the opposing parties in pending litigation it might have. Will the attorney be subject to discipline for not declining representation in this case?", "a": ["Yes, because ignorance caused by a failure to institute reasonable procedures, appropriate for the size and type of firm and practice, will not excuse a lawyer's violation of the Rules regarding conflicts of interest.", "Yes, because there is a presumption that a company owning several subsidiaries will have at least one adverse interest to other clients of a Big Firm.", "No, as he was unaware of the conflict at the time, but now that the conflict is apparent, Attorney must withdraw from representation", "No, because the attorney at least partly relied upon the managing partner’s prowess in identifying conflicts, given that the managing partner had never before made a mistake."], "e": "Firms must adopt reasonable conflict-checking procedures suited to their size and type of practice, and the comments say ignorance caused by failing to adopt them doesn't excuse a conflict violation. A firm with hundreds of corporate clients across a dozen offices can't rely on one partner's memory, so taking a client directly adverse to existing clients violates 1.7(a)(1). Relying on the managing partner doesn't help, because a system is required, not a person. Partners separately owe reasonable firm-wide measures under 5.1(a). [S1:61, 64; W4:7–8] (MR 1.7 cmt [3])", "r": "Stevenson, 500 MPRE Questions (2019) Q6 · Rule 1.7 Conflict of Interest"},
{"t": "rel", "q": "An attorney sued Giant Company on behalf of a client in a personal injury matter. During the protracted litigation that ensued, Conglomerate bought Giant Company. The attorney was already representing Conglomerate in a regulatory compliance matter before a federal administrative agency. Assuming this development was unforeseeable at the outset of representing the client against Giant Company, will the attorney have the option to withdraw from one of the representations to avoid the conflict?", "a": ["Yes, but the attorney must seek court approval where necessary and take steps to minimize harm to the clients, and he must continue to protect the confidences of the client from whose representation the lawyer has withdrawn.", "Yes, because one matter is in state court and the other matter is a completely unrelated federal administrative proceeding.", "No, if a conflict arises after representation is underway, the lawyer ordinarily must withdraw from the representation of both clients, unless the lawyer has obtained the informed consent of each client at the outset of the representation.", "No, because the federal administrative matter would preempt state tort law under the Supremacy Clause."], "e": "When an unforeseeable event creates a conflict mid-representation (here, one client acquired the company the lawyer is suing for another), the comments let the lawyer withdraw from one of the matters instead of both. Withdrawal comes with conditions: court permission where required (1.16(c)), steps to minimize harm to the dropped client (1.16(d)), and continued confidentiality for that now-former client (1.9(c)). The claim that a mid-stream conflict always forces withdrawal from both misreads the comments, and the different forums don't matter. [W2:57; W3:4; S2:98] (MR 1.7 cmt [5])", "r": "Stevenson, 500 MPRE Questions (2019) Q7 · Rule 1.7 Conflict of Interest"},
{"t": "fid", "q": "A husband and wife decide to divorce and reach an agreement to share the same lawyer in hopes of saving money. They hire an attorney to represent each of them in Family Court for the dissolution of marriage. The attorney explains that there is an obvious conflict of interest here, but the husband and wife insist, and sign informed consent forms waiving the conflict and their rights to assert any future claims related to the conflict. The husband and wife have no children, and they have always kept separate bank accounts. Each purchased their own car from the money in their own bank account and each car’s title is in only one name. They live in an apartment whose lease is expiring soon, so there is no real property to divide. Would it be proper for the attorney to represent both in the divorce?", "a": ["No, because the representation involves the assertion of a claim by one client against another client represented by the lawyer in the same litigation or other proceeding before a tribunal", "Yes, because it appears on these facts that there will be no assets in dispute at all, so the theoretical conflict of interest would have no bearing on their case.", "Yes, because both clients consented in writing, the dual representation does not violate law, and the attorney could have a reasonable belief that he will be able to provide competent and diligent representation to each affected client.", "No, because contingent fees are not permissible in divorce cases, and the husband and wife’s sole motivation in sharing a lawyer was to save money."], "e": "A divorce is one proceeding before a tribunal in which each spouse asserts claims against the other, so representing both is nonconsentable under 1.7(b)(3), however amicable the split and however few the assets. Signed waivers can't cure a conflict the Rule bars regardless of consent. The spouses' waiver of future claims is a separate problem: under 1.8(h)(1) it's improper unless each spouse had independent counsel. [S3:14; W2:55; outline X (can't be consented away)] (MR 1.7(b)(3) and cmt [17])", "r": "Stevenson, 500 MPRE Questions (2019) Q8 · Rule 1.7 Conflict of Interest"},
{"t": "fid", "q": "Three individuals plan to form a joint venture and ask an attorney to represent them in drafting the necessary documents and making the necessary filings with government agencies. They have already agreed that everyone will contribute exactly one-third of the startup funds for the venture, each will own a one-third share, each will have equal control over the Board, and each agrees to indemnify the others for a one- third share of any personal liability related to the joint venture. They have also agreed that they will have no non-compete agreements. The joint venture will hire managers, marketers, and other employees to operate the business. The three individuals are co-owners of a patent that could potentially be very lucrative when they bring it to market, and they have known each other and worked together for a long time. The attorney cannot find any current areas of conflict between them, though he knows that it is technically possible that some unforeseen conflict could arise in the future. The shared objectives and goals of the group lead the attorney to conclude that no conflicts of interest are present and that it would be counterproductive to try to convince each member of the group to sign an informed consent form acknowledging that conflicts of interest exist and that the attorney may still represent everyone at once. May the attorney trust his professional judgment and proceed without obtaining separate consent forms from each person in the joint venture?", "a": ["Yes, because the mere possibility of subsequent harm does not itself require disclosure and consent.", "Yes, if the attorney has a reasonable belief that he will be able to provide competent and diligent representation to each client, because the representation does not involve the assertion of a claim by one client against another client represented by the lawyer in the same litigation or other proceeding before a tribunal.", "No, the situation is likely to limit materially the attorney’s ability to recommend or advocate all potential positions that each might take because of his duty of loyalty to the others; representing the group’s overall interests in effect forecloses alternatives that would otherwise be available to the client.", "No, because the fact that the individuals already decided to create a joint venture, and sought representation together from a single lawyer, constitutes implied consent to the common representation despite any potential conflicts of interest involved."], "e": "A concurrent conflict requires a significant risk of material limitation, and the comments say the mere possibility of later harm doesn't itself require disclosure and consent. These co-owners have already agreed on every term that could divide them (equal shares, equal control, indemnity, no non-competes), so the lawyer can reasonably conclude no conflict currently exists. The 'material limitation' answer fits a group that still has competing terms to negotiate, which isn't this one. [S3:14; W4:7–8] (MR 1.7 cmt [8])", "r": "Stevenson, 500 MPRE Questions (2019) Q9 · Rule 1.7 Conflict of Interest"},
{"t": "fid", "q": "A client owns a partnership share of a closely-held business, and the other partners vote to impose an involuntary buy-out of the client to remove him from the firm. The client is clearly upset about this, but the partnership agreement clearly permits involuntary buyouts by a majority vote of the other shareholders. Then the client hires an attorney to represent him in the buyout transaction, to review the necessary documents and provide legal counsel about it. No litigation is under consideration yet. The attorney’s sister is also a lawyer in that city, at another firm, and the sister represents the other shareholders in the partnership. Nevertheless, the attorney did not disclose that her sister represented the other partners, as she and her sister are not close and rarely speak, and the matter is unlikely to turn into litigation. Is the attorney, or the other lawyers in her firm, subject to disqualification in this matter?", "a": ["The attorney would be subject to disqualification, but ordinarily the other lawyers in her firm would not be subject to disqualification.", "No, because the attorney and her sister are not close enough for there to be a substantial risk that they will share confidential information, and the matter seemed unlikely to turn into litigation.", "No, so long as both sisters give informed consent in writing, and each believes that she will be able to provide competent and diligent representation to her client", "Both the attorney and her firm would be subject to disqualification, because the client did not give written informed consent."], "e": "When closely related lawyers (spouse, parent, child, sibling) represent opposite sides of the same matter, each ordinarily needs her own client's informed consent, because family ties risk divided loyalty and shared confidences. The attorney never even told her client, so she is subject to disqualification. That family-relationship conflict is personal, however, and ordinarily isn't imputed to other lawyers in her firm. How close the sisters actually are doesn't matter, and consent must come from the clients, not the lawyers. [W4:7–8; S3:14] (MR 1.7 cmt [11])", "r": "Stevenson, 500 MPRE Questions (2019) Q10 · Rule 1.7 Conflict of Interest"},
{"t": "fid", "q": "An attorney has applied to make a lateral move from her firm to Big Firm, and she has already gone through the first two of three rounds of interviews for the position. Then the attorney agrees to represent a client in filing a breach of contract claim against Construction Company over a commercial development project. Big Firm is representing Construction Company, and the firm’s lawyers drafted the contract that forms the basis of the client’s complaint. The client claims that Construction Company breached a certain provision of the contract that is ambiguous; Construction Company is confident that its conduct falls within the contractual language in that provision. Is it proper for the attorney to undertake representation of the client in this case?", "a": ["No, because when a lawyer has discussions concerning potential employment with an opponent of the lawyer's client, or with a law firm representing the opponent, such discussions could materially limit the lawyer's representation of the client.", "Yes, assuming the client gives informed consent to the representation despite the conflict of interest here.", "Yes, because there is no clear conflict of interest here, because the attorney has not yet started working at Big Firm and could not have participated at all in drafting the contract provision that is now in dispute.", "No, as during the previous interviews, the attorney was likely to have gleaned some confidential information about Construction Company from Big Firm."], "e": "⚠ Answer-key warning: The book's keyed answer is debatable. A client's informed consent, confirmed in writing, can cure a personal-interest conflict like this, so the consent answer isn't plainly wrong. The book treats the pending job talks as disqualifying.\n\nA lawyer negotiating for a job with the firm that represents her client's opponent has a personal-interest conflict under 1.7(a)(2): hoping for an offer creates a significant risk she'll soften her advocacy against Big Firm's client. As the facts stand, with no disclosure and no consent, she shouldn't take the case. The 'confidential information from the interviews' theory misses the point, because the problem is her own interest, not leaked secrets. [S3:14; W4:7–8] (MR 1.7 cmt [10])", "r": "Stevenson, 500 MPRE Questions (2019) Q11 · Rule 1.7 Conflict of Interest"},
{"t": "fid", "q": "A group of several individuals seeking to form a joint venture asked an attorney to represent them in drafting the necessary documents and making the necessary filings with government agencies. Two of the individuals were to provide most of the initial funds for the startup; two others were experienced inventors who were to provide new product designs; two others had expertise in business management and were to serve as managers; and two had proven records in high-end sales and marketing. They have not yet resolved the allocation of ownership shares, bonuses for managers, whether to have anti-compete agreements for each participant, whether patents will belong solely to the joint venture or partly to the inventors themselves, and whether sales reps will work on salary or commissions. Everyone says that she wants whatever terms would be best for the joint venture overall, rather than what would be most beneficial for each one individually. The shared objectives and goals of the group lead the attorney to conclude that no conflicts of interest are present and that it would be counterproductive to try to convince each member of the group to sign an informed consent form acknowledging that conflicts of interest exist, and that the attorney may still represent everyone at once. May the attorney trust his professional judgment and proceed without obtaining separate consent forms from each person in the joint venture?", "a": ["No, the situation is likely to limit materially Attorney’s ability to recommend or advocate all potential positions that each might take because of his duty of loyalty to the others; representing the group’s overall interests in effect forecloses alternatives that would otherwise be available to the client.", "Yes, because the mere possibility of subsequent harm does not itself require disclosure and consent.", "Yes, assuming the attorney has a reasonable belief that he will be able to provide competent and diligent representation to each client, because the representation does not involve the assertion of a claim by one client against another client represented by the lawyer in the same litigation or other proceeding before a tribunal.", "No, because the fact that the individuals already decided to create a joint venture, and sought representation together from a single lawyer, constitutes implied consent to the common representation despite any potential conflicts of interest involved."], "e": "This venture's members haven't yet resolved the very terms that set them against each other: ownership shares, manager bonuses, non-competes, patent ownership, and sales pay. A lawyer for all eight can't push each member's best position on those issues, so there's a significant risk of material limitation under 1.7(a)(2), and each member must give informed consent, confirmed in writing. A pledge to do what's best for the venture doesn't remove the conflict, and asking for one lawyer isn't implied consent. [S3:14; W4:7–8] (MR 1.7 cmts [8], [28])", "r": "Stevenson, 500 MPRE Questions (2019) Q12 · Rule 1.7 Conflict of Interest"},
{"t": "fid", "q": "Three individuals hire an attorney to represent them as co-defendants in a tort action. At the outset, the attorney tells them that there could be a potential conflict of interest if he represents all three of them, and that they will need to sign informed consent forms, which they do. The three individuals have common goals and interests in the litigation, so they do not hesitate to sign the forms or inquire further about the implications of the potential conflicts. No further discussion occurs about the issue, and Attorney proceeds with the representation. Could the attorney end up having a duty to withdraw from representation later in the litigation, if the clients gave written consent to the shared representation at the outset?", "a": ["Yes, when undertaking representation of multiple clients in a single matter, the information must include the implications of the common representation, including potential effects on loyalty, confidentiality and the attorney-client privilege and the advantages and risks involved.", "Yes, if the liability insurers for the three co- defendants disagree on the terms of settlement and were unincluded in the original written consent.", "No, because the attorney dutifully obtained written consent from each client, as required by the Rules of Professional Conduct.", "No, assuming no situations arise where the lawyer obtains confidential information from one client that he could use to harm the interests of another client, and none of the clients file a cross-claim against another co- defendant."], "e": "Consent to a joint representation counts only if it is informed, meaning the lawyer explained the material risks and the reasonable alternatives (MR 1.0(e)). For multiple clients in one matter, that includes how sharing a lawyer affects loyalty, confidentiality, and the privilege. These clients signed forms with no such explanation, so their consent is weak, and if their interests later diverge the lawyer may have to withdraw. Signatures alone don't satisfy 1.7(b)(4). [W2:54; S3:14] (MR 1.7 cmts [4], [18])", "r": "Stevenson, 500 MPRE Questions (2019) Q13 · Rule 1.7 Conflict of Interest"},
{"t": "fid", "q": "Husband and Wife wanted to hire a certain attorney to prepare their wills. Before the formalities of representation were final, husband spoke with the attorney privately by phone and disclosed that Husband had been having an affair, and that his lover might be pregnant. Husband forbids the attorney to tell Wife about this. Then the attorney realizes there could be potential conflicts of interest between husband and wife about the wills, distribution of assets, potential challenges to the will by offspring from outside the marriage, and potential claims for child support against Husband’s estate. Would it be proper for the attorney to proceed with representing Husband and Wife in preparing their wills?", "a": ["No, because the attorney cannot violate the duty of confidentiality to Husband, which would be necessary to obtain informed consent from Wife.", "Yes, assuming each provides written consent after receiving warnings about the potential conflicts that often emerge in dual representation", "Yes, because this is a transactional matter, not litigation in which adverse claims could arise.", "No, because it would be improper to prepare a will for Husband under such circumstances."], "e": "Husband consulted the attorney about the possible representation, so what he said is protected (1.18(b); 1.6 once he's a client), and he has forbidden telling Wife. But Wife can't give informed consent to a joint estate plan without knowing about the affair and a possible child, facts that bear directly on her will. The comments say common representation will almost certainly be inadequate when one client asks the lawyer to withhold relevant information from the other. Written waivers can't fix this, because the consent wouldn't be informed. [W3:4–5; S3:10; W2:54] (MR 1.7 cmt [31])", "r": "Stevenson, 500 MPRE Questions (2019) Q14 · Rule 1.7 Conflict of Interest"},
{"t": "fid", "q": "Business Manager and Shift Supervisor, who worked at a customer service call-center, became co-defendants in a lawsuit by a disgruntled former employee. The plaintiff claimed to have been the victim of gender discrimination in the form of a hostile work environment, as well as intentional and negligent infliction of emotional distress related to the same factual allegations about her treatment at the workplace. Business Manager hired a certain attorney to represent both himself and the Shift Supervisor, who had been the plaintiff’s direct superior. Based on Business Manager’s initial investigation and review of the personnel files of the plaintiff and the Shift Manager, he believes the allegations are baseless and that the suit will end in a dismissal or summary judgment before trial. Shift Supervisor had a spotless work history, but the plaintiff had numerous interpersonal conflicts with her peers, was frequently late for work or missed work completely, and was the subject of several customer complaints. From his consultations with the defendants, the attorney understood that both Business Manager and Shift Supervisor were equally targets of the complaints. Business Manager and Shift Supervisor both gave the attorney written informed consent to the potential conflicts of interest in having the attorney represent both. Business Manager obtained tentative permission to have the business cover the legal fees for the attorney. Near the end of the discovery phase, however, plaintiff produced numerous inappropriate love letters to her from Shift Supervisor, many with explicit sexual overtures, and a few that sounded threatening based on her lack of response to previous letters. In addition, several co-workers of plaintiff gave depositions explaining that they had witnessed Shift Supervisor engaging in inappropriate and unwanted touching of plaintiff on many occasions. Several also testified that Shift Supervisor would often accost her for ten or fifteen minutes outside, before she could reach her workstation, and that this was the cause of her tardiness for work. Business Manager had never heard about any of these problems before. Moreover, during depositions the plaintiff explained that she always had little contact with Business Manager and had no direct complaints about his treatment of her, and she acknowledged that she had never complained to Business Manager about Shift Supervisor’s harassment of her. She disclosed that Business Manager was a co-defendant only because her attorney believed it was necessary to name someone from upper management in the lawsuit to trigger the legal protections of Title VII and other antidiscrimination laws. Business Manager then revoked his consent to the conflict of interest, explaining that he wanted separate representation from Shift Supervisor. Trial was due to begin two weeks later. Would it be proper for the attorney to continue representing either Shift Supervisor or Business Manager, but withdraw from representing the other?", "a": ["Yes, the attorney can potentially continue representing Shift Supervisor but not Business Manager, given the nature of the conflict, the fact that Business Manager revoked consent because of a material change in circumstances, the expectations of Shift Supervisor, and so on.", "Yes, the attorney can potentially continue to represent Business Manager but not Shift Supervisor, because Shift Supervisor engaged in misconduct that was unknown to Business Manager, and Business Manager is the one who arranged for the payment of the legal fees.", "No, the attorney must petition the court to withdraw from representing both clients, as he has now obtained confidential information about each of them, and one is unwilling to consent to the continued common representation.", "No, the attorney must continue to represent both clients, because it is the eve of trial and withdrawing would be prejudicial to them, and both consented in writing to the potential conflicts involved with using the same lawyer."], "e": "When one client in a joint representation revokes consent, whether the lawyer may keep representing the other depends on the circumstances: the nature of the conflict, whether the revocation came from a material change in circumstances, and the other client's reasonable expectations. Business Manager revoked because of new evidence against Shift Supervisor, a material change. The lawyer can drop him and potentially continue for Shift Supervisor, with court leave if required. Who arranged the fees doesn't determine whom the lawyer stays loyal to. [W2:45; S3:14] (MR 1.7 cmt [21]; 1.16(c))", "r": "Stevenson, 500 MPRE Questions (2019) Q15 · Rule 1.7 Conflict of Interest"},
{"t": "fid", "q": "The Workers’ Union at a manufacturing plant is having annual collective bargaining negotiations with the Management. Wages and benefits are not in dispute this year, as the parties reached an agreement in the previous year’s collective bargaining about a five-year schedule for wages and benefits that was acceptable to both the Union and Management. The sole issue in dispute this year is about hiring. The Workers’ Union wants the plant to hire five or six new assembly line workers so that there will be more efficiency and more flexibility for workers requesting days off or changes in their shifts. The Management wants to hire fewer new workers, potentially two at most, to keep payroll costs down and their stock share prices high. The Union and Management agree to hire a certain attorney, an experienced labor lawyer at an outside firm, to facilitate the collective bargaining negotiations. Neither side is currently expecting a breakdown in bargaining that would lead to litigation. Would it be proper for the attorney to have both the Union and the Management as clients while facilitating the negotiations?", "a": ["Yes, assuming both clients provide written informed consent, common representation is permissible where the clients’ interests mostly align, even though there is some difference in interest among them, so a lawyer may seek an agreement between them on an amicable and mutually advantageous basis", "Yes, because conflicts of interest rules do not apply outside the litigation arena, and the parties here are not litigating and do not expect to litigate, but instead are merely hiring the attorney to facilitate negotiations of an issue where the two sides are not far apart.", "No, because the parties’ interests as directly adverse, and a lawyer may not seek to establish or adjust a relationship between clients on an amicable and mutually advantageous basis.", "No, because conflicts of interest in a negotiation situation are nonconsentable, as no lawyer would be reasonable to believe that the conflict of interest would not materially limit his ability to represent both sides; this is especially true of collective bargaining in the employment context."], "e": "⚠ Answer-key warning: The book's keyed answer is likely wrong. Collective bargaining is a classic adversarial negotiation, and cmt [29] bars common representation where contentious negotiations between the clients are contemplated, so many would treat this as nonconsentable.\n\nThe comments allow common representation where clients are generally aligned in interest even though they differ in some respects. The lawyer may then try to adjust their relationship on an amicable, mutually advantageous basis, with each client's informed consent, confirmed in writing. On the book's view, wages and benefits are settled and only the number of hires is open. Conflicts rules do apply outside litigation. [S3:14; W4:7–8] (MR 1.7 cmts [26], [28])", "r": "Stevenson, 500 MPRE Questions (2019) Q21 · Rule 1.7 Conflict of Interest"},
{"t": "fid", "q": "A certain attorney agrees to represent a group of three individuals in the same matter, a business transaction. Their interests are not directly adverse. This attorney has represented each of the clients in separate matters previously, and he is already working under a retainer to do legal work for each under the same hourly rates. Two of the clients are currently traveling overseas, but everyone agrees to the representation by conference call. The attorney explains potential conflicts of interest that could arise in common representation, and all clients consent orally to the common representation despite the potential conflicts. Then the attorney proceeds with working on their matter for three weeks until all the clients are back from traveling and can sign written consent forms. By that time, the attorney has completed 50 hours of work, and has acquired significant confidential information by and about each of the three clients. Would the attorney be subject to discipline for performing this legal work before obtaining written consent to the conflict by each conflict?", "a": ["No, it was not feasible to obtain or transmit the writing at the time the client gives informed consent, so the lawyer could obtain or transmit it within a reasonable time thereafter.", "Yes, because common representation requires informed consent in writing from each client at the outset of representation.", "Yes, because the fact that it was a transactional matter and not litigation means that the attorney could easily have waited three weeks until all clients could be present to sign written consent forms.", "No, because oral consent to a conflict of interest is enough when the parties are not directly adverse and each already has an established relationship with the attorney."], "e": "'Confirmed in writing' doesn't require the writing at the moment of consent. If it isn't feasible to obtain or send the writing when the client consents orally, the lawyer may do so within a reasonable time afterward (MR 1.0(b)). Informed oral consent came first here, and the writing followed when the travelers returned. The answer that oral consent alone is enough is wrong: 1.7(b)(4) still requires the confirming writing. [S3:14; outline X (formality ladder)] (MR 1.0(b); 1.7 cmt [20])", "r": "Stevenson, 500 MPRE Questions (2019) Q24 · Rule 1.7 Conflict of Interest"},
{"t": "fid", "q": "A municipal election for a seat on the city council was remarkably close one year, resulting in a run-off election that was ever closer. Both candidates claimed victory, and each accused the opposing candidate of voter fraud and violations of various election rules. There is potential for litigation if the two cannot agree as to a winner in the election, with one or the other conceding. A certain attorney is a prominent lawyer in the community and has previously represented each candidate in various legal matters. Both candidates would like to hire the attorney to represent them in negotiating a resolution to the election. Each candidate fully understands their adverse interests and the potential conflicts of interest for the attorney, but each is willing to provide written informed consent to have the attorney represent them both in facilitating the negotiations. May the attorney represent both candidates in this negotiation?", "a": ["No, a lawyer may not represent multiple parties to a negotiation whose interests are fundamentally antagonistic to each other, even in a negotiation.", "Yes, common representation is permissible where the clients’ interests align overall, even though there is some difference in interest among them, so the attorney may pursue an agreement on an amicable and mutually advantageous basis.", "Yes, because conflicts of interest rules do not apply outside the litigation arena; the parties here are not litigating, and no litigation is pending, but instead are merely hiring the attorney to facilitate negotiations of an issue where the two sides are not far apart.", "No, because the fact that the attorney has represented each of the parties in the past means that he would possess confidential information that would make mutual representation nonconsentable in this case."], "e": "Common representation is impossible when the clients' interests are fundamentally antagonistic. The comments say a lawyer can't represent multiple clients where contentious litigation or negotiations between them are imminent or contemplated. Two candidates who each claim victory and accuse the other of fraud are squarely opposed, so no consent makes this workable (1.7(b)(1)). Prior representation of each candidate isn't the problem, and the conflicts rules apply outside court too. [S3:14; W4:7–8] (MR 1.7 cmts [28]–[29])", "r": "Stevenson, 500 MPRE Questions (2019) Q26 · Rule 1.7 Conflict of Interest"},
{"t": "fid", "q": "Two sisters are co-tenants of a house that they inherited from their father. They want to sell the house and hire an attorney to handle the real estate transaction. This attorney explains the potential for conflicts of interest in detail, and each sister readily agrees to provide written informed consent in the form of a waiver of future conflicts of interest. After a prolonged period, they finally find a buyer who is interested in the house, but the buyer wants to impose several onerous conditions on the purchase and engages in unreasonably protracted negotiations over the purchase price. The sisters themselves cannot agree on whether to accept any of the buyer’s proposals, further dooming the negotiations. Eventually, one sister becomes frustrated with the attorney over the prolonged, hitherto unsuccessful negotiations, and fires the attorney. The other sister wants the attorney to continue the representation. Regarding the sister who seeks to discharge the attorney, may she do so?", "a": ["Yes, each client in the common representation has the right to discharge the lawyer as stated in Rules of Professional Conduct and the accompanying Comments.", "Yes, but only if discharging the lawyer will not be prejudicial to the interests of the buyer, who has already invested a lot of time and energy in the negotiations to purchase the property.", "No, because she signed a waiver of future conflicts of interest, which is binding and safeguards the attorney against premature discharge.", "No, because by agreeing to common representation with her sister, she implicitly agreed that discharging the attorney would require assent of both sisters, as they are both clients."], "e": "Each client in a common representation keeps the right to discharge the lawyer at any time, with or without cause (1.16(a)(3)). One sister can fire the attorney without the other's agreement, and an advance conflict waiver doesn't give up that right. The buyer's investment in the negotiations is irrelevant. Whether the attorney may keep representing the other sister is a separate question under 1.9. [W2:61; S3:14] (MR 1.7 cmt [33])", "r": "Stevenson, 500 MPRE Questions (2019) Q27 · Rule 1.7 Conflict of Interest"},
{"t": "fid", "q": "Three co-owners of a successful startup business hire a certain attorney to help with working out the financial reorganization of their enterprise. The attorney seeks to resolve potentially adverse interests by developing the parties' mutual interests. In assenting to represent all the parties as clients simultaneously, the attorney agrees to adjust the relationship between clients on an amicable and mutually advantageous basis. The clients each provide written consent to the potential conflicts of interest. Is it proper for the attorney to represent three clients with potentially adverse interests in a negotiated transaction?", "a": ["Yes, common representation is permissible where the clients’ interests mostly align, even though there is some difference in interest among them, so the attorney may pursue an agreement on an amicable and mutually advantageous basis.", "Yes, because conflicts of interest rules do not apply outside the litigation arena, and the parties here are not litigating and do not expect to litigate, but instead are merely hiring the attorney to facilitate negotiations of an issue where the two sides are not far apart.", "No, because the parties’ interests as directly adverse, and a lawyer may not seek to establish or adjust a relationship between clients on an amicable and mutually advantageous basis.", "No, because conflicts of interest in a negotiation situation are nonconsentable, as no reasonable lawyer would believe that the conflict of interest would not materially limit his ability to represent both sides; this is especially true of collective bargaining in the employment context."], "e": "The comments permit common representation of clients who are generally aligned in interest even if they differ somewhat, so a lawyer may help co-owners restructure their business on an amicable, mutually advantageous basis. If the lawyer reasonably believes she can serve each competently and each gives informed consent, confirmed in writing, it's proper under 1.7(b). Conflicts rules do apply outside litigation, and negotiated deals aren't automatically nonconsentable. [S3:14; W2:81 n.3] (MR 1.7 cmt [28])", "r": "Stevenson, 500 MPRE Questions (2019) Q28 · Rule 1.7 Conflict of Interest"},
{"t": "fid", "q": "An attorney made an agreement to borrow money from a client who had received a large inheritance. The attorney agreed to pay the client the same interest rate that banks in that area were charging for unsecured business loans, and she gave the client a detailed written disclosure of the terms and conditions of the loan, with phrasing that a nonlawyer could understand. The client gave written, signed consent to the essential terms of the loan, including the fact that the attorney was not representing the client in the transaction. During one of their phone conversations about the loan, the attorney also told the client that it would be prudent to obtain the advice of another lawyer about the transaction, and she offered to give the client time to find another lawyer, but the client did not want to do this. Upon consummation of the agreement, the client transferred the loan amount to the attorney, who made regular payments according to the terms of the agreement, eventually repaying the full amount with interest. Based on these facts, could the attorney be subject to discipline for this transaction?", "a": ["Yes, the attorney gave inadequate notice the client regarding the desirability of seeking independent legal counsel for the transaction.", "Yes, it was impermissible for the attorney to borrow money from a current client, even though the attorney fully repaid the loan.", "No, the attorney repaid the loan with interest, so the client suffered no adverse consequences.", "No, the attorney complied with the requirements of the Model Rules for this type of transaction with a client."], "e": "A business transaction with a client, including borrowing from one, must meet all three requirements of 1.8(a): (1) fair terms fully disclosed in writing the client can understand; (2) written advice to seek independent counsel, with a reasonable opportunity to do it; and (3) the client's signed informed consent. The attorney did everything except (2), giving that advice only in a phone call. Fair terms and full repayment don't make up for the missing writing, and borrowing from a client isn't banned outright. Book cite: Rule 1.8(a). [W4:5; outline IV-C]", "r": "Stevenson, 500 MPRE Questions (2019) Q30 · Rule 1.8 Conflicts - Specific Rules"},
{"t": "fid", "q": "An attorney made an agreement to borrow money from a client who had received a large inheritance. The attorney agreed to pay the client the same interest rate that banks in that area were charging for unsecured business loans, and she gave the client a detailed written disclosure of the terms and conditions of the loan, with phrasing that a nonlawyer could understand. The client gave written, signed consent to the essential terms of the loan, including the fact that the attorney was not representing the client in the transaction. During one of their conversations about the loan, the attorney also advised the client in writing that it would be prudent to obtain the advice of another lawyer about the transaction, and she offered to give the client time to find another lawyer, but the client did not want to do this. Upon consummation of the agreement, the client transferred the loan amount to the attorney, who made regular payments according to the terms of the agreement, eventually repaying the full amount with interest. Based on these facts, were the attorney’s actions proper in this transaction?", "a": ["Yes, because the attorney complied with the requirements of the Model Rules for this type of transaction with a client.", "Yes, because the attorney repaid the loan with interest, so the client suffered no adverse consequences.", "No, based on the facts here, the client did not sign the written advisement to seek the opinion of independent legal counsel.", "No, it was impermissible for the attorney to borrow money from a current client, even though the attorney fully repaid the loan."], "e": "Borrowing from a client is permitted when 1.8(a)'s three requirements are met: (1) fair terms fully disclosed in writing the client can understand; (2) written advice to seek independent counsel, with a reasonable opportunity to do it; and (3) the client's signed informed consent to the essential terms and the lawyer's role. All three were met here. The client doesn't have to sign the advisement or actually consult another lawyer. Repayment isn't what makes it proper. Book cite: Rule 1.8(a). [W4:5; outline IV-C]", "r": "Stevenson, 500 MPRE Questions (2019) Q31 · Rule 1.8 Conflicts - Specific Rules"},
{"t": "fid", "q": "An attorney, a venture capitalist, and a land developer agreed to form a corporation to develop a new shopping mall. Their agreement allocates ownership shares based on the appraised value of the venture capitalist’s land, which he is contributing for this enterprise, the market value of the developer’s design and construction work, and the attorney’s regular fees for the hours contributed to the formation and ongoing representation as corporate counsel. The attorney was already representing both the venture capitalist and the developer as his clients in unrelated matters. Which of the following is NOT a duty of the attorney in this situation, if the attorney performs the others?", "a": ["The attorney must withdraw from representing the venture capitalist and the developer on the other matters, at least until the process of forming the corporation is complete, to avoid conflicts of interest.", "The attorney must fully disclose in writing all the terms of the development corporation ownership agreement to the developer and the venture capitalist in language they understand, and the terms of the agreement are objectively fair and reasonable the two clients.", "The attorney must advise the developer and the venture capitalist in writing that they should obtain the advice of independent legal counsel on the transaction, and give them time to do so;", "The venture capitalist and the developer give informed consent, in writing, to the terms of the transaction and the attorney’s role in the transaction, including whether the attorney is representing them in the transaction."], "e": "1.8(a) governs a lawyer's business deal with clients, including taking stock in their venture. The terms must be fair and fully disclosed in writing the clients can understand. The clients must be advised in writing to seek independent counsel and given time to do it. Each must give signed informed consent covering the lawyer's role. Nothing in 1.8(a) requires dropping the clients' unrelated matters, so that's the one listed item that isn't a duty. Book cite: Rule 1.8(a); Restatement § 126. [W4:5; S5:8]", "r": "Stevenson, 500 MPRE Questions (2019) Q32 · Rule 1.8 Conflicts - Specific Rules"},
{"t": "fid", "q": "An attorney represented a client who was a stockbroker in a boundary dispute with the client’s neighbor. Before the conclusion of the representation, the attorney also made some personal investments using the same client’s brokerage services, receiving the same terms, services, and fee waivers that other customers of the brokerage firm received. The attorney did not advise the client to seek the opinion of independent legal counsel for this transaction, and did not obtain signed, written consent from the client about the attorney’s role in the transaction. The terms of the brokerage services agreement were in writing, as usual. Based on these facts, were the attorney’s actions proper in this transaction?", "a": ["Yes, this is a standard commercial transaction between the attorney and the client for a service that the client normally would market to others.", "Yes, because the essential terms of the agreement were in writing, and it does not appear that the attorney charged the client any additional legal fees for this transaction.", "No, because the attorney did not advise the client in writing to seek the opinion of independent legal counsel for this transaction.", "No, the client did not provide signed, written consent regarding about the attorney’s role in the transaction."], "e": "1.8(a) doesn't apply to standard commercial transactions for products or services the client generally sells to others, such as brokerage or banking services, when the lawyer gets the same terms as other customers. The client has no particular vulnerability in such a deal and the lawyer no special leverage, so no written advice or signed consent is needed. The written terms aren't the reason it's proper. Book cite: Rule 1.8(a) cmt. [1]. [W4:5] (MR 1.8 cmt [1])", "r": "Stevenson, 500 MPRE Questions (2019) Q33 · Rule 1.8 Conflicts - Specific Rules"},
{"t": "fid", "q": "A transactional attorney agreed to represent a new client who already had representation by trial counsel on another matter. The client agreed to a complex fee arrangement, which included a fixed flat fee for the first phase of the transaction, a modest hourly rate for the remainder of the transaction, and a modest contingent fee in addition to these other fees, scaled to the outcome of the transaction – that is, a higher contingent fee for obtaining more favorable final terms in the transaction. The attorney did not advise the client to seek the opinion of independent legal counsel for this transaction, and did not obtain signed, written consent from the client about the attorney’s role in the transaction. The client’s other lawyer reviewed the terms of the fee agreement and advised the client to accept it. Based on these facts, could the attorney be subject to discipline for violating the provisions Model Rule 1.8 that govern business transactions with clients?", "a": ["No, because Rule 1.8 does not apply to ordinary fee arrangements between client and lawyer.", "Yes, because the attorney did not advise the client in writing to seek the opinion of independent legal counsel for this transaction.", "Yes, the client did not provide signed, written consent regarding about the attorney’s role in the transaction.", "No, because the client had representation by another lawyer in the transaction."], "e": "1.8(a)'s requirements don't apply to ordinary fee arrangements between client and lawyer. Those are governed by 1.5, including 1.5(c)'s signed-writing rule for any contingent part. A hybrid flat, hourly, and contingent fee is still an ordinary fee agreement, so 1.8 requires no written advice to seek counsel and no signed consent to the lawyer's role. The other lawyer's review isn't the reason. 1.8(a) would apply if the fee were paid in property or an ownership stake. Book cite: Rule 1.8(a) cmt. [1]. [W5:2–8; S5:8]", "r": "Stevenson, 500 MPRE Questions (2019) Q34 · Rule 1.8 Conflicts - Specific Rules"},
{"t": "fid", "q": "A certain client needed to sell a parcel of real estate to pay off a large amount of credit card debt. He brought this situation to the attention of his attorney, who was representing him in his interactions with collection agencies and credit bureaus. The attorney offered to purchase the property immediately for the full amount of the client’s outstanding credit card debt – just over a hundred thousand dollars – without delaying the matter by arranging a mortgage first, or having the property appraised. The client was disappointed, because he thought the property was worth more than that, but he agreed due to his dire financial circumstances. The attorney fully disclosed the terms of the purchase to the client, in understandable written form, and advised the client in writing that it would be prudent to consult with another lawyer about the transaction, which the client could not realistically afford to do. The client gave written, informed consent to the terms of the sale and the attorney’s role in the transaction. Two months later, the attorney sold the property to a developer for three times the amount he had paid for it. Did the attorney act within the requirements of the Model Rules?", "a": ["No, because the transaction was objectively unfair.", "Yes, the lawyer complied with the Model Rules’ notice requirements for business transactions with clients.", "Yes, because the client felt disappointed after the transaction, and the attorney should have given more consideration to the client’s feelings.", "No, because the client could not realistically afford to obtain the advice of independent legal counsel regarding the transaction."], "e": "Every 1.8(a) transaction must be objectively fair and reasonable to the client, in addition to the disclosure, written-advice, and consent requirements. Buying a desperate client's land for the amount of his debt, with no appraisal, and reselling it two months later for three times the price fails that test. Perfect paperwork doesn't save an unfair deal. The independent-counsel requirement is met by written advice and a reasonable opportunity, so the client's inability to pay for a lawyer isn't the defect. Book cite: Committee on Prof. Ethics v. Baker (Iowa 1978); Rule 1.8(a); Restatement § 126. [W4:5; outline IV-C]", "r": "Stevenson, 500 MPRE Questions (2019) Q35 · Rule 1.8 Conflicts - Specific Rules"},
{"t": "fid", "q": "An attorney represented a client in a litigation matter, and while the matter was still pending, the attorney and the client also agreed to purchase an investment property together. The client had another lawyer who regularly represented the client in transactional matters, but not litigation. The litigation attorney and the client contributed equal amounts toward the purchase of the investment property, and each received an equal share. The attorney did not advise the client in writing of the desirability of obtaining the opinion of independent legal counsel in the transaction, but the client nevertheless asked his other lawyer, who handled the client’s transactional matters, to review the terms and render an opinion. The other lawyer provided the client with a written disclosure of the terms and conditions of the agreement and recommended that the client proceed. Did the litigation attorney act properly in this transaction, purchasing an investment property with the client?", "a": ["Yes, because the client had representation by another lawyer in the transaction.", "Yes, because the joint investment did not relate to the attorney’s representation of the client, which pertained to a litigation matter.", "No, because the attorney did not advise the client in writing to seek the opinion of independent legal counsel for this transaction.", "No, because the transaction was not fair and reasonable to the client."], "e": "⚠ Answer-key warning: The book's keyed answer is debatable. 1.8(a)(3) still requires the client's signed informed consent to the terms and the lawyer's role, which the facts don't mention.\n\nIf the client is independently represented in the transaction, 1.8(a)(2)'s written-advice requirement doesn't apply, and the written disclosure under (a)(1) can come from the client's own lawyer. Here the client's transactional lawyer reviewed the deal, disclosed its terms in writing, and recommended it, and equal contributions for equal shares look fair. So the attorney's failure to give written advice doesn't matter. Being unrelated to the litigation doesn't exempt the deal from 1.8(a). Book cite: Rule 1.8(a) cmt. [4]. [W4:5]", "r": "Stevenson, 500 MPRE Questions (2019) Q36 · Rule 1.8 Conflicts - Specific Rules"},
{"t": "fid", "q": "An attorney has a successful blog about legal practice, and the blog generates substantial side income for the attorney. The attorney posts entertaining stories about his clients that attract the attention of his readers and make the blog successful and lucrative. He does not obtain client consent for these posts, but he is careful 1) not to post anything that would seriously injure the client’s reputation or legal interests, and 2) not to post information about individuals that is truly confidential, that is not part of the public record. On the other hand, he does post about his personal observations and opinions of clients and their lifestyles, and often shares generalizations based on confidential information of former clients, such as: “On three occasions I’ve had clients who lived a double life, maintaining separate families in separate cities, and their families never knew.” Another post recounted, “Last year I had a client who admitted after the case ended that he had been sleeping with one of the jurors.” Apart from potential violations of Rule 1.6 (client confidentiality), which of the following is true?", "a": ["The attorney has a common-law fiduciary duty not to profit from using client information even if the use complies with the lawyer's ethical obligations, without accounting to the client for any profits made.", "The attorney may share non-confidential information and opinions about clients in a public forum that generates revenue for the lawyer.", "The attorney can share confidential information about clients on social media after the representation has ended, if the client has refused to pay the legal fees owed to the attorney.", "The attorney can share information on monetized social media about what transpired in the courtroom, except in cases with a sealed record, because normally courtroom proceedings are public."], "e": "Apart from 1.6, a lawyer is a fiduciary who may not profit from a client's information beyond reasonable compensation. Even a use that harms no one and complies with the ethics rules makes the lawyer accountable to the client for any profits. A monetized blog built on client stories triggers that duty to disgorge. The idea that non-confidential opinions about clients are fair game ignores this fiduciary rule, and public courtroom events or unpaid fees aren't licenses either. Book cite: ABA Formal Op. 18-480 n.16 (citing Restatement § 60(2)); D.C. Bar Op. 370. [W3:12; W4:6–7]", "r": "Stevenson, 500 MPRE Questions (2019) Q37 · Rule 1.8 Conflicts - Specific Rules"},
{"t": "fid", "q": "A certain attorney represents a client in a civil suit. The client and the attorney often discuss their hunting trips and have gone hunting together on several occasions. The client tells the attorney he is purchasing a piece of property for hunting with five other people and asks the attorney if he would like to go in on the purchase. The attorney tells the client he would like to join in the purchase and he provides the client with a check for his portion of the purchase price. Is the attorney subject to discipline?", "a": ["No, attorneys can enter into fair and reasonable business transactions with clients, assuming the client receives an advisory in writing of the benefit of seeking advice from independent counsel and gives informed consent, in writing and signed by the client, of the transaction details.", "Yes, attorneys shall not enter into transactions with clients that result in joint ownership of property.", "Yes, attorneys shall not engage in social activities with current clients or enter into transactions that result in joint ownership of property.", "No, attorneys may enter into transactions with clients assuming the transactions are not related to the current representation of the client and the client gives informed consent."], "e": "⚠ Answer-key warning: The book's keyed answer is likely wrong. As written, the attorney just handed over a check, with no written disclosure, written advice, or signed consent. On those facts he would be subject to discipline. The book's answer works only if those 1.8(a) steps were taken.\n\nA lawyer may enter into a business deal with a client, including co-owning land, if 1.8(a)'s requirements are met: fair terms disclosed in writing the client can understand, written advice to seek independent counsel, and the client's signed informed consent. No rule bars socializing or co-owning property with a client, and the deal's being unrelated to the case doesn't exempt it. Book cite: Rule 1.8(a). [W4:5]", "r": "Stevenson, 500 MPRE Questions (2019) Q38 · Rule 1.8 Conflicts - Specific Rules"},
{"t": "fid", "q": "Asylum Now is a nonprofit organization that advocates for refugees and immigrants from poor countries. The Board of Directors for Asylum Now wants to bring a test case in federal court to challenge the constitutionality of detaining refugees who enter the country under duress without a visa. Asylum Now has offered to pay an attorney to seek the release of a certain refugee currently in federal detention, and to use this case to challenge current federal laws and regulations that mandate such detentions. The refugee consents to the representation, as well as the payment of legal fees by Asylum Now, and agrees to have his case be the test case that might benefit others. During the representation, the attorney meets several times with the directors of Asylum Now to discuss how to frame their argument in the case in a way that would shape public policy in the right direction. Is it permissible for the attorney to undertake the representation, given this arrangement?", "a": ["Yes, the attorney may accept payment by Asylum Now and may agree to make contentions that Asylum Now wishes to have tested by the litigation.", "Yes, if the attorney agrees to prioritize the interests of Asylum Now as the payor over the personal wishes of the refugee, who is merely a representative of the larger class of victims that will benefit from the litigation.", "No, a lawyer may not accept compensation for representing a client from one other than the client", "No, a lawyer may accept payment from a third party, but that party cannot ask the lawyer how the representation is progressing."], "e": "A third party, such as an advocacy nonprofit, may pay a client's lawyer if the client gives informed consent, the payor doesn't interfere with the lawyer's independent judgment, and confidentiality is protected (1.8(f); 5.4(c)). With the refugee's consent, the lawyer may also agree to press the legal arguments the organization wants tested. Meeting with the payor about framing is fine so long as the client's interests control. The lawyer may never put the payor's interests ahead of the client's. Book cite: Rule 1.8(f); Restatement § 134. [W2:45, 50; S2:60]", "r": "Stevenson, 500 MPRE Questions (2019) Q39 · Rule 1.8 Conflicts - Specific Rules"},
{"t": "fid", "q": "Conglomerate Corporation hired an attorney to represent one of its employees, a delivery truck driver, who is the defendant in a personal injury lawsuit. The incident that caused the plaintiff’s injury was potentially within the scope of the employee’s duties, and under Conglomerate’s ultimate supervision. Conglomerate’s directors asked the attorney what the truck driver intends to testify about the accident and its surrounding circumstances. The employee consented to having Conglomerate pay his legal fees, but the attorney did not ask the driver specifically about sharing this type of information with Conglomerate during the representation. Would it be improper for the attorney to give this requested information to Conglomerate’s directors?", "a": ["Yes, without specific authorization from the employee-client, the attorney may not disclose to Conglomerate how the employee intends to testify.", "Yes, a lawyer shall not accept compensation for representing a client from one other than the client, especially an employer.", "No, a lawyer may represent a client even when a third person will compensate the lawyer, if the client consents to the other party’s payment.", "No, if the employee authorized the attorney to accept payment from his employer, he impliedly authorized the attorney to disclose otherwise confidential information about the representation to the employer, so that the employer can protect its own legal interests."], "e": "When an employer pays for an employee's defense, the employee alone is the client. 1.8(f)(3) and 1.6 bar telling the payor anything relating to the representation, such as how the client will testify, without the client's informed consent. Consenting to the payment isn't consenting to disclosure, and communications with the payor aren't privileged, so sharing with it could waive the privilege. Third-party payment itself is permitted with consent. Book cite: Rule 1.8(f); Restatement § 134. [W2:45, 49–50; S2:60]", "r": "Stevenson, 500 MPRE Questions (2019) Q40 · Rule 1.8 Conflicts - Specific Rules"},
