{"t": "conf", "q": "An employee of Conglomerate Corporation retained an attorney to advise her about a potential claim against her employer. Like most corporate employees, this client has a cubicle workstation with a computer assigned for her exclusive use at work. Conglomerate Corporation’s written internal policy states that the company has a right of access to all employees' computers and e-mail files, including those relating to employees' personal matters. Nevertheless, all the employees sometimes use of their computers for personal matters, and most send some personal e-mail messages, whether from their personal or office e-mail accounts. The attorney expects that the employee will sometimes use her computer at work to communicate with the lawyer. Does the attorney have an affirmative ethical duty to warn the employee about the risks this practice entails?", "a": ["The attorney has an ethical obligation to warn the client not to communicate about the matter via her work computer through any email account, and a duty to refrain from emailing the client’s workplace email account or responding to emails from the client’s workplace email account.", "The attorney does not need to warn the client because any correspondence between the client and the attorney would have already the protection of attorney-client privilege, even if the employer reads the emails.", "The attorney does not need to warn the client because the pre-existence of the written, internal policy means there is no reasonable expectation of privacy in the emails, and therefore the information would not be confidential.", "The attorney has an ethical duty to warn the client, and a duty to warn the employer that the client’s communications with her attorney are privileged and exempt from the company’s internal policy."], "e": "Under ABA Op. 11-459, when a lawyer knows a client is likely to email from a workplace computer the employer may monitor, the lawyer must warn the client of the risk of losing confidentiality and privilege. The lawyer should also avoid communicating with the client through that channel. This follows from 1.6(c)'s duty to make reasonable efforts to prevent unauthorized access, and the comments call for special precautions when a medium isn't reasonably secure. Privilege can't be assumed, and warning the employer isn't required. Book cite: ABA Formal Op. 11-459. [W3:14–15; S3:32–33]", "r": "Stevenson, 500 MPRE Questions (2019) Q270 · Rule 1.6 Confidentiality"},
{"t": "conf", "q": "An insurance company retained an attorney to defend both the insured employer and one of its employees, whose conduct is at issue and for which the employer might be vicariously liable. During a private consultation with the attorney, the employee recounts some facts about the incident that are self- incriminating. In fact, the confidential information that the employee shared with the attorney suggests that the employee was acting outside the scope of his employment at the time, and his actions were also outside the scope of the employer’s insurance coverage. The employee had a reasonable belief that he had client-lawyer relationship with the attorney, and the employee did not understand the legal implications of his admissions. In subsequent interviews with other witnesses, the attorney corroborated this information. It appeared to the attorney that the insurance company could have a contractual right to deny coverage for the employee’s conduct, and the employer could invoke scope-of- employment principles to defend against its own liability to the plaintiff. What would the ethical rules require the attorney to do under these circumstances?", "a": ["The attorney cannot disclose the information to anyone, and must withdraw from representing the employer, the employee, and the insurer.", "The attorney must disclose the information to the other clients in the representation, that is, the insurer and the employer, because the facts directly impact their legal rights and liabilities.", "The attorney must make a “noisy withdrawal” from representing the employee and the employer, disaffirming any previous statements, information, or opinions rendered in the matter.", "The attorney should reveal only enough information to obtain informed, written consent from the insurer and the employer to continue representing all three in the matter."], "e": "Under ABA Op. 08-450, a lawyer jointly representing an insured employee and the employer, paid by the insurer, may not reveal one client's confidential information to the others without consent. Here the employee's admissions would hurt him on coverage and scope of employment. The clients' interests are now directly opposed, and the lawyer can't keep the confidence while still serving the others' interests, so he must withdraw. Disclosing to get consent would itself breach the confidence. Book cite: ABA Formal Op. 08-450. [W2:45, 49–50; W4:7–8]", "r": "Stevenson, 500 MPRE Questions (2019) Q271 · Rule 1.6 Confidentiality"},
{"t": "conf", "q": "A wealthy client invited his attorney to visit the client’s lavish home, so that they could update the client’s will and other estate planning instruments. They updated these documents every year. On this occasion, a few others were present during their conversation about the client’s estate planning issues: the client’s longtime business partner, the client’s new girlfriend, a housekeeper, one of the client’s grown children, and the client’s personal physician, who had stopped by for a social visit. Two individuals would be necessary to witness the execution of an updated will, so the attorney was glad to have others present. During the conversation, as an aside, the business partner mentioned some upcoming litigation that was in the news, a lawsuit between a major insurance carrier and a pharmaceutical company related to the current epidemic in opioid abuse. No one present was a party to the anticipated litigation, but many investors were following it with great interest. Afterward, the attorney wrote personal notes about the meeting, including who was present and what each person had said. A year later, the client died, and litigation ensued over the client’s estate. Which of the following would apply to the attorney’s notes and mental recollections about the conversation with the client and others that were present?", "a": ["The attorney’s ethical duty of confidentiality to the client.", "The attorney work product doctrine.", "Attorney-client privilege.", "A duty of loyalty to the others present."], "e": "Everything the attorney learned at the meeting is subject to the duty of confidentiality, which covers all information relating to the representation regardless of who else heard it. It isn't privileged, because unnecessary third parties (girlfriend, housekeeper, physician, business partner) were present. It isn't work product, because estate planning wasn't done in anticipation of litigation. The lawyer owes no duty of loyalty to the others present. Confidentiality is the broadest of the three protections. [W3:7, 16–19; S3:37–40]", "r": "Stevenson, 500 MPRE Questions (2019) Q272 · Rule 1.6 Confidentiality"},
{"t": "conf", "q": "An attorney was the managing partner at a firm. The firm had current, up-to-date network security, firewalls, password protection, email encryption, and so on. As managing partner, the attorney would revisit this issue every year in January, checking with the relevant vendors to see if there were important software updates or new products that the firm needed. One January, a vendor was installing new software and discovered that the firm had suffered a significant data breach the previous summer that went unnoticed. Hackers had used sophisticated methods to bypass conventional firewalls and other mainstream security features, and they had accessed confidential client information. The vendor explained to the managing partner that there was no reason for such events to go unnoticed, because low- cost products and services were available to monitor for data breaches. Could the firm, or at least the managing partner, be subject to discipline for failing to monitor for any breaches in data security?", "a": ["Yes, lawyers must employ reasonable efforts to monitor the technology and office resources connected to the internet, external data sources, and external vendors providing services relating to data and the use of data.", "The firm is not subject to discipline, but the clients may demand contractually that the firm constantly monitor for a data breach, and the firm could be liable for malpractice.", "No, the Model Rules require lawyers to have adequate protections against a data security breach, not necessarily to monitor constantly for attacks and breaches.", "Yes, competence in preserving a client’s confidentiality is a strict liability standard and requires the lawyer to be invulnerable or impenetrable"], "e": "1.6(c) requires reasonable efforts to prevent unauthorized access to client information, and 1.1 cmt [8] requires keeping up with technology's risks. ABA Op. 18-483 says that includes reasonable efforts to monitor for breaches, not just firewalls. A breach that went unnoticed for months when low-cost monitoring was available suggests the managing partner fell short (see also 5.1(a)). The standard is reasonableness, not perfection or strict liability, and it's an ethical duty, not merely a contract matter. Book cite: Rule 1.6; ABA Formal Op. 18-483. [W2:7–8, 25 n.12; W3:14–15]", "r": "Stevenson, 500 MPRE Questions (2019) Q273 · Rule 1.6 Confidentiality"},
{"t": "conf", "q": "An attorney was a partner at Big Firm, which represented Conglomerate Corporation in their corporate merger negotiations with Giant Company. Big Firm had state-of-the-art network firewalls, virus protection, password protection, and other data security features in place. Nevertheless, one Friday evening some hackers managed to breach Big Firm’s networks and access client information and partner emails, for purposes of engaging in insider trading. The firm detected the breach within a few hours and notified state and federal law enforcement. The stock exchange had closed for the weekend, and law enforcement managed to apprehend the hackers over the weekend, before they had a chance to review the stolen information and share useful data or engage in illegal stock trades. The clients suffered no losses or adverse effects, but they could have. The partners at Big Firm maintain that they should not be subject to discipline for failure to protect their clients’ confidential information, because they had all the latest data security measures in place, though technology is constantly changing. Are they correct?", "a": ["Yes, unauthorized access to, or disclosure of, client information does not constitute a violation of the Model Rules if the lawyer has made reasonable efforts to prevent the access or disclosure.", "Yes, even if their network security was inadequate, the clients did not in fact suffer any harm to their legal or commercial interests, and the firm responded to the incident promptly enough.", "No, a firm’s competence in preserving a client’s confidentiality is a strict liability standard that requires the lawyer to be invulnerable or impenetrable.", "No, it depends on whether the customers had the level of protection they expected when they hired the firm to represent them."], "e": "The comments to 1.6(c) say unauthorized access to client information isn't a violation if the lawyer made reasonable efforts to prevent it. Factors include sensitivity, likelihood of disclosure, cost, and difficulty. State-of-the-art security, prompt detection, and a quick response meet that standard. The test is reasonable effort, not invulnerability. The lack of harm isn't the reason, and neither are client expectations. (Notifying affected clients is a separate 1.4 duty.) Book cite: Rule 1.6(c) cmt. [18]; ABA Formal Op. 18-483. [W3:15; S3:32–33]", "r": "Stevenson, 500 MPRE Questions (2019) Q274 · Rule 1.6 Confidentiality"},
{"t": "conf", "q": "An attorney wrote a confidential email to a client offering legal advice on a tax matter. The client had sought the attorney’s legal opinion on the question. The attorney’s answer relied partly on information that the client had provided, partly on information the attorney himself obtained from third parties, and partly on the attorney’s own legal research on Westlaw. When the IRS later brought an enforcement action against the client, the government lawyers sought discover of this email, hoping to find useful evidence about the defendant’s financial activities and whether the defendant had knowingly violated the tax code. Can the government lawyers obtain the email through discovery?", "a": ["Neither the attorney nor the client would have to disclose or testify about any of its contents.", "The portions of the email relying on information from third parties is discoverable, but the parts relying on the client’s information or the attorney’s own research are privileged.", "Both the attorney and the client would have to disclose the email or testify its contents.", "The client does not have to disclose the email, but the attorney would have to produce it if he still has it."], "e": "The attorney-client privilege covers confidential communications between lawyer and client made to give or obtain legal advice, including the lawyer's advice back to the client. The email is privileged as a whole, so neither the lawyer nor the client can be compelled to disclose it or testify about it. Parts of it can't be split off based on where the lawyer got his information. The underlying facts can still be discovered from other sources. Privilege belongs to the client and binds both. [W3:17; S3:37–38]", "r": "Stevenson, 500 MPRE Questions (2019) Q276 · Attorney-Client Privilege"},
{"t": "conf", "q": "A client kept in his files an old memorandum that the client had prepared for his attorney during an earlier representation by the attorney. After some time, the client takes the memorandum to another lawyer, in confidence, to obtain legal services on a different matter. The memorandum qualified as a privileged communication in the earlier matter. While in the hands of the new lawyer, does the memorandum remain under the protection of privilege?", "a": ["Yes, privilege still applies to the document due to its originally privileged nature.", "Yes, because once privilege attaches to a document, it remains privileged permanently.", "No, the client waived privilege by showing it to another lawyer.", "No, the privilege for the communication with the first attorney ended when the client switched to another lawyer."], "e": "A privileged communication doesn't lose protection when the client shows it in confidence to a new lawyer to get legal advice, because that disclosure is itself within the privilege. The memorandum stays protected in the new lawyer's hands. Changing lawyers doesn't end the original privilege, and showing it to counsel isn't a waiver. Privilege isn't 'permanent' in every case; later voluntary disclosure to outsiders could still waive it. [W3:16–17; S3:38]", "r": "Stevenson, 500 MPRE Questions (2019) Q277 · Attorney-Client Privilege"},
{"t": "conf", "q": "A client confidentially delivered his own business records to his attorney, who specializes in tax matters, to obtain the attorney’s legal advice about taxes. The business records were routine bookkeeping files, not prepared for obtaining legal advice. When the IRS eventually brought an enforcement action against the client and sought production of the business records that the client had provided to the attorney, the attorney asserted that attorney-client privileged protected them from disclosure. Is the attorney correct?", "a": ["No, the records gain no privileged status by the fact that the client delivered them to the attorney to obtain legal advice.", "Yes, the records gain privileged status by the fact that the client delivered them privately to the attorney to obtain legal advice.", "Privilege applies to the records only if the client was anticipating litigation at the time he gave them to the attorney, as opposed to seeking advice about claiming deductions and exemptions.", "Privilege does not apply if the client committed a crime or tax fraud."], "e": "Privilege protects communications made for legal advice, not pre-existing documents. Routine bookkeeping records created for business purposes don't become privileged by being handed to a lawyer, though the client's request for advice may be. The readings make the same point about an existing business email later sent to counsel. Whether litigation was anticipated is a work-product question, and the crime-fraud exception isn't the reason. [W3:17, 19 (Problem 8A-12(f)–(g)); S3:73–75]", "r": "Stevenson, 500 MPRE Questions (2019) Q278 · Attorney-Client Privilege"},
{"t": "conf", "q": "An attorney represented a defendant in a personal-injury action. The client made a confidential communication to the attorney concerning the circumstances of the accident. Later, in the judicial proceedings, the attorney was conducting direct examination of the client, and the client testified about the occurrence. She did not, however, make any reference in her testimony to what she told the attorney previously about the same matter. When the plaintiff’s lawyer began his cross- examination of the client, he asked whether the defendant’s testimony was consistent with the account she previously gave to her attorney in confidence. The defendant’s attorney objects that privilege applies to this conversation, but the plaintiff’s lawyer asserts that the defendant waived privilege by discussing the same things in her court testimony. Which one is correct?", "a": ["The defendant’s attorney is correct that his client did not waive attorney-client privilege by testifying regarding the same facts at trial.", "It depends on whether the facts in question would constitute material questions of fact in the case.", "It depends on whether the client claimed attorney-client privilege for all prior conversations with her attorney before she began testifying about the same events.", "The plaintiff’s lawyer is correct that the defendant opened the door by discussing the same events that she previously discussed with her attorney, thereby waiving privilege for the prior conversations."], "e": "Privilege protects communications, not the underlying facts. A client who testifies about what happened doesn't waive privilege over her earlier confidential conversations with her lawyer about the same events, so she can't be asked what she told her lawyer. Waiver requires voluntarily disclosing the privileged communication itself. Materiality and advance invocation are irrelevant. [W3:16–17; S3:37–38]", "r": "Stevenson, 500 MPRE Questions (2019) Q284 · Attorney-Client Privilege"},
{"t": "conf", "q": "An attorney represented a defendant in a personal-injury action. The client made a confidential communication to the attorney concerning the circumstances of the accident. Later, in the judicial proceedings, the attorney was conducting direct examination of the client, and the client testified about the occurrence. When the plaintiff’s lawyer began his cross-examination of the client, he asked whether the defendant’s testimony was consistent with the account she previously gave to her attorney in confidence. The defendant declared, “I have testified exactly as I told attorney two days after this awful accident occurred. I explained to my attorney then that the skid marks made by the plaintiff's car were 200 feet long, and I have said the same things here.” The plaintiff’s attorney then proceeds to ask questions about the discussions with her attorney, and the defendant’s attorney objected that privilege applies to this conversation. The plaintiff’s lawyer insisted that the defendant waived privilege by discussing the same things in her court testimony. Which one is correct?", "a": ["The plaintiff’s lawyer is correct that the defendant opened the door referencing the previous privileged conversations at trial, thereby waiving privilege for the prior conversations.", "It depends on whether the facts in question would constitute material questions of fact in the case.", "It depends on whether the client claimed attorney-client privilege for all prior conversations with her attorney before she began testifying about the same events.", "The defendant’s attorney is correct that his client did not waive attorney-client privilege by referencing the previous privileged conversations at trial."], "e": "A client waives privilege by voluntarily disclosing the substance of a privileged communication. By testifying that she told her lawyer the same thing two days after the accident and describing what she told him, the defendant put the content of the communication at issue. That opens the door to questions about it, at least on that subject (subject-matter waiver). Testifying about the facts alone wouldn't have waived anything; describing the conversation did. [W3:16–17; S3:38]", "r": "Stevenson, 500 MPRE Questions (2019) Q285 · Attorney-Client Privilege"},
{"t": "conf", "q": "Conglomerate Corporation hired outside counsel to represent the organization in a lawsuit, but part way through the representation, Conglomerate’s managers decided to fire the attorney and hire someone else with more experience. Conglomerate’s former attorney then sued the organization for her unpaid legal fees for the representation up to that point. Conglomerate’s new lawyer subpoenaed the attorney’s time sheets for the billable hours he claimed to have worked for Conglomerate, because the organization believed the attorney was overbilling. The attorney claimed that the time sheets came under attorney-client privilege and refused to disclose them. Is the attorney correct?", "a": ["No, documents and information about billable hours, scheduling, and so forth are not privileged.", "Yes, the attorney’s hourly records are her own work product.", "Yes, because the client and the attorney have become adverse parties in litigation.", "No, because a lawyer cannot invoke privilege without the relevant client’s consent."], "e": "Privilege covers confidential communications made for legal advice, not the fact of representation, fees, or general billing records of hours and scheduling. Time sheets generally reveal no privileged advice, so they're discoverable in the fee dispute (redaction can protect any narrative entries that do reveal advice). Besides, the privilege belongs to the client, and here the client is the one demanding the records. Time sheets aren't the lawyer's protected work product against her own client. [W3:17; S3:37–38] (MR 1.6(b)(5) also lets the lawyer use information in a fee dispute)", "r": "Stevenson, 500 MPRE Questions (2019) Q292 · Attorney-Client Privilege"},
{"t": "conf", "q": "The parents of an autistic child submitted a complaint to a vaccine manufacturer, claiming that its early childhood inoculation for Mumps-Measles- Rubella had caused the child’s autism. The vaccine producer referred the complaint to its legal department. Its in-house counsel investigated the complaint, and eventually concluded that the matter posed no legal issues for the company, because of a federal statute that shields vaccine manufacturers from tort liability, which in turn would preempt any lawsuits in state courts. The attorney wrote a legal memorandum to the company’s management describing his research and conclusions. He included in the memorandum a section about the alleged facts, and another section presenting the legal analysis. If the parents of the child later file a lawsuit anyway, would the facts that the attorney’s memorandum included be discoverable, and admissible at a subsequent trial?", "a": ["Yes, because attorney-client privilege does not apply to underlying facts, even if those facts were under discussion in an otherwise privileged communication.", "Yes, because the lawyer who wrote the memorandum was in-house counsel at the manufacturer, so the company never communicated with an outside law firm seeking legal advice.", "No, because a state statute shielded the manufacturer from liability for injuries from this type of product.", "No, because the communication was part of a private communication between a lawyer and a client who was seeking legal advice."], "e": "Privilege protects communications, not facts. The underlying facts in the lawyer's memo are discoverable through ordinary means (interrogatories, depositions, documents), even though the memo itself, a legal analysis for management, is privileged (Upjohn). In-house counsel's communications can be privileged just like outside counsel's, and statutory immunity from liability has nothing to do with discoverability. Book cite: Bruesewitz v. Wyeth LLC, 562 U.S. 223 (2011). [W3:17; S3:37–38]", "r": "Stevenson, 500 MPRE Questions (2019) Q295 · Attorney-Client Privilege"},
{"t": "conf", "q": "An attorney prepared the policy manuals for a corporate client, an insurance company. The manuals guide the client’s claims adjusters about claims reporting procedures, such as assigning counsel, closing files, reporting bad-faith claims, maintaining records, settlement authority, and so forth. These attorney-drafted policies served the purpose of facilitating the rendition of competent claims handling by the insurer’s employees. When a litigation opponent requests production of these manuals during pre-trial discovery, would they come under attorney-client privilege?", "a": ["No, because the documents were not part of rendering legal advice, but rather for the employees to use in processing claims, and they were not confidential enough to create privilege.", "Yes, because the attorney prepared them on behalf of the client, at the client’s request.", "Yes, because the attorney prepared them as part of rendering legal services to the client, and the manuals were for internal, nonpublic use by the insurance adjusters.", "No, because attorney-client privilege applies only to conversations, not to written documents."], "e": "Privilege requires a confidential communication made to give or obtain legal advice. Claims-handling manuals written for adjusters to follow are operational business guidance, widely circulated for day-to-day use, so they aren't privileged even though a lawyer drafted them at the client's request. Lawyer authorship doesn't make a document privileged. Privilege isn't limited to oral conversations; written communications qualify when the elements are met. Book cite: Medallion Transport & Logistics v. AIG Claims (E.D. Tex. 2018). [W3:17; S3:38]", "r": "Stevenson, 500 MPRE Questions (2019) Q297 · Attorney-Client Privilege"},
{"t": "conf", "q": "Howard Hamlin is a partner at the law firm Hamlin, Hamlin, & McGill (HHM). HHM’s computer network automatically inserts the firm’s “Hamlindigo Blue” logo and letterhead into every email sent from the firm’s email accounts, as well as a legal disclaimer at the end of every email that reads, “NOTICE: This email may contain PRIVILEGED and CONFIDENTIAL information and is only for the use of the specific individual(s) to which it is addressed. If you are not an intended recipient, you must not review, copy, or show the message and any attachments to anyone. Please reply to this e-mail and highlight the mistaken transmission to the sender, and then immediately delete the message.” Attorney Hamlin believes that every email sent by anyone at the firm to anyone outside the firm not be subject to discover, under the doctrine of attorney-client privilege, because each email automatically includes this disclaimer under the sender’s signature line. Is Hamlin correct?", "a": ["No, blanket privilege inscriptions on law firm correspondence do not guarantee that privilege will apply to the contents of the email, because emails sent to non-clients (or copying non-clients as additional recipients) would not be privileged.", "Yes, because the disclaimer informs anyone who reads the email that it is a private communication between the lawyers at the firm and individuals seeking legal assistance.", "Yes, the disclaimer asserts the privilege explicitly, but any emails from a law firm would automatically trigger the attorney-client privilege, even without such a disclaimer.", "No, because the disclaimer appears automatically in every email, so the sender might not have had a subjective intent for the communication to be confidential."], "e": "A disclaimer can't create privilege. Privilege depends on whether the communication is a confidential lawyer-client communication for legal advice. An email to an opposing party, a vendor, or any non-client, or one copying non-clients, isn't privileged no matter what boilerplate the server attaches. The legend at most helps show intended confidentiality for genuinely privileged messages. Law-firm email isn't automatically privileged, and the sender's subjective intent isn't the test. [W3:17; S3:37–38]", "r": "Stevenson, 500 MPRE Questions (2019) Q299 · Attorney-Client Privilege"},
{"t": "conf", "q": "Conglomerate Corporation has several offices around the state. After receiving a few employee complaints about workplace discrimination from one office, Conglomerate’s corporate officers asked the company’s attorney to advise them about potential liability in the matter. The attorney conducted a careful investigation and wrote a thorough memorandum summarizing her findings and legal conclusions. Because the matter involved a commonplace scenario, the attorney thought it would be helpful to give all the company’s human resources managers, in each of its offices statewide, guidance about the issue, so she sent the memorandum to all sixty-two HR managers in Conglomerate’s offices nationwide. When litigation eventually ensued over the alleged discrimination, the plaintiffs sought discovery of the attorney’s memorandum, but Conglomerate attorney asserted attorney-client privilege. Is Conglomerate’s position correct?", "a": ["No, because sending the memorandum to so many employees who had no connection to the matter waived the privilege.", "Yes, because the communication was part of a private communication between a lawyer and a client who was seeking legal advice.", "Yes, because the memorandum was prepared in anticipated of upcoming litigation, and therefore qualifies as attorney work product.", "No, the attorney was investigating a few separate complaints, so the memorandum did not pertain to any specific lawsuit; rather, it was a general inquiry."], "e": "Privilege requires that the communication stay confidential. Within a corporation, sharing legal advice with employees who need it to act on the matter keeps it confidential, but sending a liability memo to sixty-two HR managers with no connection to the complaints spread it beyond those who needed to know. On the book's view that waived the privilege. The memo was a privileged communication when written, and the work-product theory isn't the question asked. [W3:16–17; S3:38]", "r": "Stevenson, 500 MPRE Questions (2019) Q300 · Attorney-Client Privilege"},
{"t": "conf", "q": "An attorney specialized in criminal defense work, and at one point she agreed to represent a client who was multiple charges for gang-related criminal activities. While the client was in county lockup, inmates there from a rival gang assaulted him, necessitating his hospitalization. The attorney visited her client in the hospital to discuss a pending plea offer from the prosecutor. Both the client and the attorney believed, with good reason, that they were having a confidential conversation. Unbeknownst to them, however, a doctor was eavesdropping on their conversation, and the doctor subsequently contacted the prosecutor and repeated the entire conversation. Armed with this new evidence, the prosecutor revoked the pending plea offer, proceeded with the prosecution, and called the doctor to testify at trial about the conversation. The attorney argued that her conversation with her client came under attorney- client privilege and was therefore inadmissible at trial. Is the attorney correct in this assertion?", "a": ["Yes, the attorney and the defendant were reasonable in believing that the conversation was confidential.", "Yes, the information relates to the attorney's representation of the defendant.", "No, the fact that a third party heard the conversation waived attorney-client privilege.", "No, in overhearing the conversation, the doctor did not engage in illegal conduct."], "e": "Privilege attaches when lawyer and client reasonably expect their communication to be confidential. An eavesdropper whose presence they didn't know about and couldn't reasonably anticipate doesn't destroy it. Their hospital-room conversation remains privileged, and the doctor can't testify to it. Disclosure through unforeseeable interception isn't a voluntary waiver. 'Relates to the representation' describes confidentiality, not privilege, and whether the eavesdropping was illegal isn't the test. [W3:17; S3:38]", "r": "Stevenson, 500 MPRE Questions (2019) Q301 · Attorney-Client Privilege"},
{"t": "conf", "q": "A former employee is suing Conglomerate Corporation. The employee claims that Conglomerate fired him as retaliation for uncovering internal corruption at the company. While he still worked for Conglomerate, the employee had several email exchanges with Conglomerate’s in-house counsel about the problems he had uncovered and the consequences for reporting them. Now that litigation has ensued after his termination, he requests production of all his email exchanges with in-house counsel (he no longer has access to the company’s email server). Conglomerate’s lawyers assert that these conversations are privileged, because the emails were between a Conglomerate employee and its corporate counsel. Would the emails come under the protection of attorney-client privilege, given these facts?", "a": ["No, because the privilege belongs to the client, and the plaintiff here owns the privilege.", "Yes, if they were confidential exchanges between a corporate employee and corporate counsel seeking legal advice.", "Yes, if the employee had received instructions from his superiors at Conglomerate to email corporate counsel about his concerns.", "No, one may presume that other individuals have seen the emails, besides the plaintiff and the lawyer by this point."], "e": "⚠ Answer-key warning: The book's keyed answer is likely wrong. Under Upjohn and 1.13(a), in-house counsel represents the company, and an employee's communications with corporate counsel about company matters are ordinarily the company's privilege, which the company may assert. The key is right only if counsel actually represented the employee personally.\n\nOn the book's view, the employee's emails asking in-house counsel about the consequences of reporting corruption were his own requests for legal advice, so the privilege is his and the company can't assert it against him. Privilege belongs to the client. [W3:17; W2:82–83 n.14]", "r": "Stevenson, 500 MPRE Questions (2019) Q302 · Attorney-Client Privilege"},
{"t": "conf", "q": "Two codefendants stood trial on an arson charge, each represented by separate counsel. The first defendant, through his attorney, offered to tell the prosecutor about some valuable eyewitnesses that would help the prosecution’s case against the other defendant, in exchange for a plea agreement that included no jail time for the first defendant. The prosecutor declined the offer and continued with the prosecution of both defendants. The first defendant, who had offered to make the disclosures, died unexpectedly in a violent prison fight. The prosecutor then called the deceased defendant’s attorney and asked him to disclose whatever information he had about these additional witnesses that would strengthen the case against the remaining defendant. The attorney was unsure about whether attorney- client privilege applied, but the prosecutor insisted it did not apply after the defendant’s death. Is the prosecutor correct?", "a": ["No, because the prosecutor declined the offer of disclosure at the time, and the privilege survives the client’s death.", "Yes, the privilege belongs to the client and only a living client can assert privilege.", "Yes, because the client had offered to make the disclosure before his death, and the client's death makes that offer the final word on the client's intention about the disclosure.", "No, because attorney-client privilege does not apply as to co-defendants in the same proceeding."], "e": "The privilege survives the client's death (Swidler & Berlin). The client's offer through counsel to share information in a plea deal was rejected, so the information was never disclosed and the privilege wasn't waived. The prosecutor can't compel the lawyer to reveal it now. A rejected offer to disclose isn't a waiver, and the privilege can be asserted after death on the client's behalf. The co-defendant setting doesn't defeat it. Book note: Swidler & Berlin v. United States, 524 U.S. 399 (1998). [W3:16]", "r": "Stevenson, 500 MPRE Questions (2019) Q303 · Attorney-Client Privilege"},
{"t": "conf", "q": "The corporate officers of a large hospital were trying to decide whether to provide free HBO and Showtime (and other subscription cable channels) to all the televisions in the patient rooms. Corporate counsel participated in these meetings due to his familiarity with the pricing of these channels and what other hospitals in the area were doing in this regard. Later, the hospital finds itself in contract litigation with its cable provider, and the opposing party requests disclosure of the comments and discussion in this meeting. The hospital’s corporate counsel objects that this meeting was privileged communication because of the participation of the attorney in the meeting. Is he correct?", "a": ["No, because the attorney was participating as a business advisor in this meeting, not providing legal services.", "Yes, if the meeting was confidential and the hospital has not waived privilege in the meantime.", "Yes, because the participation of corporate counsel in a management meeting ensures that the discussions are privileged.", "No, because the cable company owns the privilege in this case."], "e": "Privilege covers communications for legal advice, not business advice. In-house counsel sat in on the cable-channel decision for his pricing knowledge and market familiarity, acting as a business adviser, so the discussions aren't privileged even though they were confidential. A lawyer's presence in a meeting doesn't make it privileged. The opposing cable company doesn't own anyone's privilege. [W3:17; S3:37–38]", "r": "Stevenson, 500 MPRE Questions (2019) Q304 · Attorney-Client Privilege"},
{"t": "conf", "q": "An attorney represented a personal injury plaintiff in a lawsuit. While trying to find potential witnesses to support the client’s litigation claims and personal credibility, the attorney met with several people neighbors and friends of the client, asking about the incident that injured the client, as well as the client’s character and past behavior. One of the client’s neighbors told the attorney several disturbing stories about wild parties at the client’s house, and disreputable character who frequently visited the home. Later, at trial, the defendant sought to compel the attorney to disclose the information conveyed by the client’s neighbors. The attorney objected that this information falls under the attorney-client privilege and is therefore inadmissible. Is the attorney correct in this assertion?", "a": ["No, because the information did not come from the client, and therefore attorney client privilege does not apply.", "Yes, because the stories are confidential information related to the representation.", "Yes, assuming the client wants the attorney to keep the information confidential, because the client is the holder of the privilege.", "No, because the attorney-client privilege does not apply during trials, but only to communication outside the courtroom."], "e": "Privilege covers confidential communications between lawyer and client. What the client's neighbors told the attorney didn't come from the client, so it isn't privileged, though it is confidential under 1.6 and may be protected work product (interview notes prepared for litigation). The client's wishes can't turn third-party statements into privileged communications. Privilege does apply at trial, so that distractor is wrong. [W3:7, 17–19; S3:73–75]", "r": "Stevenson, 500 MPRE Questions (2019) Q305 · Attorney-Client Privilege"},
{"t": "conf", "q": "A client had a confidential conversation with his attorney seeking legal advice. The client died a few weeks later. The client had pending litigation at the time of his conversation with the attorney, and the opposing party seeks disclosure of the conversation, because opposing counsel believes the client had instructed the attorney to accept the opposing party’s settlement offer, up to a certain amount. The attorney is continuing the claim on behalf of the client’s estate, and he refuses to settle or to disclose the contents of the conversation. Should the court compel the attorney to reveal whether the client wanted to settle the case before he died?", "a": ["No, because privilege normally survives the death of the client.", "Yes, because the client has absolute control over whether to settle a case or proceed to trial.", "Yes, if the opposing party has some evidence that the deceased client intended to accept the settlement offer that the attorney is now rejecting.", "No, because the decision whether to settle is now up to the decedent’s estate."], "e": "The attorney-client privilege generally survives the client's death (Swidler & Berlin), so the court shouldn't compel the lawyer to disclose the client's confidential instructions on settlement. Most jurisdictions recognize an exception only for testamentary disputes among the client's heirs, which this isn't. The client's authority over settlement and the opponent's suspicion don't overcome the privilege. The estate now controls the litigation and the privilege. [W3:16]", "r": "Stevenson, 500 MPRE Questions (2019) Q306 · Attorney-Client Privilege"},
{"t": "conf", "q": "An attorney sometimes recorded his interviews with clients, after obtaining permission from the client, especially when the client was recounting a long narrative about events that transpired, which had given rise to litigation. The opposing party in one lawsuit sought discovery of the recording of the client’s narrative of the events to the attorney. Which of the following is most likely to result in the recording being discoverable?", "a": ["The client played the recording at home for his friend to get his advice and input.", "There was good reason to believe that the client had told contradictory versions of the story on different occasions.", "The client has died and is unavailable to testify at trial.", "The lawsuit involved some criminal behavior by the client at some point."], "e": "A client waives privilege by voluntarily disclosing the communication to a third party. Playing the recorded interview for a friend to get his input is exactly that, so the recording becomes discoverable. Contradictory stories, the client's death, or later criminal conduct don't by themselves defeat privilege. Only a crime-fraud purpose for the communication would, and the facts don't show one. [W3:17; S3:38]", "r": "Stevenson, 500 MPRE Questions (2019) Q307 · Attorney-Client Privilege"},
{"t": "conf", "q": "Attorney Stevenson works in-house as General Counsel for Conglomerate Corporation. Conglomerate’s Chief Financial Officer (CFO) resigned suddenly. Due to his background in corporate finance and economics, Conglomerate’s Board of Directors asked Attorney Stevenson to serve temporarily as the acting Chief Financial Officer, until they could find a permanent replacement to fill the position. Attorney Stevenson divided his time evenly between corporate financial operations and legal tasks for the company, such as contract review, regulatory compliance, and supervising the outside firms that handle the company’s litigation. His financial responsibilities included reviewing financial reports and forecasts, investment strategy proposals, and various emails or memoranda relating to the firm’s financial affairs. An opposing party in antitrust litigation against the corporation seeks to compel production of some of Attorney Stevenson’s financial reports and strategy proposals, but he claims these come under attorney-client privilege, as he simultaneously serves as the in-house lawyer for Conglomerate Corporation. Are the documents discoverable at trial?", "a": ["Yes, because these are business communications, not legal advice from the lawyer to the client.", "Yes, because there is no indication that the attorney marked these documents as “privileged and confidential” at the time of drafting.", "No, because these are internal communications are between corporate managers and their in- house counsel.", "No, because assuming the documents were not available to all the lower-level employees at the company."], "e": "Privilege protects communications for legal advice, not business communications. As acting CFO, Stevenson's financial reports, forecasts, and investment strategy proposals are business work, so they're discoverable even though he is also general counsel. Courts look at the primary purpose of each communication. The lack of a 'privileged' label isn't the reason, since labels don't control, and being internal to a company isn't enough. [W3:17; S3:37–38]", "r": "Stevenson, 500 MPRE Questions (2019) Q308 · Attorney-Client Privilege"},
{"t": "conf", "q": "Conglomerate Corporation’s recent litigation has received unfavorable media attention, so the corporate directors have hired a public relations firm (Afflatus, Inc.) to handle media relations and help boost the company’s image. The directors have also asked their attorney, who is handling their litigation, to meet with the Afflatus staff, explaining the company’s litigation position and how to answer media inquiries without giving statements that might bind the corporation to a disadvantageous legal position. The attorney opened his presentation with a declaration that the meeting was confidential, and that some of the information shared would be privileged. A few months later, the opposing party learns that this meeting occurred and seeks discovery of the PowerPoint slides the attorney used in the presentation to the public relations firm. Given these facts, would these the slides be discoverable at trial?", "a": ["Yes, because the public relations firm is not the client.", "Yes, because attorney-client privilege would apply only to discussions at the meeting, not to the PowerPoint slides, which anyone could forward to individuals who were not at the private meeting", "No, because the communication was private, between a lawyer and an agent of the client at the client’s direction, and it related to litigation.", "No, because the lawyers explained at the beginning of the private meeting that the contents of their presentation would be privileged and confidential."], "e": "⚠ Answer-key warning: The book's keyed answer is debatable. Some courts protect communications with PR consultants retained to help counsel give legal advice, and attorney-prepared litigation slides might still qualify as work product, since disclosure to a non-adversary doesn't usually waive it.\n\nPrivilege covers confidential communications between lawyer and client, or the client's agents when they're needed to get legal advice. A public relations firm hired to manage media image isn't the client and isn't needed for legal advice, so sharing the litigation presentation with it destroys confidentiality, and on the book's view the slides are discoverable. Announcing that the meeting is privileged doesn't make it so. [W3:17; S3:38]", "r": "Stevenson, 500 MPRE Questions (2019) Q311 · Attorney-Client Privilege"},
{"t": "conf", "q": "Which of the following is NOT one of the elements of the work product doctrine?", "a": ["anticipation of litigation applies to almost any legal work performed for a client, because litigation could eventually arise over any contract, will, or property disposition", "the materials normally must be documents or tangible things", "the materials must be prepared in anticipation of litigation or for trial – that is, the party had reason to anticipate litigation and the primary motivating purpose behind the creation of the document was to aid in potential future litigation.", "the materials must be prepared by or for a party's representative"], "e": "Work product protects (1) documents and tangible things (2) prepared in anticipation of litigation or for trial (3) by or for a party or its representative (FRCP 26(b)(3)). 'Anticipation' means a real prospect of litigation that primarily motivated the document. It doesn't sweep in all legal work just because any contract or will could someday be litigated, so that's the item that isn't an element. The other three choices accurately state the elements. [W3:18; S3:39]", "r": "Stevenson, 500 MPRE Questions (2019) Q320 · Work Product Doctrine"},
{"t": "conf", "q": "Prosecutors from the Department of Justice (DOJ) began an antitrust investigation into Conglomerate Corporation, and the DOJ began questioning some of Conglomerate's business customers. Conglomerate’s attorney prepared a memorandum analyzing the antitrust implications of Conglomerate's standard contract form with commercial purchasers. Soon thereafter, some Conglomerate employees received subpoenas to testify before a grand jury that was investigating the same antitrust issues in their industry. The attorney worried that the grand jury would indict Conglomerate, so she interviewed the employees herself and prepared a debriefing memorandum. Would the attorney’s two memoranda described above come under the protection of the work product doctrine?", "a": ["Both the lawyer's memorandum analyzing the contract form and the lawyer's debriefing memorandum were prepared in anticipation of litigation, because a grand jury proceeding is itself litigation.", "The memorandum analyzing the contract is work product, but not the memorandum summarizing the employee statements.", "The memorandum summarizing the employee statements is work product, but not the memorandum analyzing the contract.", "Neither the lawyer's memorandum analyzing the contract form and the lawyer's debriefing memorandum were prepared in anticipation of litigation."], "e": "A grand jury investigation is litigation for work-product purposes. With DOJ already investigating and subpoenas issued, the lawyer reasonably anticipated an indictment, so both her analysis of the contract form (prepared for that anticipated litigation) and her memo debriefing the subpoenaed employees are protected. The debriefing memo also contains her mental impressions, which get the strongest protection. [W3:18; S3:39]", "r": "Stevenson, 500 MPRE Questions (2019) Q321 · Work Product Doctrine"},
{"t": "conf", "q": "The law school casebook industry was heavily consolidated. Several witnesses testified before a grand jury investigating this specialized publishing industry. Shortly afterward, an attorney for East Publishing Company debriefed the witnesses and wrote memoranda of those interviews in anticipation of the potential indictment of East Publishing, and the anticipated civil suits that could follow. Five years later, some plaintiffs representing a class of law school casebook consumers filed an antitrust class action against East Publishing and sought discovery of the non-opinion work-product portions of the attorney’s debriefing memoranda. The plaintiffs were careful in preparing their case and gathering evidence through other means, and they can show that the witnesses in question were no longer able to remember some of the events to which they testified at the previous grand jury proceeding. Should a court order the attorney to produce the memorandum?", "a": ["Yes, this situation falls under the need-and- hardship exception to the work product doctrine.", "Yes, because the witness statements are only facts, not the attorney’s own thoughts.", "No, because the memorandum is attorney work product.", "No, because the witnesses are still available to testify, even if their memories are fading as time passes, as is true with all witnesses in litigation."], "e": "Fact work product (non-opinion material) yields when the requesting party shows substantial need and can't obtain the substantial equivalent without undue hardship (FRCP 26(b)(3)(A)(ii)). Witnesses who can no longer remember what they testified to years earlier make the contemporaneous debriefing memos the only source, so the court should order production of the non-opinion portions, with the lawyer's mental impressions still shielded. Facts recorded by a lawyer aren't automatically unprotected, and witness availability doesn't help if their memories are gone. [W3:18; S3:40]", "r": "Stevenson, 500 MPRE Questions (2019) Q322 · Work Product Doctrine"},
{"t": "conf", "q": "A defendant accused of bank robbery hired an attorney. The attorney interviewed a bank teller, who witnessed the robbery. The attorney memorialized the conversation in a written memorandum that qualified as work product. Later, during the trial, the same teller testified for the prosecution, and the attorney cross-examined the bank teller by quoting from the teller's prior statement, as memorialized in the memorandum. The bank teller then denied making the statements. In turn, the prosecutor demanded a copy of the document from which the attorney had read statements during the cross- examination, and the attorney objected that the document was attorney work product and therefore not subject to discovery. Is the attorney correct?", "a": ["No, when the attorney chose to ask the teller questions with direct reference to the memorandum, it waived work-product immunity for the portion of the memorandum discussing the teller's story, and any other parts of the document that are necessary to place all the testimony fairly into context.", "Yes, if the attorney prepared the document in anticipation of litigation, the memorandum is work product and is not subject to discovery or compelled disclosure.", "Yes, disclosure would violate the criminal defendant’s right to confront witnesses, guaranteed in the Confrontation Clause of the Sixth Amendment, and the right against self- incrimination, guaranteed in the Fifth Amendment.", "No, the entire document merely summarizes the factual statements of an eyewitness, and it contains no attorney work product."], "e": "Work-product protection can be waived by testimonial use. When defense counsel cross-examined the teller by quoting the memorandum, he waived protection for the parts covering the teller's statements and whatever else is needed to put them in context (United States v. Nobles). A lawyer can't use the document as a sword while shielding it from the opponent. No confrontation or self-incrimination right is implicated. The memo was work product, but the protection gave way here. [W3:18; S3:39–40]", "r": "Stevenson, 500 MPRE Questions (2019) Q323 · Work Product Doctrine"},
{"t": "conf", "q": "The DOJ brought an antitrust suit against Conglomerate Corporation. Giant Company separately sued Conglomerate, mostly alleging the same facts that the DOJ had alleged in its case, and Giant sought parallel relief. An attorney for Giant Company showed the DOJ lawyers some documents that constituted part of the attorney’s work product in Gian Company’s parallel lawsuit against Conglomerate. Giant Company and the DOJ formally agreed that the DOJ would use documents only in litigation against Conglomerate Corporation. Later, however, in the government's case, Conglomerate Corporation sought discovery of Giant Company’s work product, that is, the documents that Giant’s attorney had shared with the DOJ. How should the court rule on this discovery request?", "a": ["Both Giant Company and the DOJ (government)", "Only Giant Company but not the DOJ (government) may properly assert Giant’s work- product protection for the documents.", "Only the DOJ but not Giant Company may properly assert Giant’s work-product protection for the documents.", "Neither Both Giant Company and the DOJ (government) may properly assert Giant’s work- product protection for the documents."], "e": "Work-product protection is waived only by disclosure to an adversary or in a way that substantially increases the chance an adversary will get the material. Sharing with an ally that has a common interest, under an agreement limiting use to litigation against the common opponent, doesn't waive it. Both Giant and the DOJ, sharing a common interest against Conglomerate, may assert Giant's work-product protection. Privilege rules (any disclosure waives) don't govern work product. Book cite: common-interest doctrine. [W3:17–18; S3:38]", "r": "Stevenson, 500 MPRE Questions (2019) Q324 · Work Product Doctrine"},
{"t": "conf", "q": "An attorney had many years of experience in handling personal injury litigation, and in a certain case, the attorney represented a plaintiff in litigation over injuries sustained in a car accident. In preparation for trial, the attorney interviewed each of the eyewitnesses of the accident, and afterward wrote a memorandum summarizing what each witness said. The witnesses themselves agreed to swear and sign the statements, as if they were affidavits. The statements contained no mental impressions of the attorney, only facts communicated by the witnesses. Opposing counsel eventually learned of these interviews and sought discovery of the witness statements that the plaintiff’s attorney had drafted. Unsurprisingly, the attorney objected that these documents were attorney work-product doctrine. Should the court compel the production of the witness statements?", "a": ["No, because the attorney prepared the witness statements on behalf of the plaintiff in anticipation of the litigation.", "Yes, the witnesses themselves have a right to assert protection from disclosure of their statements, but not the attorney.", "Yes, witness statements contain only factual information, and underlying facts do not come under the protection of the work-product doctrine.", "No, lawyers may not discover any materials prepared by the other lawyer in anticipation of litigation."], "e": "Witness statements a lawyer prepares in anticipation of litigation are work product (FRCP 26(b)(3)). The opponent can get them only by showing substantial need and inability to obtain the equivalent without undue hardship, for example by deposing the same witnesses, and nothing shows that here. Each witness may always obtain a copy of his or her own statement, but that's the witness's right, not the opponent's. The facts themselves are discoverable through other means; the documents are protected. [W3:18; S3:39–40; S3:73–75]", "r": "Stevenson, 500 MPRE Questions (2019) Q325 · Work Product Doctrine"},
{"t": "conf", "q": "An attorney agreed to represent a plaintiff who sustained serious injuries three months earlier when she fell through a defective staircase on the defendant’s premises. Her hospitalization after the incident prevented the plaintiff from securing legal representation for twelve weeks. The attorney filed a personal injury lawsuit immediately, and the defendant retained counsel for the litigation in response. The defendant’s lawyer visited the accident scene immediately and took photographs. By that time, the defendant had completely rebuilt the staircase, adding additional handrails, bannisters, and other safeguards. Later, as the litigation proceeded through the discovery phase, the plaintiff’s attorney sought production of defense counsel’s photographs of the scene, and defense counsel objected that the photographs were non-discoverable attorney work product. The attorney for the plaintiff explained in a motion to the court that the lapse of time since the accident prevented the attorney from viewing the accident scene as it was at the time, invoking the need-and-hardship doctrine. Moreover, the plaintiff’s delay in securing counsel was due to her injuries and hospitalization, which were not her fault. How should the court rule?", "a": ["The court should deny the motion because the photos depict a completely different staircase than the one that caused the accident, so they are no more helpful than photos the plaintiff could take now.", "The court should compel production of the photographs because there is no other way for the plaintiff to establish the condition of the staircase at the time of the accident.", "The court should compel production of the photographs because the images themselves do not constitute attorney work product, as they contain no opinions, ideas, or impressions of the lawyer.", "The court should deny the motion because discovery would discourage lawyers from taking their own photographs of accident scenes."], "e": "Fact work product yields only on substantial need, when the equivalent can't be obtained without undue hardship. Defense counsel photographed the staircase after it had already been completely rebuilt, so the photos show the new staircase, which the plaintiff can photograph herself. They give her nothing she can't get, so there's no substantial need and the motion should be denied. Photos taken for litigation are work product even without opinions. Book cite: Fint v. Brayman Construction Corp. (S.D.W. Va. 2018). [W3:18; S3:40]", "r": "Stevenson, 500 MPRE Questions (2019) Q326 · Work Product Doctrine"},
{"t": "conf", "q": "An attorney represented a client in litigation. During the discovery phase of the matter, the opposing party sought to discover communications from a meeting that the attorney had previously organized to prepare for the case. The attorney, an accountant, certain interested creditors, and the bankruptcy liquidation committee members had all attended the meeting, as well as a few others. The attorney resisted discovery based on the work product doctrine. The opposing party countered that the presence of other parties besides the attorney, the client, and their necessary agents waived the privilege. How should the court rule?", "a": ["The court should deny discovery because the work product doctrine protects the information from disclosure.", "The court should compel discovery because the presence of third parties negated to confidentiality requirement for privilege.", "The court should deny the request and not force the attorney to violate the ethical duty of confidentiality.", "The court should first determine whether the discussions pertained primarily to the legal interests of the party seeking discovery."], "e": "Unlike the attorney-client privilege, work product isn't waived just because third parties were present. It's waived only by disclosure to an adversary or in a way that substantially increases the chance an adversary gets it. The accountant, creditors, and committee members were aligned with the client in preparing the case, so the meeting materials stay protected. Confidentiality under 1.6 isn't a discovery shield, and there's no adversary-interest test. Book cite: Firefighters' Retirement System v. Citco Group (M.D. La. 2018). [W3:17–18; S3:40]", "r": "Stevenson, 500 MPRE Questions (2019) Q327 · Work Product Doctrine"},
{"t": "conf", "q": "An attorney agreed to represent a plaintiff who sustained serious injuries three months earlier when she fell through a defective staircase on the defendant’s premises. Her hospitalization after the incident prevented the plaintiff from securing legal representation for twelve weeks. The attorney filed a personal injury lawsuit immediately, and the defendant retained counsel for the litigation in response. The defendant’s lawyer, however, had visited the accident scene immediately after the accident and took photographs. Two weeks later, the defendant completely rebuilt the staircase, adding additional handrails, bannisters, and other safeguards. Later, as the litigation proceeded through the discovery phase, the plaintiff’s attorney sought production of defense counsel’s photographs of the scene, and defense counsel objected that the photographs were non-discoverable attorney work product. The attorney for the plaintiff explained in a motion to the court that the lapse of time since the accident prevented the attorney from viewing the accident scene as it was at the time, invoking the need-and-hardship doctrine. Moreover, the plaintiff’s delay in securing counsel was due to her injuries and hospitalization, which were not her fault. How should the court rule?", "a": ["The court should compel production of the photographs because there is no other way for the plaintiff to establish the condition of the staircase at the time of the accident.", "The court should compel production of the photographs because the images themselves do not constitute attorney work product, as they contain no opinions, ideas, or impressions of the lawyer.", "The court should deny the motion because the photos depict a completely different staircase than the one that caused the accident, so they are no more helpful than photos the plaintiff could take now.", "The court should deny the motion because discovery would discourage lawyers from taking their own photographs of accident scenes."], "e": "Fact work product yields on substantial need and inability to get the equivalent without undue hardship. Defense counsel photographed the staircase right after the accident, two weeks before it was rebuilt, and the plaintiff, hospitalized through no fault of her own, couldn't see it. The photos are the only evidence of its condition, so the court should compel production. Photos taken for litigation are work product even without opinions, and fear of discouraging photography doesn't override need. [W3:18; S3:40]", "r": "Stevenson, 500 MPRE Questions (2019) Q328 · Work Product Doctrine"},
{"t": "conf", "q": "An attorney had a series of private meetings with a client about incorporating the client’s new business venture as an LLC. The attorney kept careful notes of these discussions. Which of the following is true regarding these notes about the conversations between the attorney and the client?", "a": ["The attorney’s notes would come under the protection of the attorney’s duty of confidentiality but not the work product doctrine.", "The attorney’s notes would come under the protection of attorney-client privilege and the work product doctrine.", "The attorney’s notes would come under the protection of the attorney’s duty of confidentiality but not attorney-client privilege.", "The attorney’s notes would not come under the protection of the work product doctrine, nor attorney-client privilege."], "e": "Notes of confidential meetings about forming an LLC are covered by the duty of confidentiality, which applies to all information relating to the representation. They aren't work product, because nothing was prepared in anticipation of litigation: it's transactional work. (The communications they record are also privileged, so the 'not privileged' answers are wrong.) Confidentiality is broader than both protections. [W3:17–19; S3:73–75 (Problem 8A-12(h))]", "r": "Stevenson, 500 MPRE Questions (2019) Q329 · Work Product Doctrine"},
{"t": "conf", "q": "An attorney had a series of private meetings with a client about the subject matter of the representation. The attorney kept careful notes of these discussions, along with the attorney’s reflections and concerns. Sometime later, an opposing party in litigation moved to compel production of these notes. Which of the following is most likely to be a reason that the attorney would assert attorney-client privilege for these notes, rather than claim they are attorney work product?", "a": ["The need and hardship exception.", "The client’s friend had been present during the conversations.", "The representation pertained to anticipated litigation that seemed immediate at the time.", "The client had recounted the conversations to a friend immediately afterward."], "e": "Work product is a qualified protection: fact work product yields to substantial need and undue hardship (opinion work product almost never does). The attorney-client privilege is absolute once established. A lawyer worried that the opponent could show need and hardship would prefer to rest on privilege. A third party's presence or later disclosure to friends would undermine privilege, not favor it, and imminent litigation supports work product. [W3:17–18; S3:40]", "r": "Stevenson, 500 MPRE Questions (2019) Q330 · Work Product Doctrine"},
{"t": "conf", "q": "An attorney had a series of private meetings with a client about the subject matter of the representation. The attorney kept careful notes of these discussions. Sometime later, an opposing party in litigation moved to compel production of these notes. Which of the following is most likely to be a reason that the attorney would try claiming that they are attorney work product, rather than asserting attorney-client privilege for these notes?", "a": ["The client’s friend had been present during the conversations.", "The representation pertained to anticipated litigation that seemed immediate at the time.", "The notes are written documents rather than the attorney’s mental recollections of the meetings.", "The need and hardship exception."], "e": "A third party's presence during a lawyer-client conversation generally destroys the privilege, because the communication wasn't confidential. Work product, however, is waived only by disclosure to adversaries, so notes prepared in anticipation of litigation can still be protected as work product. That's why a friend's presence would push the lawyer toward a work-product claim. The other choices don't distinguish the two doctrines that way. [W3:17–18; S3:38–40]", "r": "Stevenson, 500 MPRE Questions (2019) Q331 · Work Product Doctrine"},
{"t": "conf", "q": "An attorney had a series of private meetings with a client about the subject matter of the representation. The attorney kept careful notes of these discussions, along with some of the attorney’s reflections and ideas. Sometime later, an opposing party in litigation moved to compel production of these notes. Which of the following is most likely to be a reason that the attorney would assert attorney- client privilege for these notes, rather than claim they are attorney work product?", "a": ["The representation pertained to an employee manual that the attorney was drafting for the client’s business.", "The client’s friend had been present during the conversations.", "The client had recounted the conversations to a group of friends immediately afterward.", "The attorney’s firm had an unexpected data breach, despite the firm’s updated firewalls and password protection, and the breach allowed an unknown hacker to access the notes before the litigation began."], "e": "Work product requires preparation in anticipation of litigation. Notes about drafting an employee manual are transactional, so work product is unavailable and the lawyer would have to rely on privilege for the confidential lawyer-client communications. A friend's presence or the client's retelling would undermine privilege, and a hacker's access isn't a voluntary waiver of either protection. [W3:17–19; S3:73–75]", "r": "Stevenson, 500 MPRE Questions (2019) Q332 · Work Product Doctrine"},
{"t": "conf", "q": "For purposes of attorney work product protection, which of the following is NOT likely to create an objectively and subjectively reasonable “anticipation” of litigation:", "a": ["A client who has a history of being extraordinarily litigious.", "An outside event certain to generate litigation", "An adversarial party’s explicit threat", "In some circumstances, a corporate client’s own internal actions gearing up to sue an industry rival"], "e": "Work product requires that litigation be reasonably anticipated, subjectively and objectively, and that this prospect motivated the document. A client's general litigiousness, without a specific dispute, doesn't make litigation over a particular matter reasonably anticipated. An event certain to generate suits, an explicit threat from an adversary, and in some cases a client's own preparations to sue a rival can all suffice. [W3:18; S3:39]", "r": "Stevenson, 500 MPRE Questions (2019) Q333 · Work Product Doctrine"},
{"t": "hum", "q": "An attorney served as the director of the Environmental Enforcement Division of the state Attorney General’s office, which brought legal actions against polluters in the state. The Attorney General’s Office hired only lawyers with three years’ experience or more – they never hired new law school graduates. In the Environmental Enforcement Division, all the lawyers had many years of experience as litigators in that field. The attorney who served as director oversaw the prioritization of cases and implementation of the Attorney General’s policy objectives, and assigned cases to the lawyers in her Division, but did not need to monitor their work, train them in legal ethics, or watch for ethical violations, because all the lawyers were competent and experienced. It turned out, however, that one of the lawyers committed some ethical violations, such as testifying as the key witness in a trial in which he was the attorney of record for the state, which was the plaintiff or prosecuting party in the cases. In another instance, the lawyer brought an enforcement action that had no factual basis in retaliation against an entity that had defrauded the lawyer of a substantial amount of money. When these violations received attention in a local new station expose, the lawyer resigned in disgrace, and the Attorney General took the position that the director of the Environmental Enforcement Division is not responsible for the actions of this individual lawyer, whom he described as a “bad apple” in the Division. Is he correct?", "a": ["No, lawyers having comparable managerial authority in a government agency must make reasonable efforts to ensure that the firm has in effect measures giving reasonable assurance that all lawyers in the agency or department conform to the Rules of Professional Conduct.", "Yes, even though the Model Rules state that lawyers in supervisory positions can be subject to discipline for the ethical violations of their subordinates, these rules contain an explicit exemption for government agencies.", "Yes, because all the lawyers in the Division were competent and experienced, and it was reasonable for the Division director not to monitor their activities or provide ethical training like she would for newly-licensed lawyers.", "No, even though the Model Rules merely require that lawyers in regular supervisory positions take reasonable steps to ensure that their subordinates follow the rules, there is a higher standard for supervisory lawyers in government agencies, who have strict liability for abuses of government power by their subordinates."], "e": "5.1(a) requires partners and lawyers with comparable managerial authority to make reasonable efforts to have measures in place giving reasonable assurance that every lawyer conforms to the Rules. The comments say that includes lawyers who manage a government agency's legal department. Assuming experienced lawyers need no oversight isn't a reasonable measure. A division director who does nothing to promote compliance can't disclaim the 'bad apple.' There's no government exemption, and the standard is reasonable efforts, not strict liability. Book cite: Rule 5.1(a) cmt. [1]. [S1:61–62; W1:65]", "r": "Stevenson, 500 MPRE Questions (2019) Q334 · Rule 5.1 Responsibility of Partners & Supervisors"},
{"t": "hum", "q": "An associate worked at Big Firm. Even though she had only recently graduated from law school, the associate had earned the respect of the partners at the firm, and she was involved in several projects for multiple lawyers and clients. Overwhelmed with looming deadlines on multiple matters, she realized that she could not devote enough attention to each client's issues - she could not provide competent, diligent representation to so many clients at once. She approached the partner who was her mentor at the firm and explained her concerns, and he responded that she was just experiencing a learning curve, and that her workload was in fact normal, and that she should stop complaining. A few weeks later, the associate was conducting research on a client matter, and she overlooked an important case related to her issue, despite her conscientious work ethic. At the time, she was racing against deadlines on two other projects, was working long hours, and was sleeping only five hours a night on average. Big Firm has a managing partner and a committee of senior partners. Could the partner who was her mentor be subject to disciplinary action for the associate's mistake?", "a": ["Yes, partners and others in a supervisory role at a firm are responsible to monitor the workload of their subordinate attorneys.", "Yes, the partners at a firm have strict liability for ethical violations of their associates or subordinates.", "No, overlooking a case while conducting research does not constitute an ethical violation.", "No, only the managing partner at the firm has responsibility for monitoring the workload of the associates."], "e": "Partners and supervising lawyers must make reasonable efforts to ensure that the lawyers under them comply with the Rules (5.1(a)–(b)). That includes keeping a new associate's workload manageable so she can work competently and diligently (1.1, 1.3 cmt [2]). The mentor-partner heard her warn that she couldn't keep up and brushed her off, so her overload-driven research miss can be laid at his door. The duty isn't confined to the managing partner, and it isn't strict liability. Book cite: Rule 5.1; Lachman, 18 Prof. Law. 1 (2007). [S1:61–62; W2:24; S2:10]", "r": "Stevenson, 500 MPRE Questions (2019) Q335 · Rule 5.1 Responsibility of Partners & Supervisors"},
