{"t": "comp", "q": "An attorney specialized in transactional work for corporate clients, and he focused his practice on this area for many years. An emergency arose in which an attorney needed to give immediate telephone advice to an individual client who had to make an urgent decision. Referring the case to another firm, or even consulting with another lawyer, was not practical in the moment. The attorney did not have the requisite skill or knowledge for the matter, because it was far outside the attorney’s regular area of practice, and he explained this to the client before offering any advice. He then gave his best educated guess about what the client should do, based on analogous situations in areas of law more familiar to him, and confined his comments to the minimum necessary in the circumstances. The client relied on the attorney’s (mostly uninformed) advice, which turned out to be wrong, and the outcome was harmful to the client’s legal interests. Could the attorney be subject to discipline for lack of competence?", "a": ["No, in emergencies a lawyer may give advice or assistance in a matter in which the lawyer does not have the skill ordinarily required where referral to or consultation or association with another lawyer would be impractical.", "Yes, according to the Model Rules, a lawyer must not give advice or assistance in a matter in which the lawyer does not have the skill ordinarily required.", "Yes, competent handling of a specific matter includes inquiry into and analysis of the factual and legal elements of the problem, and the use of methods and procedures meeting the standards of competent practitioners.", "No, an agreement between the lawyer and the client regarding the scope of the representation may limit the matters for which the lawyer is responsible."], "e": "In a genuine emergency, when referral or consultation is impractical, the comments to 1.1 let a lawyer give advice in a matter where he lacks the usual skill, limited to what's reasonably necessary. He explained his limits, gave his best judgment, and confined himself to the minimum. That meets the exception even though the advice turned out wrong, because a bad outcome alone doesn't show a violation. The absolute ban on advice beyond one's skill misstates the Rule. Book cite: Rule 1.1 cmt. [3]. [W2:24]", "r": "Stevenson, 500 MPRE Questions (2019) Q230 · Rule 1.1 Competence"},
{"t": "comp", "q": "Conglomerate Corporation decided to hire Big Firm to represent it in litigation for an important but complex matter. First, however, Conglomerate offered a proposed budget for the entire litigation. A partner at Big Firm explained to Conglomerate’s in- house counsel that such a limited budget would be feasible only if the firm restricted how much discovery it conducted before trial. The partner also warned that restricting their time and money expenditures during discover could negatively impact their chances of prevailing at trial. Nevertheless, Conglomerate’s directors decide that the corporation would be better off having the talents and reputation of Big Firm’s attorneys at a limited expense, even though they knew they could have spent more for more thorough and expensive representation. According to the Restatement, may Conglomerate waive its right to more thorough representation?", "a": ["Yes, a client and lawyer may agree to limit a duty that a lawyer would otherwise owe to the client if the client has enough information and consents, and the terms of the limitation are reasonable in the circumstances.", "Yes, if a corporate client has in-house counsel, there are no restrictions on what types of agreements the corporation can make with outside counsel.", "No, because eventually, such restrictions could become a standard practice that constricts the rights of clients without compensating benefits.", "No, the administration of justice may suffer from distrust of the legal system that may result from such a practice."], "e": "Under the Restatement (§ 19), a client and lawyer may agree to limit a duty the lawyer would otherwise owe if the client is adequately informed and consents and the limit is reasonable. The Model Rules take the same approach to scope limits (1.2(c)). Conglomerate was warned that a capped budget meant less discovery and a weaker trial position, and it chose that trade-off, a reasonable one for a sophisticated client. Having in-house counsel doesn't remove all limits, and policy fears don't bar informed choices. Book cite: Restatement § 19. [W2:54–55]", "r": "Stevenson, 500 MPRE Questions (2019) Q231 · Rule 1.1 Competence"},
{"t": "comp", "q": "An attorney represented a client as the plaintiff in a legal malpractice action against another lawyer for simple negligence. The plaintiff’s attorney sent a demand letter to the other lawyer, who immediately notified his malpractice insurer. The insurer offered to settle immediately, for the full amount that the client was demanding, mostly to avoid the publicity and attention that would result if litigation ensued, including the risk that the claim would inspire others to file lawsuits against the same firm. The attorney had received prior authorization from the client, during the initial consultation, to accept a settlement offer for that amount whenever it might come as the matter progressed. The attorney did not file pleadings in court and did not file a grievance with the state bar against the other lawyer. Did the attorney violate his ethical duty of zealous advocacy by not filing pleadings or a grievance?", "a": ["No, a lawyer does not have to press for every advantage that might be potentially achievable for a client, having professional discretion to determine how a matter should be pursued.", "Yes, a lawyer should pursue a matter on behalf of a client despite opposition or personal inconvenience, taking whatever lawful and ethical measures might be necessary to vindicate a client's cause or endeavor.", "Yes, a lawyer must also act with commitment and dedication to the interests of the client and with zeal in advocacy upon the client's behalf.", "No, if a client has clearly expressed a preferred settlement amount, the lawyer has no obligation except to obtain than amount."], "e": "Diligence doesn't require a lawyer to press for every conceivable advantage. The comments to 1.3 give the lawyer professional discretion over how a matter is pursued. The client had authorized accepting this exact amount, and the insurer offered it at once, so settling without suing or filing a grievance fully served the client's objective. A bar grievance isn't a litigation tool anyway. The 'zeal' answers overstate 1.3, and the client's settlement figure isn't the lawyer's only obligation. Book cite: Rule 1.3 cmt. [1]. [W1:59; W2:6]", "r": "Stevenson, 500 MPRE Questions (2019) Q232 · Rule 1.3 Diligence"},
{"t": "comp", "q": "The Office of the Public Defender in a large urban center lacked the budget to hire the number of lawyers they needed. The number of indigent defendants who requiring representation always exceeded the capacity of the lawyers there. An attorney worked as a prosecutor for a few years to get experience, then became a public defender at this office. He soon found himself with an overload of cases, so it was impossible to provide full representation to each client. The attorney, like the other public defenders there, encouraged all his clients to accept a plea bargain, with rare exceptions. Going to trial on any one case meant turning away about two dozen indigent clients, most of whom could reach a plea agreement within an hour or two. The attorney reasoned that it was better for indigent criminal defendants to have a little representation rather than none. Besides, he knew that many of the defendants would lose if they went to trial. Given these facts, is the attorney violating his ethical duty of diligent representation to the clients?", "a": ["Yes, lawyers must control their workload so that each matter receives competent, diligent representation.", "Yes, every criminal defendant has a constitutional right to a jury trial, and lawyers should not advise them to waive this important right and accept a plea bargain instead.", "No, there is a special exception to the workload- limit rules for public defenders, considering the pressing need for representation of indigent defendants.", "No, if most of the clients would indeed be worse off if they went to trial, then the attorney’s minimal representation is better for them."], "e": "1.3's comments require a lawyer to control his workload so each matter can be handled competently and diligently, and there's no exception for public defenders. Steering nearly every client to a plea because he lacks time for them violates 1.3 (and 1.1), however sincere the triage. The proper responses are to refuse new appointments or seek relief from the court. Advising a guilty plea isn't inherently improper, and plea decisions belong to the client after real consultation. Book cite: Rule 1.3 cmt. [2]. [S2:10; W2:6, 26]", "r": "Stevenson, 500 MPRE Questions (2019) Q233 · Rule 1.3 Diligence"},
{"t": "comp", "q": "A litigation attorney represented Big Bank in a lawsuit involving many complex issues and numerous expert witnesses. At a preliminary hearing, opposing counsel requested a three-month postponement of the previously scheduled trial date, to allow more time for deposing expert witnesses and the top managers from Big Bank. The attorney for Big Bank acquiesced, relieved that the extension of time would allow him to focus on other urgent client matters. The next day, the attorney notified Big Bank that the judge had postponed the trial. Big Bank’s directors were frustrated, as they had hoped to resolve the case sooner, and would have objected to the postponement if the attorney had checked in before agreeing to it. On the other hand, Big Bank suffered no financial or reputational harm from the postponement, and the directors had not instructed the attorney to refuse requests for more time. Was it proper for the attorney to agree to the postponement of the trial?", "a": ["Yes, a lawyer's duty to act with reasonable promptness does not preclude the lawyer from agreeing to a reasonable request for a postponement that will not prejudice the lawyer's client.", "Yes, the attorney had a duty to accommodate the request for a more time, assuming the delay will not prejudice the client in the eventual outcome.", "No, the Model Rules require lawyers to act with reasonable diligence and promptness in representing a client.", "No, because a client's interests suffer by the passage of time or the change of conditions, and unreasonable delay can cause a client needless anxiety and undermine confidence in the lawyer's trustworthiness."], "e": "The comments to 1.3 say the duty of reasonable promptness doesn't preclude agreeing to a reasonable postponement that won't prejudice the client. Agreeing to an extension is a means decision and a professional courtesy within the lawyer's authority. Big Bank suffered no harm and hadn't told the lawyer to refuse extensions, and he reported promptly. Checking in first would have been wiser given the client's preferences, but it wasn't required here. There's no duty to grant every request either. Book cite: Rule 1.3 cmt. [3]. [W4:41; W2:6]", "r": "Stevenson, 500 MPRE Questions (2019) Q234 · Rule 1.3 Diligence"},
{"t": "comp", "q": "An experienced litigation attorney represented Small Business as a client in a civil lawsuit. The trial resulted in an unfavorable verdict for the client, who then hoped to reverse the decision on appeal. Nevertheless, the attorney and the client had never agreed that the attorney would handle the appeal, so the attorney simply closed out his file for that client. The deadline for the client to appeal the verdict passed, and only afterward did the client discover that the attorney had not filed a timely appeal. Did the attorney fulfill his ethical duty of diligence to the client in this instance?", "a": ["No, an attorney must discuss the possibility of an appeal prior to relinquishing responsibility for a client’s case, unless there was a prior agreement about whether the lawyer would handle the appeal process.", "Yes, the same lawyer cannot represent a client at trial and on appeal, and the client should have been aware of this rule.", "Yes, a lawyer does not have to continue working on a case for a client after trial unless the attorney and the client specifically agreed that the attorney would continue to be employed as the attorney for the appeal process.", "No, a lawyer should complete an entire case for a client, including the appeal process, unless the parties have agreed in writing that the attorney’s employment terminates after trial."], "e": "When a lawyer handled a proceeding that ended badly for the client and they never agreed whether he'd handle the appeal, the comments to 1.3 require him to consult with the client about an appeal before giving up responsibility. Quietly closing the file while the appeal deadline ran violated 1.3. No rule bars the trial lawyer from handling the appeal, and he needn't take the appeal, but he must raise it. The readings flag post-trial work as a classic scope trap. Book cite: Rule 1.3 cmt. [4]. [W2:40, 56]", "r": "Stevenson, 500 MPRE Questions (2019) Q235 · Rule 1.3 Diligence"},
{"t": "comp", "q": "An attorney represents a client in patent infringement litigation. The client is a longtime business rival of the opposing party and has successfully sued the opposing party before over an unrelated matter. The opposing party still loses his temper whenever someone brings up the previous lawsuit he lost, because he felt it was completely unfair and he nearly went bankrupt over it, and his marriage even failed due to the stress from the case and the burdensome verdict. On the eve of trial, the attorney mentions to the client that the opposing party will in fact take the stand to testify in the case. The client instructs the attorney to bring up the time that the client won another lawsuit against the opposing party during cross-examination, merely to make the opposing party get upset. He assures the attorney that the opposing party will lose his temper on the stand, and will at least lose credibility before the jury, and may even slip and say something that would undermine his position in the case. Then the attorney simply refuses to bring up a matter merely to provoke an outburst from the opposing party during trial. The client believes the attorney has a duty to provide zealous advocacy and to pursue every advantage for the client’s interests. Would it be proper for the attorney to refuse to bring up the prior unrelated lawsuit during his cross-examination, despite the client’s instructions to do so?", "a": ["Yes, because a lawyer's duty to act with reasonable diligence does not require the use of offensive tactics or preclude the treating of all persons involved in the legal process with courtesy and respect.", "No, because a lawyer has a duty to provide zealous advocacy and to pursue every advantage for the client’s interests.", "No, because provoking a hostile witness into an angry outburst on the stand violates the lawyer’s strict duty to preserve the decorum of the proceedings.", "Yes, assuming the attorney expects that opposing counsel would object to the line of questioning, and that the court would potentially sustain the objection."], "e": "The comments to 1.3 say reasonable diligence doesn't require offensive tactics or prevent treating everyone in the legal process with courtesy and respect. Raising an unrelated old lawsuit solely to provoke the witness has no legitimate purpose and violates 4.4(a). How to cross-examine is a means decision for the lawyer, so he may refuse. 'Zeal' doesn't mean every advantage at any cost, and the possibility of a sustained objection isn't the reason. Book cite: Rule 1.3 cmt. [1]. [W1:59; W4:41]", "r": "Stevenson, 500 MPRE Questions (2019) Q236 · Rule 1.3 Diligence"},
{"t": "comp", "q": "An attorney worked for Big Firm for several years, but he failed to make partner there because he was unable to recruit any new clients to the firm. He also observed numerous minor ethical violations occurring regularly at Big Firm, but none seemed serious enough to warrant a report to the state bar disciplinary authority. He left Big Firm and started his own solo practice, but struggled to attract clients, despite heavy investments in advertising. As a last resort, he tried using an online coupon app, called PleaseTryThis, to market his law practice. The attorney would offer the same “Deal of the Day” every weekday, stating that he would do the first ten hours of legal work at half his usual hourly rate. The ad also noted that many routine legal matters take ten hours or less. The response to his PleaseTryThis ad far exceeded the attorney’s expectations. His waiting room was full every day, throughout the morning and afternoon, with new clients, eagerly awaiting their initial consultation for half-price legal representation. The attorney was agreeing to represent ten or more new clients every day, week after week. Are the attorney’s actions here proper, according to the ABA Model Rules?", "a": ["No, the attorney has an ethical duty to limit the number of deals offered, to devote adequate time and attention to each matter.", "Yes, if the lawyer indeed gives the discount to each client bearing the PleaseTryThis coupon, because the Model Rules allow lawyers to advertise their services, assuming the communications are truthful.", "Yes, but only if the lawyer gives the same deal to every new client who comes in during the PleaseTryThis advertising campaign, so that no clients pay a higher rate merely because they did not see the PleaseTryThis ad.", "No, the advertising rules do not allow lawyers to advertise lower fees than usual as a special promotion."], "e": "Under ABA Op. 465, a lawyer using daily-deal marketing must limit the number of deals sold to what he can handle competently and diligently. 1.3's comments require controlling workload so each matter gets proper attention. Signing up ten or more new clients a day, every day, as a solo can't meet that standard. Truthful advertising and discounted fees are permitted, and charging coupon holders less is fine, but overcommitting is not. Book cite: Rule 1.3; ABA Formal Ethics Op. 465 (2013). [S2:10; W2:6]", "r": "Stevenson, 500 MPRE Questions (2019) Q237 · Rule 1.3 Diligence"},
{"t": "comp", "q": "An attorney agreed to represent a client before the Tax Court, to challenge the amount the Internal Revenue Service said he owed in unpaid taxes. The attorney filed an appearance in the matter and the initial pleadings and forms. Nevertheless, when the client did not pay even the first installment of fees, and did not return the attorney's phone call, the attorney assumed the client did not want his representation. The attorney moved on to other cases and forgot about it. He \"failed to appear for a discovery conference, failed to give opposing counsel key documents, failed to show up for trial, and went missing again when the hearing was rescheduled.” When the Tax Court asked the attorney to show cause why he should not face discipline, he explained that he no longer represented the client, and had never received any legal fees from the individual. Is it proper for the Tax Court to reprimand him?", "a": ["Yes, because he has violated the requirement of diligent representation under Rule 1.3, and courts have inherent authority to discipline attorneys who appear before the court in a matter.", "Yes, because his reason for abandoning the cases was purely profit-motivated, rather than out of a genuine concern for the integrity of the legal process.", "No, because the Tax Court is not an Article III court, and therefore lacks the inherent authority to discipline attorneys.", "No, because if the client has never even paid a first installment of fees, and did not return the lawyer’s phone call, the client-lawyer relationship has not been fully consummated."], "e": "Once a lawyer appears in a pending case, he remains counsel until the tribunal lets him withdraw (1.16(c)). Nonpayment and an unreturned call don't end the relationship. Missing a discovery conference, the trial, and the rescheduled hearing is classic neglect under 1.3. Courts have inherent authority to discipline lawyers practicing before them, and the D.C. Circuit upheld the Tax Court's authority in Aka. A non-Article III court isn't powerless, and his motives are beside the point. Book cite: Aka v. U.S. Tax Court, 854 F.3d 30 (D.C. Cir. 2017). [W2:57–58; W1:34–35]", "r": "Stevenson, 500 MPRE Questions (2019) Q238 · Rule 1.3 Diligence"},
{"t": "comp", "q": "An attorney undertook the representation of represent a new client, but the attorney’s firm forgot to screen for conflicts of interest. The attorney normally relied on her firm to screen for conflicts with clients of the other attorneys, and assumed this had occurred, so she drafted and filed a complaint at the client’s behest, and then began planning to file a motion for a preliminary injunction. Before filing for the preliminary injunction, however, the attorney discovered that one of her partners at the firm previously represented the opposing party in a closely related matter, which would have been obvious beforehand if the firm had conducted a routine conflict check. The respective clients would not consent to the conflict, so the attorney had to withdraw from representing the new client. Her withdrawal forced the client to search for another lawyer and start over, which delayed the issuance of a preliminary injunction by several weeks, and the client suffered financial losses as a result. Would the attorney be liable to the new client for a breach of fiduciary duty?", "a": ["Yes, the attorney is subject to liability to the client for negligent breach of fiduciary duty.", "Yes, law firms have strict liability for their fiduciary duties, so the reasonableness of the attorney is irrelevant.", "No, she is not liable for a breach of fiduciary duty, but the firm could be subject to disqualification from the other client’s matter.", "No, a lawyer has no fiduciary duty if she withdraws from the representation."], "e": "A lawyer who fails to use reasonable care to detect a conflict, here skipping a routine conflict check, and is forced to withdraw, causing the client losses, is liable for negligent breach of fiduciary duty (Restatement § 49). The claim needs duty, breach, causation, and economic harm, and the delayed injunction supplied the harm. Relying on the firm doesn't excuse her, since a reasonable check would have caught it. This isn't strict liability, and withdrawing doesn't erase the earlier breach. Book cite: Restatement § 49. [W1:30; W4:7–8; S1:61]", "r": "Stevenson, 500 MPRE Questions (2019) Q239 · Legal Malpractice"},
{"t": "comp", "q": "An attorney undertook the representation of represent a new client, and the attorney’s firm searched for potential conflicts of interest. Unfortunately, despite conducting an otherwise adequate conflict search, the opposing party in the new matter had changed its name in the two years since the prior representation (by the same firm), and the attorney’s firm was unaware of the name change. The attorney normally relied on her firm to screen for conflicts with clients of the other attorneys, but in this instance a competent search had not revealed the conflict. The attorney then drafted and filed a complaint at the client’s behest, and then began planning to file a motion for a preliminary injunction. Before filing for the preliminary injunction, however, the attorney discovered that one of her partners at the firm previously represented the opposing party, under another name, in a closely related matter. The respective clients would not consent to the conflict, so the attorney had to withdraw from representing the new client. Her withdrawal forced the client to search for another lawyer and start over, which delayed the issuance of a preliminary injunction by several weeks, and the client suffered financial losses as a result. Would the attorney be liable to the new client for a breach of fiduciary duty?", "a": ["No, she is not liable for a breach of fiduciary duty, but the firm could be subject to disqualification from the other client’s matter.", "Yes, law firms have strict liability for their fiduciary duties, so the reasonableness of the attorney is irrelevant.", "Yes, the attorney is subject to liability to the client for negligent breach of fiduciary duty.", "No, a lawyer has no fiduciary duty if she withdraws from the representation."], "e": "Liability for a negligent breach of fiduciary duty requires a lack of reasonable care, and here the firm ran an adequate conflict search that missed the conflict only because the opposing party had changed its name. Without negligence there's no liability to the client, though the conflict itself can still lead to disqualification, a prophylactic remedy that needs no fault or harm. Neither firms nor lawyers are strictly liable, and withdrawal doesn't end fiduciary duties. Book cite: Restatement § 49. [W1:30, 33; W4:7–8]", "r": "Stevenson, 500 MPRE Questions (2019) Q240 · Legal Malpractice"},
{"t": "rel", "q": "An attorney undertook the representation of a client, but the representation was in the client's capacity as trustee of an express trust for the benefit of a beneficiary. The client informed the attorney that he wanted to transfer funds into the client’s own account, which would legally constitute embezzlement. The attorney explained to the client that the transfer would be illegal and subject to criminal charges. Disregarding the attorney’s counsel, the client made the transfer, and informed the attorney what he had done. The attorney took no measures to mitigate or prevent the financial losses sustained by the beneficiary, for example, he did not inform the beneficiary or the supervising court, which would have been permissible under the exceptions to the confidentiality rules. The attorney believes he should not be subject to liability to the beneficiary, whom he does not represent. Is the attorney correct?", "a": ["No, the attorney could have prevented the breach of fiduciary duty without violating the ethical duty to protect client confidentiality.", "Yes, the attorney had no attorney-client relationship with the beneficiary, and therefore owes no legal duties to that party that could be the basis of liability.", "Yes, the attorney told the client not to make the transfer, and the client disregarded the attorney’s instructions.", "No, attorneys have strict liability when a client uses the lawyer’s services in furtherance of crime or fraud."], "e": "Under the Restatement (§ 51(4)), a lawyer representing a trustee owes the beneficiary a duty of care when the lawyer knows action is needed to prevent or rectify the client's breach of fiduciary duty that is a crime or fraud, the beneficiary can't protect itself, and acting wouldn't violate the lawyer's duties to the client. The attorney knew of a completed embezzlement and could have warned the beneficiary or the court consistent with confidentiality, yet did nothing. Telling the client not to do it wasn't enough, though there's no strict liability. Book cite: Restatement § 51. [W2:40–41, 45] (§ 51(4) isn't discussed in the readings)", "r": "Stevenson, 500 MPRE Questions (2019) Q241 · Legal Malpractice"},
{"t": "rel", "q": "An attorney undertook the representation of a client, but the representation was in the client's capacity as trustee of an express trust for the benefit of a beneficiary. The client informed the attorney that he wanted to transfer funds into a certain account, which the client says is the trust account, even though it is the client’s personal account. The client’s intended action would constitute embezzlement. Due diligence by the attorney would have revealed that the client was lying about the accounts, but the attorney forgot to check, gave the client no guidance, and the client proceeded with the illegal transfer. The beneficiary sustained financial losses because of the illegal transfer, and eventually sued the attorney for a breach of fiduciary duty. The attorney believes he should not be subject to liability to the beneficiary, whom he does not represent. Is the attorney correct?", "a": ["Yes, for the attorney did not owe the beneficiary a duty to use care because attorney was unaware that appropriate action was necessary to prevent a breach of fiduciary duty by the client, even though further investigation would have revealed this.", "Yes, the attorney cannot be liable to third party beneficiaries unless the attorney directed the client to take the actions that injured the beneficiary.", "No, the attorney could have prevented the breach of fiduciary duty by conducting a diligent check to ensure that the accounts were proper for the receipt of the transferred funds.", "No, attorneys have strict liability when a client uses the lawyer’s services in furtherance of crime or fraud."], "e": "The trustee-client rule in Restatement § 51(4) applies only when the lawyer actually knows that action is needed to prevent or rectify a breach of fiduciary duty. Here the attorney carelessly failed to check the accounts and didn't know about the embezzlement, and 'should have known' isn't enough to create a duty to the nonclient beneficiary. He may still have failed his own client, but he isn't liable to the beneficiary. There's no strict liability, and the duty doesn't require that he directed the act. Book cite: Restatement § 51. [W2:40–41] (§ 51(4) isn't discussed in the readings)", "r": "Stevenson, 500 MPRE Questions (2019) Q242 · Legal Malpractice"},
{"t": "rel", "q": "An attorney undertook the representation of a client, but the representation was in the client's capacity as trustee of an express trust for the benefit of a beneficiary. The client informed the attorney that he wanted to invest trust funds in a way that would be unlawful, but it would not constitute a crime or fraud under applicable law. The client did not use the attorney’s services in finalizing the investment. At the same time, the attorney said nothing to discourage the client from making the unlawful (though not criminal) investment. The beneficiary sustained financial losses due to the bad investment by the client, and eventually sued the attorney for a breach of fiduciary duty. The attorney believes he should not be subject to liability to the beneficiary, whom he does not represent. Is the attorney correct?", "a": ["Yes, a lawyer owes a duty to the nonclient beneficiary to intervene only where the breach is a crime or fraud or the lawyer has assisted or is assisting the breach.", "Yes, a lawyer never owes a duty of care to a nonclient such as the beneficiary.", "No, the attorney had a fiduciary duty to protect the fiscal interests of the third-party beneficiary.", "No, a lawyer owes a duty to use care to a nonclient when and to the extent that the lawyer's client is a trustee, guardian, executor, or fiduciary acting primarily to perform similar functions for the nonclient"], "e": "Under Restatement § 51(4), a trustee's lawyer must act to protect the beneficiary only when the trustee's breach is a crime or fraud, or the lawyer has assisted or is assisting it. An unlawful but non-criminal, non-fraudulent investment made without the lawyer's help doesn't trigger that duty, so the attorney isn't liable to the beneficiary, though silence was poor counseling. The answer saying a lawyer never owes nonclients a duty overstates the rule. The 'trustee client' answer omits these limits. Book cite: Restatement § 51. [W2:40–41] (§ 51(4) isn't discussed in the readings)", "r": "Stevenson, 500 MPRE Questions (2019) Q243 · Legal Malpractice"},
{"t": "rel", "q": "At a real estate closing, the seller's attorney offered to record the deed for the buyer. Could the lawyer be subject to liability to the buyer for negligence in doing so, even if the buyer did not thereby become a client of the lawyer?", "a": ["Yes, lawyers who invite reasonable reliance from another party in a transactional setting can be subject to liability to nonclients who rely on the lawyer’s promises.", "No, lawyers cannot be subject to liability for negligence to nonclients.", "No, lawyers cannot be subject to liability for negligence to nonclients in transactional scenarios, even if they could be liable to nonclients in litigation matters.", "Yes, but only if the seller had independent representation by counsel at the hearing."], "e": "A lawyer can owe a duty of care to a nonclient whom the lawyer invites to rely on the lawyer's services, if the nonclient reasonably relies (Restatement § 51(2)). By offering to record the deed for the buyer, the seller's lawyer invited that reliance, so he can be liable for doing it negligently even though the buyer never became his client. Nonclient duties arise in transactions and litigation alike, and nothing turns on separate counsel. Book cite: Restatement § 51. [W2:40, 46]", "r": "Stevenson, 500 MPRE Questions (2019) Q244 · Legal Malpractice"},
{"t": "rel", "q": "An attorney provided representation to a plaintiff in a personal injury lawsuit against Conglomerate Corporation. During the discovery phase of the litigation, the attorney was overwhelmed with other client cases and distracted by family issues at home, and she did not conduct a thorough factual investigation. Her misunderstanding of the facts led the attorney to include a groundless claim in the complaint, which was otherwise valid and had appropriate factual support. The defendant successfully persuaded the court to dismiss that specific claim, but the defendant incurred costly legal expenses in doing so. Assume there is no “loser pays” rule for this type of litigation in this state. Could the plaintiff’s attorney be liable in a subsequent negligence action to the defendant for the groundless claim?", "a": ["No, as a rule, lawyers have no duty of care to the opposing party in litigation that could furnish the basis for liability to that party.", "Yes, lawyers whose negligence in their legal work imposes unnecessary costs on the opposing party are liable for legal malpractice to the party that suffered the injury.", "Yes, lawyers who undertake the representation of a litigant have strict liability for failures to conduct an exhaustive factual investigation during litigation.", "No, lawyers must balance their duties to the current client with their duties to other clients and their own personal needs."], "e": "As a rule, a lawyer owes no duty of care to the opposing party in litigation, because that duty would conflict with the duty owed the client. The opponent's remedies for a groundless claim lie in court sanctions (Rule 11) or malicious prosecution, not negligence. The readings' example: a lawyer's QDRO duty runs only to her client, not the adverse spouse. Balancing personal needs isn't the reason, and no strict liability exists. Book cite: Restatement § 51. [W2:53; W1:31, 34]", "r": "Stevenson, 500 MPRE Questions (2019) Q245 · Legal Malpractice"},
{"t": "rel", "q": "A certain client retained an experienced attorney for the drafting and execution of a will. The client wanted the will to leave the client's entire estate to her favorite professor from her law school, the one who had taught her Professional Responsibility course in her 3L year. The attorney prepared the will naming the professor as the sole beneficiary, but negligently arranged for the client to sign it without the correct number of witnesses present at the signing. After the client died, a probate court held the will to be ineffective due to the lack of witnesses, and the nonclient beneficiary thereby suffered financial loss. The client's intent to benefit her favorite law professor appeared on the face of the will executed by the client. Assuming the majority rule, is the attorney subject to liability to the nonclient beneficiary for negligence in drafting and supervising the execution of the will?", "a": ["Yes, the attorney knew that the client intended, as one of the primary objectives of the representation, that the attorney’s services benefit the nonclient beneficiary.", "Yes, the attorney invited the nonclient to rely on the attorney’s opinion or provision of other legal services, and the nonclient so relied.", "No, because there was no breach of fiduciary duty involving a crime or fraud.", "No, because there was no privity between the attorney and the intended beneficiary of the will."], "e": "Under the majority rule, a lawyer owes a duty of care to a nonclient when the lawyer knows the client intends, as a primary objective of the representation, that the lawyer's services benefit that nonclient (Restatement § 51(3)). A will naming the professor as sole beneficiary shows that intent on its face, so the botched execution makes the lawyer liable to him (Lucas v. Hamm). Lack of privity isn't a defense here, and the 'invited reliance' theory is a different basis for duty. Book cite: Restatement § 51. [W2:45; S2:66]", "r": "Stevenson, 500 MPRE Questions (2019) Q246 · Legal Malpractice"},
{"t": "rel", "q": "A certain client retained an experienced attorney for the drafting and execution of a will. The client wanted the will to leave the client's entire estate to her favorite professor from her law school, the one who had taught her Professional Responsibility course in her 3L year. The attorney prepared the will by copying from previous will she had prepared for other clients, and then she arranged for the client to sign the will before the proper number of witnesses. The client's intent to benefit the law professor thus did not appear on the face of the will, which instead listed the sole beneficiary merely as “the legal heir.” The professor inherited nothing when the will went through probate, and then he accused the attorney of negligently writing the will to name someone other than professor as the legatee. Can the professor, as the intended beneficiary, recover from the attorney in a negligence-malpractice lawsuit?", "a": ["Yes, but only by producing clear and convincing evidence that the client communicated her intent to the attorney that the professor should be the legatee.", "Yes, the attorney had an automatic fiduciary duty to the beneficiary when the client expressed the desire to benefit the nonclient beneficiary.", "No, because there was no breach of fiduciary duty involving a crime or fraud.", "No, because there was no privity between the attorney and the intended beneficiary of the will."], "e": "An intended beneficiary can sue the drafting lawyer for negligence (Restatement § 51(3)), but when the client's intent to benefit him doesn't appear on the face of the will, courts guard against fabricated claims by requiring clear and convincing evidence that the client told the lawyer of that intent. The professor can recover only on that heightened proof. There's no automatic fiduciary duty to the beneficiary, and lack of privity isn't a bar. Book cite: Restatement § 51. [W2:45 & n.17; S2:66]", "r": "Stevenson, 500 MPRE Questions (2019) Q247 · Legal Malpractice"},
{"t": "rel", "q": "A certain client retained an experienced attorney for the drafting and execution of a will. The client wanted the will to leave the client's entire estate to her favorite professor from her law school, the one who had taught her Professional Responsibility course in her 3L year. The attorney drafted the will accordingly, and she arranged for the client to sign the will before the proper number of witnesses. Nevertheless, after the client's death, a disinherited relative sued and had the will set aside, claiming the client was incompetent at the time of the signing. The relative, who had then become the heir of the estate, sued the attorney for her legal expenses in challenging the will successfully. The heir argued that the attorney was negligent in assisting the client in the execution of the will, despite the client’s mental incompetence. Is the attorney liable to the heir for negligence, if the heir has already obtained a court verdict that the testator-client was incompetent?", "a": ["No, the attorney is not subject to liability for negligence to the heir who set aside the will.", "Yes, a lawyer drafting a will has an implied fiduciary duty to whomever the legitimate heirs may be.", "Yes, if a court has already determined that the client was mentally incompetent, this establishes the attorney’s negligence as a matter of law.", "No, lawyers cannot be liable to nonclient heirs."], "e": "A will-drafting lawyer's duty runs to the testator and the intended beneficiaries, not to disinherited heirs who would gain by defeating the will. Imposing a duty to them would conflict with the duty to carry out the client's wishes. So the relative who set the will aside can't recover her litigation costs from the attorney, and a finding of incapacity doesn't establish the lawyer's negligence. Some nonclient heirs can sue (intended beneficiaries), so a blanket no-liability rule is too broad. Book cite: Restatement § 51. [W2:45; S2:66]", "r": "Stevenson, 500 MPRE Questions (2019) Q248 · Legal Malpractice"},
{"t": "rel", "q": "A client asked her attorney to draft a will leaving a bequest in trust to a specific beneficiary, and to do so within one day, as the client was on her deathbed. The attorney wrote the will accordingly. After the client's death, however, the bequest was set aside. The invalidity of the will was due to a defect that most competent lawyers would not have been able to discover within one day. Later, the beneficiary sued the attorney for professional negligence. Can the beneficiary recover damages from the attorney for the invalidity of the will?", "a": ["No, even though the attorney owed some duty of care to the beneficiary, the original client’s time constraints are relevant to what constitutes ordinary competence, and the beneficiary cannot exact from the attorney greater care than the attorney owed the client.", "Yes, a lawyer owes a duty of care to beneficiaries of testamentary instruments that the lawyer drafts.", "Yes, a lawyer owes a fiduciary duty to beneficiaries of testamentary instruments that the lawyer drafts.", "No, the beneficiary was not a client of the attorney, and without privity, the attorney owed no duty of care to the beneficiary."], "e": "A lawyer's duty of care to an intended beneficiary is measured by what the lawyer owed the client, which is the care of a reasonably prudent lawyer under the same or similar circumstances, including the client's time limits (Restatement § 52). The client demanded a will within a day on her deathbed, and most competent lawyers couldn't have found the defect in that time, so there was no breach. The beneficiary can't demand more care than the client could. The lack of privity isn't the reason, because beneficiaries are owed some duty. Book cite: Restatement § 52. [W2:9, 45]", "r": "Stevenson, 500 MPRE Questions (2019) Q249 · Legal Malpractice"},
{"t": "rel", "q": "A client was selling some property to a buyer, and they reached an agreement that, as a condition for the sale, the client would supply an opinion letter by her attorney regarding liens on the property. The attorney knows about the agreement. Nevertheless, the client privately instructs the attorney to rely on the client’s own information or assertions in preparing the opinion letter, and not to spend time searching the public lien records, as customary practice would require. The attorney relied on the client's information, so the opinion letter did not mention a recorded lien that the buyer would later discover, after the purchase was complete. Could the attorney be liable to the buyer for lack of diligence in a subsequent malpractice action?", "a": ["Yes, it was reasonable for the buyer to rely upon the opinion letter, as the client invited this reliance, so the attorney had a duty to follow customary practice in rendering the opinion.", "Yes, a lawyer preparing opinion letters has fiduciary duties to anyone who reads and relies upon the lawyer’s written declarations.", "No, there was no attorney-client relationship between the buyer and the attorney, and the attorney owed a duty of diligence to follow the seller’s (the client’s) instructions.", "No, the buyer should have asked whether the attorney had followed customary practice and searched for liens on the property."], "e": "A lawyer who provides an opinion that the client invites a third party to rely on owes that third party a duty of care if the reliance is reasonable (Restatement § 51(2)), measured by customary practice (§ 52). The buyer reasonably relied on a lien opinion that was a condition of the sale, so the client's private instruction to skip the lien search doesn't lower the lawyer's duty to the buyer. The lawyer should have searched or qualified the opinion. There's no general fiduciary duty to every reader, and lack of a client relationship isn't a defense. Book cite: Restatement § 52. [W2:46, 53; S2:85–86]", "r": "Stevenson, 500 MPRE Questions (2019) Q250 · Legal Malpractice"},
{"t": "comp", "q": "A client hired an attorney to represent her as the plaintiff in a contract action. The client sought to recover $100,000 under the contract. The attorney agreed to provide representation on an hourly basis, at a rate of two hundred dollars per hour. The attorney spent ten hours working on the matter, and then withdrew from the representation to go on vacation, on the eve of trial. The client did not have time to find another lawyer, and tried to proceed pro se, resulting in a dismissal of her case with prejudice. The plaintiff then sued the attorney for malpractice and showed that she would have prevailed in her contract claim, but for the attorney’s withdrawal. The court in her malpractice action awarded her the full $100,000 in damages that she would have won in the contract case. The attorney then argues that if the client is receiving the full amount she sought to recover originally, then the attorney should receive the two thousand dollars in attorney’s fees for the hours she worked, if not the full amount the client anticipated paying the attorney from the beginning. How much should the attorney deduct from the damages owed to the client, toward the attorney’s fees for the representation?", "a": ["The attorney should have forfeited her right to fees by committing malpractice and must pay the full award amount to the client.", "The attorney should keep two thousand, for the hours she in fact worked on the matter and should pay the client $98,000 in damages.", "The attorney should keep however much the client originally anticipated paying in attorney’s fees, when the representation began, and should pay the remainder to the client in damages.", "The attorney does not have to pay the client anything in the malpractice action if the client has not yet paid the attorney any legal fees."], "e": "A lawyer who abandons a client on the eve of trial commits a serious breach, and fees for work done while seriously breaching fiduciary duties may be forfeited entirely. The client's malpractice damages, the $100,000 she would have won, therefore aren't reduced by the fees the lawyer would have earned. Letting the lawyer keep her hourly fees, or the anticipated fee, would reward the abandonment. Unpaid fees don't excuse liability either. Book cite: Restatement § 52. [W1:33–34; W2:69]", "r": "Stevenson, 500 MPRE Questions (2019) Q251 · Legal Malpractice"},
{"t": "comp", "q": "The state bar association operated peer-support program. As a participant in the program, Attorney Stevenson consulted with another lawyer in confidence about a thorny issue that Attorney Stevenson was having with his representation of a client. The other lawyer gave Attorney Stevenson some bad advice, which Attorney Stevenson followed. The result was that the client fired Attorney Stevenson, which was a major setback for his law firm. Attorney Stevenson wants to sue the other lawyer for giving him bad advice, and he can make a plausible claim that it was reasonable for him to follow the advice, given the other lawyer’s expertise and Attorney Stevenson’s inexperience. Does Attorney Stevenson have a potentially valid claim against the other lawyer for malpractice?", "a": ["No, there was no client-lawyer relationship between Attorney Stevenson and the other lawyer, at least under the facts delineated here.", "Yes, the other lawyer gave harmful advice, and it was reasonable for Attorney Stevenson to follow the advice.", "Yes, consultations between attorneys create strict liability for malpractice claims, because a higher standard of care applies in such situations.", "No, Attorney Stevenson is a lawyer and can think for himself and take responsibility for his own decisions."], "e": "Malpractice requires a duty, and a duty of care arises from a lawyer-client relationship (Restatement § 14) or an assumed duty. A confidential peer-support consultation through a bar program, with nothing showing the other lawyer agreed to represent Stevenson, doesn't create a relationship, so there's no malpractice claim on these facts. The readings make a similar point about informal consultations: an uninvolved colleague or retired relative isn't your lawyer unless you establish the relationship. Reasonable reliance alone doesn't create one, and there's no strict liability. Book cite: Restatement § 14. [W2:35–36; S3:85–90]", "r": "Stevenson, 500 MPRE Questions (2019) Q252 · Legal Malpractice"},
{"t": "rel", "q": "A potential client called an attorney’s office and told the receptionist that he wanted to hire the attorney to represent him at his drivers-license revocation hearing, which was set for two weeks from that date. The attorney regularly represented clients at license revocation hearings and appeals. The receptionist instructed the potential client to send or drop off all the papers concerning the proceeding but did not tell the caller whether the attorney would take the case. The individual dropped off the papers the next day. The attorney did not communicate with potential client until the day before the hearing, at which point the attorney declined to take the case. When the individual subsequently sues the attorney for malpractice, could a court find that a client- lawyer relationship existed in this situation?", "a": ["Yes, the individual relied on the attorney by not seeking other counsel when that was still practicable, and this reliance was reasonable because the attorney practiced in this area, the receptionists solicited the individual’s papers needed for the proceeding, and the hearing was imminent.", "Yes, if someone at the firm has a live telephone conversation with a potential client, a client- lawyer relationship has commenced until the lawyer expressly declines the representation or withdraws.", "No, if the attorney had never talked to the individual before the conversation in which he declined the case, then it was not reasonable for the individual to think that a client-lawyer relationship existed.", "No, because malpractice actions must have a basis in a more substantial harm to the injured party than merely having to go to a license revocation hearing without a lawyer."], "e": "Under Restatement § 14(1)(b), a relationship arises when a person asks for legal services and the lawyer fails to say no while knowing, or having reason to know, that the person reasonably relies on him. The office asked for the papers, the attorney handles these hearings, and the hearing was imminent, so the caller reasonably relied by not looking for other counsel. Silence until the day before the hearing let that reliance form. A phone call alone doesn't create a relationship, and the harm needn't be large. Book cite: Restatement § 14. [W2:35–36; S2:71–73]", "r": "Stevenson, 500 MPRE Questions (2019) Q253 · Legal Malpractice"},
{"t": "rel", "q": "A potential plaintiff sent an email to an attorney that described a medical-malpractice suit that sender wanted to bring. The email asked the attorney to represent the victim in the matter. The attorney read but never responded to the email. Fourteen months later, the applicable statute of limitations on the claim expired. The plaintiff then sued the attorney for legal malpractice for not having filed the suit on time. Is the attorney liable for malpractice for missing the statute of limitations?", "a": ["The attorney could not be liable under these facts because no client-lawyer relationship existed.", "The attorney could not be liable under these facts because malpractice actions are due to conflicts of interest, not missing the statute of limitations.", "The attorney could be liable because it was reasonable for the potential client to assume that the attorney would protect her interests, unless the attorney stated otherwise.", "The attorney could be liable because he read the email and should have known the statute of limitations might expire in the next year or so, but the attorney failed to respond."], "e": "⚠ Answer-key warning: The book's keyed answer is debatable. The readings stress that silence can count as consent and that the lawyer bears the risk of uncertainty. A court could find reliance reasonable, so the safe practice is a prompt non-engagement reply that flags the limitations period.\n\nA relationship by silence requires that the lawyer know, or reasonably should know, that the person reasonably relies on him (Restatement § 14(1)(b)). An unsolicited email to a lawyer the sender never met, followed by fourteen months of silence, doesn't make reliance reasonable, so on the book's view no relationship formed and there's no malpractice. Book cite: Restatement § 14. [W2:35–36; W3:5]", "r": "Stevenson, 500 MPRE Questions (2019) Q254 · Legal Malpractice"},
{"t": "comp", "q": "A state disciplinary authority issued a public reprimand of an attorney for a clear violation of the state’s rules about solicitation of clients, and the tribunal ordered the attorney to pay a modest sum for costs and penalties. One of the attorney’s improperly solicited clients, whose matter the attorney had handled competently, resulted in an unfavorable outcome for the client. The client brought a malpractice action against the attorney, based on the state bar’s finding of an improper solicitation in her case, and she sought to recover damages. Is the client likely to prevail in this malpractice claim?", "a": ["No, the attorney’s violation of the solicitation rule does not prove that the attorney negligently mishandled the representation of the client.", "Yes, the state disciplinary authority has already determined that the attorney violated the ethical rules, so the attorney’s representation was malpractice per se.", "Yes, the client received an unfavorable outcome after hiring the attorney in response to an improper solicitation.", "No, it would constitute double jeopardy to punish the attorney a second time in the malpractice action for the same conduct that the state bar already sanctioned."], "e": "Preamble ¶ 20 says violating a Rule doesn't itself give rise to a cause of action or create a presumption that a legal duty was breached. The Rules are relevant to the standard of care, but there's no negligence per se. The client must prove that the lawyer's handling of her case fell below the standard of care and caused her loss, and the improper solicitation shows neither. A bad outcome doesn't prove malpractice, and discipline plus civil liability isn't double jeopardy, because discipline isn't criminal punishment. Book cite: Allen v. Allison (Ark. 2004). [W1:31–32]", "r": "Stevenson, 500 MPRE Questions (2019) Q255 · Legal Malpractice"},
{"t": "rel", "q": "A client called the same attorney that had previously represented her, asking the attorney to handle a pending antitrust investigation. She requested that the attorney come to the client's corporate headquarters to explore litigation strategies. The attorney visited the headquarters and spent four hours meeting with the client and her management team to discuss strategy, but never gave a definitive answer about whether he would represent the client in the matter. Is it reasonable for the client to assume that an attorney-client relationship exists?", "a": ["The attorney communicated a willingness to represent the client by her actions.", "If the attorney never explicitly agreed to represent the client in the matter, no attorney- client relationship exists.", "The potential client merely asked the attorney to discuss strategy, so no attorney-client relationship exists.", "If the attorney has represented the client on more than one matter in the past and had a discussion with the client about a new matter, then an attorney-client relationship already exists."], "e": "A lawyer-client relationship can arise from conduct, not just express words (Restatement § 14). Spending four hours at a former client's headquarters planning litigation strategy, at her request, without ever saying 'I haven't agreed to represent you,' manifests consent or at least invites reasonable reliance. The lawyer bears the risk of that ambiguity. Explicit agreement isn't required, and past representation alone doesn't make every new matter a representation. Book cite: Restatement § 14. [W2:35–36]", "r": "Stevenson, 500 MPRE Questions (2019) Q256 · Legal Malpractice"},
{"t": "comp", "q": "An attorney agreed to represent a client, but the attorney’s firm did not search for potential conflicts of interest. The attorney filed the lawsuit in court. During the pleading and motion stage, the attorney discovered that one of her law firm partners formerly represented the opposing party in a closely related matter. As a result of this conflict of interest, the attorney had to withdraw from representing the client. A competent conflicts search would have revealed the conflict. Due to the attorney’s withdrawal, the client had a significant delay in obtaining a preliminary injunction against the other party, resulting in financial losses for the client. Which of the following is true, given these facts?", "a": ["The attorney is liable to the client for a negligent breach of fiduciary duty.", "The attorney could not face malpractice liability because the client cannot show damages over a delayed preliminary injunction, as opposed to the eventual outcome on the merits.", "The attorney properly withdrew when the conflict of interest arose, so there should be no malpractice liability to the client.", "Second-hand conflicts of interest, such as one described here with the attorney’s partner, are too attenuated to furnish the basis for a liability claim."], "e": "Failing to run a conflict check that a competent search would have caught, then having to withdraw and causing the client losses from a delayed injunction, is negligent breach of fiduciary duty (Restatement § 49). Withdrawing was required, but the breach happened earlier, when the representation was accepted without a reasonable check. A delayed injunction is compensable harm, and a partner's former-client conflict is imputed to the whole firm, so it isn't too remote. Book cite: Restatement § 49. [W1:30; W4:7–8; S1:61]", "r": "Stevenson, 500 MPRE Questions (2019) Q258 · Legal Malpractice"},
{"t": "conf", "q": "An attorney represents a client who went through a divorce several years ago in another state, and the divorce resulted in a court order for child support and spousal maintenance. The client then moved to the attorney’s state, started a new career in politics, and formed new relationships. She has kept her previous marriage a divorce a secret, except from her closest friend and her attorney, because she is afraid it will affect her new career and public image. Recently, she hired her attorney to handle various legal matters for her, which included issuing a press release about her withdrawal from a political campaign. When news media outlets posted online about the client’s withdrawal from the race, the attorney responded to some of the comments that readers posted, to clear up some misunderstandings. In one of the attorney’s responses, he mentioned the client’s previous marriage and divorce. Did the attorney violate the duty of confidentiality?", "a": ["Yes, because even disclosures of information contained in the public record must have client authorization.", "It depends on whether there was a sealed record in the client’s divorce case.", "No, because the divorce and court order regarding child support are a matter of public record.", "No, because the client authorized the attorney to issue the press release, which impliedly authorized the disclosure of other helpful information."], "e": "1.6 protects all information relating to the representation, from any source, including matters of public record. Court records aren't 'generally known' just because they're publicly filed. ABA Op. 18-480 warns lawyers who post online that public-record status is no license to disclose. Authority to issue a press release about her withdrawal didn't impliedly authorize revealing an unrelated divorce she had kept secret. Whether the record was sealed doesn't change the analysis. Book cite: ABA Formal Op. 18-480. [W3:7–9; S3:20]", "r": "Stevenson, 500 MPRE Questions (2019) Q261 · Rule 1.6 Confidentiality"},
{"t": "conf", "q": "An attorney is representing a corporate client on a variety of litigation matters. The attorney receives a subpoena (compulsory process) for information and a document relating to one of her corporate clients. The attorney promptly produces the information and document required by the subpoena, and then informs the client. Could the attorney be subject to discipline for this action?", "a": ["Yes, because she did not consult first with the client before making the disclosure.", "Yes, because it was incompetent for her to believe that a subpoena could have legal force binding a corporate entity, as opposed to individuals.", "No, because the client is a corporation, not an individual.", "No, because she was acting under a subpoena."], "e": "Under ABA Op. 16-473, a lawyer served with a subpoena for client information should consult the client before producing it (1.4), so the client can decide whether to contest it, and should assert any applicable privilege or other objection. Producing first and telling the client afterward skipped that step. The readings note that privileged material must be withheld until a legal authority or the client directs otherwise. Compelled disclosure is allowed (1.6(b)(6)), but only after these steps. A corporate client gets the same protection. Book cite: ABA Formal Op. 16-473. [W3:11, 35; S3:50]", "r": "Stevenson, 500 MPRE Questions (2019) Q262 · Rule 1.6 Confidentiality"},
{"t": "conf", "q": "An attorney is a partner in a seven-lawyer firm. The client retained the attorney to handle his workers’ compensation matter. Yet the attorney did not discuss with the client that he would normally disclose to the other partners in the firm some of the details about his cases and clients. At the weekly meeting of the partners, as everyone discussed their pending cases, the attorney explained the client’s case and solicited input from the partners. One partner had an ingenious suggestion that would have been quite helpful to the client’s case. The attorney mentioned to the client in their next phone call that one of his partners had made a brilliant suggestion that could turn the case in the client’s favor. The client was upset that the attorney had discussed the case with anyone else. Is the client correct that the attorney should not have discussed the case with the others at the firm?", "a": ["No, because lawyers in a firm may disclose to each other information relating to a client of the firm, unless the client has instructed that certain information be available only to specified lawyers.", "Yes, because a lawyer has a duty to preserve the confidentiality of client information, even from other lawyers in his law firm, unless the client expressly authorizes disclosure.", "Yes, because the disclosure automatically created potential conflicts of interest for the other lawyers in the firm who might represent clients with adverse interests to this client.", "No, because in this case the disclosure yielded a brilliant suggestion from another lawyer that was immensely helpful to the case, which offsets any potential injury to the client from the disclosure."], "e": "The comments to 1.6 say lawyers in a firm may share client information with each other unless the client has instructed that certain information go only to specified lawyers. Discussing the case at a partners' meeting to get input is impliedly authorized to carry out the representation. The client gave no such instruction, so there was no violation. The helpful result isn't the reason it was proper, and sharing within the firm doesn't create new conflicts. Book cite: Rule 1.6 cmt. [5]. [W3:10–11, 28–29; S3:76]", "r": "Stevenson, 500 MPRE Questions (2019) Q263 · Rule 1.6 Confidentiality"},
{"t": "conf", "q": "Client, a large auto dealer, retains an attorney to represent him in a bankruptcy case. This attorney’s firm represents a bank, through which the client has several large loans that covered loans for the dealership. The loans are all contained in the bankruptcy. The attorney is concerned about whether there is a conflict, so he contacts a lawyer friend of his. While explaining his dilemma, the attorney tells Friend the name of the dealer. Is the attorney subject to discipline?", "a": ["Yes, because the attorney disclosed more than what details were necessary to accomplish his purpose.", "Yes, because attorneys shall not discuss client matters with other lawyers not also serving as counsel for their client.", "No, because attorneys may discuss their cases with other lawyers to ensure they are following the rules of professional conduct.", "No, because the restrictions regarding confidentiality only apply in criminal cases."], "e": "A lawyer may seek ethics advice, but under 1.6(b)(4) only to the extent reasonably necessary, and the comments allow hypotheticals only when there's no reasonable likelihood the listener can identify the client. Naming the dealer was unnecessary for a general conflict question, so the attorney revealed more than his purpose required. Here the friend was just a friend, not retained as the attorney's own counsel, which also undercuts privilege. Lawyers may discuss cases in properly anonymized form, and confidentiality isn't limited to criminal matters. [W3:11, 31–33; S3:46] (MR 1.6 cmt [4])", "r": "Stevenson, 500 MPRE Questions (2019) Q264 · Rule 1.6 Confidentiality"},
{"t": "conf", "q": "A client hired an attorney to represent her in a burglary charge. During a meeting with the attorney and with the understanding that any information would be confidential, the client advised the attorney about a murder she committed. A wrongfully- accused man was presently on trial for that same murder. Eventually, the attorney was able to negotiate a plea deal for the client on her burglary charge. They finalized the plea deal and the attorney’s representation ended. Soon thereafter, the attorney discovered that a jury had convicted an innocent man for the murder the client had committed and confessed to the attorney. The wrongfully-convicted men received a life sentence, without the possibility of parole. The attorney contacted the District Attorney’s office that handled the murder trial and left an anonymous tip stating that the client confessed to committing the murder. Was the attorney’s conduct proper?", "a": ["No, because attorneys cannot disclose client representation information and the death had already occurred, therefore, the disclosure would not prevent certain death or substantial bodily injury.", "Yes, because attorneys have a duty to reveal information, even if confidential, that relates to a crime or fraud committed by his client.", "Yes, because attorneys no longer have a duty not to disclose information relating to the representation of a client once the attorney’s representation of that client terminates.", "No, because an attorney must not leave such tips anonymously, but must make themselves available for questioning and for testifying if making any tip regarding a crime or fraud committed by one of his clients."], "e": "Nothing in 1.6(b) permits disclosing a client's past crime to free a wrongly convicted person. Imprisonment isn't death or substantial bodily harm, the harm can't be 'prevented' after the fact, and the client didn't use the lawyer's services, so (b)(1) through (b)(3) don't apply. The duty continues after the representation ends (1.9(c)), and an anonymous tip is still a disclosure. The readings call this the agonizing miscarriage-of-justice problem: urge the client to come forward. There's no general duty to report a client's crimes. [W3:29–31, 36; S3:43]", "r": "Stevenson, 500 MPRE Questions (2019) Q265 · Rule 1.6 Confidentiality"},
{"t": "conf", "q": "An attorney has been practicing for many years, and he is now representing a client who is a notorious celebrity-turned-criminal in a criminal case involving drug charges. The attorney is confused about whether he may publicly disclose information that he learned in confidence from his client if the information is already a matter of public record, and his research indicates there is a split of authority on this question. Seeking clarification, the attorney calls another lawyer who specializes in lawyer malpractice and lawyer disciplinary matters to seek advice about what course of action would comply with the Rules of Professional Conduct. The other lawyer, an expert in legal ethics, agrees to provide an opinion and to keep the conversation a secret. The attorney tries to use a hypothetical to explain the problem, but given the client’s national reputation and celebrity status, the other lawyer knows immediately who the client is, and can easily surmise the nature of the confidential information. In addition, the attorney mentions that his client is secretly a bisexual and has been having an affair with both the male and female hosts of a nationally televised morning talk show, though neither of them is aware that the other is having an affair with the same person. Is the attorney subject to discipline for disclosing confidential information about his client?", "a": ["Yes, because the lawyer revealed more client information than was necessary to secure legal advice about the lawyer's compliance with the Rules", "Yes, because the attorney used a hypothetical that was obvious enough that the other lawyer immediately knew the identity of the client and the client’s information that the attorney was supposed to protect.", "No, because a lawyer may reveal information relating to the representation of a client to secure legal advice about the lawyer's compliance with the Rules, even when the lawyer lacks implied authorization to make the disclosure.", "No, because a lawyer may disclose confidential information to another lawyer, assuming the other lawyer promises to keep the conversation secret, and the other lawyer has a reputation for complying with the ethical rules."], "e": "1.6(b)(4) lets a lawyer reveal information to the extent reasonably necessary to get legal advice about his own compliance with the Rules, but no further. The ethics question concerned public-record information, and the client's secret affairs with two TV hosts had nothing to do with it. Volunteering them went beyond what was necessary. The obvious hypothetical is a concern, but the clear violation is the gratuitous disclosure. The adviser's promise of secrecy doesn't widen the exception. Book cite: Rule 1.6(b)(4) and cmt. [9]. [W3:26–27, 31–33; S3:46]", "r": "Stevenson, 500 MPRE Questions (2019) Q266 · Rule 1.6 Confidentiality"},
{"t": "conf", "q": "While representing a client, an attorney learned confidential information about the client’s previous marriage and divorce, which occurred many years before in another country. Before the attorney could conclude the matter, the client terminated the representation. Over the next three years, the now- former client became a well-known celebrity, and her prior marriage and divorce received widespread public attention in that region. Very recently, the state bar journal interviewed the attorney about his career and his greatest achievements. One question pertained to the representation of the client who became a celebrity. The attorney mentioned that at the time, the client was an unknown figure and her previous marriage were family secrets. The interviewer was not well-informed about this celebrity and was surprised to hear that the individual had been married and divorced in another country. The former client had never authorized the attorney to discuss her legal matters, but the Model Rules provide a “generally known” exception to the duty of confidentiality to former clients. Would that exception apply to the attorney’s disclosure of the marriage and divorce during the interview?", "a": ["No, because the “generally known” exception does not apply to disclosures by the attorney about former clients.", "Yes, because the information received widespread public attention in that area.", "Yes, because the representation ended when the client fired the attorney, and the duty of confidentiality no longer applied.", "No, because the “generally known” exception applies only after the client’s death."], "e": "1.9(c)(1)'s 'generally known' exception lets a lawyer use a former client's information to the former client's disadvantage. 1.9(c)(2) still forbids revealing it except as the Rules permit. ABA Op. 479 reads the text literally: generally known information may be used, not disclosed. So the attorney couldn't rely on publicity to talk about the marriage in an interview (and the interviewer didn't even know of it). Firing the lawyer doesn't end confidentiality, and the exception isn't tied to death. Book cite: ABA Formal Op. 479. [W3:8–9; S3:8, 20]", "r": "Stevenson, 500 MPRE Questions (2019) Q267 · Rule 1.6 Confidentiality"},
{"t": "conf", "q": "Small Firm is considering hiring an attorney, who currently works for Big Firm, in a lateral move. The attorney is a transactional lawyer, so none of the information he possesses is “privileged” in that it was not in anticipation of litigation. To facilitate the checks for conflicts of interest, the attorney discloses to Small Firm the clients he has represented while at Big Firm. This includes the names of persons and issues involved in the matters, as well as names and issues for matters handled by other lawyers in the firm about which the attorney had overheard or otherwise acquired some confidential information. Small Firm uses the information solely for checking about potential conflicts of interest before making an offer of employment to the attorney. The attorney did not ask any of the clients for authorization to disclose the representation or the nature of the issues involved in their matters. Was it proper for the attorney to disclose this confidential information without the consent of the clients?", "a": ["Yes, because the attorney disclosed the information solely to detect and resolve conflicts of interest arising from the lawyer’s change of employment.", "Yes, so long as the attorney informs the clients subsequently that such disclosures have occurred.", "No, because the attorney did not obtain consent or authorization from the clients before disclosing this information.", "No, because the attorney disclosed not only the clients that he himself represented, but also clients of other lawyers in his firm."], "e": "1.6(b)(7) permits disclosing limited information (typically client identities, the general issues, and whether matters are concluded) to detect and resolve conflicts arising from a lawyer's change of firms, so long as the disclosure doesn't compromise privilege or prejudice the client. Matters he learned about from other lawyers count, because 1.9(b) can disqualify him based on what he knows. Using the information solely for conflicts checks is what the exception contemplates, and client consent isn't required. Book cite: Rule 1.6(b)(7); ABA Formal Op. 09-455. [W3:35] (MR 1.6 cmts [13]–[14])", "r": "Stevenson, 500 MPRE Questions (2019) Q268 · Rule 1.6 Confidentiality"},
{"t": "conf", "q": "An attorney works for a state-operated legal aid clinic, which under a state statute counts as a social service agency. The state has a mandatory reporting law for child abuse, which statutorily requires employees of social service agencies to report any instances of child abuse they discover among their clients or constituents. The attorney met with a prospective client and her child to discuss potential representation at a welfare termination hearing. The prospective client did not meet the agency’s guidelines to be eligible for free legal representation, however, so the attorney had to decline the case. Nevertheless, it was evident during the interview that the prospective client’s child was the subject of serious physical abuse – a black eye, cigarette burns on her arms and neck, bruises on the backs of her legs, and a demeanor of cowering in fear around adults. The attorney wanted to talk to the mother about it, but the attorney has been unable to reach her since declining to represent her. Must the attorney report the prospective client for child abuse?", "a": ["Yes, because state law requires the disclosure, and a lawyer may reveal information relating to the representation of a client to the extent the lawyer has a reasonable belief that it is necessary to comply with other law.", "Yes, because the mother was only a prospective client who was ineligible for representation by the attorney, so the attorney owed her no duty of confidentiality.", "No, because the exceptions to the duty of confidentiality merely permit disclosure, so the attorney “may” report the incident, but there is no duty to do so.", "No, because the attorney met the prospective client only once, and does not know if the abuse occurred at the hands of her mother, or if the child was the victim of a crime at the hands of someone else, and it is not the mother’s fault."], "e": "1.6(b)(6) permits disclosure to the extent reasonably necessary to comply with other law, and a mandatory child-abuse reporting statute covering the attorney's agency is such a law, so he must report. The 1.6(b) exceptions are permissive as a matter of ethics, but the statute supplies the legal duty. A prospective client is still owed confidentiality (1.18(b)), so the exception is what makes the report proper. The duty doesn't depend on knowing who the abuser is. Book cite: Rule 1.6(b)(6). [W3:26, 35; S3:50; W2:41]", "r": "Stevenson, 500 MPRE Questions (2019) Q269 · Rule 1.6 Confidentiality"},
