{"t": "rel", "q": "An attorney represents a client in a family law matter. A hearing is set for Monday. On the Wednesday prior to the scheduled hearing, the client calls the attorney and advises that the client no longer wants the attorney to represent her; the attorney’s representation is over as of the date and time of the call. The client advises that she intends to retain another attorney prior to the hearing. After receiving the call from the client, the attorney schedules another matter for Monday, does not appear at the hearing, and does nothing further on the case. Is the attorney subject to discipline?", "a": ["Yes, if representation has begun, the attorney must to withdraw from the case and take reasonable steps to mitigate consequences to client if discharged by client.", "Yes, the attorney must continue representation of client until attorney receives notice of discharge in writing and signed by client.", "No, if the attorney receives notice of discharge directly from client, whether oral or in writing, attorney can cease work entirely on the case if client is aware of all hearings or other important dates scheduled as of the date of the discharge.", "No, if the attorney has a reasonable belief that the client will have representation by other counsel soon, and that client will not have any consequences as a result of the immediate discharge, then the attorney may discontinue all work on case."], "e": "A discharged lawyer must withdraw (1.16(a)(3)). If he has appeared in a pending matter, he still needs the court's leave (1.16(c)), and any termination requires reasonable steps to protect the client, such as notice and time to hire new counsel (1.16(d)). Even an unfair discharge doesn't excuse those steps (cmt [9]). Booking another matter, skipping Monday's hearing, and doing nothing violated these duties. An oral discharge is effective, so no signed writing is needed, but neither the call nor a hoped-for successor ends the lawyer's obligations to the court. [W2:57–58, 62, 69; S2:98, 140]", "r": "Stevenson, 500 MPRE Questions (2019) Q133 · Rule 1.16 Declining or Terminating Representation"},
{"t": "rel", "q": "An attorney has already represented a certain client on several matters. Most recently, the attorney has represented the client in a litigation matter against the city’s largest manufacturer. The manufacturer, whom the attorney is suing on behalf of the client, is both the city’s largest employer and the largest purchaser of goods and services from small businesses in the area. As the discovery phase winds to a close and the court sets a trial date, the attorney learns that the client misused the attorney’s services in the past to perpetrate fraud by having the attorney submit falsified documents to government entities and to insurance companies. The attorney is furious and yells at the client, using profanity. the attorney then petitions the court to let him withdraw from the representation, stating the reasons in general terms that do not betray specific client confidences. The client strongly objects to the attorney withdrawing from the representation, because the trial is only two months away, and all the other litigation firms in the city have conflicts of interest that prevent them from taking a case against the large manufacturer. It is indisputable that the withdrawal is materially prejudicial to the client, who may have to proceed into the trial pro se or must find a new lawyer from out of town. The court is willing to postpone the trial by three weeks to give the client time to find a new lawyer or prepare to represent himself. Is it proper for the attorney to withdraw from representation in this case, if the court has no objection?", "a": ["Yes, because withdrawal is permissible if the client misused the attorney’s services in the past, even if the withdrawal would materially prejudice the client.", "Yes, because if a court or tribunal has no objection to an attorney withdrawing from a case, then the attorney has no ethical duty to continue the representation.", "No, because a lawyer cannot withdraw from representation, if doing so would have a materially adverse impact on the client.", "No, because the attorney yelled at the client and used profanity, which is completely unprofessional."], "e": "1.16(b)(3) permits withdrawal when the client has used the lawyer's services to commit a crime or fraud. Unlike the ground in (b)(1), it doesn't require that withdrawal be harmless to the client. With the court's permission (1.16(c)) and a general 'professional considerations' statement that protects confidences, the attorney may withdraw two months before trial, but he must still take reasonable steps to protect the client on the way out (1.16(d)). Court permission alone isn't the justification, and the profanity, though unprofessional, isn't the test. Book cite: Rule 1.16 cmt. [7]. [W2:60–61, 64–65]", "r": "Stevenson, 500 MPRE Questions (2019) Q134 · Rule 1.16 Declining or Terminating Representation"},
{"t": "rel", "q": "An attorney had to abandon his home and his vehicle to take refuge in a FEMA rescue shelter following a natural disaster in his area. Some of the attorney’s clients required immediate legal services that the attorney was unable to provide. What would be the attorney’s ethical duty in this situation?", "a": ["The attorney must withdraw from representing the clients mentioned.", "The attorney must temporarily withdraw from the practice of law, and the attorney may seek reinstatement with the bar after the situation returns to normal.", "The attorney must find a way to contact the clients and request their patience.", "The attorney must notify the bar immediately of his situation and request that the bar intervene on behalf of his clients."], "e": "A lawyer who can't provide competent, diligent representation must not continue. If the disaster leaves him unable to provide services his clients urgently need, continuing would violate 1.1 and 1.3, so he must withdraw from those matters (1.16(a)(1)) and take reasonable steps to protect the clients (1.16(d)). ABA Op. 18-482 addresses lawyers' duties after a disaster, including communicating with clients and protecting their files. Nothing requires leaving the practice of law or asking the bar to step in, and asking clients for patience doesn't meet urgent needs. Book cite: Rule 1.16(b)(7); ABA Formal Op. 18-482. [W2:62, 69]", "r": "Stevenson, 500 MPRE Questions (2019) Q136 · Rule 1.16 Declining or Terminating Representation"},
{"t": "rel", "q": "An attorney had a firm that specialized in criminal defense work. He managed a team of young lawyers that worked on DUI cases and other noncomplex cases; while he would handle the more complicated or high-profile cases himself. The attorney received a court appointment to represent a defendant charged in a series of automobile thefts, and quickly reached an impasse with the defendant about whether he should maintain his innocence in the face of overwhelming evidence of his guilt. The appointee-client declared that he would gladly represent himself and maintain his own innocence rather than accept the attorney’s advice of agreeing to a guilty plea in exchange for leniency. The attorney knew that the county did not pay well for taking court appointments, and the defendant did not accept his advice, so he petitioned the court for permission to withdraw from the representation, and the court reluctantly agreed, but ordered the attorney to stay on the case as standby counsel. The defendant proceeded pro se, the jury convicted him, and the judge applied the maximum sentence. Could the attorney be subject to discipline for withdrawing from the representation?", "a": ["No, the attorney may ask for permission to withdraw as counsel, or to serve merely as standby counsel in this scenario.", "Yes, assuming the client can prove that he would have been likely to prevail in the case if the attorney had not withdrawn", "Yes, because he took advantage of the client’s willingness to go pro se and left the client with ineffective representation", "No, because the court attempted to force the attorney to work for much less than he can earn working for a non-appointed client"], "e": "An appointed lawyer may ask the court for leave to withdraw, and when a defendant insists on representing himself, the court may let counsel withdraw and serve as standby counsel. The court granted permission here (1.16(c)), so the attorney complied with the Rules. Whether to plead is the defendant's decision (1.2(a)), so the lawyer couldn't force the plea, and the defendant chose to go pro se. A conviction doesn't make the withdrawal improper, and low pay isn't what justified it. [W2:57–61; W4:35–36, 42] (6.2 isn't discussed in the readings)", "r": "Stevenson, 500 MPRE Questions (2019) Q137 · Rule 6.2 Accepting/Declining Court Appointments"},
{"t": "rel", "q": "A defendant faced criminal charges for running a Ponzi scheme and an elaborate conspiracy to help others commit tax fraud. The government seized all his accounts and assets, so he had no funds to hire defense counsel. The court, therefore, appointed a local attorney to represent the defendant in the case. The attorney had spent his entire career up to that point exclusively handling traffic-court charges and driving-while-intoxicated cases. Realizing that the complex case was far outside his range of experience or ability, the attorney tried to decline the appointment, but the court required a “showing of incompetence.” The attorney followed through with the showing and the court granted the request to withdraw. Were the attorney’s actions proper?", "a": ["Yes, an attorney can seek withdrawal for good cause, such as lack of competence to handle certain specialized legal matters.", "Yes, because an appointed attorney may withdraw at any time for any reason", "No, because an attorney does not have to be an expert in a specific field of law to provide competent representation", "No, the attorney has not sufficiently proven good cause for withdrawal"], "e": "A lawyer may seek to avoid an appointment for good cause, including that the representation would violate the Rules (6.2(a)), for example because he can't become competent in time (1.1). A traffic and DUI lawyer appointed to a complex Ponzi-scheme and tax-fraud prosecution, who made the required showing and got the court's leave, acted properly. Appointed lawyers can't withdraw at will, and while a lawyer needn't be an expert, he must be competent. [W2:2–3; W2:57] (6.2 isn't discussed in the readings)", "r": "Stevenson, 500 MPRE Questions (2019) Q138 · Rule 6.2 Accepting/Declining Court Appointments"},
{"t": "rel", "q": "A court appointed a local solo practitioner to represent an indigent criminal defendant. The attorney sought to decline the appointment on the basis that he did not have legal malpractice insurance; normally, he explained, he could manage his risk of liability by carefully selecting clients whose legal needs were safely within his area of expertise, but the new court appointment involved some unfamiliar legal issues. Moreover, clients who select their attorney themselves are far less likely to blame or sue the attorney than clients who have no choice about the representation. Is the attorney’s motion to decline the court appointment likely to succeed?", "a": ["No, because lack of malpractice insurance is not good cause for withdrawal.", "Yes, because lack of malpractice insurance is always good cause for withdrawal", "Yes, because a court may not force an attorney to provide representation in a case over the attorney’s objection, as the attorney’s diligence and attention will inevitably suffer as a result.", "No, attorneys may not seek to withdraw or decline from representation of indigent defendants, because this would leave too many indigent defendants without representation."], "e": "Under 6.2, a lawyer may avoid an appointment only for good cause: the representation would violate the Rules or law, would impose an unreasonable financial burden, or involves a client or cause so repugnant that it would impair the relationship. Lacking malpractice insurance is none of those. Unfamiliar issues can be handled through study or by associating another lawyer (1.1), and the risk that an appointed client will sue isn't good cause. Courts may compel representation, and lawyers may still seek to decline for genuine good cause. [W2:35; S2:69–70] (6.2 isn't discussed in the readings)", "r": "Stevenson, 500 MPRE Questions (2019) Q139 · Rule 6.2 Accepting/Declining Court Appointments"},
{"t": "rel", "q": "An attorney was representing a criminal defendant, and he agreed to meet with one of the defendant’s co-conspirators to learn more about what happened and to discuss what to expect as the case proceeded. At the beginning of the meeting, the co-conspirator gave the attorney a dollar bill, saying, “This is to establish attorney- client privilege.” The discussions then proceeded as planned. Later, the co-conspirator turned state’s witness against the attorney’s client, and near the end of the proceedings, the prosecution moved to disqualify the attorney due to his conflict of interest. Did it establish attorney-client privilege and a conflict of interest problem when the co-conspirator gave the attorney a dollar?", "a": ["No, giving money to the attorney did not create any attorney-client relationship.", "Yes, giving the lawyer any amount of money before a conversation constitutes a token retainer and creates an attorney-client relationship.", "Yes, giving the lawyer any amount of money before a conversation constitutes a token retainer and creates attorney-client privilege for the conversation, even if the attorney never provides legal representation afterwards.", "No, the dollar was an insufficient amount to create attorney-client privilege."], "e": "Whether a relationship or prospective-client status exists depends on whether the person actually and reasonably believes he is consulting the lawyer about possible representation (1.18 cmt [2]). Handing over a dollar doesn't create that. The lawyer was meeting a co-conspirator to gather facts for his own client, not to represent him, so no relationship or privilege arose and there's no conflict. A token payment is neither necessary nor sufficient for privilege. Book cite: Rule 1.18 cmt. [2]; United States v. Carlisle (N.D. Ind. 2014). [W3:5; W2:35–36; S3:15]", "r": "Stevenson, 500 MPRE Questions (2019) Q140 · Rule 1.18 Duties to Prospective Clients"},
{"t": "rel", "q": "In response to an attorney’s advertising, which describes the attorney’s education, experience, areas of practice, and contact information, an individual sent an email to the attorney describing their legal problem at length, including many personal details. Some of the information was unfavorable to the individual’s legal interests. The attorney, who had never met or had any contact with the individual, read the long email in its entirety, and immediately sent a terse reply declining the representation. There was no consultation with the individual, and the attorney did not promise to provide representation. A few days later, the attorney received an inquiry from the opposing party in the case, and he agreed to represent the opposing party, and used information gleaned from the other individual’s email to prevail in the matter. Was the attorney’s conduct proper?", "a": ["Yes, because the individual who sent the original email was not a prospective client for purposes of the Model Rules, and the attorney had no duty to keep the information confidential.", "Yes, because the attorney declined to provide representation.", "No, because written, oral, or electronic communications, constitute a consultation and meant the first individual was a prospective client.", "No, because advertisements have the effect of soliciting such contacts from prospective clients, which normally include disclosures of confidential information the attorney should protect."], "e": "Someone who sends information on his own initiative in response to advertising that merely describes a lawyer's education, experience, practice areas, and contact information isn't a prospective client, because there's no reasonable expectation that the lawyer is willing to discuss representation (1.18 cmt [2]). So the attorney owed no 1.18(b) confidentiality and could represent the opposing party. Treating every email as a 'consultation' ignores this distinction, which turns on what the lawyer invited. Declining isn't the reason it was proper. Book cite: Rule 1.18 cmt. [2]. [W3:5; S3:12–13]", "r": "Stevenson, 500 MPRE Questions (2019) Q141 · Rule 1.18 Duties to Prospective Clients"},
{"t": "rel", "q": "A family law attorney represented a client in a divorce proceeding. Early in the representation, before the client’s spouse had retained counsel, the attorney advised her client to meet with other lawyers in the area for the sole purpose of creating a conflict of interest, that is, so that the client’s spouse would be unable to retain the other lawyers for representation in the divorce. The client did so, and scheduled consultations with several other divorce attorneys in a “taint shopping” campaign, but he never intended to retain any of their services. Could the attorney be subject to discipline for instructing the client to do this?", "a": ["Yes, because this is dishonest, interferes with the administration of justice, and has no purpose other than to interfere with the opposing party’s ability to form a client- lawyer relationship.", "Yes, because lawyers are normally vicariously liable for their client’s actions.", "No, because the other lawyers will still be able to represent the spouse if the spouse can simply show that the client engaged in taint- shopping.", "No, because the lawyer merely counseled the client, and is not liable for the decisions and actions of the client after that."], "e": "Advising a client to consult lawyers he never means to hire, just to conflict them out of representing his spouse, is dishonest and prejudicial to the administration of justice (8.4(c)–(d)), and getting the client to do it is a violation through another's acts (8.4(a)). It has no purpose but to burden the opponent (4.4(a)). The 1.18 comments say a person who consults a lawyer in order to disqualify the lawyer isn't a prospective client. That protects the other lawyers but doesn't excuse the lawyer who planned the scheme. This is the lawyer's own misconduct, not vicarious liability. Book cite: Rule 1.18 cmt. [2]; Ill. Ethics Op. 12-18 (2012). [W3:6; S3:13]", "r": "Stevenson, 500 MPRE Questions (2019) Q142 · Rule 1.18 Duties to Prospective Clients"},
{"t": "rel", "q": "A family law attorney represented a client in a divorce proceeding. Early in the representation, before the client’s spouse had retained counsel, the attorney advised her client to meet with other lawyers in the area for the sole purpose of creating a conflict of interest, that is, so that the client’s spouse would be unable to retain the other lawyers for representation in the divorce. The client did so; the client scheduled consultations with several other divorce attorneys in a “taint shopping” campaign, but he never intended to retain any of their services. Could one of the other lawyers be subject to discipline for representing the spouse anyway, if they were lucky enough to have evidence to show that the original consultation was merely taint-shopping?", "a": ["Yes, the person was not genuinely seeking legal representation, so the lawyer would have no duty to protect the confidentiality of the information disclosed and no conflict of interest.", "Yes, because the other lawyers all declined the representation immediately.", "No, because a lawyer shall not represent a client with interests materially adverse to those of a prospective client in the same or an overlapping matter if the lawyer received information from the prospective client that could be significantly harmful to that person in the matter.", "No, because the client can easily find other representation, and therefore has suffered no injury."], "e": "⚠ Answer-key warning: The book's keyed answer is worded wrong: its 'Yes' contradicts its own reasoning. The keyed answer begins 'Yes' (subject to discipline), but its reasoning, and the Rule, mean the lawyer may represent the spouse without discipline. Go by the reasoning, not the 'Yes.'\n\nA person who consults a lawyer only to disqualify that lawyer isn't a prospective client (1.18 cmt [2]). The taint-shopping spouse wasn't genuinely seeking representation, so a lawyer who can show that owes no 1.18 duties, has no 1.18(c) conflict, and may represent the other spouse. The readings call this licking all the cookies on the plate and say it fails the subjective half of the test. Book cite: Rule 1.18 cmt. [2]; Ill. Ethics Op. 12-18 (2012). [W3:6; S3:13]", "r": "Stevenson, 500 MPRE Questions (2019) Q143 · Rule 1.18 Duties to Prospective Clients"},
{"t": "rel", "q": "A prospective client consulted with an attorney about the possibility of securing legal representation in a matter. During the conversation, the client shared openly with the attorney about the strengths and weaknesses of her legal claims, including some personal information that would be embarrassing if it became public. Some of the information indicated the prospective client may have already waived some of her legal claims, and she may have been partly at fault on other points. The attorney considered it for a few minutes and then declined the representation, because he felt he could not devote adequate time to the case, and he thought the case was too problematic. In addition, he was skeptical that the prospective client would be able to pay his fees. A few weeks later, some of the attorney’s other matters settled sooner than expected, freeing up his schedule, and another prospective client came for a consultation, who turned out to be the opposing party in the legal matter that the attorney had recently declined. This new prospective client had already gathered some convincing evidence supporting his side, and was wealthy, so paying the attorney’s fees was not an issue. Would it be proper for the attorney to proceed with representing this new prospective client?", "a": ["No, because the information learned from the first consultation with the other party would be so helpful to the new client, and so harmful to the individual the attorney declined to represent.", "Yes, because no attorney-client relationship formed with the previous consultation, and the reasons for declining that case do not seem to apply now to the new prospective client.", "Yes, because the information learned from the first consultation with the other party will be quite helpful to the new client.", "No, because when the attorney’s schedule freed up, he had a duty to contact the client he turned away and offer to represent her first."], "e": "A lawyer who received information from a prospective client that could be significantly harmful to her may not represent a client with materially adverse interests in the same matter (1.18(c)). The attorney learned of her possible waivers, her partial fault, and embarrassing facts, exactly what would help her opponent. So he can't take the new client unless both give informed consent, confirmed in writing (1.18(d)(1)). That no relationship formed doesn't matter, because 1.18 protects prospective clients anyway. He had no duty to offer her the case first. [W3:4–5; S3:10–12; W2:41]", "r": "Stevenson, 500 MPRE Questions (2019) Q144 · Rule 1.18 Duties to Prospective Clients"},
{"t": "rel", "q": "An attorney undertook the representation of a client in a breach of contract claim and began working on the matter. A few weeks later, the opposing party in the litigation consulted with another lawyer in the attorney’s firm about the same matter, but during the consultation, disclosed no confidential information except the identity of the other party and the nature of the claim. The other lawyer did a routine conflict check, quickly discovered the conflict with this new potential client, and immediately declined to represent the party. The lawyer and the attorney already representing the first client discussed the situation. Would it be proper for the attorney to disclose to his client that the opposing party had come in for a consultation with another lawyer in his firm?", "a": ["The attorney may not disclose to the client that the opposing party consulted with another lawyer in the firm but may continue to represent the client if the attorney does not use any information gleaned from the other party’s consultation against the other party.", "The attorney has an ethical duty to inform his client that his firm conducted an uninformative initial consultation with the opposing party and declined the representation immediately.", "The attorney has an ethical duty to withdraw from the representation because another lawyer at his firm consulted with the opposing party after the representation began.", "The attorney may disclose to his client that the opposing party had an initial consultation with another lawyer in his firm, and that the other lawyer immediately declined the representation."], "e": "Information learned from a prospective client, including the fact of the consultation and the person's identity, is protected even if no relationship forms (1.18(b); 1.6 cmt [3]). So the attorney may not tell his client that the opponent consulted another lawyer at the firm. Because the opponent disclosed nothing significantly harmful, there's no 1.18(c) conflict, and the firm may keep representing the client as long as nothing from the consultation is used against the opponent. There's no duty to tell the client, and withdrawal isn't required. Book cite: ABA Formal Op. 90-358; Rule 1.18. [W3:7–8; S3:10–12]", "r": "Stevenson, 500 MPRE Questions (2019) Q145 · Rule 1.18 Duties to Prospective Clients"},
{"t": "reg", "q": "Client hired an attorney to represent her federal court litigation, defending against antitrust enforcement actions by the Federal Trade Commission and the Department of Justice. The attorney adopts a “quagmire” strategy, burying the government lawyers in several dozen motions to limit or compel discovery, to compel admissions or stipulations, to limit the admissibility of certain evidence or witness testimony, and so on. On a few occasions, the attorney even re-filed a motion after the court ruled on the motion in the government’s favor, merely to make the government lawyer spend the time filing objections or replies based on the court’s previous ruling on the same issue. The government lawyers filed a complaint against the attorney with the state bar authorities, but the state disciplinary authority decided not to pursue the matter, in part because it was in federal court and involved exclusively federal issues. Could the attorney also face sanctions or penalties under federal law, if the state bar rejected the complaint?", "a": ["Yes, a federal statute authorizes federal courts to require a lawyer to pay all the excess costs, expenses, and legal fees incurred because of the lawyer “unreasonably and vexatiously” multiplying the proceedings.", "Yes, but only because some of the motions were redundant, and may have come after the state disciplinary authority rendered its no-action decision.", "No, because discipline of lawyers over frivolous or vexations litigation is exclusively a matter of state law, so the judge should simply refer the matter again to the state disciplinary authorities, who are more likely to take it seriously if it comes from a federal judge.", "No, because the Free Speech Clause of the constitution gives lawyers an absolute right to file motions on their clients’ behalf in federal court."], "e": "Apart from state discipline, 28 U.S.C. § 1927 lets federal courts make a lawyer personally pay the excess costs, expenses, and fees caused by multiplying the proceedings 'unreasonably and vexatiously.' Re-filing motions the court has already decided, just to force the government to respond, is a textbook example, and courts also have Rule 11 and their inherent power. Discipline and court sanctions are independent, so the state bar's decision doesn't bar federal sanctions, and the First Amendment doesn't protect frivolous filings. Book cite: 28 U.S.C. § 1927. [W1:34–35, 38–39; S1:46]", "r": "Stevenson, 500 MPRE Questions (2019) Q149 · Rules 3.1 Meritorious Claims & Contentions"},
{"t": "conf", "q": "An attorney represents a client in a civil litigation matter. As they prepare for trial, at which the client will testify as a witness on his own behalf, the attorney realizes that the client is unlikely to tell the truth, even though the client insists he will be completely truthful. Even so, the attorney believes there is some chance that the client is indeed telling the truth, but he is about 70% certain that the client is being untruthful, despite the client’s protestations. Does the attorney have an ethical duty to try to prevent the client from presenting testimony that the attorney believes is unlikely to be true?", "a": ["No, because the prohibition against offering false evidence only applies if the lawyer knows that the evidence is false, and a lawyer’s belief that evidence is false does not preclude its presentation to the trier of fact.", "Yes, a lawyer cannot suborn perjury, or even risk that the testimony he is eliciting via direct examination is perjury.", "Yes, a lawyer must disclose to the court that he does not believe the client’s testimony and have the court give the client an opportunity to testify in a narrative mode.", "No, because the opposing party will have an opportunity to impeach the witness and the testimony during cross-examination."], "e": "3.3(a)(3) forbids offering evidence the lawyer knows is false. Knowing means actual knowledge (which can be inferred from circumstances), and a 70% belief that the client will lie isn't knowledge. So the lawyer has no duty to keep out testimony he only suspects is false, though he should urge truthfulness. In a civil case he may refuse to offer evidence he reasonably believes is false, but he isn't required to. No rule requires announcing his doubts to the court. Book cite: Rule 3.3 cmt. [8]. [W2:85 n.32; W3:39–40 n.6] (3.3's knowledge standard isn't discussed in the readings)", "r": "Stevenson, 500 MPRE Questions (2019) Q158 · Rule 3.3 Candor Toward Tribunal"},
{"t": "conf", "q": "A client is a defendant in a criminal prosecution, and a certain attorney is his court- appointed defense lawyer. The client wants to testify at his own trial, despite the attorney’s recommendations that he not do so. As they are preparing for trial, the attorney asks the client what he plans to say on the stand. The client’s story seems suspicious to the attorney – he has serious doubts about its veracity – but the client insists that he is telling the truth, and the attorney is not sure. Does the attorney have an ethical duty to allow the client to give this improbable testimony at trial?", "a": ["Yes, because in a criminal case, a lawyer cannot refuse to offer the testimony of a client where the lawyer believes, but does not know, that the testimony will be false; unless the lawyer knows that the testimony will be false, the lawyer must honor the client’s decision to testify.", "Yes, because a lawyer cannot control what a client will say once the client is on the stand under oath.", "No, because a lawyer should refuse to offer testimony or other proof that the lawyer believes is false; offering such proof may reflect adversely on the lawyer's ability to discriminate in the quality of evidence and thus impair the lawyer's effectiveness as an advocate.", "No, because the lawyer has a duty of candor to the court and cannot allow a criminal defendant to abuse the legal process by testifying falsely to obtain a wrongful acquittal."], "e": "In a criminal case, the defendant decides whether to testify (1.2(a)), and the comments say a lawyer can't refuse to offer a criminal defendant's testimony that the lawyer believes, but doesn't know, is false. Unless the lawyer knows the testimony will be false, he must honor the client's decision after counseling him. The 'should refuse what you believe is false' answer applies only to other evidence, not to a criminal defendant's own testimony. The duty of candor turns on knowledge, not doubt. Book cite: Rule 3.3 cmt. [9]. [W4:35–36; W2:85 n.32] (3.3 cmt [9] isn't discussed in the readings)", "r": "Stevenson, 500 MPRE Questions (2019) Q159 · Rule 3.3 Candor Toward Tribunal"},
{"t": "conf", "q": "A certain attorney is a criminal defense lawyer, and he represents a client, who is facing charges for burglary of a private residence. The client has asserted an alibi – he claims that on the evening of the burglary, he was 100 miles away on a romantic getaway with his girlfriend. Naturally, the attorney interviews the client’s girlfriend, who recounts a similar story about being on a romantic getaway, but a few details do not match the client’s account, such as what they ordered for dinner when they stopped at a restaurant, and whether they had to stop for gas along the way. The attorney suspects the girlfriend is lying to protect the client, and that they rehearsed an alibi story without working through the fine details together. The attorney lectures both the client and his girlfriend about the wrongfulness of perjury and the fact that they do not have to testify at all, as well as the hazard of having their stories crumble under rigorous cross-examination. Is it permissible, under the Rules of Professional Conduct, for the attorney to call the client and his girlfriend as witnesses during trial?", "a": ["Yes, because the attorney does not know with certainty that they are lying, he must allow the client to testify, and it is permissible to call the girlfriend as a witness as well.", "Yes, because a lawyer in a criminal case has no duty to screen witnesses based on whether they plan to tell the truth.", "No, because the attorney may not call the girlfriend as a witness, but he has no choice about allowing the client to testify.", "No, because it would be improper for the attorney to call either the client or the girlfriend to testify if he is not mostly certain that each one will tell the truth."], "e": "Without actual knowledge that the testimony will be false, a criminal defense lawyer must let the client testify if he chooses (1.2(a); 3.3 cmt [9]). For other witnesses, a lawyer may refuse to call someone he reasonably believes will lie, but he isn't required to. Small inconsistencies in an alibi create suspicion, not knowledge, so calling the girlfriend is permissible, and the lawyer properly warned both against perjury. There's no 'mostly certain' standard. Book cite: Rule 3.3 cmt. [9]. [W4:35–36; W2:85 n.32]", "r": "Stevenson, 500 MPRE Questions (2019) Q160 · Rule 3.3 Candor Toward Tribunal"},
{"t": "conf", "q": "An attorney represented a defendant in a criminal proceeding. While preparing for trial, the defendant told the attorney that the main witness for their side, the defendant’s friend who planned to corroborate his alibi, intended to lie on the witness stand. The attorney tried to dissuade the client and the witness from this course of action. He explained that committing perjury could subject the client to additional criminal changes, and that a rigorous cross- examination from the prosecutor would certainly expose the lies. Even so, the witness insisted on testifying at trial and stated his intention to present a fabricated version of the alibi. Should the attorney allow the witness to testify, and examine the friend as a witness, under these circumstances?", "a": ["No, the attorney must either disclose the contemplated perjury to the tribunal, or refuse to call the witness, or withdraw from the representation.", "Yes, because the attorney fulfilled his ethical duty by trying to dissuade his client and the friend from perjury, and the prosecutor has an opportunity to cross- examine the witness.", "Yes, if the untruthful testimony is not material to the case and is unlikely to affect the outcome of the litigation.", "No, the attorney must withdraw from representation before the testimony occurs."], "e": "Once a lawyer knows a witness intends to lie, he may not offer the testimony (3.3(a)(3)). If he can't dissuade the witness, he must take reasonable remedial measures: refuse to call the witness, withdraw if necessary, and where needed disclose the intended perjury to the tribunal, even if that reveals confidences (3.3(b)–(c)). Trying to dissuade isn't enough when the witness insists, and materiality is irrelevant when evidence is known to be false. Withdrawal is one option, not the only required step. Book cite: Model Rule 3.3(b). [W3:39–40 n.6; W2:85 n.32]", "r": "Stevenson, 500 MPRE Questions (2019) Q161 · Rule 3.3 Candor Toward Tribunal"},
{"t": "conf", "q": "A litigation attorney represented a client in a lawsuit. The case was still at the pre-trial phase, and the parties had filed cross-motions for summary judgement. While researching the case law to write a responsive brief, the attorney discovered, to her dismay, a new decision from highest court in a sister jurisdiction that is directly adverse to her position in the case. In the attorney’s own jurisdiction, the issue presents a case of first impression. The briefs from opposing counsel never mentioned this new decision, presumably because the other lawyer had not yet seen it. Is it improper for the attorney to keep this information confidential, and not disclose the unfavorable authority to the court?", "a": ["No, the case is not controlling authority in that jurisdiction.", "Yes, a lawyer must disclose to the tribunal legal authority in the controlling jurisdiction known to the lawyer to be directly adverse to the position of the client and not disclosed by opposing counsel.", "Yes, because it is very common for litigators to recycle their briefs for years at a time, and everyone should help each other out with updating their legal research on issues that arise frequently in that area of litigation.", "No, because it would be a breach of the attorney’s duty of loyalty to his own client to disclose a case unnecessary that undermines their position."], "e": "3.3(a)(2) requires disclosing legal authority in the controlling jurisdiction that the lawyer knows is directly adverse and that opposing counsel hasn't disclosed. A decision from a sister state's high court isn't controlling where the issue is one of first impression, so the attorney may leave it out, though citing it may still be wise since the court or the opponent may find it. The loyalty rationale is wrong: loyalty never justifies hiding controlling adverse authority. Book cite: Model Rule 3.3(a)(2). [W2:85 n.32] (3.3(a)(2) isn't discussed in the readings)", "r": "Stevenson, 500 MPRE Questions (2019) Q163 · Rule 3.3 Candor Toward Tribunal"},
{"t": "conf", "q": "An experienced attorney represented a client in commercial litigation. During a deposition, the client gave answers that the attorney knew to be false, regarding a matter of great relevance to the case. The attorney sat silently and permitted the client to give these answers in the deposition. At the subsequent trial, opposing counsel submitted convincing evidence showing that the client had lied during the deposition. It was evident from the circumstances that the attorney must have known that the client’s statements were untruthful at the time. Opposing counsel then filed a grievance against the attorney for allowing the client to give false testimony and failing to rectify it. When the attorney filed a response to the grievance, he explained that alleged ethical violation took place during a deposition, long before the trial, so the duty of candor to the tribunal was inapplicable at that point. Is the attorney correct in this argument?", "a": ["Yes, the Model Rules require a lawyer to take remedial measures when a client offers false statements even during a deposition.", "Yes, unless it appears that opposing counsel already knows that the statements are false and is planning to impeach the witness.", "No, if the client was testifying in a deposition, it is not testimony before a tribunal for purposes of the ethical rules requiring candor.", "No, the duty to protect client confidentiality and a duty of loyalty to the client would prohibit such a disclosure."], "e": "⚠ Answer-key warning: The book's keyed answer is worded wrong: its 'Yes' contradicts its own reasoning. The keyed answer begins 'Yes,' but its reasoning shows the attorney is wrong. The correct point is that 3.3 applies at depositions.\n\n3.3's duties apply in ancillary proceedings conducted under a tribunal's authority, such as depositions (3.3 cmt [1]). A lawyer who knows his client gave materially false deposition testimony must take reasonable remedial measures, including disclosure to the tribunal if necessary (3.3(a)(3)), even if that reveals confidences (3.3(c)). So the 'it was only a deposition' defense fails, and confidentiality and loyalty don't override 3.3. Book cite: Rule 3.3 cmt. [1]. [W3:39–40 n.6; W2:85 n.32]", "r": "Stevenson, 500 MPRE Questions (2019) Q164 · Rule 3.3 Candor Toward Tribunal"},
{"t": "conf", "q": "An attorney represented a client in civil litigation. Early in the trial, the attorney had to testify briefly about an uncontested point. The testimony was necessary to establish a minor antecedent point for more critical issues in the case. The attorney made statements that she believed to be true at the time. The next day, while the trial was still underway, the client fired the attorney. When the attorney tried unsuccessfully to dissuade the client from doing so, the client told the attorney that the attorney’s testimony was incorrect, and the client also explained some previously unknown information. Under these circumstances, could the attorney keep this information confidential, instead of taking remedial measures to rectify the false statements?", "a": ["No, because a lawyer must correct a false statement of material fact or law previously made to the tribunal by the lawyer.", "Yes, because the attorney was not aware at the time that the statements were false, and therefore did not knowingly mislead the tribunal.", "Yes, because the lawyer has a duty of confidentiality that continues even after a client discharges the lawyer.", "No, because the client discharged the attorney, and no duty of confidentiality remains after the termination of representation."], "e": "A lawyer must correct a false statement of material fact she previously made to the tribunal, even an innocent one (3.3(a)(1)). The duty lasts until the proceeding ends and applies even if correcting the statement reveals 1.6 information (3.3(c)). The readings say 3.3 requires correcting a false statement even if you believed it when you made it. Being fired mid-trial doesn't end the duty, and confidentiality, which does survive discharge, doesn't override it. Book cite: Model Rule 3.3(a)(3). [W2:85 n.32; W3:39–40 n.6]", "r": "Stevenson, 500 MPRE Questions (2019) Q165 · Rule 3.3 Candor Toward Tribunal"},
{"t": "conf", "q": "Early in the pre-trial phase of a civil lawsuit involving multiple cross-claims, the court enjoined the parties from transferring any assets out of the jurisdiction. The next day, an attorney heard that his client had transferred millions of dollars to a confidential Swiss bank account. The attorney did not make any affirmative representations to the court about following the court’s order. It was clear to the attorney, however, that the court and the opposing party were under the impression that the client was complying with the court’s order, and they were relying upon that fact in the ongoing proceedings. The client did not use the attorney’s services in any way to make the transfers, and the attorney did not recommend it or know about it until after it occurred. Would it be improper for the attorney to do nothing and say nothing about the matter at this time, to protect the client’s confidential information?", "a": ["Yes, because this is a circumstance where failure to make a disclosure is the equivalent of an affirmative misrepresentation.", "Yes, because a lawyer always has a duty to inform the court if a client is engaged in illegal or fraudulent conduct, even if it is unrelated to the attorney’s representation.", "No, because the client has not made any false statements to the court.", "No, because the attorney has not made any material misrepresentations to the court."], "e": "Under ABA Op. 98-412, a lawyer who learns that a client violated a court order against transferring assets can't stay silent while the court and the opponent proceed believing the client complied. The 3.3 comments recognize that silence can be the equivalent of an affirmative misrepresentation. The lawyer must take remedial measures, first urging the client to undo the transfer and then disclosing to the extent necessary, even if that reveals confidences (3.3(b)–(c)). No false statement is needed. There's no general duty to report unrelated client crimes. Book cite: ABA Formal Op. 98-412; Rule 3.3. [W3:39–40 n.6; W2:85 n.32] (MR 3.3 cmt [3])", "r": "Stevenson, 500 MPRE Questions (2019) Q166 · Rule 3.3 Candor Toward Tribunal"},
{"t": "conf", "q": "A litigation attorney normally represented clients at trial or in binding arbitration, but in some instances, she will represent a client in a mediation. In one mediation, the attorney knowingly made untrue statements of fact to the other party and opposing counsel. Has the attorney violated her ethical duty of candor to the tribunal, as delineated in Model Rule 3.3?", "a": ["No, the duty of candor in Model Rule 3.3 is inapplicable to mediation; nevertheless, other rules such as Rule 4.1 may apply to the lawyer’s untruthfulness here.", "Yes, a lawyer shall not knowingly make a false statement of fact to a tribunal or fail to correct a false statement of material fact.", "Yes, in mediation, a lawyer shall not knowingly offer evidence that the lawyer knows to be false.", "No, the lawyer does not have a duty to avoid making false statements to other parties, only to a judge."], "e": "3.3 governs candor to a tribunal, meaning a court, arbitrator, or other body acting in an adjudicative capacity. A mediation isn't a tribunal, so 3.3 doesn't apply (ABA Op. 06-439). But a lawyer may not knowingly make false statements of material fact to anyone, including in mediation (4.1(a)), and 8.4(c) bars dishonesty generally. So the answer that lawyers need only avoid lying to judges is wrong. Book cite: Rule 3.3; ABA Formal Op. 06-439 n.2; Rule 2.4 cmt. [5]. [W2:41, 67; outline VI-F]", "r": "Stevenson, 500 MPRE Questions (2019) Q167 · Rule 3.3 Candor Toward Tribunal"},
{"t": "reg", "q": "An attorney responded to a distressed call from a client asking that he meet him immediately on the street behind the attorney’s office. Immediately, the attorney rushes downstairs to meet the client outside his building. The client is very distraught and has blood splattered on his clothes, hands, and face, and is holding a pistol. The client stammers, “You will not believe what just happened.” Quietly, the attorney takes the pistol and throws it down the closest storm gutter on the street, and they can hear the gun clanging against concrete as it tumbles deep down into the storm sewer. Then the attorney says, “It is late, and you are too upset to talk. Go home and clean yourself up and do your laundry – you are a mess. We can discuss this tomorrow morning when you are in a better frame of mind.” The client goes home to shower and launder his clothes, and the attorney returns to his office and resumes his work on the brief he was writing. Did the attorney’s conduct constitute a violation of his ethical duties?", "a": ["Yes, because the attorney concealed or obstructed the police’s access to potential evidence by discarding the gun, and he counseled the client to destroy the evidence on his clothes.", "Yes, because he had a duty to inquire about what had happened and to call the police or emergency services if someone had been hurt.", "No, because the attorney does not know if the client has perpetrated a crime or if he was the victim of a crime, so he has not destroyed evidence knowingly; perhaps the client just saved someone else from a violent attacker.", "No, because the gun is still retrievable from the storm sewer, and the attorney could still testify about his observations of the client’s appearance when they met."], "e": "3.4(a) bars unlawfully obstructing access to evidence, or altering, destroying, or concealing material with potential evidentiary value, and bars counseling anyone else to do so. Throwing the client's gun into a storm sewer and telling him to shower and wash his bloody clothes does both, and is likely criminal obstruction too (8.4(b)). Not knowing exactly what happened is no excuse, since the items obviously had potential evidentiary value. That the gun might be recovered doesn't help. Book cite: Rule 3.4(a)–(b). [W2:72; W1:51; S1:111–113]", "r": "Stevenson, 500 MPRE Questions (2019) Q169 · Rule 3.4 Fairness to Opposing Party and Counsel"},
{"t": "reg", "q": "During trial, the plaintiffs complained that the attorney’s client had not fully complied with certain production requests during discovery. The judge ordered the attorney to produce the specific records. Yet the attorney believed that his client had no legal obligation to produce the records in question, because they included important trade secrets and were not relevant or material to the current litigation in any way. The attorney openly refused to produce the records and explained his position to the judge. The judge disagreed and ordered the attorney to bring the records to the courtroom the next day. Of course, the attorney did not obey the judge’s order. Apart from any potential contempt-of- court sanctions, could the attorney be subject to discipline for violating the Rules of Professional Conduct?", "a": ["No, because a lawyer may disobey an order from a tribunal when the lawyer has made an open refusal based on an assertion that no valid obligation exists.", "Yes, because a lawyer must not knowingly disobey an obligation under the rules of a tribunal.", "Yes, because the proper response would be to produce the records and then object to their admissibility at trial.", "No, because in an adversarial proceeding, the judge should rely on the evidence that the parties present, rather than meddling with discovery and production of evidence."], "e": "⚠ Answer-key warning: The book's keyed answer is debatable. The exception is meant for good-faith tests of an order's validity, usually by accepting contempt to get appellate review. The course's Problem 8B-6 teaches that once ordered, you comply after seeking a stay or review. Refusing a definitive production order is risky.\n\n3.4(c) bars knowingly disobeying an obligation under a tribunal's rules, except an open refusal based on an assertion that no valid obligation exists. The attorney told the judge openly that he believed no valid obligation existed, so on the book's view his refusal falls within that exception for disciplinary purposes, though contempt remains possible. The Rule doesn't require producing the records and then objecting. Book cite: Rule 3.4(c). [S3:96–98]", "r": "Stevenson, 500 MPRE Questions (2019) Q170 · Rule 3.4 Fairness to Opposing Party and Counsel"},
{"t": "reg", "q": "During the discovery phase of business litigation, Conglomerate Corporation receives a discovery request asking for “all documents, memoranda, emails, or other internal correspondence related to the transaction that is the subject of this dispute.” A certain attorney represents Conglomerate Corporation. Thousands of documents stored in electronic format on Conglomerate’s computers and servers would arguably fall under this request for production. Then the attorney proposes to opposing counsel that they produce the requested documents in electronic form on a set of compact discs, and the opposing counsel readily agrees. Long before the litigation began, the attorney began using software to scrub the metadata from documents – electronically embedded information about the name of the user whose computer created the document, the date and time of creation, redlined changes from each stage of editing, and comments that other readers added to the document before it took its final form. Proposed contracts, letters to business partners, and correspondence with opposing counsel are all free from embedded metadata. Was it proper for the attorney to scrub the metadata from electronic documents that could potentially be subject to a discovery or production request in future litigation?", "a": ["Yes, because a lawyer may take measures to eliminate metadata from documents that could later fall into the hands of an opposing party.", "Yes, because the printed copies of the documents would not have had such information.", "No, because the main reason for scrubbing metadata is to conceal information that might be useful to an opposing party or tribunal in the future.", "No, because the metadata is often necessary for determining who created a document, when they created it, or how the document changed from its original draft to its final form."], "e": "Removing metadata in the ordinary course of business, before any litigation or duty to preserve, is proper. Lawyers may take reasonable steps to keep metadata (comments, edits, authorship) away from opposing parties, and the readings treat scrubbing metadata as part of technological competence and confidentiality. Nothing was hidden from a pending discovery request. Printed copies aren't the reason, and metadata's usefulness to an opponent creates no duty to keep it before litigation. Book cite: ABA Formal Op. 06-442. [W2:8, 21–22; S2:33–34]", "r": "Stevenson, 500 MPRE Questions (2019) Q171 · Rule 3.4 Fairness to Opposing Party and Counsel"},
{"t": "reg", "q": "During the discovery phase of business litigation, Conglomerate Corporation receives a discovery request asking for “all documents, memoranda, emails, or other internal correspondence related to the transaction that is the subject of this dispute.” An attorney represents Conglomerate Corporation. Thousands of documents stored in electronic format on Conglomerate’s computers and servers would arguably fall under this request for production. The attorney proposes to opposing counsel that they produce the requested documents in electronic form on a set of compact discs, and the opposing counsel readily agrees. After receiving the production request, the attorney began using software to scrub the metadata from documents – electronically embedded information about the name of the user whose computer created the document, the date and time of creation, redlined changes from each stage of editing, and comments that other readers added to the document before it took its final form. Proposed contracts, letters to business partners, and memoranda between managers all have their embedded metadata erased. Was it proper for the attorney to scrub the metadata from electronic documents before delivering them to the other party in response to a discovery request?", "a": ["No, because the main reason for scrubbing metadata is to conceal information that might be useful to an opposing party or tribunal in the present litigation.", "Yes, because the printed copies of the documents would not have had such information.", "Yes, because a lawyer may take measures to eliminate metadata from documents that could later fall into the hands of an opposing party.", "No, because the metadata is often necessary for determining who created a document, when they created it, or how the document changed from its original draft to its final form."], "e": "Once a discovery request is pending, responsive documents, including their embedded metadata, are potential evidence. Scrubbing that metadata after the request arrives and before production alters and conceals material with evidentiary value, which 3.4(a) forbids, and it undermines the discovery request (3.4(d)). That routine pre-litigation scrubbing would have been fine doesn't help, because timing is what matters. Book cite: ABA Formal Op. 06-442. [W2:72; W2:8; S1:111–113]", "r": "Stevenson, 500 MPRE Questions (2019) Q172 · Rule 3.4 Fairness to Opposing Party and Counsel"},
{"t": "reg", "q": "An Assistant U.S. Attorney (federal prosecutor) is working for the Department of Justice, and he must prosecute the defendants arrested in a high-profile sting operation against a terrorist cell. This attorney faces tremendous political and media pressure to win convictions at any cost. As a result, the attorney argues with his supervisor that he is not subject to local ethics rules, as he is litigating exclusively in federal court in cases involving federal law, and that he should therefore be immune from state bar disciplinary proceedings. Is the attorney correct?", "a": ["No, because federal statute, as well as Department of Justice regulations, subject federal prosecutors to the ethics rules of the state where such the attorney engages in that the attorney’s duties.", "Yes, because of federal preemption of state law, a federal prosecutor who litigates exclusively in federal court, under federal law, does not come under the jurisdiction of the local bar disciplinary authorities.", "Yes, because under the USA Patriot Act, federal prosecutors are immune from disciplinary actions for their decisions in antiterrorism prosecutions.", "No, because the attorney will inevitably have cases that involve questions of state law or will have cases transferred to state court."], "e": "Under the McDade Amendment (28 U.S.C. § 530B) and DOJ regulations, federal government lawyers are subject to the ethics rules and discipline of each state where they practice, just like other lawyers there. Litigating only federal cases in federal court doesn't exempt a federal prosecutor, and there's no anti-terrorism immunity. The answer that relies on future state-law cases gets the reason wrong. Book cite: 28 U.S.C. § 530B; 28 C.F.R. § 77.3. [W1:47 n.25; outline I-C]", "r": "Stevenson, 500 MPRE Questions (2019) Q209 · Rule 3.8 Special Responsibilities of a Prosecutor"},
{"t": "reg", "q": "An attorney worked as in-house general counsel for Big Bank. The Federal Trade Commission was holding a series of hearings about the consolidation of the industry and anticompetitive activities, and certain consumer protection groups were advocating in the hearings for regulatory reforms. In one instance, the consumer protection groups persuaded the Commission to subpoena certain corporate from the largest banks to show that they had engaged in undetected predatory pricing and price gouging following natural disasters. After hearing about the request for this subpoena, but before receiving service of it from the Commission, the attorney deleted several computer archives about the company’s pricing patterns, and shredded printed records pertaining to the same subject. Big Bank was not currently the target of an enforcement action, and no litigation was pending or immediately contemplated regarding this information. Was it permissible for the attorney to clean up the company archives before receiving a subpoena from the Commission for its public hearings?", "a": ["No, the attorney obstructed another party' s access to evidence and destroyed documents or other material having potential evidentiary value.", "Yes, a lawyer should act with commitment and dedication to the interests of the client and with zeal in advocacy upon the client's behalf.", "Yes, this was not an adjudicative proceeding or appearance before a tribunal, so the attorney’s duty to protect client confidentiality was paramount.", "No, lawyers have a duty when representing a client before an agency in a nonadjudicative proceeding to collaborate with other interested parties and cooperate fully with their requests for information."], "e": "3.9 requires a lawyer representing a client before an agency in a nonadjudicative proceeding to comply with 3.3(a)–(c), 3.4(a)–(c), and 3.5. So 3.4(a)'s ban on unlawfully obstructing access to evidence or destroying material with potential evidentiary value applies at FTC hearings. Shredding and deleting pricing records after learning a subpoena was being sought is exactly that, and likely obstruction too (8.4(b)–(d)). Zeal never justifies it, and confidentiality doesn't cover destroying evidence. No rule requires general cooperation with other parties. [W2:72; W1:51] (3.9 isn't discussed in the readings)", "r": "Stevenson, 500 MPRE Questions (2019) Q219 · Rule 3.9 Advocate in Nondajudicative Proceedings"},
{"t": "comp", "q": "An attorney had graduated from law school near the bottom of his class, but he told himself that every year someone at graduation had to be at the bottom of their class. Besides, his mentor always told him that law school classes have nothing to do with the actual practice of law. The attorney was unaware that his 1L Civil Procedure Professor had miscalculated his grade two full letter grades higher than he deserved, and otherwise he would have failed out before his second year. The attorney invested a reasonable amount of time preparing for his clients' cases, and put in normal effort for an attorney, but still was far behind his fellow lawyers in his ability. He lacked knowledge of settled principles of Law and was not aware of recent developments in case law and legislation in his area of practice, even though he tried and made an earnest effort, often trying even harder than the lawyers around him, who seemed to coast along effortlessly by comparison. His intentions were always good, and he genuinely cared about his clients. Could the attorney be subject to discipline, including disbarment, for incompetent representation?", "a": ["Yes, he lacks basic knowledge and skills necessary, despite his efforts and good intentions.", "Yes, if he was never supposed to graduate from law school in the first place, but for that professor’s mistake that inured to his benefit.", "No, the evaluation of competence takes into consideration how hard the lawyer tries and whether he has the right intentions.", "No, because for many clients, he certainly knows enough to get by, given that most cases settle quickly."], "e": "Competence under 1.1 is objective: the legal knowledge, skill, thoroughness, and preparation reasonably necessary for the representation. A lawyer who lacks settled legal principles and doesn't know recent developments in his own field falls short however hard he tries and however good his intentions. Effort and caring don't substitute for competence, and 'enough to get by because most cases settle' isn't the standard. The professor's grading error is irrelevant; the question is his current ability. Book cite: Rule 1.1. [W2:2–3, 9–10; outline V-A]", "r": "Stevenson, 500 MPRE Questions (2019) Q221 · Rule 1.1 Competence"},
{"t": "comp", "q": "An attorney has spent his entire career practicing family law, and he has never done a criminal trial before. When asked to take a pro bono criminal case, he whimsically agreed, because the attorney was going through a midlife crisis and wants to try something new. The attorney invested time studying and researching the relevant law and court procedures so that he knows how to proceed and how to advise the client, but still feels nervous doing this for the first time, and certainly does not have the same expertise as the most experienced lawyers in the area. Could the attorney be subject to discipline for his lack of competence?", "a": ["No, an attorney can provide competent representation in an entirely new area with adequate study and preparation.", "Yes, he has never done a criminal trial before and a defendant is completely depending on him.", "Yes, he did not spend time carefully considering the decision before agreeing to take the case, and took the case because of a midlife crisis, which is improper.", "No, the client is pro bono, so the attorney does not have to meet usual standards of competency."], "e": "A lawyer can become competent in a new field through reasonable study and preparation. The comments say a lawyer may take a matter when the needed competence can be achieved by reasonable preparation, and that prior experience isn't always required. The family lawyer studied the criminal law and procedure he needed, so he can provide competent representation even without a veteran's expertise. His reasons for taking the case don't matter. Pro bono status never lowers the standard. Book cite: Rule 1.1 cmts. [2], [4]. [W2:3; S2:7–8]", "r": "Stevenson, 500 MPRE Questions (2019) Q222 · Rule 1.1 Competence"},
{"t": "comp", "q": "An attorney was highly knowledgeable and skillful, but he lost every case that he undertook, either because the law was unfavorable to his clients, or the other side could afford an entire army of elite lawyers, or because he was an unattractive person. He also regularly took on clients that no other lawyer wanted to represent because they seemed likely to lose. Over time, the attorney’s clients lost their homes, lost custody of their children, lost their inheritances, and sometimes even went to jail. Despite his vast knowledge, skills, and thorough preparation, could the attorney nevertheless be subject to discipline for lack of competence, because he is consistently losing every time?", "a": ["No, the attorney seems competent, based on the facts given, regardless of the pattern of unfavorable outcome in his cases, which could be due to other factors.", "Yes, clients have a contractual expectation of effective representation, which means some of the outcomes should be favorable.", "Yes, it is incompetent to take on clients whose cases seem likely to lose, or where the opposing party has far greater resources to hire the most elite law firms.", "No, even though the clients received an unfavorable outcome, their results might have been even worse without the attorney’s help."], "e": "The standard of care and 1.1 don't guarantee results. Losing, even repeatedly, doesn't show incompetence when the lawyer has the knowledge, skill, and preparation the matters required. Unfavorable law, better-funded opponents, and weak cases explain the losses. Taking hard cases isn't incompetence, and clients have no contractual right to win. The 'could have been worse' rationale isn't the test; the test is the lawyer's knowledge, skill, thoroughness, and preparation. Book cite: Rule 1.1 cmt. [2]. [W2:3, 10; S2:36–37]", "r": "Stevenson, 500 MPRE Questions (2019) Q223 · Rule 1.1 Competence"},
{"t": "comp", "q": "A very winsome, likable attorney was objectively incompetent in providing representation to his client, but he was lucky - the other side had a terrible case on the merits, and opposing counsel was unlikable and abrasive, so the attorney prevailed in his client's case. Could the attorney nevertheless be subject to discipline for lack of competence?", "a": ["Yes, a lawyer shall provide competent representation to a client, regardless of the outcome.", "Yes, because it is not fair to other lawyers who are competent if an incompetent lawyer can win.", "No, the attorney’s ability to prevail in the matter on behalf of his client, notwithstanding the efforts of opposing counsel, is per se evidence of his competence.", "No, the client received effective representation and a favorable outcome, which is what the client bargained for when he retained counsel."], "e": "1.1 requires competent representation regardless of the outcome, and discipline for incompetence doesn't depend on harm. The readings stress that competence and diligence violations can be disciplined before anyone is hurt. Winning because the other side had a weak case and an abrasive lawyer doesn't prove competence, and the client's satisfaction doesn't waive the duty. Fairness to other lawyers isn't the reason. Book cite: Rule 1.1. [W2:9–10; outline V intro]", "r": "Stevenson, 500 MPRE Questions (2019) Q224 · Rule 1.1 Competence"},
{"t": "comp", "q": "An attorney has spent his entire career practicing family law, and he has never done a criminal trial before. When asked to take a criminal case, he agreed to do only the preliminary pre-trial work, such as the arraignment or bond hearing, initial rounds of plea negotiations, and some basic factual investigation. The client was facing charges for various white-collar crimes, brought under federal statutes, and would involve complex jurisdictional and procedural issues at trial. The attorney knew that he would not be competent to represent the client at such a trial, so he contractually agreed to limit his representation to the few preliminary tasks described above, to allow the client time to find another lawyer with more experience and expertise in this area. Once the representation began, the attorney confined himself to the parts of the matter that he had agreed to handle. Is it permissible for the attorney to be incompetent in certain matters but still provide representation to a client in a more limited capacity?", "a": ["Yes, agreements between the lawyer and the client regarding the scope of the representation may limit the matters for which the lawyer is responsible.", "Yes, clients and lawyers have wide latitude in their contractual agreements, and a lawyer can contract with a client to provide representation that would seem objectively incompetent to most other lawyers.", "No, a lawyer may not avoid the duty of competence by limiting the scope of the representation through an agreement with the client.", "No, the attorney could have achieved the requisite level of competence to handle the entire matter by reasonable preparation."], "e": "The comments to 1.1 say an agreement on the scope of the representation may limit the matters for which the lawyer is responsible (see 1.2(c)). A family lawyer may handle only the arraignment, bond hearing, early plea talks, and initial investigation, tasks he can do competently, while the client finds trial counsel, if the limit is reasonable and the client gives informed consent. He still must handle those limited tasks competently; a contract can't authorize objectively incompetent work. Book cite: Rule 1.1 cmt. [5]. [W2:54; S2:3–5, 87]", "r": "Stevenson, 500 MPRE Questions (2019) Q225 · Rule 1.1 Competence"},
{"t": "comp", "q": "A brilliant attorney graduated at the top of his class from Harvard Law School. He was supremely intelligent and well-studied in the law, remarkably handsome, witty, and well-spoken. As he progressed through his career, he was in such high demand that he could afford to take only the cases he knew were mostly likely to win. Regardless of the complexity of the matter, he always won based on his wit, looks, and eloquence. He has been so successful that he has not needed to read a new case in fifteen years, nor has he needed to keep abreast of changes in law. He has never faced disciplinary action or a malpractice lawsuit. Assuming his winning streak continues indefinitely, is he providing competent representation, according to the Model Rules?", "a": ["No, a lawyer should keep abreast of changes in the law and its practice and engage in continuing study and education.", "Yes, the Model Rules use an objective, outcomes-based standard for evaluating competence.", "Yes, the Model Rules measure competence based on the education, experience, and reputation of the lawyer.", "No, the Model Rules measure the required attention and preparation primarily by what is at stake."], "e": "Competence includes keeping up: the comments to 1.1 say a lawyer should keep abreast of changes in the law and its practice, including relevant technology, and engage in continuing study and education. A lawyer who hasn't read a new case in fifteen years isn't competent, however brilliant, charming, or undefeated. The Rules don't measure competence by outcomes or reputation. The 'what's at stake' answer refers to a different comment about how much preparation a matter needs. Book cite: Rule 1.1 cmt. [8]. [W2:7]", "r": "Stevenson, 500 MPRE Questions (2019) Q226 · Rule 1.1 Competence"},
{"t": "comp", "q": "An attorney had just graduated and passed the bar when he agreed to represent a certain client. Even though he was new to the practice of law, he devoted plenty of time to study and preparation to understand the relevant statutes and case law, correctly identified all the issues in the case, and conducted a thorough investigation of the facts. His knowledge and skills were normal for newer lawyers in his area. Unfortunately, he was simply no match for the counsel, one of the most famous lawyers in the state, and reputed to be the best in his field. The case went overwhelmingly in favor of the opposing party, so the client ended up worse off than before the matter began. Opposing counsel would have had an advantage over any other lawyer in the area, though an experienced lawyer might have obtained a less adverse result for the new attorney’s client. Could the new attorney be subject to discipline for his lack of competence?", "a": ["No, a newly admitted lawyer can be as competent as a practitioner with extensive experience, even if the outcome in this case was unfavorable.", "Yes, expertise in a specific field of law is a requirement in some circumstances, as when opposing counsel is a renowned expert.", "Yes, the most fundamental legal skill consists of determining what kind of legal problems a situation may involve, a skill that necessarily transcends any specific specialized knowledge.", "No, because now that he has learned a hard lesson, in the future he can provide competent representation through the association of a lawyer of established competence in the field in question."], "e": "The comments to 1.1 say a newly admitted lawyer can be as competent as one with long experience. This lawyer studied the law, identified the issues, investigated thoroughly, and had normal skill for his level, which satisfies 1.1 even though he lost to a famous opponent. Competence doesn't require matching the best lawyer in the state, and a bad outcome isn't proof of incompetence. The 'most fundamental skill' answer quotes the comment but misapplies it, since he did identify the issues. Book cite: Rule 1.1 cmt. [2]. [W2:3, 10]", "r": "Stevenson, 500 MPRE Questions (2019) Q227 · Rule 1.1 Competence"},
{"t": "comp", "q": "An attorney graduated from law school in the early 1970’s, and he spent his career in solo practice in a small rural town, mostly drafting wills and simple contracts for sale for farm machinery. He has a landline phone in his office and home, but has never had or needed a cell phone, does not use a computer, and has never used email or the Internet. The attorney has an extensive library of law books and treatises. Could the attorney be subject to discipline for not keeping abreast of changes in technology that are relevant to the practice of law?", "a": ["Yes, to maintain the requisite knowledge and skill, a lawyer should keep abreast of changes in the law and its practice, including the benefits and risks associated with relevant technology.", "Yes, unless the client gives informed consent, confirmed in writing, to the fact that the attorney does not know how to use a cell phone or the Internet.", "No, a practitioner with long experience can be just as competent as a newly admitted lawyer.", "No, the most fundamental legal skill consists of determining what kind of legal problems a situation may involve, a skill that necessarily transcends any specific technology."], "e": "The comments to 1.1 require keeping abreast of changes in the law and its practice, including the benefits and risks of relevant technology. The readings warn that a lawyer can't retreat into the twentieth century and hope technology leaves him alone, and ABA Op. 18-483 describes the cybersecurity duties that follow. Experience in a narrow rural practice doesn't exempt him, and clients can't consent away the duty of competence. Book cite: Rule 1.1 cmt. [8]; ABA Formal Op. 18-483. [W2:7–9; W2:25 n.12]", "r": "Stevenson, 500 MPRE Questions (2019) Q228 · Rule 1.1 Competence"},
{"t": "comp", "q": "An attorney specialized in transactional work for corporate clients, and he focused his practice on this area for many years. An emergency arose in which an attorney needed to give immediate telephone advice to an individual client who had to make an urgent decision. Referring the case to another firm, or even consulting with another lawyer, was not practical in the moment. The attorney did not have the requisite skill or knowledge for the matter, because it was far outside the attorney’s regular area of practice, and he explained this to the client before offering any advice. He then gave his best educated guess about what the client should do, based on analogous situations in areas of law more familiar to him. The attorney took the opportunity to give the client extensive advice about the net several steps the client should take, and advice about the subsequent appeal of the matter, all of which was completely outside the attorney’s range of knowledge or experience. The client relied on the attorney’s uninformed advice, all of which turned out to be wrong, and resulting in several lawyers of harm to the client’s legal interests. If the attorney had limited his emergency advice to the minimum necessary in the moment, the client would have suffered less harm. Could the attorney be subject to discipline for lack of competence?", "a": ["Yes, even in emergencies, a lawyer should limit assistance to what is necessary in the circumstances, for ill-considered action under emergency conditions can jeopardize the client's interest.", "Yes, competent handling of a specific matter includes inquiry into and analysis of the factual and legal elements of the problem, and the use of methods and procedures meeting the standards of competent practitioners.", "No, an agreement between the lawyer and the client regarding the scope of the representation may limit the matters for which the lawyer is responsible.", "No, in emergencies a lawyer may give advice or assistance in a matter in which the lawyer does not have the skill ordinarily required where referral to or consultation or association with another lawyer would be impractical."], "e": "In a genuine emergency, when referral or consultation is impractical, a lawyer may give advice beyond his usual competence, but the comments limit that help to what's reasonably necessary in the circumstances, because ill-considered emergency action can harm the client. He went far past the immediate need, advising on later steps and an appeal he knew nothing about, and the extra advice caused harm. The emergency exception covers only the minimum. No scope agreement excused it. Book cite: Rule 1.1 cmt. [3]. [W2:24]", "r": "Stevenson, 500 MPRE Questions (2019) Q229 · Rule 1.1 Competence"},
