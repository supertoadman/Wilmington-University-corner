<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Temple Run — Motion & World Expansion</title><link rel="stylesheet" href="viewer.css"><style>
.review-controls{display:flex;gap:16px;flex-wrap:wrap;align-items:end;margin:24px 0}.review-controls label{display:grid;gap:8px}.review-controls button{padding:12px 20px;border:1px solid #c7a15d;border-radius:6px;background:#29251e;color:#fff8e9;cursor:pointer}.review-stage{display:grid;grid-template-columns:1fr 1fr;gap:24px}.review-stage canvas,.wide-preview{width:100%;display:block;border:1px solid #75664d;border-radius:12px;background:#41464e}.frame-strip{display:flex;gap:8px;overflow:auto;padding:12px 0}.frame-strip a{flex:0 0 100px;font-size:12px}.frame-strip img{width:100%;background:#41464e;border-radius:6px}audio{width:min(100%,600px)}.review-stage h2{font-size:24px}.status{color:#c7a15d}section{margin-bottom:40px}@media(max-width:700px){.review-stage{grid-template-columns:1fr}}
</style></head><body><header><a class="brand" href="viewer.html">TR <span>ASSET LIBRARY</span></a><a href="EXPANSION.md">Expansion guide ↗</a></header><main>
<section><p class="eyebrow">MOTION / SCENERY / SOUND</p><h1>Run between realms.</h1><p class="lede">Review the new moves, split obstacles, scrolling layers, and original soundtrack.</p>
<div class="review-controls"><label>Realm<select id="realm"><option value="divine">Divine</option><option value="corrupt">Corrupt</option></select></label><label>Runner<select id="runner"><option>Socrates</option><option>Plato</option><option>Aristotle</option></select></label><label>Move<select id="move"><option value="run">Run</option><option value="jump">Jump</option><option value="slide">Slide</option><option value="stumble">Stumble</option><option value="fall">Fall</option><option value="idle">Idle</option></select></label><label>Speed<select id="speed"><option value="1">Normal</option><option value="0.5">Half speed</option><option value="0">Paused</option></select></label><button id="replay">Replay move</button><button id="step">Next frame</button></div>
<p class="status" id="status" role="status">Loading…</p><div class="review-stage"><div><h2>Runner and chaser</h2><canvas id="motion" width="960" height="640" aria-label="Runner and chaser animation preview"></canvas></div><div><h2>Slide-under layers</h2><canvas id="occlusion" width="640" height="640" aria-label="Back layer, sliding actor, front layer"></canvas></div></div><div id="frames" class="frame-strip"></div></section>
<section><h2>Three layers, one horizon.</h2><div class="review-controls"><label><input type="checkbox" id="far" checked> Far sky</label><label><input type="checkbox" id="middle" checked> Floating ruins</label><label><input type="checkbox" id="near" checked> Near wisps</label><label><input type="checkbox" id="seams"> Mark tile boundaries</label></div><canvas id="parallax" class="wide-preview" width="1536" height="640" aria-label="Horizontally repeating parallax background preview"></canvas></section>
<section><h2>Listen to the world.</h2><div class="review-controls"><label>Track or effect<select id="sound"></select></label><label>Audio format<select id="audio-format"><option value="auto">Automatic</option><option value="vorbis">Ogg</option><option value="aac">AAC / Safari</option></select></label></div><div id="audio" class="review-controls"></div><p id="audio-note" class="note"></p></section>
</main><script src="manifest.js"></script><script src="audio-runtime.js"></script><script src="expansion-preview.js"></script></body></html>
