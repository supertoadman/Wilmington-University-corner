// Each item: topic, rule tag, stem, answers (first = correct), explanation.
const BANK = [
// ---- Jury secrecy
["Jury","FRE 606(b)","After a guilty verdict, a juror signs an affidavit saying several jurors drank heavily and used drugs during the trial. Can the defense use the affidavit to impeach the verdict?",
 ["No. Juror intoxication is an internal matter, so Rule 606(b) bars the testimony.",
  "Yes. Drugs and alcohol are an outside influence because they came from outside the courthouse.",
  "Yes. Intoxication is extraneous prejudicial information that reached the jury.",
  "Yes, if the judge finds under Rule 403 that the affidavit's probative value is high."],
 "Tanner treats juror intoxication as internal. Whether something counts as extraneous or outside turns on the nature of the allegation, not on where it physically came from."],
["Jury","FRE 606(b)","What decides whether a matter falls within Rule 606(b)'s 'extraneous information' or 'outside influence' exceptions?",
 ["The nature of the allegation, such as a newspaper account or a bribe, as opposed to the jurors' own conduct or experiences.",
  "Whether the event took place inside or outside the jury room.",
  "Whether the matter actually changed the outcome of the verdict.",
  "Whether the juror learned of it before or after being sworn."],
 "The exceptions are kept narrow by looking at what kind of thing is alleged. A juror's own past experiences (Warger) and drug use (Tanner) are internal, even if they originated elsewhere."],
["Jury","Peña-Rodriguez","Under Peña-Rodriguez v. Colorado, when does the Sixth Amendment override the no-impeachment rule?",
 ["When a juror clearly relied on racial stereotypes or animus, and that was a significant motivating factor in the vote to convict.",
  "Whenever any juror made an offhand racial comment during deliberations.",
  "Whenever a juror is shown to have given a dishonest answer during voir dire.",
  "Whenever bias of any kind, in any civil or criminal case, may have affected the verdict."],
 "The exception is narrow. The animus must be a significant motivating factor, offhand remarks don't qualify, and its reach in civil cases is debated (Problem I.1)."],
["Jury","FRE 606(b)","Which is NOT one of the policies behind Rule 606(b)?",
 ["Making sure jurors follow the court's limiting instructions.",
  "Protecting frank debate during deliberations.",
  "Preserving the finality of verdicts.",
  "Shielding jurors from harassment by the losing party."],
 "606(b) protects candor, finality, and jurors. Because the jury room is rarely examined afterward, the rules screen what goes in instead."],
// ---- Relevance
["Relevance","FRE 401","Rule 401 relevance has two components. What are they?",
 ["Probativeness (any tendency to make a fact more or less probable) and materiality (the fact is of consequence).",
  "Probativeness and the absence of unfair prejudice.",
  "Materiality and proof by a preponderance of the evidence.",
  "Authenticity and probativeness."],
 "401(a) is probativeness and 401(b) is materiality. Unfair prejudice is a Rule 403 question, not part of the relevance definition."],
["Relevance","FRE 401","What does the phrase 'a brick is not a wall' convey about Rule 401?",
 ["An item of evidence is relevant if it moves the probability at all. It need not prove the point by itself.",
  "Evidence must be strong enough to support a verdict standing alone.",
  "Weak evidence should be excluded because it wastes the jury's time.",
  "Circumstantial evidence is less reliable than direct evidence."],
 "The bar is very low. Each piece only needs to contribute to the case, the way a brick contributes to a wall."],
["Relevance","FRE 401","Where does a fact's materiality, meaning whether it is 'of consequence', come from?",
 ["The substantive law governing the claim or charge, as Montana v. Egelhoff illustrates.",
  "The Federal Rules of Evidence themselves.",
  "The judge's view of which witnesses are credible.",
  "Whatever facts the jury thinks are important."],
 "Materiality comes from the elements and defenses in the substantive law. In Egelhoff, Montana could make voluntary intoxication immaterial to mental state."],
["Relevance","FRE 104(b)","Evidence of a motive matters only if the defendant knew about the motive. What standard does Rule 104(b) apply to that preliminary fact?",
 ["Evidence sufficient for a jury to reasonably find the fact by a preponderance. The judge does not decide it herself.",
  "The judge must personally find the fact by a preponderance under Rule 104(a).",
  "The fact must be proved by clear and convincing evidence.",
  "The fact must be proved beyond a reasonable doubt because it is a criminal case."],
 "Conditional relevance uses a lenient sufficiency standard (Huddleston). The jury, not the judge, makes the final call."],
["Relevance","FRE 104(b)","The connecting fact isn't proved yet when the evidence is offered. What can the court do?",
 ["Admit the evidence on the condition that proof of the connecting fact is introduced later.",
  "It must exclude the evidence until the connecting fact is proved first.",
  "It must declare a mistrial if the connection is never made.",
  "It may admit the evidence only if the opponent consents."],
 "Rule 104(b) expressly allows conditional admission, as in Cox. If the proof never comes, the court can strike the evidence or instruct the jury."],
["Relevance","FRE 402","What is the default rule for relevant evidence?",
 ["It is admissible unless the Constitution, a statute, or another rule excludes it.",
  "It is admissible only if the proponent shows that its probative value outweighs its prejudice.",
  "It is inadmissible unless a specific rule authorizes it.",
  "It is admissible only if it is material and direct."],
 "Rule 402 is the starting point. Most of the course is about the exceptions that carve evidence out of that default."],
// ---- 403 / 105
["Rule 403","FRE 403","Which best describes how Rule 403 balancing is tilted?",
 ["Toward admission. Exclusion requires that probative value be substantially outweighed by the listed dangers.",
  "Toward exclusion. The proponent must show probative value outweighs prejudice.",
  "Neutral. The judge admits whichever side of the scale is heavier.",
  "Toward exclusion in criminal cases and toward admission in civil cases."],
 "The word 'substantially' tilts the scale toward admission. Compare 609(a)(1)(B) and 609(b), which tilt it the other way."],
["Rule 403","FRE 403","What counts as 'unfair prejudice' under Rule 403?",
 ["An undue tendency to suggest decision on an improper basis, commonly an emotional one.",
  "Any evidence that substantially damages the opponent's case.",
  "Evidence the opponent did not disclose before trial.",
  "Evidence that is highly persuasive to the jury."],
 "All good evidence hurts the other side. Only unfair prejudice counts. Serge makes the point that being persuasive isn't the same as being unfair."],
["Rule 403","Old Chief","In Old Chief, the defendant offered to stipulate that he had a prior felony conviction. Why couldn't the government name the prior crime?",
 ["An available alternative, the stipulation, lowered the discounted probative value of naming an offense that carried a high risk of propensity reasoning.",
  "A defendant's stipulation always obligates the prosecution to accept it for any element.",
  "Prior convictions are never admissible in a criminal case.",
  "The name of the offense was irrelevant under Rule 401."],
 "Old Chief lets courts consider evidentiary alternatives when weighing probative value. It is narrow: the government generally may still prove its case its own way, and it applies mainly to legal status like felon status."],
["Rule 403","Collins","What was the core flaw in the probability testimony in People v. Collins?",
 ["The odds were built on invented figures and assumed independence, producing 'trial by mathematics'.",
  "Mathematical evidence is inherently inadmissible in criminal trials.",
  "The expert lacked a degree in statistics.",
  "The prosecutor did not give advance notice of the statistical evidence."],
 "Collins does not ban mathematics. Sound probability evidence such as DNA statistics is fine. The problem was unsupported inputs dressed up as precision."],
["Rule 403","Bocharski","Why are gruesome photographs most vulnerable to exclusion under Rule 403?",
 ["When they prove nothing that is actually disputed, so their main effect is to inflame the jury.",
  "Whenever they are in color rather than black and white.",
  "Whenever the defendant offers to stipulate to the cause of death.",
  "Because photographs are hearsay."],
 "Bocharski asks what the photo actually proves. Low probative value on a disputed point, combined with strong emotional impact, is the classic 403 exclusion."],
["Rule 403","Serge","How did Commonwealth v. Serge treat a computer-generated animation of a shooting?",
 ["As demonstrative evidence judged like other evidence. Its persuasiveness alone is not unfair prejudice.",
  "As inherently unfairly prejudicial because jurors overvalue technology.",
  "As inadmissible unless the defendant also prepared an animation.",
  "As substantive evidence that needed no foundation."],
 "The animation had to fairly and accurately depict the expert's theory. Once it did, its power to persuade was not a ground to exclude it."],
["Rule 403","FRE 105","Evidence is admissible against one party or for one purpose only. What does Rule 105 provide?",
 ["On timely request, the court must restrict the evidence to its proper scope and instruct the jury accordingly.",
  "The court must exclude the evidence entirely.",
  "The court must give a limiting instruction even if no one asks.",
  "The jury may use the evidence for any purpose once admitted."],
 "Rule 105 is the alternative to exclusion. Research such as Wissler & Saks suggests jurors often can't follow these instructions, which feeds back into the 403 analysis."],
// ---- Specialized relevance
["407–411","FRE 407","After a customer slips on a wet floor, the store installs non-slip mats. What can the mats evidence NOT be used to prove?",
 ["That the store was negligent.",
  "That the store controlled the premises, if control is disputed.",
  "That mats were feasible, if feasibility is disputed.",
  "That the store manager's testimony about safety is not credible."],
 "407 bars use of subsequent remedial measures to prove negligence, culpable conduct, or a defect. Ownership, control, feasibility (if disputed), and impeachment remain open."],
["407–411","FRE 407","What are the two main rationales for Rule 407?",
 ["Being wiser after an accident doesn't mean you were foolish before it, and the rule encourages safety repairs.",
  "Repairs are usually hearsay, and they waste trial time.",
  "Repairs are privileged communications, and they invade privacy.",
  "Juries always overvalue physical evidence, and repairs are hard to authenticate."],
 "Low probative value on fault plus a policy of encouraging remedial measures. That is why 407 bars specified uses rather than all uses."],
["407–411","FRE 407","A truck manufacturer redesigns a hitch after an accident, but the repair was made by an independent third party, not the defendant. Does Rule 407 bar it?",
 ["Generally no, because the policy of encouraging the defendant's repairs isn't at stake, though Rule 403 may still apply.",
  "Yes. Rule 407 bars any repair by anyone.",
  "Yes, but only in strict liability cases.",
  "No, and the evidence is automatically admissible on fault."],
 "Courts generally don't apply 407 to non-party repairs. Admission still has to survive 403."],
["407–411","FRE 407","Does Rule 407 apply in product liability cases?",
 ["Yes. Since the 1997 amendment it expressly covers proof of a defect in a product or its design.",
  "No. It applies only to negligence claims.",
  "Only if the measure was required by a regulation.",
  "Only in state court."],
 "The 1997 amendment added 'a defect in a product or its design' and resolved a circuit split."],
["407–411","FRE 408","A debtor writes: 'I know I owe you the full $10,000, but I can only pay $6,000. Take it or leave it.' Is the letter protected by Rule 408?",
 ["No. There's no claim disputed as to validity or amount, so Rule 408 does not apply.",
  "Yes. Any offer of payment is protected.",
  "Yes, but only the dollar figure is protected, not the admission.",
  "No, because Rule 408 applies only after a lawsuit is filed."],
 "408 requires a disputed claim. An admitted debt with a request for a discount isn't a compromise of a dispute."],
["407–411","FRE 408","Compromise evidence MAY be offered for which purpose?",
 ["To prove a witness's bias or prejudice.",
  "To prove the claim's validity.",
  "To impeach by prior inconsistent statement.",
  "To prove the amount of damages owed."],
 "408(b) permits other purposes such as bias, negating undue delay, or obstruction. Impeachment by prior inconsistent statement or contradiction is expressly barred."],
["407–411","FRE 409","At the scene, a driver says: 'I'll pay your hospital bills. I was texting and ran the light.' Under Rule 409, what is excluded?",
 ["Only the offer to pay medical expenses. The admission of fault is admissible.",
  "The entire statement, because it was made in a spirit of compromise.",
  "Nothing, because Rule 409 applies only to written offers.",
  "The entire statement, but only in criminal cases."],
 "Unlike 408, Rule 409 doesn't protect accompanying statements. It protects the humane impulse to pay, not admissions made alongside it."],
["407–411","FRE 410","How does Rule 410 differ structurally from Rules 407, 408, 409 and 411?",
 ["It bars covered evidence against the defendant for essentially all purposes, with only narrow exceptions. The others bar only specified uses.",
  "It bars covered evidence only for proving guilt, and it allows other purposes freely.",
  "It applies only in civil cases.",
  "It cannot be waived."],
 "410 is the outlier. Its exceptions are narrow: completeness, and perjury prosecutions for statements under oath."],
["407–411","FRE 410","A suspect makes incriminating statements to a detective, hoping for leniency. The detective had no authority from the prosecutor to negotiate. Under Rule 410 and cases like Greene, are the statements protected?",
 ["No. Rule 410 covers plea discussions with an attorney for the prosecuting authority, not police acting without that authority.",
  "Yes. Any statement made in hope of a deal is protected.",
  "Yes, because the suspect subjectively believed he was negotiating.",
  "No, because Rule 410 never applies before charges are filed."],
 "Only discussions with the prosecutor, or an agent the prosecutor designated, are covered. Mezzanatto adds that the protection can also be waived by agreement."],
["407–411","FRE 410","Under United States v. Mezzanatto, what is the status of Rule 410's protections?",
 ["They can be waived by the defendant's agreement, for example as a condition of plea talks.",
  "They are constitutional rights that can never be waived.",
  "They apply only if the plea is eventually accepted.",
  "They protect the prosecutor's statements as well as the defendant's."],
 "Prosecutors now routinely ask for such waivers. The reading notes the tension with 410's goal of candid negotiation."],
["407–411","FRE 411","A defense witness is a claims adjuster employed by the defendant's liability insurer. May the plaintiff reveal that employment?",
 ["Yes. Rule 411 allows insurance evidence for another purpose, such as a witness's bias.",
  "No. Any mention of insurance is barred.",
  "Only if the defendant consents.",
  "Only to prove the defendant's negligence."],
 "411 bars insurance only to prove negligence or wrongful conduct. Bias, agency, ownership, and control remain open. See Problem 2.5 (Lacher)."],
// ---- Character
["Character","FRE 404(a)(1)","What is the forbidden 'propensity' inference?",
 ["From a person's character trait to the conclusion that the person acted in accordance with that trait on a particular occasion.",
  "From a person's past conviction to the conclusion that the person is not credible.",
  "From a person's habit to the conclusion that the person acted in conformity with it.",
  "From a victim's character to the defendant's guilt."],

["Character","FRE 404(a)(1)","Why does the law ban propensity evidence, according to Zackowitz and the reading?",
 ["Juries give it excessive weight and may convict to punish the person regardless of guilt in this case.",
  "Character evidence is always irrelevant under Rule 401.",
  "Character evidence is a form of hearsay.",
  "It is too time-consuming to prove."],

["Character","FRE 404(b)","Rule 404(b)(2) lists purposes such as motive, intent, and identity. How should those purposes be understood?",
 ["As non-propensity routes. If the chain of reasoning still runs through character, the evidence is barred even if labeled 'intent' or 'identity'.",

["Character","Huddleston","Under Huddleston, what must the proponent show before other-act evidence goes to the jury?",

  "The defendant must have been convicted of the other act.",

["Character","Identity / M.O.","When may other crimes be used to prove identity by modus operandi?",

  "Only when the defendant was convicted of the earlier crime."],

["Character","FRE 404(a)(2)(A)","Who may first introduce evidence of a criminal defendant's pertinent character trait to prove conduct?",

["Character","FRE 404(a)(2)(B)","In a self-defense case, the defendant offers evidence of the victim's violent character. What may the prosecution now do?",

["Character","FRE 404(a)(2)(C)","In a homicide case, when may the prosecutor offer evidence of the victim's peacefulness without the defendant first offering character evidence?",

const TOPICS = ["All", ...new Set(BANK.map(b => b[0]))];
let state = { topic: "All", order: [], opts: {}, picked: {}, out: {}, onlyMissed: false };

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const shuffleAnswers = () => { state.opts = {}; BANK.forEach((b, i) => state.opts[i] = shuffle(b[3].map((_, k) => k))); };

// Strike-through toggle beside an option. It flips the option in place, so focus stays on the button.
const STRIKE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4H9a3 3 0 0 0-2.83 4"/><path d="M14 12a4 4 0 0 1 0 8H6"/><path d="M4 12h16"/></svg>';
function crossBtn(opt, letter, out, k) {
  const x = document.createElement("button");
  x.type = "button"; x.className = "xo"; x.title = "Cross out";
  x.setAttribute("aria-label", "Cross out choice " + letter);
  x.setAttribute("aria-pressed", out.has(k));
  x.innerHTML = STRIKE;
  x.addEventListener("click", () => {
    out.has(k) ? out.delete(k) : out.add(k);
    opt.classList.toggle("out", out.has(k));
    x.setAttribute("aria-pressed", out.has(k));
  });
  return x;
}

function visible() {
  return state.order.filter(i =>
    (state.topic === "All" || BANK[i][0] === state.topic) &&
    (!state.onlyMissed || state.missedSet.has(i)));
}

function render() {
  const list = document.getElementById("list");
  const ids = visible();
  list.innerHTML = "";
  if (!ids.length) { list.innerHTML = '<li class="empty">No questions here. Pick another topic or press Reset.</li>'; }
  ids.forEach((i, n) => {
    const [topic, tag, stem, ans, why] = BANK[i];
    const li = document.createElement("li");
    li.className = "q";
    const picked = state.picked[i];
    const L = "ABCD";
    li.innerHTML = `<div class="meta"><span class="num">${n + 1}.</span><span>${topic}</span><span class="tag">${tag}</span></div><p class="stem"></p><div class="opts"></div>`;
    li.querySelector(".stem").textContent = stem;
    const box = li.querySelector(".opts");
    const out = state.out[i] || (state.out[i] = new Set());
    state.opts[i].forEach((k, pos) => {
      const b = document.createElement("button");
      b.className = "opt"; b.type = "button";
      b.innerHTML = `<b>${L[pos]}</b><span></span>`;
      b.querySelector("span").textContent = ans[k];
      if (out.has(k)) b.classList.add("out");
      if (picked !== undefined) {
        b.disabled = true;
        if (k === 0) b.classList.add("right");
        else if (k === picked) b.classList.add("wrong");
      }
      b.addEventListener("click", () => { state.picked[i] = k; render(); });
      const row = document.createElement("div");
      row.className = "orow"; row.appendChild(b);
      if (picked === undefined) row.appendChild(crossBtn(b, L[pos], out, k));
      box.appendChild(row);
    });
    if (picked !== undefined) {
      const w = document.createElement("div");
      const ok = picked === 0;
      w.className = "why" + (ok ? "" : " miss");
      const correctLetter = L[state.opts[i].indexOf(0)];
      w.innerHTML = `<strong>${ok ? "Correct." : "Not quite. Answer: " + correctLetter + "."}</strong> <span></span>`;
      w.querySelector("span").textContent = why;
      li.appendChild(w);
    }
    list.appendChild(li);
  });
  const answered = ids.filter(i => state.picked[i] !== undefined);
  const right = answered.filter(i => state.picked[i] === 0).length;
  document.getElementById("score").innerHTML = `${right} / ${answered.length} correct <span>· ${answered.length} of ${ids.length} answered</span>`;
  document.getElementById("meter").style.width = ids.length ? (answered.length / ids.length * 100) + "%" : "0";
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.t === state.topic));
  document.getElementById("missed").textContent = state.onlyMissed ? "Show all" : "Retry missed";
}

const chips = document.getElementById("chips");
TOPICS.forEach(t => {
  const c = document.createElement("button");
  c.className = "chip"; c.type = "button"; c.dataset.t = t;
  c.textContent = t === "All" ? `All (${BANK.length})` : `${t} (${BANK.filter(b => b[0] === t).length})`;
  c.addEventListener("click", () => { state.topic = t; render(); });
  chips.appendChild(c);
});

document.getElementById("shufA").onclick = () => { shuffleAnswers(); state.picked = {}; state.out = {}; render(); };
document.getElementById("shufQ").onclick = () => { state.order = shuffle(state.order); render(); window.scrollTo({ top: 0 }); };
document.getElementById("reset").onclick = () => { state.picked = {}; state.out = {}; state.onlyMissed = false; state.order = BANK.map((_, i) => i); shuffleAnswers(); render(); };
document.getElementById("missed").onclick = () => {
  if (state.onlyMissed) { state.onlyMissed = false; render(); return; }
  state.missedSet = new Set(Object.keys(state.picked).map(Number).filter(i => state.picked[i] !== 0));
  if (!state.missedSet.size) return;
  state.missedSet.forEach(i => { delete state.picked[i]; delete state.out[i]; });
  state.missedSet.forEach(i => state.opts[i] = shuffle(state.opts[i]));
  state.onlyMissed = true; render(); window.scrollTo({ top: 0 });
};

state.order = BANK.map((_, i) => i);
state.missedSet = new Set();
shuffleAnswers();
render();
</script>
