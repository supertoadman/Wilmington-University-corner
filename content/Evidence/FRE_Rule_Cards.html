 a:"Exclusion was probably right. Bias is a permitted 411 purpose, but here it has little probative value, so 403 keeps it out.",
 plain:"The adjuster didn't testify; his employment barely bears on the reliability of her own statement."},
{t:"pol",k:"concept",src:"Classes 4–6",f:"Blindfolding juries",s:"The Arizona Jury Project",
 p:"What are the three failures of “blindfolding” jurors, and what did the Arizona Jury Project find about insurance?",
 a:"(1) Limiting instructions are hard to apply; (2) objecting to a prohibited mention draws attention to it; (3) jurors' prior experiences can't be erased.",
 plain:"Videotaped deliberations showed insurance came up in 85% of trials, about 4 times each, mostly about whether the plaintiff was insured (avoiding a windfall). In 40% it was substantial enough to possibly affect the verdict.",
 watch:["Better: instruct jurors not to speculate, and that their information may be incomplete or wrong.","411 rationale: the 1970s fear was that jurors punish insured defendants."]},
{t:"pol",k:"case",src:"Class 5",f:"United States v. Biaggi",s:"Rule 410 · 2d Cir. 1990",
 a:"A defendant who rejected an immunity offer could offer that rejection as evidence of consciousness of innocence.",
 plain:"Wedtech's CEO Mariotta said he turned down immunity because he knew of no wrongdoing. Excluding that was error, especially since the government offered consciousness-of-guilt evidence (buying gold bars after cooperators pleaded).",
 watch:["410 bars evidence only “against the defendant.”","Rejecting immunity is strongly probative; rejecting a plea for a lighter sentence is weaker."]},
{t:"pol",k:"scen",src:"Class 5",f:"The prosecutor offered to reduce a charge from first- to second-degree murder. The defendant refused and wants to tell the jury about the offer (Problem 2.8).",
 a:"Not automatically barred (410 protects only the defendant), but courts usually exclude it to protect plea bargaining.",
 plain:"The offer isn't necessarily a concession of weakness (it may avoid the cost of trial). Its value as consciousness of innocence grows with the size of the sentence reduction refused."},

/* --- Character --- */
{t:"char",k:"rule",f:"FRE 404(a)(2)(B)(ii)",s:"The same trait in the defendant",
 a:"If the accused offers evidence of the victim's trait, the prosecution may offer evidence that the accused has the same trait.",
 watch:["Added in 2000; no common-law counterpart.","The accused needn't have put his own character in issue."]},
{t:"char",k:"scen",src:"Classes 5–6",f:"Zackowitz bought three pistols and a tear-gas gun only after his wife told him Coppola had insulted her. The prosecution offers the purchases.",
 a:"A different result: buying weapons after the insult shows preparation, a route around the box.",
 plain:"In the actual case he already owned them, so they showed only a “murderous disposition” and were inadmissible (Cardozo). The dissent said the weapons showed he could carry out his threat."},
{t:"char",k:"case",src:"Classes 7–8",f:"Lannan v. State",s:"Ind. 1992",
 a:"Indiana abolished its “depraved sexual instinct” exception and adopted FRE 404(b).",
 plain:"The recidivism rationale fails (drug offenders reoffend too, and data suggest sex offenders don't more often). The bolstering rationale reflects an outdated sense that abuse claims are improbable.",
 watch:["Prior sexual misconduct can still come in for 404(b) purposes (common plan, modus operandi).","Shortly after, Congress enacted 413–415."]},
{t:"char",k:"concept",src:"Class 7",f:"State v. Kirsch",s:"Three theories, all propensity",
 p:"What three around-the-box theories did the New Hampshire prosecutors try in Kirsch, and why did each fail?",
 a:"Motive (a desire for sex with young girls) is “proof of propensity, not motive.” Intent (how he selected and seduced victims) is indistinguishable from propensity. Common plan: a pattern is not a plan.",
 plain:"For a plan, other acts must be constituent parts of an overall scheme, not just similar assaults.",
 why:"A rare court recognizing that 404(b)(2) purposes aren't exceptions."},
{t:"char",k:"concept",src:"Class 7",f:"413–415: legislative record",s:"Molinari vs. the Judicial Conference",
 p:"What did the sponsor and the Judicial Conference say about Rules 413–415?",
 a:"Rep. Molinari: the rules don't change hearsay or 403, the past offense needn't have produced a conviction, and the standard is presumably 104(b)/Huddleston. Judicial Conference (1995): overwhelmingly rejected in public comment; 404(b) suffices; no empirical support.",
 plain:"Enacted in the Violent Crime Control and Law Enforcement Act of 1994. Molinari's rationale: sexual interest in children is an unusual disposition, and adult cases often turn on consent and credibility.",
 watch:["Clinton signed 415, and the Paula Jones judge later cited it.","About 1,000 such federal cases a year; 21 states have similar rules."]},
{t:"char",k:"concept",src:"Class 7",f:"Baker, “Once a Rapist?”",s:"Critique of 413–415 (1997)",
 p:"What were Katharine Baker's main critiques of Rules 413–415?",
 a:"Recidivism data cut against them: 7.7% of sex offenders were rearrested for a new sex offense within three years, vs. 63.5% (property) and 60.4% (drugs) rearrested.",
 plain:"Also: jurors overweight priors and may punish past acts; police “round up the usual suspects”; those with records are disproportionately poor and minority.",
 watch:["Baker concedes underreporting may skew the numbers."]},
{t:"char",k:"concept",src:"Classes 7–8",f:"Guardia's three-part threshold",s:"Applying Rule 413",
 p:"What must a court find before 413 evidence reaches 403 balancing?",
 a:"(1) The defendant is accused of sexual assault; (2) the evidence shows another sexual assault; (3) it's relevant. Then a normal 403 balance.",
 watch:["403 isn't tilted against 413 evidence; that would frustrate Congress.","413 originally said “is admissible”; restyled in 2011 to “may admit.”"]},
{t:"char",k:"case",src:"Class 7",f:"Carroll v. Trump",s:"Rule 415 · S.D.N.Y. 2023",
 a:"Testimony from two other women and the Access Hollywood tape were admitted under 415 to show propensity.",
 plain:"Judge Kaplan: Carroll offered the evidence “to show that Mr. Trump has a propensity for such behavior.”",
 watch:["Also: Giuffre v. Maxwell (a 415 notice invoking 413(d)(5), which counts conspiracy as sexual assault) and Doe v. Epstein (a 415(b) notice)."]},
{t:"char",k:"concept",src:"Class 8",f:"Character-witness foundation",s:"Direct and cross under 405(a)",
 p:"What foundation does a reputation witness need, and why are specific acts barred on direct?",
 a:"The witness must show “such acquaintance with the defendant, the community in which he has lived and the circles in which he has moved, as to speak with authority.”",
 plain:"The trait must be pertinent (e.g., nonviolence in an assault case). On cross, probe familiarity and ask “Have you heard…?” with a good-faith basis.",
 why:"ACN: specific acts are the most convincing but have “the greatest capacity to arouse prejudice, to confuse, to surprise, and to consume time.”"},
{t:"char",k:"scen",src:"Class 8",f:"The defendant testifies, “I wouldn't shoot anybody.” The prosecutor asks, “You've shot at other people before, haven't you?” (Problem 3.16).",
 a:"Likely allowed. By vouching for her own peacefulness she made herself a character witness open to 405(a) cross, and the question also impeaches by prior inconsistent statement.",
 plain:"The defense's best move is a limiting instruction against using it as propensity."},
{t:"char",k:"scen",src:"Classes 8–9",f:"Claiming self-defense in an assault case, the defendant offers specific past violent acts of the victim (which he didn't know about) under 405(b).",
 a:"Not under 405(b). The victim's character isn't an essential element of self-defense; the element is the defendant's reasonable fear at the time (James).",
 plain:"Route instead: 404(a)(2)(B), proving the victim's violence by reputation or opinion, which opens the door to the same trait in the defendant."},
{t:"char",k:"case",src:"Class 8",f:"Halloran v. Virginia Chemicals",s:"Habit · N.Y. 1977",
 a:"Evidence that the plaintiff regularly heated Freon cans with an induction coil can show habit, if it's repeated and regular, not a single sighting.",
 plain:"Halloran said he warmed the can in water when it exploded. The manufacturer said the coil, his fault, caused it.",
 watch:["Habit must be “predictable and predictive”: a repetitive, semi-automatic pattern like buckling a seatbelt."]},

/* --- Other acts --- */
{t:"acts",k:"concept",src:"Classes 6–7",f:"Trenkler's two-part test",s:"404(b) identity",
 p:"What test did the First Circuit apply to the earlier Quincy bomb, and what were the dissent's objections?",
 a:"(1) Does the evidence have “special relevance” beyond propensity? (2) If so, a 403 balance.",
 plain:"Both bombs were remote-controlled, radio-activated, and homemade from hobby-store parts, with similar circuits and wiring, built to help a friend. A database matched only 7 of 40,867 incidents. The Quincy bomb hurt no one, so a limiting instruction sufficed.",
 watch:["Dissent: a skewed database query, and a noise-simulator vs. dynamite (“a bb gun vs. a high-powered rifle”).","Identity evidence matters only when identity is disputed."]},
{t:"acts",k:"case",src:"Classes 6–7",f:"Bey-Cousin v. Powell",s:"Rap lyrics · E.D. Pa. 2021",
 a:"The court presumed that “artists tell stories” and excluded the plaintiff's lyrics.",
 plain:"First-person lyrics aren't confessions: Freddie Mercury didn't “just kill a man,” and Johnny Cash didn't shoot a man in Reno.",
 watch:["California, Louisiana and Maryland have genre-neutral statutes making creative expression harder to admit; there's no absolute bar and no federal law."]},
{t:"acts",k:"scen",src:"Class 6",f:"At a murder trial, the prosecutor offers the defendant's violent rap lyrics with no specific link to the shooting, to show motive and intent (Problem 3.5, State v. Skinner).",
 a:"Likely inadmissible. Without a specific link, the lyrics invite the jury to infer a violent nature (propensity).",
 plain:"The New Jersey Supreme Court condemned their use and affirmed reversal of the conviction. Lyrics closely matching the charged crime (e.g., a song about killing one's father) may come in to show intent."},
{t:"acts",k:"scen",src:"Class 6",f:"A defendant charged with a February hack of a retailer's database is shown to have hacked the same system in March (Problem 3.1).",
 a:"A close call, but admissible to show knowledge if the skill places him in a small pool of capable suspects.",
 plain:"If admitted, give a 105 instruction limiting it to know-how, not that he is “the type” to commit the crime."},
{t:"acts",k:"scen",src:"Class 6",f:"To show a cyclist's experience, the prosecution offers brochures he recently published for bicycle-racing equipment (Problem 3.9).",
 a:"Technically within 404(b)(1), but racing bikes isn't a bad act, and the risk of unfair prejudice is minimal.",
 plain:"A literal reading would exclude evidence beyond the rule's purpose; Rule 404 targets prejudicial propensity, not innocuous habits or interests."},
{t:"acts",k:"scen",src:"Class 6",f:"A prosecutor asks a witness about an affair between the defendant and the murdered colleague, who was killed in her apartment with no sign of forced entry (Presumed Innocent).",
 a:"Admissible around the box to show motive (jealousy, rejection) and opportunity (no forced entry). A 403 objection probably fails.",
 plain:"The defense's better objection is unfair prejudice (punishing an affair), but the probative value is not substantially outweighed."},
{t:"acts",k:"scen",src:"Class 6",f:"A child is struck by a rushing studio employee. The family offers witnesses who saw her racing recklessly down the hall seconds after the incident (Broadcast News).",
 a:"Admissible: it shows she was rushing at that moment (motive: delivering a tape by airtime), not a careless character trait.",
 plain:"The defense would object that it's 404 evidence of carelessness. The answer: it's a specific purpose in the moment, not a general trait."},

/* --- Impeachment --- */
{t:"imp",k:"rule",f:"FRE 610",s:"Religious beliefs",
 a:"Evidence of a witness's religious beliefs or opinions is not admissible to attack or support the witness's credibility.",
 watch:["Cited as a model for a rape-shield rule against “unworthy of belief” inferences."]},
{t:"imp",k:"scen",src:"Class 8",f:"In a civil real-estate suit, a defense witness says the plaintiff's “reputation is terrible.” Counsel then asks about the plaintiff's “reputation for truthfulness and veracity” (Easerly v. Lettwin).",
 a:"Sustain the first objection (608(a) allows only truthfulness); overrule the second.",
 plain:"608(a) applies in civil and criminal cases, to any witness who testifies (not to parties who never take the stand). Specific past lies come in only on cross, and rehabilitation is by opinion or reputation."},
{t:"imp",k:"scen",src:"Class 8",f:"On cross, defense counsel asks the plaintiff (an attorney) about visiting a pornographic theater. Alternatively, about falsely stating on his bar application that he had no unpaid parking tickets (Philadelphia).",
 a:"The theater visit isn't probative of untruthfulness, so it's out under 608(b). Lying on the bar application is probative, so it's likely allowed.",
 plain:"Immorality isn't untruthfulness; lying in a semi-official setting is."},
{t:"imp",k:"scen",src:"Class 8",f:"The prosecutor asks a defense witness on cross about once falsely claiming she was kidnapped. Defense counsel objects that there's “no proof.” Then the prosecutor offers her affidavit admitting the lie.",
 a:"The question is proper with a good-faith basis (no proof needed), but the affidavit is barred extrinsic evidence under 608(b).",
 plain:"Defense counsel should have asked at sidebar about the good-faith basis. Technique: when objecting, don't repeat the offending words."},
{t:"imp",k:"scen",src:"Class 9",f:"On cross, an alibi witness concedes he was wrong about one detail: the deli was closed that day, so they ate next door. The defense then calls a witness to his good reputation for truthfulness (Problem 4.6).",
 a:"Probably inadmissible. Exposing a single contradiction isn't an attack on character for truthfulness.",
 plain:"Likewise for bias (he's in business with the defendant's father). An admitted loan-application lie or a 609 conviction does open the door."},

/* --- Convictions --- */
{t:"conv",k:"rule",f:"FRE 609(c)",s:"Pardon, annulment, or rehabilitation",
 a:"A conviction isn't admissible if it was the subject of a pardon, annulment, certificate of rehabilitation, or equivalent based on rehabilitation (with no later serious conviction), or based on a finding of innocence.",
 why:"Rehabilitation lowers probativeness; a finding of innocence drops it to near zero."},
{t:"conv",k:"case",src:"Classes 9–10",f:"United States v. Brewer",s:"Rule 609 · E.D. Tenn. 1978",
 a:"Ten years runs from release, so 609(b) didn't apply. Applying Gordon, the court admitted rape, aggravated assault and assault with a deadly weapon but excluded kidnapping as cumulative “overkill.”",
 plain:"Brewer, charged with transporting a stolen vehicle, had convictions from 1960 and 1968, but his releases fell within ten years of the 1978 trial.",
 watch:["Violent crimes say little about honesty (factor 1), but his continuing crimes on parole favored admission (factor 2)."]},
{t:"conv",k:"concept",src:"Classes 9–10",f:"Gordon factors: which way they cut",s:"Weighing a defendant's conviction",
 p:"For each Gordon factor, which direction favors exclusion?",
 a:"(1) More violent = less probative of honesty, more prejudicial. (2) More recent or a continuing record = favors admission. (3) More similar to the charged crime = more prejudicial. (4) More important defendant testimony = favors exclusion. (5) Credibility central to the case = favors admission.",
 watch:["Factors 4 and 5 often counterbalance each other.","From then-Judge Burger in Gordon v. United States (D.C. Cir. 1967)."]},
{t:"conv",k:"concept",src:"Class 9",f:"Problem 4.4 (Valencia)",s:"Two different weighing tests",
 p:"If a prior conviction was excluded under 404(b)/403 in the case-in-chief, must it also be excluded under 609(a)(1)(B) when the defendant testifies?",
 a:"No. The tests weigh different things: substantive guilt (404(b)/403) vs. character for truthfulness (609).",
 plain:"The Eighth Circuit held the first result doesn't dictate the second. One could argue the probative values should be summed, but the court didn't."},
{t:"conv",k:"scen",src:"Class 9",f:"A witness was convicted of tampering with electric meters (max six months). The statute covers three forms of conduct, only one involving deception. Can it impeach him (Problem 4.5)?",
 a:"Only under 609(a)(2), and only if the court can readily determine the crime required a dishonest act or false statement.",
 plain:"The judge may look to “an indictment, a statement of admitted facts, or jury instructions” (2006 ACN). Meters record facts, so tampering arguably is deceit.",
 watch:["609(b)'s ten-year limit applies even to (a)(2) crimes.","Unsettled: does the ten years end when the witness testifies, or when trial begins?"]},
{t:"conv",k:"scen",src:"Class 9",f:"A jailhouse informant pleaded guilty to arson (a felony) but hasn't been sentenced. He also spent time in reform school as a kid and has a five-year-old petty larceny conviction (max six months).",
 a:"The arson comes in under 609(a)(1): “punishable by” means the possible sentence. Reform school is out (609(d): not necessary, given his adult record). Petty larceny is out (not crimen falsi, not a felony).",
 plain:"A perjury conviction would be admitted automatically under 609(a)(2) unless over ten years old (then 609(b): “very rarely”)."},

/* --- Rape shield --- */
{t:"shield",k:"concept",src:"Classes 9–10",f:"Why Rule 412 exists",s:"Two exploited exceptions",
 p:"Which common-law character exceptions did rape shield laws shut down?",
 a:"The 404(a)(2)(B) analog (she consented before, so she consented now) and the 608(b) analog (her sexual activity shows untruthfulness).",
 plain:"Wigmore (1940) even claimed a link between chastity and false rape accusations and urged examining every complainant. The real purpose was deciding who was “worthy” of protection, not accuracy.",
 watch:["Consequences: victims were violated twice, fewer prosecuted, and fewer guilty men were convicted.","Estrich, Real Rape: corroboration requirements expressed distrust of women."]},
{t:"shield",k:"concept",src:"Class 10",f:"Colb's argument",s:"79 N.C. L. Rev. 939 (2001)",
 p:"Why does Sherry Colb say a complainant's sexual history is irrelevant once a rape is alleged?",
 a:"Her sworn statement that she didn't consent overwhelms any propensity data, and because a false rape accusation is so heinous, sexually active women are no likelier to make one.",
 plain:"Dating-frequency data might inform a bet on consent before an accusation, but not after. Irrelevant evidence is inadmissible (402)."},
{t:"shield",k:"case",src:"Class 10",f:"State v. Smith",s:"La. 1999",
 a:"Prior false allegations aren't “past sexual behavior,” so Louisiana's Article 412 didn't apply, and the evidence should have been admitted.",
 plain:"The 12-year-old step-granddaughter alleged touching, with no physical evidence. The defense wanted to cross about her recanted accusation against a cousin. After a hearing, the trial judge found no false allegations.",
 watch:["Test: could reasonable jurors find she made prior false accusations (Huddleston), not whether the judge believes it. Conviction reversed."]},
{t:"shield",k:"scen",src:"Class 10",f:"Charged with enticing a minor to produce sexual images, the defendant wants to show the boy sent images to other men too (Problem 5.2, United States v. Walker).",
 a:"Excluded. It's “other sexual behavior,” and the 412(b)(1)(A) source exception requires specific instances, while he offered only general conduct.",
 plain:"Open questions: are digital images “physical evidence”? Does “specific” mean single acts? A 412(c)(2) hearing could have sorted it out."},
{t:"shield",k:"scen",src:"Class 10",f:"In a molestation case, the judge lets the defense show the niece lied about “texting” but bars mention of “sexting” and the message contents (Problem 5.6).",
 a:"A reasonable accommodation. Lies go to truthfulness under 608(b), and the sexual content is shielded by 412.",
 plain:"Allegedly false prior claims aren't barred by 412 (ACN). “Sexting” may be more probative of a lie, or simply more embarrassing."},
{t:"shield",k:"scen",src:"Class 10",f:"In Paula Jones's harassment suit, Clinton's lawyer threatens to make an issue of her sexual history: “a two-way street” (Problem 5.9).",
 a:"Only under 412(b)(2): reputation only if she put it in controversy (arguably, by claiming reputational harm), and probative value must substantially outweigh harm and prejudice.",
 plain:"The test is heavily weighted against admission."},
{t:"shield",k:"concept",src:"Class 10",f:"Victim vs. defendant sexual history",s:"Why the rules differ",
 p:"Why is a victim's prior consent inadmissible to prove consent, while a defendant's prior rapes are admissible (413) to prove rape?",
 a:"(1) Shield laws protect victims to encourage reporting; (2) victims have privacy in non-criminal sex lives, while offenders don't; (3) a victim's history cuts both ways, but a defendant's prior rapes don't.",
 plain:"A victim's frequent consent also shows she doesn't readily accuse partners of rape; a defendant's prior rapes simply make guilt more likely."},
];
const CARDS = ALL_CARDS.filter(c => c.k === "rule" && c.f.startsWith("FRE"));
// stable ids per topic
(() => { const n = {}; CARDS.forEach(c => { n[c.t] = (n[c.t]||0)+1; c.id = c.t+"-"+n[c.t]; c.no = CARDS.indexOf(c)+1; }); })();

/* ------------------------------------------------------------------ storage */
const KEY = "fre-rule-cards-v1";
let store = { box:{} };
try { const raw = localStorage.getItem(KEY); if (raw) store = Object.assign({box:{}}, JSON.parse(raw)); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e) {} }
const boxOf = id => store.box[id] || 0;

/* ------------------------------------------------------------------ state */
const sel = { topics:new Set(Object.keys(TOPICS)), kinds:new Set(Object.keys(KINDS)), order:"deck", onlyWeak:false };
if (store.prefs) { try {
  sel.topics = new Set(store.prefs.topics.filter(t => TOPICS[t])); sel.kinds = new Set(store.prefs.kinds.filter(k => KINDS[k]));
  sel.order = store.prefs.order || "deck"; sel.onlyWeak = !!store.prefs.onlyWeak;
  if (!sel.topics.size) sel.topics = new Set(Object.keys(TOPICS)); if (!sel.kinds.size) sel.kinds = new Set(Object.keys(KINDS));
} catch(e){} }
let session = null; // {queue:[ids], total, knew, shaky, missed, flipped}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const byId = Object.fromEntries(CARDS.map(c => [c.id, c]));

function filtered(){
  return CARDS.filter(c => sel.topics.has(c.t) && sel.kinds.has(c.k) && (!sel.onlyWeak || boxOf(c.id) < 3));
}

/* ------------------------------------------------------------------ controls */
function renderChips(){
  const tc = $("topicChips"); tc.innerHTML = "";
  const all = document.createElement("button");
  all.className = "chip"; all.textContent = "All topics";
  all.setAttribute("aria-pressed", sel.topics.size === Object.keys(TOPICS).length);
  all.onclick = () => { sel.topics = sel.topics.size === Object.keys(TOPICS).length ? new Set() : new Set(Object.keys(TOPICS)); changed(); };
  tc.appendChild(all);
  for (const [k,t] of Object.entries(TOPICS)) {
    const b = document.createElement("button"); b.className = "chip"; b.style.setProperty("--topic", t.color);
    b.innerHTML = `${esc(t.name)}<small>${esc(t.rules)}</small>`; b.title = `FRE ${t.rules}`;
    b.setAttribute("aria-pressed", sel.topics.has(k));
    b.onclick = () => { sel.topics.has(k) ? sel.topics.delete(k) : sel.topics.add(k); changed(); };
    tc.appendChild(b);
  }
  const kc = $("kindChips"); kc.innerHTML = "";
  for (const [k,label] of Object.entries(KINDS)) {
    const n = CARDS.filter(c => c.k === k && sel.topics.has(c.t)).length;
    const b = document.createElement("button"); b.className = "chip";
    b.innerHTML = `${label}s<small>${n}</small>`; b.setAttribute("aria-pressed", sel.kinds.has(k));
    b.onclick = () => { sel.kinds.has(k) ? sel.kinds.delete(k) : sel.kinds.add(k); changed(); };
    kc.appendChild(b);
  }
  document.querySelectorAll("#orderSeg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.o === sel.order));
  $("onlyWeak").checked = sel.onlyWeak;
  const n = filtered().length;
  $("deal").textContent = n ? `Deal ${n} card${n===1?"":"s"}` : "No cards match";
  $("deal").disabled = !n;
}
function changed(){
  store.prefs = { topics:[...sel.topics], kinds:[...sel.kinds], order:sel.order, onlyWeak:sel.onlyWeak }; save();
  renderChips(); $("deal").classList.add("pulse");
  if (!$("listView").hidden) renderList();
}
document.querySelectorAll("#orderSeg button").forEach(b => b.onclick = () => { sel.order = b.dataset.o; changed(); });
$("onlyWeak").onchange = e => { sel.onlyWeak = e.target.checked; changed(); };
$("deal").onclick = () => { $("deal").classList.remove("pulse"); deal(); showTab("study"); };

function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function deal(){
  let cards = filtered();
  if (sel.order === "shuffle") cards = shuffle(cards.slice());
  if (sel.order === "weak") cards = shuffle(cards.slice()).sort((a,b) => boxOf(a.id) - boxOf(b.id));
  session = { queue:cards.map(c => c.id), total:cards.length, knew:0, shaky:0, missed:0, skipped:0, flipped:false, firstTry:new Set(), history:[] };
  renderStage();
}

/* ------------------------------------------------------------------ card render */
function topicChip(c){ const t = TOPICS[c.t]; return `<span class="chip" style="--topic:${t.color};pointer-events:none">${esc(t.name)}</span>`; }
function listHtml(v){ return Array.isArray(v) ? (v.length > 1 ? "<ul>"+v.map(x=>`<li>${esc(x)}</li>`).join("")+"</ul>" : esc(v[0])) : esc(v); }
function rowsHtml(c){
  const rows = [
    ["plain", c.k === "scen" ? "Why" : "In plain English", c.plain],
    ["bar", "Kept out", c.bar],
    ["ok", c.k === "concept" && c.t === "jury" ? "Allowed" : "Still comes in", c.ok],
    ["exc", "Exceptions", c.exc],
    ["watch", "Watch out", c.watch],
    ["why", "Why it exists", c.why],
  ].filter(r => r[2] && (!Array.isArray(r[2]) || r[2].length));
  return rows.map(([cls,label,v]) => `<div class="row r-${cls}"><div class="rl">${label}</div><div class="rc">${listHtml(v)}</div></div>`).join("");
}
function frontHtml(c){
  let body;
  if (c.k === "scen") body = `<div class="facts">${esc(c.f)}</div>`;
  else body = `<div class="cite ${c.k==="case"?"case":c.k==="concept"?"concept":""}">${esc(c.f)}</div>${c.s?`<div class="sub">${esc(c.s)}</div>`:""}`;
  return `<div class="facehead">${topicChip(c)}<span class="kind">${KINDS[c.k]}</span></div>
    <div class="sticker">EXHIBIT<b>${String(c.no).padStart(3,"0")}</b></div>
    <div class="fbody">${body}</div>
    <div class="prompt">${esc(c.p || DEFAULT_PROMPT[c.k])}</div>`;
}
function backHtml(c){
  const head = c.k === "scen" ? "Scenario" : esc(c.f) + (c.s ? ` · <span style="font-weight:600;color:var(--muted)">${esc(c.s)}</span>` : "");
  return `<div class="bhead">${topicChip(c)}<span class="bcite">${head}</span>${c.src?`<span class="kind">${esc(c.src)}</span>`:""}</div>
    <div class="sticker">EXHIBIT<b>${String(c.no).padStart(3,"0")}</b></div>
    <div class="answer">${esc(c.a)}</div>
    <div class="rows">${rowsHtml(c)}</div>`;
}

function renderStage(){
  const st = $("stage");
  if (!session) deal();
  const s = session, done = s.total - new Set(s.queue).size;
  $("progTxt").textContent = s.total ? `${Math.min(done+1, s.total)} of ${s.total}` : "";
  $("progBar").style.width = s.total ? (done / s.total * 100) + "%" : "0";
  const retry = s.queue.filter(id => s.firstTry.has(id)).length;
  $("progLeft").textContent = retry ? `${retry} coming back` : "";
  if (!s.queue.length) {
    $("progTxt").textContent = `${s.total} of ${s.total}`;
    st.innerHTML = `<div class="done"><div class="eyebrow">Deck cleared</div><h2>${s.total ? "Every card answered" : "No cards in this deck"}</h2>
      <div class="tally"><div><b>${s.knew}</b>knew on first try</div><div><b>${s.shaky}</b>shaky</div><div><b>${s.missed}</b>misses</div><div><b>${s.skipped}</b>passed without rating</div></div>
      <div class="actions">${s.history.length?'<button class="btn next" id="doneBack"><kbd>←</kbd> Back</button>':''}<button class="btn show" id="again">Deal again</button><button class="btn" id="weakest">Study weakest first</button></div></div>`;
    $("again").onclick = deal; if ($("doneBack")) $("doneBack").onclick = back;
    $("weakest").onclick = () => { sel.order = "weak"; changed(); $("deal").classList.remove("pulse"); deal(); };
    return;
  }
  const c = byId[s.queue[0]];
  st.innerHTML = `<div class="scene"><div class="card${s.flipped?" flipped":""}" id="card" tabindex="0" role="button" aria-label="Flashcard. Press space to flip.">
      <div class="face front" aria-hidden="${s.flipped}">${frontHtml(c)}</div>
      <div class="face back" aria-hidden="${!s.flipped}">${backHtml(c)}</div></div></div>
    <div class="actions" id="acts"></div>
    <div class="hint">Space to flip · 1 missed · 2 shaky · 3 knew it · → next card · ← back (undoes that rating)</div>`;
  $("card").onclick = flip;
  renderActions();
}
function renderActions(){
  const a = $("acts"); if (!a) return;
  if (!session.flipped) { a.innerHTML = `<button class="btn next" id="backBtn"${session.history.length?"":" disabled"}><kbd>←</kbd> Back</button><button class="btn show" id="showBtn">Show answer <kbd>Space</kbd></button><button class="btn next" id="nextBtn">Next card <kbd>→</kbd></button>`; $("showBtn").onclick = flip; $("nextBtn").onclick = next; $("backBtn").onclick = back; }
  else {
    a.innerHTML = `<button class="btn next" id="backBtn"${session.history.length?"":" disabled"}><kbd>←</kbd> Back</button><button class="btn miss" data-r="1">Missed it <kbd>1</kbd></button><button class="btn shaky" data-r="2">Shaky <kbd>2</kbd></button><button class="btn knew" data-r="3">Knew it <kbd>3</kbd></button><button class="btn next" id="nextBtn">Next card <kbd>→</kbd></button>`;
    a.querySelectorAll("button[data-r]").forEach(b => b.onclick = () => rate(+b.dataset.r));
    $("nextBtn").onclick = next; $("backBtn").onclick = back;
  }
}
function flip(){
  if (!session || !session.queue.length) return;
  session.flipped = !session.flipped;
  const card = $("card"); card.classList.toggle("flipped", session.flipped);
  card.querySelector(".front").setAttribute("aria-hidden", session.flipped);
  card.querySelector(".back").setAttribute("aria-hidden", !session.flipped);
  renderActions();
}
function snap(id){
  const s = session;
  return { id, had: Object.prototype.hasOwnProperty.call(store.box, id), box: store.box[id],
           knew:s.knew, shaky:s.shaky, missed:s.missed, skipped:s.skipped, ft:s.firstTry.has(id) };
}
function back(){
  const s = session; if (!s || !s.history || !s.history.length) return;
  const h = s.history.pop();
  s.queue = s.queue.filter(x => x !== h.id); s.queue.unshift(h.id);
  if (h.had) store.box[h.id] = h.box; else delete store.box[h.id];
  s.knew = h.knew; s.shaky = h.shaky; s.missed = h.missed; s.skipped = h.skipped;
  if (h.ft) s.firstTry.add(h.id); else s.firstTry.delete(h.id);
  s.flipped = false; save(); renderStage(); renderLedger();
  const card = $("card"); if (card) card.focus({preventScroll:true});
}
function next(){
  const s = session; if (!s || !s.queue.length) return;
  s.history.push(snap(s.queue[0]));
  s.queue.shift(); s.skipped++; s.flipped = false; renderStage();
  const card = $("card"); if (card) card.focus({preventScroll:true});
}
function rate(r){
  const s = session; if (!s || !s.flipped || !s.queue.length) return;
  s.history.push(snap(s.queue[0]));
  const id = s.queue.shift(), b = boxOf(id), retried = s.firstTry.has(id);
  if (r === 1) { store.box[id] = 1; s.missed++; s.queue.splice(Math.min(3, s.queue.length), 0, id); s.firstTry.add(id); }
  else if (r === 2) { store.box[id] = b >= 3 ? 2 : Math.max(1, b); if (!retried) s.shaky++; s.queue.push(id); s.firstTry.add(id); }
  else { store.box[id] = b === 0 && !retried ? 3 : Math.min(5, b + 1); if (!retried) s.knew++; }
  save(); s.flipped = false; renderStage(); renderLedger();
  const card = $("card"); if (card) card.focus({preventScroll:true});
}

/* ------------------------------------------------------------------ ledger */
function stackHtml(m,l,n){ const t = m+l+n || 1; return `<i class="m" style="width:${m/t*100}%"></i><i class="l" style="width:${l/t*100}%"></i>`; }
function counts(list){ let m=0,l=0,n=0; list.forEach(c => { const b = boxOf(c.id); b>=3?m++:b>0?l++:n++; }); return [m,l,n]; }
function renderLedger(){
  const [m,l,n] = counts(CARDS);
  $("ovM").textContent = m; $("ovL").textContent = l; $("ovT").textContent = `${CARDS.length} cards`;
  $("ovBar").innerHTML = stackHtml(m,l,n);
  $("ledger").innerHTML = Object.entries(TOPICS).map(([k,t]) => {
    const cs = CARDS.filter(c => c.t === k), [a,b,c] = counts(cs);
    return `<div class="lrow" style="--topic:${t.color}"><span class="nm">${esc(t.name)}</span><span class="ct">${a}/${cs.length}</span><div class="stack">${stackHtml(a,b,c)}</div></div>`;
  }).join("");
}
$("resetBtn").onclick = () => { $("confirmBox").hidden = false; };
$("resetNo").onclick = () => { $("confirmBox").hidden = true; };
$("resetYes").onclick = () => { store.box = {}; save(); $("confirmBox").hidden = true; renderLedger(); renderChips(); if (!$("listView").hidden) renderList(); };

/* ------------------------------------------------------------------ list view */
function renderList(){
  const cards = filtered();
  $("list").innerHTML = cards.length ? cards.map(c => {
    const b = boxOf(c.id), status = b>=3 ? "Mastered" : b>0 ? "Learning" : "New";
    const title = c.k === "scen" ? `Scenario<span>${esc(c.f)}</span>` : `${esc(c.f)}<span>${esc(c.s||"")}</span>`;
    return `<details class="litem"><summary>${topicChip(c)}<div class="lc">${title}</div><span class="box">${status}</span></summary>
      <div class="inner"><div class="answer">${esc(c.a)}</div><div class="rows">${rowsHtml(c)}</div></div></details>`;
  }).join("") : `<div class="empty">No cards match these filters. Pick at least one topic and one card type.</div>`;
}
function showTab(which){
  const study = which === "study";
  $("tabStudy").setAttribute("aria-selected", study); $("tabList").setAttribute("aria-selected", !study);
  $("studyView").hidden = !study; $("listView").hidden = study;
  if (!study) renderList();
}
$("tabStudy").onclick = () => showTab("study");
$("tabList").onclick = () => showTab("list");

/* ------------------------------------------------------------------ keys */
document.addEventListener("keydown", e => {
  if ($("studyView").hidden || e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea") return;
  if ((e.key === " " || e.key === "Enter") && (tag !== "button" || e.target.id === "showBtn")) { e.preventDefault(); flip(); }
  else if (e.key === "ArrowRight") { e.preventDefault(); next(); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); back(); }
  else if (["1","2","3"].includes(e.key) && session && session.flipped) { e.preventDefault(); rate(+e.key); }
});

renderChips(); renderLedger(); deal();
</script>
