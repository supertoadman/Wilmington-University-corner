{"c":4,"k":"name","id":"rav","q":"Teenagers burn a cross in a Black family’s fenced yard. They are charged under a city ordinance banning symbols that arouse anger “on the basis of race, color, creed, religion or gender,” construed to reach only fighting words.\nWhich case is this?","o":["R.A.V. v. City of St. Paul","Cohen v. California","Terminiello v. City of Chicago","Collin v. Smith"],"e":"R.A.V. v. City of St. Paul (1992): The ordinance was facially invalid for singling out some fighting words.","v":false},
{"c":4,"k":"name","id":"near","q":"State courts enjoin a newspaper from publishing articles accusing local law enforcement officials of corruption.\nWhich case is this?","o":["Near v. Minnesota ex rel. Olson","New York Times Co. v. United States","Terminiello v. City of Chicago","Brandenburg v. Ohio"],"e":"Near v. Minnesota ex rel. Olson (1931): The injunction was an invalid prior restraint.","v":false},
{"c":4,"k":"name","id":"pentagon","q":"A leaker gives newspapers a classified Vietnam War study showing the government knew the war likely couldn’t be won. The Administration seeks to enjoin publication, which is restrained for 15 days.\nWhich case is this?","o":["New York Times Co. v. United States","Near v. Minnesota ex rel. Olson","Brandenburg v. Ohio","Terminiello v. City of Chicago"],"e":"New York Times Co. v. United States (1971): The injunctions were denied; the government didn’t meet its burden.","v":false},
{"c":4,"k":"hold","id":"terminiello","q":"What did Terminiello v. City of Chicago hold?","o":["The conviction was reversed because the instruction reached protected speech","The conviction stood because the speech was incitement to riot","The speech was fighting words aimed directly at the protesters","The city could punish any speech that caused a public disturbance"],"e":"Speech can’t be punished merely for stirring anger or creating unrest.","v":false},
{"c":4,"k":"hold","id":"brandenburg","q":"What did Brandenburg v. Ohio hold?","o":["Ohio’s criminal syndicalism law was unconstitutional","The conviction stood under the clear and present danger test","Klan rallies are unprotected fighting words","The law was valid but misapplied to this speaker"],"e":"The law punished mere advocacy, with no intent, imminence, or likelihood requirement. It overruled Whitney v. California.","v":false},
{"c":4,"k":"hold","id":"rav","q":"What did R.A.V. v. City of St. Paul hold?","o":["The ordinance was facially invalid for singling out some fighting words","Cross burning is protected because it can never be fighting words","The ordinance was valid because it reached only fighting words","The teenagers’ conduct could not be punished under any law"],"e":"Even within fighting words, St. Paul couldn’t pick out race, religion, and gender.","v":false},
{"c":4,"k":"hold","id":"near","q":"What did Near v. Minnesota ex rel. Olson hold?","o":["The injunction was an invalid prior restraint","The paper could be enjoined for defaming officials","The paper had to prove its charges before printing","States may license papers covering public officials"],"e":"Reversed: a prior restraint stops speech before it occurs, which the Framers especially opposed.","v":false},
{"c":4,"k":"hold","id":"pentagon","q":"What did New York Times Co. v. United States hold?","o":["The injunctions were denied; the government didn’t meet its burden","Classified material is unprotected once the nation is at war","The papers could publish only after redacting troop details","The executive’s judgment of security harm is conclusive"],"e":"The Pentagon Papers case. Don’t confuse it with New York Times Co. v. Sullivan (defamation).","v":false},
{"c":4,"k":"name","id":"terminiello","q":"Which case stands for this rule?\nSpeech may not be punished for stirring anger or inviting dispute; it must pose a clear and present danger of a serious evil far above public inconvenience or annoyance.","o":["Terminiello v. City of Chicago","Cohen v. California","Collin v. Smith","R.A.V. v. City of St. Paul"],"e":"Terminiello v. City of Chicago (1949). Speech can’t be punished merely for stirring anger or creating unrest.","v":true},
{"c":4,"k":"name","id":"brandenburg","q":"Which case stands for this rule?\nAdvocacy of force or law violation may be punished only if it is directed to inciting imminent lawless action and is likely to produce it.","o":["Brandenburg v. Ohio","Whitney v. California","Counterman v. Colorado","R.A.V. v. City of St. Paul"],"e":"Brandenburg v. Ohio (1969). The law punished mere advocacy, with no intent, imminence, or likelihood requirement. It overruled Whitney v. California.","v":true},
{"c":4,"k":"name","id":"rav","q":"Which case stands for this rule?\nGovernment may ban an entire unprotected category for what makes it proscribable, but may not single out a subset based on topic or viewpoint.","o":["R.A.V. v. City of St. Paul","Terminiello v. City of Chicago","Collin v. Smith","Brandenburg v. Ohio"],"e":"R.A.V. v. City of St. Paul (1992). Even within fighting words, St. Paul couldn’t pick out race, religion, and gender.","v":true},
{"c":4,"k":"name","id":"near","q":"Which case stands for this rule?\nPrior restraints, which the Framers especially opposed, are presumptively invalid; the only suggested exception is a narrow wartime dictum.","o":["Near v. Minnesota ex rel. Olson","Terminiello v. City of Chicago","Brandenburg v. Ohio","Collin v. Smith"],"e":"Near v. Minnesota ex rel. Olson (1931). Reversed: a prior restraint stops speech before it occurs, which the Framers especially opposed.","v":true},
{"c":4,"k":"name","id":"pentagon","q":"Which case stands for this rule?\nA prior restraint comes with a heavy presumption against validity, and a general claim of harm to national security doesn’t carry the government’s heavy burden.","o":["New York Times Co. v. United States","Brandenburg v. Ohio","Terminiello v. City of Chicago","United States v. Williams"],"e":"New York Times Co. v. United States (1971). The Pentagon Papers case. Don’t confuse it with New York Times Co. v. Sullivan (defamation).","v":true},
{"c":4,"k":"why","id":"terminiello","q":"What did the dissent in Terminiello v. City of Chicago emphasize?","o":["Defense counsel never objected to the jury instruction","The speaker had openly called for an attack on protesters","The Court should have applied a bad-tendency test instead","The city had never issued the speaker a permit for the hall"],"e":"Vinson, Frankfurter, Jackson, and Burton stressed that counsel failed to object to the instruction.","v":false},
{"c":4,"k":"why","id":"brandenburg","q":"What are the elements of the test from Brandenburg v. Ohio?","o":["Directed to inciting, imminent, lawless action, and likely to produce it","Intent, falsity, actual malice, and resulting harm to a person","A clear, present, serious, and substantial danger to the state","Prurient, patently offensive, lacking serious value, and aimed at minors"],"e":"(1) Directed to inciting or producing (2) imminent (3) lawless action and (4) likely to produce it.","v":false},
{"c":4,"k":"why","id":"rav","q":"Why was the ordinance in R.A.V. v. City of St. Paul underinclusive?","o":["It skipped fighting words about politics or sexual orientation","It reached only burning symbols, not spoken or written insults or slurs","It applied only on private property, never in public places","It exempted crosses burned during religious ceremonies"],"e":"Picking out some topics within an unprotected category is content discrimination.","v":false},
{"c":4,"k":"why","id":"near","q":"What is the significance of the wartime dictum in Near v. Minnesota ex rel. Olson?","o":["It is the only recognized exception, and it has never been applied","It is the test courts now apply to every national security case","It became the holding of the Pentagon Papers case in 1971","It allows any prior restraint during a declared war"],"e":"Troop numbers and locations or transport sailing dates; the Court has never actually applied it.","v":false},
{"c":4,"k":"why","id":"pentagon","q":"What did the dissent in New York Times Co. v. United States argue?","o":["The issues were hard and the decision too rushed","Prior restraints are never valid in peacetime","The newspapers had stolen government property","The Court lacked jurisdiction over a dispute with the executive"],"e":"Burger, Harlan, and Blackmun dissented over the rushed process.","v":false},
{"c":4,"k":"det","id":"terminiello","q":"Which facts belong to Terminiello v. City of Chicago?","o":["A breach-of-the-peace conviction for a speech to a packed hall with protesters outside.","A filmed Klan rally prosecuted under Ohio’s criminal syndicalism law.","A village blocks a Nazi march planned where thousands of Holocaust survivors live.","A conviction under California’s criminal syndicalism law for helping organize a Communist Labor Party branch."],"e":"Terminiello v. City of Chicago (1949): A breach-of-the-peace conviction for a speech to a packed hall with protesters outside.","v":true},
{"c":4,"k":"det","id":"brandenburg","q":"Which facts belong to Brandenburg v. Ohio?","o":["A filmed Klan rally prosecuted under Ohio’s criminal syndicalism law.","A breach-of-the-peace conviction for a speech to a packed hall with protesters outside.","Hundreds of unwanted Facebook messages to a musician, prosecuted under an objective-test stalking law.","Families suing the publisher of a contract-killing manual used in a triple murder."],"e":"Brandenburg v. Ohio (1969): A filmed Klan rally prosecuted under Ohio’s criminal syndicalism law.","v":true},
{"c":4,"k":"det","id":"rav","q":"Which facts belong to R.A.V. v. City of St. Paul?","o":["A cross burned in a Black family’s yard, charged under a bias-based fighting-words ordinance.","A disturbing-the-peace conviction for a profane anti-draft jacket worn in a courthouse.","A village blocks a Nazi march planned where thousands of Holocaust survivors live.","A city ordinance banning explicit material that depicts women as subordinate."],"e":"R.A.V. v. City of St. Paul (1992): A cross burned in a Black family’s yard, charged under a bias-based fighting-words ordinance.","v":true},
{"c":4,"k":"det","id":"near","q":"Which facts belong to Near v. Minnesota ex rel. Olson?","o":["An injunction against a newspaper accusing local officials of corruption.","The Nixon Administration’s effort to enjoin publication of a classified Vietnam War study.","A filmed Klan rally prosecuted under Ohio’s criminal syndicalism law.","Drivers fined for covering “Live Free or Die” on their license plates."],"e":"Near v. Minnesota ex rel. Olson (1931): An injunction against a newspaper accusing local officials of corruption.","v":true},
{"c":4,"k":"det","id":"pentagon","q":"Which facts belong to New York Times Co. v. United States?","o":["The Nixon Administration’s effort to enjoin publication of a classified Vietnam War study.","An injunction against a newspaper accusing local officials of corruption.","A breach-of-the-peace conviction for a speech to a packed hall with protesters outside.","A prosecution for falsely claiming the Medal of Honor at a public meeting."],"e":"New York Times Co. v. United States (1971): The Nixon Administration’s effort to enjoin publication of a classified Vietnam War study.","v":true},
{"c":4,"k":"name","id":"terminiello","q":"Which case is this from?\nSpeech may best serve its purpose when it induces unrest or stirs people to anger; the alternative is standardized ideas.","o":["Terminiello v. City of Chicago","Collin v. Smith","R.A.V. v. City of St. Paul","Whitney v. California"],"e":"From Terminiello v. City of Chicago (1949).","v":true},
{"c":4,"k":"name","id":"brandenburg","q":"Which case is this from?\nAbstract teaching of the moral necessity of force differs from “preparing a group for violent action and steeling it to such action.”","o":["Brandenburg v. Ohio","Counterman v. Colorado","R.A.V. v. City of St. Paul","Rice v. Paladin Enterprises, Inc."],"e":"From Brandenburg v. Ohio (1969).","v":true},
{"c":4,"k":"name","id":"rav","q":"Which case is this from?\nUnprotected categories are not “invisible to the Constitution”: government may ban libel, but not only libel critical of the government.","o":["R.A.V. v. City of St. Paul","Collin v. Smith","Brandenburg v. Ohio","American Booksellers Ass’n v. Hudnut"],"e":"From R.A.V. v. City of St. Paul (1992).","v":true},
{"c":4,"k":"name","id":"near","q":"Which case is this from?\nIn wartime, government might prevent publication of troop numbers and locations or transport sailing dates.","o":["Near v. Minnesota ex rel. Olson","Brandenburg v. Ohio","Collin v. Smith","Wooley v. Maynard"],"e":"From Near v. Minnesota ex rel. Olson (1931).","v":true},
{"c":4,"k":"name","id":"pentagon","q":"Which case is this from?\nBlack: every moment of restraint was a flagrant violation; the press serves the governed, not the governors; “security” is a vague generality.","o":["New York Times Co. v. United States","Terminiello v. City of Chicago","United States v. Williams","United States v. Alvarez"],"e":"From New York Times Co. v. United States (1971).","v":true},
{"c":4,"k":"det","id":"terminiello","q":"What reading lesson does the outline draw from Terminiello v. City of Chicago?","o":["Start with the law as construed, not the inflammatory facts","Start with the facts; the law matters only in close cases","Read the dissent first, since it later became the law","Ignore jury instructions, which rarely decide free speech cases"],"e":"The facts sounded like incitement, but the jury instruction swept in protected speech.","v":false},
{"c":4,"k":"det","id":"rav","q":"What did the Harvard note discussed with R.A.V. v. City of St. Paul argue?","o":["Chaplinsky v. New Hampshire should be overruled, not expanded","Chaplinsky v. New Hampshire should cover all hate speech","Brandenburg v. Ohio should replace the fighting-words test","Cohen v. California should be limited to its own facts and setting"],"e":"The fighting-words doctrine rewards fighting and gives police discretion to punish minorities and critics.","v":false},
{"c":4,"k":"det","id":"near","q":"Which case relied on Near v. Minnesota ex rel. Olson to deny injunctions against publishing a classified Vietnam study?","o":["New York Times Co. v. United States","Brandenburg v. Ohio","Terminiello v. City of Chicago","West Virginia State Board of Education v. Barnette"],"e":"The Pentagon Papers case cited Near and Bantam Books for the heavy presumption against prior restraints.","v":false},
{"c":4,"k":"det","id":"pentagon","q":"After New York Times Co. v. United States, what did the CIA cases Marchetti and Snepp rest on?","o":["Secrecy agreements signed by the employees","Near v. Minnesota ex rel. Olson’s wartime dictum","Executive privilege over classified documents","The Espionage Act’s criminal ban on leaks"],"e":"The Court has never upheld a national security prior restraint. The Progressive (H-bomb article) was enjoined but abandoned before appeal.","v":false},
{"c":4,"k":"concept","id":"t-incite","q":"What are the elements of incitement under Brandenburg?","o":["Directed to inciting imminent lawless action, and likely to produce it","A clear and present danger of an evil Congress may lawfully prevent","A bad tendency to produce unlawful conduct at some later time","Advocacy of force as a method of change, made to an assembled group"],"e":"Four parts: intent (“directed to”), imminence, lawless action, and likelihood. Ohio’s law punished mere advocacy with none of them.","v":false},
{"c":4,"k":"concept","id":"t-incite","q":"Which statement is protected under Brandenburg?","o":["Teaching that violent revolution will someday be morally necessary","Telling an armed crowd outside a door to break it down right now","Urging a crowd gathered at a jail to storm it before police can arrive","Directing listeners to set fire to a named building tonight"],"e":"Abstract teaching of the propriety or even necessity of force differs from “preparing a group for violent action and steeling it to such action.”","v":false},
{"c":4,"k":"concept","id":"t-incite","q":"Put the incitement cases in historical order, oldest standard first.","o":["Abrams and Whitney, then Terminiello and Dennis, then Brandenburg","Brandenburg, then Terminiello and Dennis, then Abrams and Whitney","Terminiello and Dennis, then Abrams and Whitney, then Brandenburg","Abrams and Whitney, then Brandenburg, then Terminiello and Dennis"],"e":"1919–27: clear and present danger or bad tendency, used to punish dissidents. 1949–51: clear and present danger of a serious evil. 1969 on: intent, imminence, and likelihood.","v":false},
{"c":4,"k":"concept","id":"t-incite","q":"An activist livestreams outside a courthouse: “we need to shut this courthouse down today.” Ten minutes later a crowd breaks in. Which Brandenburg element is the closest question?","o":["Intent","Imminence","Lawless action","Whether it is speech"],"e":"Imminence is strong (“today,” a crowd at the target, ten minutes). His disclaimer of violence makes intent the swing issue; urging escalation after seeing the pushing is the government’s best evidence.","v":false},
{"c":4,"k":"concept","id":"t-incite","q":"What does it mean that Brandenburg requires the advocacy to be “likely” to produce lawless action?","o":["The speech must be likely to work, not just intended to","The speaker must be likely to repeat the advocacy later","The lawless act must be likely to cause serious injury","Most listeners must be likely to agree with the speaker’s view"],"e":"Intent alone isn’t enough. Brandenburg’s audience was only Klan members and journalists at a farm, with no target at hand.","v":false},
{"c":4,"k":"concept","id":"t-fighting","q":"What are fighting words under Chaplinsky?","o":["Personal insults so offensive they’re likely to provoke an immediate attack","Profanity used in a public place where women or children are present","Hateful statements about a group’s race, religion, or national origin","Speech that stirs a crowd to anger or creates a public disturbance"],"e":"The Court hasn’t upheld a restriction on this theory since 1942. Cohen’s jacket wasn’t fighting words: no one could reasonably see a direct personal insult.","v":false},
{"c":4,"k":"concept","id":"t-fighting","q":"What is the rule against a “heckler’s veto”?","o":["A speaker can’t be punished for a hostile crowd’s possible violence if police can control it","A heckler may be removed from a public meeting so long as the removal is neutral as to viewpoint","Police may stop a speech once a crowd threatens violence and the speaker has been warned","A speaker who provokes hecklers waives First Amendment protection for that occasion"],"e":"Cox and Edwards: in Cox, 75 to 80 armed police separated a hostile crowd of 100 to 300 from the protesters.","v":false},
{"c":4,"k":"concept","id":"t-fighting","q":"Is hate speech an unprotected category?","o":["No; it is protected unless it fits a category such as incitement","Yes, since R.A.V., when it targets someone’s race, religion, or gender","Yes, when the audience includes survivors of the ideology","No, but it may be banned from public sidewalks and parks"],"e":"In Collin the village conceded it expected no violence, which took the case outside both Brandenburg and Chaplinsky.","v":false},
{"c":4,"k":"concept","id":"t-fighting","q":"Under R.A.V., how may government regulate within an unprotected category?","o":["It may ban the category for what makes it proscribable, not a topic or viewpoint subset","It may ban any subset of the category, so long as it targets the most harmful part","It may ban the category only after proving harm in each individual prosecution","It may ban any subset tied to a class protected by federal civil rights statutes"],"e":"St. Paul’s ordinance covered race, color, creed, religion, and gender, but not political affiliation, union membership, or sexual orientation.","v":false},
{"c":4,"k":"concept","id":"t-fighting","q":"Why did the Harvard note argue Chaplinsky should be overruled rather than expanded?","o":["It rewards fighting and gives police discretion to punish minorities and critics","It protects too little speech, because personal insults are rarely political","It conflicts with Brandenburg’s requirement that the speaker actually intend violence","It covers only face-to-face speech and can’t reach insults sent online"],"e":"The critique the note answered: Chaplinsky assumed a “fight” response, while others may flee or submit. Expanding it to “fright or flight” would only widen the discretion.","v":false},
{"c":4,"k":"concept","id":"t-prior","q":"What makes a restraint on speech a “prior” restraint?","o":["Government stops the speech before it occurs, by injunction or license","Government punishes the speech after it occurs, by criminal prosecution","Government taxes the speech before publication, by a special levy","Government reviews the speech after publication, at an agency hearing"],"e":"A prior restraint carries a heavy presumption of invalidity, and the government bears a heavy burden to justify it.","v":false},
{"c":4,"k":"concept","id":"t-prior","q":"What is the only recognized exception to the bar on prior restraints?","o":["Near’s wartime dictum: troop locations and sailing dates","Any document classified top secret by the executive","Information a court finds dangerous after a full adversarial hearing","Defamatory articles about officials before an election"],"e":"The Court has never actually applied it. Near itself struck an injunction against a paper accusing local officials of corruption.","v":false},
{"c":4,"k":"concept","id":"t-prior","q":"Why are prior restraints considered worse than punishment after the fact?","o":["They reach more speech, stop it before it’s heard, and skip trial safeguards","They are imposed by juries, who are less careful than judges with unpopular speech","They let the speaker publish first and pay damages only later","They apply only to the press, so ordinary speakers get no notice"],"e":"Thomas Emerson’s list, quoted by the ACLU: they’re also imposed “by a stroke of the pen,” draw less public criticism, and drive toward excess.","v":false},
{"c":4,"k":"concept","id":"t-prior","q":"In the Pentagon Papers case, what did the government offer that failed to carry its heavy burden?","o":["A general claim of harm to national security","A specific showing that troop movements were at risk","Proof that the study had been taken without authority","A congressional statute authorizing the injunction"],"e":"“Security” was a vague generality. The ACLU would have limited restraints to tactical military operations, weapons designs, and codes.","v":false},
{"c":4,"k":"concept","id":"t-prior","q":"Has the Supreme Court ever upheld a national-security prior restraint on the press?","o":["No; Snepp and Marchetti rested on CIA secrecy agreements instead","Yes; it enjoined The Progressive’s article on the hydrogen bomb","Yes; in Near, for troop locations a newspaper published during wartime","No, but only because Congress has never authorized one"],"e":"The Progressive was enjoined by a lower court, and the case was abandoned before appeal.","v":false},
{"c":5,"k":"name","id":"counterman","q":"Over two years, a man sends hundreds of Facebook messages to a musician he has never met, opening new accounts when blocked. She cancels performances out of fear, and he is convicted under a stalking law using a purely objective test.\nWhich case is this?","o":["Counterman v. Colorado","United States v. Williams","Brandenburg v. Ohio","Rice v. Paladin Enterprises, Inc."],"e":"Counterman v. Colorado (2023): At least recklessness is required, so the conviction was vacated.","v":false},
{"c":5,"k":"name","id":"williams","q":"A federal law makes it a crime to offer or request material the defendant believes, or intends another to believe, is child pornography. The defendant challenges the law as overbroad and vague.\nWhich case is this?","o":["United States v. Williams","Rice v. Paladin Enterprises, Inc.","Counterman v. Colorado","Ashcroft v. Free Speech Coalition"],"e":"United States v. Williams (2008): The pandering law was constitutional and not vague.","v":false},
{"c":5,"k":"name","id":"paladin","q":"A publisher sells a detailed manual for contract killers. A reader uses it to murder three people, and the victims’ families sue the publisher for aiding and abetting. The publisher stipulates that it intended to help murderers.\nWhich case is this?","o":["Rice v. Paladin Enterprises, Inc.","United States v. Williams","Brandenburg v. Ohio","Garcia v. Character Technologies, Inc."],"e":"Rice v. Paladin Enterprises, Inc. (1997): The First Amendment didn’t bar the families’ suit.","v":false},
{"c":5,"k":"name","id":"garcia","q":"A 14-year-old dies by suicide after heavy use of an AI companion app. His mother sues the company for wrongful death, alleging an anthropomorphized, manipulative design marketed to children.\nWhich case is this?","o":["Garcia v. Character Technologies, Inc.","Rice v. Paladin Enterprises, Inc.","Counterman v. Colorado","United States v. Williams"],"e":"Garcia v. Character Technologies, Inc. (2025): First Amendment dismissal was denied.","v":false},
{"c":5,"k":"hold","id":"counterman","q":"What did Counterman v. Colorado hold?","o":["At least recklessness is required, so the conviction was vacated","A purely objective reasonable-recipient test is enough to convict","Specific intent to threaten must be proved in every true-threat case","Messages sent online can never qualify as true threats"],"e":"A true threat is a serious expression of intent to commit unlawful violence, judged by a reasonable recipient, plus at least recklessness.","v":false},
{"c":5,"k":"hold","id":"williams","q":"What did United States v. Williams hold?","o":["The pandering law was constitutional and not vague","The law was overbroad because it reached virtual images","The law was vague because belief is hard to prove","Offers are protected unless the material really exists"],"e":"Offers and requests are speech integral to crime, even if the belief is mistaken.","v":false},
{"c":5,"k":"hold","id":"paladin","q":"What did Rice v. Paladin Enterprises, Inc. hold?","o":["The First Amendment didn’t bar the families’ suit","Books are always protected, however a reader uses them","The publisher was liable only if the book was obscene","The suit failed because the killer acted on his own"],"e":"Aiding and abetting is speech integral to crime, and publishers aren’t exempt.","v":false},
{"c":5,"k":"hold","id":"garcia","q":"What did Garcia v. Character Technologies, Inc. hold at the preliminary stage?","o":["First Amendment dismissal was denied","Chatbot output is fully protected speech","The company was liable for wrongful death","Section 230 immunity barred the suit"],"e":"The court wasn’t prepared to hold the output is speech. It is the first wrongful-death suit against an AI chatbot company.","v":false},
{"c":5,"k":"name","id":"counterman","q":"Which case stands for this rule?\nTo punish a true threat, the state must prove at least recklessness: the speaker consciously disregarded a substantial risk that the words would be viewed as threatening.","o":["Counterman v. Colorado","Brandenburg v. Ohio","Rice v. Paladin Enterprises, Inc.","Garcia v. Character Technologies, Inc."],"e":"Counterman v. Colorado (2023). A true threat is a serious expression of intent to commit unlawful violence, judged by a reasonable recipient, plus at least recklessness.","v":true},
{"c":5,"k":"name","id":"williams","q":"Which case stands for this rule?\nOffers to provide and requests to obtain contraband are categorically unprotected, and a law isn’t vague merely because close cases exist.","o":["United States v. Williams","Counterman v. Colorado","Ashcroft v. Free Speech Coalition","New York v. Ferber"],"e":"United States v. Williams (2008). Offers and requests are speech integral to crime, even if the belief is mistaken.","v":true},
{"c":5,"k":"name","id":"paladin","q":"Which case stands for this rule?\nSpeech, even publishing, that aids and abets a crime is unprotected where the publisher intended to assist criminals and the material was used exactly as intended.","o":["Rice v. Paladin Enterprises, Inc.","Brandenburg v. Ohio","Garcia v. Character Technologies, Inc.","Counterman v. Colorado"],"e":"Rice v. Paladin Enterprises, Inc. (1997). Aiding and abetting is speech integral to crime, and publishers aren’t exempt.","v":true},
{"c":5,"k":"name","id":"garcia","q":"Which case stands for this rule?\nA distributor may assert its users’ right to receive speech, but output counts as speech only if it is expressive, and the court wasn’t prepared to hold that chatbot output is.","o":["Garcia v. Character Technologies, Inc.","Counterman v. Colorado","United States v. Williams","Brown v. Entertainment Merchants Association"],"e":"Garcia v. Character Technologies, Inc. (2025). The court wasn’t prepared to hold the output is speech. It is the first wrongful-death suit against an AI chatbot company.","v":true},
{"c":5,"k":"why","id":"counterman","q":"Why did Counterman v. Colorado choose recklessness over purpose or knowledge?","o":["It balances chilling of speech against the real harms of threats","Recklessness is the same standard used for incitement","The Colorado legislature had already chosen recklessness","It is the easiest mental state for juries to apply"],"e":"A subjective element prevents self-censorship; recklessness balances that against victims’ harm. Reckless speakers consciously accept a substantial risk.","v":false},
{"c":5,"k":"why","id":"williams","q":"According to United States v. Williams, what does “promotes” mean?","o":["Recommending a particular item with intent to initiate a transfer","Arguing in public that child pornography should be legal","Encouraging people in general to obtain such material","Displaying the material on a publicly accessible website"],"e":"Abstract advocacy stays protected (Brandenburg; Claiborne Hardware). Belief and intent are true-or-false facts.","v":false},
{"c":5,"k":"why","id":"paladin","q":"Why does Rice v. Paladin Enterprises, Inc. rarely threaten publishers of novels and films?","o":["Those publishers don’t intend to assist crime","Fiction is categorically protected under Brandenburg v. Ohio","Novels reach too large an audience to be integral to crime","Copycat crimes are unforeseeable"],"e":"The stipulations, detailed instructions, exhortation to murder, and lack of legitimate purpose made Paladin unique.","v":false},
{"c":5,"k":"why","id":"garcia","q":"Which concurrence did Garcia v. Character Technologies, Inc. rely on about algorithms and expression?","o":["Barrett’s concurrence in Moody v. NetChoice","Thomas’s concurrence in Brown v. Entertainment Merchants Association","Kagan’s majority in Counterman v. Colorado","Breyer’s concurrence in United States v. Alvarez"],"e":"An algorithm carrying out a human’s expressive choice may be speech; when owners hand the reins to an LLM, it’s unclear anyone chose.","v":false},
{"c":5,"k":"det","id":"counterman","q":"Which facts belong to Counterman v. Colorado?","o":["Hundreds of unwanted Facebook messages to a musician, prosecuted under an objective-test stalking law.","A challenge to the federal ban on pandering or soliciting child pornography.","Families suing the publisher of a contract-killing manual used in a triple murder.","A prosecution for falsely claiming the Medal of Honor at a public meeting."],"e":"Counterman v. Colorado (2023): Hundreds of unwanted Facebook messages to a musician, prosecuted under an objective-test stalking law.","v":true},
{"c":5,"k":"det","id":"williams","q":"Which facts belong to United States v. Williams?","o":["A challenge to the federal ban on pandering or soliciting child pornography.","Families suing the publisher of a contract-killing manual used in a triple murder.","A ban on virtual images that only “appear to” depict minors.","An “adult adoption” fraud prosecuted under a ban on encouraging or inducing illegal immigration."],"e":"United States v. Williams (2008): A challenge to the federal ban on pandering or soliciting child pornography.","v":true},
{"c":5,"k":"det","id":"paladin","q":"Which facts belong to Rice v. Paladin Enterprises, Inc.?","o":["Families suing the publisher of a contract-killing manual used in a triple murder.","A challenge to the federal ban on pandering or soliciting child pornography.","A wrongful-death suit against an AI chatbot company over a teenager’s suicide.","An “adult adoption” fraud prosecuted under a ban on encouraging or inducing illegal immigration."],"e":"Rice v. Paladin Enterprises, Inc. (1997): Families suing the publisher of a contract-killing manual used in a triple murder.","v":true},
{"c":5,"k":"det","id":"garcia","q":"Which facts belong to Garcia v. Character Technologies, Inc.?","o":["A wrongful-death suit against an AI chatbot company over a teenager’s suicide.","Families suing the publisher of a contract-killing manual used in a triple murder.","A challenge to the federal ban on pandering or soliciting child pornography.","An afternoon radio broadcast of Carlin’s “Filthy Words” monologue."],"e":"Garcia v. Character Technologies, Inc. (2025): A wrongful-death suit against an AI chatbot company over a teenager’s suicide.","v":true},
{"c":5,"k":"name","id":"counterman","q":"Which case is this from?\n“True” excludes jest and hyperbole, like “I’ll kill you if you leave dirty dishes in the sink.”","o":["Counterman v. Colorado","Rice v. Paladin Enterprises, Inc.","Garcia v. Character Technologies, Inc.","United States v. Alvarez"],"e":"From Counterman v. Colorado (2023).","v":true},
{"c":5,"k":"name","id":"williams","q":"Which case is this from?\nVagueness concerns indeterminacy about what fact must be proved, like “annoying,” not difficulty proving it.","o":["United States v. Williams","Ashcroft v. Free Speech Coalition","New York v. Ferber","United States v. Hansen"],"e":"From United States v. Williams (2008).","v":true},
{"c":5,"k":"name","id":"paladin","q":"Which case is this from?\nThe publisher stipulated that it knew the book would be used “upon receipt” for murder.","o":["Rice v. Paladin Enterprises, Inc.","Garcia v. Character Technologies, Inc.","Counterman v. Colorado","United States v. Hansen"],"e":"From Rice v. Paladin Enterprises, Inc. (1997).","v":true},
{"c":5,"k":"name","id":"garcia","q":"Which case is this from?\nWhen owners “hand the reins” to an LLM, it is unclear that any person made an expressive choice.","o":["Garcia v. Character Technologies, Inc.","United States v. Williams","Brown v. Entertainment Merchants Association","FCC v. Pacifica Foundation"],"e":"From Garcia v. Character Technologies, Inc. (2025).","v":true},
{"c":5,"k":"det","id":"williams","q":"Which case is the source of the speech-integral-to-crime category relied on in United States v. Williams?","o":["Giboney v. Empire Storage & Ice Co.","Chaplinsky v. New Hampshire","Holder v. Humanitarian Law Project","Rice v. Paladin Enterprises, Inc."],"e":"Giboney (1949) anchors speech integral to criminal conduct; Williams also cited Pittsburgh Press.","v":false},
{"c":5,"k":"det","id":"paladin","q":"What does Rice v. Paladin Enterprises, Inc. say about news reporting?","o":["News reporting is never a basis for liability","News reporting is liable if it details crimes","News reporting must carry printed warnings","News reporting is protected only if it is accurate"],"e":"Copycat cases differ too: publishers of novels and films don’t intend to assist crime.","v":false},
{"c":5,"k":"det","id":"garcia","q":"In Garcia v. Character Technologies, Inc., why did the companies rely on users’ right to receive speech?","o":["Claiming the output as their own meant owning its liability","Companies have no First Amendment rights of their own","Users’ rights get strict scrutiny, while companies’ rights get less","Florida law recognizes only the rights of listeners"],"e":"Owning the words would also admit deliberate design, like Paladin’s stipulations, and reinforce the product-design framing.","v":false},
{"c":5,"k":"concept","id":"t-threats","q":"What is a true threat?","o":["A serious expression that the speaker means to commit unlawful violence against someone","Any statement that makes the listener fear harm, whatever the speaker meant by it","A prediction that violence will follow if a government policy isn’t changed","Words that would provoke an average listener to strike the speaker at once"],"e":"Judged by a reasonable recipient who knows the context. “True” excludes jests and hyperbole; the last choice describes fighting words.","v":false},
{"c":5,"k":"concept","id":"t-threats","q":"What mental state does Counterman require before a speaker can be punished for a true threat?","o":["Recklessness: consciously disregarding a substantial risk that the words threaten","Purpose: the speaker must want the recipient to feel threatened","Negligence: a reasonable speaker in his position would have known the words were threatening","None: a purely objective test of how a reasonable recipient reads the words"],"e":"Recklessness balances chilling against the harms of threats. Reckless speakers consciously accept a substantial risk of serious harm.","v":false},
{"c":5,"k":"concept","id":"t-threats","q":"Why require any subjective mental state for true threats?","o":["Speakers unsure of the line would self-censor protected speech","Juries can’t judge how a reasonable listener would react","The Due Process Clause requires mens rea for every crime, including speech crimes","Threats are political speech and need the most protection"],"e":"This is the chapter’s theme: breathing room for honest speakers, at the cost of letting some unprotected speech go unpunished.","v":false},
{"c":5,"k":"concept","id":"t-threats","q":"Match each doctrine to the mental state it requires.","o":["Brandenburg: intent. Counterman: recklessness. Williams: belief and intent","Brandenburg: recklessness. Counterman: intent. Williams: knowledge","Brandenburg: negligence. Counterman: intent. Williams: recklessness","Brandenburg: intent. Counterman: negligence. Williams: strict liability"],"e":"Mens rea as speech protection: the Court often forbids penalizing speech unless the speaker had a culpable mental state.","v":false},
{"c":5,"k":"concept","id":"t-threats","q":"Which of these is NOT a true threat?","o":["“I’ll kill you if you leave dirty dishes in the sink.”","Repeated messages telling a stranger to “Die,” sent from new accounts after being blocked","A note to a coworker naming a time and place to shoot him","A letter to a judge describing her home and a planned attack"],"e":"Jests and hyperbole aren’t “true.” Context (tone, audience, medium, the broader exchange) is part of the reasonable-listener test.","v":false},
{"c":5,"k":"concept","id":"t-threats","q":"Counterman produced three positions on the standard for true threats. Which pairing of standard and reason is right?","o":["Intent: incitement, the closest cousin, requires intent","Objective: online speech lacks contextual clues","Recklessness: other categories use objective tests","Objective: speakers will self-censor without a mens rea requirement"],"e":"Recklessness balances chilling against harm. The intent camp stressed online context and incitement. The objective camp said other categories use objective tests and the category is already narrow.","v":false},
{"c":5,"k":"concept","id":"t-integral","q":"Which of these is speech integral to criminal conduct?","o":["“I’ll tell you when the coast is clear.”","“Cocaine should be legal.”","“The draft is immoral, and every young man should resist it.”","“Rob the rich” on a protest sign"],"e":"Speech that is the crime, offers or solicits illegal acts, or helps commit or conceal one is unprotected. Abstract advocacy of illegality stays protected.","v":false},
{"c":5,"k":"concept","id":"t-integral","q":"Under Williams, which of these is punishable pandering?","o":["An offer to send a particular file believed to show a real child","A blog post arguing that such material should be legalized","A message saying “I encourage you to obtain it,” naming no particular item","A novel about a character who trades in such material"],"e":"“Promotes” means recommending a particular item with intent to initiate a transfer. Offers of contraband have no social value (Giboney; Pittsburgh Press).","v":false},
{"c":5,"k":"concept","id":"t-integral","q":"Under Paladin, when may a publisher be liable for aiding and abetting a crime?","o":["When it intended to assist criminals and the material was used exactly as intended","When it knew that some readers might misuse the material at some future point","When the material uses a detailed how-to format, whatever the publisher’s purpose","When it profited from sales to readers who were later convicted of crimes"],"e":"Copycat cases differ: readers misuse novels and films. Evidence of intent will almost never exist apart from stipulations like Paladin’s.","v":false},
{"c":5,"k":"concept","id":"t-integral","q":"To punish the publisher of a bomb manual without Paladin-style stipulations, what should the government prove?","o":["Specific intent to facilitate a crime, evidence beyond the text, and actual use","That the manual’s information could cause catastrophic harm if it were misused by readers","That a reasonable reader would understand the manual as a call to violence","That the publisher was reckless about how its readers would use the manual"],"e":"The manual has legitimate audiences (engineers, researchers, novelists), and Stevens bars creating new categories by balancing. [Beyond casebook: 18 U.S.C. § 842(p) takes this intent-based approach.]","v":false},
{"c":5,"k":"concept","id":"t-integral","q":"Why does it matter in Garcia whether chatbot output counts as speech?","o":["Output is protected only if it is expressive, reflecting someone’s expressive choice","Output is always speech, so the only question is which unprotected category it falls in","Output is never speech, because only human beings hold First Amendment rights","Output is speech only if a user, rather than the company, typed the prompt"],"e":"The court relied on a Moody v. NetChoice concurrence: when owners “hand the reins” to an LLM, it’s unclear anyone made an expressive choice.","v":false},
{"c":5,"k":"concept","id":"t-vague","q":"What are the two ways a law can be void for vagueness?","o":["It fails to give ordinary people fair notice, or it invites seriously discriminatory enforcement","It covers a substantial amount of protected speech compared with its legitimate sweep","It uses a word, like “promotes,” that has more than one ordinary dictionary meaning","It requires proof of a mental state, like belief, that juries find hard to determine"],"e":"Perfect clarity has never been required. Close cases are handled by the reasonable-doubt standard, not by vagueness doctrine.","v":false},
{"c":5,"k":"concept","id":"t-vague","q":"Where do vagueness and overbreadth come from?","o":["Vagueness: Due Process. Overbreadth: First Amendment","Vagueness: First Amendment. Overbreadth: Due Process","Both: the First Amendment alone","Both: the Due Process Clause, applied through the Fourteenth"],"e":"Both aim to prevent chilling. Overbreadth asserts third parties’ rights (Stevens, Hansen); vagueness mainly protects the litigant’s own.","v":false},
{"c":5,"k":"concept","id":"t-vague","q":"Which statutory term is unconstitutionally vague in the Williams sense?","o":["“Annoying” conduct","Believes the item is contraband","Intends to cause a transfer","Within 1,000 feet of a school"],"e":"Williams: vagueness is indeterminacy about what fact must be proved, not difficulty in proving it. Belief and intent are true-or-false facts.","v":false},
{"c":5,"k":"concept","id":"t-vague","q":"How do speech cases relax the usual vagueness rule?","o":["Someone clearly covered may still complain of vagueness as to others","Anyone may sue without showing that the law reaches them at all","The government must prove the law is clear beyond a reasonable doubt at trial","Courts must strike a vague term rather than read it narrowly"],"e":"Outside speech cases, a person whose own conduct is clearly covered can’t complain that the law is vague as applied to others.","v":false},
{"c":6,"k":"name","id":"bolger","q":"A federal law bans mailing unsolicited advertisements for contraceptives to people’s homes. A manufacturer that wants to mail them challenges the law.\nWhich case is this?","o":["Bolger v. Youngs Drug Products Corp.","FCC v. Pacifica Foundation","Cohen v. California","Ashcroft v. American Civil Liberties Union"],"e":"Bolger v. Youngs Drug Products Corp. (1983): The mailing ban violated the First Amendment.","v":false},
{"c":6,"k":"name","id":"cohen","q":"A man wears a jacket reading “Fuck the Draft” in a Los Angeles courthouse corridor where women and children are present. He is convicted of disturbing the peace by offensive conduct.\nWhich case is this?","o":["Cohen v. California","FCC v. Pacifica Foundation","R.A.V. v. City of St. Paul","Terminiello v. City of Chicago"],"e":"Cohen v. California (1971): Reversed: the jacket was protected speech.","v":false},
{"c":6,"k":"name","id":"pacifica","q":"A radio station airs George Carlin’s “Filthy Words” monologue at 2 p.m. A father driving with his young son complains, and the FCC issues a declaratory order finding the broadcast indecent.\nWhich case is this?","o":["FCC v. Pacifica Foundation","Cohen v. California","Bolger v. Youngs Drug Products Corp.","Ashcroft v. American Civil Liberties Union"],"e":"FCC v. Pacifica Foundation (1978): The FCC could act against the afternoon broadcast.","v":false},
{"c":6,"k":"name","id":"renton","q":"A city zoning ordinance keeps adult movie theaters away from homes, churches, parks, and schools, citing crime and falling property values near such businesses.\nWhich case is this?","o":["City of Renton v. Playtime Theatres, Inc.","New York v. Ferber","American Booksellers Ass’n v. Hudnut","Free Speech Coalition, Inc. v. Paxton"],"e":"City of Renton v. Playtime Theatres, Inc. (1986): Intermediate scrutiny; the zoning was upheld.","v":false},
{"c":6,"k":"name","id":"ferber","q":"A state criminalizes distributing material depicting sexual performances by children under 16, without requiring that the material be obscene. A bookseller is convicted for selling such films.\nWhich case is this?","o":["New York v. Ferber","Ashcroft v. Free Speech Coalition","United States v. Williams","Free Speech Coalition, Inc. v. Paxton"],"e":"New York v. Ferber (1982): Valid: it needn’t be obscene to be unprotected.","v":false},
{"c":6,"k":"name","id":"fsc","q":"A federal statute bans sexually explicit images that “appear to” depict minors, including computer-generated images and adults who look young.\nWhich case is this?","o":["Ashcroft v. Free Speech Coalition","New York v. Ferber","United States v. Williams","Ashcroft v. American Civil Liberties Union"],"e":"Ashcroft v. Free Speech Coalition (2002): The ban on virtual and look-alike images violated the First Amendment.","v":false},
{"c":6,"k":"name","id":"ashcroft2","q":"A federal law criminalizes posting material “harmful to minors” online for commercial purposes, with an affirmative defense for age verification, such as by credit card.\nWhich case is this?","o":["Ashcroft v. American Civil Liberties Union","Free Speech Coalition, Inc. v. Paxton","Ashcroft v. Free Speech Coalition","Bolger v. Youngs Drug Products Corp."],"e":"Ashcroft v. American Civil Liberties Union (2004): COPA was likely unconstitutional because filters were less restrictive.","v":false},
{"c":6,"k":"name","id":"paxton","q":"A state requires commercial websites publishing sexually explicit content to verify visitors’ ages, using government ID or transactional data.\nWhich case is this?","o":["Free Speech Coalition, Inc. v. Paxton","Ashcroft v. American Civil Liberties Union","Ashcroft v. Free Speech Coalition","Brown v. Entertainment Merchants Association"],"e":"Free Speech Coalition, Inc. v. Paxton (2025): Intermediate scrutiny applied, and the law survived.","v":false},
{"c":6,"k":"name","id":"brown","q":"A state bans selling or renting “violent video games” to minors. Video game industry groups challenge the law.\nWhich case is this?","o":["Brown v. Entertainment Merchants Association","Free Speech Coalition, Inc. v. Paxton","Ashcroft v. American Civil Liberties Union","United States v. Stevens"],"e":"Brown v. Entertainment Merchants Association (2011): The ban failed strict scrutiny; games are speech.","v":false},
{"c":6,"k":"hold","id":"bolger","q":"What did Bolger v. Youngs Drug Products Corp. hold?","o":["The mailing ban violated the First Amendment","The ban was valid to help parents control what their children see","Contraceptive ads are obscene","Mail recipients are a captive audience the government may protect"],"e":"Government “may not reduce the adult population to reading only what is fit for children.”","v":false},
{"c":6,"k":"hold","id":"cohen","q":"What did Cohen v. California hold?","o":["Reversed: the jacket was protected speech","The jacket was fighting words because it insulted onlookers","Profanity is unprotected in courthouses","The state could punish the jacket to protect the children"],"e":"Not fighting words, and profanity is protected speech. The jacket expressed the depth of his feeling about the Vietnam War.","v":false},
{"c":6,"k":"hold","id":"pacifica","q":"What did FCC v. Pacifica Foundation hold?","o":["The FCC could act against the afternoon broadcast","Indecent broadcasts are obscene and wholly unprotected","The FCC could not regulate any speech that isn’t obscene","Stations may be fined for any expletive at any hour"],"e":"A narrow nuisance rationale: time of day, content, and medium matter. Stevens, J., wrote a plurality in part.","v":false},
{"c":6,"k":"hold","id":"renton","q":"What standard did City of Renton v. Playtime Theatres, Inc. apply, and with what result?","o":["Intermediate scrutiny; the zoning was upheld","Strict scrutiny for content; the zoning was struck down","Rational basis; the zoning was upheld","Strict scrutiny for content; the zoning survived it"],"e":"The zoning targeted secondary effects, such as crime and property values, not the message.","v":false},
{"c":6,"k":"hold","id":"ferber","q":"What did New York v. Ferber hold?","o":["Valid: it needn’t be obscene to be unprotected","The ban was invalid because it didn’t track the Miller obscenity test","The ban was valid only for material lacking serious value","Distributors may be punished only if they also produced it"],"e":"Unanimous on the bottom line. The material is unprotected because of its link to abuse of real children.","v":false},
{"c":6,"k":"hold","id":"fsc","q":"What did Ashcroft v. Free Speech Coalition hold?","o":["The ban on virtual and look-alike images violated the First Amendment","Virtual images are unprotected because they resemble real abuse","The ban was valid for images that are indistinguishable from real ones","The ban was valid because it tracked the Miller obscenity test"],"e":"The CPPA went beyond Ferber, whose rationale depended on real children, and banned speech regardless of serious value.","v":false},
{"c":6,"k":"hold","id":"ashcroft2","q":"What did Ashcroft v. American Civil Liberties Union (Ashcroft II) hold?","o":["COPA was likely unconstitutional because filters were less restrictive","COPA was valid because age verification by credit card was available","COPA was valid under intermediate scrutiny as a child-protection law","Material harmful to minors is unprotected for adults as well"],"e":"Under strict scrutiny, the government offered no specific evidence COPA would work better than filters.","v":false},
{"c":6,"k":"hold","id":"paxton","q":"What did Free Speech Coalition, Inc. v. Paxton hold?","o":["Intermediate scrutiny applied, and the law survived","Strict scrutiny applied, and the law failed because filters exist","Rational basis applied because minors lack any speech rights","The law was invalid as an effective ban on adult access"],"e":"Any burden on adults is “only an incidental effect on protected speech.” Kagan, Sotomayor, and Jackson dissented.","v":false},
{"c":6,"k":"hold","id":"brown","q":"What did Brown v. Entertainment Merchants Association hold?","o":["The ban failed strict scrutiny; games are speech","Violent speech aimed at minors is a new unprotected category","The ban was valid as speech obscene for minors under Ginsberg","Video games are conduct rather than speech, so the ban stood"],"e":"Video games communicate ideas through characters, dialogue, plot, music, and interaction.","v":false},
{"c":6,"k":"name","id":"bolger","q":"Which case stands for this rule?\nGovernment can’t shield adults from offensive content outside obscenity, and it can shield kids only if adults can still get the material.","o":["Bolger v. Youngs Drug Products Corp.","Cohen v. California","Ashcroft v. American Civil Liberties Union","Brown v. Entertainment Merchants Association"],"e":"Bolger v. Youngs Drug Products Corp. (1983). Government “may not reduce the adult population to reading only what is fit for children.”","v":true},
{"c":6,"k":"name","id":"cohen","q":"Which case stands for this rule?\nThe presence of unwilling viewers doesn’t automatically justify suppressing offensive speech; they can avert their eyes.","o":["Cohen v. California","R.A.V. v. City of St. Paul","Terminiello v. City of Chicago","Bolger v. Youngs Drug Products Corp."],"e":"Cohen v. California (1971). Not fighting words, and profanity is protected speech. The jacket expressed the depth of his feeling about the Vietnam War.","v":true},
{"c":6,"k":"name","id":"pacifica","q":"Which case stands for this rule?\nGovernment may regulate a broadcast that is indecent but not obscene, because broadcasting is uniquely accessible to children; context is all-important.","o":["FCC v. Pacifica Foundation","Bolger v. Youngs Drug Products Corp.","Ashcroft v. American Civil Liberties Union","Free Speech Coalition, Inc. v. Paxton"],"e":"FCC v. Pacifica Foundation (1978). A narrow nuisance rationale: time of day, content, and medium matter. Stevens, J., wrote a plurality in part.","v":true},
{"c":6,"k":"name","id":"renton","q":"Which case stands for this rule?\nZoning that confines adult businesses gets intermediate scrutiny, though partly content-based, because it targets secondary effects rather than the message.","o":["City of Renton v. Playtime Theatres, Inc.","American Booksellers Ass’n v. Hudnut","Free Speech Coalition, Inc. v. Paxton","Bolger v. Youngs Drug Products Corp."],"e":"City of Renton v. Playtime Theatres, Inc. (1986). The zoning targeted secondary effects, such as crime and property values, not the message.","v":true},
{"c":6,"k":"name","id":"ferber","q":"Which case stands for this rule?\nChild pornography made with real children is unprotected even if not obscene, because distribution is intrinsically related to the sexual abuse of the children used to make it.","o":["New York v. Ferber","United States v. Williams","Free Speech Coalition, Inc. v. Paxton","Ashcroft v. American Civil Liberties Union"],"e":"New York v. Ferber (1982). Unanimous on the bottom line. The material is unprotected because of its link to abuse of real children.","v":true},
{"c":6,"k":"name","id":"fsc","q":"Which case stands for this rule?\nNew York v. Ferber does not extend to sexually explicit images made without real children, such as computer-generated images or youthful-looking adults.","o":["Ashcroft v. Free Speech Coalition","United States v. Williams","Ashcroft v. American Civil Liberties Union","Free Speech Coalition, Inc. v. Paxton"],"e":"Ashcroft v. Free Speech Coalition (2002). The CPPA went beyond Ferber, whose rationale depended on real children, and banned speech regardless of serious value.","v":true},
{"c":6,"k":"name","id":"ashcroft2","q":"Which case stands for this rule?\nUnder strict scrutiny, a content-based law suppressing much speech adults may receive is invalid if less restrictive alternatives would be at least as effective, and the government must prove they aren’t.","o":["Ashcroft v. American Civil Liberties Union","Ashcroft v. Free Speech Coalition","Bolger v. Youngs Drug Products Corp.","Brown v. Entertainment Merchants Association"],"e":"Ashcroft v. American Civil Liberties Union (2004). Under strict scrutiny, the government offered no specific evidence COPA would work better than filters.","v":true},

{"c":6,"k":"name","id":"brown","q":"Which case stands for this rule?\nViolent imagery is protected; there is no new unprotected category for violence, even for minors, and a content-based ban gets strict scrutiny.","o":["Brown v. Entertainment Merchants Association","Ashcroft v. American Civil Liberties Union","United States v. Stevens","Ashcroft v. Free Speech Coalition"],"e":"Brown v. Entertainment Merchants Association (2011). Video games communicate ideas through characters, dialogue, plot, music, and interaction.","v":true},
{"c":6,"k":"why","id":"bolger","q":"Why did the interest in helping parents fail in Bolger v. Youngs Drug Products Corp.?","o":["Parents already control their mail, and adults lost material","Parents have no legitimate interest in what their children read","The government offered no evidence that children ever open mail","Only amici, not the government, had raised the parental interest"],"e":"The interest was “undoubtedly substantial,” but the ban purged material “entirely suitable for adults.”","v":false},

{"c":6,"k":"why","id":"ferber","q":"What are the two links between distribution and abuse in New York v. Ferber?","o":["The material is a permanent record, and the network must be closed","The material incites viewers, and it is patently offensive","The material is obscene, and it is sold for commercial profit","The material defames the children and invades their privacy"],"e":"Production is clandestine, so drying up the market may be the only practical method of enforcement.","v":false},

{"c":6,"k":"det","id":"brown","q":"Which facts belong to Brown v. Entertainment Merchants Association?","o":["A ban on selling or renting violent video games to minors.","Texas H.B. 1181’s age-verification requirement for sexually explicit websites.","A conviction for selling dogfighting videos under a ban on depictions of animal cruelty.","A ban on mailing unsolicited contraceptive advertisements to homes."],"e":"Brown v. Entertainment Merchants Association (2011): A ban on selling or renting violent video games to minors.","v":true},

{"c":6,"k":"name","id":"ashcroft2","q":"Which case is this from?\nFilters restrict at the receiving end, need no adult identification, and criminalize no speech, so chilling is diminished.","o":["Ashcroft v. American Civil Liberties Union","Bolger v. Youngs Drug Products Corp.","Brown v. Entertainment Merchants Association","FCC v. Pacifica Foundation"],"e":"From Ashcroft v. American Civil Liberties Union (2004).","v":true},
{"c":6,"k":"name","id":"paxton","q":"Which case is this from?\nIntermediate scrutiny is “deferential but not toothless,” and stigma has never exempted the industry from regulation.","o":["Free Speech Coalition, Inc. v. Paxton","Brown v. Entertainment Merchants Association","New York v. Ferber","Bolger v. Youngs Drug Products Corp."],"e":"From Free Speech Coalition, Inc. v. Paxton (2025).","v":true},

{"c":6,"k":"det","id":"bolger","q":"Bolger v. Youngs Drug Products Corp. quoted which case for not “burning the house to roast the pig”?","o":["Butler v. Michigan","Ginsberg v. New York","Miller v. California","Jacobellis v. Ohio"],"e":"Butler v. Michigan: mailbox discourse can’t be limited to “that which would be suitable for a sandbox.”","v":false},
{"c":6,"k":"det","id":"cohen","q":"Which case is the narrow exception to Cohen v. California’s protection of profanity?","o":["FCC v. Pacifica Foundation","Bolger v. Youngs Drug Products Corp.","Miller v. California","Chaplinsky v. New Hampshire"],"e":"Pacifica allowed regulating an indecent afternoon broadcast; it “could have enlarged a child’s vocabulary in an instant,” unlike Cohen’s jacket.","v":false},
{"c":6,"k":"det","id":"pacifica","q":"What did FCC v. Pacifica Foundation leave undecided?","o":["Two-way radio, a lone expletive, or criminal prosecution","Whether the FCC may regulate broadcast indecency at any hour","Whether Carlin’s monologue was legally obscene","Whether radio broadcasting is a medium of speech"],"e":"Pacifica returns in Ch. 9 (time, place, and manner).","v":false},
{"c":6,"k":"det","id":"renton","q":"Which harms count as “secondary effects” in City of Renton v. Playtime Theatres, Inc.?","o":["Crime and lower property values","Offense to passersby on the street","Moral harm to adult patrons","Children’s exposure to the message"],"e":"The doctrine is narrow; the Court has refused to extend it beyond adult entertainment establishments.","v":false},
{"c":6,"k":"det","id":"ferber","q":"Which case refused to extend New York v. Ferber to computer-generated images?","o":["Ashcroft v. Free Speech Coalition","United States v. Williams","Free Speech Coalition, Inc. v. Paxton","Ashcroft v. American Civil Liberties Union"],"e":"Ferber’s rationale depends on protecting real children exploited in production.","v":false},
{"c":6,"k":"det","id":"fsc","q":"How does United States v. Williams fit with Ashcroft v. Free Speech Coalition?","o":["Offers believed to involve real children may be punished","Williams overruled the protection for virtual images entirely","Williams held that virtual images are obscene per se","Williams limited the case to computer-generated images"],"e":"Even a mistaken belief suffices in Williams, because it is nearly impossible to prove which images involve real children.","v":false},
{"c":6,"k":"det","id":"ashcroft2","q":"Which later case upheld age verification and arguably undercut Ashcroft v. American Civil Liberties Union (Ashcroft II)?","o":["Free Speech Coalition, Inc. v. Paxton","Ashcroft v. Free Speech Coalition","Brown v. Entertainment Merchants Association","United States v. Williams"],"e":"The filtering alternative that won in 2004 lost in 2025 because of the lower standard of review.","v":false},
{"c":6,"k":"det","id":"paxton","q":"Which 1968 case did Free Speech Coalition, Inc. v. Paxton rely on for keeping minors from speech obscene as to them?","o":["Ginsberg v. New York","Butler v. Michigan","Jacobellis v. Ohio","Reno v. American Civil Liberties Union"],"e":"Ginsberg v. New York (1968) supports the obscene-for-minors power. Reno v. ACLU (1997) applied strict scrutiny to an effective ban on adult speech.","v":false},
{"c":6,"k":"det","id":"brown","q":"How did Brown v. Entertainment Merchants Association distinguish Ginsberg v. New York?","o":["Ginsberg adjusted an existing category; California sought a new one","Ginsberg involved adult buyers, while California’s law covered minors","Ginsberg applied strict scrutiny and upheld the law regardless","Ginsberg had been overruled before the case was decided"],"e":"Obscenity covers depictions of sexual conduct, not violence.","v":false},
{"c":6,"k":"concept","id":"t-immoral","q":"What two overarching questions does the casebook ask about immoral speech?","o":["Who is protected, adults or kids? Is the harm from the content or indirect?","Is the speech political or artistic? Was it shown in a public or a private place?","Did the speaker profit? Did any listener complain to the authorities?","Is the medium old or new? Did the legislature hold hearings first?"],"e":"Indirect harm is the logic of Ferber (abuse of real children) and Renton (crime and property values).","v":false},
{"c":6,"k":"concept","id":"t-immoral","q":"When can government restrict immoral speech to protect adults from its content?","o":["Almost never; the exception is obscenity, narrowly defined","Whenever it is indecent or profane and displayed in a public place","Whenever most of the community finds it offensive","Whenever it arrives unsolicited by mail or broadcast"],"e":"Offended adults look away, walk away, or toss out the mail: “the short, though regular, journey from mail box to trash can is an acceptable burden” (Bolger).","v":false},
{"c":6,"k":"concept","id":"t-immoral","q":"What limits the government’s power to protect kids from speech?","o":["It can’t block adult access, and kids have speech rights of their own","It may restrict anything parents object to, but only inside public schools","It must prove that each restriction prevents harm to a specific child","It may restrict only speech that is also obscene for adults"],"e":"Government “may not reduce the adult population to reading only what is fit for children.” Brown: there is no “free-floating power” over the ideas children see.","v":false},
{"c":6,"k":"concept","id":"t-immoral","q":"According to Pacifica, why is broadcasting special?","o":["It reaches the home and unsupervised kids without warning, on scarce licensed spectrum","It is the most popular medium, with a larger audience than any newspaper","Stations hold government licenses, so they speak on the government’s behalf","It is live, so no court can review its content before it reaches listeners"],"e":"A nuisance rationale: “a pig in the parlor instead of the barnyard.” The FCC channels rather than bans, so the same monologue might be fine late at night.","v":false},
{"c":6,"k":"concept","id":"t-immoral","q":"What is the difference between indecent and obscene speech?","o":["Indecent speech is seen as immoral but isn’t obscene, and it is generally protected","Indecent speech is a narrow subset of obscenity that only broadcasters may air","Obscene speech is protected for adults, while indecent speech is protected only for kids","The terms became interchangeable after Pacifica for every medium of communication"],"e":"Calling speech “indecent” or “profane” generally doesn’t make it restrictable (Cohen). Pacifica is the narrow exception.","v":false},
{"c":6,"k":"concept","id":"t-immoral","q":"Why isn’t violent imagery an unprotected category, even for minors?","o":["Obscenity covers only sex, no tradition bans violence, and Stevens bars new categories","Violent games already carry industry ratings, so a ban was irrational as well as redundant","Minors have no First Amendment rights, so only their parents’ rights were at stake","Violence is political speech, so it gets more protection than sexual content"],"e":"Brown: Ginsberg adjusted an existing category for minors, while California sought a new one. Grimm’s fairy tales and the Odyssey are full of gore.","v":false},
{"c":6,"k":"concept","id":"t-obscenity","q":"What is prong (a) of the Miller test?","o":["The average person, applying community standards, finds the work as a whole appeals to the prurient interest","An expert panel, applying national standards, finds that most scenes are offensive to adults","A judge finds that any part of the work, judged on its own, appeals to a normal interest in sex","The most sensitive person in the community finds the work, taken as a whole, disgusting"],"e":"Prurient means “a shameful or morbid interest in nudity, sex, or excretion,” not a normal interest in sex (Brockett).","v":false},
{"c":6,"k":"concept","id":"t-obscenity","q":"What is prong (b) of the Miller test?","o":["It depicts, in a patently offensive way, sexual conduct specifically defined by state law","It depicts nudity or sexual conduct in a way a reasonable parent would find unsuitable for children","It describes sexual conduct that is illegal where the work was published","It portrays women as subordinate in a way that perpetuates their inequality"],"e":"The last choice is Hudnut’s ordinance, which tracked none of Miller’s elements and so fell as viewpoint discrimination.","v":false},
{"c":6,"k":"concept","id":"t-obscenity","q":"What is prong (c) of the Miller test, and why does it matter most?","o":["The work as a whole lacks serious value; it protects valuable works with explicit scenes","The work lacks any value at all; it lets juries condemn works that are mostly or entirely worthless","The author lacked serious purpose; it shields artists but not commercial sellers","The work lacks local support; it lets each town set its own standards for art"],"e":"Free Speech Coalition: “the artistic merit of a work does not depend on the presence of a single explicit scene.”","v":false},
{"c":6,"k":"concept","id":"t-obscenity","q":"How many of Miller’s three prongs must be met for speech to be obscene?","o":["All three","Any two","Any one","Prong (c) alone"],"e":"The test is narrow by design, so much deeply offensive speech stays protected. Miller remains good law.","v":false},
{"c":6,"k":"concept","id":"t-obscenity","q":"What is speech “obscene as to minors” under Ginsberg v. New York?","o":["The Miller test adjusted for minors","A new category covering any content that parents find harmful","Any sexual material that adults would also find patently offensive","Any violent or sexual material sold to someone under eighteen"],"e":"Brown distinguished Ginsberg on exactly this ground, and Paxton relied on it to uphold age verification.","v":false},
{"c":6,"k":"concept","id":"t-secondary","q":"What review do zoning laws that confine adult businesses get, and why?","o":["Intermediate, because they target secondary effects, not the message","Strict, because they single out sexual speech by its content and its message","Rational basis, because adult entertainment is unprotected","None, because zoning is a traditional local power"],"e":"Renton. The doctrine is narrow: the Court has refused to extend it beyond adult entertainment establishments.","v":false},
{"c":6,"k":"concept","id":"t-secondary","q":"Which of these is a “secondary effect” under Renton?","o":["Lower property values near adult theaters","Patrons’ offense at what the films show","Moral harm to the adults who watch","Neighbors’ disgust at the message the films convey"],"e":"Harms that flow from the message itself, like offense or moral corruption, aren’t secondary effects.","v":false},
{"c":6,"k":"concept","id":"t-secondary","q":"The casebook says Ferber’s rationale resembles secondary effects. In what way?","o":["Its harm is indirect: abuse of real children in production, not the message","It zones child pornography sellers into particular districts of a city","It applies intermediate scrutiny to bans on distribution","It requires proof of crime near the places where material is sold"],"e":"That indirect harm is why Free Speech Coalition refused to extend Ferber to virtual images made without real children.","v":false},
{"c":6,"k":"concept","id":"t-childporn","q":"Must child pornography be obscene under Miller before it can be banned?","o":["No; its link to abuse of real children is enough","Yes; all three Miller prongs must still be met","Only prong (c), lack of serious value, is needed for a ban","Yes, unless the material was made abroad"],"e":"Preventing child sexual abuse is an objective of “surpassing importance,” and the material’s value is “exceedingly modest, if not de minimis.”","v":false},
{"c":6,"k":"concept","id":"t-childporn","q":"What are Ferber’s two links between distribution and the abuse of children?","o":["A permanent record whose circulation worsens the harm, and a market that must close to stop production","A tendency to incite viewers to abuse children, and the offense the material causes the public","The material’s lack of serious value, and the presence of children in its audience","The commercial profit to sellers, and the difficulty of proving obscenity at trial"],"e":"Production is clandestine, but marketing needs a visible apparatus, so drying up the market may be the only practical enforcement.","v":false},

{"c":6,"k":"concept","id":"t-agegate","q":"What test did Paxton apply as intermediate scrutiny?","o":["Important interests unrelated to suppressing speech, burdening no more speech than necessary","A compelling interest pursued by the least restrictive means available to the state","A legitimate interest that the law rationally advances, as the Fifth Circuit held","A substantial interest, with proof that filters would be less effective than the law"],"e":"“Deferential but not toothless.” Texas wanted rational basis; the Court refused because adults’ rights are incidentally burdened.","v":false},
