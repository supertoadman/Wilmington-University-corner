    freshPerms();
  }

  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  // Strike-through toggle beside an option. It flips the option in place, so focus stays on the button.
  const STRIKE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 4H9a3 3 0 0 0-2.83 4"/><path d="M14 12a4 4 0 0 1 0 8H6"/><path d="M4 12h16"/></svg>';
  function crossBtn(opt, letter, xs, orig) {
    const x = el("button", "xo"); x.type = "button"; x.title = "Cross out";
    x.setAttribute("aria-label", "Cross out choice " + letter);
    x.setAttribute("aria-pressed", String(xs.has(orig)));
    x.innerHTML = STRIKE;
    x.onclick = () => { xs.has(orig) ? xs.delete(orig) : xs.add(orig); opt.classList.toggle("out", xs.has(orig)); x.setAttribute("aria-pressed", String(xs.has(orig))); };
    return x;
  }

  // The case's (or topic's) scene. Blurred while it would give the answer away; named once you answer.
  function figure(q, answered) {
    const f = el("figure", "fig" + (q.v && !answered ? " veil" : ""));
    const cs = CASES[q.id] || TOPICS[q.id];
    f.innerHTML = '<svg class="ill" viewBox="0 0 120 80" role="img" aria-label="' + (q.v && !answered ? "Hidden case illustration" : "Illustration for " + cs.n.replace(/"/g, "")) + '"><g>' + ILL[q.id] + '</g></svg>';
    f.appendChild(el("figcaption", null, answered ? cs.n + (cs.y ? " (" + cs.y + ")" : "") : q.v ? "The picture shows after you answer." : ""));
    return f;
  }

  function chips(host, items, get, set) {
    items.forEach(([val, label]) => {
      const b = el("button", "chip", label); b.type = "button";
      b.setAttribute("aria-pressed", String(get() === val));
      b.onclick = () => { set(val); host.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", "false")); b.setAttribute("aria-pressed", "true"); render(); };
      host.appendChild(b);
    });
  }

  function inPool(i) {
    const q = QB[i];
    return (chFilter === "all" || q.c === chFilter) && (kindFilter === "all" || q.k === kindFilter) && (caseFilter === "all" || q.id === caseFilter);
  }
  function visible(i) { return inPool(i) && !(missedOnly && !(i in answers && answers[i] !== 0)); }

  function renderCard(i, num) {
    const q = QB[i], card = el("article", "q");
    const meta = el("div", "meta");
    meta.append(el("span", null, "Q" + num), el("span", null, "Ch. " + q.c), el("span", "kind", KIND[q.k]));
    const answered = i in answers;
    const body = el("div", "qbody");
    body.append(el("p", "stem", q.q), figure(q, answered));
    const box = el("div", "opts"); box.setAttribute("role", "group");
    const xs = out[i] || (out[i] = new Set());
    perms[i].forEach((orig, pos) => {
      const b = el("button", "opt"); b.type = "button";
      b.append(el("span", "ltr", LETTERS[pos]), el("span", null, q.o[orig]));
      if (xs.has(orig)) b.classList.add("out");
      if (answered) {
        b.disabled = true;
        if (orig === 0) b.classList.add("correct");
        else if (orig === answers[i]) b.classList.add("wrong");
      }
      b.onclick = () => { answers[i] = orig; save(); card.replaceWith(renderCard(i, num)); updateScore(); };
      const row = el("div", "orow"); row.appendChild(b);
      if (!answered) row.appendChild(crossBtn(b, LETTERS[pos], xs, orig));
      box.appendChild(row);
    });
    body.appendChild(box);
    card.append(meta, body);
    if (answered) {
      const ok = answers[i] === 0, ex = el("div", "explain" + (ok ? "" : " miss"));
      const lead = el("strong", null, ok ? "Correct. " : "Not quite. The answer is " + LETTERS[perms[i].indexOf(0)] + ". ");
      ex.append(lead, document.createTextNode(q.e));
      card.appendChild(ex);
    }
    return card;
  }

  function render() {
    const list = document.getElementById("list"); list.innerHTML = "";
    let n = 0, lastCh = null;
    order.forEach(i => {
      if (!visible(i)) return;
      n++;
      if (!qShuffled && QB[i].c !== lastCh) {
        lastCh = QB[i].c;
        const h = el("h2", "chhead"); h.append(el("small", null, "Chapter " + lastCh), document.createTextNode(CH[lastCh])); list.appendChild(h);
      }
      list.appendChild(renderCard(i, n));
    });
    if (!n) list.appendChild(el("p", "empty", missedOnly ? "No missed questions in this set. Answer a few first, or turn off Show missed only." : "No questions match these filters."));
    updateScore();
  }

  function updateScore() {
    const pool = QB.map((_, i) => i).filter(inPool);
    const done = pool.filter(i => i in answers), right = done.filter(i => answers[i] === 0);
    document.getElementById("s-done").textContent = done.length;
    document.getElementById("s-total").textContent = pool.length;
    document.getElementById("s-right").textContent = right.length;
    document.getElementById("s-pct").textContent = done.length ? Math.round(100 * right.length / done.length) + "%" : "–";
    document.getElementById("s-meter").style.width = pool.length ? (100 * done.length / pool.length) + "%" : "0";
  }

  let toastT;
  function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => t.textContent = "", 2200); }

  load();
  order = QB.map((_, i) => i);
  document.getElementById("lede").textContent = N + " questions that drill all " + Object.keys(CASES).length + " cases in Chapters 1–6 by their full names and the core concepts and elements behind them: name the case from its facts, rule, or a key line, recall its holding, reasoning, and the cases around it, then work the tests, elements, and frameworks across " + Object.keys(TOPICS).length + " topics. Every question has an illustration. Click an answer to see the explanation.";

  chips(document.getElementById("f-ch"), [["all", "All"], ...Object.keys(CH).map(c => [Number(c), "Ch. " + c])], () => chFilter, v => chFilter = v);
  chips(document.getElementById("f-kind"), [["all", "All"], ...Object.entries(KIND)], () => kindFilter, v => kindFilter = v);
  const sel = document.getElementById("f-case");
  sel.append(new Option("All cases", "all"));
  const gCases = document.createElement("optgroup"), gTopics = document.createElement("optgroup");
  gCases.label = "Cases"; gTopics.label = "Concepts & elements";
  Object.entries(CASES).forEach(([id, c]) => gCases.append(new Option("Ch. " + c.ch + " · " + c.n, id)));
  Object.entries(TOPICS).forEach(([id, t]) => gTopics.append(new Option("Ch. " + t.ch + " · " + t.n, id)));
  sel.append(gCases, gTopics);
  sel.onchange = () => { caseFilter = sel.value; render(); };

  document.getElementById("b-shuf-ans").onclick = () => { freshPerms(); save(); render(); toast("Answer order shuffled."); };
  document.getElementById("b-shuf-q").onclick = e => {
    qShuffled = !qShuffled;
    order = qShuffled ? shuffle(QB.map((_, i) => i)) : QB.map((_, i) => i);
    e.currentTarget.textContent = qShuffled ? "Restore chapter order" : "Shuffle questions";
    render(); toast(qShuffled ? "Questions shuffled." : "Chapter order restored.");
  };
  document.getElementById("b-missed").onclick = e => { missedOnly = !missedOnly; e.currentTarget.setAttribute("aria-pressed", String(missedOnly)); e.currentTarget.classList.toggle("primary", missedOnly); render(); };
  document.getElementById("b-reset").onclick = () => { answers = {}; out = {}; save(); render(); toast("Answers cleared."); };

  render();
})();
</script>
