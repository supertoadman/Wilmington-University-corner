<style>
/* Layout: one reading column of question cards, each with a case illustration, under a score-and-controls bar. */
:root {
  --bg: #EDF0F4; --surface: #FFFFFF; --ink: #17202B; --muted: #586474; --line: #D3DAE3;
  --accent: #5b4b8a; --accent-soft: #ECE8F5; --on-accent: #FFFFFF;
  --ok: #1D7549; --ok-soft: #E0F1E7; --bad: #AD2A20; --bad-soft: #F8E2DF;
  --f-display: "Libre Caslon Display", "Georgia", serif;
  --f-body: "Source Serif 4", "Georgia", "Times New Roman", serif;
  --f-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", "Consolas", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F141B; --surface: #171F29; --ink: #E4E9F0; --muted: #98A4B3; --line: #2A3542;
  --accent: #b9a8ea; --accent-soft: #2A2440; --on-accent: #0F141B;
  --ok: #62C391; --ok-soft: #16301F; --bad: #F18D83; --bad-soft: #3A1D1A; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0F141B; --surface: #171F29; --ink: #E4E9F0; --muted: #98A4B3; --line: #2A3542;
  --accent: #b9a8ea; --accent-soft: #2A2440; --on-accent: #0F141B;
  --ok: #62C391; --ok-soft: #16301F; --bad: #F18D83; --bad-soft: #3A1D1A; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; }

header.top { padding-block: 32px 16px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(2rem, 6vw, 2.9rem); line-height: 1.05; margin: 6px 0 10px; text-wrap: balance; }
.lede { color: var(--muted); max-width: 60ch; margin: 0; }

.bar { border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; flex-direction: column; gap: 10px; padding-block: 12px; }
.score { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; font-variant-numeric: tabular-nums; }
.score b { font-family: var(--f-mono); font-weight: 500; font-size: 18px; }
.score span { color: var(--muted); font-size: 13px; }
.meter { flex: 1 1 140px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; align-self: center; min-width: 100px; }
.meter i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }

.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.row .lbl { font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.chip { font: 500 13px var(--f-ui); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn { font: 600 13px var(--f-ui); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn:hover, .chip:hover { border-color: var(--accent); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.toast { font-size: 13px; color: var(--ok); min-height: 1em; }

main { padding-block: 20px 60px; display: flex; flex-direction: column; gap: 14px; }
.chhead { font-family: var(--f-display); font-size: 1.5rem; margin: 18px 0 0; padding-bottom: 6px; border-bottom: 1px solid var(--line); text-wrap: balance; }
.chhead small { display: block; font-family: var(--f-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.q { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; min-width: 0; }
.q .meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .04em; color: var(--muted); margin-bottom: 8px; }
.q .meta .kind { color: var(--accent); }
.q .stem { font-family: var(--f-body); font-size: 17px; line-height: 1.5; white-space: pre-line; margin: 0 0 12px; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; text-align: left; width: 100%; font: 400 15px/1.45 var(--f-ui); color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 9px 12px; cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.opt .ltr { font-family: var(--f-mono); font-weight: 500; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-size: 12px; }
.opt:disabled { cursor: default; }
.opt.correct { border-color: var(--ok); background: var(--ok-soft); }
.opt.correct .ltr { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .ltr { background: var(--bad); border-color: var(--bad); color: var(--surface); }
/* Cross-out: the toggle beside each option strikes it through while you work the question. */
.orow { display: flex; gap: 6px; }
.orow .opt { flex: 1 1 0; min-width: 0; }
.opt.out > span:last-child { text-decoration: line-through; color: var(--muted); }
.xo { flex: none; width: 38px; display: grid; place-items: center; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 0; cursor: pointer; }
.xo:hover { border-color: var(--accent); color: var(--ink); }
.xo[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.xo svg { width: 16px; height: 16px; }
.explain { margin-top: 12px; padding: 10px 12px; border-left: 3px solid var(--ok); background: var(--bg); border-radius: 0 6px 6px 0; font-size: 14px; }
.explain.miss { border-left-color: var(--bad); }
.explain strong { font-weight: 600; }
.empty { color: var(--muted); text-align: center; padding: 40px 0; }
@media (prefers-reduced-motion: reduce) { .meter i { transition: none; } }

/* Illustrations: one scene per case or topic, drawn in the page's own colors. */
:root { --il-ink: var(--ink); --il-acc: var(--accent); --il-soft: var(--accent-soft); --il-gold: #C49A3A; --il-paper: var(--surface); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --il-gold: #D9B45A; } }
:root[data-theme="dark"] { --il-gold: #D9B45A; }
.qbody { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 4px 18px; align-items: start; }
.qbody .stem { grid-column: 1; }
.fig { grid-column: 2; grid-row: 1 / span 2; margin: 0; }
.ill { display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; fill: none; overflow: hidden; }
.ill .o { stroke: var(--il-ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ill .t { stroke: var(--il-ink); stroke-width: 1.4; stroke-linecap: round; opacity: .55; }
.ill .a { fill: var(--il-acc); } .ill .s { fill: var(--il-soft); } .ill .g { fill: var(--il-gold); } .ill .w { fill: var(--il-paper); } .ill .i { fill: var(--il-ink); }
.ill text { font: 700 9px var(--f-ui); fill: var(--il-paper); }
.ill text.dark { fill: #17202B; }
.ill .plate { font: 700 17px var(--f-mono); fill: var(--il-acc); letter-spacing: .04em; }
.ill .motto { font: 700 7px var(--f-ui); fill: var(--il-ink); letter-spacing: .08em; }
.fig figcaption { font-family: var(--f-mono); font-size: 11px; line-height: 1.35; color: var(--muted); margin-top: 6px; text-wrap: balance; }
.fig.veil .ill > g { filter: blur(7px); opacity: .45; }
.fig.veil figcaption { font-family: var(--f-ui); font-style: italic; }
.opts { grid-column: 1; }
.pick { font: 500 13px var(--f-ui); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; max-width: 100%; }
@media (max-width: 600px) {
  .qbody { grid-template-columns: minmax(0, 1fr); }
  .fig { grid-column: 1; grid-row: auto; width: 170px; margin: 0 0 4px; }
  .opts { grid-column: 1; }
}
</style>

{"c":2,"k":"name","id":"fulton","q":"A city stops referring foster children to a Catholic agency because it won’t certify same-sex couples as foster parents. The city’s contract lets the Commissioner grant exceptions in her “sole discretion.”\nWhich case is this?","o":["Fulton v. City of Philadelphia","Masterpiece Cakeshop, Ltd. v. Colorado Civil Rights Commission","Church of the Lukumi Babalu Aye, Inc. v. City of Hialeah","Employment Division, Department of Human Resources of Oregon v. Smith"],"e":"Fulton v. City of Philadelphia (2021): Not generally applicable, it failed strict scrutiny.","v":false},
{"c":2,"k":"name","id":"tandon","q":"During the pandemic, a state limits at-home gatherings, religious or secular, to three households, while hair salons, retail stores, and restaurants may hold more people.\nWhich case is this?","o":["Tandon v. Newsom","Fulton v. City of Philadelphia","Church of the Lukumi Babalu Aye, Inc. v. City of Hialeah","Employment Division, Department of Human Resources of Oregon v. Smith"],"e":"Tandon v. Newsom (2021): Strict scrutiny applied, and relief was granted.","v":false},
{"c":2,"k":"name","id":"carson","q":"A rural state pays private school tuition for families whose districts have no public high school, but only at “nonsectarian” schools. Two families choose accredited religious schools.\nWhich case is this?","o":["Carson v. Makin","Fulton v. City of Philadelphia","Mahmoud v. Taylor","Kennedy v. Bremerton School District"],"e":"Carson v. Makin (2022): Excluding religious schools violated Free Exercise.","v":false},
{"c":2,"k":"hold","id":"smith","q":"What did Employment Division, Department of Human Resources of Oregon v. Smith hold?","o":["No exemption was required from the neutral drug law","Oregon had to exempt sacramental peyote use under strict scrutiny","The drug law targeted the church and was invalid","Religious conduct is protected exactly as fully as religious belief"],"e":"Belief is absolutely protected; religious conduct is protected only from laws that target it because it is religious.","v":false},
{"c":2,"k":"hold","id":"lukumi","q":"What did Church of the Lukumi Babalu Aye, Inc. v. City of Hialeah hold?","o":["A religious gerrymander that failed strict scrutiny","The ordinances were neutral health laws, so Smith controlled","Sacrifice is belief, so it is fully protected","The city could ban sacrifice but had to compensate the church"],"e":"The exemptions showed the ordinances targeted Santeria. Beliefs need not be logical or comprehensible to others to be protected.","v":false},
{"c":2,"k":"hold","id":"masterpiece","q":"What did Masterpiece Cakeshop, Ltd. v. Colorado Civil Rights Commission hold?","o":["The Commission’s hostility violated Free Exercise, so its order fell","Bakers have a free speech right to refuse any wedding cake","Colorado’s public accommodations law was facially invalid","The couple’s equal-access interest outweighed the baker’s beliefs"],"e":"A narrow ruling: the Commission didn’t apply the law neutrally. States can generally protect equal access to goods and services.","v":false},
{"c":2,"k":"hold","id":"fulton","q":"What did Fulton v. City of Philadelphia hold?","o":["Not generally applicable, it failed strict scrutiny","Smith was overruled, so every burden now gets strict scrutiny","The city’s rule was neutral and enforceable","Foster care is government speech, so the agency had no claim"],"e":"The Commissioner’s discretion to grant exceptions lets government decide which reasons are worthy. The Court declined to overrule Smith.","v":false},
{"c":2,"k":"hold","id":"tandon","q":"What did Tandon v. Newsom hold?","o":["Strict scrutiny applied, and relief was granted","The limit was neutral because secular home gatherings were capped","Health rules get only rational basis","Religious gatherings are exempt from all pandemic restrictions"],"e":"Comparable secular activities were favored, so strict scrutiny applied. The Court granted an injunction pending appeal on an emergency application.","v":false},
{"c":2,"k":"hold","id":"carson","q":"What did Carson v. Makin hold?","o":["Excluding religious schools violated Free Exercise","Paying for religious instruction would violate the Establishment Clause","States must fund private schools too","Maine could exclude schools that use the funds for religious teaching"],"e":"Once Maine subsidized private schooling, it couldn’t exclude schools for being religious. It may keep public schools secular or fund no private schools.","v":false},
{"c":2,"k":"name","id":"smith","q":"Which case stands for this rule?\nThe Free Exercise Clause does not require exemptions from neutral, generally applicable laws that incidentally burden religion.","o":["Employment Division, Department of Human Resources of Oregon v. Smith","Fulton v. City of Philadelphia","Tandon v. Newsom","Masterpiece Cakeshop, Ltd. v. Colorado Civil Rights Commission"],"e":"Employment Division, Department of Human Resources of Oregon v. Smith (1990). Belief is absolutely protected; religious conduct is protected only from laws that target it because it is religious.","v":true},
{"c":2,"k":"name","id":"lukumi","q":"Which case stands for this rule?\nA law that burdens only religiously motivated conduct, shown by exemptions that leave comparable secular conduct untouched, is not neutral or generally applicable and fails strict scrutiny.","o":["Church of the Lukumi Babalu Aye, Inc. v. City of Hialeah","Masterpiece Cakeshop, Ltd. v. Colorado Civil Rights Commission","Fulton v. City of Philadelphia","Tandon v. Newsom"],"e":"Church of the Lukumi Babalu Aye, Inc. v. City of Hialeah (1993). The exemptions showed the ordinances targeted Santeria. Beliefs need not be logical or comprehensible to others to be protected.","v":true},
{"c":2,"k":"name","id":"masterpiece","q":"Which case stands for this rule?\nEven a neutral law must be applied neutrally; official hostility to religion, or treating a religious objection worse than comparable objections, violates Free Exercise.","o":["Masterpiece Cakeshop, Ltd. v. Colorado Civil Rights Commission","Church of the Lukumi Babalu Aye, Inc. v. City of Hialeah","Employment Division, Department of Human Resources of Oregon v. Smith","Tandon v. Newsom"],"e":"Masterpiece Cakeshop, Ltd. v. Colorado Civil Rights Commission (2018). A narrow ruling: the Commission didn’t apply the law neutrally. States can generally protect equal access to goods and services.","v":true},
{"c":2,"k":"name","id":"fulton","q":"Which case stands for this rule?\nA formal system of discretionary, individualized exemptions makes a policy not generally applicable, even if no exemption has ever been granted.","o":["Fulton v. City of Philadelphia","Church of the Lukumi Babalu Aye, Inc. v. City of Hialeah","Employment Division, Department of Human Resources of Oregon v. Smith","Tandon v. Newsom"],"e":"Fulton v. City of Philadelphia (2021). The Commissioner’s discretion to grant exceptions lets government decide which reasons are worthy. The Court declined to overrule Smith.","v":true},
{"c":2,"k":"name","id":"tandon","q":"Which case stands for this rule?\nA regulation triggers strict scrutiny whenever it treats any comparable secular activity more favorably than religious exercise, with comparability judged by risk.","o":["Tandon v. Newsom","Church of the Lukumi Babalu Aye, Inc. v. City of Hialeah","Employment Division, Department of Human Resources of Oregon v. Smith","Masterpiece Cakeshop, Ltd. v. Colorado Civil Rights Commission"],"e":"Tandon v. Newsom (2021). Comparable secular activities were favored, so strict scrutiny applied. The Court granted an injunction pending appeal on an emergency application.","v":true},
{"c":2,"k":"name","id":"carson","q":"Which case stands for this rule?\nOnce a state subsidizes private schooling, it can’t exclude schools because they are religious, even when the funds pay for religious instruction.","o":["Carson v. Makin","Mahmoud v. Taylor","Kennedy v. Bremerton School District","Tandon v. Newsom"],"e":"Carson v. Makin (2022). Once Maine subsidized private schooling, it couldn’t exclude schools for being religious. It may keep public schools secular or fund no private schools.","v":true},
{"c":2,"k":"why","id":"smith","q":"How did Employment Division, Department of Human Resources of Oregon v. Smith explain earlier religious exemptions?","o":["They were hybrid-rights cases pairing religion with another right","They involved laws that openly targeted one particular faith for burdens","They were statutory rulings rather than constitutional ones","They were wrongly decided and were overruled in Smith"],"e":"Past exemptions paired free exercise with speech or parents’ rights, as in Wisconsin v. Yoder. Support for Smith: Reynolds, Prince, Braunfeld, Gillette.","v":false},
{"c":2,"k":"why","id":"lukumi","q":"Why were the ordinances in Church of the Lukumi Babalu Aye, Inc. v. City of Hialeah underinclusive for public health?","o":["Hunters’ carcasses and restaurant garbage posed the same risks unregulated","The city offered no evidence that animal remains ever carry disease","Health is never a compelling interest when religion is burdened","The ordinances regulated only food sold to the public"],"e":"They were underinclusive for animal cruelty too: fishing, hunting, pest control, euthanasia, and research were all allowed.","v":false},
{"c":2,"k":"why","id":"masterpiece","q":"Besides the commissioners’ remarks, what showed unequal treatment in Masterpiece Cakeshop, Ltd. v. Colorado Civil Rights Commission?","o":["Bakers refusing cakes that disapproved of same-sex marriage were cleared","The Commission exempted bakeries owned by members of other faiths entirely","The baker was fined more heavily than any secular business had been","The Commission decided the case without letting the baker testify"],"e":"Comparable objections were treated as lawful, and government can’t decide which objections are “offensive” (citing Barnette).","v":false},
{"c":2,"k":"why","id":"fulton","q":"Why did the city’s equal-treatment interest fail in Fulton v. City of Philadelphia?","o":["The city’s own exemption system undermined it","Equal treatment is never a legitimate interest","The agency served too few children to matter","The city raised it too late in the litigation"],"e":"Equal treatment is weighty, but the city’s own exemptions undercut it. More foster parents (CSS adds them) and avoiding liability (speculative) failed too.","v":false},
{"c":2,"k":"why","id":"tandon","q":"Who must show that worship is riskier in Tandon v. Newsom?","o":["The state, even assuming the same precautions","The worshippers, through expert testimony","No one, because risk is irrelevant to comparing","The court, by taking judicial notice of science"],"e":"The government must show the religious activity is riskier even with the same precautions. It doesn’t matter that some secular activities are treated as badly.","v":false},
{"c":2,"k":"why","id":"carson","q":"In Carson v. Makin, why wasn’t the tuition program a “public education” benefit Maine could keep secular?","o":["The private schools could be selective and skip the state curriculum","Most students in the program attended religious schools anyway","Maine’s constitution forbade public funding of private schooling","The program paid parents directly rather than paying the schools"],"e":"Participating schools could be selective, often weren’t free, didn’t follow the state curriculum, needn’t hire certified teachers, and could be single-sex.","v":false},
{"c":2,"k":"det","id":"smith","q":"Which facts belong to Employment Division, Department of Human Resources of Oregon v. Smith?","o":["Native American Church members seeking an exemption from a drug ban for ritual peyote use.","A city bans ritual animal sacrifice through ordinances that exempt nearly every secular killing.","A three-household cap on at-home worship while salons and stores could exceed it.","Parents denied opt-outs from LGBTQ-inclusive storybooks in elementary English classes."],"e":"Employment Division, Department of Human Resources of Oregon v. Smith (1990): Native American Church members seeking an exemption from a drug ban for ritual peyote use.","v":true},
{"c":2,"k":"det","id":"lukumi","q":"Which facts belong to Church of the Lukumi Babalu Aye, Inc. v. City of Hialeah?","o":["A city bans ritual animal sacrifice through ordinances that exempt nearly every secular killing.","Native American Church members seeking an exemption from a drug ban for ritual peyote use.","A city cuts off a Catholic foster care agency that won’t certify same-sex couples.","A football coach disciplined for praying quietly at midfield after games."],"e":"Church of the Lukumi Babalu Aye, Inc. v. City of Hialeah (1993): A city bans ritual animal sacrifice through ordinances that exempt nearly every secular killing.","v":true},
{"c":2,"k":"det","id":"masterpiece","q":"Which facts belong to Masterpiece Cakeshop, Ltd. v. Colorado Civil Rights Commission?","o":["A baker’s religious refusal to make a same-sex wedding cake, met with commissioners’ open disparagement.","A city cuts off a Catholic foster care agency that won’t certify same-sex couples.","Native American Church members seeking an exemption from a drug ban for ritual peyote use.","A football coach disciplined for praying quietly at midfield after games."],"e":"Masterpiece Cakeshop, Ltd. v. Colorado Civil Rights Commission (2018): A baker’s religious refusal to make a same-sex wedding cake, met with commissioners’ open disparagement.","v":true},
{"c":2,"k":"det","id":"fulton","q":"Which facts belong to Fulton v. City of Philadelphia?","o":["A city cuts off a Catholic foster care agency that won’t certify same-sex couples.","A baker’s religious refusal to make a same-sex wedding cake, met with commissioners’ open disparagement.","Native American Church members seeking an exemption from a drug ban for ritual peyote use.","A state tuition program that pays only for “nonsectarian” private schools."],"e":"Fulton v. City of Philadelphia (2021): A city cuts off a Catholic foster care agency that won’t certify same-sex couples.","v":true},
{"c":2,"k":"det","id":"tandon","q":"Which facts belong to Tandon v. Newsom?","o":["A three-household cap on at-home worship while salons and stores could exceed it.","A city cuts off a Catholic foster care agency that won’t certify same-sex couples.","Native American Church members seeking an exemption from a drug ban for ritual peyote use.","A state tuition program that pays only for “nonsectarian” private schools."],"e":"Tandon v. Newsom (2021): A three-household cap on at-home worship while salons and stores could exceed it.","v":true},
{"c":2,"k":"det","id":"carson","q":"Which facts belong to Carson v. Makin?","o":["A state tuition program that pays only for “nonsectarian” private schools.","A city cuts off a Catholic foster care agency that won’t certify same-sex couples.","A football coach disciplined for praying quietly at midfield after games.","Native American Church members seeking an exemption from a drug ban for ritual peyote use."],"e":"Carson v. Makin (2022): A state tuition program that pays only for “nonsectarian” private schools.","v":true},
{"c":2,"k":"name","id":"smith","q":"Which case is this from?\nStrict scrutiny for every incidental burden would create “a private right to ignore generally applicable laws,” a “constitutional anomaly.”","o":["Employment Division, Department of Human Resources of Oregon v. Smith","Tandon v. Newsom","Masterpiece Cakeshop, Ltd. v. Colorado Civil Rights Commission","Mahmoud v. Taylor"],"e":"From Employment Division, Department of Human Resources of Oregon v. Smith (1990).","v":true},
{"c":2,"k":"name","id":"lukumi","q":"Which case is this from?\nThe city’s claims that secular killings were “obviously justified” were ipse dixits; society imposed on worshippers what it would not impose on itself.","o":["Church of the Lukumi Babalu Aye, Inc. v. City of Hialeah","Fulton v. City of Philadelphia","Tandon v. Newsom","Kennedy v. Bremerton School District"],"e":"From Church of the Lukumi Babalu Aye, Inc. v. City of Hialeah (1993).","v":true},
{"c":2,"k":"name","id":"masterpiece","q":"Which case is this from?\nThree bakers who refused cakes with messages disapproving of same-sex marriage were found to have acted lawfully.","o":["Masterpiece Cakeshop, Ltd. v. Colorado Civil Rights Commission","Employment Division, Department of Human Resources of Oregon v. Smith","Tandon v. Newsom","Kennedy v. Bremerton School District"],"e":"From Masterpiece Cakeshop, Ltd. v. Colorado Civil Rights Commission (2018).","v":true},
{"c":2,"k":"name","id":"fulton","q":"Which case is this from?\nThe question is not whether the government has a compelling interest generally, but whether it has one in denying an exemption to this claimant.","o":["Fulton v. City of Philadelphia","Employment Division, Department of Human Resources of Oregon v. Smith","Tandon v. Newsom","Carson v. Makin"],"e":"From Fulton v. City of Philadelphia (2021).","v":true},
{"c":2,"k":"name","id":"tandon","q":"Which case is this from?\nThe state “cannot assume the worst when people go to worship but assume the best when people go to work.”","o":["Tandon v. Newsom","Employment Division, Department of Human Resources of Oregon v. Smith","Masterpiece Cakeshop, Ltd. v. Colorado Civil Rights Commission","Carson v. Makin"],"e":"From Tandon v. Newsom (2021).","v":true},
{"c":2,"k":"name","id":"carson","q":"Which case is this from?\nAn interest in separating church and state more strictly than the federal Constitution requires is not compelling.","o":["Carson v. Makin","Kennedy v. Bremerton School District","Tandon v. Newsom","Employment Division, Department of Human Resources of Oregon v. Smith"],"e":"From Carson v. Makin (2022).","v":true},
{"c":2,"k":"det","id":"smith","q":"How did Congress respond to Employment Division, Department of Human Resources of Oregon v. Smith?","o":["It enacted RFRA, restoring strict scrutiny by statute","It proposed a constitutional amendment to overrule Smith","It exempted all sacramental drug use","It removed free exercise cases from federal jurisdiction"],"e":"RFRA (1993) requires strict scrutiny for substantial burdens. City of Boerne v. Flores (1997) held it can’t bind the states; it still binds the federal government.","v":false},
{"c":2,"k":"det","id":"lukumi","q":"Church of the Lukumi Babalu Aye, Inc. v. City of Hialeah illustrates which way a law fails neutrality?","o":["Gerrymandered exemptions","A discretionary exemption system","Hostile application","Favoring comparable secular activity"],"e":"Lukumi is the gerrymander case. Masterpiece is hostility, Fulton is discretionary exemptions, and Tandon is favoring comparable secular activity.","v":false},
{"c":2,"k":"det","id":"masterpiece","q":"What tension did Masterpiece Cakeshop, Ltd. v. Colorado Civil Rights Commission leave unresolved?","o":["Antidiscrimination law versus the First Amendment","The Free Exercise Clause versus the Establishment Clause","Federal versus state power over marriage","Commercial speech versus political speech"],"e":"The Court decided on hostility alone and left the broader conflict between public accommodations law and the First Amendment open. Ginsburg and Sotomayor dissented.","v":false},
{"c":2,"k":"det","id":"fulton","q":"What did Fulton v. City of Philadelphia decline to do?","o":["Overrule Smith’s rule for neutral, generally applicable laws","Apply strict scrutiny to the city’s referral policy","Treat an unused exemption power as relevant to general applicability","Reach the agency’s Free Exercise claim on the merits"],"e":"Fulton decided the case within Smith’s framework. An unused power to grant exemptions still counts.","v":false},
{"c":2,"k":"det","id":"tandon","q":"What did the dissent in Tandon v. Newsom say was the right comparator?","o":["Secular at-home gatherings, which were treated identically","Retail stores, which the state treated even more strictly than homes","Churches in other states with looser pandemic rules","Outdoor protests, which were not limited at all"],"e":"Kagan’s dissent compared at-home secular gatherings, not salons (“apples and watermelons”), and said the record showed homes are riskier.","v":false},
{"c":2,"k":"det","id":"carson","q":"Which two cases complete the funding trilogy with Carson v. Makin?","o":["Trinity Lutheran Church of Columbia, Inc. v. Comer and Espinoza v. Montana Department of Revenue","Zelman v. Simmons-Harris and Oklahoma Statewide Charter School Board v. Drummond","Lemon v. Kurtzman and Employment Division, Department of Human Resources of Oregon v. Smith","Kennedy v. Bremerton School District and Church of the Lukumi Babalu Aye, Inc. v. City of Hialeah"],"e":"Trinity Lutheran (2017), Espinoza (2020), and Carson (2022) require including religious entities in generally available benefits. Drummond (2025) split 4-4 on religious charter schools.","v":false},
{"c":2,"k":"concept","id":"t-freeex","q":"What is the first question on the Free Exercise checklist?","o":["Is a sincere religious practice burdened?","Is the religion’s belief logical and widely shared?","Did the statute mention religion in its text?","Is the practice central to the religion’s worship?"],"e":"Beliefs need not be acceptable, logical, consistent, or comprehensible to others (Lukumi). Sincerity is what counts.","v":false},
{"c":2,"k":"concept","id":"t-freeex","q":"Under Smith, what does a neutral, generally applicable law that incidentally burdens religion get?","o":["No exemption; it is valid without strict scrutiny","Strict scrutiny, applied to the requested exemption","Intermediate scrutiny, as with zoning for secondary effects","A balancing test weighing the burden on worship"],"e":"Strict scrutiny for every incidental burden would create “a private right to ignore generally applicable laws.” Congress answered with RFRA.","v":false},
{"c":2,"k":"concept","id":"t-freeex","q":"What are the elements of strict scrutiny in a Free Exercise case?","o":["An interest of the highest order, narrowly tailored, judged as to this claimant","A legitimate interest, rationally related, judged against the law as a whole","An important interest, substantially related, judged across all religions","A compelling interest, pursued by any reasonable means, judged at enactment"],"e":"Fulton framed it as whether the government has a compelling interest in denying this claimant an exemption. The government almost always loses.","v":false},
{"c":2,"k":"concept","id":"t-freeex","q":"Smith explained earlier exemption cases as “hybrid rights” cases. What did it mean?","o":["Free exercise plus another right, like speech or parents’ control of education","The claimant practiced two religions at once, so the burden on belief was doubled","The law regulated religious belief and religious conduct at the same time","Both the federal and the state constitution protected the same practice"],"e":"Yoder paired religion with parental rights, and Barnette was really a speech case. Mahmoud’s Wrinkle 1 grows out of Yoder.","v":false},
{"c":2,"k":"concept","id":"t-freeex","q":"Even with a neutral law, which of these may government never do?","o":["Impose special disabilities based on religious status","Ban a drug that one religion uses in its central rituals","Require all businesses to close on Sundays","Enforce child labor laws against a religious group"],"e":"Smith’s list: no regulating belief, compelling affirmation, punishing doctrines as false, status-based disabilities, or taking sides in religious disputes. The other choices track Smith, Braunfeld, and Prince, where neutral laws were enforced.","v":false},
{"c":2,"k":"concept","id":"t-freeex","q":"A state bans killing animals outside licensed slaughterhouses. Licenses go to anyone who meets fixed sanitary rules, with no exceptions. A church wants to sacrifice animals in its rituals. What result?","o":["No exemption: the law is neutral and generally applicable","Strict scrutiny under Lukumi, because the law burdens a ritual","Strict scrutiny under Fulton, because licensing is discretionary","Rational basis, but only after a finding that the belief is sincere"],"e":"Lukumi failed because its ordinances exempted fishing, hunting, pest control, and euthanasia. An across-the-board rule with fixed criteria looks like Smith’s drug ban.","v":false},
{"c":2,"k":"concept","id":"t-neutral","q":"A city’s animal-killing ban exempts fishing, hunting, pest control, and euthanasia, but not ritual sacrifice. Which way of failing neutrality is this?","o":["Gerrymandered exemptions","Hostility in application","A discretionary exemption system","Exclusion from a public benefit"],"e":"Lukumi. Society imposed on Santeria worshippers what it would not impose on itself; the law was underinclusive for both animal cruelty and public health.","v":false},
{"c":2,"k":"concept","id":"t-neutral","q":"An official has “sole discretion” to waive a policy but has never granted a waiver. Under Fulton, what follows?","o":["The policy isn’t generally applicable; the unused power still counts","The policy stays generally applicable until a waiver is actually granted","The claimant must apply for and be denied a waiver before suing","Only a waiver granted to a secular applicant would trigger scrutiny"],"e":"A formal system of individualized exemptions invites the government to decide which reasons for not complying are worthy.","v":false},
{"c":2,"k":"concept","id":"t-neutral","q":"Under Tandon, how does a court decide whether a secular activity is “comparable” to religious exercise?","o":["By the risk each poses to the government’s interest","By whether each activity takes place in a private home","By how many people each activity typically involves","By whether the legislature named both in the same order"],"e":"The government must show the religious activity is riskier even with the same precautions. The dissent’s comparator was at-home secular gatherings, treated identically.","v":false},
{"c":2,"k":"concept","id":"t-neutral","q":"Under Tandon, what happens if one comparable secular activity is treated better than worship, while others are treated just as badly?","o":["Strict scrutiny applies","Rational basis applies, since most are treated alike","The court averages the treatment of all activities","Intermediate scrutiny applies, as for incidental burdens"],"e":"It doesn’t matter that some secular activities are treated as badly. The state “cannot assume the worst when people go to worship but assume the best when people go to work.”","v":false},
{"c":2,"k":"concept","id":"t-neutral","q":"How can a law that is neutral on its face still violate the Free Exercise Clause, as in Masterpiece Cakeshop?","o":["Through hostile application, such as officials disparaging the religious objection","Through its legislative history, if any of its sponsors held religious views","Through disparate effects, if religious objectors are fined more often","Through its age, if it was enacted before the religion reached the state"],"e":"Two signs in Masterpiece: commissioners likened religious justification to defenses of slavery and the Holocaust, and three bakers who refused cakes with anti-same-sex-marriage messages were treated better.","v":false},
{"c":2,"k":"concept","id":"t-neutral","q":"Under the funding cases, when does excluding religious entities from a public benefit trigger strict scrutiny?","o":["When they are excluded solely because of their religious character","Only when the benefit is a tax credit rather than a direct cash grant","Only when the excluded entity is a church rather than a school","Only when the money would pay for secular uses, like playgrounds"],"e":"Carson went past Trinity Lutheran (a playground grant): the exclusion fails even when the money pays for religious instruction.","v":false},
{"c":2,"k":"concept","id":"t-neutral","q":"Which of these does NOT, by itself, make a law fail neutrality or general applicability?","o":["It burdens one religion’s ritual more heavily than other faiths","It exempts comparable secular conduct but not the religious conduct","The officials applying it openly disparage the claimant’s faith","Its enforcer may grant individualized exemptions at will"],"e":"A disparate incidental burden is exactly Smith: the drug ban fell hardest on the Native American Church, yet no exemption was required.","v":false},
{"c":2,"k":"concept","id":"t-neutral","q":"Which way of failing neutrality does Kennedy v. Bremerton School District illustrate?","o":["An admitted religious motive","Gerrymandered exemptions for secular speech","A discretionary system of individual waivers","Exclusion from a generally available benefit"],"e":"The district admitted acting partly because the prayer was religious. Its Establishment Clause defense failed because quiet private prayer wasn’t coercion.","v":false},
{"c":2,"k":"concept","id":"t-wrinkles","q":"What is Wrinkle 1 in the Free Exercise framework?","o":["Strict scrutiny for laws interfering with parents’ religious upbringing of children","Strict scrutiny for any law that burdens worship services held inside a private home","Rational basis for laws that burden religious schools, since attendance is a choice","An automatic exemption from any curriculum a parent finds offensive to the family’s religious faith"],"e":"Yoder and Mahmoud. Smith had grounded Yoder in an unenumerated parental right; wary of such rights after Dobbs, Mahmoud said little about the doctrinal basis.","v":false},
{"c":2,"k":"concept","id":"t-wrinkles","q":"What is Wrinkle 2 in the Free Exercise framework?","o":["Government may disfavor religion only when needed to avoid an Establishment Clause violation","Government may disfavor religion whenever its own state constitution demands stricter separation","Government may favor religion only through tax exemptions that are open to all charities","Government may fund religious schools only after a court approves the program in advance"],"e":"Carson: an interest in separating church and state more strictly than the federal Constitution requires is not compelling.","v":false},
{"c":2,"k":"concept","id":"t-wrinkles","q":"Apart from the Yoder-type burden, why did the sex-ed opt-out matter in Mahmoud?","o":["It undercut general applicability and the board’s claim that opt-outs were unworkable","It proved that the board had acted out of open hostility toward the parents’ faiths","It showed that the storybooks were legally part of the state-mandated sex-education unit","It meant the parents had waived their claim by using a different opt-out first"],"e":"The board’s administrability problems were, the Court said, of its own design. It also couldn’t cure stigma by stigmatizing religious students.","v":false},
{"c":2,"k":"concept","id":"t-estab","q":"Which of these is broadly agreed to violate the Establishment Clause?","o":["Giving tax exemptions only to religious entities","Including religious schools in a neutral voucher program","Opening a legislative session with a short prayer","Keeping a decades-old Ten Commandments monument"],"e":"The agreed core: no official religion, coerced belief, religion-only benefits, favoring a sect, or indoctrination in public schools. Legislative prayer and old monuments survive on history (Van Orden).","v":false},
{"c":2,"k":"concept","id":"t-estab","q":"Why are public schools policed most strictly under the Establishment Clause?","o":["They are uniquely coercive and children are impressionable","They receive more public money than any other institution","They are run by elected boards rather than by legislatures","They were the setting of the founding-era establishment fights"],"e":"Engel (nonmandatory prayer), Schempp (Bible reading), Wallace (moment of silence for prayer). Individual religious expression at school is still protected (Kennedy).","v":false},
{"c":2,"k":"concept","id":"t-estab","q":"Under Zelman, when may public money reach religious schools?","o":["When it flows through parents’ genuine, independent private choice","Only when it pays for secular subjects like math, science, and reading","Only when religious schools are a minority of eligible schools","Only when the program serves students with disabilities"],"e":"That is “permitted inclusion.” The trilogy moved to “required inclusion”: once the state subsidizes, it can’t exclude religious schools.","v":false},
{"c":2,"k":"concept","id":"t-estab","q":"What does the funding trilogy (Trinity Lutheran, Espinoza, Carson) require of a state?","o":["If it subsidizes private entities, it can’t exclude religious ones for being religious","It must fund private religious schools whenever its public schools are inadequate","It may exclude religious entities so long as its own constitution requires that","It must give religious schools the same curriculum as its own public schools"],"e":"The escape valve: the state may end the program instead, keep its public schools strictly secular, or not fund private education at all.","v":false},
{"c":2,"k":"concept","id":"t-estab","q":"“Play in the joints” had two meanings. Which one survives today?","o":["Government may accommodate religion beyond what Free Exercise requires","Government may decline to fund religion to avoid Establishment concerns","Government may prefer one faith if it accommodates all the others too","Government may exclude religion from benefits it isn’t required to give"],"e":"Concept #1 is alive (RFRA, RLUIPA, Cutter). Concept #2 is in retreat; the trilogy rejected it.","v":false},
{"c":2,"k":"concept","id":"t-estab","q":"Which approach to the Establishment Clause did Kennedy adopt?","o":["History and tradition, with coercion as a core concern","Lemon’s three prongs: purpose, effect, and entanglement","Endorsement: whether a reasonable observer sees approval","Strict separation: no public money or space for religion"],"e":"Kennedy abandoned Lemon and the endorsement test. Coercion takes more than visible religious exercise by a public employee.","v":false},
{"c":2,"k":"concept","id":"t-estab","q":"Why do religious charter schools pose a dilemma?","o":["If charters are public, religious ones violate the Establishment Clause; if private, excluding them violates Free Exercise","If charters are private, religious ones violate the Establishment Clause; if public, they need no state approval at all","Charters take federal money, so RFRA rather than the Constitution decides which religious schools may open","Charters can’t be religious under federal law, so the issue reaches the Court only on statutory grounds"],"e":"Drummond (2025) split 4-4, leaving in place the state ruling against St. Isidore’s charter. Expect the issue to return.","v":false},
{"c":2,"k":"concept","id":"t-rfra","q":"What does the Religious Freedom Restoration Act do?","o":["Requires strict scrutiny for substantial burdens on religion, even from neutral laws","Overrules Smith as a matter of constitutional law, binding every level of government","Bars religious exemptions from federal laws unless Congress lists them","Applies rational basis to religious burdens but requires advance notice"],"e":"RFRA (1993) was Congress’s response to Smith. It is a statute, not constitutional law, so Congress can carve exceptions from it.","v":false},
{"c":2,"k":"concept","id":"t-rfra","q":"After City of Boerne v. Flores, whom does RFRA bind?","o":["Only the federal government","Only state and local governments","All governments, federal and state","Only employers with fifty or more workers"],"e":"Boerne held RFRA exceeded Congress’s power as to states and localities. RLUIPA, narrower (land use and institutionalized persons), binds states and was upheld in Cutter.","v":false},
{"c":2,"k":"concept","id":"t-rfra","q":"What limit did Cutter v. Wilkinson place on religious accommodation?","o":["Courts must weigh the burdens it imposes on nonbeneficiaries","Accommodation is allowed only where Free Exercise requires it","Accommodation must extend equally to secular moral objections","Accommodation is limited to prisons and may not reach land use"],"e":"Cutter warned that “at some point, accommodation may devolve into an unlawful fostering of religion.” Hobby Lobby shows the third-party costs.","v":false},
{"c":2,"k":"concept","id":"t-rfra","q":"What does Burwell v. Hobby Lobby illustrate about religious accommodation?","o":["Its costs can fall on third parties, like employees who lose coverage","It extends only to individual believers, never to for-profit corporations","It must come from the Constitution itself rather than from a statute","It covers burdens on worship services but not on running a business"],"e":"RFRA exempted closely held for-profit corporations from the contraceptive mandate. Hobby Lobby alone had 10,000 employees who lost coverage.","v":false},
{"c":3,"k":"name","id":"wooley","q":"A state requires its motto “Live Free or Die” on passenger license plates and makes covering it a crime. A Jehovah’s Witness couple tapes over the motto and is fined.\nWhich case is this?","o":["Wooley v. Maynard","West Virginia State Board of Education v. Barnette","Collin v. Smith","American Booksellers Ass’n v. Hudnut"],"e":"Wooley v. Maynard (1977): The state couldn’t punish drivers for covering the motto.","v":false},
{"c":3,"k":"name","id":"collin","q":"A Nazi party plans a 30-minute sidewalk march, with uniforms and placards, in a village home to thousands of Holocaust survivors. The village passes ordinances to block it.\nWhich case is this?","o":["Collin v. Smith","American Booksellers Ass’n v. Hudnut","Terminiello v. City of Chicago","R.A.V. v. City of St. Paul"],"e":"Collin v. Smith (1978): The ordinances blocking the march were unconstitutional.","v":false},
{"c":3,"k":"name","id":"hudnut","q":"A city bans sexually explicit material depicting women as subordinate, for example as enjoying humiliation, regardless of literary or political value. Explicit material treating women as equals stays legal.\nWhich case is this?","o":["American Booksellers Ass’n v. Hudnut","Collin v. Smith","United States v. Stevens","City of Renton v. Playtime Theatres, Inc."],"e":"American Booksellers Ass’n v. Hudnut (1985): It was unconstitutional viewpoint discrimination.","v":false},
{"c":3,"k":"name","id":"stevens","q":"A federal law criminalizes selling depictions of animals being intentionally maimed, tortured, or killed, aimed at “crush videos.” A man is convicted for selling dogfighting videos.\nWhich case is this?","o":["United States v. Stevens","United States v. Alvarez","United States v. Hansen","Brown v. Entertainment Merchants Association"],"e":"United States v. Stevens (2010): The ban was substantially overbroad and facially invalid.","v":false},
{"c":3,"k":"name","id":"alvarez","q":"At a public water-district meeting, a newly elected official falsely claims he received the Medal of Honor. He seeks no money or benefit, but he is prosecuted under the Stolen Valor Act.\nWhich case is this?","o":["United States v. Alvarez","United States v. Stevens","United States v. Hansen","Wooley v. Maynard"],"e":"United States v. Alvarez (2012): The Stolen Valor Act was unconstitutional.","v":false},
{"c":3,"k":"name","id":"hansen","q":"A man defrauds noncitizens with a fake “adult adoption” path to citizenship and is convicted under a law barring “encouraging or inducing” illegal immigration. He argues it is overbroad because it reaches advocacy.\nWhich case is this?","o":["United States v. Hansen","United States v. Stevens","United States v. Williams","United States v. Alvarez"],"e":"United States v. Hansen (2023): The encourage-or-induce law was not facially overbroad.","v":false},
{"c":3,"k":"hold","id":"wooley","q":"What did Wooley v. Maynard hold?","o":["The state couldn’t punish drivers for covering the motto","The motto was government speech drivers had to display","Drivers could cover it only for a religious objection","The rule was valid as a vehicle identification measure for police"],"e":"No one can be made a courier for the state’s ideological message on private property. Passive display counts.","v":false},
{"c":3,"k":"hold","id":"collin","q":"What did Collin v. Smith hold?","o":["The ordinances blocking the march were unconstitutional","The march could be banned as fighting words aimed at survivors","The survivors were a captive audience the village could protect","The march had to avoid residential streets"],"e":"The ordinances were content-based, not time, place, or manner rules: the village objected to who was marching.","v":false},
{"c":3,"k":"hold","id":"hudnut","q":"What did American Booksellers Ass’n v. Hudnut hold?","o":["It was unconstitutional viewpoint discrimination","The material was obscene, so the ban stood","The city failed to show that the material caused any harm","The ordinance was a valid zoning rule for adult businesses"],"e":"Material treating women as equals was lawful; material treating them as subordinate was banned regardless of value. That is viewpoint discrimination.","v":false},
{"c":3,"k":"hold","id":"stevens","q":"What did United States v. Stevens hold?","o":["The ban was substantially overbroad and facially invalid","Depictions of animal cruelty are a new unprotected category","The law was valid as applied to the dogfighting videos","The law survived because of its serious-value exception"],"e":"Read by its text, the law reached hunting videos; lawful applications dwarfed the crush and dogfight market.","v":false},
{"c":3,"k":"hold","id":"alvarez","q":"What did United States v. Alvarez hold?","o":["The Stolen Valor Act was unconstitutional","False statements of fact are always unprotected","The Act was valid to protect the Medal’s integrity","The Act was valid as applied to public meetings"],"e":"There is no general falsity exception. Unprotected falsehoods, like defamation and fraud, involve legally cognizable harm.","v":false},
{"c":3,"k":"hold","id":"hansen","q":"What did United States v. Hansen hold?","o":["The encourage-or-induce law was not facially overbroad","The law was overbroad because it reached political advocacy","The law was void for vagueness under the Due Process Clause","Hansen’s scheme was protected speech about immigration"],"e":"Read as criminal-law terms of art, the law covers only intentional solicitation and facilitation of specific unlawful acts.","v":false},
{"c":3,"k":"name","id":"wooley","q":"Which case stands for this rule?\nThe state may not require a person to display its ideological message on private property for the public to see; the rights to speak and not to speak are complementary.","o":["Wooley v. Maynard","Collin v. Smith","American Booksellers Ass’n v. Hudnut","Cohen v. California"],"e":"Wooley v. Maynard (1977). No one can be made a courier for the state’s ideological message on private property. Passive display counts.","v":true},
{"c":3,"k":"name","id":"collin","q":"Which case stands for this rule?\nGovernment may not ban a peaceful demonstration because of its message, even one that deeply offends or traumatizes listeners.","o":["Collin v. Smith","Terminiello v. City of Chicago","R.A.V. v. City of St. Paul","Cohen v. California"],"e":"Collin v. Smith (1978). The ordinances were content-based, not time, place, or manner rules: the village objected to who was marching.","v":true},
{"c":3,"k":"name","id":"hudnut","q":"Which case stands for this rule?\nGovernment may not favor one viewpoint and silence the other, even when it is right that the disfavored speech causes real social harm.","o":["American Booksellers Ass’n v. Hudnut","United States v. Stevens","City of Renton v. Playtime Theatres, Inc.","New York v. Ferber"],"e":"American Booksellers Ass’n v. Hudnut (1985). Material treating women as equals was lawful; material treating them as subordinate was banned regardless of value. That is viewpoint discrimination.","v":true},
{"c":3,"k":"name","id":"stevens","q":"Which case stands for this rule?\nContent-based restrictions are presumptively invalid unless the speech falls in a historically unprotected category, and courts may not create new categories by balancing value against costs.","o":["United States v. Stevens","United States v. Hansen","Brown v. Entertainment Merchants Association","New York v. Ferber"],"e":"United States v. Stevens (2010). Read by its text, the law reached hunting videos; lawful applications dwarfed the crush and dogfight market.","v":true},
{"c":3,"k":"name","id":"alvarez","q":"Which case stands for this rule?\nThere is no general First Amendment exception for false statements; a content-based ban on lies must be “actually necessary,” and the remedy for false speech is true speech.","o":["United States v. Alvarez","United States v. Hansen","Wooley v. Maynard","Counterman v. Colorado"],"e":"United States v. Alvarez (2012). There is no general falsity exception. Unprotected falsehoods, like defamation and fraud, involve legally cognizable harm.","v":true},
{"c":3,"k":"name","id":"hansen","q":"Which case stands for this rule?\nA law is facially overbroad only if it prohibits a substantial amount of protected speech relative to its plainly legitimate sweep: realistic applications and a lopsided ratio.","o":["United States v. Hansen","United States v. Williams","United States v. Alvarez","Rice v. Paladin Enterprises, Inc."],"e":"United States v. Hansen (2023). Read as criminal-law terms of art, the law covers only intentional solicitation and facilitation of specific unlawful acts.","v":true},
{"c":3,"k":"why","id":"wooley","q":"Why did vehicle identification fail to justify the motto requirement in Wooley v. Maynard?","o":["Plate numbers already identify cars, so it wasn’t narrowly tailored","Identifying vehicles is not a legitimate interest of the state","Police had stopped using license plates to identify cars","The state admitted it never used the motto for anything"],"e":"Plate numbers do the identifying. Promoting state pride is an ideological interest that can’t outweigh the right not to be its courier.","v":false},
{"c":3,"k":"why","id":"collin","q":"Why did Collin v. Smith reject the village’s captive-audience argument?","o":["Residents could avoid Village Hall for the half hour","Captive-audience protection covers only schoolchildren","The march was scheduled for an early weekend morning","The village had never passed a formal noise ordinance"],"e":"Listener protection is limited to intrusions into the home or a truly captive audience.","v":false},
{"c":3,"k":"why","id":"hudnut","q":"How did American Booksellers Ass’n v. Hudnut treat the claim that such material perpetuates subordination?","o":["It accepted the harm, which only showed the power of speech","It rejected the claim as unsupported by any evidence","It held that harm to women isn’t a legitimate interest","It sent the question back for a jury to decide on remand"],"e":"The court accepted the premise; that only shows speech’s power, as with Hitler, communism, religion, and television.","v":false},
{"c":3,"k":"why","id":"stevens","q":"Why didn’t the government’s promise to prosecute only “extreme” cruelty save the law in United States v. Stevens?","o":["Courts won’t uphold a law based on promised prosecutorial restraint","The government had already prosecuted sellers of hunting videos","The promise was made only in the lower courts, not the Supreme Court","Extreme cruelty is itself a fully protected subject of speech"],"e":"The First Amendment doesn’t leave us “at the mercy of noblesse oblige.” Alito dissented, reading the statute narrowly.","v":false},
{"c":3,"k":"why","id":"alvarez","q":"In United States v. Alvarez, what showed that counterspeech worked?","o":["Alvarez was exposed and ridiculed for the lie","A court ordered a retraction","The water district voted to remove Alvarez from office","Veterans’ groups won a defamation suit against Alvarez"],"e":"Counterspeech exposed him: the marketplace of ideas (Holmes, Abrams). There was also no evidence the lie diluted the Medal.","v":false},
{"c":3,"k":"why","id":"hansen","q":"How did United States v. Hansen read “encourage or induce”?","o":["As terms of art for intentional solicitation and facilitation","In their ordinary sense, reaching general public advocacy of all kinds","As limited to speech made for commercial profit","As covering only statements to government officials"],"e":"Constitutional avoidance: adopt any fairly possible constitutional reading, though the canon can’t override clear text.","v":false},
{"c":3,"k":"det","id":"wooley","q":"Which facts belong to Wooley v. Maynard?","o":["Drivers fined for covering “Live Free or Die” on their license plates.","Jehovah’s Witness children expelled for refusing a mandatory flag salute and Pledge.","A city ordinance banning explicit material that depicts women as subordinate.","A prosecution for falsely claiming the Medal of Honor at a public meeting."],"e":"Wooley v. Maynard (1977): Drivers fined for covering “Live Free or Die” on their license plates.","v":true},
{"c":3,"k":"det","id":"collin","q":"Which facts belong to Collin v. Smith?","o":["A village blocks a Nazi march planned where thousands of Holocaust survivors live.","A city ordinance banning explicit material that depicts women as subordinate.","A cross burned in a Black family’s yard, charged under a bias-based fighting-words ordinance.","A filmed Klan rally prosecuted under Ohio’s criminal syndicalism law."],"e":"Collin v. Smith (1978): A village blocks a Nazi march planned where thousands of Holocaust survivors live.","v":true},
{"c":3,"k":"det","id":"hudnut","q":"Which facts belong to American Booksellers Ass’n v. Hudnut?","o":["A city ordinance banning explicit material that depicts women as subordinate.","A village blocks a Nazi march planned where thousands of Holocaust survivors live.","Zoning that confines adult movie theaters to limited areas of a city.","A prosecution for falsely claiming the Medal of Honor at a public meeting."],"e":"American Booksellers Ass’n v. Hudnut (1985): A city ordinance banning explicit material that depicts women as subordinate.","v":true},
{"c":3,"k":"det","id":"stevens","q":"Which facts belong to United States v. Stevens?","o":["A conviction for selling dogfighting videos under a ban on depictions of animal cruelty.","A prosecution for falsely claiming the Medal of Honor at a public meeting.","A ban on selling or renting violent video games to minors.","A city ordinance banning explicit material that depicts women as subordinate."],"e":"United States v. Stevens (2010): A conviction for selling dogfighting videos under a ban on depictions of animal cruelty.","v":true},
{"c":3,"k":"det","id":"alvarez","q":"Which facts belong to United States v. Alvarez?","o":["A prosecution for falsely claiming the Medal of Honor at a public meeting.","A conviction for selling dogfighting videos under a ban on depictions of animal cruelty.","Drivers fined for covering “Live Free or Die” on their license plates.","A challenge to the federal ban on pandering or soliciting child pornography."],"e":"United States v. Alvarez (2012): A prosecution for falsely claiming the Medal of Honor at a public meeting.","v":true},
{"c":3,"k":"det","id":"hansen","q":"Which facts belong to United States v. Hansen?","o":["An “adult adoption” fraud prosecuted under a ban on encouraging or inducing illegal immigration.","A conviction for selling dogfighting videos under a ban on depictions of animal cruelty.","A prosecution for falsely claiming the Medal of Honor at a public meeting.","Hundreds of unwanted Facebook messages to a musician, prosecuted under an objective-test stalking law."],"e":"United States v. Hansen (2023): An “adult adoption” fraud prosecuted under a ban on encouraging or inducing illegal immigration.","v":true},
{"c":3,"k":"name","id":"wooley","q":"Which case is this from?\nFootnote 15 distinguishes “In God We Trust” on currency, which is carried privately and isn’t associated with its bearer.","o":["Wooley v. Maynard","American Booksellers Ass’n v. Hudnut","Cohen v. California","United States v. Alvarez"],"e":"From Wooley v. Maynard (1977).","v":true},
{"c":3,"k":"name","id":"collin","q":"Which case is this from?\nJudges may not engage in “ideological tyranny” any more than legislators; protecting unpopular minorities distinguishes the U.S. from the Third Reich.","o":["Collin v. Smith","R.A.V. v. City of St. Paul","Cohen v. California","Brandenburg v. Ohio"],"e":"From Collin v. Smith (1978).","v":true},
{"c":3,"k":"name","id":"hudnut","q":"Which case is this from?\nOtherwise government becomes “the great censor and director of which thoughts are good for us.”","o":["American Booksellers Ass’n v. Hudnut","City of Renton v. Playtime Theatres, Inc.","New York v. Ferber","United States v. Alvarez"],"e":"From American Booksellers Ass’n v. Hudnut (1985).","v":true},
{"c":3,"k":"name","id":"stevens","q":"Which case is this from?\nThe government’s “categorical balancing” test is “startling and dangerous,” and we aren’t left “at the mercy of noblesse oblige.”","o":["United States v. Stevens","Brown v. Entertainment Merchants Association","New York v. Ferber","American Booksellers Ass’n v. Hudnut"],"e":"From United States v. Stevens (2010).","v":true},
{"c":3,"k":"name","id":"alvarez","q":"Which case is this from?\nThe law targeted “falsity and nothing more” and reached lies anywhere, even whispered at home.","o":["United States v. Alvarez","Wooley v. Maynard","Counterman v. Colorado","United States v. Williams"],"e":"From United States v. Alvarez (2012).","v":true},
{"c":3,"k":"name","id":"hansen","q":"Which case is this from?\nOverbreadth is “strong medicine,” and courts seek harmony, not “constitutional collision.”","o":["United States v. Hansen","United States v. Alvarez","Rice v. Paladin Enterprises, Inc.","Counterman v. Colorado"],"e":"From United States v. Hansen (2023).","v":true},
{"c":3,"k":"det","id":"wooley","q":"Which compelled-speech case did Wooley v. Maynard extend from flag salutes to passive display?","o":["West Virginia State Board of Education v. Barnette","Kennedy v. Bremerton School District","Minersville School District v. Gobitis","Employment Division, Department of Human Resources of Oregon v. Smith"],"e":"Carrying a motto is less than saluting a flag, but the difference is “one of degree”; the car becomes a “mobile billboard.”","v":false},
{"c":3,"k":"det","id":"collin","q":"Which case did Collin v. Smith rely on for the idea that speech stirring anger serves a high purpose?","o":["Terminiello v. City of Chicago","Brandenburg v. Ohio","American Booksellers Ass’n v. Hudnut","R.A.V. v. City of St. Paul"],"e":"Psychic trauma is indistinguishable from speech that stirs anger (Terminiello); debate must be “uninhibited, robust, and wide-open” (New York Times Co. v. Sullivan).","v":false},
{"c":3,"k":"det","id":"hudnut","q":"Which test did the ordinance in American Booksellers Ass’n v. Hudnut ignore?","o":["Miller v. California’s obscenity test","Brandenburg v. Ohio’s incitement test","Renton’s secondary-effects test","Counterman v. Colorado’s recklessness test"],"e":"No prurient interest, community standards, work-as-a-whole, or value inquiry. Its drafters saw those omissions as virtues; the court saw viewpoint discrimination.","v":false},
{"c":3,"k":"det","id":"stevens","q":"What did United States v. Stevens leave open?","o":["A statute limited to crush videos or extreme cruelty","Whether videos count as speech under the First Amendment","Whether overbreadth doctrine applies to federal statutes","Whether hunting videos are speech"],"e":"Stevens left open a narrower statute. Congress’s 2010 crush-video law was limited to obscene videos.","v":false},
{"c":3,"k":"det","id":"alvarez","q":"What standard did Breyer and Kagan apply in United States v. Alvarez?","o":["Intermediate scrutiny, concurring in the judgment","Strict scrutiny, joining the plurality opinion","Rational basis review, in dissent","Exacting scrutiny, writing for a majority of the Court"],"e":"A plurality’s reasoning usually isn’t binding; “concurring in the judgment” means agreeing only with the result. Alito, Scalia, and Thomas dissented.","v":false},
{"c":3,"k":"det","id":"hansen","q":"How does United States v. Hansen contrast with United States v. Stevens?","o":["Stevens used ordinary meaning; Hansen read terms of art","Stevens applied vagueness; Hansen applied strict scrutiny","Stevens involved a state law; Hansen a federal one","Stevens upheld its statute; Hansen struck its statute"],"e":"Stevens: ordinary meaning, realistic protected applications, facially invalid. Hansen: terms of art, fanciful concerns, upheld. Ordinary facial challenges need no valid applications (Salerno).","v":false},
{"c":3,"k":"concept","id":"t-speech","q":"Which is the best statement of what counts as “speech” under the First Amendment?","o":["Words, images, and symbolic acts like armbands, flags, and picketing","Spoken and written words, with all conduct left to the states","Words and images, plus conduct only when it is used at an organized protest","Political words and images, but not entertainment like games"],"e":"Barnette treated the salute as “a form of utterance,” Collin treated uniforms and marching as speech, and Brown treated video games as speech.","v":false},
{"c":3,"k":"concept","id":"t-speech","q":"Why does the Court prefer bright-line rules over balancing standards in speech cases?","o":["Distrust: officials can’t be trusted to sort valuable speech from harmful speech","Efficiency: bright lines are cheaper for trial courts to administer quickly","Text: the First Amendment is phrased in absolute terms the Court must follow","Deference: legislatures can draft precise rules that courts can enforce"],"e":"The same distrust explains why false, heinous, and harmful speech is often protected, and why the Court refuses to add unprotected categories.","v":false},
{"c":3,"k":"concept","id":"t-speech","q":"What is “chilling,” and which doctrines counter it?","o":["Self-censorship from fear of liability; overbreadth and mens rea requirements","Delay in granting parade permits; the presumption against prior restraints on speech","Listeners tuning out offensive speech; the captive-audience doctrine","Speakers lying to avoid prosecution; the rule against false statements"],"e":"Counterman’s recklessness requirement and Stevens’s overbreadth holding both rest on the fear of chilling honest speakers.","v":false},
{"c":3,"k":"concept","id":"t-speech","q":"What is the right order for the first four steps of the speech checklist?","o":["Government action, speech, compelled speech, content-based or neutral","Content-based or viewpoint-based, government action, speech, compelled speech","Speech, unprotected category, government action, strict scrutiny","Strict scrutiny, unprotected category, government action, speech"],"e":"Next: does it fall in a narrowly defined historical category? If not and it’s content-based, strict scrutiny. Facial attacks (overbreadth, vagueness) come last.","v":false},
{"c":3,"k":"concept","id":"t-speech","q":"At the strict-scrutiny step of the speech checklist, what must the government show?","o":["A compelling interest, a law “actually necessary” to it, and the least restrictive means","A substantial interest, a reasonable fit, and ample alternative channels for the same speech","A legitimate interest and some rational connection between the law and that interest","An important interest unrelated to suppressing speech, burdening no more than needed"],"e":"Counterspeech is often the less restrictive alternative (Alvarez). The last two choices describe rational basis and intermediate scrutiny.","v":false},
{"c":3,"k":"concept","id":"t-compelled","q":"What is the main exception to the near-ban on compelled speech?","o":["Compelled commercial disclosures, like nutrition labels","Patriotic exercises for public school students","State mottos on government-issued property, like license plates","Statements of belief by public employees"],"e":"The right to speak includes the right not to speak. Compelled commercial disclosures (nutrition labels, drug side effects) are Ch. 8 material.","v":false},
{"c":3,"k":"concept","id":"t-compelled","q":"Why is “In God We Trust” on currency treated differently from “Live Free or Die” on a license plate?","o":["Currency is carried privately and isn’t associated with the bearer","Currency carries a religious motto that the Establishment Clause allows","The currency motto was adopted by Congress rather than a state legislature","No one has ever been prosecuted for covering the motto on money"],"e":"Wooley’s footnote 15. Circuits have upheld the currency motto (Newdow v. Peterson).","v":false},
{"c":3,"k":"concept","id":"t-compelled","q":"Does it matter to a compelled-speech claim that most people approve of the message?","o":["No; majority approval is irrelevant","Yes; popular messages may be compelled after a public vote","Yes; only messages most people reject are protected","No, but only because the objectors were religious"],"e":"Barnette: fundamental rights “depend on the outcome of no elections.” Wooley’s plaintiffs were Jehovah’s Witnesses, but its speech rationale protects any objector.","v":false},
{"c":3,"k":"concept","id":"t-compelled","q":"Why did Wooley treat passively displaying a motto like reciting a pledge?","o":["The difference is one of degree; the car becomes a mobile billboard","Displaying a motto is more intrusive than saying it aloud once","The motto was religious, so the Free Exercise Clause applied","Drivers had no other practical way to identify their vehicles on the road"],"e":"Driving is a virtual necessity, so the state forced drivers to carry its ideological message. Plate numbers already serve identification, so that interest wasn’t narrowly tailored.","v":false},
{"c":3,"k":"concept","id":"t-content","q":"Classify this rule: “No speeches about sports teams in the park.”","o":["Content-based: strict scrutiny","Viewpoint-based: per se invalid","Content-neutral: intermediate scrutiny","Unprotected category: rational basis"],"e":"It turns on subject matter but not on side. Banning only pro-legalization publications would be viewpoint-based, the worst form.","v":false},
{"c":3,"k":"concept","id":"t-content","q":"Classify this rule: “No amplified speeches between 10 p.m. and 6 a.m.”","o":["Content-neutral: intermediate scrutiny","Content-based: strict scrutiny","Viewpoint-based: strict scrutiny","Prior restraint: heavy presumption of invalidity"],"e":"Time, place, and manner rules come in Ch. 9. Collin rejected the TPM label because the village objected to who was marching, not when or where.","v":false},
{"c":3,"k":"concept","id":"t-content","q":"A state rejects the vanity plate “FCANCER” while allowing other vanity plates. What kind of restriction is this?","o":["Viewpoint-based, the worst form of content regulation","Content-neutral, because every vanity plate is screened","A permissible ban within the fighting-words category","A valid ban on profanity, which is unprotected speech"],"e":"The cancer survivor won in district court in 2024. Calling speech profane doesn’t make it restrictable (Cohen).","v":false},
{"c":3,"k":"concept","id":"t-content","q":"Under Collin, when may government protect listeners from offensive speech?","o":["Only for intrusions into the home or on a truly captive audience","Whenever the speech causes listeners measurable psychic trauma or distress","Whenever most of the community finds the message hateful","Whenever the speech targets a religious or ethnic minority"],"e":"Skokie residents could avoid Village Hall for half an hour. Psychic trauma is indistinguishable from speech that stirs anger, a high purpose of speech (Terminiello).","v":false},
{"c":3,"k":"concept","id":"t-content","q":"Hudnut accepted that the banned depictions perpetuate women’s subordination. Why did the ordinance still fail?","o":["Harm through ideas only shows speech’s power; government can’t pick a side","The harm was speculative, so the city failed the compelling-interest prong of strict scrutiny","The ordinance was drafted by activists, not by the city’s own legislature","The harm fell on adults, and only harm to children can justify a ban"],"e":"Otherwise government becomes “the great censor.” Because it ignored Miller’s elements, it couldn’t be saved as an obscenity law either.","v":false},
{"c":3,"k":"concept","id":"t-content","q":"What level of review applies to each kind of speech restriction?","o":["Strict for content- and viewpoint-based laws; intermediate for content-neutral; rational basis inside unprotected categories","Strict for viewpoint-based laws only; intermediate for content-based; rational basis for content-neutral laws","Strict for every speech restriction; intermediate only for commercial speech; rational basis for none","Strict for prior restraints only; intermediate for content-based laws; rational basis for all other laws"],"e":"Content-based laws are presumptively invalid. R.A.V. still limits regulation inside a category: no topic or viewpoint subsets.","v":false},
{"c":3,"k":"concept","id":"t-categories","q":"Which of these is NOT a historically unprotected category of speech?","o":["Depictions of animal cruelty","Speech integral to criminal conduct","True threats","Fighting words"],"e":"Stevens refused to add it, and Alvarez refused to add false statements as such. The list: incitement, fighting words, grave and imminent threats, true threats, speech integral to crime, child pornography, obscenity, defamation, and fraud.","v":false},
{"c":3,"k":"concept","id":"t-categories","q":"May courts create a new unprotected category by weighing a kind of speech’s value against its social costs?","o":["No; Stevens called that test startling and dangerous","Yes, if the speech’s value is shown to be de minimis or nearly so","Yes, but only for speech directed at minors","No; only Congress may add categories, by statute"],"e":"Describing unprotected speech as “low-value” is descriptive, not a test; the First Amendment already reflects the people’s cost-benefit judgment. Brown applied this to violence for minors.","v":false},
{"c":3,"k":"concept","id":"t-categories","q":"Why is there no general First Amendment exception for false statements?","o":["Cases calling falsehood valueless involved legally cognizable harm, like fraud","False statements always carry literary or political value worth protecting","The Framers protected lies expressly in the debates over the Bill of Rights","Only the states, not Congress, may punish lies, and the states haven’t tried"],"e":"Alvarez: the Stolen Valor Act targeted “falsity and nothing more.” Upholding it would let government list subjects about which lies are crimes.","v":false},
{"c":3,"k":"concept","id":"t-categories","q":"If speech falls within an unprotected category, what review does a ban on it get?","o":["Rational basis, subject to R.A.V.’s bar on singling out subsets","Strict scrutiny, because the ban is still content-based on its face","Intermediate scrutiny, as with secondary-effects zoning","None, because the category is invisible to the Constitution"],"e":"R.A.V.: categories aren’t “invisible to the Constitution.” Government may ban libel, but not only libel critical of the government.","v":false},
{"c":3,"k":"concept","id":"t-categories","q":"Match the category to its key case: speech integral to criminal conduct.","o":["Giboney v. Empire Storage & Ice Co.","Chaplinsky v. New Hampshire","Watts v. United States","Miller v. California"],"e":"Chaplinsky is fighting words, Watts is true threats, and Miller is obscenity. Williams and Paladin build on Giboney.","v":false},
{"c":3,"k":"concept","id":"t-overbreadth","q":"What must a challenger show to win an overbreadth claim?","o":["The law reaches a substantial amount of protected speech relative to its legitimate sweep","The law has at least one protected application, whether realistic or merely hypothetical","The law has no valid applications at all, as in an ordinary facial challenge","The law uses terms that fail to give a person of ordinary intelligence fair notice"],"e":"Hansen: the unconstitutional applications must be realistic and the ratio lopsided. Overbreadth is “strong medicine.”","v":false},
{"c":3,"k":"concept","id":"t-overbreadth","q":"What is unusual about who may bring an overbreadth challenge?","o":["A litigant whose own speech is unprotected may assert others’ rights","Only a litigant whose own speech is protected may bring the claim","Only the government may raise it, to narrow its own statute","Only a speaker who has already been prosecuted under the statute may sue"],"e":"Justified by chilling: people the law covers might self-censor instead of suing. It also invalidates a law that has lawful applications.","v":false},
{"c":3,"k":"concept","id":"t-overbreadth","q":"Before declaring a statute overbroad, what must a court do first?","o":["Construe it, adopting any fairly possible constitutional reading","Sever every clause that could ever reach protected speech","Give the legislature a chance to amend the statute before ruling on it","Find that the defendant’s own speech was protected"],"e":"Constitutional avoidance (Ashwander). The canon can’t override clear text, which is why Stevens read § 48 by its ordinary meaning.","v":false},
{"c":3,"k":"concept","id":"t-overbreadth","q":"Why was § 48 struck down in Stevens while the statute in Hansen was upheld?","o":["Stevens’s protected uses were realistic and many; Hansen’s were fanciful once narrowed","Stevens involved a federal law, while Hansen involved a state law with a severability clause","Stevens’s own speech was protected, while Hansen’s own speech was unprotected fraud","Stevens applied strict scrutiny, while Hansen applied only intermediate scrutiny"],"e":"Hunting videos made § 48’s ratio lopsided. Reading “encourage or induce” as solicitation and facilitation excluded advocacy, leaving only fanciful concerns.","v":false},
{"c":3,"k":"concept","id":"t-overbreadth","q":"What does an ordinary facial challenge (outside overbreadth) require?","o":["No valid applications (Salerno)","A substantial number of invalid applications","One invalid application to the litigant","Proof that the law chills some speech"],"e":"Overbreadth relaxes Salerno for speech cases, because waiting for as-applied challenges would let the law chill speech in the meantime.","v":false},
{"c":4,"k":"name","id":"terminiello","q":"A suspended priest gives a hate-filled speech to a packed auditorium while protesters gather outside. The jury is told breach of the peace includes speech that “stirs the public to anger” or “invites dispute.”\nWhich case is this?","o":["Terminiello v. City of Chicago","Brandenburg v. Ohio","Cohen v. California","Collin v. Smith"],"e":"Terminiello v. City of Chicago (1949): The conviction was reversed because the instruction reached protected speech.","v":false},
{"c":4,"k":"name","id":"brandenburg","q":"A KKK leader invites a reporter to film a farm rally. Hooded figures, some armed, burn a cross; he warns of possible “revengeance” and announces a march on Congress. He is convicted under a criminal syndicalism law.\nWhich case is this?","o":["Brandenburg v. Ohio","Terminiello v. City of Chicago","Whitney v. California","Counterman v. Colorado"],"e":"Brandenburg v. Ohio (1969): Ohio’s criminal syndicalism law was unconstitutional.","v":false},
