{"t": "hum", "q": "Lawyer Ortega is having a sexual relationship with a client that began during the representation. She knows it violates the Rules but tells herself it's harmless because she is doing excellent work on the client's case. What best explains her rationalization?", "a": ["Cognitive dissonance: a good person who did something bad adopts a reconciling justification.", "Diffusion of responsibility: she assumes that someone else in the firm will raise the issue.", "Social conformity: other lawyers she knows have similar relationships with their clients.", "Obedience to authority: the client is the one directing the course of the relationship."], "e": "Cognitive dissonance drives good people to justify bad acts rather than admit them, and the next transgression comes easier (compare Perkins and Gellene). Competent work never excuses a 1.8(j) violation, and client consent doesn't cure it.", "r": "Outline II-B; MR 1.8(j); [S1:118–119]"},
{"t": "hum", "q": "During trial prep, a partner tells an associate: 'If our witness doesn't shade her testimony a little, we lose. You want to win, don't you? This is just about telling our story effectively.' Which strategy is the partner using?", "a": ["Ethical fading or framing: recasting the choice so its ethical dimension drops out.", "Cognitive dissonance: justifying a past wrong in order to preserve a good self-image.", "Diffusion of responsibility: spreading the blame across every member of the trial team.", "Social conformity: pressure to match what peers on the team appear to be doing."], "e": "Ethical fading reframes a decision (here as 'winning' or 'telling our story') so the ethical problem, coaching false testimony (3.3(a)(3), 3.4(b)), recedes. Weasel words and euphemisms ('shade,' 'borrowing,' 'technically') are warning signs.", "r": "Outline II-B; [S1:73, 120]"},
{"t": "hum", "q": "In a deposition, Lawyer Brock repeatedly insults opposing counsel, mocks the witness's accent, and makes speaking objections intended only to rattle the witness. Brock argues that he owes his client 'zealous' representation. Which statement best reflects the Rules?", "a": ["Diligence doesn't require offensive tactics, and means with no purpose but to embarrass or burden are barred.", "Zealous advocacy permits any tactic that a court order has not specifically prohibited.", "Brock's conduct is proper because a deposition is not a proceeding before a tribunal, so courtesy obligations do not apply.", "Brock's conduct is improper only if the witness being questioned was unrepresented by counsel."], "e": "Rule 1.3 cmt [1]: a lawyer isn't bound to press for every advantage, and diligence doesn't require offensive tactics or preclude courtesy and respect. Rule 4.4(a) bars means that have no substantial purpose other than to embarrass, delay, or burden a third person. Courts are increasingly impatient with incivility (Lasalle v. Vogel). 8.4(g) may also apply.", "r": "MR 1.3 cmt [1], 4.4(a); Outline II-B"},
{"t": "hum", "q": "First-year associate Cruz spends 10 hours on a motion and records 10 hours. Her assigned mentor, a senior associate, tells her firm practice is to 'round up' and that she should record 15 hours, which the client will be billed. What should Cruz do?", "a": ["Record the time she actually spent, because she is personally responsible for not misrepresenting her time.", "Record 15 hours, because a subordinate may rely on the direction of a more experienced lawyer.", "Record 15 hours, because her mentor is not a partner and so cannot be violating any Rule.", "Record 12.5 hours as a reasonable compromise between the actual time spent and the firm's stated rounding practice."], "e": "Billing for work not done is fraud (8.4(c)) and produces an unreasonable fee (1.5(a)). Rule 5.2(a) means following a mentor's direction is no defense, and padding isn't an 'arguable question.' Record time contemporaneously in tenths. Cruz should also raise the practice with a responsible partner.", "r": "MR 5.2(a), 8.4(c), 1.5(a); Outline II-B; [S1:72, 114–115]"},
{"t": "hum", "q": "Associate Vu realizes she let a statute of limitations run on a client's claim. In what order should she ordinarily report the error?", "a": ["Supervisor, then firm counsel, then (through the firm) the carrier, and the client promptly after that.", "The client first and then no one else, because the client's interests always come first.", "The malpractice carrier only, because insurers forbid any other disclosure of the error.", "The disciplinary authority first, because self-reporting of a known error is mandatory before anyone else is told."], "e": "'When you mess up, 'fess up' to the right people in the right order. Many malpractice policies require notice before any admission of liability, and firm counsel can advise privileged. Disclosure to the client is mandatory for a material error (Op. 18-481) and mustn't be delayed by that internal process. There's no general duty to self-report to the bar.", "r": "Outline II-C, IV-D; [S4:32]"},
{"t": "hum", "q": "Lawyer Kim worries that her supervising partner is directing her to do something unethical. The partner is the only senior lawyer on the matter. Which is NOT a proper source of help that the course identified?", "a": ["Opposing counsel, who can tell her whether the partner's instruction is acceptable practice.", "The firm's designated ethics partner or general counsel, who can advise her on the firm's behalf.", "The bar's or her malpractice insurer's ethics hotline.", "Her own lawyer, to whom she may disclose what is reasonably necessary to get advice."], "e": "Places to go: the supervisor (unless she's the problem), the firm's ethics czar, bar or insurer hotlines, and your own lawyer. Rule 1.6(b)(4) permits disclosure reasonably necessary to get advice about your own compliance. Consulting opposing counsel would breach confidentiality and loyalty.", "r": "Outline II-C; MR 1.6(b)(4); [S1:74–75]"},
{"t": "hum", "q": "Which is NOT a commonly cited benefit of promptly owning up to a mistake in practice?", "a": ["It immunizes the lawyer from civil liability for the mistake.", "You may find that the mistake has no real consequences for the client or the matter.", "You may find that there was no mistake at all.", "You may find that the mistake can be fixed."], "e": "Early disclosure lets others help: the mistake may be harmless, may not be a mistake, or may be fixable. Concealment turns an error into a cover-up, with discipline, punitive damages, and sometimes criminal exposure (Perkins, Gellene). Confession doesn't immunize anyone from liability.", "r": "Outline II-C; [S1:121]"},
{"t": "hum", "q": "Which of the following is NOT a common warning sign of depression or anxiety, as distinguished in the course materials?", "a": ["Recurring flashbacks in which the person relives a traumatic event.", "Significant changes in sleep patterns.", "Significant changes in eating patterns.", "Difficulty concentrating and making even routine decisions."], "e": "Changes in sleep, appetite, and decision-making are common warning signs of depression and anxiety. Flashbacks are characteristic of post-traumatic stress disorder, not depression or anxiety as such. When warning signs appear, get help: student services, EAPs, or LAPs.", "r": "Outline II-D; [S1:122]"},
{"t": "hum", "q": "Lawyer Ellis, struggling with alcohol, calls her state's Lawyer Assistance Program, enrolls in treatment, and complies fully. She fears the LAP will report her to the disciplinary authority. Is her fear well founded?", "a": ["Generally no, because LAP help is confidential and typically not reported while she complies with treatment.", "Yes, because LAPs are required to report every lawyer who contacts them to disciplinary counsel.", "Yes, because Rule 8.3 requires anyone who learns of another lawyer's impairment to report it to the disciplinary authority.", "No, but only because she was careful to call the program anonymously at the start."], "e": "LAPs are designed to be confidential so impaired lawyers will seek help, and 8.3(c) exempts LAP information from the reporting duty. Compliance with treatment generally keeps the matter out of the disciplinary system.", "r": "Outline II-D; MR 8.3(c); [S1:123–124]"},
{"t": "hum", "q": "A bar applicant has received treatment for anxiety and is currently taking medication. The character-and-fitness questionnaire asks about conditions that currently impair the ability to practice. Her condition is well controlled. Which advice is best?", "a": ["Answer truthfully about her current functioning; responsible treatment is not itself a ground for denial.", "Disclose nothing about mental health, because questions about it are always unlawful.", "Disclose every past diagnosis, because any history of treatment disqualifies an applicant unless explained.", "Decline to answer, because applicants may refuse any question that they consider to be intrusive."], "e": "Responsibly seeking treatment isn't a ground for denial, and the focus is current fitness. Candor is paramount (8.1). Lying or refusing to answer a lawful question is worse than the underlying fact.", "r": "Outline I-B, II-D; [S1:76]"},
{"t": "rel", "q": "A prospective client with a viable employment claim is rude to Lawyer Ames's receptionist and brags that he has 'fired four lawyers already.' Ames, who has capacity and no conflict, declines the case without explanation. No court has appointed Ames. Is Ames subject to discipline?", "a": ["No, because absent an appointment or an unlawful reason, a lawyer may decline for almost any reason.", "Yes, because a lawyer with capacity and no conflict must accept any meritorious matter within her competence.", "Yes, because a lawyer who declines a matter must explain her reasons to the prospective client in writing.", "No, but only because the prospective client has already been represented by several prior lawyers."], "e": "Lawyers are generally free to decline. Rudeness to staff and serial lawyer-changing are classic intake red flags. The limits are court appointments (6.2) and unlawful reasons such as invidious discrimination. A Togstad-safe declination is still wise.", "r": "Outline III-A; [W2:30–34]"},
{"t": "rel", "q": "A court appoints Lawyer Bose to represent an indigent defendant charged with a notorious hate crime. Bose finds the alleged conduct personally distasteful, but he believes he could represent the defendant competently. He asks to be excused. Is Bose likely to be excused?", "a": ["No, because distaste is not good cause unless the repugnance would likely impair the representation.", "Yes, because any lawyer may decline an appointment involving a client or cause he personally finds distasteful.", "Yes, because appointed counsel have no professional obligation to accept criminal matters from the court.", "No, because a lawyer who has been appointed by a court may never seek to be excused for any reason."], "e": "Rule 6.2: don't seek to avoid an appointment except for good cause: (a) it would violate the Rules or law; (b) it would impose an unreasonable financial burden; or (c) the client or cause is so repugnant it would likely impair the relationship or the lawyer's ability to represent. Bose says he could represent competently, so (c) isn't met. Representation isn't endorsement (1.2(b)).", "r": "MR 6.2; Outline III-A"},
{"t": "rel", "q": "A prospective client asks Lawyer Cho to form several shell companies in different countries and open accounts for them. He refuses to identify the source of the funds or why he needs the entities, saying 'that's not your concern.' Under the 2023 amendments to Rule 1.16, what must Cho do?", "a": ["Inquire and assess; if he persists in seeking her services for a crime or fraud after their discussion, she must decline.", "Proceed, because a lawyer may presume a client's purposes are lawful unless she has actual knowledge that he intends a crime or fraud.", "Report the client to law enforcement immediately, because the facts strongly suggest money laundering.", "Proceed, so long as she personally avoids handling or transferring any of the client's funds."], "e": "Amended 1.16(a) requires a lawyer to inquire into and assess the facts and circumstances of each representation (ABA Op. 513: risk-based, proportional, and repeated when circumstances change). New 1.16(a)(4) mandates declining or withdrawing if the client seeks to use, or persists in using, the lawyer's services for crime or fraud despite the 1.2(d)/1.4(a)(5) discussion. Op. 491's 'high probability' standard and conscious avoidance are relevant. There's no duty to report to police.", "r": "MR 1.16(a), (a)(4); ABA Ops. 491, 513; Outline III-A"},
{"t": "rel", "q": "Tenant Diaz emails Lawyer Evans: 'My eviction hearing is in three weeks. Please handle it, and here are my lease and the notice.' Evans reads the email and the documents but never replies. Diaz does nothing further, believing Evans is on it. Diaz is evicted after no one appears. Did an attorney-client relationship arise?", "a": ["Likely yes, because Evans failed to manifest lack of consent while he should have known Diaz was relying on him.", "No, because Evans never expressly agreed to represent Diaz in the eviction proceeding.", "No, because no fee was ever discussed and no engagement letter was signed by either party.", "No, because an attorney-client relationship cannot be formed through an exchange of email alone, without a meeting or signed agreement."], "e": "Restatement § 14(1)(b): a relationship arises when the person manifests intent that the lawyer provide services and the lawyer fails to manifest lack of consent while knowing or having reason to know the person reasonably relies on the lawyer. Silence can be consent. Fees and engagement letters aren't required, so 'use your words.'", "r": "Restatement § 14; Outline III-B"},
{"t": "rel", "q": "Lawyer Fong meets with prospective client Gale, who slipped outside a federal building about 21 months ago. Fong takes notes and says, 'I'll look into it and send you a retainer agreement.' He never sends it, runs no conflict check, and forgets the matter. Gale assumes Fong is handling it. The deadline to file an administrative claim passes. Is Fong exposed to malpractice liability?", "a": ["Yes, if an objective observer would find that Gale reasonably relied on Fong to act as her lawyer.", "No, because no retainer agreement was ever signed, so no attorney-client relationship came into being.", "No, because Fong never ran a conflict check, which is a precondition to forming any relationship.", "Yes, but only if Gale paid Fong an initial consultation fee at the meeting about her claim."], "e": "Formation turns on the client's actual and reasonable belief, judged objectively, not on paperwork. Saying 'I'll look into it' and then going silent invites reliance. If Fong wanted no relationship until a retainer was signed, he had to say so clearly. Missing an administrative-claim deadline (e.g., FTCA) is classic negligence.", "r": "Restatement § 14; Outline III-B; [S2:71–73]"},
{"t": "rel", "q": "A court appoints Lawyer Hart to represent an indigent defendant at arraignment. Hart sends the defendant his standard retainer agreement and skips the arraignment because the defendant hasn't returned it. Hart later argues he had no attorney-client relationship. Is he correct?", "a": ["No, because a court appointment always creates the relationship, with no fee or signed agreement needed.", "Yes, because attorney-client relationships are contractual and require the client's acceptance of the lawyer's terms.", "Yes, because appointed counsel does not become counsel of record until the client consents in writing.", "No, but only because Hart had already met with the defendant before the arraignment date."], "e": "Restatement § 14(2): a relationship arises when a tribunal with power to do so appoints the lawyer. No contract or fee is required. Skipping the arraignment would also violate 1.1 and 1.3 and 1.16(c) (an appointed lawyer can't simply walk away).", "r": "Restatement § 14(2); Outline III-B; [S2:69–70]"},
{"t": "rel", "q": "Last year Lawyer Ivy represented Jo in a personal-injury case that settled and was dismissed. Ivy sent Jo a closing letter. This week Jo calls: 'I want to update my will to deal with the settlement. Does your firm do estate planning?' What is Jo's status at the moment of the call?", "a": ["A former client as to the injury case and a prospective client as to estate planning.", "A current client, because anyone the firm has ever represented remains a current client of the firm.", "Only a former client, because no new attorney-client relationship has yet been formed for the will.", "Neither, because the injury case is closed and no fee for the estate work has been discussed."], "e": "Client status is matter by matter. The closed, disengaged injury case makes Jo a former client (1.9). Consulting about a new matter makes her a prospective client (1.18) as to estate planning. A person can be current, former, and prospective at once as to different matters.", "r": "Outline III-B; [S3:53–55]"},
{"t": "rel", "q": "Lawyer Kane advised Landlord Lee on land-use regulations eight months ago and billed him. Two months ago Lee called with a follow-up question; Kane answered and billed again. No engagement or disengagement letter defines the relationship. Today a neighbor asks Kane's firm to sue Lee in an unrelated property-line dispute. May the firm take the case without Lee's consent?", "a": ["No, because Lee is likely a current client in an open-ended relationship, so suing him needs consent.", "Yes, because the land-use advice is unrelated, so only the former-client conflict rule applies here.", "Yes, because eight months have passed since the main work was done, ending the relationship.", "Yes, so long as the firm screens Kane from any involvement in the new property-line matter."], "e": "Open-ended consulting relationships are never 'completed.' Recent contact, recent bills, and no disengagement letter mean Lee is probably a current client, and direct adversity to a current client in any matter is a 1.7(a)(1) conflict requiring informed consent confirmed in writing. A disengagement letter would have turned Lee into a former client.", "r": "MR 1.7(a)(1); Outline III-B, IX; [S2:93]"},
{"t": "rel", "q": "At a neighbor's party, Lawyer Maya (not a family lawyer) chats with a guest who describes his divorce, complains about his lawyer, and asks what she thinks of specific advice his lawyer gave. Maya asks several follow-up questions and offers her view on each item. When he says he wants to switch lawyers, she gives him her card. What is her greatest risk at this point?", "a": ["That she has assumed duties, at least confidentiality and possibly care, to someone who may rely on her advice.", "None, because no attorney-client relationship can form in a social setting like a neighbor's party.", "Only a fee dispute, because she gave legal advice to a stranger without first entering into a written fee agreement with him.", "None, because he already has a lawyer, so he cannot also be her prospective client in that matter."], "e": "Risk rises with each step: describing the matter can make him a prospective client (1.18); asking follow-ups and evaluating his lawyer's advice is giving legal advice he may rely on (Togstad; maybe § 14); and the card signals future representation. The fix is to say clearly that she can't advise him, isn't a family lawyer, and he should consult his own lawyer.", "r": "Outline III-B; [S2:47–48; S3:59]"},
{"t": "rel", "q": "Lawyer Nash's website has a form headed 'Tell us about your case, and an attorney will evaluate it within 24 hours.' There is no disclaimer. A visitor submits detailed, damaging facts about her dispute with Nash's existing client. Nash never responds. Is the visitor a prospective client?", "a": ["Yes, because the lawyer specifically invited information about a potential representation without warnings.", "No, because there was no in-person consultation between Nash and the visitor.", "No, because Nash never responded to the submission or agreed to evaluate the visitor's case.", "No, because a website visitor becomes a prospective client only after paying a consultation fee or receiving a response from the lawyer."], "e": "1.18 cmt [2]: a consultation likely occurs when a lawyer, in person or through advertising in any medium, specifically requests or invites information about a potential representation without clear and reasonably understandable cautionary statements, and the person responds. Nash must not use or reveal the information (1.18(b)), and 1.18(c) may raise a conflict.", "r": "MR 1.18(a) & cmt [2]; Outline III-C; [S3:12]"},
{"t": "rel", "q": "Lawyer Ortiz's billboard lists his name, phone number, and 'Personal Injury.' Without any prior contact, a stranger emails Ortiz a long account of an accident involving Ortiz's current client and asks Ortiz to represent her. Is the stranger a prospective client entitled to Rule 1.18 protection?", "a": ["No, because she communicated unilaterally in response to advertising that merely described his practice.", "Yes, because anyone who sends information to a lawyer while seeking representation is a prospective client.", "Yes, because personal-injury advertising implicitly invites members of the public to submit case details.", "No, because only in-person communications can ever give rise to prospective-client status."], "e": "1.18 cmt [2]: a person who gives information in response to advertising that merely describes the lawyer's education, experience, practice areas, and contact information communicates unilaterally and isn't a prospective client. Lawyers should still be careful how they handle such information.", "r": "MR 1.18 cmt [2]; Outline III-C; [S3:13]"},
{"t": "rel", "q": "A wealthy executive contemplating divorce schedules brief 'interviews' with every experienced family lawyer in town. In each, she mentions she is considering divorce, asks about the lawyer's philosophy of practice, and shares a few personal details. Her evident goal is to make each lawyer unavailable to her husband. Is a lawyer she 'interviewed' disqualified from representing the husband?", "a": ["Likely not, because one who consults a lawyer to disqualify the lawyer is not a prospective client.", "Yes, because anyone who discusses a potential matter with a lawyer becomes a prospective client of that lawyer.", "Yes, because personal details shared in a consultation are always significantly harmful information.", "No, because a prospective client can never create a conflict for the lawyer she consults."], "e": "1.18 cmt [2] and ABA Op. 492: a person who communicates with a lawyer to disqualify the lawyer ('cookie-licking' or 'taint shopping') isn't a prospective client because the subjective element is missing. Interviewing several lawyers isn't bad faith in itself. Even when the person isn't protected, discretion is wise.", "r": "MR 1.18 cmt [2]; ABA Op. 492; Outline III-C; [S3:58]"},
{"t": "rel", "q": "Prospective client Pine consulted Lawyer Quinn about a contract dispute with Rand Corp. and gave Quinn his file. Quinn declined the case. Separately, before ever meeting Pine, Quinn had read news reports about Rand's financial trouble. Months later, a third party asks Quinn for help with a deal involving Rand. Which information may Quinn not use or reveal under Rule 1.18(b)?", "a": ["Only the information Quinn learned from Pine during the consultation.", "All information relating to the potential representation, including what Quinn read in the news.", "Nothing, because no attorney-client relationship ever formed between Quinn and Pine.", "Only the information that Pine specifically marked or described as confidential."], "e": "1.18(b) protects only information learned from the prospective client. That's narrower than 1.6, which covers information relating to the representation from any source. Quinn may use what he independently learned from public reports. Pine's information can be used or revealed only as 1.9 would permit for a former client.", "r": "MR 1.18(b); Outline III-C, VI-A; [S3:17]"},
{"t": "rel", "q": "Lawyer Sung spent an hour with a prospective client who disclosed her negotiating strategy and her bottom line in a pending dispute with Tal Corp. Sung declined the case. Tal Corp. now asks Sung's partner, Usher, to represent it in that same dispute. Sung did not try to limit what she heard, and no screen was set up. Neither the prospective client nor Tal has consented. May Usher represent Tal?", "a": ["No, because Sung received significantly harmful information in the same matter, it is imputed, and no cure applies.", "Yes, because the woman never became a client of the firm, so no conflict rule applies to her matter.", "Yes, because Usher personally never spoke with the prospective client and has never seen any of her information or notes.", "Yes, so long as Sung promises not to share anything she learned with Usher or the trial team."], "e": "1.18(c): a lawyer who received significantly harmful information from a prospective client can't represent a materially adverse client in the same or a substantially related matter, and the bar is imputed to the firm. 1.18(d) cures require informed written consent from both, or reasonable measures to limit the intake plus a timely screen, no fee share, and written notice. None occurred.", "r": "MR 1.18(c)–(d); Outline III-C"},
{"t": "rel", "q": "Prospective client Vance consults Lawyer Wu about suing Xeno Co. Wu, aware his firm sometimes represents Xeno, asks only the basic facts needed to check conflicts and decline, and does not ask about strategy. Wu declines. Xeno then asks Wu's firm to defend Vance's suit. The firm promptly screens Wu, gives him no part of the fee, and sends Vance written notice. Vance objects. May the firm represent Xeno?", "a": ["Yes, because Wu limited his intake and the firm timely screened him, gave him no fee, and notified Vance in writing.", "No, because the firm needs Vance's informed consent, confirmed in writing, before it may proceed.", "No, because a prospective client's timely written objection always prevents any later adverse representation by the lawyer's firm.", "Yes, but only if Wu himself handles the defense, since he already knows the basic facts."], "e": "1.18(d)(2) permits the firm (not Wu) to proceed without the prospective client's consent if the lawyer took reasonable measures to avoid exposure to more information than needed, is timely screened, is apportioned no fee, and written notice is promptly given. Consent of both under (d)(1) is the alternative route.", "r": "MR 1.18(d)(2); Outline III-C, X formality ladder"},
{"t": "rel", "q": "A woman meets Lawyer Yates about an employment-discrimination claim and shares embarrassing details about her relationship with her supervisor. She decides not to hire Yates. Yates says, 'If you don't hire me, I'm free to talk about what you told me.' Is Yates correct?", "a": ["No, because even without a relationship, a lawyer may not use or reveal what a prospective client said.", "Yes, because no attorney-client relationship formed, so no duty of confidentiality ever attached.", "Yes, because the woman did not sign any confidentiality agreement before the consultation began.", "No, but only because everything she said in the consultation is protected by the attorney-client privilege."], "e": "1.18(b) imposes confidentiality toward prospective clients even if no relationship forms. The threat also suggests misconduct under 8.4. Privilege may or may not attach, but the confidentiality duty applies regardless.", "r": "MR 1.18(b); Outline III-C; [S2:78–79]"},
{"t": "rel", "q": "Lawyer Zane is retained to defend a client in a breach-of-contract suit. While reviewing the complaint, Zane notices that the client may have a valuable counterclaim that must be asserted in this action or be lost. The client never asked about counterclaims. Zane says nothing, and the counterclaim is waived. Is Zane potentially liable?", "a": ["Yes, because care covers everything within the scope of the engagement, asked about or not.", "No, because the client never asked Zane to evaluate any possible counterclaims.", "No, because counterclaims fall outside the scope of a defense engagement as a matter of law.", "Yes, but only if the engagement letter expressly listed counterclaims among the services."], "e": "Care and candor are limited to scope, but within scope they cover everything a reasonable lawyer would address, asked for or not, including deadlines and compulsory claims in the same action. Scope is judged by what the client actually and reasonably believes the lawyer was hired to do.", "r": "Outline III-D; [S2:51–54]"},
{"t": "rel", "q": "Lawyer Abel represents Bix Co. in a narrowly defined trademark registration. Separately, Abel agrees to represent Bix's competitor in an unrelated contract suit against Bix. Abel argues there is no conflict because the suit is outside the scope of his trademark engagement. Is Abel correct?", "a": ["No, because loyalty is broader than scope and bars direct adversity to a current client in any matter.", "Yes, because all of a lawyer's duties, including loyalty, are limited to the scope of the engagement.", "Yes, because the duty of loyalty applies only to matters substantially related to the engagement.", "No, but only because trademark and contract matters are substantially related as a matter of law."], "e": "Care and candor track scope, but loyalty and confidentiality are broader. A lawyer may not be directly adverse to a current client in any matter, related or not, without informed consent confirmed in writing (1.7).", "r": "MR 1.7(a)(1); Outline III-D; [S2:51–53]"},
{"t": "rel", "q": "A client with limited funds asks Lawyer Cruz to draft a complaint and supporting papers that the client will file and argue herself. Cruz agrees, explains the limits and risks, and the client agrees. Is this arrangement proper?", "a": ["Yes, because a lawyer may limit scope if the limitation is reasonable and the client gives informed consent.", "No, because a lawyer who drafts a pleading for a client must appear as counsel of record in the proceeding in which it is filed.", "No, because a limited-scope representation requires a writing signed by the client.", "Yes, but only if Cruz charges no fee at all for the limited drafting service."], "e": "1.2(c) permits reasonable scope limits with informed consent. Unbundled services such as drafting, ghostwriting, or trial-only work are generally allowed, subject to tribunal rules. A writing isn't required by 1.2(c), though it's best practice.", "r": "MR 1.2(c); Outline III-D; [S2:87–89]"},
{"t": "rel", "q": "Lawyer Diaz's engagement letter says, 'Representation limited to workers' compensation claim.' The injured client signs it. Diaz never explains that a separate products-liability claim against the equipment maker may be worth far more and has a short limitations period. The products claim expires. Is the scope limitation effective to shield Diaz?", "a": ["No, because the client's agreement was not informed: Diaz never explained the risks of and alternatives to the limit.", "Yes, because the client signed a written limitation that expressly identified the scope of the work.", "Yes, because a lawyer has no duty to address matters falling outside the agreed scope of the engagement.", "No, because scope limitations are never enforceable in personal-injury and workers' compensation matters."], "e": "Informed consent (1.0(e)) requires communicating adequate information about the material risks of, and reasonably available alternatives to, the proposed course. A bare label isn't enough (Nichols v. Keller; the Bobby Boilermaker problem). The fix: 'Comp only. A separate suit may be worth more. The deadline is running. See a litigator now.'", "r": "MR 1.0(e), 1.2(c); Outline III-D; [W2:28–39]"},
{"t": "rel", "q": "Lawyer Ema agreed to a flat fee of $12,000 'to represent you in your car accident case.' After losing at trial, she tells the client she'll handle an appeal for $4,000 more. The client says he understood the fee covered the case to the end. Who bears the risk of the ambiguity?", "a": ["Ema, because scope turns on what the client reasonably believed, and she failed to exclude appeals clearly.", "The client, because a 'case' ordinarily means only the trial-court proceedings in a lawsuit, so appeals are a separate engagement.", "Neither, because the parties may simply negotiate a new fee for the appeal.", "The client, because he signed the fee agreement without asking whether appeals were covered."], "e": "Scope includes what the client actually and reasonably believes the lawyer was hired to do, from the client's point of view. Post-trial work is one of the three scope traps (along with tax and insurance) to address expressly. A clear engagement letter's main benefit is clarifying scope. It doesn't immunize the lawyer from malpractice or discipline.", "r": "Outline III-D; [S2:55, 75–77]"},
{"t": "rel", "q": "A contractor tells Lawyer Fox that her supplier knowingly delivered defective countertops. Fox offers to file only a breach-of-contract claim, and the contractor signs an agreement limiting the representation to that claim. Fox never mentions that a state fraud statute could yield treble damages. Did Fox properly limit the scope?", "a": ["No, because her consent was not informed: Fox never explained the fraud alternative and what the limit cost her.", "Yes, because the client consented to the limitation in a writing that she signed.", "Yes, because the choice of which claims to plead is a means decision that lawyers may make without consulting the client at all.", "No, because a lawyer may never limit the scope of a representation in litigation."], "e": "1.2(c) requires reasonable limits and informed consent. Without explaining the reasonably available alternative, the treble-damages fraud claim, the consent wasn't informed. The signature doesn't cure the missing information.", "r": "MR 1.2(c), 1.0(e); Outline III-D; [S2:127–129]"},
{"t": "rel", "q": "Lawyer Gil handles a client's commercial real estate purchase. The deal has significant tax consequences. Gil doesn't do tax work and doesn't intend to advise on it. What should Gil do to manage this scope issue?", "a": ["State the tax carve-out clearly in the engagement letter and encourage the client to get tax advice elsewhere.", "Nothing, because tax issues fall outside any real estate engagement as a matter of law.", "Handle the tax issues anyway, because a lawyer must address every issue that arises in a transaction.", "Decline the engagement, because a lawyer may not limit the scope of a transaction that has tax consequences."], "e": "Post-trial work, tax, and insurance coverage are the three common scope traps. If you won't handle one, say so clearly in writing and tell the client to get advice elsewhere. Otherwise a client may reasonably believe it was covered.", "r": "Outline III-D; [S2:55]"},
{"t": "rel", "q": "New lawyer Hale puts a clause in his standard engagement letter: 'Client waives all claims for legal malpractice.' He tells every client to consult another lawyer before signing if they wish, but most don't. Which is correct under the Model Rules?", "a": ["He may not make it unless the client is actually independently represented in making the agreement.", "The clause is proper because Hale advised every client in writing to consult another lawyer first.", "The clause is proper if the client gives informed consent after Hale explains the clause's effect on her future malpractice claims.", "The clause is proper if Hale's fee is reduced to reflect the value of the waiver."], "e": "1.8(h)(1) prohibits agreements prospectively limiting malpractice liability unless the client is independently represented in making the agreement. Advice to consult counsel isn't enough. Many states also disfavor such waivers substantively.", "r": "MR 1.8(h)(1); Outline III-D; [S2:130–131]"},
{"t": "rel", "q": "Lawyer Ito missed a filing deadline, and her former client, now unrepresented, is threatening suit. Ito proposes to settle for $15,000 in exchange for a release. What must Ito do before settling?", "a": ["Advise her in writing to seek independent counsel and give her a reasonable opportunity to do so.", "Nothing beyond paying the settlement, because she is now a former client rather than a current one.", "Ensure that the former client is actually represented by independent counsel in the settlement.", "Obtain the disciplinary authority's approval of the settlement before paying anything to her."], "e": "1.8(h)(2) permits settling a claim or potential claim for malpractice liability with an unrepresented client or former client only if the lawyer first advises in writing of the desirability of independent counsel and gives a reasonable opportunity to get it. Actual independent representation is the stricter 1.8(h)(1) requirement for prospective limits.", "r": "MR 1.8(h)(2); Outline III-D, X"},
{"t": "rel", "q": "Lawyer Jun, investigating embezzlement for a restaurant client, interviews a frightened waitress who will reveal what she knows only if Jun promises that the culprit will never learn she was the source. Without checking with the client, Jun promises. Later the client wants to use the waitress as a named witness in a civil suit. What is the problem?", "a": ["The promise may bind the client and conflict with his duties to it, so he should have consulted the client first.", "None, because a lawyer's promise to a non-client has no legal or ethical effect on the representation.", "None, because the duty of confidentiality never runs to anyone who is not a client.", "Jun must now disclose her identity to everyone, because a promise made without the client's approval is void."], "e": "Lawyers commonly assume confidentiality duties to non-clients by promise, such as anonymity to witnesses. Such promises can constrain the client and conflict with candor and loyalty, so clear them with the client first. Even with the promise, the client can report the theft to police without identifying the source.", "r": "Outline III-E; [S2:58, 63]"},
{"t": "rel", "q": "A woman asks Lawyer Kerr whether she has a malpractice claim over her husband's surgery. After a short conversation, Kerr says, 'I don't think you have a case,' without researching it or mentioning any deadline. She consults no one else, and the limitations period runs. Is Kerr potentially liable?", "a": ["Yes, because by giving advice on the merits, Kerr assumed a duty of care to her even without a full relationship.", "No, because Kerr never agreed to represent her in the medical malpractice matter.", "No, because declining to take a case can never create any duty or liability for a lawyer.", "Yes, but only if she paid Kerr a fee for the initial consultation, because unpaid consultations create no duties to the caller."], "e": "Togstad v. Vesely: a lawyer who gives advice while declining can owe a duty of care, and the jury verdict exceeded $600,000. The duty came from how he declined. A safe non-engagement letter says you won't represent her, offers no evaluation of the merits, encourages other counsel, and warns about limitations periods, in writing.", "r": "Togstad; Outline III-E; [S2:59]"},
{"t": "rel", "q": "Lawyer Lam decides not to take a prospective client's wrongful-termination matter. Which non-engagement letter best protects Lam?", "a": ["'We will not represent you or evaluate your claim. Consult another lawyer promptly; strict deadlines may apply.'", "'We will not represent you because, after reviewing what you told us, we believe your claim lacks merit.'", "'We are unable to assist you with this matter at this time. Good luck.'", "'We will not represent you, but you likely have a strong claim that is worth pursuing with other counsel.'"], "e": "The Togstad-safe letter: (1) no representation; (2) no advice or evaluation of the merits; (3) encourage other counsel; (4) warn about limitations or other deadlines; (5) put it in writing. Evaluating the merits either way invites reliance.", "r": "Outline III-E; [S2:59]"},
{"t": "rel", "q": "Testator Ted hired Lawyer Mott to draft a trust benefiting Ted's grandchildren. Mott's drafting violated the Rule Against Perpetuities, voiding gifts to a grandchild who had not been born when the documents were signed. After Ted's death the grandchild sues Mott. Mott argues that Ted was his only client and that his engagement letter says so. What result is likely in most jurisdictions?", "a": ["Mott may be liable, because a lawyer can owe care to non-clients the client intended to benefit.", "Mott is not liable, because only clients may sue their lawyers for professional negligence.", "Mott is not liable, because the grandchild was not yet born when the services were performed.", "Mott is not liable, because his engagement letter disclaimed any duties to persons other than Ted."], "e": "Intended beneficiaries can sue (Lucas v. Hamm; Restatement § 51(3)). The client's intent to benefit the third party creates the duty. Lucas also held California's RAP so confusing that error wasn't negligent, a part no other jurisdiction follows. An engagement letter between lawyer and client can't waive a non-client's claim.", "r": "Lucas v. Hamm; Restatement § 51(3); Outline III-E; [S2:65–66]"},
{"t": "rel", "q": "In a divorce, Lawyer Ness represents the husband and drafts a qualified domestic relations order transferring half his retirement account to the wife. Ness makes an error that reduces the wife's share. To whom does Ness owe a duty of care in drafting the order?", "a": ["Only to the husband, because an adversary in the litigation is not an intended beneficiary.", "To both spouses, because the order was specifically intended to transfer assets to the wife.", "Only to the wife, because she is the person who benefits from the order.", "To neither, because court orders are the judge's responsibility once they are entered."], "e": "The intended-beneficiary doctrine applies when the client's primary purpose is to benefit the non-client and recognizing a duty wouldn't impair the lawyer's obligations to the client. A litigation adversary doesn't fit. A duty to the opposing spouse would conflict with loyalty to the client.", "r": "Restatement § 51(3); Outline III-E; [S2:84]"},
{"t": "rel", "q": "A hospital CEO hires Lawyer Ortiz to assess the hospital's potential exposure in a federal investigation. The CEO tells Ortiz the written assessment will be given to a company considering buying the hospital, which will rely on it. Ortiz negligently understates the exposure. To whom may Ortiz owe a duty of care?", "a": ["Both the hospital and the buyer, because Ortiz knew a third party would receive and rely on the evaluation.", "Only the hospital, because the hospital is the client and the only party in privity with Ortiz under the engagement agreement.", "Only the purchaser, because the purchaser is the party that actually relied on the assessment.", "No one, because evaluations of uncertain investigations are opinions rather than legal services."], "e": "Lawyers who provide work product they know third parties will rely on, such as opinion letters and evaluations (MR 2.3; Restatement § 51(2)), can owe a duty of care to those third parties. Liability is usually limited to those specifically intended to rely (Bily v. Arthur Young), and reliance must be reasonable (Goodman v. Kennedy).", "r": "MR 2.3; Restatement § 51(2); Outline III-E; [S2:62, 85]"},
{"t": "rel", "q": "Lawyer Pell delivers a negligently prepared opinion letter to a lender on behalf of her borrower client, knowing the lender will rely on it. The lender relies and loses money. What is the lender's most viable cause of action against Pell?", "a": ["Professional negligence.", "Breach of fiduciary duty.", "Malicious prosecution.", "Violation of the Rules of Professional Conduct."], "e": "A non-client invited to rely on a lawyer's work product can sue in negligence for breach of the duty of care. Pell owes the lender no fiduciary duties of loyalty, and the Rules don't create a private cause of action.", "r": "Outline III-E; [S2:86]"},
{"t": "rel", "q": "A prospective medical-malpractice client consults Lawyer Quill. Quill's firm currently represents one of the defendant doctors in an unrelated real estate deal. The firm's real estate partner refuses to ask the doctor for consent, fearing it will lose his business. What should the firm do?", "a": ["Decline with a Togstad-safe letter that warns of the limitations period, without naming the doctor as a client.", "Take the malpractice case without consent, because the real estate matter is unrelated to it.", "Take the case but screen the real estate partner from any involvement in the malpractice matter.", "Decline and explain that the firm represents the doctor, so the prospective client understands why."], "e": "Suing a current client is a 1.7(a)(1) conflict regardless of subject matter. Without the doctor's informed consent confirmed in writing, the firm must decline. Because the declination can create duties (Togstad), it should urge other counsel and flag limitations deadlines. The identity of the firm's client is confidential (1.6), so say only that there's a conflict.", "r": "MR 1.7, 1.6; Outline III-E; [S2:64]"},
{"t": "rel", "q": "A wealthy uncle agrees to pay Lawyer Rios's fees to defend his nephew in a property-damage suit. During the representation, Rios learns the nephew was using opioids when the incident occurred. The uncle calls and asks Rios how the case is going and 'whether there's anything I should know about my nephew.' What may Rios tell him?", "a": ["Nothing confidential without the nephew's informed consent, because the nephew, not the payor, is the client.", "Everything, because the uncle is paying the fees and is therefore entitled to know about the case.", "Everything except the drug use, because only health-related information is confidential.", "Only the drug use, because the uncle could help the nephew get treatment and the nephew would benefit."], "e": "1.8(f): a lawyer may accept payment from a third party only with the client's informed consent, no interference with independent judgment, and protection of client information (1.6). The payor isn't the client, has no privilege, and gets no confidential information without consent. Rios may encourage the nephew to tell his uncle himself.", "r": "MR 1.8(f), 5.4(c); Outline III-E; [S2:60, 67–68]"},
{"t": "rel", "q": "An employer pays Lawyer Sato to defend an employee sued for an on-the-job accident. The employer instructs Sato not to interview two co-workers who might testify the employer's equipment was faulty. Sato believes the interviews are essential to the employee's defense. What should Sato do?", "a": ["Conduct the interviews, because one who pays a lawyer to represent another may not direct the lawyer's judgment.", "Follow the employer's instructions, because the payor controls the scope of the engagement it funds.", "Withdraw immediately, because any instruction from a third-party payor about the defense creates a conflict that cannot be waived.", "Conduct the interviews only if the employer later ratifies the decision to go forward with them."], "e": "5.4(c) and 1.8(f)(2): a third-party payor may not direct or regulate the lawyer's professional judgment. If the employer's interests diverge materially, Sato must also analyze a 1.7(a)(2) conflict, but deferring to the payor at the client's expense isn't an option.", "r": "MR 5.4(c), 1.8(f)(2); Outline III-E"},
{"t": "rel", "q": "Lawyer Tull is outside counsel to Vista Corp. During an internal inquiry, Vista's CFO tells Tull, 'I'm glad you're my lawyer too. Between us, I approved some questionable entries.' The CFO's interests may be adverse to Vista's. What must Tull do?", "a": ["Explain that he represents Vista, not the CFO, and that the CFO's statements may be shared with Vista.", "Keep the statement confidential from Vista, because the CFO is a constituent who speaks for the client.", "Advise the CFO on how to minimize his personal exposure, because he is cooperating with the inquiry.", "Say nothing, because corporate constituents are presumed to know whom the company's lawyer represents."], "e": "1.13(a): the lawyer for an organization represents the entity acting through its constituents. 1.13(f): when the organization's interests are or may be adverse to a constituent's, the lawyer must explain who the client is (an 'Upjohn' or corporate Miranda warning). Tull can't keep secrets from his client or give the CFO legal advice beyond suggesting he get counsel (4.3).", "r": "MR 1.13(a), (f), 4.3; Outline III-F"},
{"t": "rel", "q": "Lawyer Ueda represents a landlord negotiating a lease termination with a tenant who has no lawyer. The tenant says, 'Since you're a neutral lawyer, can you tell me if this deal is fair to me?' What may Ueda do?", "a": ["Clarify that she represents the landlord and give no advice except to get counsel, while still negotiating.", "Give the tenant her honest legal assessment, because candor to third persons requires it.", "Remain silent, because the tenant's misunderstanding of her role is not the lawyer's responsibility.", "Advise the tenant, because he waived his right to independent counsel by negotiating without one."], "e": "Rule 4.3: don't state or imply that you're disinterested, correct known misunderstandings about your role, and give no legal advice (other than to get counsel) when the unrepresented person's interests conflict with your client's. Negotiating and explaining your client's position are permitted.", "r": "MR 4.3; Outline III-F"},
{"t": "rel", "q": "Three founders meet in Lawyer Vu's conference room to form a startup. One founder, a long-time firm client who is funding the venture, told Vu beforehand that he expects the firm to represent him. Vu drafts organizational documents reflecting all three founders' agreed terms and forms the corporation. The other two founders believe Vu is 'the company's lawyer' and therefore theirs too. What was Vu's most important omission?", "a": ["Failing to identify, at the outset, whom she represented, and to tell the other founders if she wasn't their lawyer.", "Failing to charge each founder a separate fee for the formation work.", "Failing to require each of the three founders to sign a waiver of malpractice liability before the organizational meeting began.", "Failing to form a limited liability company, which would have avoided the conflict, rather than a corporation."], "e": "Who the client is depends on what each person reasonably believes. If Vu represents only the funder, she must clarify that to the others and give them no advice (4.3). Representing all of them requires 1.7 analysis and consent. Once formed, the corporation is a distinct client (1.13(a)). Identify the client before the meeting.", "r": "MR 1.13, 1.7, 4.3; Outline III-F; [S2:49–50]"},
{"t": "rel", "q": "Lawyer Abbott finished a contract dispute for a client, and the case was dismissed with prejudice after settlement. She wants to make clear that the relationship has ended, both for conflicts purposes and to avoid later claims that she was still responsible for the client's affairs. What is the best practice?", "a": ["Send a disengagement letter confirming the end, noting tasks she won't handle, and addressing the file.", "Do nothing, because the dismissal of the case automatically ends the relationship for every purpose, including conflicts.", "Keep sending the client newsletters, so that the client remains a current client and future conflicts are avoided.", "Send the final bill, which serves exactly the same function as a disengagement letter under the Rules."], "e": "A relationship ends by completion or termination, but ambiguity is dangerous, especially for open-ended matters. A disengagement letter confirms the end (turning a current client into a former client for conflicts purposes, and possibly starting the malpractice limitations clock), lists what you won't handle, and addresses the file. 1.3 cmt [4]: clarify, preferably in writing.", "r": "Outline IX; MR 1.3 cmt [4]; [S2:91–92]"},
{"t": "rel", "q": "Two weeks before trial, Client Baker emails Lawyer Cole: 'You're fired.' Cole has appeared as counsel of record. Which statement is correct?", "a": ["He must withdraw, but needs the tribunal's leave and must continue if it's denied; Baker still owes for services.", "His representation ends the moment he receives the email, and he may stop all work on the case that same day.", "He may refuse to accept the discharge because trial is imminent and a change of counsel would prejudice the client.", "Baker owes nothing for the work already done, because a client who discharges a lawyer forfeits no rights and incurs no obligations."], "e": "A client may discharge a lawyer at any time with or without cause (1.16 cmt [4]), and discharge triggers mandatory withdrawal (1.16(a)(3)). But if the lawyer has appeared, 1.16(c) requires compliance with the tribunal's notice and permission rules, so duties continue until relieved. The client still owes for services, usually in quantum meruit. 1.16(d) duties apply on exit.", "r": "MR 1.16(a)(3), (c), (d); Outline IX"},
{"t": "rel", "q": "A defendant in a felony case tells the court he wants to fire his appointed public defender because 'she doesn't believe in me.' The defender has been competent and diligent. Trial is in a month. Which is most accurate?", "a": ["The court controls substitution of appointed counsel, so his right to discharge her is limited.", "The defendant has an absolute right to discharge appointed counsel and to receive a new lawyer of his choosing.", "The public defender must withdraw immediately, because she has been discharged by her client.", "The defendant may discharge appointed counsel only by electing to proceed pro se for the rest of the case."], "e": "1.16 cmt [5]: whether a client can discharge appointed counsel may depend on applicable law, and the client should be told the consequences, which may include having to represent himself. Courts control substitution of appointed counsel.", "r": "MR 1.16 cmt [5]; Outline IX, VII-C"},
{"t": "rel", "q": "Lawyer Diaz represents a client in a transactional matter that is two months from closing. The client is pleasant and pays on time, but Diaz has accepted a job in-house and wants to withdraw. Another lawyer can easily take over without harm to the client. May Diaz withdraw?", "a": ["Yes, because withdrawal is permitted when it can be done without material adverse effect on the client.", "No, because a lawyer may withdraw from a pending matter only when one of the listed grounds for cause exists.", "No, because a lawyer may never withdraw before the engagement's work is complete, absent the client's consent.", "Yes, but only if the client consents in a signed writing to the substitution of the new lawyer."], "e": "1.16(b)(1) permits withdrawal for any reason if it can be done without material adverse effect on the client. The ordinary cost of switching counsel doesn't count, but a looming deadline might. No tribunal is involved, so no permission is needed. Diaz must still meet 1.16(d) duties.", "r": "MR 1.16(b)(1), (d); Outline IX-A"},
{"t": "rel", "q": "Client Evers has failed to pay Lawyer Fife's invoices for four months despite repeated promises. Trial is eight months away. Fife wants to withdraw. What should Fife do?", "a": ["Warn Evers clearly that he will seek to withdraw unless paid, and if not paid, move to withdraw well before trial.", "Stop working on the case until Evers pays the overdue invoices, then resume preparation for trial.", "Tell Evers that he will not appear at trial unless he is paid in full, which counts as reasonable warning.", "Withdraw immediately without notice, because nonpayment automatically terminates the engagement under the fee agreement."], "e": "1.16(b)(5) permits withdrawal when the client substantially fails to fulfill an obligation regarding the lawyer's services after reasonable warning. Build a long runway: the closer to trial, the more likely the court denies leave. Stopping work or threatening not to appear is abandonment (1.1, 1.3, 1.16(c)).", "r": "MR 1.16(b)(5), (c); Outline IX-A, IX-B; [S2:101–103]"},
{"t": "rel", "q": "An associate at a large firm is assigned to defend a manufacturer in a case alleging its product killed children. The associate's own child died in a similar accident, and he finds the defense repugnant. The firm is willing to keep the case. What is the associate's best course?", "a": ["Ask to be reassigned to another matter within the firm.", "Refuse to work on the matter and report the firm to the disciplinary authority for accepting it.", "Work on the matter but quietly limit his efforts to what he can stomach.", "Insist that the firm withdraw from the representation because one of its lawyers finds it repugnant."], "e": "1.16(b)(4) permits withdrawal when a client insists on action the lawyer finds repugnant or with which he fundamentally disagrees. In a firm, the practical solution is reassignment. His personal reaction may also be a 1.7(a)(2) material-limitation conflict for him, but not one imputed to others in a way that prevents the firm from continuing.", "r": "MR 1.16(b)(4); Outline IX-A; [S2:114]"},
{"t": "rel", "q": "Lawyer Gill's client has failed to appear at her own noticed deposition three times without warning Gill. Gill has warned her in writing that he will withdraw if it happens again. It happens again. May Gill seek to withdraw?", "a": ["Yes, because she has made the representation unreasonably difficult and failed her obligations after warning.", "No, because only a client's nonpayment of fees, after warning, can justify a lawyer's permissive withdrawal from pending litigation.", "No, because a lawyer may never withdraw over a client's own conduct in the litigation.", "Yes, and he may do so without the court's permission because the client caused the problem."], "e": "1.16(b)(6) (representation rendered unreasonably difficult by the client) and (b)(5) (substantial failure to fulfill an obligation after warning) both support permissive withdrawal. Leave of court is still required under 1.16(c).", "r": "MR 1.16(b)(5)–(6), (c); Outline IX-A; [S2:115]"},
{"t": "rel", "q": "Lawyer Hanna discovers that her client used a stock-purchase agreement Hanna drafted to defraud investors, though Hanna did not know it at the time. The fraud is complete and the client has stopped. Hanna wants to withdraw. Which statement is correct?", "a": ["Hanna may withdraw because her services were used for fraud, and she may be permitted to disclose to rectify losses.", "Hanna may not withdraw, because the fraud is complete and there is nothing left for her withdrawal to prevent.", "Hanna must withdraw, and because the fraud used her work, she must also disclose the completed fraud to every affected investor.", "Hanna may withdraw only with the client's consent, because the client has stopped the fraudulent activity."], "e": "1.16(b)(3) permits withdrawal when the client has used the lawyer's services to perpetrate a crime or fraud (past use), as distinct from (b)(2) (persisting in a course the lawyer reasonably believes criminal or fraudulent). 1.6(b)(3) permits disclosure to prevent, mitigate, or rectify substantial financial injury from a crime or fraud in which the client used the lawyer's services. Disclosure is permissive unless 4.1(b) applies to ongoing conduct.", "r": "MR 1.16(b)(3), 1.6(b)(3); Outline IX-A, VI-E"},
{"t": "rel", "q": "Three weeks before trial, Lawyer Irwin moves to withdraw because the client has stopped paying. The judge denies the motion, citing the trial date. Irwin believes the ruling is wrong. What must Irwin do?", "a": ["Continue the representation and try the case competently, because a tribunal has ordered him to continue.", "Stop working, because he had good cause to withdraw and the client materially breached the fee agreement.", "Appear at trial but put on no case, because he is not being paid for any further work on the matter.", "Refuse to appear at trial and immediately file an appeal of the order denying his motion to withdraw."], "e": "1.16(c): when ordered by a tribunal to continue, a lawyer shall continue notwithstanding good cause for terminating. Every duty (competence, diligence, loyalty) continues until the lawyer is relieved. He may seek appellate review where available, but may not abandon the client.", "r": "MR 1.16(c); Outline IX-B; [S2:136–137]"},
{"t": "rel", "q": "Lawyer Jain moves to withdraw because her client insists on testifying to facts Jain believes are false. The judge asks Jain, in open court, why she seeks to withdraw. What should Jain say initially?", "a": ["That professional considerations require termination; if ordered to say more, ask to disclose under seal.", "Exactly why she wants to withdraw, because candor to the tribunal overrides confidentiality in a withdrawal motion.", "Nothing at all, and refuse any further explanation even if the court orders her to provide one.", "That the client plans to commit perjury, because Rule 3.3 requires immediate disclosure of intended false testimony."], "e": "1.16 cmt [3]: the court may ask for an explanation, but the lawyer may be bound to keep the reasons confidential, and 'professional considerations require termination' ordinarily suffices. If the court orders more, 1.6(b)(6) permits disclosure to comply with the order, ideally sealed or in camera. 3.3's remedial duty is triggered by false evidence actually offered, not a client's stated intention, though Jain must refuse to offer evidence she knows is false.", "r": "MR 1.16 cmt [3], 1.6(b)(6), 3.3; Outline IX-B; [S2:99–100]"},
{"t": "rel", "q": "Lawyer Kraus moves to withdraw for nonpayment. He wants to tell the court the exact amount the client owes and how long the bills have been overdue. What is the best guidance?", "a": ["Avoid volunteering details: the fact of nonpayment may be disclosable, but authority is mixed, so disclose only what's required.", "Disclose all of the fee details, because information about a lawyer's own fees is never confidential.", "Disclose the fee details only if the client is a corporation, because an individual client's finances are private and protected.", "Disclose the details, because Rule 3.3 requires complete candor about the reasons for any motion to withdraw."], "e": "Fee information relates to the representation and is confidential. ABA Op. 476 suggests the fact of nonpayment may be revealed under 1.6(b)(5), but authority is mixed, so keep it minimal and seek sealing if the court presses. Remember: 'your lack of planning is not my emergency.' Late motions fare poorly.", "r": "ABA Op. 476; MR 1.6(b)(5); Outline IX-B; [W2:84]"},
{"t": "rel", "q": "With trial set for next Monday and $30,000 in unpaid fees, Lawyer Lund emails his client: 'Unless you pay in full by Friday, we will not appear for trial.' The client doesn't pay. Lund doesn't appear, and the court issues an order to show cause. What is Lund's exposure?", "a": ["Sanctions and discipline for abandoning the client without leave, plus malpractice exposure, despite nonpayment.", "None, because he gave the client a reasonable warning before refusing to appear, as Rule 1.16(b)(5) requires.", "None, because nonpayment of fees automatically terminates the representation and ends the lawyer's duties.", "Only a reduction in his fee, because a lawyer's failure to appear is a contractual matter between him and the client."], "e": "Warning plus nonpayment gives a ground to ask leave to withdraw. It doesn't authorize self-help. Until relieved by the court, Lund must appear (1.16(c)). Skipping trial violates 1.1, 1.3, and 1.16(c), invites sanctions (inherent power, show-cause), and creates malpractice exposure. Responding to the order to show cause shouldn't volunteer confidential fee details beyond what's needed.", "r": "MR 1.16(c), 1.3; Outline IX-B; [S2:103–104]"},
{"t": "rel", "q": "A week before trial, Lawyer Mead moves to withdraw after an unpaid client disputes the bills. The client produces Mead's earlier email threatening not to appear unless paid, and says he wants the trial to go forward as scheduled. How is the court likely to rule?", "a": ["Deny the motion, because withdrawal on the eve of trial would prejudice the client, and the timing is the lawyer's doing.", "Grant the motion, because a client's nonpayment always justifies a lawyer's withdrawal from the representation.", "Grant the motion, because the client's dispute of the bills shows that the relationship is irreparably broken.", "Deny the motion and order the client to deposit the disputed fees into court before the trial begins, protecting the firm."], "e": "Courts commonly deny leave close to trial or when the motion looks opportunistic or coercive. Notice and time to obtain counsel 'to the extent reasonably practicable' (1.16(d)) weren't provided when the lawyer let the issue fester. The court won't adjudicate the fee dispute as a condition of trial.", "r": "MR 1.16(c)–(d); Outline IX-B; [S2:117]"},
{"t": "rel", "q": "Lawyer Nash agrees to take over a medical-malpractice case from prior counsel by stipulated substitution, which the court approves. Nash doesn't check the docket. The deadline to serve the plaintiff's expert report falls the next day, and Nash misses it, and the case is dismissed. Who is responsible for the missed deadline?", "a": ["Nash, because once substitution was approved he became responsible for every pending deadline.", "Prior counsel, because he should have warned Nash about the deadline before the substitution was filed.", "The client, because she should have told Nash about the deadline when they first met about the case.", "No one, because an approved substitution of counsel automatically extends any deadline falling within thirty days."], "e": "Substitution of counsel is almost always approved, and successor counsel must look before leaping. Once in, the new lawyer owns every deadline. Prior counsel has 1.16(d) duties to cooperate, but that doesn't shift responsibility for a docketed deadline.", "r": "Outline IX-B; [S2:138–139]"},
{"t": "rel", "q": "Lawyer Ober, who gives occasional transactional advice to a business client and has never appeared in any court for it, takes a government job and writes to the client ending the relationship. Must Ober obtain a court's permission?", "a": ["No, because no tribunal is involved, though he must still take reasonable steps to protect the client.", "Yes, because a tribunal must approve the termination of every representation, whether or not litigation is pending.", "Yes, unless the client consents in writing to the termination of the advisory relationship.", "No, and Ober has no further obligations of any kind to the client once he sends the termination letter."], "e": "1.16(c) applies only where applicable law requires notice to or permission of a tribunal. In transactional work there's no one to ask, but 1.16(d) still requires reasonable notice, time to obtain other counsel, surrender of papers, and refunds. Ober must also mind 1.11 conflicts in government service.", "r": "MR 1.16(c)–(d); Outline IX; [S2:99, 134–135]"},
{"t": "rel", "q": "Lawyer Price prepared private-placement disclosure documents for a client. She later discovers the financial information the client gave her was materially false. The client has already raised some money and, despite Price's warnings, continues using the documents to solicit investors. Which describes Price's obligations?", "a": ["She must withdraw, may disaffirm the documents, may disclose under 1.6(b)(2)–(3), and must disclose if needed to avoid assisting.", "She must continue the representation in order to protect the client's interests while the offering is ongoing.", "She may withdraw quietly, but she may not take any step, including disaffirming the documents, that would reveal the client's fraud.", "She must report the client to the SEC, because securities fraud overrides the duty of confidentiality in all cases."], "e": "Continuing would assist an ongoing fraud using her work product, so withdrawal is mandatory (1.16(a)(1), (a)(4)). 1.2 cmt [10]: withdrawal alone may be insufficient, so she may give notice and disaffirm the documents ('noisy withdrawal'). 1.6(b)(2)–(3) permit disclosure, and 4.1(b) turns that permission into a duty when disclosure is necessary to avoid assisting the fraud.", "r": "MR 1.16(a), 1.2 cmt [10], 1.6(b)(2)–(3), 4.1(b); Outline IX-C; [S2:107–111, 116]"},
{"t": "rel", "q": "In-house counsel Quan learns that her employer is knowingly shipping contaminated product and using legal opinions she wrote to reassure distributors. Management refuses to stop. Quan says she cannot withdraw because the company is her employer. Is she right?", "a": ["No, because mandatory withdrawal applies to in-house lawyers too, even if it means resigning.", "Yes, because in-house lawyers are exempt from Rule 1.16 so long as they are employees of the client.", "Yes, because her duty of loyalty to her employer requires her to stay and try to fix the problem from within.", "No, but she may remain in her job if she simply stops writing opinions for the company's distributors."], "e": "An organization's lawyer represents the entity (1.13), and the Rules apply fully to in-house counsel. If continuing would involve assisting crime or fraud, withdrawal is mandatory, which can mean resigning. Quan should also report up (1.13(b)) and consider reporting out (1.13(c)) and disaffirming her opinions.", "r": "MR 1.16(a), 1.13; Outline IX-C"},
{"t": "rel", "q": "Client Rowe fires Lawyer Sloan, saying the representation has been unfair and incompetent. Sloan believes the discharge is unjustified and that Rowe owes $8,000. Rowe asks for her file. Under the Model Rules and majority law, what must Sloan do?", "a": ["Take reasonable steps to protect Rowe, including surrendering the papers she's entitled to, despite the unfair discharge.", "Keep the file until the fees are paid, because a retaining lien is always permitted for unpaid legal fees.", "Release the file only if Rowe signs a release of any malpractice claims she has against Sloan, protecting him from later suit.", "Destroy duplicate documents and return only the originals, keeping copies of everything for his own protection."], "e": "1.16(d) requires reasonable steps to protect the client, including surrendering papers and property to which the client is entitled. Comment [9]: this applies even if the lawyer was unfairly discharged, and papers may be retained as security for a fee only to the extent other law permits. Most states don't let you hold the file hostage (Illinois and Georgia are exceptions). Conditioning return on a release would also violate 1.8(h).", "r": "MR 1.16(d) & cmt [9]; Outline IX-D"},
{"t": "rel", "q": "After being discharged, Lawyer Teague still holds an expert report he commissioned and paid for. The client hasn't reimbursed him, and the deadline to disclose expert reports in the pending case is ten days away. Must Teague turn the report over to the client?", "a": ["Yes, because it is reasonably necessary to protect the client's rights, and nonreimbursement doesn't justify withholding it.", "No, because the client has not yet reimbursed Teague for the expert's fee.", "No, because expert reports commissioned by counsel are the lawyer's work product, not the client's property.", "Yes, but only after the client pays for the report in full."], "e": "Papers to which the client is entitled include at least everything reasonably necessary to protect the client's rights, whether or not paid for. Withholding a report needed for an imminent deadline would prejudice the client and violate 1.16(d). Teague can pursue reimbursement separately.", "r": "MR 1.16(d); Outline IX-D; [S2:118]"},
{"t": "rel", "q": "After a discharge, Lawyer Ulm is assembling the file. He finds a to-do list from months ago with an item, never completed, underlined with a red asterisk that might suggest he dropped the ball. He wants to leave it out. Which is correct?", "a": ["He must turn it over; withholding embarrassing material looks like a cover-up, and concealment may violate Rule 3.4(a).", "He may withhold it, because it consists of the lawyer's private notes rather than client papers.", "He may destroy it, because the task it lists is no longer relevant to the case and it would only confuse successor counsel.", "He may withhold it until the malpractice limitations period has run, and then turn it over."], "e": "The file belongs to the client. Embarrassing items are discoverable, and withholding them looks like a cover-up that can turn negligence into an intentional tort. Destroying or concealing material with potential evidentiary value violates 3.4(a). Handing over the whole file is usually the least bad option.", "r": "MR 1.16(d), 3.4(a); Outline IX-D; [S2:121–122; W2:73]"},
{"t": "rel", "q": "Before a client's anticipated fee dispute, a partner consulted his firm's designated general counsel about the firm's rights. Notes of that consultation are in the client file. The client, now discharged, asks for the whole file. May the firm withhold the notes?", "a": ["Yes, where the state protects them, because privileged consultations with designated firm counsel may be withheld.", "No, because every document in the client file belongs to the client, without exception, once the client asks.", "No, because a lawyer's consultations about a client's matter can never be privileged as against that client.", "Yes, but only if the client has already filed a lawsuit against the firm over the disputed fees."], "e": "Courts split on whether intra-firm consultations are privileged against the client (Bank Brussels Lambert vs. RFF Family Partnership and St. Simons Waterfront). Those protecting them require consultation with designated firm counsel on the lawyer's own obligations. Ordinary internal notes about the client's case aren't protected.", "r": "Outline IX-D, VI-C; [S2:120; W3:20]"},
{"t": "rel", "q": "Lawyer Vargas is discharged mid-litigation. Which of the following is Vargas required to do?", "a": ["Warn the client of a potential limitations period on a related claim that hasn't yet been pleaded.", "Prepare a detailed index of every document produced in discovery so far.", "Spend a full day with successor counsel at no charge, answering every question about the case and its strategy.", "Continue to monitor the court docket on the client's behalf for six months after discharge."], "e": "1.16(d) requires reasonable steps to protect the client, including flagging deadlines and limitations periods in writing and forwarding papers that arrive later. Helping successor counsel within reason is good practice ('especially when the client doesn't deserve it'), but a detailed index and extended free work aren't required.", "r": "MR 1.16(d); Outline IX-D; [S2:123–126]"},
{"t": "rel", "q": "Client Wen paid Lawyer Xu a $10,000 advance against hourly fees. Xu earned $3,500 before Wen discharged her. Wen disputes $500 of the earned amount. What must Xu do with the $10,000 held in trust?", "a": ["Withdraw $3,000, keep the disputed $500 in trust, and promptly refund the unearned $6,500.", "Keep the entire $10,000 in trust until the fee dispute is finally resolved.", "Withdraw the full $3,500 and refund $6,500, because the lawyer's billing records control.", "Refund the entire $10,000, because a discharged lawyer forfeits all fees earned."], "e": "1.16(d) requires refunding any advance not earned. 1.15(e) requires keeping only the disputed portion separate until resolved and promptly distributing undisputed amounts. Self-help is prohibited, and so is holding undisputed money as leverage.", "r": "MR 1.16(d), 1.15(e); Outline IX-D, VIII-F"},
{"t": "rel", "q": "A client's matter was transferred to successor counsel. Two months later, a court notice in the client's case arrives at the former lawyer's office. What should the former lawyer do?", "a": ["Promptly forward the notice to the client or successor counsel.", "Ignore the notice, because the representation has ended.", "Return the notice to the court marked 'no longer counsel of record.'", "Hold the notice until the former client pays any outstanding fees."], "e": "Exit duties under 1.16(d) include protecting the client's interests in a reasonably practicable way, including forwarding papers that arrive after termination. Holding them as leverage would violate 1.16(d).", "r": "MR 1.16(d); Outline IX-D"},
{"t": "rel", "q": "Lawyer Yoon was retained to handle a client's employment case 'through all appeals.' The client won at trial, the time for any appeal expired without one, and six months passed with no contact. Yoon assumes the representation has ended. What is the best analysis?", "a": ["The engagement likely ended on its terms when the appeal period ran, though a disengagement letter would remove doubt.", "The engagement continues indefinitely until Yoon sends the client a written notice of termination, whatever its terms said.", "The engagement ended at the moment the trial verdict was entered, before any appeal period ran.", "The engagement continues because no appeal was ever filed, so its terms were never completed."], "e": "A defined engagement ends by completion on its terms. Once no appeal can be taken, the case is over. Ambiguity cuts against lawyers, though, so best practice is a disengagement letter confirming the end and listing tasks not undertaken (e.g., enforcement). Open-ended relationships are different: they never 'complete.'", "r": "Outline IX; [S2:132–133]"},
{"t": "fid", "q": "Nina, a lawyer, has never represented her elderly neighbor Doug. After Doug's wife dies, Nina helps with groceries and church rides, and eventually Doug gives her signature authority over his bank accounts so she can pay his bills. Nina invests $60,000 of Doug's savings in her husband's start-up, sincerely believing it is a good investment. The start-up fails. Which is most accurate?", "a": ["She likely became a fiduciary by circumstance, the self-dealing shifts the burden to her, and she faces liability and discipline.", "She owes Doug no duties at all, because she never represented him and acted only as a friend and neighbor.", "She is liable only if Doug proves she acted with a specific intent to defraud him when she made the investment.", "She is protected from liability because she sincerely and reasonably believed the start-up was a sound investment for Doug's retirement."], "e": "Fiduciary duties arise by status or by circumstance, when someone reposes special trust (a 'confidential relationship') and the fiduciary accepts it. Signature authority over an elderly friend's accounts is classic. Investing in a spouse's venture is self-dealing, and in many states the burden shifts to the fiduciary, with enhanced remedies available. Lawyers can be disciplined for dishonest non-practice conduct (8.4(c)).", "r": "Outline IV-A; [S4:7–9]"},
