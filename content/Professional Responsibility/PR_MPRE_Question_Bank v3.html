{"t": "fee", "q": "Lawyer Hale charges a client a reduced hourly rate plus a 'success bonus' of 10% of any amount recovered above $1 million. The client signs an hourly-rate letter, but nothing mentions the bonus except an email from Hale. Is the bonus enforceable under the Model Rules?", "a": ["Likely not, because any contingent component of a hybrid fee requires a writing signed by the client.", "Yes, because the main fee is hourly, so Rule 1.5(c)'s signed-writing requirement does not apply at all.", "Yes, because the client received written notice of the bonus in Hale's email and never objected to it.", "Yes, so long as the total fee, including the bonus, is reasonable under the factors in Rule 1.5(a)."], "e": "Hybrid fees are permitted within 1.5's limits, but any part that is contingent on outcome (success bonus, reverse contingency, shares payable on sale) is a contingent fee needing the client's signed writing.", "r": "MR 1.5(c); Outline VIII-A; [S5:14]"},
{"t": "fee", "q": "A case settles for $1,000,000. Costs advanced total $100,000. The signed agreement provides a 30% contingent fee calculated after costs are deducted. How much does the client receive?", "a": ["$630,000.", "$600,000.", "$700,000.", "$670,000."], "e": "Costs first: $1,000,000 − $100,000 = $900,000; fee = 30% × $900,000 = $270,000; client nets $900,000 − $270,000 = $630,000. If the fee were taken first ($300,000), the client would net $600,000 after costs. Costs-first is more common and client-favorable, and the agreement must state which applies.", "r": "MR 1.5(c); Outline VIII-A math"},
{"t": "fee", "q": "A $1,000,000 settlement, $100,000 in costs, and a signed agreement providing a 30% fee calculated on the gross recovery before costs. How much does the client net?", "a": ["$600,000.", "$630,000.", "$700,000.", "$570,000."], "e": "Fee first: 30% × $1,000,000 = $300,000. Client receives $1,000,000 − $300,000 − $100,000 = $600,000. The difference from costs-first ($630,000) is why 1.5(c) requires disclosing whether expenses are deducted before or after the fee.", "r": "MR 1.5(c); Outline VIII-A math"},
{"t": "fee", "q": "Lawyer Ivo advertises 'No fee unless we win!' His agreements require clients to repay costs advanced regardless of outcome, and losing clients have received bills for thousands in expert fees. Which is most accurate?", "a": ["The ad may mislead under Rule 7.1 if clients still owe costs, and 1.5(c) requires notice of costs owed regardless.", "The ad is entirely truthful, because the word 'fee' does not include costs, and every client can read the fine print.", "Lawyers may never require clients to repay advanced costs in contingent-fee cases, whatever the outcome.", "The ad is proper so long as the written fee agreement separately discloses the client's liability for costs."], "e": "'No fee unless we win' can mislead (7.1) if clients still owe costs. 1.5(c) requires the agreement to clearly notify the client of expenses owed regardless of outcome, and many clients don't realize they might also be taxed the opponent's costs. 1.8(e)(1) lets lawyers make repayment contingent on outcome.", "r": "MR 7.1, 1.5(c), 1.8(e); Outline VIII-A; [S5:19]"},
{"t": "fee", "q": "Lawyer Jun's engagement letter for a simple uncontested name change sets a flat fee of $15,000. Customary local fees are $500 to $1,000, and the work takes two hours. The client signs but hasn't paid when she complains to the bar. Is Jun subject to discipline?", "a": ["Yes, because agreeing to or charging an unreasonable fee violates Rule 1.5(a) even before collection.", "No, because the client agreed to the flat fee in a writing she signed before any work began.", "No, because the fee has not yet been collected, and a fee becomes unreasonable only when the lawyer actually receives it.", "Yes, but only if Jun refuses to reduce the fee after the client complains to the bar."], "e": "1.5(a): 'shall not make an agreement for, charge, or collect an unreasonable fee.' Agreeing or charging alone violates the rule. Client consent doesn't make an unreasonable fee reasonable.", "r": "MR 1.5(a); Outline VIII-B"},
{"t": "fee", "q": "Which is NOT a factor listed in Rule 1.5(a) for determining whether a fee is reasonable?", "a": ["The client's ability to pay.", "The fee customarily charged in the locality for similar legal services.", "The time limitations imposed by the client or by the circumstances.", "Whether the fee is fixed or contingent."], "e": "The eight factors: (1) time, labor, novelty, difficulty, and skill; (2) the likelihood, if apparent to the client, that the work precludes other employment; (3) the customary local fee; (4) the amount involved and results obtained; (5) time limitations; (6) the nature and length of the relationship; (7) the lawyer's experience, reputation, and ability; (8) whether the fee is fixed or contingent. Ability to pay isn't listed.", "r": "MR 1.5(a); Outline VIII-B; [S5:2]"},
{"t": "fee", "q": "A client signs a one-third contingent-fee agreement in a serious injury case with disputed liability. One week later, before Lawyer Kemp does much work, the insurer offers its $450,000 policy limit, and the case settles. The client argues the $150,000 fee is unreasonable. What is the most likely analysis?", "a": ["Reasonableness is judged as of the agreement, in light of the risk assumed, so a quick result isn't enough.", "The fee is unreasonable, because the lawyer worked only one week on the case before it settled for the limits.", "The fee must be converted, after the fact, to an hourly rate based on the time actually spent on the case.", "The fee is reasonable only if the lawyer can show that he would have won the case at trial."], "e": "Contingent fees compensate for risk, judged at the time of the agreement. A quick settlement doesn't make a reasonable agreement unreasonable, though grossly disproportionate fees in clearly no-risk cases can be challenged. Factor (8), fixed or contingent, is part of the analysis.", "r": "MR 1.5(a); Outline VIII-B"},
{"t": "fee", "q": "A client needs an emergency injunction filed within 48 hours. Lawyer Lane agrees in writing to charge 1.5 times her normal hourly rate, explaining that she must postpone other clients' work. Is the premium likely reasonable?", "a": ["Yes; time limits and preclusion of other work, if apparent to the client, support a premium agreed in advance.", "No, because a lawyer must charge the same hourly rate for all of her work, whatever its urgency.", "No, because handling urgent matters promptly is part of the ordinary duty of diligence and cannot be billed extra.", "Yes, but only if the client actually obtains the emergency injunction she sought."], "e": "1.5(a)(2) (preclusion of other employment, if apparent to the client) and (5) (time limitations) support rush premiums agreed in advance. Different rates for different kinds of work are fine.", "r": "MR 1.5(a)(2), (5); Outline VIII-B"},
{"t": "fee", "q": "A federal statute caps attorney's fees for representing claimants in a particular benefits program at 25% of past-due benefits. A client signs an agreement for a 33% fee. Which is correct?", "a": ["The statutory cap controls, so the lawyer may not charge or collect more than the cap.", "The fee agreement controls, because the client consented to the higher fee in a signed writing.", "The statutory cap is unenforceable as an antitrust violation under Goldfarb v. Virginia State Bar.", "The lawyer may charge the higher percentage if the case turned out to be unusually difficult."], "e": "Statutory fee caps (e.g., Social Security, the FTCA's 25%, workers' compensation, some medical-malpractice regimes) bind. Goldfarb held that bar-imposed minimum-fee schedules violated antitrust law, which is different from lawful legislative caps.", "r": "Outline VIII-B; [W5:12]"},
{"t": "fee", "q": "A divorce client offers Lawyer Moss 15% of the property settlement she obtains, in lieu of hourly fees, because she has no cash. Moss agrees in a signed writing and obtains a fair result. Is Moss subject to discipline?", "a": ["Yes, because a domestic-relations fee contingent on the property settlement is prohibited despite consent.", "No, because the client herself proposed the contingent arrangement and signed a writing agreeing to it after discussion.", "No, because the fee was reasonable in light of the fair result that Moss obtained for her.", "Yes, but only if the client later complains to the disciplinary authority about the fee."], "e": "1.5(d)(1) bars fees in domestic relations matters contingent on securing a divorce or on the amount of alimony, support, or property settlement in lieu thereof. The rationale is avoiding incentives against reconciliation (McCarthy v. Santangelo). Signatures and reasonableness don't cure it.", "r": "MR 1.5(d)(1); Outline VIII-B; [S5:6]"},
{"t": "fee", "q": "A former wife holds a final judgment awarding child support, but her ex-husband owes $40,000 in arrears. She hires Lawyer Nye to collect the arrears for 25% of whatever he recovers, in a signed writing. Is this permitted?", "a": ["Yes, because a contingent fee to collect post-judgment support arrears is not prohibited.", "No, because all contingent fees in domestic-relations matters are prohibited.", "No, because child support belongs to the child and cannot fund a lawyer's fee.", "Yes, but only if the contingent percentage is capped at 10% of the arrears."], "e": "1.5 cmt [6]: 1.5(d)(1) doesn't preclude a contingent fee to recover post-judgment balances due under support, alimony, or other financial orders, because such contracts don't implicate the same policy concerns. The fee must still be reasonable and comply with 1.5(c).", "r": "MR 1.5(d), cmt [6]; Outline VIII-B; [S5:11]"},
{"t": "fee", "q": "A defendant charged with fraud offers Lawyer Ortiz a $50,000 bonus if he is acquitted, in addition to a modest flat fee. Ortiz agrees in a signed writing. Is this proper?", "a": ["No, because a contingent fee for representing a criminal defendant is always prohibited.", "Yes, because most of the total fee is a flat fee that does not depend on the outcome.", "Yes, because the client agreed to the bonus in a writing that he signed.", "No, unless the bonus is reasonable in light of the stakes of the prosecution."], "e": "1.5(d)(2) prohibits contingent fees for representing criminal defendants. An acquittal bonus is a contingent fee, and the rationale is the danger of corrupting justice (Peyton v. Margiotti). Plaintiffs' civil contingency fees are fine.", "r": "MR 1.5(d)(2); Outline VIII-B"},
{"t": "fee", "q": "Lawyer Pell represents a plaintiff in a civil suit for damages arising out of a business dispute under a signed one-third contingent-fee agreement that satisfies Rule 1.5(c). The defendant argues that contingent fees are improper. Is the fee arrangement permissible?", "a": ["Yes, civil plaintiffs' contingent fees are generally permitted, subject to 1.5(a) and 1.5(c).", "No, because contingent fees are permitted only in personal-injury and wrongful-death cases.", "No, because contingent fees are prohibited whenever the client could afford to pay hourly rates.", "Yes, but only with the court's approval of the fee agreement before trial."], "e": "Civil contingent fees are permitted generally (1.5(c); 1.8(i)(2) permits a reasonable contingent fee in a civil case). The prohibitions are limited to domestic relations matters and criminal defense.", "r": "MR 1.5(c), 1.8(i)(2); Outline VIII-B"},
{"t": "fee", "q": "A client's contingent-fee agreement was never signed, and the lawyer obtained a $300,000 settlement. The client refuses to pay the agreed one-third. In most jurisdictions, what may the lawyer recover?", "a": ["At most a reasonable fee in quantum meruit, and in some states nothing at all.", "The full agreed one-third, because the client received the benefit of the lawyer's work.", "Nothing, in every jurisdiction, because the agreement was unenforceable.", "Double the agreed fee, as a penalty for the client's refusal to pay."], "e": "A fee agreement that fails formal requirements (e.g., no signed writing) is usually unenforceable as written, leaving quantum meruit at most. That's often a lodestar at a reasonable rate, which may be far below the contract, and in some states nothing. Prohibited fees (e.g., 1.5(d)) may be voidable and subject to disgorgement.", "r": "Outline VIII-C; [W5:13]"},
{"t": "fee", "q": "Under a valid one-third contingent-fee agreement, Lawyer Quill works 200 hours before the client fires him without cause. Successor counsel later wins $600,000. What is Quill most likely entitled to?", "a": ["The reasonable value of his services, usually payable only if the contingency occurs and capped by the contract.", "One-third of the $600,000 recovery, because he had a valid and enforceable contingent-fee contract.", "Nothing, because he was discharged before the case concluded and therefore never earned any part of the contingent fee.", "His hourly rate times the 200 hours he worked, payable immediately whether or not the case succeeds."], "e": "Clients may discharge lawyers at any time. A discharged lawyer usually recovers in quantum meruit, often capped at the contract price, and for contingent matters only if the contingency occurs. Fee terms that unduly burden the client's right to discharge are void.", "r": "Outline VIII-C; MR 1.16 cmt [4]"},
{"t": "fee", "q": "A business client pays Lawyer Rho a $20,000 'nonrefundable retainer' labeled as covering 'all work on the pending lawsuit.' Rho deposits it in her operating account. One month later, with $5,000 of work done, the client fires her and asks for the balance. Which is correct?", "a": ["It's an advance for future services despite the label, so it belonged in trust, and the unearned part must be refunded.", "It's a true retainer, which was earned in full at the moment the client paid it to Rho.", "The 'nonrefundable' label controls, because the client agreed to it in a signed writing at the outset of the engagement.", "Rho may keep all of it, because the client fired her without cause before the lawsuit ended."], "e": "Labels don't control. A 'true' retainer buys the lawyer's availability and is earned on receipt (and some states ban or restrict it, Op. 505). A payment for future services is an advance that belongs to the client until earned, must be held in trust (1.15(c)), and must be refunded to the extent unearned (1.16(d)).", "r": "MR 1.15(c), 1.16(d); Outline VIII-D; [S5:23–24]"},
{"t": "fee", "q": "A corporation pays Lawyer Sato $10,000 per year solely to ensure Sato will be available and won't represent its competitors. Work Sato actually does is billed separately at hourly rates. In a state that permits such arrangements, how should Sato treat the $10,000?", "a": ["As a true retainer earned on receipt, which may go to operating, ideally documented in a signed writing.", "As an advance fee that must remain in the trust account until hourly work is actually performed and billed against it.", "As client property that must be refunded at the end of each year if Sato performed no work.", "As a prohibited fee, because lawyers may not be paid merely for being available."], "e": "A true (classic) retainer compensates availability, not services, and is earned on receipt. It's rare. Some states forbid it or require a signed writing stating with particularity what's purchased, when it's earned, and whether it's refundable.", "r": "Outline VIII-D; [S5:23]"},
{"t": "fee", "q": "Lawyer Tan requires an 'evergreen' deposit of $5,000. What does that mean in practice?", "a": ["The client's deposit stays in trust, is drawn down as fees are earned, and is replenished after each draw.", "The deposit becomes the lawyer's money as soon as it is paid, and it never needs to be refunded to the client at the end.", "The deposit earns interest that is payable to the lawyer as additional compensation.", "The deposit may be used for any client's matter, as the lawyer's needs require."], "e": "An evergreen retainer is a security deposit the client replenishes after draws. It remains the client's money until earned, stays in trust, and any unearned balance is refunded at the end.", "r": "Outline VIII-D; [S5:24]"},
{"t": "fee", "q": "Lawyer Ulm offers a client a flat fee of $3,000 to handle a commercial lease dispute 'up to $3,000 of work,' knowing the dispute will probably require much more. He plans to tell the client mid-litigation that more money is needed or he'll stop. Which is most accurate?", "a": ["Improper unless adequately explained, because fee terms may not induce the lawyer to curtail services mid-matter.", "Proper, because the client can always find another lawyer if Ulm stops working when the money runs out.", "Proper, because flat fees are always permissible as long as the amount is stated in advance.", "Improper, because a flat fee must always cover all the work the matter turns out to require, regardless of the scope stated."], "e": "1.5 cmt [5]: an agreement may not have terms that might induce the lawyer to improperly curtail services. A lawyer shouldn't cap services at a stated amount when more extensive services are foreseeable, unless the situation is adequately explained. Defining services in light of the client's ability to pay is fine, and hourly lawyers shouldn't use wasteful procedures.", "r": "MR 1.5 cmt [5]; Outline VIII-A; [S5:10, 15]"},
{"t": "fee", "q": "Lawyer Vale refers a complex case to Lawyer Wu at another firm. Vale does no work and assumes no responsibility for the matter. Wu agrees to pay Vale one-third of the fee. The client is told orally and doesn't object. Is the fee division proper under the Model Rules?", "a": ["No; a division needs proportional work or joint responsibility, plus written client agreement to each share.", "Yes, because the client was told about the division orally and did not object to it.", "Yes, because referral fees between lawyers are permitted whenever the total fee paid by the client is reasonable.", "No, because fee divisions between lawyers in different firms are never permitted under the Model Rules."], "e": "1.5(e): (1) proportional to services performed or each lawyer assumes joint responsibility; (2) the client agrees to the arrangement, including each lawyer's share, confirmed in writing; (3) the total fee is reasonable. A pure referral fee with no work and no joint responsibility fails, and a few states allow pure referral fees, but most don't.", "r": "MR 1.5(e); Outline VIII-E; [S5:7, 25]"},
{"t": "fee", "q": "Lawyer Xu refers a case to Lawyer Yee at another firm. Xu agrees in writing to assume joint responsibility for the representation, takes 30% of the fee, and does little work. The client agrees in writing to the split and each share, and the total fee is reasonable. What does 'joint responsibility' mean for Xu?", "a": ["Financial and ethical responsibility as if the lawyers were partners, which can expose Xu to liability for Yee's malpractice.", "An obligation to perform at least half of the work on the matter himself, in proportion to his share.", "Merely vouching for Yee's competence, without any financial exposure.", "No further responsibility once he has referred the case to Yee."], "e": "1.5 cmt [7]: joint responsibility means financial and ethical responsibility as if the lawyers were associated in a general partnership. It's effectively an unconditional guarantee, often without insurance coverage. That's why it legitimizes a division not proportional to work.", "r": "MR 1.5(e) & cmt [7]; Outline VIII-E"},
{"t": "fee", "q": "Lawyer Zane pays a nonprofit lawyer-referral service its usual, reasonable charges for including him on its panel. Separately, he gives a local accountant who refers clients to him a 5% cut of each referred client's fee. Which payment is permitted?", "a": ["Only the referral-service charges, because paying others for recommendations is otherwise prohibited.", "Both, because each of these payments helps members of the public find a qualified lawyer for their problems.", "Only the accountant's cut, because it is tied to fees that clients actually paid.", "Neither, because lawyers may never pay anything for referrals of any kind."], "e": "7.2(b): a lawyer shall not give anything of value for recommending the lawyer's services, except (among others) the reasonable cost of advertising, the usual charges of a legal service plan or a nonprofit or qualified lawyer referral service, the purchase of a practice under 1.17, non-exclusive and disclosed reciprocal referral agreements, and nominal gifts. A percentage of fees to an accountant also violates 5.4(a).", "r": "MR 7.2(b), 5.4(a); Outline VIII-E"},
{"t": "fee", "q": "Lawyer Ames and a financial planner agree to refer clients to each other. The agreement isn't exclusive, involves no payment, and clients are told about it. Is this permitted?", "a": ["Yes, if the reciprocal agreement isn't exclusive and clients are informed of it.", "No, because lawyers may not have any referral relationship with nonlawyer professionals at all.", "Yes, but only if the financial planner is also a lawyer admitted in the same state.", "No, because reciprocal referral agreements are prohibited by Rule 5.4's limits on nonlawyers."], "e": "7.2(b)(4) permits non-exclusive reciprocal referral agreements with lawyers or nonlawyer professionals if clients are informed. The lawyer must still exercise independent judgment in each referral.", "r": "MR 7.2(b)(4); Outline VIII-E"},
{"t": "fee", "q": "A former client refers a friend to Lawyer Burke. Burke sends the former client a $25 gift card and a thank-you note. No gift had been promised or expected. Is this permitted?", "a": ["Yes, because nominal thank-you gifts not expected as payment for referrals are permitted.", "No, because anything of value given in connection with a referral is prohibited.", "Yes, but only if the referred friend actually becomes a paying client.", "No, unless the former client who made the referral is also a lawyer."], "e": "7.2(b)(5) allows nominal gifts that aren't intended or reasonably expected as payment for recommending the lawyer. A pre-arranged reward or one tied to fees would cross the line.", "r": "MR 7.2(b)(5); Outline VIII-E"},
{"t": "fee", "q": "Paralegal Cruz persuades a neighbor injured in a crash to hire Lawyer Dahl. Dahl pays Cruz a bonus equal to 10% of the fee earned on that case. Which Rules are violated?", "a": ["Rule 5.4(a), for sharing fees with a nonlawyer, and Rule 7.2(b), for paying for a recommendation.", "Neither, because Cruz is the lawyer's own employee rather than an outside referral source.", "Only Rule 1.5(e), because the lawyer divided part of his fee with another person.", "Only Rule 5.3, because Cruz is a nonlawyer assistant whom Dahl must supervise."], "e": "A case-specific bonus measured by fees violates 5.4(a), and paying for the recommendation violates 7.2(b). Even a flat case-specific bonus for bringing in a client violates 7.2(b). Compensation or retirement plans for nonlawyer staff that include profit-sharing are permitted (5.4(a)(3)).", "r": "MR 5.4(a), 7.2(b); Outline VIII-E trap"},
{"t": "fee", "q": "Lawyer Ely's firm pays its paralegals and secretaries an annual bonus from a retirement plan funded by a percentage of the firm's overall profits. Is this permitted?", "a": ["Yes, because nonlawyer employees may be included in a compensation or retirement plan based on profit-sharing.", "No, because any profit-sharing arrangement with nonlawyers is prohibited fee-sharing under Rule 5.4.", "Yes, but only if each employee's bonus is a fixed dollar amount unrelated to the firm's profits.", "No, unless the firm's clients consent in writing to the arrangement."], "e": "5.4(a)(3) expressly permits including nonlawyer employees in compensation or retirement plans based on profit-sharing. What's prohibited is sharing fees from particular matters with nonlawyers or paying them for referrals.", "r": "MR 5.4(a)(3); Outline VIII-E; [S5:26]"},
{"t": "fee", "q": "Lawyer Fay dies. Her partners agree to pay her widow, who is not a lawyer, a portion of the firm's fees for three years. In a separate transaction, Lawyer Gil buys the practice of a lawyer who became disabled and pays the purchase price to the disabled lawyer's guardian. Which arrangements are permitted under Rule 5.4(a)?", "a": ["Both, because payments to a deceased lawyer's estate and the price of a disabled lawyer's practice are excepted.", "Neither, because both arrangements involve sharing legal fees with people who are not lawyers, which Rule 5.4(a) forbids.", "Only the payments to the widow, because she is the deceased lawyer's family member.", "Only the purchase of the disabled lawyer's practice, because it is a sale under Rule 1.17."], "e": "5.4(a)(1) permits payments over a reasonable time after a lawyer's death to her estate or specified persons. 5.4(a)(2) permits paying the purchase price of a deceased, disabled, or disappeared lawyer's practice under 1.17.", "r": "MR 5.4(a)(1)–(2); Outline VIII-E"},
{"t": "fee", "q": "A nonprofit legal-aid organization recommends Lawyer Hu to a tenant. Hu wins a civil-rights case, and the court awards statutory attorney's fees. Hu wants to share the court-awarded fee with the nonprofit. May he?", "a": ["Yes, because court-awarded fees may be shared with a nonprofit that recommended the lawyer.", "No, because legal fees may never be shared with any organization that isn't a law firm.", "Yes, but only if the client consents to the sharing in a signed writing.", "No, because court-awarded fees belong to the client rather than to the lawyer."], "e": "5.4(a)(4) permits sharing court-awarded legal fees with a nonprofit that employed, retained, or recommended the lawyer in the matter.", "r": "MR 5.4(a)(4); Outline VIII-E"},
{"t": "fee", "q": "Lawyer Ivy wants to form a firm with an accountant, splitting ownership 50/50, with the accountant on the management committee. Clients would consent in writing. Is this permitted under the Model Rules?", "a": ["No; a lawyer may never practice in a firm with nonlawyer owners or managers, whatever clients consent to.", "Yes, because the firm's clients consented in writing to the accountant's ownership interest and management role.", "Yes, so long as the accountant never gives legal advice to any of the firm's clients.", "No, unless the accountant passes the MPRE and agrees to be bound by the Rules of Professional Conduct."], "e": "5.4(b) and (d) prohibit partnerships with nonlawyers that practice law, nonlawyer ownership, and nonlawyer control. The policy is protecting independent judgment, though the book calls it hard to justify apart from guild protection. D.C. and some states are experimenting. Client consent is irrelevant.", "r": "MR 5.4(b), (d); Outline VIII-E, X"},
{"t": "fee", "q": "Partners Jo and Kim, in the same firm, agree that Jo will receive 70% of the fee from a matter Kim handles because Jo brought in the client. The client isn't told. Is this proper?", "a": ["Yes; lawyers in the same firm may divide fees on any terms without disclosure, since 1.5(e) doesn't apply.", "No, because the client must consent in writing to any division of the fee, even within a single firm.", "No, because fees must be divided in proportion to the services each lawyer actually performed.", "Yes, but only if Jo assumes joint responsibility for the matter that Kim is handling."], "e": "1.5(e) governs divisions between lawyers not in the same firm. Within a firm, compensation can be allocated on any basis (origination credit, etc.) without client disclosure (special rules apply when a lawyer is screened).", "r": "MR 1.5(e); Outline VIII-E"},
{"t": "fee", "q": "Lawyer Lux pays her office rent, which includes a percentage-of-gross-revenue term common in that building, to her nonlawyer landlord. A colleague says this is impermissible fee-sharing. Is the colleague likely right?", "a": ["Likely not; paying rent from fee revenue is generally not fee-sharing, though percentage terms deserve caution.", "Yes, because any payment to a nonlawyer that is measured by the firm's gross revenue violates Rule 5.4(a).", "Yes, because landlords may never receive payments from law firms that depend on the firm's income.", "No, because Rule 5.4 applies only to partnerships between lawyers and nonlawyers."], "e": "'Sharing' means paying nonlawyers amounts measured by the fees from particular matters, or profits, in ways that threaten independence. Ordinary business payments made from fee revenue generally aren't fee-sharing. Ethics opinions vary on percentage rents, so caution is warranted.", "r": "MR 5.4(a); Outline VIII-E"},
{"t": "fee", "q": "Lawyer Moe bills a client for 9.5 hours on a day he actually worked 6 hours on the client's matter, reasoning that the result justified it. The client pays. What consequences may Moe face?", "a": ["Discipline for an unreasonable fee and dishonesty, possible disgorgement, and possible mail or wire fraud liability.", "None, because the client paid the bill without objecting to the hours that were charged.", "Only a fee reduction, and only if the client later complains about the bill.", "None, because billing based on the value of the result obtained is always permitted, whatever the hours recorded."], "e": "Billing work not done is fraud. It violates 1.5(a) and 8.4(c), can support disgorgement, and may be criminal (mail or wire fraud federally). Hourly billing requires accurate, contemporaneous time records. Value-based pricing must be agreed in advance, not disguised as hours.", "r": "MR 1.5(a), 8.4(c); Outline VIII-A, VIII-C; [S5:22]"},
{"t": "fee", "q": "A client pays Lawyer Nash by transferring a 5% interest in her family business, fairly valued, as the fee for drafting a supply contract. Nash gives the client written advice to consult independent counsel and obtains her signed consent to terms set out in writing. Has Nash satisfied the most relevant Rules?", "a": ["Likely yes; property may be a reasonable fee, and when it's like a business deal, Rule 1.8(a) must be met.", "No, because lawyers may accept only money, not property, as payment for legal services.", "No, because accepting an ownership interest in a client's business always creates a nonconsentable conflict of interest.", "Yes, and no further requirements apply because the work was transactional rather than litigation."], "e": "1.5 cmt [4] permits property as a fee, including an ownership interest, unless it's a proprietary interest in the subject of litigation (1.8(i)). Such fees often trigger 1.8(a). Nash complied with its written-disclosure, independent-counsel advice, and signed-consent requirements.", "r": "MR 1.5 cmt [4], 1.8(a), 1.8(i); Outline VIII-A, IV-C"},
{"t": "prop", "q": "Lawyer Abe receives a $5,000 advance for future fees and, for convenience, deposits it in his operating account, intending to transfer it to trust the next day. He forgets for a week, then moves it. The full $5,000 was always there, and no client was harmed. Has Abe violated Rule 1.15?", "a": ["Yes; advance fees belong in trust, and commingling is a violation even if brief and harmless.", "No, because the full $5,000 was available at all times and the client lost nothing from the brief delay in moving it.", "No, because the advance became the lawyer's own money as soon as the client paid it to him.", "Yes, but only if the client complains to the disciplinary authority about where the money was deposited."], "e": "1.15(c) requires advance fees and expenses to be deposited in trust and withdrawn only as earned or incurred. Commingling client money with the lawyer's own is a violation in itself, with no loss required. 'Substantial compliance' is hardly ever enough.", "r": "MR 1.15(a), (c); Outline VIII-F; [S5:24]"},
{"t": "prop", "q": "Lawyer Bly keeps one client trust account in which she holds funds for 30 different clients, with a separate ledger for each client showing deposits, disbursements, and balances. Is this permissible?", "a": ["Yes, pooling clients' funds is fine with per-client records, so long as none of the money is the lawyer's.", "No, because each client's money must be kept in a separate trust account opened in that client's name.", "No, because a pooled account containing many clients' money is itself a form of prohibited commingling.", "Yes, but only if each of the thirty clients consents in writing to having its funds held in a pooled account."], "e": "Pooling multiple clients' funds in one trust account is common and permitted with proper individual ledgers. What's prohibited is mixing the lawyer's money with client money (beyond the bank-charge allowance).", "r": "MR 1.15(a); Outline VIII-F; [S5:38]"},
{"t": "prop", "q": "To avoid overdrafts, Lawyer Cho deposits $10,000 of her own money into her client trust account as a 'cushion.' Monthly bank fees are about $30. Is this proper under the Model Rules?", "a": ["No; her own money may be in trust only in the amount needed to pay bank service charges.", "Yes, because protecting clients from overdrafts on the trust account is plainly in their interest.", "Yes, because the money is clearly labeled on the firm's books as the lawyer's own funds.", "Yes, so long as she withdraws the cushion within thirty days after depositing it."], "e": "1.15(b) permits the lawyer's own funds in trust only to pay bank service charges, and only in the amount necessary: 'top off the tank, don't overfill it.' Delaware sets a $2,000 ceiling that must be separately accounted for.", "r": "MR 1.15(b); DE Rule 1.15(a); Outline VIII-F; [S5:39, 41]"},
{"t": "prop", "q": "A Delaware lawyer keeps $1,500 of his own money in his trust account to cover bank charges and records it on a separate ledger. Is this consistent with Delaware's rule?", "a": ["Yes; Delaware allows the lawyer's own funds for bank charges up to $2,000 if separately accounted for.", "No, because Delaware prohibits a lawyer from keeping any of his own funds in a client trust account.", "No, because Delaware caps a lawyer's own funds in a trust account at $500, the amount needed for typical bank charges.", "Yes, and he could keep any amount at all, so long as it is separately stated and accounted for."], "e": "Delaware's Rule 1.15(a) caps the lawyer's own funds for bank charges at $2,000 and requires separate accounting. Delaware also requires the account to be designated for funds held in connection with the practice of law in Delaware, and records kept for five years after the events they record.", "r": "DE Rule 1.15(a); Outline VIII-F; [S5:39, 41]"},
{"t": "prop", "q": "Lawyer Dee holds a $20,000 advance. On March 1 she bills $6,000 for February work, and the client doesn't object. She leaves the $6,000 in trust until December because 'it's safer there.' Which statement is most accurate?", "a": ["Leaving earned fees in trust too long is commingling; earned fees should be withdrawn promptly.", "It's proper, because keeping extra money in the trust account can only protect the client.", "It's proper, so long as the lawyer's records accurately track which portion of the balance is earned.", "It's improper only if the trust account earns interest that would otherwise go to the lawyer."], "e": "Once fees are earned (as defined in the agreement), move them promptly to operating. Too early is misappropriation, and too late is commingling. Both violate 1.15.", "r": "MR 1.15(a), (c); Outline VIII-F"},
{"t": "prop", "q": "Lawyer Ely holds a client's $15,000 advance. Facing a cash crunch, she withdraws $5,000 before earning it, planning to 'put it back' when another client pays. She replaces it two weeks later, before anyone notices. Has she violated the Rules?", "a": ["Yes; taking unearned client funds is always misappropriation, whatever she intended and despite repayment.", "No, because she replaced the full amount before any client was harmed or even noticed that the withdrawal had occurred.", "No, because the money would eventually have been earned as she worked on the client's matter.", "Yes, but it is only a minor technical violation that would warrant no sanction once repaid."], "e": "Advance fees may be withdrawn only as earned (1.15(c)). Taking them early is misappropriation, usually treated severely (often disbarment), and 'we'll put it back' never cures it. It's also dishonest (8.4(c)) and possibly criminal.", "r": "MR 1.15(c), 8.4(c); Outline VIII-F"},
{"t": "prop", "q": "Lawyer Fox receives a single $100,000 settlement check payable to Fox 'as trustee' for a client. Part represents his fee, and part belongs to the client. Where should Fox deposit it?", "a": ["In trust; after it clears, promptly move his earned share to operating and pay the client.", "In his operating account, then write the client a check from operating for her share.", "Split the deposit between operating and trust at the bank window when he deposits it.", "In his personal savings account until the client signs a release of all claims."], "e": "Mixed funds go into trust. Wait until the check clears, then promptly move the lawyer's share and disburse the client's share. Depositing in operating commingles, and conditioning payment on a release violates 1.15 and possibly 1.8(h).", "r": "MR 1.15(a), (d); Outline VIII-F; [S5:42–43]"},
{"t": "prop", "q": "A 30% contingent fee is calculated after costs are taken 'off the top.' The case settles for $100,000, and the lawyer advanced $10,000 in costs. How much of the settlement belongs to the lawyer?", "a": ["$37,000.", "$30,000.", "$40,000.", "$27,000."], "e": "Costs reimbursed: $10,000. Fee: 30% × ($100,000 − $10,000) = $27,000. Lawyer's total: $37,000; client gets $63,000. Deposit the whole check in trust, bill the client (giving a chance to object), then move the $37,000 to operating.", "r": "Outline VIII-F class example; [S5:43]"},
{"t": "prop", "q": "A new 'client' emails Lawyer Gil from overseas, retains him to collect a debt, and soon sends a $200,000 cashier's check from the 'debtor.' The client urgently asks Gil to wire $180,000 to an overseas account the next day. The bank shows the funds as 'available.' What should Gil do?", "a": ["Wait until the bank confirms the check has actually cleared, because provisional credit can be reversed.", "Wire the funds immediately, because the bank already shows the deposited funds as available in the account.", "Wire the funds from his operating account rather than trust, so that other clients' money is protected.", "Wire half of the requested amount now and the other half once the check has fully cleared the bank."], "e": "This is the classic retainer or collection scam: a counterfeit cashier's check, then an urgent wire. Provisional credit can be charged back, leaving the trust account short and other clients' money stolen. Disburse only good funds (cash, cleared checks), and when in doubt, call the bank.", "r": "MR 1.15; Outline VIII-F; [S5:44]"},
{"t": "prop", "q": "Lawyer Hu's trust account holds $5,000 for Client A and nothing for Client B. Client B owes a $400 court reporter bill, and Hu pays it from the trust account, planning to collect from Client B later. Is this proper?", "a": ["No; a client's expenses may be paid only from that client's funds, so this uses Client A's money.", "Yes, because the trust account is pooled, so any balance in it may be used for any client's expenses.", "Yes, so long as Hu reimburses the trust account from his own funds within thirty days.", "Yes, because court reporter fees are ordinary litigation expenses that clients must pay."], "e": "Each client's money is that client's. Disbursing on behalf of a client with no balance is misappropriation of another client's funds. Never pay your own bills (e.g., bar dues) from trust either.", "r": "MR 1.15; Outline VIII-F"},
{"t": "prop", "q": "Lawyer Ivy holds $10,000 in trust for a client. She bills $4,000; the client disputes $1,000 of the bill and fires her. What must Ivy do now?", "a": ["Withdraw the undisputed $3,000, hold the disputed $1,000 in trust, and promptly refund $6,000.", "Keep the entire $10,000 in trust until the fee dispute with the client is finally resolved.", "Withdraw the full $4,000, because her contemporaneous billing records support every hour charged.", "Refund the entire $10,000, because a lawyer who is fired forfeits any fee earned before discharge."], "e": "1.15(e): keep disputed property separate until resolved and promptly distribute the undisputed portions. 1.16(d) requires refunding unearned advances. No self-help, and no holding undisputed money as leverage (cmt [3]). Suggest arbitration or another prompt resolution.", "r": "MR 1.15(e), 1.16(d); Outline VIII-F worked allocation"},
{"t": "prop", "q": "A 25% contingent fee is calculated after costs. The case settles for $100,000, and costs are $4,000. The client disputes $6,000 of the fee. What is the proper distribution now?", "a": ["$18,000 fee and $4,000 costs to operating, $6,000 held in trust, $72,000 to the client, plus a closing statement.", "$24,000 fee and $4,000 costs to the lawyer immediately, and $72,000 to the client, because the fee was earned.", "Hold the entire $100,000 in trust until the dispute over the fee is finally resolved by agreement or arbitration.", "$18,000 to the lawyer and $82,000 to the client, because disputed amounts must be paid to the client."], "e": "Fee base: $100,000 − $4,000 = $96,000; fee = 25% × $96,000 = $24,000. Disputed: $6,000 stays in trust. Undisputed fee ($18,000) and costs ($4,000) go to operating. The client's undisputed share ($96,000 − $24,000 = $72,000) is paid promptly, with a 1.5(c) closing statement.", "r": "MR 1.15(e), 1.5(c); Outline VIII-F worked allocation"},
{"t": "prop", "q": "A client disputes Lawyer Jun's fee, and Jun is holding the client's $50,000 settlement in trust. Jun tells the client he will release her undisputed $40,000 only if she signs a release of any malpractice claims and agrees to his full fee. Is this proper?", "a": ["No, because undisputed funds may not be held to coerce a client into accepting the lawyer's position.", "Yes, because a lawyer is entitled to protect his fee by holding all of the client's funds until it is paid.", "Yes, because the funds are held in trust and are therefore safe while the dispute is being resolved.", "No, but only because a malpractice release obtained this way would be unenforceable against the client."], "e": "1.15 cmt [3]: the lawyer may not hold funds to coerce a client into accepting the lawyer's contention. Undisputed amounts must be promptly distributed, and only the disputed portion stays in trust. The release demand also implicates 1.8(h)(2).", "r": "MR 1.15(e) & cmt [3], 1.8(h); Outline VIII-F; [S5:35]"},
{"t": "prop", "q": "Lawyer Kemp settles a client's personal-injury case. A hospital has a valid statutory lien on the proceeds for the client's medical bills. The client insists Kemp pay her everything and ignore the hospital. What must Kemp do?", "a": ["Notify the hospital, hold the disputed amount, distribute what's undisputed, and consider interpleader.", "Pay the client everything she is owed under the settlement, because the client is the lawyer's only principal.", "Pay the hospital everything it claims, because valid liens always take priority over the client.", "Return the settlement to the defendant until the client and the hospital resolve their dispute."], "e": "1.15(d)–(e) and cmt [4]: a lawyer may have a duty to third persons with a lawful claim to funds (e.g., a statutory lien). The lawyer must promptly notify anyone with an interest, including anyone with a colorable claim, hold the disputed portion, and may file an interpleader action. He can't unilaterally decide the dispute.", "r": "MR 1.15(d)–(e) & cmt [4]; Outline VIII-F; [S5:45–46]"},
{"t": "prop", "q": "Lawyer Lane receives a $3,000 retainer that will be used within a few weeks, and separately a $500,000 escrow that will sit for 18 months pending a closing. How should she handle the interest on each?", "a": ["Small and short-term funds go to IOLTA; large or long-term funds go in a separate account for the client.", "Both deposits belong in the IOLTA account, because all client funds must be held in IOLTA by law.", "Both belong in separate interest-bearing accounts, with all of the interest paid to the lawyer as compensation.", "Neither may earn interest, because client funds must always be held in non-interest-bearing accounts."], "e": "Nominal or short-term funds that can't earn net interest for the client go into IOLTA, whose interest funds legal services for the poor or client-protection funds. Funds that can earn meaningful net interest belong in a separate account for the client.", "r": "Outline VIII-F IOLTA; [S5:40]"},
{"t": "prop", "q": "An auditor reviewing Lawyer Moss's trust account finds every client dollar present. But Moss has not reconciled the account in two years, keeps no individual client ledgers, and can't reconstruct which deposits belong to whom without weeks of work. Is Moss subject to discipline?", "a": ["Yes, because incomplete trust records are always a violation, even if every dollar is present.", "No, because every client dollar is present and accounted for in the trust account, which is what the rule protects.", "No, because recordkeeping requirements for trust accounts are merely advisory guidelines.", "Yes, but only if one of the firm's clients was actually harmed by the poor records."], "e": "Imperfect records are a violation in themselves (the 'Al Capone problem'). Complete records of trust funds and property must be kept, and preserved for five years after the representation ends (in Delaware, five years after the events they record). Many states require monthly three-way reconciliation, and banks report trust overdrafts to the bar.", "r": "MR 1.15(a); Outline VIII-F; [S5:47–48]"},
{"t": "prop", "q": "Lawyer Nye delegated all trust accounting to a long-trusted bookkeeper with impeccable references. Nye never reviewed bank statements. The bookkeeper embezzled $80,000 of client funds in a scheme Nye could not have anticipated. Is Nye responsible?", "a": ["Yes; the trust duties are nondelegable, so the lawyer remains responsible and must supervise and verify.", "No, because the theft was a third party's unforeseeable crime that no reasonable lawyer could have prevented.", "No, because Nye reasonably selected a qualified bookkeeper with impeccable references.", "Yes, but only for discipline, and not for any financial liability to the affected clients."], "e": "'Delegate; don't abdicate. Trust, but verify.' The trust-account duties are nondelegable. Lawyers may use staff, but they remain responsible. Supervisory duties under 5.3 also require reasonable oversight, such as reviewing statements and reconciliations.", "r": "MR 1.15, 5.3; Outline VIII-F"},
{"t": "prop", "q": "A client delivers to Lawyer Ortiz a box containing bearer bonds, original deeds, and a disputed painting that is evidence in the case. How should Ortiz handle these items?", "a": ["Identify and safeguard them as a professional fiduciary would, e.g., in a safe, and keep records of their handling.", "Store them in the office supply room, because only client money, not other property, must be safeguarded.", "Deposit the bearer bonds in the trust account and return the deeds and painting to the client immediately.", "Sell the bearer bonds and hold the proceeds in trust, because cash is easier to safeguard than securities."], "e": "'Property' includes documents and physical evidence as well as money. Other property must be identified and appropriately safeguarded with the care of a professional fiduciary (1.15 cmt [1]). Bearer bonds are as good as cash, so they belong in a safe or safe-deposit box. Records of tangible property must also be kept.", "r": "MR 1.15(a) & cmt [1]; Outline VIII-F; [S5:27, 37, 47]"},
{"t": "prop", "q": "Lawyer Penn's only office is in Delaware. A client in another state asks him to hold escrow funds. Without asking the client, Penn deposits the funds in a trust account he maintains in Pennsylvania, where he gets better service. Under Model Rule 1.15(a), is this permissible?", "a": ["No; trust funds belong in the state where the office is, or elsewhere only with consent.", "Yes, because the lawyer may choose any bank in any state for his client trust account.", "Yes, because the client lives out of state and the funds are held for an out-of-state matter.", "No, because escrow funds may never be held in a lawyer's client trust account."], "e": "1.15(a): funds shall be kept in a separate account maintained in the state where the lawyer's office is situated, or elsewhere with the consent of the client or third person.", "r": "MR 1.15(a); Outline VIII-F"},
{"t": "prop", "q": "Lawyer Quill receives a $40,000 settlement payment on a client's behalf. He doesn't tell the client for two months while he 'gets around to the paperwork,' and then pays her. Which duty did Quill breach?", "a": ["The duty to promptly notify the client on receiving funds and to promptly deliver what she's owed.", "No duty, because the client was ultimately paid in full and lost nothing from the two-month delay.", "Only the duty to account, which arises once the client asks the lawyer for an accounting.", "The duty to deposit client funds in an IOLTA account rather than a separate trust account."], "e": "1.15(d): upon receiving funds or property in which a client or third person has an interest, promptly notify, promptly deliver what they're entitled to, and on request promptly render a full accounting.", "r": "MR 1.15(d); Outline VIII-F; [S5:33]"},
{"t": "prop", "q": "A client asks Lawyer Rho for a full accounting of all funds held for her. Rho's trust records show transactions for many clients. What should the accounting include?", "a": ["A full accounting of her own funds, without disclosing other clients' confidential information.", "Copies of the entire trust account bank statements, including other clients' transactions.", "Only the current balance held for her in the trust account, because transaction details are the lawyer's own records.", "Nothing at all, unless a court orders the lawyer to provide an accounting."], "e": "1.15(d) requires a full accounting on request. Lawyers must provide the client's own transaction history while protecting other clients' confidential information (1.6).", "r": "MR 1.15(d), 1.6; Outline VIII-F; [S5:49]"},
{"t": "prop", "q": "Lawyer Sol commingled $2,000 of a client's money in his operating account for three weeks, then restored it to trust. The client suffered no loss. The client sues Sol for damages. What is the likely result?", "a": ["The civil claim likely fails without monetary loss, though Sol remains subject to discipline.", "The client recovers the full $2,000 as statutory damages for the commingling.", "The client recovers punitive damages automatically, because commingling client funds is an intentional wrong.", "Sol is neither civilly liable nor subject to discipline, because no loss occurred."], "e": "Commingling violates 1.15 without any loss, so discipline is available. Civil liability ordinarily requires monetary loss, though disgorgement of any benefit (e.g., interest earned) may be available.", "r": "MR 1.15; Outline VIII-F; [S5:37]"},
{"t": "prop", "q": "Lawyer Tate's trust account check bounces because of a bookkeeping error. Under rules in most states, what is likely to happen?", "a": ["The bank will report the overdraft to disciplinary authorities, which may investigate.", "Nothing, because the overdraft resulted from an inadvertent bookkeeping error.", "The bank will close all of the lawyer's business and personal accounts.", "The client whose check bounced must report the overdraft to the bar."], "e": "Most states require banks holding trust accounts to report overdrafts to disciplinary counsel. Overdraft notices commonly trigger trust-account audits, where recordkeeping failures surface even if no money is missing.", "r": "Outline VIII-F"},
{"t": "prop", "q": "A client pays Lawyer Ulm $8,000 for 'costs to be incurred' (expert fees and deposition transcripts) for an upcoming trial. Ulm deposits it in his operating account because 'costs aren't fees.' Is this proper?", "a": ["No, because advance payments for expenses also go into trust and come out only as expenses are incurred.", "Yes, because only advance payments of fees, not of costs, must be deposited in a trust account.", "Yes, so long as Ulm spends the money only on that client's costs for the upcoming trial.", "No, because lawyers may never accept money from clients for costs before those costs have actually been incurred."], "e": "1.15(c) covers 'legal fees and expenses that have been paid in advance.' Both go into trust and are withdrawn only as fees are earned or expenses incurred.", "r": "MR 1.15(c); Outline VIII-F; [S5:32]"},
{"t": "prop", "q": "Which pairing best captures the course's 'green money / red money' framing of a lawyer's bank accounts?", "a": ["Operating holds the lawyer's earned money, which may be spent; trust holds others' money, which must be safeguarded.", "The trust account holds the lawyer's profits, and the operating account holds the clients' advances.", "Both accounts may be used interchangeably for paying expenses, so long as accurate records are kept for each client.", "Green money is the interest earned on IOLTA accounts, and red money is the lawyer's attorney's fees."], "e": "Green money (operating) is yours to spend. Red money (trust) isn't yours: safeguard it, segregate it, and account for it. Fiduciaries must be 'more than ordinarily careful.'", "r": "Outline VIII-F; [S5:29–36]"},
{"t": "reg", "q": "Lawyer Vu, admitted only in Maryland, expects to be retained in a Virginia lawsuit for which she intends to seek pro hac vice admission. Before filing, she spends a week in Virginia interviewing witnesses. A Virginia lawyer is co-counsel but is not involved in the interviews. Is Vu's pre-filing work permissible under Rule 5.5(c)?", "a": ["Yes; temporary work reasonably related to a potential proceeding where she expects to be admitted is permitted.", "No, because she must be admitted pro hac vice in Virginia before she may do any work on the matter there.", "No, because the Virginia co-counsel must actively participate in every task she performs in the state.", "Yes, because any lawyer in good standing may practice anywhere for up to thirty days a year."], "e": "5.5(c) gives alternative routes for temporary practice: (1) in association with an actively participating local lawyer; (2) in or reasonably related to a pending or potential proceeding where the lawyer is or reasonably expects to be authorized to appear (including pre-filing investigation); (3) ADR arising from home practice; (4) other work reasonably related to home practice. Vu fits (c)(2) without relying on (c)(1).", "r": "MR 5.5(c)(1)–(2); Outline I-C; [S1:39]"},
{"t": "reg", "q": "A federal bankruptcy judge's law clerk, who is also a licensed lawyer, asks which ethics rules govern her conduct at work. Which answer is most complete?", "a": ["Her state's Rules of Professional Conduct, plus the separate ethics rules for judicial employees.", "Only the ABA Model Rules, which govern every legal professional in every role and jurisdiction.", "Only the code of conduct for judicial employees, because state rules never apply to federal employees.", "No ethics rules at all, because a law clerk does not represent clients or appear before courts."], "e": "Groups such as judges, law clerks and other court staff, and bankruptcy and securities lawyers have their own ethics regimes in addition to state rules for lawyers. Federal employment doesn't exempt a licensed lawyer from state rules (compare the McDade Amendment for government attorneys).", "r": "Outline I-A; [S1:25]"}
];
const LETTERS = ["A","B","C","D"];
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem("prdrill3:"+k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem("prdrill3:"+k, JSON.stringify(v)); }catch(e){} }
};
const saved = store.get("settings") || {};
const S = {
  topics: new Set(Array.isArray(saved.topics) && saved.topics.length ? saved.topics : Object.keys(TOPICS)),
  mode: saved.mode === "exam" ? "exam" : "study",
  count: saved.count || "25",
  shuffleQ: saved.shuffleQ !== false,
  items: [],   // {qi, perm:[orig indices in display order], pick:null|origIndex}
  cur: 0,
  submitted: false,
  view: "quiz"
};
function saveSettings(){ store.set("settings",{topics:[...S.topics],mode:S.mode,count:S.count,shuffleQ:S.shuffleQ}); }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function newPerm(){ return shuffle([0,1,2,3]); }

function buildSet(fromList){
  let pool = fromList || QS.map((_,i)=>i).filter(i=>S.topics.has(QS[i].t));
  if(!fromList){
    if(S.shuffleQ) pool = shuffle(pool);
    if(S.count !== "all") pool = pool.slice(0, parseInt(S.count,10));
  } else if(S.shuffleQ) pool = shuffle(pool);
  S.items = pool.map(qi=>({qi, perm:newPerm(), pick:null}));
  S.cur = 0; S.submitted = false; S.view = "quiz";
  render();
}
function reletter(){
  S.items.forEach(it=>{ it.perm = newPerm(); it.pick = null; });
  S.cur = 0; S.submitted = false; S.view = "quiz";
  render();
}
const revealed = it => it.pick !== null && (S.mode === "study" || S.submitted);

// ───────── Rendering
const $ = id => document.getElementById(id);
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function renderChips(){
  const counts = {}; QS.forEach(q=>counts[q.t]=(counts[q.t]||0)+1);
  const allOn = S.topics.size === Object.keys(TOPICS).length;
  let h = `<button type="button" class="chip" id="chip-all" aria-pressed="${allOn}">All topics<span class="n">${QS.length}</span></button>`;
  for(const k in TOPICS) h += `<button type="button" class="chip" id="chip-${k}" data-t="${k}" aria-pressed="${S.topics.has(k)}">${TOPICS[k]}<span class="n">${counts[k]||0}</span></button>`;
  $("chips").innerHTML = h;
}
function renderScore(){
  const ans = S.items.filter(it=>it.pick!==null).length;
  const shown = S.items.filter(revealed);
  const right = shown.filter(it=>it.pick===0).length;
  $("score").innerHTML = S.mode==="study" || S.submitted
    ? `<b>${right}</b>/${shown.length} correct · ${ans}/${S.items.length} answered`
    : `${ans}/${S.items.length} answered`;
}
function renderGrid(){
  $("grid").innerHTML = S.items.map((it,i)=>{
    let c = "cell";
    if(revealed(it)) c += it.pick===0 ? " ok" : " bad";
    else if(it.pick!==null) c += " ans";
    if(i===S.cur && S.view==="quiz") c += " cur";
    return `<button type="button" class="${c}" data-i="${i}" aria-label="Question ${i+1}">${i+1}</button>`;
  }).join("");
}
function renderQuiz(){
  if(!S.items.length){ $("main").innerHTML = `<section class="sheet"><p class="empty">No questions match. Select at least one topic.</p></section>`; return; }
  const it = S.items[S.cur], q = QS[it.qi], show = revealed(it);
  const opts = it.perm.map((orig,pos)=>{
    let c = "opt";
    if(show){ if(orig===0) c+=" right"; else if(orig===it.pick) c+=" wrong"; }
    else if(orig===it.pick) c+=" sel";
    return `<li><button type="button" class="${c}" data-orig="${orig}" ${show?"disabled":""}><span class="let">${LETTERS[pos]}</span><span class="txt">${esc(q.a[orig])}</span></button></li>`;
  }).join("");
  let fb = "";
  if(show){
    const ok = it.pick===0, letter = LETTERS[it.perm.indexOf(0)];
    fb = `<div class="fb"><div class="verdict ${ok?"ok":"bad"}">${ok?"Correct":"Incorrect"}. The answer is ${letter}.</div><p class="expl">${esc(q.e)}</p><div class="cite">${esc(q.r)}</div></div>`;
  }
  const last = S.cur === S.items.length-1;
  const examEnd = S.mode==="exam" && !S.submitted;
  const answered = S.items.filter(x=>x.pick!==null).length;
  $("main").innerHTML = `<section class="sheet" aria-live="polite">
    <div class="meta"><span class="qn">Question ${S.cur+1} of ${S.items.length}</span><span>${TOPICS[q.t]}</span></div>
    <p class="stem">${esc(q.q)}</p>
    <ol class="opts">${opts}</ol>
    ${fb}
    <div class="nav">
      <button type="button" class="btn" id="prevBtn" ${S.cur===0?"disabled":""}>← Previous</button>
      <div class="btns">
        ${examEnd ? `<button type="button" class="btn" id="submitBtn">Grade exam (${answered}/${S.items.length})</button>` : ""}
        ${!examEnd && (S.mode==="study" && S.items.every(x=>x.pick!==null) || S.submitted) ? `<button type="button" class="btn" id="resultsBtn">See results</button>` : ""}
        <button type="button" class="btn primary" id="nextBtn" ${last?"disabled":""}>Next →</button>
      </div>
    </div>
    <div class="hint">Keys: <kbd>A</kbd>–<kbd>D</kbd> or <kbd>1</kbd>–<kbd>4</kbd> to answer, <kbd>←</kbd> <kbd>→</kbd> to move.</div>
  </section>`;
}
function renderResults(){
  const total = S.items.length, right = S.items.filter(it=>it.pick===0).length;
  const by = {};
  S.items.forEach(it=>{ const t=QS[it.qi].t; by[t]=by[t]||{n:0,r:0}; by[t].n++; if(it.pick===0) by[t].r++; });
  const rows = Object.keys(TOPICS).filter(k=>by[k]).map(k=>{
    const p = Math.round(100*by[k].r/by[k].n);
    return `<tr><td>${TOPICS[k]}</td><td class="num">${by[k].r}/${by[k].n}</td><td class="num">${p}%</td><td><div class="bar"><i style="width:${p}%"></i></div></td></tr>`;
  }).join("");
  const missed = S.items.filter(it=>it.pick!==0).length;
  $("main").innerHTML = `<section class="sheet results">
    <h2>Results</h2>
    <div class="row" style="align-items:baseline"><span class="big">${Math.round(100*right/total)}%</span><span class="score"><b>${right}</b> of ${total} correct${missed?` · ${missed} missed or skipped`:""}</span></div>
    <div class="tablewrap"><table><thead><tr><th>Topic</th><th style="text-align:right">Score</th><th style="text-align:right">%</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="btns">
      ${missed?`<button type="button" class="btn primary" id="retryBtn">Retry missed (${missed}) with new letters</button>`:""}
      <button type="button" class="btn" id="reviewBtn">Review answers</button>
      <button type="button" class="btn" id="againBtn">New shuffled set</button>
    </div>
  </section>`;
}
function render(){
  renderChips();
  $("modeStudy").setAttribute("aria-pressed", S.mode==="study");
  $("modeExam").setAttribute("aria-pressed", S.mode==="exam");
  $("count").value = S.count; $("shuffleQ").checked = S.shuffleQ;
  if(S.view==="results") renderResults(); else renderQuiz();
  renderGrid(); renderScore();
}

// ───────── Events
function choose(orig){
  const it = S.items[S.cur]; if(!it || revealed(it)) return;
  it.pick = orig; render();
}
function go(i){ if(i>=0 && i<S.items.length){ S.cur=i; S.view="quiz"; render(); } }

$("chips").addEventListener("click",e=>{
  const b = e.target.closest(".chip"); if(!b) return;
  if(b.id==="chip-all"){ S.topics = S.topics.size===Object.keys(TOPICS).length ? new Set() : new Set(Object.keys(TOPICS)); }
  else { const t=b.dataset.t; S.topics.has(t)?S.topics.delete(t):S.topics.add(t); }
  saveSettings(); buildSet();
});
$("modeSeg").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; S.mode=b.dataset.mode; saveSettings(); buildSet(); });
$("count").addEventListener("change",e=>{ S.count=e.target.value; saveSettings(); buildSet(); });
$("shuffleQ").addEventListener("change",e=>{ S.shuffleQ=e.target.checked; saveSettings(); buildSet(); });
$("startBtn").addEventListener("click",()=>buildSet());
$("reletterBtn").addEventListener("click",reletter);
$("grid").addEventListener("click",e=>{ const b=e.target.closest(".cell"); if(b) go(+b.dataset.i); });
$("main").addEventListener("click",e=>{
  const o = e.target.closest(".opt"); if(o){ choose(+o.dataset.orig); return; }
  const id = (e.target.closest("button")||{}).id;
  if(id==="prevBtn") go(S.cur-1);
  else if(id==="nextBtn") go(S.cur+1);
  else if(id==="submitBtn"){ S.submitted=true; S.view="results"; render(); }
  else if(id==="resultsBtn"){ S.submitted=true; S.view="results"; render(); }
  else if(id==="reviewBtn") go(0);
  else if(id==="againBtn") buildSet();
  else if(id==="retryBtn") buildSet(S.items.filter(it=>it.pick!==0).map(it=>it.qi));
});
document.addEventListener("keydown",e=>{
  if(e.target.matches("select,input") || e.metaKey || e.ctrlKey || e.altKey || S.view!=="quiz") return;
  const k = e.key.toUpperCase(), it = S.items[S.cur]; if(!it) return;
  let pos = LETTERS.indexOf(k); if(pos<0 && /^[1-4]$/.test(k)) pos = +k-1;
  if(pos>=0){ choose(it.perm[pos]); e.preventDefault(); }
  else if(e.key==="ArrowRight"){ go(S.cur+1); e.preventDefault(); }
  else if(e.key==="ArrowLeft"){ go(S.cur-1); e.preventDefault(); }
});

buildSet();
</script>
