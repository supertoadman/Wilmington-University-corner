{"t": "fid", "q": "Which fact pattern is LEAST likely to create a fiduciary relationship by circumstance?", "a": ["A buyer and seller of a used car negotiating at arm's length after meeting online.", "An elderly widower who lets a trusted friend manage his investments because of her financial expertise and his reliance on her.", "A small-business owner who confides secret product formulas to a consultant who agrees to help market the products.", "A long-time friend with special expertise who accepts responsibility for managing another person's financial affairs."], "e": "Circumstantial fiduciary status arises when the beneficiary offers, and the fiduciary accepts, trust because of (1) the special nature of their relationship, (2) the fiduciary's special skills, or (3) the entrusting of secret or confidential information. Arm's-length commercial dealings ordinarily create no fiduciary duties.", "r": "Outline IV-A; [S4:5–7]"},
{"t": "fid", "q": "A client sues Lawyer Ames after a deal in which Ames, without disclosure, bought the client's surplus equipment at a price Ames claims was fair. In many jurisdictions, what procedural advantage does the client likely enjoy?", "a": ["The burden shifts to Ames, as a self-dealing fiduciary, to prove the deal was fair and fully disclosed.", "The client need not prove any element of the claim, because any purchase by a lawyer from a client is void.", "Ames is conclusively presumed to have committed fraud, and the only question is the amount of damages.", "The client may recover only if Ames violated Rule 1.8(a), because the Rules define the civil duty."], "e": "Self-dealing by a fiduciary commonly shifts the burden of proving fairness to the fiduciary, and enhanced remedies such as disgorgement and punitive damages may follow. Such a deal also implicates 1.8(a) for discipline, but civil liability doesn't depend on the Rule.", "r": "Outline IV-A"},
{"t": "fid", "q": "Using the four-question approach to analyze a lawyer's potential fiduciary breach, which question comes FIRST?", "a": ["What is the obligation, and to whom is it owed?", "What consequences might follow if the obligation was breached?", "Was harm caused, and if so, to whom?", "Was the obligation actually breached?"], "e": "The four questions, in order: (1) what is the obligation and to whom; (2) was it breached; (3) what harm did or could the breach cause, and to whom; (4) what are the consequences (the 'Very Bad Thing'). Analyze each of the four duties (loyalty, care, confidentiality, candor) separately.", "r": "Outline IV-A; [S4:4, 9]"},
{"t": "fid", "q": "Lawyer Bly represents a client in selling a warehouse. A real estate broker secretly pays Bly a $5,000 'referral thank-you' for steering the client to the broker. The broker did a good job and the sale price was fair. Which duty did Bly most clearly breach?", "a": ["Loyalty, because a fiduciary may not benefit beyond agreed compensation.", "Care, because a different broker might have obtained a higher sale price for the warehouse.", "Candor only, because the breach consists entirely of failing to tell the client about the payment.", "No duty at all, because the client was not harmed and received a fair price for the property."], "e": "Loyalty requires treating the client at least as well as you'd treat yourself and taking no self-benefit beyond reasonable compensation. A secret payment is a classic loyalty breach, remediable by disgorgement even without harm. Non-disclosure is a candor problem too, but the core breach is disloyal self-enrichment.", "r": "Outline IV-B; [S4:13]"},
{"t": "fid", "q": "Lawyer Cain represents a plaintiff while secretly holding a substantial investment in the defendant. Cain litigates vigorously and wins a large verdict. The defendant later learns of the investment and argues the plaintiff's judgment should be vacated. Separately, the plaintiff learns of it. Which statement is most accurate about Cain's conflict?", "a": ["A conflict is the opportunity and temptation to be disloyal, so it has consequences even though Cain never acted on it.", "Because Cain won a large verdict, there was no conflict of interest that the law will recognize.", "A conflict exists only if the lawyer actually takes some action against the client's interests.", "The conflict matters only for discipline, and discipline requires the client to prove that the secret investment caused actual harm."], "e": "A conflict exists when a lawyer has the opportunity and temptation to act disloyally, whether or not he acts on it. That's why disqualification is prophylactic. Competent work never excuses a secret conflicting interest, and fee forfeiture or disgorgement can follow. For discipline, the specific rule is 1.7(a)(2).", "r": "Outline IV-B trap; MR 1.7(a)(2)"},
{"t": "fid", "q": "A state bar charges Lawyer Dove with 'violating the duty of loyalty' for conduct that does not fall within Rule 1.7, 1.8, 1.9, or any other specific Rule. Dove moves to dismiss. What is the likely ruling?", "a": ["Dismissal, because discipline must rest on a specific Rule; there's no free-standing loyalty Rule.", "Denial, because the duty of loyalty is directly enforceable in discipline whether or not a specific Rule applies.", "Denial, because Rule 8.4 incorporates every fiduciary duty a lawyer owes, including the general duty of loyalty.", "Dismissal, because loyalty can be enforced only through malpractice actions, never through discipline or disqualification."], "e": "There's no general loyalty Rule. Discipline must rest on a specific Rule (1.7, 1.8, 1.9, etc.) for due-process notice. Civil claims for fiduciary breach and disqualification don't require a specific Rule.", "r": "Outline IV-B trap"},
{"t": "fid", "q": "Lawyer Eng's firm handles routine real estate closings for Retailer Co. A pedestrian asks Eng's firm to sue Retailer for a slip-and-fall at one of its stores. The matters are unrelated. Without consent, may the firm take the slip-and-fall case?", "a": ["No, because suing a current client is a concurrent conflict even in an unrelated matter.", "Yes, because the real estate closings and the slip-and-fall case are entirely unrelated matters.", "Yes, because the firm's work for Retailer is transactional rather than litigation, so no conflict arises.", "Yes, so long as different lawyers in the firm handle the closings and the slip-and-fall case."], "e": "1.7(a)(1): a concurrent conflict exists if the representation will be directly adverse to another current client, even in an unrelated matter. It may proceed only under 1.7(b), including each affected client's informed consent confirmed in writing. Different lawyers in the same firm don't solve it (1.10).", "r": "MR 1.7(a)(1), (b); Outline IV-C"},
{"t": "fid", "q": "A court-appointed defense lawyer in a high-profile child-murder case is openly campaigning to be elected district attorney. After the jury convicts, he tells reporters he is grateful the jury 'removed this monster from our community.' Which Rule most directly describes the problem?", "a": ["Rule 1.7(a)(2): a significant risk that his personal interest materially limited the representation.", "Rule 1.7(a)(1), because the lawyer was directly adverse to the defendant throughout the trial.", "Rule 1.9, because the defendant became a former client once the jury returned its verdict.", "No Rule at all, because a lawyer's political ambitions are personal matters outside the Rules."], "e": "A material-limitation conflict exists when there's a significant risk the representation will be limited by the lawyer's personal interest, here his political ambitions and the temptation to curry favor with voters. The post-verdict statement also breaches loyalty and may reveal client-related information.", "r": "MR 1.7(a)(2); Outline IV-C; [S4:14]"},
{"t": "fid", "q": "Two business partners, Fay and Gus, ask Lawyer Hale to represent both of them in their lawsuit against each other over the dissolution of their partnership. Both sign detailed informed-consent waivers. May Hale represent both?", "a": ["No; asserting one client's claim against another in the same litigation can never be consented to.", "Yes, because both clients gave informed consent confirmed in a detailed writing that each signed.", "Yes, so long as Hale reasonably believes he can be fair to both partners throughout the dissolution.", "Yes, but only if the partners' interests are not 'directly' adverse in the way Rule 1.7(a)(1) uses that term."], "e": "1.7(b)(3) makes it nonconsentable for a lawyer to represent clients when one asserts a claim against the other in the same litigation or proceeding before a tribunal. No waiver cures it.", "r": "MR 1.7(b)(3); Outline IV-C, X"},
{"t": "fid", "q": "Lawyer Ivy wishes to represent two co-defendants whose defenses are consistent but who have some risk of diverging interests. She reasonably believes she can represent both competently. Each orally agrees after a thorough explanation. Ivy never puts anything in writing. Has Ivy complied with Rule 1.7?", "a": ["No, because each affected client's informed consent must be confirmed in writing.", "Yes, because oral informed consent after a thorough explanation is sufficient for concurrent conflicts.", "Yes, because their defenses were consistent, so no conflict of interest existed that required consent.", "No, because co-defendants in a criminal case may never be represented jointly by a single lawyer."], "e": "1.7(b)(4) requires each affected client's informed consent confirmed in writing. A writing from the lawyer memorializing the oral consent is enough. Joint representation of criminal co-defendants is permitted but usually discouraged because of the high risk of conflict.", "r": "MR 1.7(b)(4); Outline IV-C, X"},
{"t": "fid", "q": "Lawyer Jax represented Kilo Corp. in negotiating a supply contract with Lima Inc. Two years later, after the representation ended, Lima asks Jax to sue Kilo for breaching that same supply contract. Kilo refuses consent. May Jax represent Lima?", "a": ["No; that is the same matter, materially adverse to a former client, without informed consent confirmed in writing.", "Yes, because Kilo is now only a former client, and the former-client rule applies only to confidential information.", "Yes, so long as Jax promises not to use any confidential information he learned while representing Kilo.", "Yes, because two years have passed since the representation ended, which cures any former-client conflict."], "e": "1.9(a) protects former clients in the same or substantially related matters. Suing a former client over the very contract the lawyer negotiated for it is the paradigm case. The passage of time and promises not to use information don't cure it. Unrelated later matters against former clients are generally allowed.", "r": "MR 1.9(a); Outline IV-C"},
{"t": "fid", "q": "Five years ago, Lawyer Moe handled a single trademark registration for Novo Co. The matter is closed. Moe is now asked to represent a landlord suing Novo for unpaid rent on an office lease that Moe had no part in. Novo objects. May Moe proceed?", "a": ["Yes, because the lease dispute is not the same as or substantially related to the trademark matter.", "No, because a lawyer may never be adverse to a former client in any later matter without consent.", "No, because a former client must consent in writing to any representation adverse to it.", "Yes, but only if Moe first obtains a court order permitting the adverse representation."], "e": "Former-client conflicts under 1.9(a) arise only in the same or substantially related matters. Unrelated later adversity is permitted, though 1.9(c) still bars using or revealing the former client's information to its disadvantage.", "r": "MR 1.9(a), (c); Outline IV-C"},
{"t": "fid", "q": "A restaurant client asks Lawyer Oto to invest $50,000 in exchange for a 10% ownership stake. The terms are fair. Oto describes the deal to the client orally and recommends that the client have another lawyer review it. The client says it's unnecessary and signs a one-page agreement listing only the price and percentage. Has Oto complied with Rule 1.8(a)?", "a": ["No; 1.8(a) requires written disclosure, written advice to get counsel and time to do so, and signed consent.", "Yes, because the terms of the investment were fair and reasonable to the restaurant client.", "Yes, because the client declined Oto's oral recommendation to have another lawyer review the deal, which waives the remaining requirements.", "No, because lawyers may never enter into business transactions with their own clients."], "e": "1.8(a): (1) fair and reasonable terms, fully disclosed and transmitted in writing the client can understand; (2) written advice to seek independent counsel and a reasonable opportunity to do so; (3) informed consent in a writing signed by the client to the essential terms and the lawyer's role, including whether the lawyer represents the client in the deal. Fairness alone is never enough, and oral advice doesn't satisfy (a)(2).", "r": "MR 1.8(a); Outline IV-C"},
{"t": "fid", "q": "A start-up client with little cash offers Lawyer Pak 2% of its stock in lieu of fees for forming the company. Which statement is correct?", "a": ["She may, but because such a fee is like a business deal, she must comply with Rule 1.8(a), and it must be reasonable.", "She may never accept stock in a client's company as payment for legal services.", "She may accept the stock without restriction, because fees are governed only by Rule 1.5.", "She may accept stock only if the client is independently represented by other counsel in negotiating the fee arrangement."], "e": "1.5 cmt [4]: a lawyer may accept property, including an ownership interest in an enterprise, as a fee, but it may be subject to 1.8(a) because it often has the qualities of a business transaction with the client. It must also be reasonable (1.5(a)) and mustn't be a proprietary interest in litigation (1.8(i)).", "r": "MR 1.5 cmt [4], 1.8(a); Outline IV-C, VIII-A"},
{"t": "fid", "q": "Representing a client selling a commercial parcel, Lawyer Quill learns the client will accept as little as $800,000. Before the client accepts any offer, Quill submits his own offer of $805,000 through a straw buyer. Which Rule most directly prohibits this?", "a": ["Rule 1.8(b): he used client information to the client's disadvantage without informed consent.", "Rule 1.5(a), because the lawyer's profit on the purchase amounts to an unreasonable fee.", "Rule 1.18(b), because the client was in effect a prospective buyer of the lawyer's services.", "No Rule, because the price he offered exceeded the client's stated minimum."], "e": "Using the client's secret bottom line to buy cheaply uses confidential information to the client's disadvantage (1.8(b)). It's also a business transaction (1.8(a)) and dishonest (8.4(c), through the straw buyer). Reusing general knowledge or forms for other clients is fine. Client-specific facts are not.", "r": "MR 1.8(a)–(b); Outline IV-C, VI-B; [S3:69–70]"},
{"t": "fid", "q": "A long-time client, unrelated to Lawyer Rhee, asks Rhee to draft her will and include a $200,000 bequest to Rhee 'for all your kindness.' Rhee did not solicit the gift. What should Rhee do?", "a": ["Decline to prepare the instrument, and have the client use another lawyer if she still wants the gift.", "Draft the will, because the gift was unsolicited, reflects the client's own wishes, and the client is a competent adult.", "Draft the will, so long as the client gives informed consent in a signed writing.", "Draft the will, but reduce the gift to a modest amount that the Rules permit."], "e": "1.8(c) prohibits soliciting a substantial gift and preparing an instrument giving the lawyer (or a relative) a substantial gift, unless the lawyer or recipient is related to the client. The fix is independent drafting by another lawyer. Consent doesn't cure it.", "r": "MR 1.8(c); Outline IV-C"},
{"t": "fid", "q": "After Lawyer Soto wins a custody case, his grateful client sends him a $100 bottle of wine and a thank-you card. Soto never asked for anything. May Soto accept?", "a": ["Yes, because accepting a modest, unsolicited gift is permitted.", "No, because lawyers may never accept gifts of any value from clients.", "No, unless Soto first advises the client in writing to consult independent counsel.", "Yes, but only if Soto reports the gift to the disciplinary authority."], "e": "1.8(c) bars soliciting substantial gifts and preparing instruments for them. Accepting a simple, modest, unsolicited gift is permitted, though a substantial gift could be voidable as undue influence under other law.", "r": "MR 1.8(c) & cmt [6]; Outline IV-C"},
{"t": "fid", "q": "Lawyer Tan represents an indigent plaintiff on contingency in a civil-rights case. The client is about to be evicted and asks Tan to lend him rent money until the case resolves. Tan also wants to pay the filing fees and expert costs. What may Tan do?", "a": ["Pay or advance the filing fees and expert costs, but not lend the client money for rent.", "Lend the rent money and advance the costs, because both help the client pursue the case to judgment.", "Lend the rent money, but only if the client signs a promissory note with reasonable interest.", "Neither, because lawyers may not give clients any form of financial assistance during litigation."], "e": "1.8(e): no financial assistance in connection with pending or contemplated litigation, except (1) advancing court costs and expenses with repayment contingent on outcome, and (2) paying them outright for an indigent client. The 2020 amendment adds (3): modest gifts for basic living necessities to indigent clients represented pro bono, but Tan is on contingency. Rent loans are prohibited.", "r": "MR 1.8(e); Outline IV-C"},
{"t": "fid", "q": "Lawyer Ulm represents eight homeowners suing a builder. The builder offers $800,000 to settle all eight claims, with the allocation left to the plaintiffs. Six clients vote to accept. Ulm proposes allocating by square footage and tells the two dissenters they are bound by the majority's decision under the clients' group agreement. Is Ulm correct?", "a": ["No; an aggregate settlement requires each client's informed consent in a signed writing after full disclosure.", "Yes, because the clients agreed in advance, in their group representation agreement, to be bound by a majority vote on any settlement.", "Yes, because allocating the settlement by square footage is fair and reasonable to every homeowner.", "No, because aggregate settlements of multiple clients' claims are prohibited by the Model Rules."], "e": "1.8(g): a lawyer representing two or more clients may not participate in an aggregate settlement unless each client gives informed consent in a writing signed by the client, after disclosure of the existence and nature of all claims and each person's participation. Majority-vote provisions don't substitute.", "r": "MR 1.8(g); Outline IV-C, X"},
{"t": "fid", "q": "Lawyer Vale represents a plaintiff in a property dispute. Which of the following may Vale lawfully acquire?", "a": ["A lien authorized by law to secure his fees and a reasonable contingent fee in this civil case.", "A one-third ownership interest in the disputed land, transferred to him now as payment.", "An assignment of the entire cause of action, with the client to receive a fixed sum.", "An option to buy the disputed property at a discount if the client prevails."], "e": "1.8(i): a lawyer may not acquire a proprietary interest in the cause of action or subject matter of litigation he is conducting, except (1) a lien authorized by law to secure fees or expenses and (2) a reasonable contingent fee in a civil case.", "r": "MR 1.8(i); Outline IV-C"},
{"t": "fid", "q": "During an emotionally difficult divorce representation, Lawyer Wren begins a consensual sexual relationship with her client. The client signs a detailed written statement that the relationship is voluntary and waives any objection. Is Wren subject to discipline?", "a": ["Yes; consent never cures sexual relations with a client unless the relationship predated the representation.", "No, because the client gave informed consent to the relationship and waived any objection in a detailed writing that she signed.", "No, because both parties are adults and the relationship is entirely consensual.", "Yes, but only if the client's divorce case was actually harmed by the relationship."], "e": "1.8(j) bars sexual relations with a client unless the relationship predates the representation (e.g., a spouse). The rule exists because clients confide and depend on the lawyer, which creates vulnerability and undue-influence risk, especially in family law. Consent doesn't cure it.", "r": "MR 1.8(j); Outline IV-C; [S4:10–11]"},
{"t": "fid", "q": "Lawyer Xu and his spouse, a lawyer, have been married ten years. The spouse retains Xu to handle a boundary dispute with a neighbor. Does Rule 1.8(j) prohibit the representation?", "a": ["No, because their consensual sexual relationship existed before the representation began.", "Yes, because a lawyer may never represent a person with whom he has a sexual relationship.", "Yes, unless the spouse signs a written waiver after being advised to consult other counsel.", "No, because Rule 1.8(j) applies only to representations in family-law matters."], "e": "1.8(j) exempts pre-existing consensual relationships. Representing a spouse may raise other judgment or material-limitation concerns (1.7(a)(2)), but 1.8(j) itself isn't violated.", "r": "MR 1.8(j); Outline IV-C"},
{"t": "fid", "q": "Lawyer Yang has a prohibited sexual relationship with a client in violation of Rule 1.8(j). Separately, Yang's partner Zed made a loan to a different client without complying with Rule 1.8(a). Which conflicts are imputed to every lawyer in their firm?", "a": ["The 1.8(a) problem: prohibitions in (a) through (i) are imputed firm-wide, but 1.8(j) is personal.", "Both, because every prohibition in Rule 1.8 is imputed to all lawyers associated in the firm.", "Neither, because Rule 1.8 conflicts are always personal to the lawyer involved.", "Only the 1.8(j) problem, because sexual relationships with clients create the greatest risk."], "e": "1.8(k): while lawyers are associated in a firm, a prohibition in paragraphs (a) through (i) that applies to any one of them applies to all. 1.8(j) is personal and isn't imputed.", "r": "MR 1.8(k); Outline IV-C"},
{"t": "fid", "q": "Defense counsel Abe receives a plea offer for his client: plead to a misdemeanor and receive probation. Abe is certain the client will reject it because the client insists he is innocent, so Abe declines the offer without telling the client. Has Abe violated the Rules?", "a": ["Yes; every plea offer must be promptly conveyed unless the client has already said how to handle it.", "No, because Abe reasonably and accurately predicted how the client would respond to the offer.", "No, because plea negotiations are a means decision that belongs to defense counsel.", "Yes, but only if the client would actually have accepted the misdemeanor plea offer."], "e": "1.4(a)(1) and cmt [2]: a lawyer who receives a settlement offer in a civil case or a plea offer in a criminal case must promptly tell the client, unless the client has previously said the offer is acceptable or unacceptable or authorized the lawyer to accept or reject it. Whether to plead is the client's decision (1.2(a)). No harm need be shown for discipline.", "r": "MR 1.4(a)(1), 1.2(a); Outline IV-D"},
{"t": "fid", "q": "Client Bree emails Lawyer Cole every two weeks for four months asking about the status of her case and requesting copies of the opposing party's filings. Cole never responds, though he is working the case competently. Has Cole violated the Rules?", "a": ["Yes; he must keep her reasonably informed and promptly answer reasonable requests, harm or not.", "No, because Cole is handling the case competently and the client has not been harmed.", "No, because a client has no right to receive copies of the opposing party's filings.", "Yes, but only if the client ultimately loses the case or suffers some other harm because of the lack of communication."], "e": "1.4(a)(3)–(4) require keeping the client reasonably informed and promptly complying with reasonable requests for information. Ignoring calls and emails for months is among the most common disciplinary complaints, and no harm is required.", "r": "MR 1.4(a)(3)–(4); Outline IV-D, V-B"},
{"t": "fid", "q": "A client asks Lawyer Dahl to backdate a contract amendment to before the tax year ended so the client can claim a deduction. Which response best satisfies Dahl's duties under Rule 1.4?", "a": ["Explain that she can't help backdate it because it would be fraudulent, and discuss lawful alternatives.", "Prepare the document with the current date, without comment, and let the client discover the difference later.", "Withdraw immediately without explanation, because the client has asked her to assist in a fraud.", "Prepare the backdated document, because the client decides the objectives of the representation."], "e": "1.4(a)(5): when the lawyer knows the client expects assistance not permitted by the Rules or other law, the lawyer must consult with the client about the relevant limitation on the lawyer's conduct. Backdating to obtain a tax benefit would be fraud (1.2(d), 8.4(c)). Dahl should explain and offer lawful options (1.2(d) permits discussing legal consequences).", "r": "MR 1.4(a)(5), 1.2(d); Outline IV-D"},
{"t": "fid", "q": "Associate Eli does corporate work for a client whose owners publicly oppose same-sex marriage. Eli, who is gay, is about to marry his partner. He believes the client would fire the firm if it knew. Must Eli or the firm disclose his sexual orientation or marriage to the client?", "a": ["No; candor covers information material to the engagement, and his private life isn't material.", "Yes, because candor requires disclosing anything that might affect the client's decision to retain the firm.", "Yes, because his personal interest creates a conflict that must be disclosed and consented to under Rule 1.7.", "No, but only because the firm itself already knows about his sexual orientation and marriage."], "e": "Candor is limited to the scope of the engagement and to information a reasonable client would find significant to the work. A lawyer's sexual orientation or marriage isn't material to corporate work. The client's possible reaction is a business risk, not a candor duty or a 1.7 conflict.", "r": "Outline IV-D; [S4:24–25]"},
{"t": "fid", "q": "Associate Fry drafted a promissory note for a $2.4 million equipment sale payable in monthly installments and accidentally deleted the acceleration clause. The deal has closed, and the buyer hasn't missed a payment. The client is notoriously impatient. When must the firm tell the client?", "a": ["Promptly, because the error is reasonably likely to harm the client and so is material.", "Only if the buyer later defaults on the note and the client is actually harmed by the missing clause.", "Never, if the firm can quietly negotiate an amendment to the note with the buyer and its counsel.", "Only after the malpractice limitations period has run, so that the firm is protected from suit."], "e": "ABA Op. 18-481: a lawyer must inform a current client of a material error, meaning one reasonably likely to harm or prejudice the client, or of a nature that would reasonably cause a client to consider terminating the representation even absent harm. Disclose promptly, before harm occurs. Fry should tell her supervisor first, and the firm should propose a fix at no charge. Fixing things behind the client's back violates 1.4 and the client's control of objectives.", "r": "ABA Op. 18-481; MR 1.4; Outline IV-D; [S4:26–31]"},
{"t": "fid", "q": "Lawyer Gale realizes she made a significant error in a client's matter. Which sequence is most consistent with her obligations and good practice?", "a": ["Tell her supervisor and firm counsel promptly, then disclose to the client without undue delay, with the fix.", "Fix the error quietly and inform the client only if the fix fails or the client suffers some harm.", "Inform the client only after the malpractice carrier approves the wording of the disclosure, however long that takes.", "Withdraw from the representation, so that successor counsel can discover and disclose the error."], "e": "Before talking with the client, talk with your boss, who may need to notify management and the carrier. But internal process can't delay a required disclosure. Concealment converts an innocent mistake into a cover-up with punitive-damage exposure. Clients trust lawyers who come clean, explain the fix, and don't charge for it.", "r": "Outline II-C, IV-D; [S4:30–32]"},
{"t": "fid", "q": "Lawyer Hu has a strong reluctance to tell her client that she overlooked a key document in discovery, though she believes it probably won't affect the outcome. Applying the course's heuristics, what should she conclude?", "a": ["Her strong reluctance is itself a signal that the information is probably material.", "Because she believes the error won't affect the outcome, she need not disclose it to the client.", "She should wait to see whether the error causes any harm before deciding whether to disclose it.", "She should disclose it only if the client specifically asks her about the discovery process."], "e": "The 'don't-wanna test': the more you don't want to disclose it, the more likely it's material. Op. 18-481 doesn't require certainty of harm. And conversations that begin 'Why didn't you tell me...' rarely end well.", "r": "Outline IV-D"},
{"t": "fid", "q": "Lawyer Ince receives a report from a psychiatrist who examined Ince's elderly client in a guardianship-related matter. The psychiatrist warns that disclosing the diagnosis right now could cause the client acute harm. Under the Model Rules, may Ince delay telling the client the diagnosis?", "a": ["Yes, he may delay if the client would likely react imprudently, but never to serve his own interest.", "No, because Rule 1.4 requires immediate disclosure of all information material to the matter.", "Yes, and he may withhold the diagnosis permanently if he concludes that is best for the client.", "No, because only the court may decide what information the client may be told in a guardianship matter."], "e": "1.4 cmt [7]: a lawyer may be justified in delaying transmission when the client would likely react imprudently to immediate communication, for example a psychiatric diagnosis the examining psychiatrist says would harm the client. A lawyer may not withhold information to serve the lawyer's own interest or convenience, or someone else's.", "r": "MR 1.4 cmt [7]; Outline IV-D; [S3:65]"},
{"t": "fid", "q": "A business client asks Lawyer Jo whether laying off its oldest workers first is legal. Jo concludes it would be legal if structured carefully, but that it would devastate the local community and morale. May Jo tell the client about those concerns?", "a": ["Yes, because advice may refer to moral, economic, social, and political factors.", "No, because a lawyer's advice must be limited to the legal consequences of the client's plan.", "Yes, but only if the client specifically asks for advice about non-legal considerations.", "No, because doing so would substitute the lawyer's own values for the client's objectives."], "e": "Rule 2.1 requires independent judgment and candid advice and permits reference to moral, economic, social, and political factors. The client still decides objectives (1.2(a)).", "r": "MR 2.1; Outline IV-D"},
{"t": "fid", "q": "A father whose teenage daughter was assaulted asks Lawyer Kale to 'make the boy go to prison and register as a sex offender,' because prosecutors have declined to charge. He adds that he and some friends plan to 'make it right' themselves. What is Kale's best response?", "a": ["Explain that prosecution is the prosecutor's call, say what a civil claim can do, and warn him against any self-help.", "Promise to pursue criminal charges privately on his behalf, so that the family does not seek another lawyer.", "Decline the matter without explanation, because the client's goals are unrealistic and cannot be achieved.", "Ignore the 'make it right' remark, because it concerns future conduct outside the scope of the engagement."], "e": "Candor includes realistic expectations (1.4(b), 2.1). Explain what the civil system can and can't do. The self-help comment triggers a 1.2(d)/1.4(a)(5) conversation: no assistance with crimes, and advice about consequences. If a threat ripens into reasonably certain bodily harm, 1.6(b)(1) permits disclosure.", "r": "MR 1.4, 2.1, 1.2(d), 1.6(b)(1); Outline IV-D; [S2:13–14]"},
{"t": "fid", "q": "Lawyer Lux tells a client, 'I have a duty to keep you informed about everything you'd want to know, and I will update you whenever something material happens.' Which practice best implements the course's advice on client communication beyond the minimum?", "a": ["Agree early on what the client wants to hear and how often, use ticklers for updates, and consider no-charge notes.", "Communicate only when the client asks, to avoid billing the client for unnecessary status reports.", "Send copies of every document without explanation, so the client can decide for herself which developments matter and which do not.", "Limit communication to detailed written invoices, which show the client exactly what work was done."], "e": "Beyond the minimum 1.4 requires, open communication is good practice and good business. Set ground rules about what the client wants to know, use ticklers to schedule updates, and consider 'N/C' (no charge) for short status messages.", "r": "Outline IV-D; [W4:12–13; S4:32]"},
{"t": "fid", "q": "Which of the following is NOT one of the four core fiduciary duties a lawyer owes a client, as framed in the course?", "a": ["Zeal.", "Loyalty.", "Confidentiality.", "Candor."], "e": "The four duties are loyalty, care, confidentiality, and candor, analyzed separately. 'Zealousness' was the Model Code's term, which the Model Rules replaced with diligence (1.3), and diligence doesn't require offensive tactics.", "r": "Outline IV-B; [S1:15, 17; S4:12]"},
{"t": "comp", "q": "Newly admitted Lawyer Abe agrees to represent a client in a straightforward landlord-tenant dispute. Abe has never handled one but spends several evenings studying the governing statute and local court rules, and does competent work. Did Abe violate Rule 1.1 by accepting the matter?", "a": ["No, because competence that can be achieved by reasonable preparation is enough.", "Yes, because a lawyer must have prior experience in a field before accepting a matter in that field.", "Yes, because a newly admitted lawyer must be supervised by experienced counsel on every matter he handles.", "No, but only because the client consented after being told that Abe had never handled such a matter."], "e": "1.1 cmts [2] and [4]: a newly admitted lawyer can be as competent as a long-time practitioner, and a lawyer may accept representation where competence can be achieved by reasonable preparation. Client consent doesn't substitute for competence.", "r": "MR 1.1 cmts [2], [4]; Outline V-A"},
{"t": "comp", "q": "A trusts-and-estates lawyer with no litigation background agrees to handle a client's slip-and-fall outside a U.S. Post Office, with the limitations period three months away. He files suit in state court but never learns that the Federal Tort Claims Act requires an administrative claim first. The suit is dismissed and the claim is lost. He had told the client this was his first tort case, and she agreed to proceed. Did he violate Rule 1.1?", "a": ["Yes; he had to acquire the knowledge the matter required, including the FTCA's rules, and consent didn't waive that.", "No, because the client consented to the representation after learning that it was his first tort case.", "No, because the FTCA is too specialized a federal statute for a general practitioner taking a first tort case to be charged with knowing.", "Yes, because a lawyer may never accept a matter outside his usual area of practice without a co-counsel."], "e": "Competence can be acquired through study or association, but it must actually be acquired. Identifying what kind of legal problem a situation presents is 'perhaps the most fundamental legal skill' (cmt [2]). Neither client consent nor inexperience waives 1.1. Missing the FTCA exhaustion step is also negligence.", "r": "MR 1.1 cmts [1]–[2]; Outline V-A; [S2:29–30]"},
{"t": "comp", "q": "In deciding whether a lawyer has the requisite knowledge and skill for a matter, which is NOT a factor listed in Comment [1] to Rule 1.1?", "a": ["Whether the client is able to pay for the lawyer's preparation time.", "The relative complexity and specialized nature of the matter.", "The lawyer's training and experience in the particular field in question.", "Whether it is feasible to refer, associate, or consult with an experienced lawyer."], "e": "Comment [1] factors: complexity and specialized nature; the lawyer's general experience; the lawyer's training and experience in the field; the preparation and study the lawyer can give the matter; and the feasibility of referral, association, or consultation. In many instances the required proficiency is a general practitioner's. Ability to pay isn't listed.", "r": "MR 1.1 cmt [1]; Outline V-A"},
{"t": "comp", "q": "Lawyer Bose has never handled an ERISA claim but agrees to take one, planning to associate with an experienced ERISA lawyer who will actively participate. The client agrees. Is this consistent with Rule 1.1?", "a": ["Yes, because competence may be supplied by associating with a lawyer of established competence.", "No, because a lawyer must personally possess the requisite competence before accepting any engagement.", "Yes, but only if the experienced lawyer takes over the entire matter and Bose withdraws from it.", "No, because dividing the fee with an outside ERISA lawyer would violate the fee-sharing rules."], "e": "1.1 cmts [1]–[2]: competence can be achieved through association with a lawyer of established competence. Any fee split with an outside lawyer must satisfy 1.5(e), but that's a separate question.", "r": "MR 1.1 cmt [2]; Outline V-A"},
{"t": "comp", "q": "A distraught stranger calls Lawyer Cho, a real estate lawyer, at 9 p.m.: her ex-partner has just taken their child across state lines, and she needs to know immediately whether to call the police or file something tonight. No family lawyer is reachable. May Cho advise her?", "a": ["Yes, in an emergency where referral is impractical, but only to the extent reasonably necessary.", "No, because a lawyer may never give advice in a field in which she lacks ordinary competence, even briefly.", "Yes, and Cho may then continue the representation indefinitely without any further preparation.", "No, unless Cho first obtains a signed engagement letter defining the scope of the emergency advice."], "e": "1.1 cmt [3]: in an emergency, a lawyer may give advice or assistance in a matter in which she lacks ordinary skill where referral or consultation is impractical, but only as reasonably necessary under the circumstances, because ill-considered action endangers the client.", "r": "MR 1.1 cmt [3]; Outline V-A"},
{"t": "comp", "q": "Lawyer Dee agrees to represent a nonprofit pro bono in a complex tax-exemption dispute far outside her experience. The nonprofit's director says, 'We know you're not a tax lawyer, and anything you can do is better than nothing.' Dee does minimal research and makes avoidable errors. Is she excused?", "a": ["No; competence applies fully to pro bono work and can't be waived by the client.", "Yes, because pro bono clients accept a lower standard of care in exchange for free legal services.", "Yes, because the client expressly acknowledged her limitations before the representation began.", "No, but only because tax law is a certified specialty requiring special training."], "e": "Neither pro bono status nor client consent lowers the 1.1 standard. Dee could have become competent through study or association, limited the scope reasonably with informed consent (1.2(c)), or declined.", "r": "MR 1.1; Outline V-A"},
{"t": "comp", "q": "Lawyer Eng spends 40 hours learning a new area of law to handle a client's $15,000 dispute and bills all 40 hours at her full rate. Which statement is most accurate?", "a": ["Becoming competent is allowed, but billing an unreasonable amount of learning time may violate Rule 1.5(a).", "Because competence is required by the Rules, all of the time Eng spent becoming competent in the new area is properly billable.", "Eng violated Rule 1.1 by accepting a matter in a field of law she needed to learn first.", "Time spent learning the law can never be billed to a client under any circumstances."], "e": "Competence (1.1) and fee reasonableness (1.5(a)) are separate questions. A lawyer may get up to speed but shouldn't bill an unreasonable amount of general education. Time and labor 'required' are measured against what a competent lawyer would need.", "r": "MR 1.1, 1.5(a); Outline V-A"},
{"t": "comp", "q": "Associate Fox is told to adapt a 'go-by' settlement agreement from another case. It contains a clause he doesn't understand and that cites a statute he hasn't read. Which approach complies with his duties?", "a": ["Learn what the clause does and read the statute, then decide whether to keep or revise it, and customize the form.", "Delete the clause, since a lawyer should never include language that he does not fully understand.", "Keep the clause, because a form provided by a supervising partner is presumed to be correct.", "Use the form as-is, because forms in the firm's bank have been pre-approved by the firm's partners and are kept current by staff."], "e": "For forms: (1) make sure it's a good example; (2) never leave in, or simply delete, language you don't understand, and figure out what it does and what's missing; (3) customize it and confirm the law hasn't changed. If it relies on a statute or case, read the authority. Ask whether the supervisor has instructions for using it.", "r": "Outline V-A forms; [S2:9; W2:4–6]"},
{"t": "comp", "q": "Solo practitioner Gee emails a draft contract to opposing counsel without removing the tracked comments, which reveal the client's confidential bottom line. The client suffered no monetary loss because the deal closed on favorable terms. Has Gee violated the Rules?", "a": ["Yes; competence includes understanding technology's risks, and reasonable safeguards are required, harm or not.", "No, because the client suffered no monetary harm from the disclosure, the deal closed favorably, and discipline requires harm.", "No, because technology issues are administrative matters rather than questions of legal competence.", "Yes, but only under Rule 5.3, because staff members usually handle the sending of documents."], "e": "1.1 cmt [8] requires keeping abreast of the benefits and risks of relevant technology. Metadata scrubbing is a classic example. 1.6(c) requires reasonable efforts to prevent inadvertent disclosure. Discipline doesn't require harm.", "r": "MR 1.1 cmt [8], 1.6(c); Outline V-A; [S2:33–34]"},
{"t": "comp", "q": "Lawyer Hart uses a generative AI tool to draft a brief. The tool invents three case citations. Hart doesn't check them and files the brief. When opposing counsel says the cases don't exist, Hart insists they are real. Which is most accurate?", "a": ["Hart faces sanctions and discipline, because lawyers must verify AI output, and doubling down compounds it.", "Hart is protected from sanctions because the AI vendor guaranteed the accuracy of the tool's output.", "Hart faces no consequences, because the error was the software's and not the lawyer's own.", "Hart faces only a malpractice claim from the client, because courts do not sanction honest technology errors."], "e": "Mata v. Avianca: lawyers who filed AI-fabricated citations and stood by them were sanctioned under Rule 11. Competence includes understanding technology's risks (1.1 cmt [8]; ABA Op. 512 on generative AI). Candor to the tribunal (3.3) and 8.4(c) are also implicated. Vendor assurances are no defense.", "r": "MR 1.1 cmt [8], 3.3; ABA Op. 512; FRCP 11; Outline V-A"},
{"t": "comp", "q": "A small firm stores client files on a server protected by the default password 'admin.' Hackers access confidential client data. The firm discovers the breach but decides not to tell clients to avoid embarrassment. Which is most accurate under ABA guidance?", "a": ["It likely failed to use reasonable security and must notify affected clients of the breach.", "The firm need not notify its clients unless a state data-breach statute specifically requires it.", "The firm bears no responsibility, because the hackers' intentional criminal act caused the breach.", "The firm must report the breach to the disciplinary authority, but it need not tell any of its clients."], "e": "ABA Op. 18-483: lawyers must take reasonable steps to secure data, monitor for breaches, and, when a breach occurs, stop it, restore systems, and notify affected clients (part of the 1.4 candor duty). Default passwords aren't reasonable (1.1 cmt [8], 1.6(c); see also Op. 477R).", "r": "ABA Ops. 18-483, 477R; MR 1.6(c), 1.4; Outline V-A"},
{"t": "comp", "q": "Associate Ike is assigned a complex motion due in five days. He asks his supervising partner for guidance three times; she never responds. Ike files nothing, and the deadline passes. Ike says, 'I asked and asked.' Is that a defense?", "a": ["No; he's bound by the Rules regardless, and the deadline required protective action such as seeking help or an extension.", "Yes, because the supervising partner bears full responsibility for the missed deadline under Rule 5.1, not the associate who asked for help.", "Yes, because a subordinate lawyer is not responsible for the consequences of a supervisor's inaction.", "No, but only because he should have filed whatever partial draft he had before the deadline."], "e": "There's a 'duty to be supervised': ask, insist, and find help elsewhere if needed. 5.2(a) binds the subordinate, and 1.3 requires protecting the client's interests, for example by seeking an extension or going to another partner. The partner also has 5.1 exposure.", "r": "MR 5.2(a), 1.3; Outline V-A"},
{"t": "comp", "q": "At a status conference, the judge orally moves the deadline for Lawyer Jain's reply brief up by a week. Jain forgets to tell her assistant, who maintains her calendar, and misses the new deadline. Jain catches it three days later, and the court accepts the late brief. Jain wins the motion. Has Jain violated Rule 1.3?", "a": ["Yes, because diligence and promptness are always required, and no harm to the client is needed.", "No, because the court accepted the late filing and the client ultimately won the motion.", "No, because the assistant, not the lawyer, was responsible for maintaining the calendar.", "Yes, but only if the court imposed a sanction for the late filing."], "e": "1.3 violations don't require harm. Delegating calendaring doesn't delegate responsibility, so Jain had to make sure the new date was recorded. Harm matters for civil liability, not discipline.", "r": "MR 1.3; Outline V-B; [S2:31–32]"},
{"t": "comp", "q": "Solo practitioner Kemp has taken on 140 active litigation matters and regularly misses internal deadlines, though he has not yet missed a court deadline. Which statement is most accurate?", "a": ["He risks violating Rule 1.3, which requires that a lawyer's workload be controlled.", "No violation can exist until a court deadline is actually missed in one of his cases.", "Workload is a business decision that falls entirely outside the Rules of Professional Conduct.", "He violates Rule 1.1 only if a client complains to the disciplinary authority."], "e": "1.3 cmt [2]: a lawyer's workload must be controlled so each matter can be handled competently. Systems such as ticklers, calendars, and staff help, but taking on more than can be handled is itself a diligence problem.", "r": "MR 1.3 cmt [2]; Outline V-B; [S2:10–11]"},
{"t": "comp", "q": "A partner prepares a married couple's living trust and has them sign it, but for eight months never retitles their home, cars, investment accounts, or business shares into the trust. The husband then dies suddenly, and his assets must go through probate, with substantial fees, delay, and taxes. Which consequences are most likely?", "a": ["Discipline for lack of diligence and civil liability for negligence, with the firm vicariously liable.", "No consequences, because the trust documents themselves were properly drafted and signed.", "Discipline only, because the clients cannot prove that any damages resulted from the delay.", "Civil liability only, because diligence violations require a client complaint to the bar."], "e": "Failing to complete simple but essential tasks is a 1.3 violation (procrastination is 'perhaps the most widely resented' shortcoming). The care duty supports damages for the avoidable probate costs, delay, and taxes. The partner is personally liable and the firm vicariously. A busy practice is no excuse (cmt [2]).", "r": "MR 1.3; Outline V-B, V-C; [S2:16–17]"},
{"t": "comp", "q": "Lawyer Lane never filed a client's personal-injury complaint and stopped returning her calls. The limitations period has run. In a malpractice action, what must the client prove to recover damages?", "a": ["That Lane breached a duty and that, but for the breach, she would have won and collected in the underlying case.", "Only that Lane missed the limitations period, because that fact alone establishes both breach and damages.", "That Lane's conduct violated Rules 1.3 and 1.4, which defines the standard of care in negligence actions.", "That Lane acted intentionally, because negligent failures to file are not actionable against lawyers."], "e": "Negligence requires duty, breach, causation, and economic damages. The 'case within a case' means proving the underlying claim's value and collectibility. Rule violations may be evidence of the standard of care, but they're neither necessary nor sufficient. Lane also faces discipline under 1.3 and 1.4 without any proof of harm.", "r": "Outline V-C, I-E; [S2:15]"},
{"t": "comp", "q": "Lawyer Moss advertises as a 'board-certified patent litigation specialist' and is hired for a complex patent case. In a later malpractice action, what standard of care will most likely apply?", "a": ["That of a reasonably careful and prudent patent litigation specialist, because she held herself out as one.", "That of a reasonably careful general practitioner in the community where she practices.", "That of the very best patent litigator in the country, because she advertised a board certification to attract the client.", "No standard at all, because claims of specialization are only marketing statements."], "e": "The baseline is the skill, diligence, care, and knowledge of a reasonably careful and prudent lawyer in similar circumstances. A lawyer who holds herself out as a specialist, or is hired as one, is held to a reasonable specialist's standard.", "r": "Outline V-C"},
{"t": "comp", "q": "After a full discussion with her client, Lawyer Nye decided not to cross-examine a sympathetic witness, believing cross would alienate the jury. The client reluctantly agreed. The client lost and now sues, arguing that a more aggressive lawyer would have won. What is the likely result?", "a": ["The client loses unless she proves breach and causation; a reasonable tactical choice isn't negligence.", "The client wins, because Nye's failure to cross-examine the witness caused the loss at trial.", "The client wins, because tactical decisions about cross-examination belong to the client, not the lawyer.", "The client loses, because lawyers are immune from suit for any decision made during trial."], "e": "Losing isn't negligence, and the standard doesn't guarantee results. Reasonable tactical judgments, especially those discussed with the client, rarely breach the duty of care, and the client must also prove causation.", "r": "Outline V-C; [S2:36–37]"},
{"t": "comp", "q": "At the first meeting, a client says, 'I'm sure I'll get at least $500,000.' Lawyer Oak privately thinks $50,000 is optimistic but says nothing, eager to sign the case. Which risk is Oak running?", "a": ["That his silence will be read as agreement with, or even a guarantee of, an unrealistic result.", "None, because lawyers have no professional duty to manage their clients' expectations about outcomes.", "Only a fee dispute, because the client might later refuse to pay a lawyer who obtained less than she hoped.", "Discipline for improperly soliciting the client by implying that a large recovery was likely."], "e": "Never promise results (compare Hawkins v. McGee). Silence in the face of unrealistic expectations can be read as agreement or a guarantee. Correct expectations promptly (1.4(b), 2.1) and include a no-guarantee clause in the engagement letter.", "r": "Outline V-C; MR 1.4(b), 2.1"},
{"t": "comp", "q": "Which statement best distinguishes the duties of competence and diligence from the civil duty of care?", "a": ["Competence and diligence are enforced by discipline with no harm needed; care is civil and needs causation.", "Competence and diligence require proof of monetary harm, while the duty of care does not.", "Competence and diligence are enforced only by malpractice suits brought by clients, while care is enforced through professional discipline.", "They are identical duties with identical elements and identical consequences for the lawyer."], "e": "1.1 and 1.3 are disciplinary rules, violated without proof of harm or causation. Care is the civil duty enforced through negligence, which requires duty, breach, causation, and damages. Criminal defense adds the Sixth Amendment's effective-assistance guarantee.", "r": "Outline V frame; [S2:12, 35]"},
{"t": "comp", "q": "Police question a suspect for six hours before he is formally charged; he has no lawyer. After indictment, he is assigned counsel who represents him at trial and on his first appeal. When did his Sixth Amendment right to effective assistance attach?", "a": ["At the start of formal adversary proceedings, continuing through trial and the first appeal.", "When police first began questioning him as a suspect, before any charge was filed.", "Only at trial, when the jury was sworn and the prosecution's case began.", "Only after conviction, for purposes of the first appeal of right."], "e": "The Sixth Amendment right attaches at formal adversary proceedings (formal charge, preliminary hearing, indictment, information, or arraignment) and covers critical stages through trial, sentencing, and the first appeal of right. Pre-charge interrogation rights come from the Fifth Amendment (Miranda), not the Sixth.", "r": "Outline V-D; [S2:38]"},
{"t": "comp", "q": "Defense counsel in a capital case decided not to seek a psychiatric evaluation or call character witnesses at sentencing, fearing that doing so would open the door to damaging rebuttal evidence. The defendant was sentenced to death and claims ineffective assistance. Under Strickland v. Washington, what is the likely analysis?", "a": ["The choice was a reasonable strategic judgment entitled to a strong presumption, so deficiency likely fails.", "Counsel was per se ineffective, because the stakes in a capital sentencing are the highest possible and any omission is presumed prejudicial.", "The defendant need only show that some other competent counsel might have chosen differently.", "Prejudice is presumed, because sentencing is a critical stage of a capital proceeding."], "e": "Strickland requires (1) deficiency, meaning performance below an objective standard of reasonableness, with highly deferential review and wide latitude for strategy, and (2) prejudice, a reasonable probability of a different result. On these facts, counsel wasn't deficient, and Washington was executed. Counsel was present and made choices, so the Cronic presumption doesn't apply.", "r": "Strickland; Outline V-D; [S2:18]"},
{"t": "comp", "q": "Defense counsel failed to object to a minor piece of hearsay at trial. The prosecution's other evidence of guilt, including DNA, video, and a confession, was overwhelming. On an ineffective-assistance claim, which element will most likely be dispositive?", "a": ["Prejudice, because there is no reasonable probability of a different result given the overwhelming evidence.", "Deficiency, because failing to object to hearsay is never deficient performance by defense counsel.", "Neither, because any error by defense counsel requires automatic reversal of the conviction.", "Prejudice, which is presumed whenever defense counsel makes an evidentiary error that lets inadmissible evidence reach the jury."], "e": "Most Strickland claims fail on prejudice. Even egregious lapses (counsel sleeping during cross, drunk counsel) have been held non-prejudicial when the evidence was overwhelming. A Rule violation can show deficiency, but not prejudice. First identify which result might have differed (verdict, sentence, plea; Lafler v. Cooper).", "r": "Strickland; Lafler v. Cooper; Outline V-D"},
{"t": "comp", "q": "A defendant charged with a felony is sentenced while his retained defense lawyer, who overslept, is absent. The defendant had significant mitigation evidence and received a sentence well above the guidelines range. Must he prove Strickland prejudice?", "a": ["No; absence at a critical stage like sentencing equals no counsel, so prejudice is presumed under Cronic.", "Yes, because every ineffective-assistance claim requires proof of both deficiency and prejudice.", "Yes, because the defendant could have presented his own mitigation evidence at the sentencing.", "No, because retained counsel are held to a higher standard of performance than appointed counsel."], "e": "United States v. Cronic: prejudice is presumed when circumstances equal no counsel at all, such as absence at a critical stage or a complete failure to subject the prosecution's case to meaningful adversarial testing. Sentencing is a critical stage.", "r": "Cronic; Outline V-D; [S2:43]"},
{"t": "comp", "q": "A court gave a young real estate lawyer only 25 days to prepare for a complex check-kiting trial that the government had investigated for years. The defendant was convicted and argues prejudice should be presumed. What did the Supreme Court hold in United States v. Cronic?", "a": ["The circumstances didn't justify presuming prejudice, so specific errors had to be shown under Strickland.", "Prejudice was presumed because counsel was young and inexperienced in criminal matters.", "Prejudice was presumed because 25 days to prepare is inadequate as a matter of law.", "The conviction was automatically reversed, because appointed counsel had less than a month to prepare for a complex fraud trial."], "e": "Cronic stated the per se test (no counsel at a critical stage, or no meaningful adversarial testing) but held it didn't apply on those facts. A hard assignment, short preparation time, or inexperience isn't the equivalent of no lawyer at all. Know both the test and the result.", "r": "Cronic; Outline V-D; [S2:22]"},
{"t": "comp", "q": "During a felony trial, defense counsel sleeps through the prosecution's opening, cross-examines no one, leaves the courtroom during his client's cross-examination, tells the jury in closing 'I agree my client is guilty,' and is absent when the verdict is read. Must the defendant prove Strickland prejudice?", "a": ["Likely not; absence at critical stages and no adversarial testing fall within Cronic's presumption.", "Yes, because cases involving sleeping counsel always require proof of prejudice under Strickland.", "Yes, unless the defendant can prove that he was actually innocent of the attempted murder charge.", "No, but only because counsel conceded the client's guilt in closing without the client's consent."], "e": "Individually, some lapses (e.g., brief sleeping) have been found non-prejudicial. Taken together, absence at critical stages, conceding guilt, and no adversarial testing are the equivalent of no counsel, so Cronic applies.", "r": "Cronic; Outline V-D; [S2:26–28]"},
{"t": "comp", "q": "After sentencing, a defendant expressly tells his lawyer to file a notice of appeal. The lawyer believes the appeal is frivolous and doesn't file it, and the deadline passes. Must the defendant show that his appeal would likely have succeeded?", "a": ["No; ignoring an instruction to appeal is deficient, and prejudice is presumed because the appeal is lost.", "Yes, because Strickland always requires a showing that the outcome would have been different.", "No, because a lawyer's failure to file any required document is per se malpractice.", "Yes, because counsel's judgment that the appeal was frivolous is entitled to deference."], "e": "Roe v. Flores-Ortega: a lawyer who disregards specific instructions to file a notice of appeal acts in a professionally unreasonable manner, and the defendant need not show his appeal would have merit, only that he would have appealed. Whether to appeal belongs to the client. If counsel thinks it frivolous, there are proper procedures (e.g., Anders briefs).", "r": "Roe v. Flores-Ortega; Outline V-D; [S2:24]"},
{"t": "comp", "q": "A defendant with three prior armed-robbery convictions insists on testifying despite her lawyer's thorough advice that impeachment with the priors could be devastating. She testifies, is impeached, and is convicted. She claims ineffective assistance. What is the likely result?", "a": ["The claim fails, because testifying is the client's decision and her informed choice isn't counsel's deficiency.", "The claim succeeds, because competent counsel should have refused to allow a defendant with three prior robbery convictions to testify.", "The claim succeeds, because the impeachment with her prior convictions was plainly prejudicial.", "The claim fails only if the lawyer affirmatively recommended that she testify."], "e": "1.2(a): the decision whether to testify belongs to the criminal defendant after consultation. Counsel who fully informs the client isn't deficient when the client chooses. By contrast, affirmatively advising testimony based on an inexplicable guess might be deficient, but she'd still have to show prejudice.", "r": "MR 1.2(a); Outline V-D; [S2:19–21]"},
{"t": "comp", "q": "Defense counsel's neglect forfeited a client's appeal. The client later sues counsel for malpractice. In most states, what must the client prove beyond ordinary negligence elements?", "a": ["That she was actually innocent and would likely have been acquitted or won reversal but for the error.", "Only that counsel's conduct was deficient under the first prong of the Strickland standard.", "That counsel acted with malice toward her rather than mere carelessness in missing the deadline.", "Nothing beyond the ordinary elements, because criminal malpractice follows ordinary negligence rules."], "e": "Most states require criminal-malpractice plaintiffs to prove actual innocence (e.g., Coscia v. McKenna & Cuneo; Dombrowski v. Bulson). The principal remedy for ineffective assistance is reversal and a new trial, not damages.", "r": "Outline V-D; [S2:23–25]"},
{"t": "comp", "q": "A convicted client's new lawyer files a habeas petition alleging that trial counsel Pell was ineffective. Pell still represents the client in a separate pending sentencing-modification matter. What issue does the ineffective-assistance claim create?", "a": ["A conflict: his interest in defending his own performance diverges from the client's, likely requiring withdrawal.", "None, because the habeas petition is a separate proceeding from the pending sentencing matter.", "A duty for Pell to defend the conviction on the client's behalf in the habeas proceeding, as her counsel of record.", "An obligation for Pell to report himself to the disciplinary authority for ineffective assistance."], "e": "Once accused of ineffectiveness, defense counsel's interests shift toward the prosecution's (defending his own performance), creating a 1.7(a)(2) personal-interest conflict that will likely require withdrawal. Pell may use confidential information only as 1.6(b)(5) allows to respond to the allegations.", "r": "Outline V-D; MR 1.7(a)(2), 1.6(b)(5)"},
{"t": "comp", "q": "Appointed counsel Quin believes his client, charged with sexual assault, is dangerous and probably guilty. He never interviews the client's alibi witness, makes no objections, presents no defense, and argues only that the state failed to meet its burden. The client is convicted. Which is the strongest description of Quin's conduct?", "a": ["A failure to subject the case to adversarial testing, plus a personal-interest conflict, supporting a claim and discipline.", "Proper, because counsel was physically present and on time for every phase of the trial.", "Proper, because the choice of which witnesses to call, and whether to object, is always a means decision reserved to the lawyer.", "Improper only if the alibi witness's testimony would definitely have secured an acquittal."], "e": "Strategic choices get deference, but not when driven by counsel's personal view of the client's guilt rather than the client's interests. Failing to investigate the alibi and abandoning advocacy approaches Cronic territory and at least satisfies Strickland deficiency. It also implicates 1.1, 1.3, and 1.7(a)(2). Representation isn't endorsement (1.2(b)).", "r": "Strickland; Cronic; MR 1.7(a)(2); Outline V-D; [S2:39–41]"},
{"t": "comp", "q": "Defense counsel failed to tell his client about a favorable plea offer, which lapsed. The client went to trial, was convicted, and received a sentence far longer than the plea offered. For Strickland prejudice, what must the client show?", "a": ["A reasonable probability that he would have accepted the plea, it would have been entered, and the sentence would be lower.", "Only that he was convicted at trial after the plea offer lapsed without his knowledge.", "That he was actually innocent of the charges to which he would have pleaded guilty.", "That the trial at which he was convicted was fundamentally unfair to him, because a fair trial cures any error in plea bargaining."], "e": "Identify which result might have differed. In the plea context (Lafler v. Cooper; Missouri v. Frye), prejudice focuses on the lost plea and the resulting sentence, not the fairness of the trial. Failing to convey the offer also violates 1.4(a)(1).", "r": "Lafler v. Cooper; MR 1.4(a)(1); Outline V-D; [W2:14]"},
{"t": "conf", "q": "Twenty years after representing a celebrity in a messy divorce, retired Lawyer Abbott writes a memoir describing the celebrity's private disclosures. Abbott argues that time has passed, the representation is long over, and everything she wrote is true. Is Abbott subject to discipline?", "a": ["Yes, because confidentiality to a former client survives the representation, and neither time nor truth is an exception.", "No, because the duty of confidentiality ends when the representation ends and the client's file is closed.", "No, because truth is a complete defense to any claim that a lawyer improperly disclosed client information.", "No, because a retired lawyer who no longer practices is no longer subject to the Rules of Professional Conduct, even if still licensed."], "e": "1.9(c)(2) prohibits revealing a former client's information except as the Rules permit. The duty survives termination and can last indefinitely. Truth and the passage of time aren't exceptions. Retired lawyers who retain their licenses remain subject to discipline.", "r": "MR 1.9(c); Outline VI-A"},
{"t": "conf", "q": "While representing a client in a construction dispute, Lawyer Banks learns from a third-party witness that the client's CEO is having an affair. The fact has nothing to do with the dispute. At a dinner party, Banks mentions it. Is the information protected by Rule 1.6?", "a": ["Yes; Rule 1.6 covers information obtained in connection with the representation from any source, relevant or not.", "No, because the information came from a third-party witness rather than from the client or its officers.", "No, because the CEO's affair was irrelevant to the construction dispute that Banks was hired to handle.", "No, because only communications protected by the attorney-client privilege are confidential under the Rules."], "e": "1.6(a) covers 'information relating to the representation of a client,' read as information obtained in connection with the representation, from any source, whether or not relevant and whether or not privileged. Confidentiality is broader than scope.", "r": "MR 1.6(a); Outline VI-A; [S3:16, 24]"},
{"t": "conf", "q": "A reporter calls Lawyer Cruz: 'I see from the court clerk's records that you filed for a zoning variance for DevCo yesterday. Can you confirm you represent DevCo and tell me what they plan to build?' The filing is in the public record. What may Cruz say?", "a": ["Decline to discuss client matters; the representation and the filing are still confidential, and Cruz may not lie.", "Confirm the representation and describe the plans, because the filing is a public record that anyone could inspect at the clerk's office.", "Confirm the representation but decline to describe the plans, because the client's identity is already public.", "Deny representing DevCo, because a lawyer may say whatever is necessary to protect a client's confidences."], "e": "Information doesn't lose protection just because it's in a public record. It must be 'generally known' (widely recognized, Op. 479), and a recent filing in the clerk's office isn't. The client's identity and the fact of representation are protected too. The right answer is 'I can't discuss client matters,' and lying would violate 4.1(a) and 8.4(c).", "r": "MR 1.6(a); ABA Op. 479; Outline VI-A; [S3:60–62]"},
{"t": "conf", "q": "Lawyer Dunn formerly represented a manufacturer. During that representation, Dunn learned that the company's main plant had a serious safety violation. Two years later, the violation is reported on the front page of the region's largest newspaper and widely discussed on local television. Dunn now represents a plaintiff in an unrelated matter against the manufacturer. May Dunn use the safety information to the manufacturer's disadvantage?", "a": ["Yes, generally known information may be used against a former client, though 1.9(c)(2) still limits revealing it.", "No, because information learned from a former client can never be used against it in any later matter.", "Yes, and Dunn may also freely reveal any additional details about the violation that she learned while representing the manufacturer.", "No, because Dunn must first obtain the former client's informed consent before using any of its information."], "e": "1.9(c)(1) permits using a former client's information to its disadvantage when it has become generally known, such as front-page coverage widely recognized in the region. 1.9(c)(2) still bars revealing information except as the Rules permit, so details beyond what is generally known stay protected. Some states (e.g., NY) treat generally known information differently.", "r": "MR 1.9(c); ABA Op. 479; Outline VI-A trap"},
{"t": "conf", "q": "Lawyer Ely represents a seller of land. The seller's deed history includes a decades-old easement recorded on page 74 of a 90-page document in the county land records, which only a title searcher would likely find. Is the easement 'generally known'?", "a": ["No; information that takes more than minimal effort to find isn't generally known just because it's public.", "Yes, because every document recorded in the public land records is generally known as a matter of law.", "Yes, because anyone could obtain a copy of the land records from the county recorder's office.", "No, because information contained in recorded documents can never become generally known."], "e": "'Generally known' means widely recognized by members of the public in the relevant geographic area or in the client's industry (Op. 479). A front-page headline is generally known. Something buried in a lengthy recorded document isn't.", "r": "ABA Op. 479; Outline VI-A; [S3:20–21]"},
{"t": "conf", "q": "Partner Rainmaker's firm represents Mojo Co. Separately, the general counsel of Petro Corp. once consulted Rainmaker, as a prospective client, about Petro's plans, and the firm declined the matter. Rainmaker now realizes Petro's plans would hurt Mojo. He argues that because the information 'relates to' Mojo's matter, loyalty and candor to Mojo require him to tell Mojo. Is he right?", "a": ["No; the information was obtained through Petro's consultation and is protected for Petro.", "Yes, because duties to a current client always take priority over duties owed to a prospective client.", "Yes, because the information relates to Mojo's matter, and Rule 1.4 requires sharing anything relevant with Mojo.", "No, but only because Petro is the larger company and its interests therefore deserve greater protection."], "e": "'Relating to the representation' is read as 'obtained in connection with' it. Information from Petro's consultation is protected for Petro (1.18(b)). Duties of candor to Mojo don't override duties owed to others, and the firm may have a conflict to address (1.18(c), 1.7(a)(2)).", "r": "MR 1.6, 1.18(b); Outline VI-A; [S3:56, 63]"},
{"t": "conf", "q": "Associate Fry is working on a client's divorce. Which disclosure of confidential information is impliedly authorized without the client's express consent?", "a": ["Discussing the case with the supervising partner and the paralegal assigned to the matter.", "Discussing the case with another associate in the firm who is not working on it but is curious.", "Describing the case, with identifying details, to law school friends to get their reactions.", "Telling opposing counsel about the client's private health problems to encourage a settlement."], "e": "1.6 cmt [5]: lawyers in a firm may disclose client information to each other unless the client instructs otherwise, and the 'need to know' principle governs. Sharing with the team working on the matter is impliedly authorized. Sharing with uninvolved colleagues out of curiosity, or with outsiders, isn't.", "r": "MR 1.6(a) cmt [5]; Outline VI-B, VI-D; [S3:64–66]"},
{"t": "conf", "q": "Lawyer Gill receives a subpoena for documents relating to her client's finances. Some documents are privileged communications; others are merely confidential business records. What should Gill do?", "a": ["Assert privilege in good faith for privileged items and produce the non-privileged documents the subpoena requires.", "Refuse to produce anything, because all client information is confidential and protected from disclosure.", "Produce everything, because a valid subpoena overrides the attorney-client privilege and work product.", "Produce the privileged documents but withhold the confidential business records, which are more sensitive and therefore more protected."], "e": "The duty of confidentiality bars voluntary disclosure, but it yields to legal compulsion such as subpoenas and discovery (1.6(b)(6)). Privilege and work product provide immunity from compelled disclosure and must be asserted in good faith. Where you may withhold privileged material, you must, until a court or the client directs otherwise. You needn't defy a final order.", "r": "MR 1.6(b)(6); Outline VI-B; [S3:26]"},
{"t": "conf", "q": "Lawyer Hu, representing a client in a confidential merger, buys the target company's stock before the deal is announced. The client is not harmed, and its deal goes forward on the same terms. Which is most accurate?", "a": ["It isn't a use to the client's disadvantage, but it's a wrongful profit subject to disgorgement and other liability.", "Hu violated Rule 1.8(b), because any use of client information, harmful or not, is prohibited by that Rule.", "Hu did nothing wrong, because the client was not harmed and the deal closed on the agreed terms.", "Hu must pay the client damages equal to the client's losses from his trading, because every misuse of client information is presumed harmful."], "e": "The confidentiality rules bar using information to the client's disadvantage (1.8(b), 1.9(c)(1), 1.18(b)). Wrongful profit without disadvantage isn't a confidentiality-rule violation, but fiduciaries may not profit from their position beyond agreed compensation, so disgorgement follows. Insider trading is also a crime (8.4(b)).", "r": "Outline VI-B use-vs-profit table; [S3:22–23, 27]"},
{"t": "conf", "q": "While representing Client A in a franchise dispute, Lawyer Ivo develops an innovative legal argument and a well-crafted brief template. He later uses both, without client-specific facts, for Client B in an unrelated franchise case. Client A objects. Has Ivo violated the Rules?", "a": ["No; general knowledge and skill may be reused for other clients if no client-specific confidences are used.", "Yes, because the argument was developed with Client A's fees, so A owns the work product.", "Yes, because all legal work product belongs exclusively to the client that paid for it.", "No, but only if Client B agrees to pay Client A a reasonable royalty for the use."], "e": "1.8 cmt [5] and the course's use table: general knowledge, research, and forms developed for one client may benefit others without harming the original client. Don't overcharge the later client for work already done.", "r": "MR 1.8 cmt [5]; Outline VI-B; [S3:23]"},
{"t": "conf", "q": "Lawyer Jun keeps client files in a locked briefcase. One evening she is mugged at gunpoint, and the briefcase is taken. Has she violated Rule 1.6(c)?", "a": ["No, because Rule 1.6(c) requires reasonable efforts, not perfection.", "Yes, because any loss of a client's confidential information is a violation of Rule 1.6(c).", "Yes, because lawyers must never carry client files outside the office.", "No, because a third party's criminal act always excuses any resulting disclosure."], "e": "1.6(c) and cmt [18]: unauthorized access or disclosure isn't a violation if the lawyer made reasonable efforts to prevent it. Factors include sensitivity, likelihood of disclosure, cost and difficulty of safeguards, and their effect on the representation.", "r": "MR 1.6(c) cmt [18]; Outline VI-B; [S3:72]"},
{"t": "conf", "q": "Associate Kim is working on a client's confidential IPO. She leaves draft offering documents on her desk overnight in an office used by cleaning staff and visitors. A partner sees them and tells her never to do it again. Is the partner overreacting?", "a": ["No; market-moving information needs safeguards proportional to its sensitivity, and leaving it out isn't reasonable.", "Yes, because the documents never left the firm's offices, which are secure by definition, so no further safeguards were needed.", "Yes, because only electronically stored information requires special safeguards under the Rules.", "No, but only because leaving papers on a desk violates the firm's housekeeping policy."], "e": "1.6(c) requires reasonable efforts proportional to sensitivity. Securities-offering information is market-moving and attractive to insiders and traders. Lock it up. A cross-exam outline in a secure prosecutor's office is a closer, likely reasonable case.", "r": "MR 1.6(c); Outline VI-B; [S3:72; S4:20]"},
