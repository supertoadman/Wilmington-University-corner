{"t": "conf", "q": "Lawyer Lux regularly emails clients about routine matters using a standard, password-protected firm email account. A client asks Lux to send highly sensitive trade-secret documents. Which statement is most accurate under Rule 1.6 comment [19]?", "a": ["Ordinary email may suffice if it carries a reasonable expectation of privacy, but sensitive secrets may warrant encryption.", "Lawyers must always encrypt every email they send to clients, regardless of the content.", "Lawyers may never transmit client information by ordinary email, because email can always be intercepted by third parties.", "Email is always adequate for any information, because intercepting email is a federal crime."], "e": "1.6 cmt [19]: the lawyer must take reasonable precautions against unintended recipients. Special security isn't required if the method affords a reasonable expectation of privacy, but special circumstances, such as highly sensitive information, may warrant special precautions (see Op. 477R).", "r": "MR 1.6 cmt [19]; ABA Op. 477R; Outline VI-B; [S3:33]"},
{"t": "conf", "q": "Which conduct is LEAST consistent with a lawyer's duty to make reasonable efforts to safeguard client information?", "a": ["Discussing a client's pending acquisition by phone in a crowded rideshare.", "Using a privacy screen on a laptop while working on a commuter train.", "Keeping client files in the car with her rather than handing the keys to a valet.", "Locking market-moving documents in a desk drawer overnight."], "e": "Public places such as streets, transit, rideshares, elevators, restaurants, and even firm lobbies and restrooms are poor places to discuss client matters. Screen guards, keeping files under your control (no valet, no bell stand), and locking sensitive papers are reasonable precautions.", "r": "Outline VI-B; [S3:30–32]"},
{"t": "conf", "q": "A client dies. The client's lawyer is subpoenaed in a federal criminal investigation to testify about the client's privileged statements made shortly before death. Which statement is most accurate?", "a": ["The privilege generally survives death in federal court, so the lawyer can resist the subpoena.", "The privilege ended at the client's death, so the lawyer must testify about the statements.", "The privilege survives only if the client's estate is a party to the investigation.", "The privilege survives only for statements the client made about the terms of the will."], "e": "Swidler & Berlin v. United States held that the federal attorney-client privilege survives the client's death. The ethical duty of confidentiality also generally continues, though about half the states end it at least partly at death, chiefly for disputes among heirs.", "r": "Swidler & Berlin; Outline VI-B"},
{"t": "conf", "q": "On the evening of an assault, defense lawyer Mott saw his client arrive at Mott's office wearing a blood-stained shirt. The client said nothing about it. At trial, the prosecutor subpoenas Mott to testify about the shirt. Which is most accurate?", "a": ["Confidential but not privileged, because privilege protects communications, not a lawyer's observations.", "Privileged, because the observation occurred during the representation in the lawyer's own office.", "Neither confidential nor privileged, because the shirt was visible to anyone who saw the client that night.", "Work product, and therefore absolutely protected from any compelled disclosure at trial."], "e": "The duty of confidentiality covers everything obtained in connection with the representation, including observations. Attorney-client privilege protects only confidential communications for the purpose of legal advice. An observation isn't a communication, so privilege may not shield it from compelled testimony (subject to local doctrines).", "r": "Outline VI-C trap; [S3:74]"},
{"t": "conf", "q": "Anticipating litigation with a customer, an employee forwards to the company's outside counsel a pre-existing internal email in which two managers discussed the customer's complaints. The cover message asks counsel whether the company should sue. In later discovery, which is privileged?", "a": ["The cover message seeking advice; a pre-existing email never becomes privileged just by being sent to counsel.", "Both, because both documents are now in the lawyer's files and relate to legal advice.", "Neither, because business emails are never privileged, even when sent to a lawyer.", "The pre-existing email only, because it contains the underlying facts of the dispute."], "e": "Privilege protects confidential communications between lawyer and client made for legal advice. A pre-existing business document doesn't become privileged by being sent to counsel, though the request for advice may be privileged. The underlying facts are discoverable from other sources.", "r": "Outline VI-C trap; [S3:74–75]"},
{"t": "conf", "q": "A prosecutor's investigator interviews a crime witness and writes up a statement, which the witness reviews and signs. Defense counsel seeks the statement in discovery, and the witness separately asks for a copy. Which is correct?", "a": ["It's work product, but the protection is qualified, and a witness can generally get her own statement.", "It's absolutely privileged as a confidential attorney-client communication.", "It isn't protected at all, because it was prepared by a nonlawyer investigator rather than by the prosecutor herself.", "It's protected only if the prosecutor personally prepared it."], "e": "Work product covers documents prepared in anticipation of litigation by or for a party or its representative, including investigators. It's a qualified protection that yields to substantial need plus undue hardship, but mental impressions are almost never discoverable. A witness can obtain her own prior statement. Privilege doesn't apply because the witness isn't the client.", "r": "Outline VI-C; FRCP 26(b)(3); [S3:73–74]"},
{"t": "conf", "q": "A client voluntarily emails a copy of her lawyer's privileged advice letter to a business associate to 'get her thoughts.' In later litigation, the opposing party seeks the letter. What is the likely result?", "a": ["Privilege is likely waived, because voluntary disclosure to a third party waives it, though the lawyer's duty remains.", "The letter remains privileged because it was confidential when the lawyer originally sent it to the client.", "The letter remains privileged, because only the lawyer, as its author, has the power to waive the privilege that attaches to it.", "The letter is privileged in court but not in arbitration, where evidentiary privileges do not apply."], "e": "Privilege belongs to the client, and even a limited voluntary disclosure to a third party generally waives it for all purposes. The lawyer's ethical duty of confidentiality isn't waived by the client's disclosure. The lawyer still may not voluntarily reveal it.", "r": "Outline VI-C table; [S3:19]"},
{"t": "conf", "q": "Two co-defendants and their separate lawyers meet to coordinate their defenses and share privileged information under a written agreement. Later the prosecution argues the sharing waived privilege. Which doctrine most directly protects the communications?", "a": ["The joint-defense (common-interest) doctrine.", "The work-product doctrine, because the information was shared in anticipation of trial.", "The duty of confidentiality, because ethical duties override the rules of evidence.", "None, because sharing with any third party always waives the privilege."], "e": "The joint-defense or common-interest doctrine permits parties with common legal interests and their counsel to share privileged information without waiving privilege. The elements of privilege are a relationship, a confidential communication not shared with outsiders, and a purpose of seeking or giving legal advice.", "r": "Outline VI-C; [S3:38]"},
{"t": "conf", "q": "Associate Nash writes a memo to a partner analyzing whether a non-compete clause in a pending acquisition is enforceable. No litigation is anticipated. Which classification is most accurate?", "a": ["Confidential and arguably privileged, but not work product, because no litigation was anticipated.", "Work product, because lawyers prepared the memo in the course of the representation.", "Neither confidential nor privileged, because the memo was never sent to the client and stayed inside the firm.", "Privileged and work product, but not confidential, because it stayed inside the firm."], "e": "Work product requires anticipation of litigation. A deal memo doesn't qualify. It's confidential, and it's arguably privileged as part of the legal-advice process, and more clearly so once communicated to the client.", "r": "Outline VI-C trap; [S3:75]"},
{"t": "conf", "q": "A litigation adversary seeks a defense lawyer's handwritten notes of her interview with a non-client eyewitness, including the lawyer's assessment of the witness's credibility. The adversary shows the witness has since died. What is the most likely ruling?", "a": ["Facts may be discoverable on substantial need and undue hardship, but mental impressions stay almost fully protected.", "Everything in the notes is discoverable, because the witness has died and the information is otherwise unavailable.", "Nothing is discoverable, because the notes are protected by the attorney-client privilege.", "Everything is protected, because the work-product doctrine provides absolute protection."], "e": "Work product is qualified. Ordinary work product yields to substantial need and undue hardship (the death of a witness may qualify), but opinion work product, meaning mental impressions, conclusions, and legal theories, is almost never discoverable. The notes aren't privileged because the witness isn't the client.", "r": "FRCP 26(b)(3); Outline VI-C"},
{"t": "conf", "q": "Lawyer Orr is asked by a client's insurer whether the client has 'ever been involved in any other lawsuits.' Orr knows of two, both of public record, which he learned of while representing the client. Before analyzing any exception, what should Orr do first?", "a": ["Decide whether each item is confidential at all, breaking it into its smallest units, before looking for an exception.", "Look first for an exception under Rule 1.6(b) that would permit telling the insurer about the lawsuits the client was involved in.", "Disclose both lawsuits, because information in public court records is never confidential.", "Refuse to answer, because everything a lawyer knows about a client is privileged."], "e": "Framing principle: break information into its smallest units and ask whether it's confidential at all before hunting for an exception. Public records aren't automatically 'generally known.' And 'not confidential' means only that you may disclose, not that you should. The client's consent is the cleanest route.", "r": "Outline VI-D; [S3:3]"},
{"t": "conf", "q": "Lawyer Penn reasonably believes his client is about to cause serious bodily injury to a former business partner. Penn calls the partner, describes the threat, and also tells him about the client's unrelated tax problems and past affairs 'so you'll know who you're dealing with.' Is Penn subject to discipline?", "a": ["Yes; disclosure under an exception is limited to what is reasonably necessary, and the extra information wasn't.", "No, because once any 1.6(b) exception applies, the lawyer may disclose any information about the client.", "No, because the threat of serious bodily injury justified complete disclosure of everything Penn knew about the client's background.", "Yes, because Rule 1.6(b)(1) never permits a lawyer to warn a potential victim directly."], "e": "Every 1.6(b) exception is permissive and limited to the minimum necessary information, to the minimum people, for the specific purpose. Exceeding any of those limits is a violation. Warning the potential victim about the threat may be proper. The unrelated tax and affair details are not.", "r": "MR 1.6(b) & cmt [16]; Outline VI-D; [S3:41]"},
{"t": "conf", "q": "In his opening statement, Lawyer Quill describes facts his client will testify to, including some the client told Quill in confidence and that opposing counsel never asked about in deposition. Quill didn't preview the opening with the client. Was the disclosure authorized?", "a": ["Yes, it was impliedly authorized to carry out the representation, though walking the client through it is wise.", "No, because every disclosure of confidential information to anyone, including a jury, requires the client's express informed consent.", "No, because information that was not disclosed in discovery can never be revealed at trial.", "Yes, because anything said at a public trial is generally known and therefore not confidential."], "e": "1.6(a) cmt [5]: lawyers are impliedly authorized to make disclosures that carry out the representation, such as admitting facts in pleadings or presenting the client's anticipated testimony. Implied authority doesn't override an express client instruction to the contrary.", "r": "MR 1.6(a) cmt [5]; Outline VI-D; [S3:78]"},
{"t": "conf", "q": "A client suspected of killing two missing teenagers tells his lawyer where the bodies are. The lawyer explains that revealing the location could bring the families closure and earn some goodwill with prosecutors, but would also strongly implicate the client. The client says, 'Go ahead.' The lawyer tells the prosecutor. Was the disclosure proper?", "a": ["Yes, because the client gave informed consent after the lawyer explained the material risks and benefits.", "No, because the client's confession is privileged and can never be disclosed by the lawyer.", "Yes, because Rule 1.6(b)(1) required disclosure to prevent further deaths.", "No, because informed consent to disclose must be given in a writing signed by the client."], "e": "Informed consent (1.0(e)) requires explaining material risks and reasonably available alternatives. Oral consent suffices under 1.6(a), though confirming significant consents in writing is wise. 1.6(b)(1) wouldn't apply because the victims are dead. Contrast the 'Buried Bodies Case,' where lawyers kept silent.", "r": "MR 1.6(a), 1.0(e); Outline VI-D, VI-G; [S3:77]"},
{"t": "conf", "q": "During a bitter divorce, a client tells Lawyer Rios, 'Sometimes I just want to wring her neck.' He has no history of violence and says nothing else threatening. Rios calls the wife to warn her. Was the disclosure permitted?", "a": ["No, because venting of this kind doesn't make death or substantial bodily harm reasonably certain.", "Yes, because any statement about harming another person permits disclosure to protect her.", "Yes, because Rule 1.6(b)(1) requires a lawyer to warn any potential victim of a client threat.", "No, because Rule 1.6(b)(1) applies only to threats of harm to the client himself."], "e": "1.6(b)(1) permits disclosure to prevent reasonably certain death or substantial bodily harm, meaning harm that will be suffered imminently or a present and substantial threat (cmt [6]). Ordinary venting doesn't qualify, but a weapon plus a specific threat might. The Model Rules impose no duty to warn, though some states do.", "r": "MR 1.6(b)(1) & cmt [6]; Outline VI-E; [S3:80]"},
{"t": "conf", "q": "A client arrives at Lawyer Sim's office at dawn, distraught: 'I choked my wife last night. She wasn't moving when I ran out.' May Sim call 911 to send help to the wife?", "a": ["Yes; the wife may still be alive, and summoning aid may prevent death.", "No, because the harm has already occurred, so the exception cannot apply.", "No, because everything the client said that morning is privileged.", "Yes, and Sim must also tell the police everything the client said."], "e": "1.6(b)(1) is preventive. It doesn't apply once the harm is complete, but the wife may be alive and dying, so summoning aid may prevent death. The disclosure must be limited to what's necessary (e.g., a medical emergency at that address), not a full confession.", "r": "MR 1.6(b)(1); Outline VI-E; [S3:43, 81]"},
{"t": "conf", "q": "A client arrives for a meeting smelling of alcohol and unsteady on his feet, then announces he must drive 45 minutes to the next town. Lawyer Tate tries to dissuade him and offers a ride, but he insists on driving. May Tate call the state police to report an impaired driver on the highway?", "a": ["Yes, because he reasonably believes disclosure is necessary to prevent reasonably certain death or bodily harm.", "No, because drunk driving is a crime the client commits on his own, not one furthered by the lawyer's services.", "No, because the client has not yet committed any crime by driving, so there is nothing that the lawyer is permitted to report.", "Yes, but only if the client has prior DUI convictions."], "e": "1.6(b)(1) isn't limited to client crimes or to crimes at all. It turns on reasonably certain death or substantial bodily harm. A visibly impaired driver about to drive 45 minutes presents a present and substantial threat. Try to dissuade first if that's safe, as Tate did.", "r": "MR 1.6(b)(1); Outline VI-E; [S3:82]"},
{"t": "conf", "q": "An engineer tells in-house counsel at a municipal water utility that a new, cheaper treatment process may be leaching lead into drinking water at levels that could cause neurological damage to children within months. Management dismisses the concern. Counsel immediately gives the story to a newspaper reporter. Which statement is most accurate?", "a": ["Some disclosure may be allowed, but a reporter exceeds what's necessary; report up, then to regulators.", "The disclosure was proper, because protecting public safety overrides confidentiality in every case.", "Counsel could disclose nothing at all, because the utility, not the public, is her client.", "Counsel was required by Rule 1.13 to tell the press once management dismissed the concern."], "e": "1.6(b)(1) may apply, but disclosure is limited to the minimum necessary to the right audience, such as public-health authorities, not the press. As organizational counsel, she must first report up (1.13(b)), and 1.13(c) may permit reporting out to the extent necessary.", "r": "MR 1.6(b)(1), 1.13(b)–(c); Outline VI-E, VI-F; [S3:79]"},
{"t": "conf", "q": "Lawyer Ulm drafted loan documents for a client. Ulm then learns the client is using the documents to obtain loans from multiple lenders on the same collateral, a fraud that will cause the lenders substantial losses. Which Rule 1.6 exception is most directly available?", "a": ["Rule 1.6(b)(2): the client is using the lawyer's services to commit a fraud causing substantial financial injury.", "Rule 1.6(b)(1), because severe financial losses from a fraud of this size can cause the lenders serious bodily or emotional harm.", "Rule 1.6(b)(4), because Ulm needs legal advice about his own conduct.", "No exception, because financial harm never permits disclosure."], "e": "1.6(b)(2) permits disclosure to prevent the client from committing a crime or fraud reasonably certain to cause substantial financial injury, in furtherance of which the client has used or is using the lawyer's services. The lawyer needn't have knowingly assisted. 4.1(b) may make disclosure mandatory, and withdrawal is required (1.16(a)).", "r": "MR 1.6(b)(2), 4.1(b); Outline VI-E; [S3:44]"},
{"t": "conf", "q": "Lawyer Vale learns that a client completed a securities fraud last month using offering documents Vale prepared. The investors have already lost money, though some funds might still be recovered. May Vale disclose information to help the investors?", "a": ["Yes, Rule 1.6(b)(3) permits disclosure reasonably necessary to mitigate or rectify the investors' losses.", "No, because the fraud is complete, so there is nothing left for disclosure to prevent.", "No, because the Rule 1.6(b) exceptions apply only to crimes and frauds that have not yet occurred.", "Yes, and Vale must disclose all of the client's financial information to every investor who lost money."], "e": "1.6(b)(3) extends beyond prevention to mitigating or rectifying completed frauds, but only where the client used the lawyer's services. Disclosure remains limited to what's reasonably necessary.", "r": "MR 1.6(b)(3); Outline VI-E; [S3:44–45]"},
{"t": "conf", "q": "A new client tells Lawyer Wu that over three years, before hiring Wu, she embezzled $600,000 from her employer using fake invoices. She stopped months ago and wants advice on what to do now. May Wu disclose the embezzlement to the employer under Rule 1.6(b)(3)?", "a": ["No; crimes committed before retention, without the lawyer's services, never qualify for this exception.", "Yes, because the employer suffered substantial financial injury from the embezzlement scheme, which the exception is designed to address.", "Yes, because embezzlement is a crime of dishonesty, which always permits disclosure.", "No, but Wu must withdraw immediately because the client has confessed to a serious crime."], "e": "1.6(b)(2)–(3) require that the client used (or is using) the lawyer's services in furtherance of the crime or fraud. Crimes committed before retention, or without the lawyer's services, never qualify, and defending or advising about a past crime isn't 'use.' Wu may represent her and should advise on lawful options.", "r": "MR 1.6(b)(2)–(3); Outline VI-E; [S3:45, 84]"},
{"t": "conf", "q": "Solo practitioner Xia's client insists she introduce evidence relevant only to claims the judge has dismissed, and threatens to sue if she refuses. Xia wants advice. She describes the full situation, including client confidences, to her favorite aunt, a retired lawyer whose license is inactive, over dinner. Which is most accurate?", "a": ["The disclosure is likely not privileged and risks violating 1.6; the exception is best used with counsel she retains.", "The disclosure is privileged, because the aunt is a lawyer and was giving legal advice about the matter.", "The disclosure is proper and privileged, because family members are within the circle of confidentiality.", "The disclosure is proper, because Rule 1.6(b)(4) allows disclosure to anyone able to give the lawyer helpful advice about the problem."], "e": "1.6(b)(4) permits revealing what's reasonably necessary to secure legal advice about the lawyer's own compliance. The lawyer must be the client. Casual consultations with retired relatives, office mates, or uninvolved colleagues may not be privileged. Confirming the adviser's role as your lawyer (even briefly by email, and paying her rate helps) strengthens privilege. A no-names hypothetical avoids disclosure entirely.", "r": "MR 1.6(b)(4); Outline VI-E; [S3:46, 85–90]"},
{"t": "conf", "q": "Former client Yates refuses to pay Lawyer Zane's fees, claiming she never authorized the work. In the fee arbitration, Zane wants to introduce (1) Yates's emails approving the tasks and (2) a ten-year-old civil fraud judgment against Yates that Zane discovered during the representation, 'to show she's not credible.' Which may Zane disclose?", "a": ["Only the approval emails, because self-defense disclosure is limited to what is reasonably necessary.", "Both, because once a client disputes a lawyer's fee, the entire duty of confidentiality as to that client is waived.", "Neither, because a fee arbitration is not a proceeding concerning the representation.", "Only the old judgment, because it is a matter of public record."], "e": "1.6(b)(5) permits disclosure to establish a claim or defense in a controversy between lawyer and client, but only to the extent reasonably necessary. The emails are directly relevant. The old judgment is gratuitous. Public-record status doesn't make it generally known.", "r": "MR 1.6(b)(5); Outline VI-E; [S3:47–49, 91–93]"},
{"t": "conf", "q": "After a negotiation ends, the opposing party's lawyer accuses Lawyer Abel, by letter, of having knowingly misrepresented material facts, and threatens to sue. No suit has been filed. Abel wants to show opposing counsel the client documents on which he based his statements. May he?", "a": ["Yes; a lawyer may respond to an assertion of complicity before any proceeding is filed, disclosing only what's needed.", "No, because the self-defense exception applies only after a formal complaint has been filed against the lawyer.", "No, because disclosing the client's documents would harm the client's interests in the transaction.", "Yes, and Abel may also disclose any other unfavorable information he learned about the client."], "e": "1.6 cmt [10]: the lawyer needn't wait for a proceeding to begin before responding to an assertion of complicity. The exception covers a defense to civil or criminal charges based on conduct involving the client, limited to what's necessary.", "r": "MR 1.6(b)(5) cmt [10]; Outline VI-E; [S3:93]"},
{"t": "conf", "q": "A former client posts an online review calling Lawyer Baird 'incompetent and lazy' and saying Baird 'ruined my custody case.' Baird wants to respond on the website with facts showing the client lied to her and missed meetings. What may Baird do?", "a": ["Post a neutral response that reveals nothing confidential, such as that professional duties prevent a detailed reply.", "Respond with the facts, because the self-defense exception applies to any accusation against a lawyer.", "Respond with the facts, because the client waived confidentiality as to the custody case by posting the review publicly.", "Sue the client for defamation and attach the client's file to the complaint as evidence of the truth."], "e": "ABA Op. 496: an online review isn't a 'controversy' or 'proceeding' within 1.6(b)(5), so a lawyer may not reveal confidential information in response. A neutral, non-disclosing reply (or none) is the safe course. Even 'what she said isn't true' risks revealing information.", "r": "ABA Op. 496; MR 1.6(b)(5); Outline VI-E; [S3:49, 94–95]"},
{"t": "conf", "q": "In a divorce, the court orders Lawyer Cole to disclose the amount the husband-client has deposited in Cole's trust account. Cole believes the order is wrong. Appellate review is unavailable before the compliance date. The client tells Cole not to comply. What should Cole do?", "a": ["Comply, seeking sealing or limits if appropriate, because a lawyer may disclose to obey a court order.", "Refuse to comply, because the client has expressly instructed him not to disclose the information.", "Comply, and also disclose the client's other assets, to demonstrate good faith to the court.", "Withdraw from the representation and leave compliance with the order to successor counsel."], "e": "1.6(b)(6) permits disclosure to comply with other law or a court order. Assert any good-faith objections and seek review where available, but once the order is binding, comply, minimizing scope through sealing or in camera review. Defying a valid order violates 3.4(c). Claiming 'privilege' over the existence of assets on a court-mandated disclosure form is likely improper, because assets aren't privileged communications.", "r": "MR 1.6(b)(6), 3.4(c); Outline VI-E; [S3:96–98]"},
{"t": "conf", "q": "Lawyer Diaz is negotiating to join another firm. To check for conflicts, the new firm asks for a list of Diaz's clients and the general nature of each matter. One client is a public company whose pending, unannounced acquisition of a target is among Diaz's matters. Which disclosure is appropriate?", "a": ["Only the limited identities and matter descriptions needed for conflicts, but nothing that would prejudice the client.", "Full details of every matter, because Rule 1.6(b)(7) permits complete disclosure whenever a lawyer is changing firms.", "No information at all, because conflict checks can be performed only after the lawyer joins the new firm.", "Everything except the clients' names, because client identity is the only protected information."], "e": "1.6(b)(7) permits limited disclosure to detect and resolve conflicts arising from a lawyer's change of employment or changes in firm composition, but only if it wouldn't compromise privilege or otherwise prejudice the client (cmt [13]). An unannounced takeover is the classic example of information that can't be shared.", "r": "MR 1.6(b)(7) & cmt [13]; Outline VI-E"},
{"t": "conf", "q": "Lawyer Erin is closing a real estate sale for a seller. She discovers that the seller has concealed a known structural defect from the buyer by doctoring an inspection report that Erin will deliver at closing. The seller refuses to correct it. Under Rule 4.1(b), what must Erin do?", "a": ["Not deliver the false report, withdraw, and disclose if necessary to avoid assisting the fraud and 1.6 allows it.", "Deliver the report, because Rule 1.6 prohibits disclosing the seller's concealment to anyone.", "Deliver the report at closing as the seller instructs, but tell the buyer about the defect privately after the deal closes.", "Nothing, because Rule 4.1 applies only to false statements the lawyer makes personally."], "e": "4.1(b): a lawyer must not knowingly fail to disclose a material fact when disclosure is necessary to avoid assisting a client's crime or fraud, unless 1.6 prohibits it. Because 1.6(b)(2) permits disclosure when the client is using the lawyer's services for fraud, disclosure becomes mandatory when necessary. Withdrawal (1.16(a)) and disaffirmance may suffice in some cases.", "r": "MR 4.1(b), 1.6(b)(2); Outline VI-F, IX-C; [S2:109–111]"},
{"t": "conf", "q": "Outside counsel to Corp. learns that a vice president is falsifying safety-test results, which is likely to cause the company massive liability. The VP tells counsel to keep quiet. What must counsel do under Rule 1.13(b)?", "a": ["Act in the company's best interest, ordinarily by referring the matter to higher authority, including the board.", "Keep the matter confidential as the VP instructed, because the VP is a constituent who speaks for the company.", "Report the VP to regulators immediately without informing anyone at the company.", "Withdraw without telling anyone, because the VP is the lawyer's designated client contact."], "e": "1.13(b): when a lawyer for an organization knows a constituent is violating a legal obligation to the organization, or law that may be imputed to it, in a way likely to cause substantial injury, the lawyer must proceed in the organization's best interest, ordinarily by reporting up, to the highest authority if warranted. A rogue officer's instruction doesn't control.", "r": "MR 1.13(b); Outline VI-F"},
{"t": "conf", "q": "Counsel reports a CFO's ongoing accounting fraud to the company's board, which refuses to act. The fraud is a clear violation of law reasonably certain to cause substantial injury to the company. The fraud did not involve counsel's services. May counsel reveal information outside the company?", "a": ["Yes, under Rule 1.13(c), to the extent reasonably necessary, even if Rule 1.6 would not otherwise permit it.", "No, because Rule 1.6(b)(2) requires that the lawyer's own services were used to commit the fraud, and here they were not.", "No, because the board's decision binds outside counsel once the matter has been reported to it.", "Yes, and counsel must disclose the fraud to all shareholders of the company."], "e": "1.13(c) permits 'reporting out' when the highest authority fails to address a clear violation of law reasonably certain to cause substantial injury to the organization. Unlike 1.6(b)(2), it doesn't require that the lawyer's services were used. Under 1.13(d), it doesn't apply to a lawyer retained to investigate or defend the alleged violation.", "r": "MR 1.13(c)–(d); Outline VI-F"},
{"t": "conf", "q": "A company hires Lawyer Fay specifically to conduct an internal investigation into alleged bribery by its executives and to defend the company in any resulting government inquiry. The board refuses to act on her findings. May Fay report the bribery outside the company under Rule 1.13(c)?", "a": ["No, because the reporting-out permission doesn't apply to a lawyer hired to investigate or defend the violation.", "Yes, because the board failed to act on a clear violation of law that was reasonably certain to cause the company substantial injury.", "Yes, because bribery of foreign officials always permits disclosure to the government.", "No, because Rule 1.13 never permits a lawyer to disclose information outside the organization."], "e": "1.13(d) carves out lawyers engaged to investigate an alleged violation or to defend the organization or its constituents against a claim arising from it. This preserves the ability of organizations to get candid investigation and defense.", "r": "MR 1.13(d); Outline VI-F"},
{"t": "conf", "q": "During a civil trial, Lawyer Gray's client testifies falsely about a material fact. Gray knows the testimony is false. Gray privately urges the client to correct it, but the client refuses. What must Gray do?", "a": ["Take reasonable remedial measures, including disclosure to the tribunal if necessary, even over Rule 1.6.", "Nothing further, because Rule 1.6 prohibits revealing the client's confidences to the court once the testimony has been given.", "Withdraw quietly from the representation without disclosing anything to the court.", "Report the client to the prosecutor for perjury, because perjury is a crime."], "e": "3.3(a)(3) and (c): if a lawyer's client has offered material evidence the lawyer knows is false, the lawyer must take reasonable remedial measures, including disclosure to the tribunal if necessary, even if that requires disclosing 1.6 information. Remonstrating with the client and seeking withdrawal come first if they would undo the effect.", "r": "MR 3.3(a)(3), (c); Outline VI-F"},
{"t": "conf", "q": "Researching a motion, Lawyer Hale finds a recent decision of the jurisdiction's highest court that is directly adverse to her position. Opposing counsel hasn't cited it. Must Hale disclose it?", "a": ["Yes; she must disclose directly adverse controlling authority that opposing counsel has not disclosed.", "No, because finding adverse authority is opposing counsel's job, not hers.", "No, because disclosing authority that hurts her own client's position would violate her duty of loyalty to that client.", "Yes, but only if the court specifically asks whether any adverse authority exists."], "e": "3.3(a)(2) requires disclosure of directly adverse controlling authority not disclosed by opposing counsel. Hale may argue it's distinguishable or wrongly decided.", "r": "MR 3.3(a)(2); Outline VI-F"},
{"t": "conf", "q": "Opposing counsel calls Lawyer Ivy: 'I hear your client is going to move to revoke custody because of the boy's bruises. Is that true?' The client has told Ivy to keep the planned motion quiet until a doctor's report arrives. What should Ivy say?", "a": ["Decline to discuss the client's plans, without lying.", "Deny that any motion is planned, to protect the client's confidence.", "Confirm the plan, because opposing counsel already seems to know about it.", "Say nothing and hang up without any explanation."], "e": "Confidentiality forbids revealing the plan, and honesty (4.1(a), 8.4(c)) forbids lying about it (In re Pressly). 'I can't discuss that' satisfies both. Honesty and confidentiality operate together: you may decline to speak, but you may not deceive.", "r": "MR 4.1(a), 8.4(c); In re Pressly; Outline VI-F; [S3:67–68]"},
{"t": "conf", "q": "A criminal defense client tells Lawyer Jain that he committed a robbery for which another man was wrongly convicted and is serving 15 years. The client refuses to come forward. The wrongly convicted man is not on death row. Under the Model Rules, may Jain disclose?", "a": ["No; there's no wrongful-conviction exception, so Jain may only urge the client to come forward.", "Yes, because preventing a miscarriage of justice is an implied exception to the duty of confidentiality.", "Yes, because wrongful imprisonment of another person counts as substantial bodily harm under Rule 1.6(b)(1).", "Yes, because Rule 3.3 requires correcting false evidence offered in any criminal case."], "e": "Imprisonment isn't death or substantial bodily harm, and there's no wrongful-conviction exception in the Model Rules. Circumstances that might change the analysis: an approaching execution (arguably reasonably certain death), the client's death in some states, or client consent. 3.3 applies to the lawyer's own tribunal proceedings, not another defendant's case.", "r": "MR 1.6(b)(1); Outline VI-G; [S3:99–100]"},
{"t": "conf", "q": "A defendant charged with murdering a mother tells his lawyer, incoherently, that her missing children 'might be' alive in a remote cabin, and draws a crude map. If the children are alive, they will likely die without rescue. The map would also implicate the client in kidnapping. What may the lawyer do?", "a": ["Disclose the location to the extent reasonably necessary to rescue the children.", "Nothing, because the information would incriminate the client in additional crimes.", "Disclose the entire conversation and the client's confession to the police.", "Disclose the location only if the client first gives informed consent."], "e": "If the children may be alive, 1.6(b)(1) permits disclosure limited to what's needed to save them, such as the location, not the client's confession (compare McClure v. Thompson). Contrast the Buried Bodies Case, where the victims were dead and the lawyers stayed silent.", "r": "MR 1.6(b)(1); McClure v. Thompson; Outline VI-G; [S3:101–102]"},
{"t": "conf", "q": "Associate Kai meets weekly with law school friends at other firms to talk through hard work problems. He wants to discuss a sensitive issue in a current client's divorce. How may he do so consistently with Rule 1.6?", "a": ["Use a hypothetical, so long as there's no reasonable likelihood the listeners could identify the client or situation.", "Share the details only with friends who are lawyers, since they too are bound by confidentiality rules.", "Omit the client's name but describe the specific, distinctive facts of the dispute so the group can give genuinely useful advice.", "Not at all, because Rule 1.6 forbids discussing any aspect of a client matter with outsiders."], "e": "1.6 cmt [4]: a lawyer may use a hypothetical to discuss issues relating to a representation so long as there's no reasonable likelihood the listener can ascertain the client's identity or the situation. Distinctive facts can identify a client even without a name.", "r": "MR 1.6 cmt [4]; Outline VI-B box; [S3:66]"},
{"t": "conf", "q": "At a law school reunion, associate Lena's friend from a family-law firm tells a gossipy story about a well-known local socialite client whose husband left her after she allegedly gave him a sexually transmitted disease. Everyone laughs. Which statement is most accurate?", "a": ["The friend breached 1.6 about an identifiable client and Lena should speak up; 8.3 depends on fitness.", "No violation occurred, because the friend never used the client's name in telling the story to the group of lawyers.", "No violation occurred, because the setting was purely social and the listeners were all lawyers.", "Lena must report the friend to the disciplinary authority immediately in every such case."], "e": "Identifiable client stories breach 1.6 even without names. Lena should object. 8.3 requires reporting only violations raising a substantial question about honesty, trustworthiness, or fitness, which is a judgment call for a single indiscretion.", "r": "MR 1.6, 8.3; Outline VI-B box; [S4:19]"},
{"t": "conf", "q": "In a divorce, associate Moe finds documents in third-party discovery proving the wife is having an affair with the husband-client's best friend. The affair is legally irrelevant to any issue in the divorce. Which use of the information is proper without further client consent?", "a": ["Producing the documents in response to the wife's valid document request.", "Telling an associate down the hall who is not working on the case.", "Hinting to opposing counsel that the wife should 'get realistic' or the affair will come out.", "Telling the client's mother, who is helping pay the legal fees."], "e": "Compelled disclosure in discovery is permitted (1.6(b)(6)). Sharing with uninvolved colleagues lacks a need to know. Using irrelevant embarrassing facts as leverage requires client consultation and consent, and it risks 4.4(a) and possibly extortion problems. A payor (even a family member) isn't entitled to confidential information (1.8(f)).", "r": "Outline VI-B box; [S3:64–65]"},
{"t": "conf", "q": "Lawyer Nye is a character witness for a lawyer seeking reinstatement. The disciplinary board asks Nye about a matter in which Nye represented a client and the lawyer was opposing counsel. Answering would require revealing Nye's client's confidences. Which is correct?", "a": ["Nye may decline to reveal the client's confidences, because Rules 8.1 and 8.3 don't require it.", "Nye must disclose, because candor to disciplinary authorities overrides the duty of confidentiality.", "Nye must disclose, because a request from the disciplinary board has the force of a court order.", "Nye may answer falsely to protect the confidence, because the duty of confidentiality comes first."], "e": "8.1 and 8.3(c) carve out 1.6 information. Nye may decline to answer but must not make a false statement (8.1(a)).", "r": "MR 8.1, 8.3(c); Outline VI-F"},
{"t": "agt", "q": "A homeowner hires Lawyer Abe to defend a foreclosure. The homeowner has strong defenses, but Abe fails to answer the complaint, and a default judgment is entered. The homeowner asks the court to vacate the default because 'it was my lawyer's fault, not mine.' What is the general rule?", "a": ["The lawyer's careless choice of means binds the client, so the default isn't automatically vacated; her remedy is against him.", "Defaults caused by a lawyer's neglect are always vacated, because the client herself is blameless and had strong defenses.", "The client is never bound by any act of her lawyer to which she did not expressly and personally consent in advance of the act.", "The default is void, because Abe had no authority to allow a default judgment to be entered against his own client."], "e": "Agency principles: a lawyer's acts within the scope of the representation, including careless procedural ones, bind the client. Otherwise third parties couldn't rely on agents, and parties could hire lawyers to fail. Relief (e.g., FRCP 60) is discretionary. The usual remedy is a malpractice claim against the lawyer.", "r": "Outline VII intro; [W4:20–22]"},
{"t": "agt", "q": "Client Payne tells Lawyer Frank, 'Don't settle for less than $25,000.' At a meeting, opposing counsel offers $30,000, and Frank accepts on Payne's behalf. The next day, opposing counsel says his client has buyer's remorse and wants out. Is there a binding settlement?", "a": ["Yes; 'not less than $25,000' authorized $30,000, so the deal binds both sides despite buyer's remorse.", "No, because Frank lacked authority to accept any amount other than the exact $25,000 figure his client named.", "No, because a settlement of pending litigation is not binding until it is reduced to a writing signed by both parties.", "Yes, but only if Payne later ratifies the $30,000 figure, since it differed from the amount she authorized."], "e": "Actual authority (Restatement (Third) of Agency § 2.01) exists when the agent reasonably believes, in accordance with the principal's manifestations to the agent, that the principal wants him to act. 'Not less than $25,000' authorizes $30,000. Opposing counsel's client authorized up to $25K or more as well. Remorse after acceptance doesn't undo a binding deal.", "r": "Restatement Agency § 2.01; Outline VII-A; [S4:37–38]"},
{"t": "agt", "q": "Client Pia authorizes Lawyer Ray to settle for $25,000. That night, after talking with her spouse and minister, she decides she wants $250,000 and tells them so, but not Ray. The next day Ray accepts $25,000. Is Pia bound?", "a": ["Yes, because actual authority depends on her manifestations to the agent, and her change of mind wasn't communicated.", "No, because she revoked the authority before Ray acted, and a revocation is effective at the moment the principal decides on it.", "No, because a client may always reject a settlement agreement that she has not personally signed.", "Yes, but only if opposing counsel relied on Ray's statement that he had authority to settle."], "e": "§ 2.01: 'in accordance with the principal's manifestations to the agent.' An uncommunicated change of heart doesn't revoke authority. Had she called Ray before he acted, that communicated revocation would have ended his authority.", "r": "Restatement Agency § 2.01; Outline VII-A; [S4:42–44]"},
{"t": "agt", "q": "Client Quinn authorizes Lawyer Sol to settle for $25,000. The night before the negotiation, Quinn leaves Sol a voicemail, which Sol hears, saying she has changed her mind and will take nothing less than $250,000. Sol accepts $25,000 anyway, because he believes it is the best possible outcome. Is Quinn bound, and is Sol subject to discipline?", "a": ["She's likely not bound, since he had no actual or apparent authority, and he's subject to discipline under 1.2(a).", "She is bound, because Sol's earlier authority was never revoked in a writing signed by the client.", "She is bound, because Sol reasonably believed $25,000 was the best result she could ever obtain.", "She is not bound, but Sol is not subject to discipline because he acted in what he believed was her best interest."], "e": "A communicated revocation ends actual authority. Whether to settle is the client's decision (1.2(a)). Acting against an instruction violates 1.2(a) regardless of the lawyer's view of the merits, and the lawyer's own interest (e.g., a contingent fee earned with less work) never creates authority.", "r": "MR 1.2(a); Outline VII-A; [S4:43]"},
{"t": "agt", "q": "Lawyer Tam is retained to prosecute a breach-of-contract action. Without consulting the client, Tam agrees to opposing counsel's request for a two-week extension to answer interrogatories, which won't prejudice the client. Did Tam have authority?", "a": ["Yes, because implied authority covers what is necessary, usual, and proper, including harmless courtesies.", "No, because every scheduling agreement with opposing counsel requires the client's express consent in advance.", "No, because extensions benefit only the opposing party and so can never be within a lawyer's implied authority.", "Yes, but only if the client later ratifies the extension after learning about it from the lawyer."], "e": "Implied authority is actual authority to do what is necessary, usual, and proper to carry out the express grant (§ 2.01 cmt b; MR 1.2(a): action 'impliedly authorized to carry out the representation'). Harmless professional courtesies are a means decision for the lawyer, and you needn't be a 'mad dog.'", "r": "Restatement Agency § 2.01 cmt b; MR 1.2(a); Outline VII-A, VII-C"},
{"t": "agt", "q": "Client Uma tells Lawyer Vic she won't take less than $250,000. Opposing counsel offers $25,000 and asks, 'Do you have authority to settle at that number?' Vic replies, 'I'm her lawyer, aren't I?' and accepts, hoping to persuade Uma later. Uma refuses. Is there an enforceable settlement based on apparent authority?", "a": ["No; apparent authority must trace to the client's manifestations, and the lawyer's own claims never count.", "Yes, because opposing counsel asked about authority and reasonably believed Vic's answer meant he had it.", "Yes, because retaining a lawyer to litigate a case confers apparent authority on that lawyer to settle it.", "No, because every settlement of pending litigation must be signed by the client personally to be enforceable."], "e": "Apparent authority (§ 2.03) requires a third party's reasonable belief traceable to the principal's manifestations. Hiring a lawyer alone doesn't confer apparent authority to settle, and the lawyer's own claims ('I'm her lawyer,' 'Of course I do') never count. Vic violated 1.2(a), and his evasive answer implicates 4.1(a) and 8.4(c).", "r": "Restatement Agency § 2.03; Outline VII-A; [S4:48–50]"},
{"t": "agt", "q": "At a courthouse hallway meeting, Client Wade tells opposing counsel in front of his lawyer: 'Just work it out with my lawyer. Whatever he agrees to is fine with me.' Privately, Wade had told his lawyer not to take less than $100,000. The lawyer later accepts $60,000. Wade refuses to honor it. Is Wade bound?", "a": ["Likely yes, because Wade's own statement to opposing counsel created apparent authority despite his private limit.", "No, because his private instruction to his lawyer controls over any public statement he made in the hallway.", "No, because apparent authority to settle can be created only by a written grant of authority from the client.", "Yes, because the lawyer had actual authority to accept $60,000 once the client spoke in the hallway."], "e": "Apparent authority arises from the principal's manifestations to the third party. Wade's statement directly to opposing counsel creates it even against a private floor. Wade is bound, but his lawyer violated 1.2(a) by ignoring the instruction and is exposed to discipline and liability to Wade.", "r": "Restatement Agency § 2.03; Outline VII-A; [S4:50]"},
{"t": "agt", "q": "Without authority, Lawyer Xu accepts a $25,000 settlement. The client is initially upset, but after Xu explains the risks of trial, she grudgingly signs the settlement agreement. A week later she fires Xu and demands a trial. Can she escape the settlement?", "a": ["No, because she ratified the settlement by signing the agreement.", "Yes, because Xu acted without authority, so the settlement is void from the start.", "Yes, because a client may revoke a ratification within a reasonable time after giving it.", "Yes, because firing the lawyer automatically rescinds all of his prior unauthorized acts."], "e": "Ratification (§ 4.01) is affirmance of a prior unauthorized act, by words or conduct, giving it effect as if authorized. Signing the agreement ratifies it. Ratification doesn't erase Xu's 1.2(a) violation, though, so never plan on it.", "r": "Restatement Agency § 4.01; Outline VII-A; [S4:52–53]"},
{"t": "agt", "q": "Lawyer Yan accepts a $25,000 settlement without authority. The client refuses to ratify. Opposing counsel then says, 'Fine. Deal's off; we'll see you at trial.' Two days later the client changes her mind and wants the deal. Can she enforce it?", "a": ["No, because ratification is ineffective once the third party has withdrawn.", "Yes, because ratification relates back to the time of the original unauthorized act.", "Yes, because the defendant made the original offer and cannot revoke an accepted offer.", "No, because a client can never ratify her lawyer's unauthorized settlement."], "e": "Ratification must be timely (§ 4.05). It can't occur after the third party has manifested withdrawal from the transaction. The client's initial refusal and the defendant's withdrawal end the matter.", "r": "Restatement Agency § 4.05; Outline VII-A; [S4:54]"},
{"t": "agt", "q": "Without authority, Lawyer Zed accepts a $25,000 settlement. He sends the client the unsigned settlement agreement and the insurer's check. The client crosses out every page of the agreement and writes 'When is trial?' but deposits the check, calling it a 'down payment' on her damages. Is there likely an enforceable settlement?", "a": ["Yes; keeping the benefits ratifies by conduct, and she can't ratify part of the deal while rejecting the rest.", "No, because she expressly rejected the settlement agreement in writing on every page, which controls over her later conduct.", "No, because ratification of a settlement requires the client's signed writing.", "Yes, but only as to the amount of the check, leaving her free to sue for more."], "e": "Conduct justifying a reasonable assumption of consent, such as accepting and keeping the benefits, can ratify (§ 4.01(2)(b)). Ratification must encompass the act in its entirety (§ 4.07), so she can't keep the money and reject the release.", "r": "Restatement Agency §§ 4.01, 4.07; Outline VII-A; [S4:55]"},
{"t": "agt", "q": "State law requires that a contract for the sale of land be signed by the seller or by an agent whose authority is in writing. A client orally authorizes Lawyer Abe to sign a land-sale contract on her behalf, and Abe signs. Is the client bound?", "a": ["Likely not; under the equal-dignities rule, authority for an act requiring a signed writing must also be written.", "Yes, because oral actual authority always suffices for an agent to sign any contract for the principal, whatever the subject.", "Yes, because a lawyer has inherent authority to sign contracts on behalf of any client he represents.", "No, because lawyers may never sign contracts on behalf of their clients under any circumstances."], "e": "Restatement (Third) of Agency § 3.02 (the 'equal dignities' rule): if the law requires a writing or record for the act to be effective, the agent's authority must also be in writing. Don't extend this to ordinary instructions.", "r": "Restatement Agency § 3.02; Outline VII-A; [W4:49]"},
{"t": "agt", "q": "Before a mediation, Lawyer Bly asks her client how low she will go. The client stares at the table and says, 'I guess you could take $150,000. Maybe. I don't know.' What should Bly do?", "a": ["Check the client's authority, clarify what settling means, and confirm it in writing, perhaps with her signature.", "Treat the client's statement as clear authority to settle the case at $150,000 or more.", "Treat the client's statement as no authority at all and refuse to negotiate any figure at mediation.", "Settle for whatever amount Bly believes is best, because the client is plainly uncertain about her own position."], "e": "The 3Cs: check (clarify the authority itself); clarify (explain the implications, such as finality, no day in court, and the net after fees); confirm (in writing, ideally signed) to avoid a later swearing contest over what was authorized.", "r": "Outline VII-A; [S4:41, 45, 51]"},
{"t": "agt", "q": "A client authorized Lawyer Cruz to settle for $25,000, and Cruz did. Later the client falsely denies giving authority and threatens to testify to that 'on a stack of Bibles.' There is no written confirmation. What is the practical problem, and how could Cruz have avoided it?", "a": ["A swearing contest over authority, which written confirmation of the client's authority would have avoided.", "No problem, because a lawyer's testimony about the scope of his authority is conclusive in enforcement proceedings.", "No problem, because settlement authority is presumed whenever a lawyer settles a client's case.", "The settlement is void, because the Rules require that settlement authority be given in a signed writing."], "e": "Disputes over authority become credibility contests. The 3Cs (check, clarify, confirm) reduce the risk. The Model Rules don't require written settlement authority, but confirming significant grants in writing is best practice. Courts may decide enforcement on motion in the pending case (Kokkonen).", "r": "Outline VII-A; [S4:51]"},
{"t": "agt", "q": "Lawyer Dahl falsely tells opposing counsel, 'Of course I have authority,' and signs a settlement. His client refuses to honor it, and the opposing party loses a favorable trial date. What claims does the opposing party most likely have?", "a": ["Claims against Dahl for misrepresentation or breach of warranty of authority, with possible firm liability.", "No claims, because the opposing party should have verified Dahl's authority directly with the client before signing the settlement.", "A claim only against Dahl's client, for breach of the settlement contract her lawyer made.", "A malpractice claim, because Dahl owed the opposing party a duty of care in negotiating."], "e": "An agent who purports to act for a principal impliedly warrants his authority, and knowingly claiming authority he lacks is fraud. Tort (misrepresentation) and contract (warranty) damages measures differ. The firm may be vicariously liable. Discipline under 1.2(a), 4.1(a), and 8.4(c), and opposing counsel may need to report him (8.3).", "r": "Outline VII-B; [S4:59; W4:31]"},
{"t": "agt", "q": "Lawyer Eve settled without authority because she thought the deal was in her client's best interest. The client disputes the settlement. Which consequence is LEAST likely to follow?", "a": ["Automatic enforcement of the settlement because the lawyer acted in good faith.", "Professional discipline for failing to abide by the client's decision about settlement.", "A claim by the client against Eve for breach of fiduciary duty or malpractice.", "A conflict between Eve and her client that requires the client's consent or withdrawal."], "e": "Consequences of exceeding authority: discipline (1.2(a)); possible unwinding of the act; liability to the client for cleanup costs; liability to the opponent; and a conflict once the client disputes authority (the lawyer's interest in defending her conduct diverges from the client's). Good faith doesn't make an unauthorized settlement enforceable.", "r": "Outline VII-B; [S4:56–58]"},
{"t": "agt", "q": "Lawyer Fiona's client wants $100,000; Fiona thinks $70,000 is fair. Opposing counsel asks whether her client would take $70,000. Fiona wants to move the negotiation without exceeding her authority. Which response is best?", "a": ["'I can't accept that, but personally I could recommend $70,000 if your client offered it. I'll take it to my client.'", "'Yes, we accept $70,000,' followed by a call to persuade the client to approve it afterward.", "'My client will definitely accept $70,000 if that is your final offer today, so let's put it on the record now.'", "'I can't discuss any settlement numbers at all unless my client is present in the room.'"], "e": "The 'non-offer offer' lets a lawyer signal a recommendation without claiming authority, then report to the client, who decides (1.2(a), 1.4(a)(1)). Accepting first and persuading later violates 1.2(a), and predicting acceptance misrepresents authority.", "r": "Outline VII-B"},
{"t": "agt", "q": "Lawyer Gil represents a plaintiff on a one-third contingency. A $25,000 settlement offer would give the firm a quick fee for little work, while trial would require advancing expert fees and substantial time for a likely similar result. The client says no deal under $250,000. Gil accepts $25,000, reasoning it is objectively the best result. Which is correct?", "a": ["He violated Rule 1.2(a); settling is the client's call, and the firm's financial incentive creates no authority.", "He acted properly, because the $25,000 settlement was objectively the best result the client could obtain.", "He acted properly, because a lawyer working on contingency controls the timing and amount of settlement.", "He acted properly, so long as he discloses the firm's financial incentive to the client after the fact."], "e": "Whether to settle is the client's decision. Contingent fees can pit lawyer against client when trial would cost the firm more than it gains, so be alert to that personal-interest pressure. Advise candidly (2.1), but abide by the client's decision.", "r": "MR 1.2(a); Outline VII-A, VIII-A; [S4:39–40]"},
{"t": "agt", "q": "In a criminal case, defense counsel concludes that a bench trial would be strategically superior. The defendant wants a jury. Counsel waives the jury anyway, believing it is a tactical choice. Is counsel subject to discipline?", "a": ["Yes; in a criminal case the client decides, after consultation, whether to waive a jury.", "No, because the choice between a bench trial and a jury trial is a matter of trial tactics for the lawyer.", "No, because the court accepted the waiver after questioning counsel about it on the record.", "Yes, but only if the defendant was ultimately convicted after the bench trial."], "e": "1.2(a): in a criminal case, the client decides the plea to be entered, whether to waive jury trial, and whether to testify, after consultation. In any case, the client decides whether to settle.", "r": "MR 1.2(a); Outline VII-C; [S4:60]"},
{"t": "agt", "q": "A plaintiff's lawyer, without consulting the client, agrees with defense counsel to submit the case to binding arbitration instead of trial, believing arbitration will be faster and cheaper. Is this within the lawyer's authority?", "a": ["No, because binding arbitration waives the jury right and affects substantive rights, so it's the client's decision.", "Yes, because choosing the forum for resolving the dispute is a means decision for the lawyer, like choosing which motions to file.", "Yes, because arbitration is usually faster and cheaper, which benefits the client.", "No, but only because arbitration agreements must be signed by both parties personally."], "e": "Blanton v. Womancare: a lawyer lacks implied authority to agree to binding arbitration without the client's consent because it waives fundamental rights such as a jury trial. The four decisions listed in 1.2(a) are examples, and other fundamental decisions are also the client's.", "r": "Blanton; MR 1.2(a); Outline VII-C; [S4:62]"},
{"t": "agt", "q": "Without consulting the client, defense counsel agrees that the plaintiff will receive the jury's verdict but not less than $50,000 nor more than $500,000. Is this agreement within counsel's authority?", "a": ["No, because a high-low agreement effectively sets part of the outcome, which is the client's decision.", "Yes, because it is a trial-management tactic that lawyers routinely negotiate on their own.", "Yes, because it limits the client's exposure and therefore can only benefit the client.", "No, but only because high-low agreements are against public policy in most jurisdictions."], "e": "High-low ('collar') agreements resolve part of the merits by guaranteeing a minimum and capping recovery, which functions like a partial settlement. That's the client's decision (1.2(a)), with consultation under 1.4.", "r": "MR 1.2(a); Outline VII-C; [S4:62]"},
{"t": "agt", "q": "In a sexual-harassment suit, the plaintiff's lawyer accepts a settlement that includes a strict confidentiality clause with liquidated damages equal to the settlement amount if the plaintiff ever discusses the case. The client authorized settlement 'for at least $100,000' but was never told about the gag clause. Was the lawyer authorized to accept that term?", "a": ["No; a material term like a gag clause with liquidated damages is part of the settlement decision reserved to the client.", "Yes, because the client authorized settlement for at least $100,000, and the amount was within that authority.", "Yes, because confidentiality clauses are standard terms in employment settlements and need no separate approval.", "No, because confidentiality clauses in harassment settlements are always unenforceable as against public policy in every state."], "e": "Settlement decisions include material terms, not just the dollar figure. A gag clause with liquidated damages significantly affects the client, so it requires the client's informed decision (1.2(a), 1.4(a)(1)–(2)).", "r": "MR 1.2(a); Outline VII-C; [S4:63]"},
{"t": "agt", "q": "Without first checking with the client, Lawyer Hart agrees to a court's suggestion of non-binding mediation. The client is unhappy. Which is most accurate?", "a": ["Agreeing to non-binding mediation is generally a means decision, though the lawyer should consult the client about it.", "It is an objective of the representation reserved exclusively to the client, like the decision to settle.", "It is improper, because only the client may communicate directly with the court about scheduling mediation.", "It is proper and requires no consultation with the client at all, because mediation is not binding."], "e": "Non-binding mediation doesn't resolve the merits without the client's later decision, so it's generally a means decision. But 1.2(a) and 1.4(a)(2) require reasonably consulting the client about material means, and in practice clients have strong input because they can fire you.", "r": "MR 1.2(a), 1.4(a)(2); Outline VII-C; [S4:62]"},
{"t": "agt", "q": "A client signs a retainer stating: 'Lawyer may settle this case for any amount Lawyer considers reasonable, without further consultation.' Midway through the case, the lawyer settles for an amount he considers reasonable without telling the client. Is the client bound, and is the lawyer subject to discipline?", "a": ["The blanket grant can't bypass the client's right to decide settlement, so he's subject to discipline and the deal is vulnerable.", "Both are proper, because the client granted the authority in writing in advance.", "It is proper, because blanket settlement authority is valid whenever it is in writing.", "The settlement binds the client only if the amount fell within the range of verdicts a jury would likely have returned in the case."], "e": "A blanket advance waiver of the client's settlement decision is an end-run around 1.2(a) and is void or unenforceable. Specific advance authority (e.g., 'accept anything over $70,000') is fine, subject to revocation and changed circumstances (cmt [3]).", "r": "MR 1.2(a) & cmt [3]; Outline VII-C, X"},
{"t": "agt", "q": "Which advance grant of settlement authority is most likely valid under the Model Rules?", "a": ["'You may accept any offer of $70,000 or more until I tell you otherwise.'", "'You may settle the case for whatever amount you think is best for me.'", "'You may settle on any terms whatsoever, without telling me first.'", "'I agree never to reject any settlement offer that you recommend to me.'"], "e": "A client may authorize specific action in advance, revocable and subject to changed circumstances. Grants that surrender the client's decision entirely are ineffective.", "r": "MR 1.2(a) cmt [3]; Outline VII-C"},
{"t": "agt", "q": "A contingent-fee agreement provides that if the client rejects a settlement offer the lawyer recommends, the lawyer will thereafter also be paid hourly at his standard rate, on top of the contingent fee, until the case ends. Is this provision likely enforceable?", "a": ["No, because it penalizes the client for exercising her right to decide whether to settle.", "Yes, because the client agreed to it in a writing she signed at the outset of the representation.", "Yes, because it fairly compensates the lawyer for the additional risk of going to trial.", "No, because hybrid arrangements combining contingent and hourly fees are always prohibited."], "e": "Fee terms that penalize a client's exercise of 1.2(a) rights, such as hourly fees kicking in on rejecting a recommended settlement or retroactive conversion to hourly, are likely void or unconscionable. Ordinary deposits for real next steps are fine, but timing that looks coercive is suspect.", "r": "MR 1.2(a), 1.5(a); Outline VII-C; [S4:65–66]"},
{"t": "agt", "q": "An hourly fee agreement lets the lawyer require deposits in trust for the reasonable estimated cost of the next steps. Immediately after the client rejects a settlement the lawyer strongly recommended, the lawyer demands a $75,000 deposit covering trial. Which is most accurate?", "a": ["The deposit term is fine, but demanding a large deposit right after the rejection may look like coercion.", "The demand is always permissible, because the fee agreement expressly authorizes deposits for future work.", "The demand is always prohibited, because advance deposits for trial costs violate Rule 1.15.", "The demand is permissible only if the lawyer promises to refund any unused amount after trial."], "e": "Deposits for reasonably anticipated work are ordinary (held in trust under 1.15(c), with unearned amounts refunded under 1.16(d)). But timing and size can turn a legitimate term into pressure on the client's 1.2(a) decision.", "r": "MR 1.2(a), 1.15(c); Outline VII-C; [S4:67–68]"},
{"t": "agt", "q": "An appointed public defender's client insists that she argue at trial that his religious beliefs justified striking his wife. The argument is legally baseless under controlling precedent and would alienate the jury. The defender explains this, but the client insists. Must she present the defense?", "a": ["No; she needn't present a frivolous theory, and defense theory is a means decision, though he keeps the core choices.", "Yes, because a criminal defendant controls every aspect of his defense, including the theory presented.", "Yes, because refusing to present the defense the client demands would violate the client's right to the free exercise of religion.", "No, and the defender may also decide on her own whether the client will testify at trial."], "e": "Defense theory is a means decision made after consultation, and lawyers needn't advance frivolous positions (3.1). Comment [2] to 1.2 notes the lawyer defers to the client on some questions but generally decides technical and tactical matters. The client still controls the plea, jury waiver, and testifying. Representation isn't endorsement (1.2(b)).", "r": "MR 1.2(a)–(b), 3.1; Outline VII-C; [S4:69]"},
{"t": "agt", "q": "Lawyer Ivy agrees to represent a defendant accused of a crime she finds morally repugnant. A colleague says that by taking the case, Ivy endorses the defendant's conduct. Which Rule addresses this?", "a": ["Rule 1.2(b): representing a client is not an endorsement of the client's views or activities.", "Rule 6.2, which requires lawyers to accept every court appointment they receive.", "Rule 1.16(b)(4), which requires withdrawal from any representation the lawyer finds repugnant.", "Rule 8.4(g), which prohibits representing clients accused of discriminatory conduct."], "e": "1.2(b) separates representation from endorsement, supporting access to counsel for unpopular clients. A lawyer may decline or withdraw for repugnance (1.16(b)(4)) but isn't required to, and appointments may be avoided only for good cause (6.2).", "r": "MR 1.2(b); Outline VII-C"},
{"t": "agt", "q": "A client asks Lawyer Jun whether a planned business practice is legal. Jun concludes it would likely violate consumer-protection law. The client asks what penalties he would face if he did it anyway. May Jun answer?", "a": ["Yes, he may discuss the consequences of any proposed conduct, but may not counsel or assist known crime or fraud.", "No, because answering the question about penalties would assist the client in breaking consumer-protection law.", "No, because a lawyer must withdraw as soon as a client proposes conduct that would be illegal.", "Yes, and Jun may also help design the practice so that regulators are less likely to detect it."], "e": "1.2(d): a lawyer shall not counsel or assist conduct the lawyer knows is criminal or fraudulent, but may discuss the legal consequences of any proposed course of conduct and help the client determine the validity, scope, meaning, or application of the law. Helping avoid detection would be assistance.", "r": "MR 1.2(d); Outline VII-C"},
{"t": "agt", "q": "Opposing counsel's mother dies the week a response is due, and she asks Lawyer Kale for a one-week extension. The extension won't prejudice Kale's client. The client, who dislikes the other side, tells Kale to refuse. Which is most accurate?", "a": ["A harmless courtesy is generally a means decision for the lawyer after consultation; he needn't press every advantage.", "Kale must refuse the extension, because the client controls every aspect of how the litigation is conducted.", "Kale must refuse, because extensions of filing deadlines require the court's approval in every case, whatever counsel agree.", "Kale must grant the extension, and the client's objection is irrelevant to that decision."], "e": "Professional courtesies that don't prejudice the client are generally a means decision. 1.3 cmt [1] says a lawyer isn't required to press for every advantage, and diligence doesn't require 'mad dog' tactics. Consult the client (1.4(a)(2)), and recognize that a client who strongly disagrees can fire the lawyer.", "r": "MR 1.2(a), 1.3 cmt [1]; Outline VII-C"},
{"t": "fee", "q": "Lawyer Abe's firm bills clients $0.50 per page for in-house photocopying. The firm's actual cost is $0.08 per page. The engagement letter doesn't mention copying charges; the markup appears only as a line item on monthly invoices. Is this proper?", "a": ["No; in-house charges must reflect actual cost or a reasonable amount agreed in advance.", "Yes, because photocopying is an expense rather than a fee, so the reasonableness rules for fees do not apply to it.", "Yes, because the charge is clearly disclosed on every monthly invoice, which gives the client informed notice.", "No, because lawyers may never charge clients anything for services performed inside their own offices."], "e": "1.5 cmt [1]: a lawyer may seek reimbursement for in-house services such as copying at the actual cost incurred, or at a reasonable amount the client agrees to in advance. Undisclosed markups have produced scandals (e.g., 'Skaddenomics'). Expenses are out-of-pocket costs specific to the matter, never general overhead.", "r": "MR 1.5 cmt [1]; Outline VIII-A"},
{"t": "fee", "q": "Lawyer Bly bills a client for a share of the firm's office rent and receptionist salary, labeled 'administrative expense.' Which is most accurate?", "a": ["Improper, because overhead is part of the fee; expenses are costs specifically incurred for the matter.", "Proper, if the fee agreement mentions 'administrative expenses' anywhere in its terms, even without a definition.", "Proper, because every cost the lawyer incurs in operating a practice is reimbursable by the firm's clients.", "Proper, so long as the total amount charged to the client for the matter remains reasonable overall."], "e": "Fees compensate professional services, including the overhead that supports them. Expenses are out-of-pocket costs specific to the matter (filing fees, experts, travel, etc.). Billing overhead as an 'expense' risks unreasonable charges (1.5(a)) and misrepresentation.", "r": "MR 1.5(a); Outline VIII-A"},
{"t": "fee", "q": "Lawyer Cho has represented Client Delta Co. on dozens of matters over ten years at $300 per hour. Delta sends a new matter. Cho bills at the same $300 rate without sending a new fee letter. Six months later Cho raises his rate to $350 and begins billing the higher rate without telling Delta. Which is correct?", "a": ["No letter was needed for the same rate, but the rate increase had to be communicated to Delta.", "Cho violated Rule 1.5(b) by failing to send a written fee letter for the new matter, even at the same rate.", "Cho complied with Rule 1.5(b) in both respects, because Delta is a regularly represented client of long standing.", "Cho needed Delta's signed written consent before he could begin billing the increased hourly rate."], "e": "1.5(b): the scope and basis or rate of the fee and expenses must be communicated, preferably in writing, before or within a reasonable time after commencing the representation, except when charging a regularly represented client on the same basis or rate. Any change in the basis or rate must also be communicated. A signed writing isn't required.", "r": "MR 1.5(b); Outline VIII-A"},
{"t": "fee", "q": "A new hourly client meets Lawyer Dee and they discuss the matter in detail. Dee explains her $250 hourly rate orally and begins work that day. Three weeks later she sends an email confirming the rate and scope. Has Dee complied with Rule 1.5(b)?", "a": ["Yes; the rate must be communicated, preferably in writing, before or within a reasonable time after starting.", "No, because every hourly fee agreement must be in a writing signed by the client before any work begins.", "No, because the communication of the rate must come before any work on the matter is performed.", "Yes, but only because the client did not object to the rate in the three weeks before the email arrived."], "e": "1.5(b) requires communication, 'preferably in writing,' before or within a reasonable time after starting. Only contingent fees (1.5(c)) require a writing signed by the client. Best practice is a writing the client signs (cmt [2]).", "r": "MR 1.5(b); Outline VIII-A, X"},
{"t": "fee", "q": "A personal-injury client agrees to Lawyer Eng's one-third contingent fee during a meeting. Eng emails a summary stating the percentage, and the client replies 'Sounds good!' No document is signed. The case settles. Has Eng complied with Rule 1.5(c)?", "a": ["No, because a contingent fee agreement must be in a writing signed by the client.", "Yes, because the client agreed in writing by sending a reply email accepting the lawyer's stated terms.", "Yes, because contingent fees, like other fees, need only be communicated to the client, preferably in writing.", "No, because contingent fees are prohibited in personal-injury cases unless a court approves them in advance."], "e": "1.5(c) requires a writing signed by the client stating the method of determining the fee. A lawyer's email plus the client's 'sounds good' doesn't satisfy it. Consequences may include unenforceability of the agreed fee, leaving quantum meruit at most, plus discipline.", "r": "MR 1.5(c); Outline VIII-A, VIII-C"},
{"t": "fee", "q": "Lawyer Fry's signed contingent-fee agreement says: 'Lawyer will receive 30% of any recovery.' It says nothing about expenses or appeals. Which is the most significant deficiency under Rule 1.5(c)?", "a": ["It omits the percentages for settlement, trial, or appeal, the expenses to be deducted and when, and expenses owed regardless.", "It fails to state the lawyer's hourly rate, which must appear in every fee agreement as a fallback measure.", "It fails to include a mandatory arbitration clause for resolving any later fee disputes with the client.", "Nothing is missing, because a single percentage of the recovery is all that Rule 1.5(c) requires a lawyer to state in a contingent agreement."], "e": "1.5(c) requires the method of determining the fee, including the percentage(s) in the event of settlement, trial, or appeal; litigation and other expenses to be deducted; whether expenses come off before or after the fee; and clear notice of expenses owed regardless of outcome. A client signature doesn't cure missing terms.", "r": "MR 1.5(c); Outline VIII-A; [S5:4–5, 17]"},
{"t": "fee", "q": "A contingent-fee case settles for $500,000. Lawyer Gee deposits the check in trust, deducts his fee and costs, and wires the client her share with a one-line email: 'Your share is attached.' What else does Rule 1.5(c) require?", "a": ["A written statement of the outcome showing the remittance to the client and how it was determined.", "Nothing further, because the client received her money and can ask questions if she wants to.", "The client's signed release of all claims against the lawyer before the funds are distributed.", "Court approval of the distribution, because all contingent-fee settlements must be approved by a judge."], "e": "At the end of a contingent-fee matter, 1.5(c) requires a written closing statement of the outcome and, if there's a recovery, the remittance to the client and how it was calculated. Conditioning payment on a release would violate 1.8(h) and 1.15.", "r": "MR 1.5(c); Outline VIII-A; [S5:20]"},
