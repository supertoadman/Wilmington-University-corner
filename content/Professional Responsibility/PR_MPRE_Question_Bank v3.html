<title>PR MPRE Drill v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a single exam-booklet column. Settings strip on top, one question "sheet" at a time, answer-sheet grid below. */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#152033; --muted:#5A6477; --line:#D6DCE5;
  --accent:#1F4FA3; --accent-soft:#E3EAF7; --ok:#1C7A4A; --ok-soft:#E1F2E8; --bad:#B0261D; --bad-soft:#F9E3E1;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141C; --surface:#171F2C; --ink:#E4E9F1; --muted:#98A3B5; --line:#2A3446;
  --accent:#86A9EE; --accent-soft:#1E2B45; --ok:#62C48F; --ok-soft:#15301F; --bad:#F0877E; --bad-soft:#3A1C1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141C; --surface:#171F2C; --ink:#E4E9F1; --muted:#98A3B5; --line:#2A3446;
  --accent:#86A9EE; --accent-soft:#1E2B45; --ok:#62C48F; --ok-soft:#15301F; --bad:#F0877E; --bad-soft:#3A1C1A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px}
h1{font-family:var(--serif);font-weight:700;font-size:1.75rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:.875rem;margin:2px 0 0}
.score{font-family:var(--mono);font-size:.875rem;color:var(--muted);font-variant-numeric:tabular-nums}
.score b{color:var(--ink);font-weight:500}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:14px}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:.82rem;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:4px 11px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:500}
.chip .n{font-family:var(--mono);font-size:.75rem;opacity:.75;margin-left:4px}
.row{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px}
select{font:inherit;font-size:.875rem;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:.85rem;border:0;background:transparent;color:var(--ink);padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.check{display:flex;gap:6px;align-items:center;font-size:.875rem;cursor:pointer}
.btn{font:inherit;font-size:.875rem;font-weight:500;border-radius:6px;padding:8px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:8px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px 20px;display:flex;flex-direction:column;gap:16px}
.meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;font-size:.8rem;color:var(--muted)}
.meta .qn{font-family:var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
.stem{font-family:var(--serif);font-size:1.12rem;line-height:1.6;margin:0;max-width:68ch}
.opts{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;width:100%;text-align:left;font:inherit;font-family:var(--serif);font-size:1rem;line-height:1.5;
  border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);padding:10px 12px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .let{font-family:var(--mono);font-size:.85rem;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.opt .txt{min-width:0}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .let{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .let{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .let{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.fb{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.verdict{font-weight:600;font-size:.95rem}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.expl{margin:0;max-width:70ch}
.cite{font-family:var(--mono);font-size:.8rem;color:var(--accent)}
.nav{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.hint{font-size:.78rem;color:var(--muted)}
.hint kbd{font-family:var(--mono);font-size:.72rem;border:1px solid var(--line);border-radius:4px;padding:0 4px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.cell{font-family:var(--mono);font-size:.78rem;font-variant-numeric:tabular-nums;height:32px;border-radius:5px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.cell.ans{background:var(--accent-soft);color:var(--accent);border-color:var(--accent-soft)}
.cell.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-soft)}
.cell.bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad-soft)}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}

.results h2{font-family:var(--serif);font-size:1.4rem;margin:0}
.big{font-family:var(--serif);font-size:2.6rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.875rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent)}
.empty{color:var(--muted);font-style:italic}
@media (max-width:520px){.sheet{padding:18px 14px}.stem{font-size:1.05rem}h1{font-size:1.45rem}}
@media (prefers-reduced-motion:no-preference){.opt{transition:border-color .12s,background .12s}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>PR MPRE Drill v3</h1>
      <p class="sub">Professional Responsibility · Weeks 1–5 · Chs. 1–9, 20, 21 + class slides · 355 new application questions · Answer order is randomized on every shuffle</p>
    </div>
    <div class="score" id="score"></div>
  </header>

  <section class="panel" aria-label="Quiz settings">
    <div>
      <p class="label">Topics</p>
      <div class="chips" id="chips"></div>
    </div>
    <div class="row">
      <div class="field">
        <span class="label">Mode</span>
        <div class="seg" id="modeSeg">
          <button type="button" data-mode="study" id="modeStudy">Study (instant feedback)</button>
          <button type="button" data-mode="exam" id="modeExam">Exam (grade at end)</button>
        </div>
      </div>
      <div class="field">
        <label class="label" for="count">Questions</label>
        <select id="count">
          <option value="10">10</option><option value="25">25</option><option value="60">60 (MPRE length)</option><option value="all">All selected</option>
        </select>
      </div>
      <label class="check"><input type="checkbox" id="shuffleQ" checked> Shuffle question order</label>
    </div>
    <div class="btns">
      <button class="btn primary" id="startBtn" type="button">New shuffled set</button>
      <button class="btn" id="reletterBtn" type="button">Reshuffle answer letters</button>
    </div>
  </section>

  <main id="main"></main>

  <section class="panel" id="mapPanel" aria-label="Answer sheet">
    <p class="label" style="margin:0">Answer sheet</p>
    <div class="grid" id="grid"></div>
  </section>
</div>

<script>
const TOPICS = {
  reg:  "Ch. 1–3 · Regulation & Discipline",
  hum:  "Ch. 4 · Human Factors & Supervision",
  fid:  "Ch. 5 · Fiduciary Duties & Candor",
  agt:  "Ch. 6 · Agency & Authority",
  comp: "Ch. 7 · Competence, Diligence & Care",
  conf: "Ch. 8 · Confidentiality",
  rel:  "Ch. 9 · Forming, Scope & Ending",
  fee:  "Ch. 20 · Fees & Fee-Sharing",
  prop: "Ch. 21 · Client Property"
};
// Each question: t=topic, q=stem, a=[CORRECT, distractor, distractor, distractor], e=explanation, r=rule cite.
// The correct answer is always a[0] in the data; the display order is randomized.
const QS = [
{"t": "reg", "q": "A client tells Attorney Ruiz, in confidence, that the client plans to file a false insurance claim next month. Ruiz has not been asked to help with the claim. Using Professor Neri's three-step approach, which response best characterizes Ruiz's options under the Model Rules?", "a": ["He may reveal the plan only if a 1.6(b) exception applies; he must not assist; and he should try to dissuade the client.", "He must report the plan to the insurer, because a lawyer who learns of any planned client fraud has a mandatory duty to warn the likely victim.", "He should report the plan to the insurer, because the Rules permit any disclosure that the lawyer reasonably believes is morally justified.", "He must withdraw at once, because a lawyer may never continue representing a client who has announced an intent to commit a crime."], "e": "Neri's method: identify the question, find the Rule, and separate must/must not (enforceable obligations), may (discretion), and should (judgment and values). No Rule requires disclosure here. 1.6(b)(2) permits disclosure only if the client has used or is using the lawyer's services, which isn't the case, so disclosure isn't even permitted. Ruiz must not assist (1.2(d)) and should counsel against the plan (2.1). Withdrawal isn't mandatory just because a client mentions a crime unrelated to the lawyer's services.", "r": "Outline: How problems are worked [S1:6–7]; MR 1.2(d), 1.6(b)(2), 2.1"},
{"t": "reg", "q": "State X adopted the Model Rules but deleted the comment the ABA attached to Rule 1.5. A State X lawyer is charged with violating State X's Rule 1.5. Her defense relies entirely on the deleted ABA comment and on a section of the Restatement (Third) of the Law Governing Lawyers. The State X Supreme Court has never interpreted the provision. How should the disciplinary tribunal treat her authorities?", "a": ["As persuasive at most; State X's rule, as its supreme court construes it, controls.", "As binding, because adopting the Model Rules also adopts the ABA's official comments by operation of law.", "As binding as to the Restatement, because the ALI's work supersedes inconsistent state rules of conduct.", "As irrelevant, because a disciplinary tribunal may not consult secondary sources when it construes a rule."], "e": "States regulate lawyers. The Model Rules and comments bind no one of their own force, and a state's adopted rule, as construed by its high court, controls. ABA opinions, deleted comments, and the Restatement can be persuasive, but they aren't binding and they're not irrelevant either.", "r": "Outline I-A; [S1:27–28]"},
{"t": "reg", "q": "A summer associate in Delaware is asked for binding authority on whether a Delaware lawyer may reveal a client's confidential information to collect a fee. She finds (1) a Delaware Supreme Court disciplinary opinion squarely on point, (2) an ABA Formal Ethics Opinion addressing the issue, and (3) a Delaware State Bar Association ethics committee opinion. Which is binding in Delaware?", "a": ["Only the Delaware Supreme Court opinion.", "The Delaware Supreme Court opinion and the ABA Formal Opinion together.", "All three, because each one interprets a rule that Delaware has adopted.", "Only the ABA Formal Opinion, because the Model Rules originate with the ABA."], "e": "Only the state's high court construing its own rules is binding. ABA formal opinions and state or local bar ethics committee opinions are persuasive authority that tribunals often consult.", "r": "Outline I-A; [S1:28, 84–85]"},
{"t": "reg", "q": "Under the 1969 Model Code of Professional Responsibility, a lawyer's conduct was consistent with every Disciplinary Rule but fell short of an Ethical Consideration. Could the lawyer be disciplined for that conduct alone?", "a": ["No, because only the Disciplinary Rules were enforceable; the Ethical Considerations were aspirational.", "Yes, because the Ethical Considerations were binding interpretations of the Canons and carried the same disciplinary force as the DRs.", "Yes, because the 1908 Canons remained in force alongside the Code and made aspirations enforceable.", "No, because no state ever adopted the Model Code, so it could never support any discipline."], "e": "The Model Code had three layers: Canons, Ethical Considerations ('should'), and Disciplinary Rules ('shall'). Only the DRs were enforceable. The 1983 Model Rules replaced the Code, and each Rule is enforceable. States did adopt the Code, and it was the basis of discipline before the Rules.", "r": "Outline I-A; [S1:14]"},
{"t": "reg", "q": "A client sues Attorney Kwan for negligence. The client's only theory is that Kwan violated Rule 1.4 by not returning calls for five weeks. The client concedes the case outcome was unaffected and that she suffered no monetary loss. Kwan moves for summary judgment. What is the most likely result?", "a": ["Summary judgment for Kwan: a Rule violation creates no cause of action, and causation and damages are missing.", "Judgment for the client, because a violation of an adopted Rule of Professional Conduct is negligence per se.", "Judgment for the client on liability with nominal damages, because the Rules create a private right of action for any breach by a lawyer.", "Denial of the motion, because a Rule 1.4 violation raises a presumption of emotional-distress damages."], "e": "Preamble ¶ 20: a violation doesn't itself give rise to a cause of action or create a presumption of breach. Negligence requires causation of economic harm, and emotional distress is almost never recoverable. Kwan can still be disciplined under 1.4, which doesn't require harm.", "r": "Preamble & Scope ¶ 20; Outline I-A, I-E"},
{"t": "reg", "q": "A law student asks which part of the Model Rules principally governs her conduct when she negotiates with an opposing party who has no lawyer. Which series should she consult first?", "a": ["The 4-series, which governs dealings with non-clients, including unrepresented persons.", "The 2-series, which governs the lawyer's role as counselor and as third-party neutral.", "The 3-series, which governs the lawyer's role as an advocate in adversary proceedings.", "The 7-series, which governs communications about the lawyer's services to the public."], "e": "The 4-series governs dealings with non-clients: truthfulness (4.1), represented persons (4.2), unrepresented persons (4.3), and respect for third persons' rights (4.4). The 3-series is advocacy, the 2-series is counseling and neutral roles, and the 7-series is advertising and solicitation.", "r": "Outline I-A series map; [S1:16–24]"},
{"t": "reg", "q": "Bar applicant Nolan disclosed on his bar application a two-year-old arrest for marijuana possession, which was dismissed. His law school application, filed three years ago, asked about arrests 'ever,' and he had answered 'No' because he thought a dismissed charge didn't count. He has not amended the law school application. Which is the most significant character-and-fitness concern?", "a": ["The inconsistency between the applications, which suggests a lack of candor that often weighs more than the arrest.", "The arrest itself, because any drug arrest within five years automatically disqualifies an applicant.", "Nothing, because a dismissed charge is legally irrelevant and bar examiners may not ask about it.", "Nothing, because answers on a law school application are confidential and cannot be considered by any bar admissions authority."], "e": "Bars compare law school applications with bar applications. Nondisclosure and inconsistency often hurt more than the underlying fact, so omissions should be corrected early. Inquiries must rationally relate to fitness, and an arrest history (and candor about it) can be considered. There's no automatic disqualification rule.", "r": "Outline I-B; [W1:37]"},
{"t": "reg", "q": "A state bar denies admission to an applicant solely because, ten years ago, she was a member of a lawful political organization with radical views. She has no criminal record and answered every question candidly. Is the denial likely to be upheld?", "a": ["No, because admission criteria must rationally relate to fitness, and lawful political membership does not.", "Yes, because the applicant bears the burden of proving good character and the bar may weigh any association.", "Yes, because each state has unreviewable discretion over who may be admitted to its bar.", "No, but only because ten years have passed; a membership within five years could justify denial."], "e": "Schware: a state can require good moral character, but the qualifications must have a rational connection to fitness to practice. Lawful political membership doesn't. The applicant does bear the burden, but the bar can't use irrational criteria.", "r": "Outline I-B; Schware"},
{"t": "reg", "q": "Applicant Diaz was convicted of armed robbery at 19, served his sentence, and over the next twelve years completed college and law school with an exemplary record, worked with a reentry nonprofit, and disclosed everything fully. Applicant Fenn, a former journalist, fabricated sources in dozens of stories and lied to cover it up, then later excelled in law school and did years of public-interest work. Which statement best reflects how character-and-fitness committees have treated such histories?", "a": ["Diaz may be admitted on a showing of rehabilitation; Fenn's pattern of deception can justify denial.", "Both must be denied, because serious past misconduct of any kind is a permanent bar to admission.", "Both must be admitted, because the passage of time and a law degree conclusively establish rehabilitation for any applicant.", "Fenn must be admitted and Diaz denied, because only criminal convictions may be considered."], "e": "Rehabilitation counts: even bank robbers have been admitted. But a history of dishonesty goes to the core of trustworthiness, and Stephen Glass (the fabricating journalist) was denied admission despite later good works. Committees weigh the nature of the conduct, the passage of time, and candor.", "r": "Outline I-B; [W1:22–23]"},
{"t": "reg", "q": "Which of the following applicants is most likely to face a serious character-and-fitness problem, assuming each disclosed the matter fully?", "a": ["One found to have plagiarized a seminar paper during her third year of law school.", "One who has received treatment, and currently takes medication, for depression and anxiety.", "One who received six speeding tickets four years ago and has had none since then.", "One who is a recovering alcoholic with five years of documented and continuous sobriety."], "e": "Plagiarism is dishonesty, which goes to the heart of fitness, and the more recent and mature the applicant (law school being the worst), the heavier it weighs. Responsibly seeking mental-health treatment isn't a ground for denial, documented recovery shows current fitness, and old traffic tickets are minor.", "r": "Outline I-B Problem 3A-2; [S1:32–33]"},
{"t": "reg", "q": "In 1872 the U.S. Supreme Court upheld a state's refusal to admit Myra Bradwell to the bar. Which modern principle does that decision most directly contrast with?", "a": ["Admission criteria must rationally relate to the applicant's fitness to practice.", "Federal courts set their own admission standards under the Supremacy Clause.", "Applicants bear the burden of proving their own good moral character.", "A lawyer admitted in one state is not authorized to practice in another."], "e": "Bradwell v. State upheld excluding a woman from the bar on grounds unrelated to fitness. Today criteria must rationally connect to fitness (Schware), and denying admission because of sex would fail that test and modern equal-protection law.", "r": "Outline I-B; [S1:29]"},
{"t": "reg", "q": "On her character-and-fitness questionnaire, applicant Moore was asked whether she had ever been the subject of a workplace investigation for dishonesty. Two years earlier her employer had investigated, and cleared, her for expense irregularities. Believing that a cleared investigation 'doesn't count,' she answered 'No.' The committee later learns of the investigation. Is Moore at risk under Rule 8.1?", "a": ["Yes, if her answer was a knowing false statement of material fact, and the omission will weigh against her anyway.", "No, because Rule 8.1 applies only to lawyers already admitted, not to applicants for admission.", "No, because an investigation that cleared the applicant is immaterial as a matter of law.", "Yes, automatically, because any inaccurate answer on a bar application violates Rule 8.1 regardless of what the applicant knew."], "e": "Rule 8.1 applies to bar applicants. 8.1(a) prohibits knowingly making a false statement of material fact. A good-faith misunderstanding may not be 'knowing,' but committees treat nondisclosure as a candor problem that often hurts more than the underlying fact. 8.1 isn't strict liability for innocent errors.", "r": "MR 8.1(a); Outline I-B"},
{"t": "reg", "q": "Attorney Grant receives a letter from bar counsel asking him to respond in writing within 20 days to a former client's grievance. Grant considers the grievance frivolous and ignores the letter. Ultimately bar counsel dismisses the grievance on the merits. Is Grant subject to discipline?", "a": ["Yes, because knowingly failing to respond to a lawful demand from a disciplinary authority is itself a violation.", "No, because the grievance was dismissed, so there was no disciplinary matter to which Rule 8.1 applied.", "No, because a lawyer may remain silent in a disciplinary matter under the Fifth Amendment without asserting it.", "Yes, but only if the former client suffered some harm from Grant's delay in responding."], "e": "8.1(b): a lawyer in connection with a disciplinary matter must not knowingly fail to respond to a lawful demand for information. Ignoring the letter is a separate violation even if the underlying grievance fails. The Fifth Amendment can be asserted properly, but it doesn't license silence.", "r": "MR 8.1(b); Outline I-B trap"},
{"t": "reg", "q": "Attorney Sato is a character reference for a former associate's bar application. The admissions committee asks Sato whether the associate ever mishandled client funds. Sato knows of one incident only because the client involved, Sato's current client, confided it to him in confidence while consulting Sato about suing the associate. What may Sato do?", "a": ["Decline to reveal the information protected by Rule 1.6, without making any false statement.", "Reveal the incident, because Rule 8.1 requires full disclosure to admissions authorities despite Rule 1.6.", "State that he knows of no incidents, because a false denial is permitted to protect a client confidence.", "Reveal the incident, because information about another lawyer's misconduct is never confidential."], "e": "Rule 8.1 says it doesn't require disclosure of information otherwise protected by Rule 1.6. Sato may decline to reveal the confidence, but he may not lie (8.1(a), 8.4(c)).", "r": "MR 8.1; Outline I-B"},
{"t": "reg", "q": "Lawyer Aquino is admitted only in Pennsylvania and works in her firm's Philadelphia office. The firm also has an office in Wilmington, Delaware. Aquino begins spending two days a week in the Wilmington office meeting Delaware clients about Delaware real estate matters, and the firm lists her on its Wilmington letterhead without limitation. No Delaware exception applies. Is this proper?", "a": ["No, because she has a systematic and continuous presence in Delaware and holds herself out as admitted there.", "Yes, because the firm is licensed in Delaware through its Delaware-admitted lawyers, who supervise her.", "Yes, because temporary practice is permitted for any lawyer in good standing in another jurisdiction.", "Yes, so long as a Delaware-admitted partner in the firm reviews and approves all of her work before it is sent to Delaware clients."], "e": "There's no national license, and colleagues' admissions don't license an unadmitted lawyer. Rule 5.5(b) bars a systematic and continuous presence, and holding out as admitted, where the lawyer isn't admitted. Regular weekly practice from a Delaware office isn't 'temporary' under 5.5(c).", "r": "MR 5.5(a)–(b); Outline I-C; [S1:30]"},
{"t": "reg", "q": "Lawyer Brandt, admitted only in Ohio, represents an Ohio company in a contract arbitration. The arbitration is seated in Indiana under an arbitration clause and arises out of Brandt's Ohio practice for the company. Arbitration rules don't require pro hac vice admission. Brandt travels to Indiana for a three-day hearing. Is Brandt engaged in the unauthorized practice of law in Indiana?", "a": ["No, because temporary ADR work arising out of the lawyer's home-state practice is permitted.", "Yes, because a lawyer must be admitted in any state where a contested hearing takes place.", "Yes, unless Brandt associates with an Indiana lawyer who actively participates in the hearing.", "No, because representing a client in an arbitration is not the practice of law."], "e": "Rule 5.5(c)(3) permits temporary practice in or reasonably related to an arbitration or other ADR proceeding if the services arise out of or are reasonably related to the lawyer's home practice and pro hac vice isn't required. Association with local counsel is a separate route, 5.5(c)(1), not a requirement. Advocacy in arbitration is law practice.", "r": "MR 5.5(c)(3); Outline I-C"},
{"t": "reg", "q": "Lawyer Ito is admitted only in New York. A long-time New York client asks her to fly to Colorado for two weeks to help negotiate the purchase of a Colorado ski business. No litigation is pending or expected. Ito does not associate with Colorado counsel. Under the Model Rules, may Ito do this work?", "a": ["Yes, because temporary services reasonably related to her home-state practice are permitted.", "No, because temporary practice requires association with a local lawyer who actively participates.", "No, because temporary practice is limited to matters involving a pending or anticipated proceeding.", "Yes, but only after the Colorado Supreme Court grants her pro hac vice admission for the deal."], "e": "Rule 5.5(c)(4) is a catch-all for temporary services that arise out of or are reasonably related to the lawyer's practice where she's admitted, such as a long-time client's transaction. The other paragraphs (local association, pending proceedings, ADR) are alternatives, not requirements. Pro hac vice applies to tribunals, not deals.", "r": "MR 5.5(c)(4); Outline I-C"},
{"t": "reg", "q": "Lawyers Perez and Webb, admitted only in State A, file a negligence action in State A state court. The defendant removes the case to the federal district court for the District of State A. That court admits lawyers who are admitted in State A, but neither Perez nor Webb has applied. They keep litigating, serving interrogatories and noticing depositions. What is the best description of their situation?", "a": ["They need admission to the federal court or pro hac vice, because each federal court sets its own bar.", "Nothing further, because state admission automatically authorizes practice in every federal court there.", "They must withdraw, because lawyers admitted only in state court may never litigate a removed case.", "Nothing further, because serving discovery is not practice before the court in which the case is pending."], "e": "Under the Supremacy Clause, each federal court decides who may practice before it, and admission is separate. Many districts admit any lawyer admitted in the forum state, but the lawyer must still be admitted (or appear pro hac vice). Serving discovery in a pending federal case is practice in that case.", "r": "Outline I-C; [W1:26, 46; S1:38–39]"},
{"t": "reg", "q": "Lawyer Odum is admitted in Texas and has never been admitted in Louisiana. She wishes to argue an appeal in the U.S. Court of Appeals for the Fifth Circuit, which sits in New Orleans. Which statement is most accurate?", "a": ["She may seek admission to the Fifth Circuit, because courts of appeals admit lawyers admitted in any state.", "She must first be admitted in Louisiana, because federal courts admit only lawyers who are admitted in the state where the court sits.", "She must be admitted in every state within the circuit before she may argue in the Fifth Circuit.", "She needs no admission at all, because her Texas license authorizes practice in all federal courts."], "e": "Federal courts set their own bars. Many district courts admit lawyers admitted in the forum state, while some districts, and all federal courts of appeals, admit lawyers admitted in any state who otherwise qualify. Admission to that court is still required.", "r": "Outline I-C; [S1:38]"},
{"t": "reg", "q": "An Assistant U.S. Attorney admitted in Virginia prosecutes a case in federal court in Maryland. Maryland's ethics rule on contacts with represented persons is stricter than Virginia's. Which statement best reflects federal law on her ethical obligations?", "a": ["She is subject to the ethics rules of the state where she engages in her duties, like other lawyers there.", "Federal prosecutors are exempt from state ethics rules under the Supremacy Clause when they appear in federal court.", "She is subject only to Virginia's rules, because Virginia is her state of admission.", "She is subject only to the ethics regulations issued by the Department of Justice."], "e": "28 U.S.C. § 530B (the McDade Amendment) makes government attorneys subject to state laws and rules governing attorneys in each state where they engage in their duties. Federal employment doesn't exempt them, and courts expect heightened candor and civility from government lawyers.", "r": "Outline I-C; [W1:26–27]"},
{"t": "reg", "q": "Lawyer Han is admitted in both State A and State B. While on vacation in State C, where she is not admitted, she converts a client's funds. Where is Han subject to discipline?", "a": ["In both States A and B, and possibly in State C if she provided legal services there.", "Only in State C, because that is where the misconduct occurred.", "Only in the state where she primarily practices, because a lawyer may be disciplined in only one jurisdiction for the same conduct.", "Nowhere, because the conduct occurred outside every state where she is admitted."], "e": "8.5(a): a lawyer admitted in a jurisdiction is subject to its disciplinary authority regardless of where the conduct occurs. A lawyer not admitted is subject to discipline where she provides or offers legal services. Both admitting states can discipline her for the same conduct, and most impose reciprocal discipline.", "r": "MR 8.5(a); Outline I-C"},
{"t": "reg", "q": "Lawyer Cole, admitted in States X and Y, is suspended for six months by State X. State Y has a reciprocal-discipline rule. Which is most accurate?", "a": ["The suspension has no automatic effect in State Y, which will likely impose reciprocal discipline.", "Cole is automatically suspended in State Y under the Full Faith and Credit Clause.", "State Y may not discipline Cole, because double jeopardy bars a second sanction.", "State Y must impose a harsher sanction in order to deter forum shopping by lawyers."], "e": "One state's discipline doesn't automatically operate in another. But most states have reciprocal-discipline procedures that typically impose the same sanction after notice and an opportunity to be heard. Double jeopardy doesn't apply to disciplinary proceedings, which protect the public.", "r": "MR 8.5(a); Outline I-C; [W1:29]"},
{"t": "reg", "q": "Lawyer Tran, admitted in States A and B, appears in a trial in a State B state court. State A and State B have different rules about a lawyer's trial conduct. A disciplinary complaint is filed in State A about Tran's trial conduct. Which jurisdiction's rules will State A apply?", "a": ["State B's rules, because conduct before a tribunal is governed by the rules of the tribunal's jurisdiction.", "State A's rules, because a disciplinary authority always applies its own jurisdiction's rules.", "Whichever state's rules are more protective of the client whose matter was being tried.", "State A's rules, unless Tran's principal office is located in State B."], "e": "8.5(b)(1): for conduct in connection with a matter pending before a tribunal, apply the rules of the jurisdiction where the tribunal sits, unless the tribunal's rules provide otherwise. State A can impose discipline while applying State B's substantive rule.", "r": "MR 8.5(b)(1); Outline I-C"},
{"t": "reg", "q": "Lawyer Kaur, admitted in States A and B, negotiates a contract from her State A office for a client whose operations are entirely in State B. She reasonably believes the predominant effect of her conduct will be in State B and conforms to State B's rules, which permit what she did. State A's rules forbid it. A State A tribunal later concludes the predominant effect was actually in State A. Is Kaur subject to discipline in State A?", "a": ["No, because her conduct conformed to the rules where she reasonably believed the predominant effect would be.", "Yes, because the tribunal found the predominant effect was in State A, so State A's rules govern.", "Yes, because for conduct not before a tribunal, the rules of the state where the lawyer's office is located always apply.", "No, because a lawyer admitted in two states may always follow the more permissive state's rule."], "e": "8.5(b)(2): for other conduct, apply the rules where the conduct occurred, or where its predominant effect is if that's elsewhere. The safe harbor protects a lawyer whose conduct conforms to the rules of a jurisdiction where she reasonably believes the predominant effect will occur, even if that belief later proves wrong. There's no general 'choose the more permissive rule' option.", "r": "MR 8.5(b)(2); Outline I-C"},
{"t": "reg", "q": "Attorney Lowe represents a plaintiff suing a company that has its own lawyer. Lowe hires a private investigator and instructs her to pose as a customer, call the company's general manager, and get him to talk about the incident. Lowe never speaks with the manager himself. Is Lowe subject to discipline?", "a": ["Yes, because a lawyer may not violate the Rules through the acts of another.", "No, because Lowe personally never communicated with the represented company.", "No, because Rule 4.2 governs only communications made by lawyers themselves.", "Yes, but only if the investigator is also a member of the bar."], "e": "Rule 8.4(a) makes it misconduct to violate the Rules 'through the acts of another.' Lowe couldn't contact a represented organization's managing agent about the matter himself (4.2), so he can't do it through an investigator. Rule 5.3 also makes him responsible for a nonlawyer's conduct that he orders.", "r": "MR 8.4(a), 4.2, 5.3(c); Outline I-D"},
{"t": "reg", "q": "Attorney Voss falsely claimed a large home-office deduction on his personal tax return for three years. He was never charged with a crime, and the IRS resolved the matter civilly. Bar counsel learns of it. Is Voss subject to discipline?", "a": ["Yes, because it is a criminal act reflecting on honesty, no conviction is needed, and it is dishonest conduct.", "No, because the conduct was unrelated to the practice of law and involved no client, so it is outside the Rules.", "No, because Rule 8.4(b) applies only after a lawyer has been convicted of a crime.", "Yes, but only if a client was harmed by Voss's tax conduct."], "e": "8.4(b) reaches criminal acts that reflect adversely on honesty, trustworthiness, or fitness, whether or not the lawyer was charged or convicted. 8.4(c) reaches dishonesty even off duty. Tax evasion is a classic example. No client harm is needed.", "r": "MR 8.4(b)–(c); Outline I-D; [W1:27]"},
{"t": "reg", "q": "Attorney Park is arrested during a peaceful sit-in protest and pleads guilty to misdemeanor trespass. She has no other record. Is Park likely subject to discipline under Rule 8.4(b)?", "a": ["Probably not, because a minor civil-disobedience offense usually does not reflect on fitness to practice.", "Yes, because any criminal conviction, however minor, automatically constitutes professional misconduct under Rule 8.4(b).", "Yes, because lawyers owe a special professional duty never to violate any law at all.", "No, because only felony convictions can ever support discipline under Rule 8.4(b)."], "e": "Comment [2] to 8.4: although a lawyer is personally answerable to the entire criminal law, a lawyer should be professionally answerable only for offenses showing characteristics relevant to law practice, such as dishonesty, breach of trust, violence, or serious interference with justice. A petty trespass in civil disobedience usually doesn't qualify. 8.4(b) isn't limited to felonies.", "r": "MR 8.4(b) cmt [2]; Outline I-D"},
{"t": "reg", "q": "Trying to win a zoning client, Lawyer Fisk says: 'I play golf every week with two members of the zoning board. Hire me and I can get this through without the usual hearings.' Fisk has no such ability and never contacts any board member. Is Fisk subject to discipline?", "a": ["Yes, because stating or implying an ability to improperly influence officials is misconduct by itself.", "No, because the statement was mere puffery and Fisk never tried to influence any official.", "No, because Rule 8.4(e) applies only if the lawyer actually influences a public official.", "Yes, but only if the prospective client hired Fisk in reliance on the statement."], "e": "8.4(e) prohibits stating or implying an ability to influence improperly a government agency or official. The statement alone is enough. The statement also implicates 8.4(c) (misrepresentation).", "r": "MR 8.4(e); Outline I-D"},
{"t": "reg", "q": "At a firm recruiting dinner, managing partner Ames repeatedly makes demeaning comments about an associate's national origin. Ames argues that Rule 8.4(g) does not apply because no client or court was involved. Is Ames correct?", "a": ["No, because Rule 8.4(g) reaches conduct related to law practice, including managing a firm.", "Yes, because Rule 8.4(g) applies only to conduct in court or in dealing with clients.", "Yes, because Rule 8.4(g) applies only to conduct the lawyer actually knows is harassment.", "No, because Rule 8.4(g) reaches all of a lawyer's conduct, whether or not related to practice."], "e": "8.4(g) covers conduct the lawyer knows or reasonably should know is harassment or discrimination on listed bases, in conduct related to the practice of law, including managing a firm and work-related social activities. It doesn't reach purely private conduct unconnected to practice, and it doesn't limit 1.16 decisions or legitimate advocacy. Delaware hasn't adopted (g), but the MPRE tests the ABA text.", "r": "MR 8.4(g) & cmts; Outline I-D; [S1:34, 37]"},
{"t": "reg", "q": "Lawyer Quinn declines to represent a prospective client in a civil matter. Quinn's reason is that he limits his practice to representing employers, and the prospective client is an employee. The prospective client claims that the refusal violates Rule 8.4(g). Is Quinn subject to discipline?", "a": ["No, because Rule 8.4(g) does not limit a lawyer's ability to accept or decline a representation.", "Yes, because refusing to represent an entire class of persons, such as employees, is discrimination under Rule 8.4(g).", "Yes, unless Quinn first refers the prospective client to another qualified lawyer.", "No, because Rule 8.4(g) applies only to lawyers employed by government agencies."], "e": "8.4(g) expressly says it doesn't limit the ability to accept, decline, or withdraw from a representation under Rule 1.16, and it doesn't preclude legitimate advice or advocacy. Limiting a practice to one side isn't discrimination on a protected basis.", "r": "MR 8.4(g); Outline I-D; [S1:37]"},
{"t": "reg", "q": "A former client files a bar complaint against Lawyer Moss that turns out to be unfounded. Moss sues the client for defamation based on statements in the complaint. Bar counsel's investigation is ongoing, and Moss refuses to produce requested records until the defamation suit is resolved. Which statement is most accurate?", "a": ["The complaint is privileged, so the suit will likely fail, and Moss must cooperate subject to proper privileges.", "The suit will likely succeed if the complaint was unfounded, and Moss may stay the investigation until then.", "Moss may refuse to cooperate, because investigations are voluntary until probable cause is found.", "The complaint is privileged, but Moss may refuse to cooperate because lawyers have an absolute right of silence."], "e": "Disciplinary complaints are generally privileged (complainants are immune from defamation suits), so people aren't deterred from reporting. Lawyers must cooperate with investigations (8.1(b)), subject to properly asserted constitutional privileges such as the Fifth Amendment (Spevack). Due process applies at the hearing stage (Ruffalo).", "r": "Outline I-D; [W1:27–29]"},
{"t": "reg", "q": "Lawyer Barrow argues at his disciplinary hearing that suspension is excessive because the client he neglected has already been fully compensated by Barrow's malpractice insurer. Which response best states the purpose of lawyer discipline?", "a": ["Discipline protects the public and the profession, so compensation does not eliminate the need for a sanction.", "Discipline exists to compensate injured clients, so full compensation by the insurer ends the matter.", "Discipline is punitive, so the sanction should increase to offset the insurer's payment.", "Discipline may be imposed only if the client remains uncompensated after all civil remedies have been exhausted."], "e": "Disciplinary sanctions (private or public reprimand, suspension, disbarment) protect the public and aren't intended as punishment or compensation. Compensation comes through civil remedies. Restitution may accompany a sanction but doesn't substitute for one.", "r": "Outline I-D, I-G"},
{"t": "reg", "q": "Lawyer Tate missed the deadline to file a client's breach-of-warranty suit. In the malpractice action, the client proves the underlying claim was strong and would have produced a $200,000 judgment. Tate proves the underlying defendant has been judgment-proof and insolvent at all relevant times. What will most likely happen?", "a": ["Little or nothing, because she must prove what she would have recovered and actually collected.", "$200,000, because a lost claim is valued at its judgment value regardless of collectibility.", "$200,000 plus emotional-distress damages, because missing a deadline is gross negligence.", "Nothing, because a missed deadline is a disciplinary matter that cannot support a civil claim."], "e": "Professional negligence needs duty, breach, actual and proximate cause, and economic damages. The 'case within a case' requires proving the result that would have been obtained and collected but for the error. A judgment against an insolvent defendant has little value. Emotional-distress damages are almost never recoverable.", "r": "Outline I-E, V-C; [S1:40; S2:15]"},
{"t": "reg", "q": "While representing a seller, Lawyer Grove secretly accepted a $10,000 'finder's fee' from the buyer for steering the deal to that buyer. The sale price was fair, and the seller lost nothing. When the seller learns of it, what is the seller's best civil claim and remedy?", "a": ["Breach of fiduciary duty (loyalty), with disgorgement and possible fee forfeiture, even without proof of loss.", "Professional negligence, with no recovery because the seller suffered no economic loss from the sale.", "Malicious prosecution, with damages equal to the amount of the secret finder's fee.", "No claim, because the fair sale price shows the lawyer fully performed and the seller received exactly what she bargained for."], "e": "Fiduciary claims for disloyalty don't require negligence or loss. A fiduciary may not profit from the position beyond agreed compensation. Remedies include disgorgement of the secret profit and forfeiture of fees, and punitive damages are possible if intentional. Negligence would fail for lack of damages.", "r": "Outline I-E, IV-B; [S1:41; W1:30–32]"},
{"t": "reg", "q": "Hoping to land a nervous client, Lawyer Jessup wrote in his engagement letter: 'I guarantee that you will recover at least $100,000.' He handled the case competently, but the jury awarded $40,000. The client sues. On which theory does the client have the strongest claim?", "a": ["Breach of contract, because an express guarantee can create liability even without negligence.", "Professional negligence, because failing to reach a promised result breaches the standard of care.", "Breach of fiduciary duty, because guarantees are void as against public policy and therefore disloyal.", "None, because a lawyer's promise about results is unenforceable puffery as a matter of law."], "e": "Most engagements are contracts, and an express guarantee can create contract liability without negligence (compare Hawkins v. McGee, the 'hairy hand' case). Losing isn't negligence. The lesson is never to promise results, and to correct unrealistic expectations rather than let silence look like a guarantee.", "r": "Outline I-E, V-C; [S1:42]"},
{"t": "reg", "q": "Lawyer Penn represents a creditor whose $5,000 invoice is disputed. To pressure the debtor to pay, Penn records a lis pendens against the debtor's unrelated vacation home, knowing the creditor has no claim to the property. Which civil claim may the debtor most clearly assert against Penn?", "a": ["Abuse of process, because Penn used legal process for an ulterior purpose through an improper act.", "Malicious prosecution, because the underlying debt claim was disputed by the debtor and so lacked any probable cause.", "Professional negligence, because Penn owed the debtor a duty of reasonable care.", "Breach of fiduciary duty, because Penn's conduct was disloyal toward the debtor."], "e": "Abuse of process requires an ulterior purpose plus a willful act in using process that is improper in the regular conduct of the proceeding, such as an unfounded lis pendens used as leverage. Malicious prosecution requires a proceeding without probable cause, terminated in the plaintiff's favor. Penn owed the debtor no duty of care or loyalty.", "r": "Outline I-E; [S1:43]"},
{"t": "reg", "q": "Lawyer Ward, angry at a business rival of his client, filed a fraud suit against the rival that Ward knew had no factual basis, intending to bankrupt the rival with defense costs. The court granted summary judgment for the rival on the merits. The rival now sues Ward. Which elements must the rival establish for malicious prosecution?", "a": ["A proceeding begun without probable cause, for a primarily improper purpose, ended in his favor, causing damages.", "A duty of care owed to the rival, a breach of that duty, and resulting economic loss.", "Only that the suit was later dismissed, regardless of whether probable cause existed.", "An ulterior purpose and a single improper act in using process, with no need to show that the suit ended in his favor."], "e": "Malicious prosecution: (1) the proceeding was begun (in some states, continued) (2) by or with the help of the defendant (3) without probable cause (4) with a primarily malicious purpose, (5) terminated on the merits in the plaintiff's favor, (6) causing damages. The second option describes negligence, and the last describes abuse of process.", "r": "Outline I-E; [S1:43]"},
{"t": "reg", "q": "Lawyer Mia Lee represents the plaintiff in a products case. Her father, Lawyer Sam Lee, appears for the defendant. Neither client has been told of the relationship, and neither lawyer has obtained consent. The defendant moves to disqualify. What is the court most likely to do?", "a": ["Disqualify one or both, because each has a personal-interest conflict needing consent, and no harm is required.", "Deny the motion, because family ties between opposing counsel are irrelevant to conflicts.", "Deny the motion, because disqualification requires proof that one of the lawyers actually misused a client's confidences.", "Recuse itself, because the conflict belongs to the court rather than to the lawyers."], "e": "Lawyers closely related by blood or marriage ordinarily may not represent directly adverse clients in the same matter without each client's informed consent (1.7(a)(2), cmt [11]). Disqualification is prophylactic: the opportunity and temptation to act adversely is enough, and no harm need be shown.", "r": "MR 1.7 cmt [11]; Outline I-E; [S1:44, 106–107]"},
{"t": "reg", "q": "An assistant district attorney is assigned to defend a conviction on appeal. She concludes the defendant is probably innocent. Instead of raising the issue with her office, she secretly sends her research to defense counsel and coaches them on arguments. Which statement is most accurate?", "a": ["She breached her duty of loyalty to her client, the office; she should have raised it internally or withdrawn.", "She committed no breach, because a prosecutor's only duty is to do justice, which she pursued.", "She committed no breach, because government lawyers owe no fiduciary duties to the agencies that employ them.", "She breached only the duty of care, because the defense might not have used her research."], "e": "A government lawyer's client is the agency. Secretly aiding the adversary is disloyal however just the motive. The ethical path is to raise concerns, seek reassignment, or withdraw or quit. Prosecutors also have special duties regarding evidence of innocence, which she could pursue openly.", "r": "Outline I-E; [S1:96–98]"},
{"t": "reg", "q": "A firm represented a client while a partner held an undisclosed ownership interest in the client's adversary. The work was competent, and the client lost nothing. The client refuses to pay the remaining $80,000 in fees and demands return of $120,000 already paid. What is the most likely result in many jurisdictions?", "a": ["The serious fiduciary breach may bar unpaid fees and require disgorgement of fees paid, even without loss.", "The firm recovers all fees, because the client cannot show any damages from the conflict.", "The firm recovers all fees, and the conflict matters only for the partner's discipline.", "The client recovers the $120,000 only if she proves that conflict-free counsel would have obtained a better result for her."], "e": "Many jurisdictions hold that fees earned while under a significant conflict or other serious fiduciary breach were not properly earned. The breach is a defense to collection and can support restitutionary disgorgement of fees paid, without proof of harm. Fee disputes also arise from inefficiency, overstaffing, unnecessary work, or work the client forbade.", "r": "Outline I-E fee consequences; [W1:33–34]"},
{"t": "reg", "q": "A pro se plaintiff with no legal training files a federal complaint against his neighbor alleging that her backyard gardening violates his constitutional rights. He has no factual or legal basis and admits he sued 'to make her spend money.' After repeated warnings, the court dismisses. May the court sanction him under Rule 11?", "a": ["Yes, because Rule 11's certification duties apply to unrepresented parties who sign filings.", "No, because Rule 11 applies only to members of the bar who sign filings.", "No, because the only remedy against a non-lawyer is a separate malicious prosecution suit.", "Yes, but only under the court's inherent power, because Rule 11 by its terms reaches only attorneys who sign filings."], "e": "A pro se party who signs a pleading certifies under FRCP 11(b) that it isn't presented for an improper purpose and has evidentiary and legal support. Sanctions may be imposed on motion or on the court's own initiative and may include nonmonetary directives, a penalty paid into court, or fees. Rule 11 isn't limited to lawyers, though a filing pro se litigant isn't engaged in UPL.", "r": "FRCP 11; Outline I-F; [S1:108–110]"},
{"t": "reg", "q": "Associate Diallo signed and filed a brief prepared under a partner's direction that cited a statute that had been repealed two years earlier. Neither checked. The court imposes a Rule 11 monetary sanction. Who is likely responsible?", "a": ["Diallo as signer, and the firm, which is jointly responsible absent exceptional circumstances.", "Only the partner, because associates acting under direction are never sanctioned.", "Only the firm, because Rule 11 sanctions may not be imposed on individual lawyers who sign under a partner's direction.", "No one, because citing a repealed statute is an honest mistake outside Rule 11."], "e": "Rule 11(b) requires a reasonable inquiry into the law. Sanctions may be imposed on the attorney, law firm, or party responsible, and the firm must be held jointly responsible absent exceptional circumstances. Acting under a partner's direction is no defense (compare 5.2(a)).", "r": "FRCP 11(c)(1); Outline I-F"},
{"t": "reg", "q": "Reviewing a client's documents before production, Lawyer Ortiz finds a non-privileged internal memo that is responsive to a pending request and damaging to the client. He leaves it out of the production. The client mentions the memo at her deposition, and the opponent moves to compel. What is the most likely consequence for Ortiz?", "a": ["Discovery sanctions against Ortiz and possibly the client, plus exposure to discipline.", "An award of malpractice damages payable by Ortiz to opposing counsel.", "Disqualification of the opposing party's counsel for overreaching.", "No consequence, because a lawyer has no duty to produce documents that would hurt his own client's position."], "e": "FRCP 26(g) and 37 authorize sanctions for improper discovery responses and failures to produce, ranging from compensatory fees up to terminating sanctions. Withholding responsive non-privileged evidence also violates 3.4(a) and (d). Ortiz owes no malpractice duty to opposing counsel.", "r": "FRCP 26(g), 37; MR 3.4; Outline I-F; [S1:111–113]"},
{"t": "reg", "q": "Over eighteen months, Lawyer Vance filed six motions to reconsider the same ruling, each repeating arguments the court had rejected, and noticed duplicative depositions. The opposing party moves for an award of the excess fees caused by this conduct. Which statute most directly authorizes the award against Vance personally?", "a": ["28 U.S.C. § 1927, which reaches attorneys who unreasonably and vexatiously multiply proceedings.", "FRCP 60(b), which permits a court to grant relief from a final judgment or order.", "28 U.S.C. § 530B, which subjects government attorneys to state ethics rules.", "FRCP 26(b)(3), which defines attorney work product and the showing needed to obtain it."], "e": "§ 1927 targets attorneys who multiply proceedings 'unreasonably and vexatiously,' allowing an award of the excess costs, expenses, and attorneys' fees reasonably incurred because of that conduct. The other provisions address unrelated subjects.", "r": "28 U.S.C. § 1927; Outline I-F"},
{"t": "reg", "q": "After finding that a party's lawyers engaged in bad-faith discovery abuse, a federal court invokes its inherent power. It orders them to pay every fee the opponent incurred in the entire litigation, including fees the opponent would have incurred anyway, so as to 'send a message.' Is the order proper under Goodyear Tire & Rubber Co. v. Haeger?", "a": ["No, because a civil inherent-power fee sanction must be compensatory and limited to fees the misconduct caused.", "Yes, because the court's inherent power permits any sanction it considers necessary to deter bad-faith litigation conduct.", "Yes, because a finding of bad faith eliminates any causation requirement for fee awards.", "No, because federal courts have no inherent power to sanction the lawyers who appear before them."], "e": "Goodyear held that an inherent-power fee award must be compensatory, covering only the fees the innocent party would not have incurred but for the misconduct. A sanction that goes further is punitive and requires criminal procedural safeguards. Summary contempt in the court's presence is handled under FRCrP 42(b).", "r": "Goodyear v. Haeger; Outline I-F"},
{"t": "reg", "q": "A judge declines to sanction Lawyer Ruskin after he behaved abusively toward opposing counsel during a deposition. A year later, Ruskin notices that referrals from other lawyers have dried up, and two judges now treat his representations with skepticism. These consequences are best described as:", "a": ["Informal consequences, which can rival formal sanctions because referrals and credibility matter.", "Professional discipline, because the loss of referrals is imposed by the organized bar.", "Civil liability, because the lost referrals are damages caused by Ruskin's own conduct.", "Disqualification, because judges may decline to accept his filings in future cases."], "e": "The Taxonomy of Professional Woes includes informal consequences: client termination, lost future business and referrals, lost credibility with judges, and reputational harm. Many referrals come from former adversaries. These are imposed by observers, not by any tribunal.", "r": "Outline I-F, I-G; [S1:47]"},
{"t": "reg", "q": "Client Ames believes Lawyer Bell committed an ethical violation that caused no monetary harm, and she wants Bell 'out of my former business partner's case' against her. Bell had previously represented Ames in a substantially related matter. Which adversary-and-remedy pairing is correct?", "a": ["Ames, as a former client, may move the court to disqualify Bell; no injury need be shown.", "Ames may sue Bell for professional negligence and obtain an injunction removing him from the business partner's case.", "Ames must ask the state bar to disqualify Bell, since only the bar can remove a lawyer.", "Ames may seek a Rule 11 sanction that removes Bell from the pending case."], "e": "Per the Taxonomy of Professional Woes, disqualification is sought by a client or former client from the court where the matter is pending. It's an injunctive order based on a conflict-creating breach of loyalty or confidentiality, and no injury is required. Discipline comes from the bar, negligence requires harm, and Rule 11 addresses filings.", "r": "Outline I-G Taxonomy; [W1:36–38]"},
{"t": "reg", "q": "Which statement best captures a tension built into the Model Rules, as discussed in class?", "a": ["Getting informed consent is hard when confidences must be protected or the client is unsophisticated.", "The Rules apply only to litigators and do not reach transactional lawyers at all.", "The Rules require lawyers to put their duties as officers of the court ahead of every client interest.", "The Rules forbid lawyers to advise clients on moral or other non-legal considerations."], "e": "Class discussion noted that the Rules focus more on litigators than transactional lawyers (though they apply to both), that informed consent can be hard to get while protecting confidences or with unsophisticated clients, and that the advocate and officer-of-the-court roles conflict. Rule 2.1 expressly permits advice on moral, economic, social, and political factors.", "r": "Outline I-A tensions; [S1:26]"},
{"t": "hum", "q": "Associate Reyes learns that the partner she works for, Grant, swore in an affidavit that certain expert notes 'do not exist.' Reyes knows the notes are in a box in Grant's office. She mentions it to Grant once; he waves her off. She does nothing more, and the affidavit is filed. Later the deception is discovered. Is Reyes subject to discipline?", "a": ["Yes, because she is bound by the Rules even at another's direction, and this was no arguable question of duty.", "No, because she acted at the direction of a supervising partner, and Rule 5.2 protects subordinates who follow orders.", "No, because only the lawyer who signed the false affidavit can be disciplined for what it says.", "No, because she raised the problem with the partner once, which fully satisfied any duty she had."], "e": "Rule 5.2(a) binds a subordinate even when she acts at another's direction. The 5.2(b) safe harbor covers only a supervisor's reasonable resolution of an arguable question. Concealing evidence and a false affidavit aren't arguable. This tracks Kodak-Berkey: partner Perkins lied, and associate Fortenberry whispered a warning and then did nothing further. Reyes needed to escalate within the firm until the falsehood was corrected (3.3, 3.4(a)).", "r": "MR 5.2; Outline II-A; [S1:57, 67–68]"},
{"t": "hum", "q": "Associate Lin asks her supervising partner whether a document is protected by the work-product doctrine and therefore can be withheld from production. The case law is genuinely divided. After researching, the partner concludes it is protected and tells Lin to withhold it. Lin does so. The court later rules the document is not protected and orders production. Has Lin violated the Rules?", "a": ["No, because she followed a supervisor's reasonable resolution of an arguable question of professional duty.", "Yes, because the court's later ruling conclusively establishes that withholding the document was improper.", "Yes, because a subordinate lawyer is strictly responsible for every document she personally withholds from production.", "No, because associates are never responsible for discovery decisions made by their supervisors."], "e": "Rule 5.2(b) protects the subordinate when the question is genuinely arguable and the supervisor's resolution is reasonable, even if a tribunal later disagrees. That's why 5.2(b) exists: someone has to decide close calls, and the subordinate may follow a reasonable decision.", "r": "MR 5.2(b); Outline II-A"},
{"t": "hum", "q": "The managing partners of a 40-lawyer firm have never adopted a conflict-checking system or any procedure for monitoring deadlines. No client has yet been harmed, and no lawyer at the firm has yet violated a Rule. Are the managing partners subject to discipline?", "a": ["Yes, because managers must make reasonable efforts to have compliance measures in place, and no harm is required.", "No, because Rule 5.1 is violated only after another lawyer in the firm actually commits a violation of the Rules.", "No, because supervisory duties fall only on lawyers who directly supervise a particular matter.", "Yes, but only if a client complains to the disciplinary authority about the missing systems."], "e": "Rule 5.1(a) imposes an independent duty on partners and managers to make reasonable efforts to ensure the firm has measures (e.g., conflict checks, calendaring) giving reasonable assurance of compliance. Failing to do so is a violation even before anyone else commits a violation or a client is hurt.", "r": "MR 5.1(a); Outline II-A"},
{"t": "hum", "q": "Partner Hale learns on Monday that the associate he supervises has missed a filing deadline and plans to tell the client the court 'lost' the filing. The client meeting is Wednesday. Hale does nothing, and the associate lies to the client. Is Hale responsible for the associate's violation?", "a": ["Yes, because he knew in time to avoid or mitigate the consequences and took no reasonable remedial action.", "No, because Hale neither ordered the lie nor ratified it after learning that it had been told.", "No, because responsibility for another lawyer's misconduct requires actual participation in it.", "Yes, because supervisors are vicariously responsible for every violation a subordinate commits, whether or not they knew."], "e": "Under 5.1(c)(2), a partner, manager, or direct supervisor is responsible for another lawyer's violation if he knows of the conduct at a time when its consequences can be avoided or mitigated and fails to take reasonable remedial action. Ordering or ratifying is the separate 5.1(c)(1) route. This isn't respondeat superior: responsibility requires the knowledge-plus-inaction (or ordering/ratifying) predicate.", "r": "MR 5.1(c)(2); Outline II-A"},
{"t": "hum", "q": "An associate at Partner Ruiz's firm forged a client's signature on a verification without Ruiz's knowledge. The firm had reasonable training and review procedures. Ruiz learns of the forgery months later, after the case is over and nothing can be undone. Ruiz immediately reports it to firm management. Is Ruiz subject to discipline for the associate's forgery?", "a": ["No, because she neither ordered nor ratified it, reasonable measures existed, and she learned too late to mitigate.", "Yes, because partners are responsible for all misconduct committed by associates in their firm.", "Yes, because Ruiz failed to prevent the forgery, and partners guarantee the integrity of firm filings.", "No, because Rule 5.1 applies only to a lawyer's direct supervisor, never to other partners in the firm."], "e": "Supervisory responsibility under 5.1 isn't respondeat superior. With reasonable firm-wide measures (5.1(a)), no ordering or ratification (5.1(c)(1)), and no knowledge in time to mitigate (5.1(c)(2)), Ruiz isn't responsible. She may have a separate 8.3 reporting duty because forgery raises a substantial question about honesty.", "r": "MR 5.1; Outline II-A"},
{"t": "hum", "q": "Solo practitioner Okafor uses an offshore vendor to do document review and a cloud service to store client files. He never checks the vendor's confidentiality practices or the cloud provider's security. A vendor employee leaks a client's trade secrets. Is Okafor subject to discipline?", "a": ["Yes, because he must make reasonable efforts to ensure that outside vendors' conduct fits his professional duties.", "No, because the vendor is an independent contractor rather than an employee of the firm.", "No, because Rule 5.3 covers only nonlawyers who physically work inside the lawyer's own office.", "No, because the leak was a third party's intentional act that Okafor neither knew about nor could have prevented."], "e": "Rule 5.3 extends supervisory duties to nonlawyers 'employed or retained by or associated with' the lawyer, including outsourced vendors and cloud services. The lawyer must choose them carefully, instruct them, and monitor them. Rule 1.6(c) independently requires reasonable efforts to prevent unauthorized disclosure.", "r": "MR 5.3, 1.6(c); Outline II-A"},
{"t": "hum", "q": "Paralegal Dobbs, at her supervising lawyer's instruction, calls a represented opposing party directly to 'get his side of the story.' What is the supervising lawyer's exposure?", "a": ["The lawyer is responsible, because he ordered conduct that would violate the Rules if done by a lawyer.", "None, because the Rules of Professional Conduct govern only lawyers, not paralegals or other staff.", "Only Dobbs is responsible, because she personally made the prohibited call to the opposing party.", "The lawyer is responsible only if the represented opposing party was actually harmed by the contact."], "e": "Rule 5.3(c)(1) makes a lawyer responsible for a nonlawyer's conduct that would violate the Rules if engaged in by a lawyer when the lawyer orders or, with knowledge of the specific conduct, ratifies it. Rule 8.4(a) (violating the Rules through the acts of another) applies too. No harm is required.", "r": "MR 5.3(c)(1), 8.4(a), 4.2; Outline II-A"},
{"t": "hum", "q": "Lawyer Shaw learns, from a conversation with opposing counsel's former paralegal, that opposing counsel Burke has been paying personal expenses from his client trust account for months. Shaw tells Burke's managing partner and does nothing else. In a jurisdiction that has adopted Model Rule 8.3, has Shaw satisfied her obligations?", "a": ["No, because she must report to the appropriate professional authority; telling his firm is not enough.", "Yes, because informing the wrongdoer's managing partner satisfies the reporting duty under Rule 8.3.", "Yes, because Rule 8.3 applies only to violations that the reporting lawyer personally observed.", "No, because Rule 8.3 also requires Shaw to bring a civil action against Burke on behalf of his clients."], "e": "8.3(a) requires reporting to the 'appropriate professional authority' (ordinarily the disciplinary agency) when a lawyer knows another lawyer committed a violation raising a substantial question about honesty, trustworthiness, or fitness. Misappropriating trust funds qualifies. Internal reporting doesn't satisfy the duty. Only about half the states have adopted 8.3, but the MPRE tests it.", "r": "MR 8.3(a); Outline II-A; [S1:78]"},
{"t": "hum", "q": "Lawyer Tseng learns that a colleague at another firm once missed a routine deadline for responding to a discovery request, obtained an extension the next day, and no client was harmed. Must Tseng report the colleague to the disciplinary authority?", "a": ["No, because an isolated, promptly cured lapse raises no substantial question about honesty or fitness.", "Yes, because every violation of the Rules known to another lawyer must be reported to the authority.", "Yes, because missed deadlines always reflect adversely on a lawyer's fitness to practice law.", "No, because Rule 8.3 applies only to lawyers who practice together in the same firm."], "e": "8.3(a) isn't triggered by every violation, only one that raises a substantial question about honesty, trustworthiness, or fitness. A single cured calendaring slip doesn't. Theft, fraud, or forgery does.", "r": "MR 8.3(a); Outline II-A"},
{"t": "hum", "q": "A new client tells Lawyer Medina, in confidence, that her previous lawyer stole $40,000 from her settlement. The client does not want the theft reported because she fears publicity. Must Medina report the prior lawyer?", "a": ["No, because Rule 8.3 does not require disclosing Rule 1.6 information, though she should seek consent.", "Yes, because theft by a lawyer must always be reported, however the reporting lawyer learned of it.", "Yes, because the duty to report overrides confidentiality whenever the misconduct involves client funds.", "No, because Rule 8.3 never applies to the former lawyers of the reporting lawyer's own client."], "e": "8.3(c) says the reporting duty doesn't require disclosure of information otherwise protected by 1.6. The theft is confidential information relating to Medina's representation, so she can't report without consent. Comment [2] encourages the lawyer to seek the client's consent where reporting wouldn't substantially prejudice the client.", "r": "MR 8.3(c); Outline II-A"},
{"t": "hum", "q": "Lawyer Kemp volunteers for the state Lawyer Assistance Program. A lawyer participating in the program tells Kemp she has been 'borrowing' from client trust funds to support a gambling habit and is now repaying them. Must Kemp report her?", "a": ["No, because Rule 8.3 does not require disclosing information learned in an approved assistance program.", "Yes, because misappropriation of client funds must always be reported, whatever the source of knowledge.", "Yes, unless the participating lawyer has already fully repaid every client whose funds she took.", "No, because Rule 8.3 applies only to information that a lawyer learns while representing a client."], "e": "8.3(c) exempts information gained while participating in an approved lawyers or judges assistance program. The exemption encourages impaired lawyers to seek help. LAP participation is generally confidential.", "r": "MR 8.3(c); Outline II-A, II-D"},
{"t": "hum", "q": "Lawyer Ford is going through a painful divorce. He is drinking heavily at lunch, missing appointments, and forgetting deadlines. A client asks him to take on a complex new matter with a trial in six weeks. Which statement is correct?", "a": ["Ford must decline if his condition materially impairs his ability to represent the client.", "Ford may accept so long as the client gives informed consent after learning of his personal situation.", "Ford may accept because a lawyer's personal problems are never a basis for declining representation.", "Ford must accept, because refusing work for personal reasons would itself violate the duty of diligence."], "e": "Rule 1.16(a)(2): a lawyer shall not represent a client (or must withdraw) if the lawyer's physical or mental condition materially impairs his ability to represent the client. Client consent doesn't cure it, since the duty of competence can't be waived.", "r": "MR 1.16(a)(2); Outline II-A, IX-A"},
{"t": "hum", "q": "Partner Shore knows that a colleague, Partner Taft, has been coming back from lunch visibly intoxicated and has missed two client meetings. Shore nevertheless assigns Taft a new, time-sensitive matter 'to help his billable hours' and asks associate Pruitt to assist. Taft botches a filing deadline. Which is most accurate?", "a": ["Shore risks Rule 5.1 discipline and the firm faces liability; Pruitt still must protect the client.", "Only Taft faces any consequence, because neither Shore nor Pruitt missed the filing deadline personally.", "Pruitt alone is responsible, because associates on a matter are responsible for calendaring its deadlines.", "No one faces discipline, because a lawyer's impairment is a medical issue that falls outside the Rules."], "e": "Shore, a partner who assigned the matter knowing of Taft's impairment, risks 5.1(a)–(b) violations and possibly 5.1(c)(2) if she knew of a violation in time to mitigate it. The firm is vicariously liable for the malpractice. Pruitt is bound by the Rules (5.2(a)), should escalate concerns, and has no 8.3 duty for LAP information. Taft should have declined (1.16(a)(2)).", "r": "MR 5.1, 5.2, 1.16(a)(2); Outline II Problem 4D-1; [S1:80–81]"},
{"t": "hum", "q": "Associate Nwosu, at his partner's instruction, signs and sends a demand letter falsely claiming that the firm's client holds a patent that has actually expired. The recipient sues Nwosu, the partner, and the firm for fraud. Can Nwosu avoid personal civil liability because he acted at the partner's direction?", "a": ["No, because a lawyer is personally liable for his own torts even at a supervisor's direction.", "Yes, because only the supervisor who gave the instruction can be liable for the resulting fraud.", "Yes, because associates are immune from tort liability for work they perform on the firm's behalf.", "No, but only because associates must carry their own malpractice insurance covering intentional torts."], "e": "Agents are personally liable for their own torts. A supervisor who directs a tort is also liable, and the firm is vicariously liable under respondeat superior. Following orders isn't a defense to discipline (5.2(a)) or to tort liability.", "r": "Outline II-A civil liability"},
{"t": "hum", "q": "After associates leave a firm in large numbers, HR interviews those who remain. Associate Vela has heard a practice-group head make demeaning remarks about colleagues' race, but she says nothing, assuming others have surely mentioned it. She never checks. Which phenomenon best explains her silence?", "a": ["Diffusion of responsibility.", "Cognitive dissonance.", "The power of authority.", "Ethical fading or framing."], "e": "Diffusion of responsibility: when many people could act, each assumes someone else will, so no one does. Cognitive dissonance involves justifying one's own bad act, authority involves deferring to a superior's instruction, and ethical fading involves reframing a choice so its ethical dimension disappears.", "r": "Outline II-B; [S1:116–117]"},
{"t": "hum", "q": "At a firm where 'everyone' bills a minimum of 0.3 hours for any email, new associate Ko initially bills actual time but, after seeing that her timesheets look 'light' compared with her peers', begins to match them. Which psychological pressure best explains the change?", "a": ["Social conformity.", "Diffusion of responsibility.", "Cognitive dissonance.", "The power of authority."], "e": "Social conformity: people adjust their behavior and even their perceptions to match the group (the Asch line experiments). One dissenter can break the spell. Ko is matching her peers, not obeying an instruction or excusing a past act.", "r": "Outline II-B; [S1:56, 69]"},
{"t": "hum", "q": "A senior partner tells associate Sim, 'The client needs this filed today. Just sign the certificate of service saying it went out yesterday. That's how it's done here.' Sim complies despite misgivings. Which classic study best illustrates the pressure Sim experienced?", "a": ["Milgram's obedience studies, in which most subjects gave maximum shocks when told to continue.", "Asch's line studies, in which subjects matched a group's obviously wrong answers about line lengths.", "Studies of diffusion of responsibility among bystanders who each assumed someone else would act.", "Studies of ethical fading in corporate decision-making where the ethics drop out of the frame."], "e": "Milgram showed the power of authority: about 63% of subjects delivered the maximum 'XXX' shock when told the experiment required it, though nearly all had predicted they would refuse. 'That's how it's done here' adds a conformity flavor, but the direct instruction from a superior is the authority dynamic. Following orders doesn't excuse a false certificate (5.2(a), 8.4(c)).", "r": "Outline II-B; [S1:70]"},
