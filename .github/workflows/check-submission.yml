name: Check submission

# Runs on every pull request that adds or changes content (including the ones the
# website's "Share your work" form opens). Posts a safety report as a comment and
# fails if anything must be fixed. Merging is still a human decision.

on:
  pull_request:
    paths: ["content/**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Safety checks
        id: safety
        run: |
          set +e
          node scripts/check-submission.mjs --base "origin/${{ github.base_ref }}" > report.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat report.md

      - name: Site still builds
        run: npm run build

      - name: Post report on the pull request
        if: always()
        continue-on-error: true # read-only token on pull requests from forks
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- submission-safety-report -->';
            const body = `${marker}\n${fs.readFileSync('report.md', 'utf8')}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

      - name: Fail if something must be fixed
        if: steps.safety.outputs.status != '0'
        run: exit 1
