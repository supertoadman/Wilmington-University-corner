<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dean · Bar Success Command Center · Wilmington Law</title>
<link rel="stylesheet" href="/public/shell.css">
<link rel="stylesheet" href="/public/dean.css">
</head>
<body data-portal="dean">
<main>
  <div class="wrap dean" id="dean">

    <div class="page-head no-print">
      <div class="grow">
        <span class="eyebrow" id="eyebrow">Dean's office · Academic success &amp; bar readiness</span>
        <h1>Bar Success Command Center</h1>
        <p class="lede">Where the class stands against the full NCBE bar scope, who needs a conversation this week, and which practice questions are quietly misleading students.</p>
      </div>
    </div>

    <!-- Title block that only appears on paper -->
    <div class="report-head print-only" id="reportHead" aria-hidden="true"></div>

    <div class="controls no-print" id="controls" role="region" aria-label="Report controls">
      <div class="ctl">
        <span class="ctl-label" id="cohortLabel">Class</span>
        <div class="seg" id="cohortSeg" role="group" aria-labelledby="cohortLabel"></div>
      </div>
      <div class="ctl ctl-mask">
        <label class="switch" for="maskSwitch">
          <input type="checkbox" id="maskSwitch" role="switch" checked>
          <span>FERPA Identity Mask</span>
        </label>
        <span class="mask-state badge good" id="maskState" aria-live="polite">Names hidden</span>
      </div>
      <span class="spacer"></span>
      <span class="stamp tiny muted" id="stamp"></span>
      <button class="btn" type="button" id="printBtn" title="Print a clean, one-document Bar Success Report">
        <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M4 6V2h8v4M4 12H2.5V6h11v6H12M4 9.5h8V14H4z"/></svg>
        Print report
      </button>
    </div>
    <p class="sr-only" id="status" role="status" aria-live="polite"></p>

    <div id="app" aria-busy="true">
      <div id="errorBox" hidden></div>

      <section class="kpis" id="kpis" aria-label="Key figures">
        <div class="kpi skeleton" style="min-height:96px"></div><div class="kpi skeleton" style="min-height:96px"></div>
        <div class="kpi skeleton" style="min-height:96px"></div><div class="kpi skeleton" style="min-height:96px"></div>
        <div class="kpi skeleton" style="min-height:96px"></div>
      </section>

      <div class="tabs no-print" id="tabs" role="tablist" aria-label="Command center sections">
        <button class="tab" role="tab" id="tab-readiness" aria-controls="panel-readiness" aria-selected="true" data-tab="readiness">Bar readiness</button>
        <button class="tab" role="tab" id="tab-risk" aria-controls="panel-risk" aria-selected="false" tabindex="-1" data-tab="risk">Student risk <span class="tab-count" id="cnt-risk"></span></button>
        <button class="tab" role="tab" id="tab-audit" aria-controls="panel-audit" aria-selected="false" tabindex="-1" data-tab="audit">Item audit <span class="tab-count" id="cnt-audit"></span></button>
      </div>

      <div class="dean-panel stack" role="tabpanel" id="panel-readiness" aria-labelledby="tab-readiness" tabindex="-1">
        <section class="card" id="matrixCard" aria-labelledby="h-matrix"><div class="skeleton" style="height:340px"></div></section>
        <section class="card" id="retCard" aria-labelledby="h-ret"><div class="skeleton" style="height:420px"></div></section>
      </div>

      <div class="dean-panel stack" role="tabpanel" id="panel-risk" aria-labelledby="tab-risk" tabindex="-1" hidden>
        <section class="card" id="rosterCard" aria-labelledby="h-roster"><div class="skeleton" style="height:420px"></div></section>
      </div>

      <div class="dean-panel stack" role="tabpanel" id="panel-audit" aria-labelledby="tab-audit" tabindex="-1" hidden>
        <div id="standalone"></div>
        <section class="card" id="auditCard" aria-labelledby="h-audit"><div class="skeleton" style="height:420px"></div></section>
        <section class="card" id="resolvedCard" aria-labelledby="h-resolved"></section>
      </div>
    </div>

  </div>
</main>
<script src="/public/shell.js" defer></script>
<script src="/public/dean.js" defer></script>
</body>
</html>
